<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Padrón SARKMED · PuntoBiO</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#ffffff; --panel-2:#fafafa; --border:#e5e7eb; --hover:#f9fafb;
    --text:#0f172a; --muted:#64748b; --dim:#94a3b8;
    /* Colores del logo SarkMED */
    --primary:#f47b20; --primary-2:#d4620f; --primary-soft:#fff6ee; --primary-border:#fbcfa6;
    --azul:#1c75bc; --azul-2:#155a91; --azul-claro:#29abe2; --azul-soft:#eaf4fc; --azul-border:#bcdff5;
    --verde:#16a34a; --rojo-x:#ef4444; --rojo-soft:#fef2f2;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
       background:var(--bg); color:var(--text); font-size:13px;}

  .page-header{padding:22px 32px 14px; background:#fff;}
  .page-title{font-size:22px; font-weight:700; color:var(--azul); letter-spacing:1.5px; margin:0;
              display:flex; align-items:center; gap:10px;}
  .page-title .sep{color:var(--text); font-weight:400;}
  .lg{letter-spacing:.5px;}
  .lg .sar{color:var(--primary);} .lg .k{color:var(--azul-claro);} .lg .med{color:var(--azul);}
  .page-subtitle{color:var(--muted); margin-top:4px; font-size:11.5px; text-transform:uppercase; letter-spacing:.8px;}
  .header-row{display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap;}

  .toolbar{padding:14px 32px; background:#fff; border-top:1px solid var(--border);
           border-bottom:1px solid var(--border); display:flex; gap:12px; align-items:center; flex-wrap:wrap;}
  .buscador{flex:1; min-width:240px; max-width:460px; padding:9px 12px; border:1px solid var(--border);
            border-radius:8px; font-size:13px; font-family:inherit;}
  .buscador:focus{outline:2px solid var(--primary-border); border-color:var(--primary);}
  .contador{font-size:12px; color:var(--muted);}

  .btn{padding:8px 14px; border:1px solid var(--border); background:#fff; border-radius:6px;
       cursor:pointer; font-size:12px; font-weight:600; color:var(--text); font-family:inherit;}
  .btn:hover{background:var(--hover);}
  .btn-primary{background:var(--primary); color:#fff; border-color:var(--primary);}
  .btn-primary:hover{background:var(--primary-2); border-color:var(--primary-2);}
  .btn-rojo{background:var(--rojo-x); color:#fff; border-color:var(--rojo-x);}

  .wrap{padding:18px 32px 100px;}
  .tabla{width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--border); border-radius:8px; overflow:hidden;}
  .tabla th{background:var(--panel-2); text-align:left; font-size:10.5px; text-transform:uppercase;
            letter-spacing:.5px; color:var(--muted); padding:11px 14px; border-bottom:1px solid var(--border); white-space:nowrap;}
  .tabla td{padding:12px 14px; border-bottom:1px solid var(--border); vertical-align:middle;}
  .tabla tr:last-child td{border-bottom:none;}
  .tabla tbody tr:hover{background:var(--primary-soft);}
  .pac-nombre{font-weight:700; font-size:13.5px;}
  .pac-dni{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .celda-dim{color:var(--muted);}
  .acciones{text-align:right; white-space:nowrap;}
  @media (max-width:860px){ .ocultar-chico{display:none;} .wrap{padding:14px 14px 100px;} .toolbar{padding:12px 14px;} .page-header{padding:16px 14px 10px;} }

  .vacio{text-align:center; padding:56px 20px; color:var(--muted); border:1px dashed var(--border);
         border-radius:8px; background:var(--panel-2);}
  .vacio b{display:block; font-size:15px; color:var(--text); margin-bottom:6px;}

  .modal-bg{display:none; position:fixed; inset:0; background:rgba(15,23,42,.45); z-index:100;
            align-items:flex-start; justify-content:center; padding:34px 16px; overflow-y:auto;}
  .modal-bg.activo{display:flex;}
  .modal{background:#fff; border-radius:10px; width:100%; max-width:560px; box-shadow:0 20px 50px rgba(0,0,0,.2);}
  .modal-head{padding:16px 22px; border-bottom:1px solid var(--border); font-size:15px; font-weight:700;}
  .modal-body{padding:18px 22px;}
  .modal-foot{padding:14px 22px; border-top:1px solid var(--border); display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap;}
  .campo{margin-bottom:12px;}
  .campo label{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.5px;
               color:var(--muted); margin-bottom:4px; font-weight:600;}
  .campo input, .campo select, .campo textarea{width:100%; padding:8px 10px; border:1px solid var(--border);
    border-radius:6px; font-size:13px; font-family:inherit; color:var(--text); background:#fff;}
  .campo input:focus, .campo select:focus, .campo textarea:focus{outline:2px solid var(--primary-border); border-color:var(--primary);}
  .mayus{text-transform:uppercase;}
  .fila-2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  @media (max-width:560px){ .fila-2{grid-template-columns:1fr;} }
  .err-box{background:var(--rojo-soft); border:1px solid #fecaca; color:#991b1b; padding:9px 12px;
           border-radius:6px; font-size:12px; margin-bottom:12px;}
  .ficha{display:grid; grid-template-columns:auto 1fr; gap:8px 14px; font-size:13px;}
  .ficha .lbl{color:var(--muted);}

  .toast{position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(20px);
         background:#0f172a; color:#fff; padding:11px 20px; border-radius:8px; font-size:13px;
         opacity:0; pointer-events:none; transition:all .2s; z-index:200;}
  .toast.activo{opacity:1; transform:translateX(-50%) translateY(0);}
  .toast.ok{background:var(--verde);} .toast.err{background:var(--rojo-x);}
</style>
</head>
<body>

<div class="page-header">
  <div class="header-row">
    <div>
      <h1 class="page-title"><span class="lg"><span class="sar">Sar</span><span class="k">K</span><span class="med">MED</span></span> <span class="sep">·</span> PADRÓN</h1>
      <div class="page-subtitle">Pacientes del circuito de valoración muscular</div>
    </div>
    <span class="contador" id="contador"></span>
  </div>
</div>

<div class="toolbar">
  <input type="text" class="buscador" id="buscador" placeholder="Buscar por nombre o DNI…" autocomplete="off" oninput="filtrar(this.value)">
  <span style="flex:1"></span>
  <span id="zona-acciones"></span>
</div>

<div class="wrap" id="wrap"></div>

<!-- ══════════ MODAL: ALTA / EDICIÓN ══════════ -->
<div class="modal-bg" id="modal-editar">
  <div class="modal">
    <div class="modal-head" id="editar-head">Nuevo paciente</div>
    <div class="modal-body">
      <div id="alerta-editar"></div>
      <div class="fila-2">
        <div class="campo">
          <label>Apellido y nombre</label>
          <input type="text" id="f-nombre" class="mayus" autocomplete="off">
        </div>
        <div class="campo">
          <label>DNI</label>
          <input type="text" id="f-dni" inputmode="numeric" autocomplete="off">
        </div>
      </div>
      <div class="fila-2">
        <div class="campo">
          <label>Celular</label>
          <input type="text" id="f-tel" inputmode="numeric" autocomplete="off">
        </div>
        <div class="campo">
          <label>Fecha de nacimiento</label>
          <input type="date" id="f-nac">
        </div>
      </div>
      <div class="fila-2">
        <div class="campo">
          <label>Sexo</label>
          <select id="f-sexo">
            <option value="">—</option>
            <option value="F">Femenino</option>
            <option value="M">Masculino</option>
          </select>
        </div>
        <div class="campo">
          <label>Mail</label>
          <input type="text" id="f-email" autocomplete="off">
        </div>
      </div>
      <div class="campo">
        <label>Ocupación</label>
        <input type="text" id="f-ocupacion" autocomplete="off">
      </div>
      <div class="fila-2">
        <div class="campo">
          <label>Emergencia · teléfono</label>
          <input type="text" id="f-emergencia" inputmode="numeric" autocomplete="off">
        </div>
        <div class="campo">
          <label>Emergencia · nombre</label>
          <input type="text" id="f-emergencia-nombre" class="mayus" autocomplete="off">
        </div>
      </div>
      <div class="campo">
        <label>Observaciones</label>
        <textarea id="f-obs" rows="2"></textarea>
      </div>
    </div>
    <div class="modal-foot" id="editar-foot"></div>
  </div>
</div>

<!-- ══════════ MODAL: FICHA (solo lectura) ══════════ -->
<div class="modal-bg" id="modal-ficha">
  <div class="modal">
    <div class="modal-head">Ficha del paciente</div>
    <div class="modal-body" id="ficha-body"></div>
    <div class="modal-foot" id="ficha-foot"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ════════════════════════════════════════════════════════════════
   SUPABASE
   ════════════════════════════════════════════════════════════════ */
const SUPABASE_URL = 'https://bqpjtoiictnzcasxfucf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_yvuXDxrkRrhXwmZBnE_a_Q_zDBz0iDi';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { lock: (name, acquireTimeout, fn) => fn() } });

/* ════════════════════════════════════════════════════════════════
   ESTADO
   ════════════════════════════════════════════════════════════════ */
let pacientes = [];
let cargando = true;      // true mientras se lee el padrón: la pantalla avisa en vez de mostrar filas a medio dibujar
let filtro = '';
let editando = null;      // paciente en edición, o null si es alta
let miEmail = '';
let accesos = [];

/* ════════════════════════════════════════════════════════════════
   HELPERS
   ════════════════════════════════════════════════════════════════ */
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fechaDeISO(iso){ const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d); }
function edadDe(nac){
  if(!nac) return null;
  const n = fechaDeISO(nac), hoy = new Date();
  let e = hoy.getFullYear() - n.getFullYear();
  const m = hoy.getMonth() - n.getMonth();
  if(m < 0 || (m === 0 && hoy.getDate() < n.getDate())) e--;
  return e;
}
// Normalizadores · la base guarda siempre igual, escriba como escriba cada una:
// nombres en MAYÚSCULA sin espacios de más, DNI y teléfonos solo números, mail en minúscula.
function aMayus(v){ return (v || '').trim().replace(/\s+/g, ' ').toUpperCase(); }
function soloNumeros(v){ return (v || '').replace(/\D/g, ''); }
function aMinus(v){ return (v || '').trim().toLowerCase(); }
function fechaLinda(iso){ return iso ? iso.split('-').reverse().join('/') : '—'; }
function cerrarModal(id){ document.getElementById(id).classList.remove('activo'); }
function toast(msg, tipo){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast activo ' + (tipo || '');
  setTimeout(() => t.classList.remove('activo'), 2800);
}

/* ════════════════════════════════════════════════════════════════
   PERMISOS · viven en la tabla sarkmed_accesos, no acá.
   Quien no gestiona turnos (rol clínico) ve el padrón pero no lo edita.
   ════════════════════════════════════════════════════════════════ */
async function cargarSesionYAccesos(){
  try{
    const { data: { session } } = await sb.auth.getSession();
    miEmail = (session?.user?.email || '').toLowerCase().trim();
  }catch(e){ miEmail = ''; }
  try{
    const { data, error } = await sb
      .from('sarkmed_accesos')
      .select('email, gestiona_turnos')
      .eq('activo', true);
    if(error) throw error;
    accesos = (data || []).map(a => ({ ...a, email: (a.email || '').toLowerCase().trim() }));
  }catch(e){ console.warn('No se pudieron leer los accesos de SarkMED:', e); accesos = []; }
}
function puedeEditar(){
  const mio = accesos.find(a => a.email === miEmail);
  return mio ? !!mio.gestiona_turnos : true;   // sin fila (equipo del centro): puede
}

/* ════════════════════════════════════════════════════════════════
   CARGA · paginada, para que nunca se corte en 1000
   ════════════════════════════════════════════════════════════════ */
async function cargarPacientes(){
  cargando = true;
  const todos = [];
  let desde = 0;
  const paso = 1000;
  while(true){
    const { data, error } = await sb
      .from('pacientes_sarkmed')
      .select('*')
      .eq('activo', true)
      .order('apellido_nombre')
      .order('id')
      .range(desde, desde + paso - 1);
    if(error){ toast('Error al leer el padrón: ' + error.message, 'err'); break; }
    todos.push(...(data || []));
    if(!data || data.length < paso) break;
    desde += paso;
  }
  pacientes = todos;
  cargando = false;
}

/* Botón ↻ Actualizar · vuelve a leer el padrón sin recargar la página */
async function refrescar(){
  if(cargando) return;
  await cargarPacientes();
  render();
  toast('Padrón actualizado', 'ok');
}

/* ════════════════════════════════════════════════════════════════
   RENDER
   ════════════════════════════════════════════════════════════════ */
function listaFiltrada(){
  const q = filtro.trim().toLowerCase();
  if(!q) return pacientes;
  return pacientes.filter(p =>
    (p.apellido_nombre || '').toLowerCase().includes(q) ||
    (p.dni || '').toLowerCase().includes(q)
  );
}

function render(){
  document.getElementById('zona-acciones').innerHTML =
    `<button class="btn" onclick="refrescar()" ${cargando ? 'disabled' : ''} title="Volver a leer el padrón">↻ Actualizar</button>` +
    (puedeEditar()
      ? '<button class="btn btn-primary" style="margin-left:8px" onclick="abrirNuevo()">+ Nuevo paciente</button>'
      : '<span style="font-size:11.5px;color:var(--muted);margin-left:10px">Solo consulta</span>');

  // Mientras se lee, la pantalla lo dice. Antes quedaba un hueco en blanco
  // y el contador mostraba un número de una lista que todavía no estaba dibujada.
  if(cargando){
    document.getElementById('contador').textContent = 'Cargando…';
    document.getElementById('wrap').innerHTML =
      '<div class="vacio"><b>Cargando pacientes…</b>Un segundo.</div>';
    return;
  }

  const lista = listaFiltrada();
  document.getElementById('contador').textContent =
    filtro ? `${lista.length} de ${pacientes.length} pacientes`
           : `${pacientes.length} ${pacientes.length === 1 ? 'paciente' : 'pacientes'}`;

  const wrap = document.getElementById('wrap');

  if(!pacientes.length){
    wrap.innerHTML = `<div class="vacio"><b>Todavía no hay pacientes cargados</b>${
      puedeEditar() ? 'Cargá el primero con el botón de arriba, o directamente al dar un turno en la agenda.' : ''
    }</div>`;
    return;
  }
  if(!lista.length){
    wrap.innerHTML = `<div class="vacio"><b>Sin resultados</b>No hay nadie que coincida con “${esc(filtro)}”.</div>`;
    return;
  }

  wrap.innerHTML = `
    <table class="tabla">
      <thead>
        <tr>
          <th>Paciente</th>
          <th class="ocultar-chico">Edad</th>
          <th class="ocultar-chico">Celular</th>
          <th class="ocultar-chico">Mail</th>
          <th class="ocultar-chico">Ocupación</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        ${lista.map(p => {
          const edad = edadDe(p.fecha_nacimiento);
          return `<tr>
            <td>
              <div class="pac-nombre">${
                (p.apellido_nombre || '').trim()
                  ? esc(p.apellido_nombre)
                  : '<span style="color:var(--rojo-x)">FICHA SIN NOMBRE</span>'
              }</div>
              <div class="pac-dni">DNI ${esc(p.dni || '—')}</div>
            </td>
            <td class="ocultar-chico celda-dim">${edad != null ? edad + ' años' : '—'}</td>
            <td class="ocultar-chico celda-dim">${esc(p.telefono || '—')}</td>
            <td class="ocultar-chico celda-dim">${esc(p.email || '—')}</td>
            <td class="ocultar-chico celda-dim">${esc(p.ocupacion || '—')}</td>
            <td class="acciones">
              <button class="btn" onclick="abrirFicha(${p.id})">Ver</button>
              ${puedeEditar() ? `<button class="btn" onclick="abrirEditar(${p.id})">Editar</button>` : ''}
            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>`;
}

function filtrar(v){ filtro = v || ''; render(); }

/* ════════════════════════════════════════════════════════════════
   FICHA
   ════════════════════════════════════════════════════════════════ */
function abrirFicha(id){
  const p = pacientes.find(x => x.id === id);
  if(!p) return;
  const edad = edadDe(p.fecha_nacimiento);
  document.getElementById('ficha-body').innerHTML = `
    <div class="ficha">
      <div class="lbl">Paciente:</div><div><b>${esc(p.apellido_nombre)}</b></div>
      <div class="lbl">DNI:</div><div>${esc(p.dni)}</div>
      <div class="lbl">Edad:</div><div>${edad != null ? edad + ' años' : '—'}</div>
      <div class="lbl">Nacimiento:</div><div>${fechaLinda(p.fecha_nacimiento)}</div>
      <div class="lbl">Sexo:</div><div>${p.sexo === 'F' ? 'Femenino' : (p.sexo === 'M' ? 'Masculino' : '—')}</div>
      <div class="lbl">Celular:</div><div>${esc(p.telefono || '—')}</div>
      <div class="lbl">Mail:</div><div>${esc(p.email || '—')}</div>
      <div class="lbl">Ocupación:</div><div>${esc(p.ocupacion || '—')}</div>
      <div class="lbl">Emergencia:</div><div>${esc(p.contacto_emergencia || '—')}${p.contacto_emergencia_nombre ? ' · ' + esc(p.contacto_emergencia_nombre) : ''}</div>
      ${p.observaciones ? `<div class="lbl">Obs.:</div><div>${esc(p.observaciones)}</div>` : ''}
    </div>`;
  const btns = [];
  if(p.telefono){
    const tel = String(p.telefono).replace(/\D/g, '');
    btns.push(`<a class="btn" style="text-decoration:none;display:inline-block;" target="_blank" href="https://wa.me/54${tel}">WhatsApp</a>`);
  }
  if(puedeEditar()) btns.push(`<button class="btn" onclick="cerrarModal('modal-ficha'); abrirEditar(${p.id})">Editar</button>`);
  btns.push(`<button class="btn" onclick="cerrarModal('modal-ficha')">Cerrar</button>`);
  document.getElementById('ficha-foot').innerHTML = btns.join('');
  document.getElementById('modal-ficha').classList.add('activo');
}

/* ════════════════════════════════════════════════════════════════
   ALTA Y EDICIÓN
   ════════════════════════════════════════════════════════════════ */
function limpiarForm(){
  ['f-nombre','f-dni','f-tel','f-nac','f-email','f-ocupacion','f-emergencia','f-emergencia-nombre','f-obs']
    .forEach(id => { document.getElementById(id).value = ''; });
  document.getElementById('f-sexo').value = '';
  document.getElementById('alerta-editar').innerHTML = '';
}

function abrirNuevo(){
  if(!puedeEditar()){ toast('No tenés permiso para cargar pacientes'); return; }
  editando = null;
  limpiarForm();
  document.getElementById('editar-head').textContent = 'Nuevo paciente';
  document.getElementById('editar-foot').innerHTML = `
    <button class="btn" onclick="cerrarModal('modal-editar')">Cancelar</button>
    <button class="btn btn-primary" onclick="guardarPaciente()">Guardar</button>`;
  document.getElementById('modal-editar').classList.add('activo');
  setTimeout(() => document.getElementById('f-nombre').focus(), 80);
}

function abrirEditar(id){
  if(!puedeEditar()){ toast('No tenés permiso para editar el padrón'); return; }
  const p = pacientes.find(x => x.id === id);
  if(!p) return;
  editando = p;
  limpiarForm();
  document.getElementById('f-nombre').value = p.apellido_nombre || '';
  document.getElementById('f-dni').value = p.dni || '';
  document.getElementById('f-tel').value = p.telefono || '';
  document.getElementById('f-nac').value = p.fecha_nacimiento || '';
  document.getElementById('f-sexo').value = p.sexo || '';
  document.getElementById('f-email').value = p.email || '';
  document.getElementById('f-ocupacion').value = p.ocupacion || '';
  document.getElementById('f-emergencia').value = p.contacto_emergencia || '';
  document.getElementById('f-emergencia-nombre').value = p.contacto_emergencia_nombre || '';
  document.getElementById('f-obs').value = p.observaciones || '';
  document.getElementById('editar-head').textContent = 'Editar · ' + (p.apellido_nombre || '');
  document.getElementById('editar-foot').innerHTML = `
    <button class="btn btn-rojo" style="margin-right:auto" onclick="darDeBaja(${p.id})">Dar de baja</button>
    <button class="btn" onclick="cerrarModal('modal-editar')">Cancelar</button>
    <button class="btn btn-primary" onclick="guardarPaciente()">Guardar</button>`;
  document.getElementById('modal-editar').classList.add('activo');
}

async function guardarPaciente(){
  const alerta = document.getElementById('alerta-editar');
  alerta.innerHTML = '';
  const nombre = aMayus(document.getElementById('f-nombre').value);
  const dni    = soloNumeros(document.getElementById('f-dni').value);
  if(!nombre || !dni){
    alerta.innerHTML = '<div class="err-box">Apellido, nombre y DNI son obligatorios.</div>';
    return;
  }
  const fila = {
    apellido_nombre: nombre,
    dni,
    telefono: soloNumeros(document.getElementById('f-tel').value) || null,
    fecha_nacimiento: document.getElementById('f-nac').value || null,
    sexo: document.getElementById('f-sexo').value || null,
    email: aMinus(document.getElementById('f-email').value) || null,
    ocupacion: aMayus(document.getElementById('f-ocupacion').value) || null,
    contacto_emergencia: soloNumeros(document.getElementById('f-emergencia').value) || null,
    contacto_emergencia_nombre: aMayus(document.getElementById('f-emergencia-nombre').value) || null,
    observaciones: document.getElementById('f-obs').value.trim() || null
  };

  let error;
  if(editando){
    ({ error } = await sb.from('pacientes_sarkmed').update(fila).eq('id', editando.id));
  }else{
    fila.creado_por_email = miEmail;
    ({ error } = await sb.from('pacientes_sarkmed').insert(fila));
  }
  if(error){
    alerta.innerHTML = error.message.includes('ux_pacientes_sarkmed_dni')
      ? '<div class="err-box">Ese DNI ya está cargado en SARKMED. Buscalo en la lista.</div>'
      : `<div class="err-box">${esc(error.message)}</div>`;
    return;
  }
  cerrarModal('modal-editar');
  toast(editando ? 'Paciente actualizado' : 'Paciente cargado', 'ok');
  await cargarPacientes();
  render();
}

async function darDeBaja(id){
  const p = pacientes.find(x => x.id === id);
  if(!p) return;
  if(!confirm(`¿Dar de baja a ${p.apellido_nombre}?\n\nSale del listado pero no se borra: sus turnos y su historia quedan.`)) return;
  const { error } = await sb.from('pacientes_sarkmed').update({ activo: false }).eq('id', id);
  if(error){ toast('Error: ' + error.message, 'err'); return; }
  cerrarModal('modal-editar');
  toast('Paciente dado de baja', 'ok');
  await cargarPacientes();
  render();
}

/* INIT */
(async () => {
  render();                       // primero el cartel de "Cargando pacientes…"
  await cargarSesionYAccesos();
  await cargarPacientes();
  render();
})();
</script>
