<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mensajes del equipo · PuntoBiO</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --celeste: #1e9fe0;
  --celeste-dark: #1788c2;
  --celeste-light: #e8f5fc;
  --negro: #1a1a1a;
  --gris-texto: #666;
  --gris-borde: #e0e0e0;
  --gris-bg: #f7f9fa;
  --rojo: #dc2626;
  --rojo-light: #fee2e2;
  --verde: #16a34a;
  --amarillo: #fbc02d;
}
html, body {
  background: #fafbfc;
  color: var(--negro);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh;
}
.wrap {
  max-width: 740px;
  margin: 0 auto;
  padding: 18px 16px 100px;
}
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 18px;
}
.header h1 {
  font-size: 22px;
  font-weight: 800;
  color: var(--celeste);
  letter-spacing: -0.3px;
}
.header .sub {
  font-size: 12.5px;
  color: var(--gris-texto);
  margin-top: 2px;
}
.btn {
  font-family: inherit;
  border: 1.5px solid var(--gris-borde);
  background: #fff;
  color: var(--negro);
  border-radius: 8px;
  padding: 8px 13px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: all .15s;
}
.btn:hover { border-color: var(--celeste); color: var(--celeste); }
.btn-primary { background: var(--celeste); color: #fff; border-color: var(--celeste); }
.btn-primary:hover { background: var(--celeste-dark); color: #fff; }
.btn-rojo { background: #fff; color: var(--rojo); border-color: var(--rojo); }
.btn-rojo:hover { background: var(--rojo); color: #fff; }
.btn-sm { padding: 4px 9px; font-size: 11.5px; }

/* Caja para escribir nuevo mensaje */
.caja-nuevo {
  background: #fff;
  border: 1.5px solid var(--gris-borde);
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 22px;
  box-shadow: 0 1px 3px rgba(0,0,0,.04);
}
.caja-nuevo textarea {
  width: 100%;
  font-family: inherit;
  font-size: 14px;
  border: 1px solid var(--gris-borde);
  border-radius: 8px;
  padding: 10px 12px;
  resize: vertical;
  min-height: 70px;
  background: #fafbfc;
  color: var(--negro);
}
.caja-nuevo textarea:focus { outline: none; border-color: var(--celeste); background: #fff; }
.caja-nuevo .acciones {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 10px;
  gap: 8px;
}
.caja-nuevo .contador {
  font-size: 11.5px;
  color: var(--gris-texto);
}

/* Mensaje */
.msj {
  background: #fff;
  border: 1.5px solid var(--gris-borde);
  border-radius: 12px;
  padding: 14px 16px;
  margin-bottom: 10px;
  transition: all .15s;
}
.msj.sin-leer {
  border-left: 4px solid var(--celeste);
  background: linear-gradient(90deg, var(--celeste-light) 0%, #fff 8%);
}
.msj-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}
.msj-autor {
  display: flex;
  align-items: center;
  gap: 8px;
}
.msj-avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--celeste);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 13px;
}
.msj-nombre {
  font-weight: 700;
  font-size: 13.5px;
  color: var(--negro);
}
.msj-fecha {
  font-size: 11.5px;
  color: var(--gris-texto);
  margin-top: 2px;
}
.msj-fecha .editado {
  font-style: italic;
  color: #94a3b8;
  margin-left: 5px;
}
.msj-acciones {
  display: flex;
  gap: 4px;
}
.mini-btn {
  background: transparent;
  border: 1px solid var(--gris-borde);
  color: var(--gris-texto);
  border-radius: 6px;
  padding: 3px 7px;
  font-size: 11px;
  cursor: pointer;
  font-family: inherit;
}
.mini-btn:hover { border-color: var(--celeste); color: var(--celeste); }
.mini-btn.peligro:hover { border-color: var(--rojo); color: var(--rojo); }

.msj-contenido {
  font-size: 14px;
  line-height: 1.55;
  color: var(--negro);
  white-space: pre-wrap;
  word-break: break-word;
}
.msj-contenido a { color: var(--celeste); }

.msj-edit-textarea {
  width: 100%;
  font-family: inherit;
  font-size: 14px;
  border: 1px solid var(--celeste);
  border-radius: 6px;
  padding: 8px 10px;
  resize: vertical;
  min-height: 60px;
  background: #fff;
}
.msj-edit-acciones {
  display: flex;
  gap: 6px;
  margin-top: 8px;
}

.empty-state {
  text-align: center;
  padding: 50px 20px;
  color: var(--gris-texto);
  font-style: italic;
}
.empty-state .emoji {
  font-size: 38px;
  display: block;
  margin-bottom: 10px;
  font-style: normal;
}
.cargando {
  text-align: center;
  padding: 40px 20px;
  color: var(--gris-texto);
}

/* Toast / aviso */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--negro);
  color: #fff;
  padding: 11px 18px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  opacity: 0;
  transition: all .25s;
  z-index: 9999;
  box-shadow: 0 8px 20px rgba(0,0,0,.2);
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.acceso-denegado {
  background: #fef2f2;
  border: 1.5px solid var(--rojo);
  border-radius: 12px;
  padding: 24px;
  text-align: center;
  color: var(--rojo);
}
.acceso-denegado h2 { margin-bottom: 8px; }

@media (max-width: 600px) {
  .wrap { padding: 14px 12px 80px; }
  .header h1 { font-size: 19px; }
  .msj { padding: 12px 13px; }
  .msj-head { flex-direction: column; align-items: flex-start; gap: 6px; }
  .msj-acciones { align-self: flex-end; }
}
</style>
</head>
<body>

<div class="wrap" id="wrap">
  <div class="cargando" id="bootstrap">⏳ Cargando…</div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://bqpjtoiictnzcasxfucf.supabase.co";
const SUPABASE_ANON = "sb_publishable_yvuXDxrkRrhXwmZBnE_a_Q_zDBz0iDi";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

let yo = null;           // persona del usuario logueado
let esAdmin = false;     // admin_total
let mensajes = [];       // todos los mensajes
let leidasPorMi = new Set(); // ids de mensajes ya leídos por mí
let equipo = [];         // lista de personas del equipo (para el dropdown de destinatarios)
let filtroDestId = '';   // filtro de bandeja (para admin: ver solo conversación con X)

// ============= INICIO =============
async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    window.location.href = 'login.html';
    return;
  }
  // Mi ficha personal
  const { data: persona } = await sb.from('personas')
    .select('id, nombre, es_equipo, auth_user_id')
    .eq('auth_user_id', session.user.id)
    .maybeSingle();
  if (!persona) {
    mostrarAccesoDenegado('No te encontramos en el padrón.');
    return;
  }
  if (!persona.es_equipo) {
    mostrarAccesoDenegado('Este panel es solo para el equipo de PuntoBiO.');
    return;
  }
  yo = persona;

  // Verificar si es admin_total
  try {
    const { data: perm } = await sb.from('permisos_equipo')
      .select('admin_total').eq('persona_id', persona.id).maybeSingle();
    esAdmin = !!(perm && perm.admin_total);
  } catch (e) { esAdmin = false; }

  // Cargar miembros del equipo (excluyendo a mí mismo) — para el dropdown destinatario
  try {
    const { data: eq } = await sb.from('personas')
      .select('id, nombre')
      .eq('es_equipo', true)
      .order('nombre', { ascending: true });
    equipo = (eq || []).filter(p => p.id !== yo.id);
  } catch (e) { equipo = []; }

  renderShell();
  await cargarMensajes();
}

function mostrarAccesoDenegado(texto) {
  document.getElementById('wrap').innerHTML = `<div class="acceso-denegado">
    <h2>🔒 Acceso restringido</h2>
    <p>${texto}</p>
  </div>`;
}

function renderShell() {
  // Dropdown de destinatarios para el formulario
  const optsDest = `<option value="">📢 Todo el equipo (anuncio general)</option>` +
    equipo.map(p => `<option value="${p.id}">${escapeHtml(formatNombre(p.nombre))}</option>`).join('');

  // Si soy admin, muestro un filtro extra para ver solo conversación con alguien
  const filtroAdmin = esAdmin ? `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;background:#fef9c3;border:1.5px solid #fde047;border-radius:10px;padding:9px 13px;font-size:12.5px">
      <span style="font-weight:700;color:#854d0e">👑 Vista admin:</span>
      <span style="color:#854d0e">ves todos los mensajes del equipo.</span>
      <select id="filtroAdminDest" onchange="aplicarFiltroAdmin()" style="margin-left:auto;font-family:inherit;padding:4px 8px;border-radius:6px;border:1px solid #d4d4d8;background:#fff;font-size:12px">
        <option value="">— Filtrar por persona —</option>
        <option value="generales">📢 Solo anuncios generales</option>
        ${[yo].concat(equipo).map(p => `<option value="${p.id}">Conversaciones con ${escapeHtml(formatNombre(p.nombre))}</option>`).join('')}
      </select>
    </div>` : '';

  document.getElementById('wrap').innerHTML = `
    <div class="header">
      <div>
        <h1>💬 Mensajes del equipo</h1>
        <div class="sub">${esAdmin ? 'Vista admin · ves todo el equipo' : 'Solo ves los mensajes dirigidos a vos o anuncios generales'}</div>
      </div>
      <button class="btn btn-sm" onclick="cargarMensajes()" title="Refrescar">🔄</button>
    </div>

    ${filtroAdmin}

    <div class="caja-nuevo">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap">
        <label style="font-size:12px;font-weight:700;color:var(--gris-texto)">Para:</label>
        <select id="nuevoDest" style="font-family:inherit;font-size:13px;padding:6px 10px;border-radius:7px;border:1px solid var(--gris-borde);background:#fff;flex:1;min-width:200px">
          ${optsDest}
        </select>
      </div>
      <textarea id="nuevoMsj" placeholder="Escribí tu mensaje…" maxlength="2000"></textarea>
      <div class="acciones">
        <div class="contador" id="contador">0 / 2000</div>
        <button class="btn btn-primary" id="btnEnviar" onclick="enviar()">Enviar</button>
      </div>
    </div>

    <div id="lista"><div class="cargando">Cargando mensajes…</div></div>
  `;
  const ta = document.getElementById('nuevoMsj');
  const cont = document.getElementById('contador');
  ta.addEventListener('input', () => { cont.textContent = `${ta.value.length} / 2000`; });
}

// Aplica filtro de admin: muestra solo conversación con persona X (o solo generales)
window.aplicarFiltroAdmin = function() {
  const sel = document.getElementById('filtroAdminDest');
  filtroDestId = sel ? sel.value : '';
  pintarMensajes();
};

// Helper: nombre formateado (Mayúsculas y solo nombre + primer apellido)
function formatNombre(n) {
  if (!n) return '—';
  const partes = String(n).trim().split(/\s+/);
  return partes.slice(0, 2).map(p => p.charAt(0).toUpperCase() + p.slice(1).toLowerCase()).join(' ');
}

// ============= CARGAR MENSAJES =============
async function cargarMensajes() {
  try {
    const [msjRes, lecRes] = await Promise.all([
      sb.from('mensajes_equipo').select('*').order('creado_en', { ascending: false }),
      sb.from('mensajes_lecturas').select('mensaje_id').eq('persona_id', yo.id)
    ]);
    if (msjRes.error) throw msjRes.error;
    mensajes = msjRes.data || [];
    leidasPorMi = new Set((lecRes.data || []).map(r => r.mensaje_id));
    pintarMensajes();
    marcarTodosLeidosSilenciosamente();
  } catch (e) {
    document.getElementById('lista').innerHTML =
      `<div class="empty-state"><span class="emoji">⚠️</span>No se pudo cargar: ${escapeHtml(e.message)}</div>`;
  }
}

function pintarMensajes() {
  const cont = document.getElementById('lista');
  // Aplicar filtro admin si corresponde
  let lista = mensajes;
  if (esAdmin && filtroDestId) {
    if (filtroDestId === 'generales') {
      lista = mensajes.filter(m => m.destinatario_persona_id == null);
    } else {
      const pid = parseInt(filtroDestId, 10);
      lista = mensajes.filter(m =>
        m.autor_persona_id === pid || m.destinatario_persona_id === pid
      );
    }
  }
  if (!lista.length) {
    const txt = esAdmin && filtroDestId
      ? 'No hay mensajes con ese filtro.'
      : 'Sin mensajes todavía.<br>Sé la primera persona en escribir algo.';
    cont.innerHTML = `<div class="empty-state"><span class="emoji">📭</span>${txt}</div>`;
    return;
  }
  cont.innerHTML = lista.map(m => renderMensaje(m)).join('');
}

function nombreDePersonaId(pid) {
  if (pid == null) return '📢 Todo el equipo';
  if (pid === yo.id) return formatNombre(yo.nombre) + ' (vos)';
  const p = equipo.find(x => x.id === pid);
  return p ? formatNombre(p.nombre) : '—';
}

function renderMensaje(m) {
  const esMio = m.autor_persona_id === yo.id;
  const puedeEditar = esMio;
  const puedeBorrar = esMio || esAdmin;
  const sinLeer = !leidasPorMi.has(m.id) && !esMio;
  const ini = inicialesDe(m.autor_nombre || 'Equipo');
  const esGeneral = m.destinatario_persona_id == null;
  // Texto "para X"
  const paraTxt = esGeneral
    ? '<span style="background:#fef3c7;color:#92400e;border:1px solid #fcd34d;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:5px">📢 Todo el equipo</span>'
    : `<span style="background:#dbeafe;color:#1e40af;border:1px solid #93c5fd;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:5px">→ ${escapeHtml(nombreDePersonaId(m.destinatario_persona_id))}</span>`;
  return `<div class="msj ${sinLeer ? 'sin-leer' : ''}" id="msj-${m.id}">
    <div class="msj-head">
      <div class="msj-autor">
        <div class="msj-avatar">${ini}</div>
        <div>
          <div class="msj-nombre">${escapeHtml(m.autor_nombre || 'Equipo')}${esMio ? ' <span style="color:#94a3b8;font-weight:500;font-size:11.5px">(vos)</span>' : ''} ${paraTxt}</div>
          <div class="msj-fecha">${formatearFecha(m.creado_en)}${m.editado_en ? '<span class="editado">· editado</span>' : ''}</div>
        </div>
      </div>
      <div class="msj-acciones">
        ${puedeEditar ? `<button class="mini-btn" onclick="editar(${m.id})" title="Editar">✏️</button>` : ''}
        ${puedeBorrar ? `<button class="mini-btn peligro" onclick="borrar(${m.id})" title="Borrar">🗑️</button>` : ''}
      </div>
    </div>
    <div class="msj-contenido" id="msj-cont-${m.id}">${linkify(escapeHtml(m.contenido))}</div>
  </div>`;
}

// ============= ENVIAR =============
async function enviar() {
  const ta = document.getElementById('nuevoMsj');
  const sel = document.getElementById('nuevoDest');
  const txt = ta.value.trim();
  if (!txt) { mostrarToast('Escribí algo primero'); return; }
  const destVal = sel ? sel.value : '';
  const destId = destVal ? parseInt(destVal, 10) : null;
  const btn = document.getElementById('btnEnviar');
  btn.disabled = true; btn.textContent = 'Enviando…';
  try {
    const { error } = await sb.from('mensajes_equipo').insert({
      autor_persona_id: yo.id,
      autor_nombre: yo.nombre,
      destinatario_persona_id: destId,
      contenido: txt,
    });
    if (error) throw error;
    ta.value = '';
    document.getElementById('contador').textContent = '0 / 2000';
    mostrarToast(destId ? `✓ Enviado a ${nombreDePersonaId(destId)}` : '✓ Anuncio publicado');
    await cargarMensajes();
  } catch (e) {
    mostrarToast('Error: ' + e.message);
  } finally {
    btn.disabled = false; btn.textContent = 'Enviar';
  }
}

// ============= EDITAR =============
window.editar = function(id) {
  const m = mensajes.find(x => x.id === id);
  if (!m) return;
  const cont = document.getElementById('msj-cont-' + id);
  if (!cont) return;
  cont.innerHTML = `
    <textarea class="msj-edit-textarea" id="edit-${id}" maxlength="2000">${escapeHtml(m.contenido)}</textarea>
    <div class="msj-edit-acciones">
      <button class="btn btn-sm" onclick="cancelarEdit(${id})">Cancelar</button>
      <button class="btn btn-sm btn-primary" onclick="guardarEdit(${id})">Guardar</button>
    </div>`;
};

window.cancelarEdit = function(id) {
  const m = mensajes.find(x => x.id === id);
  if (!m) return;
  document.getElementById('msj-cont-' + id).innerHTML = linkify(escapeHtml(m.contenido));
};

window.guardarEdit = async function(id) {
  const ta = document.getElementById('edit-' + id);
  if (!ta) return;
  const txt = ta.value.trim();
  if (!txt) { mostrarToast('No puede quedar vacío'); return; }
  try {
    const { error } = await sb.from('mensajes_equipo')
      .update({ contenido: txt, editado_en: new Date().toISOString() })
      .eq('id', id);
    if (error) throw error;
    mostrarToast('✓ Editado');
    await cargarMensajes();
  } catch (e) {
    mostrarToast('Error: ' + e.message);
  }
};

// ============= BORRAR =============
window.borrar = async function(id) {
  if (!confirm('¿Borrar este mensaje? Esta acción no se puede deshacer.')) return;
  try {
    const { error } = await sb.from('mensajes_equipo').delete().eq('id', id);
    if (error) throw error;
    mostrarToast('✓ Borrado');
    await cargarMensajes();
  } catch (e) {
    mostrarToast('Error: ' + e.message);
  }
};

// ============= MARCAR COMO LEÍDO =============
// Marca como leídos los mensajes que ME corresponden (destinatario yo, generales, o no míos si soy admin).
// El badge se calcula en el servidor con la misma lógica.
async function marcarTodosLeidosSilenciosamente() {
  const meCorresponde = (m) =>
    m.autor_persona_id !== yo.id && (
      esAdmin
      || m.destinatario_persona_id === yo.id
      || m.destinatario_persona_id == null
    );
  const sinLeer = mensajes
    .filter(m => !leidasPorMi.has(m.id) && meCorresponde(m))
    .map(m => ({ mensaje_id: m.id, persona_id: yo.id }));
  if (!sinLeer.length) return;
  try {
    await sb.from('mensajes_lecturas').upsert(sinLeer, { onConflict: 'mensaje_id,persona_id', ignoreDuplicates: true });
    sinLeer.forEach(r => leidasPorMi.add(r.mensaje_id));
    // Avisar al padre (app.html) para que actualice el badge
    try { parent.postMessage({ tipo: 'MENSAJES_LEIDOS' }, '*'); } catch (e) {}
  } catch (e) {
    console.warn('No se pudo marcar lecturas:', e);
  }
}

// ============= HELPERS =============
function inicialesDe(nombre) {
  const partes = String(nombre || '').trim().split(/\s+/).filter(Boolean);
  if (!partes.length) return '?';
  if (partes.length === 1) return partes[0].substring(0,2).toUpperCase();
  return (partes[0][0] + partes[partes.length-1][0]).toUpperCase();
}

function escapeHtml(s) {
  return String(s || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function linkify(s) {
  return s.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
}

function formatearFecha(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d)) return '—';
  const hoy = new Date();
  const ayer = new Date(); ayer.setDate(hoy.getDate() - 1);
  const isoFecha = d.toISOString().slice(0,10);
  const hoyISO = hoy.toISOString().slice(0,10);
  const ayerISO = ayer.toISOString().slice(0,10);
  const hora = d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  if (isoFecha === hoyISO) return `Hoy · ${hora}`;
  if (isoFecha === ayerISO) return `Ayer · ${hora}`;
  // Más antiguo: DD/MM HH:MM
  return `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()} · ${hora}`;
}

function mostrarToast(texto) {
  const t = document.getElementById('toast');
  t.textContent = texto;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

init();
</script>
</body>
</html>
