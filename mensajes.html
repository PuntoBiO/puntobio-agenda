<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mensajes del equipo · PuntoBiO</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --celeste: #1e9fe0;
  --celeste-dark: #1788c2;
  --celeste-light: #e8f5fc;
  --negro: #1a1a1a;
  --gris-texto: #666;
  --gris-borde: #e0e0e0;
  --gris-bg: #f7f9fa;
  --rojo: #dc2626;
  --rojo-light: #fee2e2;
  --verde: #16a34a;
  --amarillo: #fbc02d;
}
html, body {
  background: #fafbfc;
  color: var(--negro);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh;
}
.wrap {
  max-width: 740px;
  margin: 0 auto;
  padding: 18px 16px 100px;
}
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 18px;
}
.header h1 {
  font-size: 22px;
  font-weight: 800;
  color: var(--celeste);
  letter-spacing: -0.3px;
}
.header .sub {
  font-size: 12.5px;
  color: var(--gris-texto);
  margin-top: 2px;
}
.btn {
  font-family: inherit;
  border: 1.5px solid var(--gris-borde);
  background: #fff;
  color: var(--negro);
  border-radius: 8px;
  padding: 8px 13px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: all .15s;
}
.btn:hover { border-color: var(--celeste); color: var(--celeste); }
.btn-primary { background: var(--celeste); color: #fff; border-color: var(--celeste); }
.btn-primary:hover { background: var(--celeste-dark); color: #fff; }
.btn-rojo { background: #fff; color: var(--rojo); border-color: var(--rojo); }
.btn-rojo:hover { background: var(--rojo); color: #fff; }
.btn-sm { padding: 4px 9px; font-size: 11.5px; }

/* Caja para escribir nuevo mensaje */
.caja-nuevo {
  background: #fff;
  border: 1.5px solid var(--gris-borde);
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 22px;
  box-shadow: 0 1px 3px rgba(0,0,0,.04);
}
.caja-nuevo textarea {
  width: 100%;
  font-family: inherit;
  font-size: 14px;
  border: 1px solid var(--gris-borde);
  border-radius: 8px;
  padding: 10px 12px;
  resize: vertical;
  min-height: 70px;
  background: #fafbfc;
  color: var(--negro);
}
.caja-nuevo textarea:focus { outline: none; border-color: var(--celeste); background: #fff; }
.caja-nuevo .acciones {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 10px;
  gap: 8px;
}
.caja-nuevo .contador {
  font-size: 11.5px;
  color: var(--gris-texto);
}

/* Mensaje */
.msj {
  background: #fff;
  border: 1.5px solid var(--gris-borde);
  border-radius: 12px;
  padding: 14px 16px;
  margin-bottom: 10px;
  transition: all .15s;
}
.msj.sin-leer {
  border-left: 4px solid var(--celeste);
  background: linear-gradient(90deg, var(--celeste-light) 0%, #fff 8%);
}
.msj-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}
.msj-autor {
  display: flex;
  align-items: center;
  gap: 8px;
}
.msj-avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--celeste);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 13px;
}
.msj-nombre {
  font-weight: 700;
  font-size: 13.5px;
  color: var(--negro);
}
.msj-fecha {
  font-size: 11.5px;
  color: var(--gris-texto);
  margin-top: 2px;
}
.msj-fecha .editado {
  font-style: italic;
  color: #94a3b8;
  margin-left: 5px;
}
.msj-acciones {
  display: flex;
  gap: 4px;
}
.mini-btn {
  background: transparent;
  border: 1px solid var(--gris-borde);
  color: var(--gris-texto);
  border-radius: 6px;
  padding: 3px 7px;
  font-size: 11px;
  cursor: pointer;
  font-family: inherit;
}
.mini-btn:hover { border-color: var(--celeste); color: var(--celeste); }
.mini-btn.peligro:hover { border-color: var(--rojo); color: var(--rojo); }

.msj-contenido {
  font-size: 14px;
  line-height: 1.55;
  color: var(--negro);
  white-space: pre-wrap;
  word-break: break-word;
}
.msj-contenido a { color: var(--celeste); }

.msj-edit-textarea {
  width: 100%;
  font-family: inherit;
  font-size: 14px;
  border: 1px solid var(--celeste);
  border-radius: 6px;
  padding: 8px 10px;
  resize: vertical;
  min-height: 60px;
  background: #fff;
}
.msj-edit-acciones {
  display: flex;
  gap: 6px;
  margin-top: 8px;
}

.empty-state {
  text-align: center;
  padding: 50px 20px;
  color: var(--gris-texto);
  font-style: italic;
}
.empty-state .emoji {
  font-size: 38px;
  display: block;
  margin-bottom: 10px;
  font-style: normal;
}
.cargando {
  text-align: center;
  padding: 40px 20px;
  color: var(--gris-texto);
}

/* Toast / aviso */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--negro);
  color: #fff;
  padding: 11px 18px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  opacity: 0;
  transition: all .25s;
  z-index: 9999;
  box-shadow: 0 8px 20px rgba(0,0,0,.2);
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.acceso-denegado {
  background: #fef2f2;
  border: 1.5px solid var(--rojo);
  border-radius: 12px;
  padding: 24px;
  text-align: center;
  color: var(--rojo);
}
.acceso-denegado h2 { margin-bottom: 8px; }

@media (max-width: 600px) {
  .wrap { padding: 14px 12px 80px; }
  .header h1 { font-size: 19px; }
  .msj { padding: 12px 13px; }
  .msj-head { flex-direction: column; align-items: flex-start; gap: 6px; }
  .msj-acciones { align-self: flex-end; }
}
</style>
</head>
<body>

<div class="wrap" id="wrap">
  <div class="cargando" id="bootstrap">⏳ Cargando…</div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://bqpjtoiictnzcasxfucf.supabase.co";
const SUPABASE_ANON = "sb_publishable_yvuXDxrkRrhXwmZBnE_a_Q_zDBz0iDi";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON, { auth: { lock: (name, acquireTimeout, fn) => fn() } });

let yo = null;           // persona del usuario logueado
let esAdmin = false;     // admin_total OR ve_todos_mensajes
let mensajes = [];       // todos los mensajes
let leidasPorMi = new Set(); // ids de mensajes ya leídos por mí
let equipo = [];         // lista de personas del equipo (para el dropdown de destinatarios)
let filtroDestId = '';   // filtro de bandeja (para admin: ver solo conversación con X)
let ADMINS_IDS = new Set(); // ids de personas con admin_total — sus mensajes se ven en rojo
let adjuntosPorMsj = {}; // { mensaje_id: [{...adjunto}] }
let archivosNuevos = []; // archivos pendientes para adjuntar al próximo mensaje
let urlsAdjuntoCache = {}; // cache de URLs firmadas por storage_path
// Grabación de audio
let mediaRecorder = null;
let audioChunks = [];
let recordingStartTs = 0;
let recordingTimerInt = null;
let LIMITE_CHARS = 10000; // antes 2000 — Lu pidió subirlo
// Modo de destinatario: 'uno' | 'varios' | 'todos'
let modoDest = 'uno';
let destinatariosMulti = new Set(); // ids elegidos en modo 'varios'

// ===== JERARQUÍA / GRUPO =====
// Nivel 1 (suma importancia): admin_total -> Lu y Jime  (ya viene de ADMINS_IDS, rojo "IMPORTANTE")
// Nivel 2 (vocería): Paula  -> ámbar "VOCERÍA"
// Nivel 3: resto del equipo
let VOCERA_IDS = new Set();   // ids de las voceras (Paula)
let GRUPO_IDS = [];           // ids del preset "Equipo TF" (Paula + profes), excluyéndome a mí
const EMAILS_VOCERA = ['paukappes@gmail.com'];
const EMAILS_GRUPO  = [
  'paukappes@gmail.com',           // Paula (vocera)
  'santiagoferreira1999@gmail.com',// Santi
  'leacrespin97@gmail.com',        // Lean
  'leut.molina@gmail.com',         // Lautaro
  'loz.magdalena@gmail.com'        // Male
];
// Mapa id -> [ids hermanos del mismo envío] (para editar/borrar todo un lote junto)
let idToLote = {};

// ============= INICIO =============
async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    window.location.href = 'login.html';
    return;
  }
  // Mi ficha personal
  const { data: persona } = await sb.from('personas')
    .select('id, nombre, es_equipo, auth_user_id')
    .eq('auth_user_id', session.user.id)
    .maybeSingle();
  if (!persona) {
    mostrarAccesoDenegado('No te encontramos en el padrón.');
    return;
  }
  if (!persona.es_equipo) {
    mostrarAccesoDenegado('Este panel es solo para el equipo de PuntoBiO.');
    return;
  }
  yo = persona;

  // Verificar si puedo ver todos los mensajes (admin_total OR ve_todos_mensajes)
  try {
    const { data: perm } = await sb.from('permisos_equipo')
      .select('admin_total, ve_todos_mensajes').eq('persona_id', persona.id).maybeSingle();
    esAdmin = !!(perm && (perm.admin_total || perm.ve_todos_mensajes));
  } catch (e) { esAdmin = false; }

  // Cargar miembros del equipo (excluyendo a mí mismo) — para el dropdown destinatario
  // Filtra duplicados detectando colisión de NOMBRE COMPLETO normalizado Y también las primeras 2 palabras
  // (cubre el caso "Paula Gabriela Fulanito" vs "Paula Gabriela Otro Apellido")
  try {
    const { data: eq } = await sb.from('personas')
      .select('id, nombre')
      .eq('es_equipo', true)
      .order('nombre', { ascending: true });
    const norm = (s) => String(s || '')
      .toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .trim().replace(/\s+/g, ' ');
    const primero2 = (s) => norm(s).split(' ').slice(0, 2).join(' '); // primeras 2 palabras
    const vistosFull = new Set();
    const vistosPrim2 = new Set();
    equipo = (eq || [])
      .filter(p => p.id !== yo.id)
      .filter(p => {
        const full = norm(p.nombre);
        const p2 = primero2(p.nombre);
        if (vistosFull.has(full) || vistosPrim2.has(p2)) return false;
        vistosFull.add(full);
        vistosPrim2.add(p2);
        return true;
      });
  } catch (e) { equipo = []; }

  // ===== Resolver VOCERA (Paula) y GRUPO (Equipo TF) por email, con fallback por nombre =====
  try {
    // Base de nombres (siempre disponible)
    let personasBase = [];
    try {
      const { data } = await sb.from('personas').select('id, nombre').eq('es_equipo', true);
      personasBase = data || [];
    } catch (e) { personasBase = []; }
    // Emails (la columna podría no existir en algún esquema viejo)
    let idsPorEmail = {};
    try {
      const { data } = await sb.from('personas').select('id, email').eq('es_equipo', true);
      (data || []).forEach(p => { if (p.email) idsPorEmail[String(p.email).toLowerCase().trim()] = p.id; });
    } catch (e) { idsPorEmail = {}; }

    const normNom = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
    const idPorPrimerNombre = (pref) => {
      const hit = personasBase.find(p => normNom(p.nombre).split(' ')[0] === pref);
      return hit ? hit.id : null;
    };

    // Vocera = Paula
    EMAILS_VOCERA.forEach(e => { if (idsPorEmail[e]) VOCERA_IDS.add(idsPorEmail[e]); });
    if (!VOCERA_IDS.size) { const id = idPorPrimerNombre('paula'); if (id) VOCERA_IDS.add(id); }

    // Grupo "Equipo TF"
    const setG = new Set();
    EMAILS_GRUPO.forEach(e => { if (idsPorEmail[e]) setG.add(idsPorEmail[e]); });
    if (!setG.size) {
      ['paula', 'santiago', 'leandro', 'lautaro', 'magdalena', 'male', 'lean'].forEach(pref => {
        const id = idPorPrimerNombre(pref); if (id) setG.add(id);
      });
    }
    GRUPO_IDS = equipo.filter(p => setG.has(p.id)).map(p => p.id); // solo los que no soy yo
  } catch (e) { /* sin vocera/grupo: la pantalla funciona igual */ }

  renderShell();
  await cargarMensajes();
}

function mostrarAccesoDenegado(texto) {
  document.getElementById('wrap').innerHTML = `<div class="acceso-denegado">
    <h2>🔒 Acceso restringido</h2>
    <p>${texto}</p>
  </div>`;
}

function renderShell() {
  // Si tengo permiso de ver todos, muestro un filtro extra para ver solo conversación con alguien
  const filtroAdmin = esAdmin ? `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;background:#fef9c3;border:1.5px solid #fde047;border-radius:10px;padding:9px 13px;font-size:12.5px">
      <span style="font-weight:700;color:#854d0e">👑 Vista supervisor:</span>
      <span style="color:#854d0e">ves todos los mensajes del equipo.</span>
      <select id="filtroAdminDest" onchange="aplicarFiltroAdmin()" style="margin-left:auto;font-family:inherit;padding:4px 8px;border-radius:6px;border:1px solid #d4d4d8;background:#fff;font-size:12px">
        <option value="">— Filtrar por persona —</option>
        <option value="generales">📢 Solo anuncios generales</option>
        ${[yo].concat(equipo).map(p => `<option value="${p.id}">Con ${escapeHtml(nombreCorto(p, [yo].concat(equipo)))}</option>`).join('')}
      </select>
    </div>` : '';

  // Selector de modo destinatario
  const tabs = `
    <div style="display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap">
      <button type="button" class="modo-btn ${modoDest==='uno'?'sel':''}" onclick="setModoDest('uno')">👤 Uno solo</button>
      <button type="button" class="modo-btn ${modoDest==='varios'?'sel':''}" onclick="setModoDest('varios')">👥 Varios</button>
      <button type="button" class="modo-btn ${modoDest==='todos'?'sel':''}" onclick="setModoDest('todos')">📢 Todos</button>
    </div>`;

  // Contenido del selector según el modo
  let destinatariosBox;
  if (modoDest === 'uno') {
    const opts = equipo.map(p => `<option value="${p.id}">${escapeHtml(nombreCorto(p, equipo))}</option>`).join('');
    destinatariosBox = `
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <label style="font-size:12px;font-weight:700;color:var(--gris-texto)">Para:</label>
        <select id="nuevoDest" style="font-family:inherit;font-size:13px;padding:6px 10px;border-radius:7px;border:1px solid var(--gris-borde);background:#fff;flex:1;min-width:200px">
          <option value="">— Elegí —</option>${opts}
        </select>
      </div>`;
  } else if (modoDest === 'varios') {
    const chks = equipo.map(p => `
      <label style="display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1.5px solid ${destinatariosMulti.has(p.id)?'#1e9fe0':'var(--gris-borde)'};border-radius:8px;font-size:12.5px;font-weight:700;cursor:pointer;background:${destinatariosMulti.has(p.id)?'#dbeafe':'#fff'};color:${destinatariosMulti.has(p.id)?'#1e40af':'#475569'}">
        <input type="checkbox" ${destinatariosMulti.has(p.id)?'checked':''} onchange="toggleDestMulti(${p.id})" style="cursor:pointer">
        ${escapeHtml(nombreCorto(p, equipo))}
      </label>`).join('');
    destinatariosBox = `
      <div>
        <div style="font-size:12px;font-weight:700;color:var(--gris-texto);margin-bottom:6px">Elegí a quién mandarle (${destinatariosMulti.size} elegido${destinatariosMulti.size===1?'':'s'}):</div>
        ${GRUPO_IDS.length ? `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">
          <button type="button" class="modo-btn" onclick="seleccionarGrupo()" style="background:#ecfdf5;border-color:#34d399;color:#047857">👥 Equipo TF (Paula + profes)</button>
          ${destinatariosMulti.size ? `<button type="button" class="modo-btn" onclick="limpiarSeleccion()" style="background:#fff;border-color:#e0e0e0;color:#64748b">✕ Limpiar</button>` : ''}
        </div>` : ''}
        <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px">${chks}</div>
        <div style="font-size:11px;color:var(--gris-texto)">Se manda una sola vez y queda agrupado: en la bandeja se ve como un correo con todos los destinatarios juntos.${esAdmin?'' : ' Jime y Lu lo ven igual porque supervisan todo.'}</div>
      </div>`;
  } else { // 'todos'
    destinatariosBox = `
      <div style="background:#fef3c7;border:1.5px solid #fcd34d;border-radius:8px;padding:9px 12px;font-size:13px;color:#854d0e;font-weight:600">
        📢 Anuncio general · todo el equipo va a ver este mensaje.
      </div>`;
  }

  document.getElementById('wrap').innerHTML = `
    <style>
      .modo-btn { background:#fff; color:var(--gris-texto); border:1.5px solid var(--gris-borde); border-radius:8px; padding:6px 12px; font-size:12.5px; font-weight:700; cursor:pointer; font-family:inherit }
      .modo-btn:hover { border-color: var(--celeste); color: var(--celeste); }
      .modo-btn.sel { background: var(--celeste); color:#fff; border-color: var(--celeste); }
      .archivo-chip { display:inline-flex; align-items:center; gap:6px; background:#eef2ff; color:#475569; border:1px solid #c7d2fe; border-radius:6px; padding:4px 8px; font-size:11.5px; font-weight:600; margin:3px 4px 3px 0 }
      .archivo-chip .x { cursor:pointer; color:#64748b; font-weight:800 }
      .archivo-chip .x:hover { color:#dc2626 }
      .adj-chip { display:inline-flex; align-items:center; gap:6px; background:#fff; border:1px solid #cbd5e1; color:#1e9fe0; border-radius:7px; padding:6px 11px; font-size:12.5px; font-weight:700; margin:4px 5px 0 0; cursor:pointer; text-decoration:none }
      .adj-chip:hover { background:#f0f9ff; border-color:#1e9fe0 }
      .adj-img { max-width:280px; max-height:200px; border-radius:8px; border:1px solid #cbd5e1; display:block; margin:6px 4px 0 0; cursor:pointer }
      .adj-audio { width:100%; max-width:360px; display:block; margin:6px 0 }
      .adj-video { max-width:100%; max-height:280px; border-radius:8px; display:block; margin:6px 0 }
      .icon-btn { display:inline-flex; align-items:center; gap:5px; background:#fff; color:#475569; border:1.5px solid var(--gris-borde); border-radius:8px; padding:7px 11px; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit }
      .icon-btn:hover { border-color: var(--celeste); color: var(--celeste); }
      .icon-btn.rec { background:#dc2626; color:#fff; border-color:#dc2626; animation: pulse-rec 1.2s infinite }
      .icon-btn.rec:hover { background:#b91c1c; color:#fff }
      @keyframes pulse-rec { 0%,100%{opacity:1} 50%{opacity:.7} }
      /* ===== Bandeja estilo correo ===== */
      .bandeja { background:#fff; border:1.5px solid var(--gris-borde); border-radius:12px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.05); }
      .mail-item { position:relative; border-bottom:1px solid #eef1f4; }
      .mail-item:last-child { border-bottom:none; }
      .mail-item .banda { position:absolute; left:0; top:0; bottom:0; width:4px; }
      .mail-row { display:flex; align-items:center; gap:10px; padding:11px 14px 11px 16px; cursor:pointer; transition:background .12s; }
      .mail-row:hover { background:#f4f9fd; }
      .mail-item.leido .mail-row { background:#fbfcfd; }
      .mail-item.no-leido .mail-row { background:#fff; }
      .mail-dot { width:8px; height:8px; flex:0 0 8px; border-radius:50%; background:var(--celeste); }
      .mail-dot.vacio { background:transparent; }
      .mail-av { width:34px; height:34px; flex:0 0 34px; border-radius:50%; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12.5px; }
      .mail-main { flex:1; min-width:0; }
      .mail-line1 { display:flex; align-items:center; gap:7px; }
      .mail-from { font-size:13.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .mail-item.no-leido .mail-from { font-weight:800; }
      .mail-date { margin-left:auto; flex:0 0 auto; font-size:11.5px; color:var(--gris-texto); white-space:nowrap; }
      .mail-line2 { display:flex; align-items:center; gap:9px; margin-top:2px; }
      .mail-preview { flex:1; min-width:0; font-size:12.5px; color:var(--gris-texto); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .mail-item.no-leido .mail-preview { color:#334155; font-weight:600; }

window.toggleGrabacion = async function() {
  const btn = document.getElementById('btnGrabar');
  const info = document.getElementById('grabacionInfo');
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    // Parar
    mediaRecorder.stop();
    if (recordingTimerInt) { clearInterval(recordingTimerInt); recordingTimerInt = null; }
    btn.classList.remove('rec');
    btn.innerHTML = '🎙️ Grabar audio';
    info.textContent = '';
    return;
  }
  // Iniciar
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '';
    mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
    audioChunks = [];
    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop()); // liberar micrófono
      const tipo = mediaRecorder.mimeType || 'audio/webm';
      const ext = tipo.includes('webm') ? 'webm' : (tipo.includes('mp4') ? 'mp4' : (tipo.includes('ogg') ? 'ogg' : 'webm'));
      const blob = new Blob(audioChunks, { type: tipo });
      const file = new File([blob], `audio_${new Date().toISOString().replace(/[:.]/g,'-')}.${ext}`, { type: tipo });
      archivosNuevos.push(file);
      pintarArchivosNuevos();
      mostrarToast('🎙️ Audio listo para enviar');
    };
    mediaRecorder.start();
    recordingStartTs = Date.now();
    btn.classList.add('rec');
    btn.innerHTML = '⏹️ Detener';
    info.textContent = '🔴 Grabando… 0:00';
    recordingTimerInt = setInterval(() => {
      const seg = Math.floor((Date.now() - recordingStartTs) / 1000);
      const mm = Math.floor(seg / 60); const ss = seg % 60;
      info.textContent = `🔴 Grabando… ${mm}:${String(ss).padStart(2,'0')}`;
    }, 250);
  } catch (e) {
    mostrarToast('No pude acceder al micrófono: ' + (e.message || e));
    btn.classList.remove('rec');
    btn.innerHTML = '🎙️ Grabar audio';
    info.textContent = '';
  }
};

function iconoArchivo(nombre, mime) {
  const n = String(nombre || '').toLowerCase();
  const m = String(mime || '').toLowerCase();
  if (m.startsWith('image/') || /\.(jpg|jpeg|png|gif|webp)$/.test(n)) return '🖼️';
  if (m.startsWith('audio/') || /\.(mp3|wav|ogg|m4a|webm)$/.test(n)) return '🎵';
  if (m.startsWith('video/') || /\.(mp4|mov|avi|webm|mkv)$/.test(n)) return '🎬';
  if (/\.pdf$/.test(n) || m === 'application/pdf') return '📄';
  if (/\.(doc|docx)$/.test(n)) return '📝';
  if (/\.(xls|xlsx|csv)$/.test(n)) return '📊';
  if (/\.(zip|rar|7z)$/.test(n)) return '🗜️';
  return '📎';
}

function fmtSize(bytes) {
  if (!bytes) return '0 B';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + ' KB';
  return (bytes / 1024 / 1024).toFixed(1) + ' MB';
}

// ====== SUBIR ADJUNTOS ======
async function subirAdjuntosDeMensaje(mensajeId, files) {
  if (!files || !files.length) return;
  for (const f of files) {
    const safeName = f.name.replace(/[^a-zA-Z0-9._-]/g, '_');
    const path = `${mensajeId}/${Date.now()}_${safeName}`;
    const { error: upErr } = await sb.storage.from('mensajes-adjuntos').upload(path, f, {
      contentType: f.type || 'application/octet-stream',
      upsert: false,
    });
    if (upErr) throw upErr;
    const { error: insErr } = await sb.from('mensajes_adjuntos').insert({
      mensaje_id: mensajeId,
      storage_path: path,
      nombre_original: f.name,
      tipo_mime: f.type || null,
      tamano_bytes: f.size,
    });
    if (insErr) throw insErr;
  }
}

// Obtiene URL firmada (cacheada por sesión)
async function obtenerUrlAdjunto(path) {
  if (urlsAdjuntoCache[path]) return urlsAdjuntoCache[path];

  if (error || !data) return null;
  urlsAdjuntoCache[path] = data.signedUrl;
  return data.signedUrl;
}

// Helper: nombre formateado completo (Capitalizado, máx 2 palabras) — para vistas amplias
function formatNombre(n) {
  if (!n) return '—';
  const partes = String(n).trim().split(/\s+/);
  return partes.slice(0, 2).map(p => p.charAt(0).toUpperCase() + p.slice(1).toLowerCase()).join(' ');
}

// Helper: PRIMER nombre nada más (con inicial de apellido SI hay duplicados con mismo primer nombre)
// equipoLista: array completo de personas para detectar colisiones
function nombreCorto(persona, equipoLista) {
  if (!persona || !persona.nombre) return '—';
  const partes = String(persona.nombre).trim().split(/\s+/);
  const primero = (partes[0] || '').toLowerCase();
  const cap = primero.charAt(0).toUpperCase() + primero.slice(1);
  // Detectar colisión de primer nombre dentro de la lista
  const lista = equipoLista || [];
  const conMismoPrimero = lista.filter(p => {
    if (!p || !p.nombre) return false;
    const pn = String(p.nombre).trim().split(/\s+/)[0].toLowerCase();
    return pn === primero;
  });
  if (conMismoPrimero.length > 1) {
    // Agregar inicial del apellido (la segunda palabra disponible)
    const segunda = partes[1] || '';
    const ini = segunda ? segunda.charAt(0).toUpperCase() + '.' : '';
    return cap + (ini ? ' ' + ini : '');
  }
  return cap;
}

async function cargarMensajes() {
  try {
    const [msjRes, lecRes, admRes] = await Promise.all([
      sb.from('mensajes_equipo').select('*').order('creado_en', { ascending: false }),
      sb.from('mensajes_lecturas').select('mensaje_id').eq('persona_id', yo.id),
      sb.from('permisos_equipo').select('persona_id').eq('admin_total', true)
    ]);
    if (msjRes.error) throw msjRes.error;
    mensajes = msjRes.data || [];
    leidasPorMi = new Set((lecRes.data || []).map(r => r.mensaje_id));
    ADMINS_IDS = new Set((admRes.data || []).map(r => r.persona_id));
    // Adjuntos de los mensajes
    adjuntosPorMsj = {};
    if (mensajes.length) {
      const ids = mensajes.map(m => m.id);
      const { data: adj } = await sb.from('mensajes_adjuntos').select('*').in('mensaje_id', ids);
      (adj || []).forEach(a => {
        if (!adjuntosPorMsj[a.mensaje_id]) adjuntosPorMsj[a.mensaje_id] = [];
        adjuntosPorMsj[a.mensaje_id].push(a);
      });
    }
    pintarMensajes();
    marcarTodosLeidosSilenciosamente();
  } catch (e) {
    document.getElementById('lista').innerHTML =
      `<div class="empty-state"><span class="emoji">⚠️</span>No se pudo cargar: ${escapeHtml(e.message)}</div>`;
  }
}

// Agrupa los mensajes de un mismo envío múltiple en un solo "hilo" (= una tarjeta de correo).
// Clave: lote_id si existe; si no (mensajes viejos), autor + contenido + minuto.
function agruparHilos(lista) {
  idToLote = {};
  const orden = [];      // claves en orden de aparición (lista ya viene desc por fecha)
  const porClave = {};
  for (const m of lista) {
    const minuto = String(m.creado_en || '').slice(0, 16); // YYYY-MM-DDTHH:MM
    const clave = m.lote_id
      ? 'L:' + m.lote_id
      : `H:${m.autor_persona_id}|${m.destinatario_persona_id == null ? 'TODOS' : 'X'}|${m.contenido}|${minuto}`;
    if (!porClave[clave]) {
      porClave[clave] = { rep: m, ids: [], dests: [], esGeneral: m.destinatario_persona_id == null };
      orden.push(clave);
    }
    const h = porClave[clave];
    h.ids.push(m.id);
    h.dests.push(m.destinatario_persona_id);
  }
  // Mapear cada id -> ids hermanos (para editar/borrar el lote completo)
  Object.values(porClave).forEach(h => { h.ids.forEach(id => { idToLote[id] = h.ids; }); });
  return orden.map(k => porClave[k]);
}

function nombreDePersonaId(pid) {
  if (pid == null) return '📢 Todo el equipo';
  if (pid === yo.id) return nombreCorto(yo, [yo].concat(equipo)) + ' (vos)';
  const p = equipo.find(x => x.id === pid);
  return p ? nombreCorto(p, [yo].concat(equipo)) : '—';
}

// Renderiza un HILO (uno o varios mensajes del mismo envío) como una sola tarjeta tipo correo.
function renderHilo(h) {
  const m = h.rep;                          // mensaje representante
  const esMio = m.autor_persona_id === yo.id;
  const puedeEditar = esMio;
  const puedeBorrar = esMio || esAdmin;
  // Sin leer = alguno de los del lote me corresponde y no lo leí
  const sinLeer = h.ids.some(id => !leidasPorMi.has(id)) && !esMio;
  const ini = inicialesDe(m.autor_nombre || 'Equipo');
  const autorEsAdmin = ADMINS_IDS.has(m.autor_persona_id);          // Lu / Jime
  const autorEsVocera = !autorEsAdmin && VOCERA_IDS.has(m.autor_persona_id); // Paula

  // Línea "Para:" (solo se ve al abrir el correo)
  let paraLinea;
  if (h.esGeneral) {
    paraLinea = `<span class="lbl">Para:</span><span class="dest" style="background:#fef3c7;border-color:#fcd34d;color:#92400e">📢 Todo el equipo</span>`;
  } else {
    const nombres = h.dests
      .filter((v, i, a) => a.indexOf(v) === i)        // únicos
      .map(d => `<span class="dest">${escapeHtml(nombreDePersonaId(d))}</span>`)
      .join('');
    paraLinea = `<span class="lbl">Para:</span>${nombres}`;
  }

  // Jerarquía visual
  let bandaColor = '#e2e8f0', avatarBg = 'var(--celeste)', nombreColor = 'var(--negro)';
  let chip = '', cuerpoStyle = '', nivelCls = '';
  if (autorEsAdmin) {
    bandaColor = '#dc2626'; avatarBg = '#dc2626'; nombreColor = '#b91c1c';
    chip = '<span class="chip-nivel" style="background:#dc2626;color:#fff">⚡ IMPORTANTE</span>';
    cuerpoStyle = 'color:#7f1d1d;font-weight:500';
    nivelCls = 'nivel-admin';
  } else if (autorEsVocera) {
    bandaColor = '#d97706'; avatarBg = '#d97706'; nombreColor = '#b45309';
    chip = '<span class="chip-nivel" style="background:#d97706;color:#fff">🎤 VOCERÍA</span>';
    nivelCls = 'nivel-vocera';
  }

  // Adelanto del texto (una línea, como en la bandeja de un correo)
  const limpio = String(m.contenido || '').replace(/\s+/g, ' ').trim();
  const preview = escapeHtml(limpio.slice(0, 120)) + (limpio.length > 120 ? '…' : '');

  // Mini-indicadores en la fila: adjuntos y cantidad de destinatarios
  const nAdj = (adjuntosPorMsj[m.id] || []).length;
  const nDest = new Set(h.dests.filter(d => d != null)).size;
  const meta = [
    nAdj ? `📎${nAdj > 1 ? ' ' + nAdj : ''}` : '',
    h.esGeneral ? '📢' : (nDest > 1 ? '👥 ' + nDest : '')
  ].filter(Boolean).join('  ');

  const leidoCls = sinLeer ? 'no-leido' : 'leido';
  const dot = sinLeer ? '<span class="mail-dot"></span>' : '<span class="mail-dot vacio"></span>';

  return `<div class="mail-item ${leidoCls} ${nivelCls}" id="hilo-${m.id}">
    <div class="banda" style="background:${bandaColor}"></div>
    <div class="mail-row" onclick="toggleHilo(${m.id})">
      ${dot}
      <div class="mail-av" style="background:${avatarBg}">${ini}</div>
      <div class="mail-main">
        <div class="mail-line1">
          <span class="mail-from" style="color:${nombreColor}">${escapeHtml(m.autor_nombre || 'Equipo')}${esMio ? ' <span style="color:#94a3b8;font-weight:500">(vos)</span>' : ''}</span>
          ${chip}
          <span class="mail-date">${formatearFecha(m.creado_en)}</span>
        </div>
        <div class="mail-line2">
          <span class="mail-preview">${preview || '<span style="color:#cbd5e1">(sin texto)</span>'}</span>
          ${meta ? `<span class="mail-meta">${meta}</span>` : ''}
          <span class="mail-chevron">▸</span>
        </div>
      </div>
    </div>
    <div class="mail-body">
      <div class="msj-para">${paraLinea}${m.editado_en ? '<span class="editado" style="margin-left:6px">· editado</span>' : ''}</div>
      <div class="msj-sep"></div>
      <div class="msj-contenido msj-cuerpo" id="msj-cont-${m.id}" style="${cuerpoStyle}">${linkify(escapeHtml(m.contenido))}</div>
      ${renderAdjuntosConTitulo(m.id)}
      ${(puedeEditar || puedeBorrar) ? `<div class="mail-acciones">
        ${puedeEditar ? `<button class="mini-btn" onclick="editar(${m.id})" title="Editar">✏️ Editar</button>` : ''}
        ${puedeBorrar ? `<button class="mini-btn peligro" onclick="borrar(${m.id})" title="Borrar">🗑️ Borrar</button>` : ''}
      </div>` : ''}
    </div>
  </div>`;
}

}

// Renderiza la lista de adjuntos del mensaje, con preview en línea para audio/video/imagen
function renderAdjuntosMsj(mensajeId) {
  const adjs = adjuntosPorMsj[mensajeId] || [];
  if (!adjs.length) return '';
  const partes = adjs.map(a => {
    const t = (a.tipo_mime || '').toLowerCase();
    const n = (a.nombre_original || '').toLowerCase();
    const esImg = t.startsWith('image/') || /\.(jpg|jpeg|png|gif|webp)$/.test(n);
    const esAud = t.startsWith('audio/') || /\.(mp3|wav|ogg|m4a|webm)$/.test(n);
    const esVid = t.startsWith('video/') || /\.(mp4|mov|webm|mkv)$/.test(n);
    if (esImg) {
      return `<img class="adj-img" data-path="${escapeHtml(a.storage_path)}" alt="${escapeHtml(a.nombre_original)}" onclick="abrirAdjunto('${escapeHtml(a.storage_path).replace(/'/g,"\\'")}')" loading="lazy">`;
    }
    if (esAud) {
      return `<audio class="adj-audio" data-path="${escapeHtml(a.storage_path)}" controls preload="none"></audio>`;
    }
    if (esVid) {
      return `<video class="adj-video" data-path="${escapeHtml(a.storage_path)}" controls preload="none"></video>`;
    }
    return `<span class="adj-chip" onclick="abrirAdjunto('${escapeHtml(a.storage_path).replace(/'/g,"\\'")}')">${iconoArchivo(a.nombre_original, a.tipo_mime)} ${escapeHtml(a.nombre_original)} <span style="color:#94a3b8;font-weight:500">(${fmtSize(a.tamano_bytes || 0)})</span></span>`;
  }).join('');
  return `<div style="margin-top:10px" data-adj-msj="${mensajeId}">${partes}</div>`;
}

// Después de pintar los mensajes, popular los src de imágenes/audio/video con URLs firmadas
async function _hidratarAdjuntos() {
  // Imágenes
  for (const img of document.querySelectorAll('.adj-img[data-path]')) {
    const p = img.getAttribute('data-path');
    if (!p || img.src) continue;
    const url = await obtenerUrlAdjunto(p);
    if (url) img.src = url;
  }
  // Audios y videos: sumar source con la URL firmada
  for (const el of document.querySelectorAll('.adj-audio[data-path], .adj-video[data-path]')) {
    const p = el.getAttribute('data-path');
    if (!p || el.src) continue;
    const url = await obtenerUrlAdjunto(p);
    if (url) el.src = url;
  }
}

// ============= ENVIAR =============
// Inserta un mensaje; si la columna lote_id todavía no existe en la BD, reintenta sin ella.
async function insertMensajeSeguro(payload) {
  let res = await sb.from('mensajes_equipo').insert(payload).select('id').single();
  if (res.error && 'lote_id' in payload && /lote_id|column/i.test(res.error.message || '')) {
    const sin = { ...payload }; delete sin.lote_id;
    res = await sb.from('mensajes_equipo').insert(sin).select('id').single();
  }
  return res;
}

async function enviar() {
  const ta = document.getElementById('nuevoMsj');
  const txt = ta.value.trim();
  const tieneAdjuntos = archivosNuevos.length > 0;
  if (!txt && !tieneAdjuntos) { mostrarToast('Escribí algo o adjuntá un archivo'); return; }

  // Determinar lista de destinatarios según el modo
  let destinatarios; // array de IDs, o [null] si es anuncio general
  if (modoDest === 'todos') {
    destinatarios = [null]; // un solo INSERT con destinatario_persona_id = NULL
  } else if (modoDest === 'varios') {
    if (!destinatariosMulti.size) { mostrarToast('Elegí al menos un destinatario'); return; }
    destinatarios = Array.from(destinatariosMulti);
  } else { // 'uno'
    const sel = document.getElementById('nuevoDest');
    const v = sel ? sel.value : '';
    if (!v) { mostrarToast('Elegí un destinatario'); return; }
    destinatarios = [parseInt(v, 10)];
  }

  const btn = document.getElementById('btnEnviar');
  btn.disabled = true;
  btn.textContent = tieneAdjuntos ? 'Subiendo…' : 'Enviando…';

  // Si va a más de una persona, todos comparten un mismo lote para verse agrupados como un solo correo
  const loteId = (modoDest !== 'todos' && destinatarios.length > 1)
    ? ((crypto && crypto.randomUUID) ? crypto.randomUUID() : ('lote_' + Date.now() + '_' + Math.random().toString(36).slice(2)))
    : null;

  try {
    let enviadosOK = 0;
    for (const destId of destinatarios) {
      // 1) Crear el mensaje
      const payload = {
        autor_persona_id: yo.id,
        autor_nombre: yo.nombre,
        destinatario_persona_id: destId,
        contenido: txt || '(adjunto)',
        enviado_desde: 'equipo',
      };
      if (loteId) payload.lote_id = loteId;
      const { data: nuevo, error } = await insertMensajeSeguro(payload);
      if (error) throw error;
      // 2) Subir adjuntos al mensaje (a cada uno por separado para que cada destinatario los vea)
      if (tieneAdjuntos) {
        await subirAdjuntosDeMensaje(nuevo.id, archivosNuevos);
      }
      enviadosOK++;
    }
    // Limpiar UI
    archivosNuevos = [];
    ta.value = '';
    document.getElementById('contador').textContent = `0 / ${LIMITE_CHARS.toLocaleString('es-AR')}`;
    pintarArchivosNuevos();
    destinatariosMulti.clear();
    let textoOK;
    if (modoDest === 'todos') textoOK = '✓ Anuncio publicado';
    else if (enviadosOK === 1) textoOK = `✓ Enviado a ${nombreDePersonaId(destinatarios[0])}`;
    else textoOK = `✓ Enviado a ${enviadosOK} personas`;
    mostrarToast(textoOK);
    await cargarMensajes();
  } catch (e) {
    mostrarToast('Error: ' + e.message);
  } finally {
    btn.disabled = false; btn.textContent = 'Enviar';
  }
}

// ============= EDITAR =============
window.editar = function(id) {
  const m = mensajes.find(x => x.id === id);
  if (!m) return;
  const cont = document.getElementById('msj-cont-' + id);
  if (!cont) return;
  cont.innerHTML = `
    <textarea class="msj-edit-textarea" id="edit-${id}" maxlength="2000">${escapeHtml(m.contenido)}</textarea>
    <div class="msj-edit-acciones">
      <button class="btn btn-sm" onclick="cancelarEdit(${id})">Cancelar</button>
      <button class="btn btn-sm btn-primary" onclick="guardarEdit(${id})">Guardar</button>
    </div>`;
};

window.cancelarEdit = function(id) {
  const m = mensajes.find(x => x.id === id);
  if (!m) return;
  document.getElementById('msj-cont-' + id).innerHTML = linkify(escapeHtml(m.contenido));
};

window.guardarEdit = async function(id) {
  const ta = document.getElementById('edit-' + id);
  if (!ta) return;
  const txt = ta.value.trim();
  if (!txt) { mostrarToast('No puede quedar vacío'); return; }
  const ids = idToLote[id] || [id];   // edita todo el lote (todos los destinatarios)
  try {
    const { error } = await sb.from('mensajes_equipo')
      .update({ contenido: txt, editado_en: new Date().toISOString() })
      .in('id', ids);
    if (error) throw error;
    mostrarToast(ids.length > 1 ? `✓ Editado para ${ids.length} destinatarios` : '✓ Editado');
    await cargarMensajes();
  } catch (e) {
    mostrarToast('Error: ' + e.message);
  }
};

// ============= BORRAR =============
window.borrar = async function(id) {
  const ids = idToLote[id] || [id];   // borra todo el lote (todos los destinatarios)
  const msg = ids.length > 1
    ? `¿Borrar este correo para los ${ids.length} destinatarios? Esta acción no se puede deshacer.`
    : '¿Borrar este mensaje? Esta acción no se puede deshacer.';
  if (!confirm(msg)) return;
  try {
    const { error } = await sb.from('mensajes_equipo').delete().in('id', ids);
    if (error) throw error;
    mostrarToast('✓ Borrado');
    await cargarMensajes();
  } catch (e) {
    mostrarToast('Error: ' + e.message);
  }
};

// ============= MARCAR COMO LEÍDO =============
// Marca como leídos los mensajes que ME corresponden (destinatario yo, generales, o no míos si soy admin).
// El badge se calcula en el servidor con la misma lógica.
async function marcarTodosLeidosSilenciosamente() {
  const meCorresponde = (m) =>
    m.autor_persona_id !== yo.id && (
      esAdmin
      || m.destinatario_persona_id === yo.id
      || m.destinatario_persona_id == null
    );
  const sinLeer = mensajes
    .filter(m => !leidasPorMi.has(m.id) && meCorresponde(m))
    .map(m => ({ mensaje_id: m.id, persona_id: yo.id }));
  if (!sinLeer.length) return;
  try {
    await sb.from('mensajes_lecturas').upsert(sinLeer, { onConflict: 'mensaje_id,persona_id', ignoreDuplicates: true });
    sinLeer.forEach(r => leidasPorMi.add(r.mensaje_id));
    // Avisar al padre (app.html) para que actualice el badge
    try { parent.postMessage({ tipo: 'MENSAJES_LEIDOS' }, '*'); } catch (e) {}
  } catch (e) {
    console.warn('No se pudo marcar lecturas:', e);
  }
}

// ============= HELPERS =============
function inicialesDe(nombre) {
  const partes = String(nombre || '').trim().split(/\s+/).filter(Boolean);
  if (!partes.length) return '?';
  if (partes.length === 1) return partes[0].substring(0,2).toUpperCase();
  return (partes[0][0] + partes[partes.length-1][0]).toUpperCase();
}

function escapeHtml(s) {
  return String(s || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function linkify(s) {
  return s.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
}

function formatearFecha(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d)) return '—';
  const hoy = new Date();
  const ayer = new Date(); ayer.setDate(hoy.getDate() - 1);
  const isoFecha = d.toISOString().slice(0,10);
  const hoyISO = hoy.toISOString().slice(0,10);
  const ayerISO = ayer.toISOString().slice(0,10);
  const hora = d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  if (isoFecha === hoyISO) return `Hoy · ${hora}`;
  if (isoFecha === ayerISO) return `Ayer · ${hora}`;
  // Más antiguo: DD/MM HH:MM
  return `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()} · ${hora}`;
}

function mostrarToast(texto) {
  const t = document.getElementById('toast');
  t.textContent = texto;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

init();
