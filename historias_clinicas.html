    // ===== Anamnesis nutricional (Peso / Talla / IMC / % Grasa + clasificaciones) =====
    if (hc.peso && hc.altura) {
      const peso = Number(hc.peso);
      const alturaM = Number(hc.altura) < 3 ? Number(hc.altura) : Number(hc.altura) / 100; // detecta metros o cm
      const imc = alturaM > 0 ? peso / (alturaM * alturaM) : null;
      const grasa = (hc.grasa_corporal !== null && hc.grasa_corporal !== undefined && hc.grasa_corporal !== '') ? Number(hc.grasa_corporal) : null;
      let edad = null;

      const num1 = (n) => (Math.round(n * 10) / 10).toString().replace('.', ',');

      tituloSeccion('Anamnesis nutricional');

      // Cajitas resumen: Peso / Talla / IMC / % Grasa
      checkPage(44);

      if (grasa !== null) cajas.push(['% Grasa', num1(grasa) + ' %']);
      const cajaW = (CONTENT_W - 8 * (cajas.length - 1)) / cajas.length;

      // Tabla de IMC (OMS) con la fila de la persona resaltada
      const filasIMC = [

        checkPage(40);

        doc.text('Mujeres: ' + clasif(grasa, umbM) + '       Hombres: ' + clasif(grasa, umbH), MARGIN, y); y += 14;

    // Convierte true/false a Sí/No y deja pasar textos y números tal cual

  // ====== OBSERVACIONES DEL PROFESIONAL (las elegidas) ======

  const incCargaDep = document.getElementById('pdfIncluirCargaDep')?.checked;

  // ====== COMPETENCIAS Y EVENTOS ======
  const incComps = document.getElementById('pdfIncluirComps')?.checked;

  if (incComps && compsPDF.length) {

  // ====== BITÁCORA (fatiga / dolor) ======
  const incBit = document.getElementById('pdfIncluirBit')?.checked;

  if (incBit && bitPDF.length) {

  // ====== ADJUNTOS (lista en la HC) ======
  if (adjElegidos.length) {
    tituloSeccion('Archivos adjuntos');
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(9.5);
    doc.setTextColor(60, 60, 60);
    adjElegidos.forEach(a => {
      checkPage(16);
      doc.text(`•  ${a.nombre_original}  (${formatTamano(a.tamano_bytes)})`, MARGIN + 8, y);
      y += 15;
    });
    y += 4;
    checkPage(28);
    doc.setFontSize(8.5);
    doc.setTextColor(...GRIS);
    const nota = doc.splitTextToSize('Los archivos adjuntos (estudios, RX, evaluaciones VALD) están incluidos al final de este documento.', CONTENT_W - 8);
    doc.text(nota, MARGIN + 8, y);
    y += nota.length * 11;
  }

  pieDePagina();

  // Nombre de archivo limpio
  // Nombre del archivo: "Evaluación NOMBRE APELLIDO.pdf" (con espacios, sin guiones bajos)
  const nombreLimpio = (persona?.nombre || 'paciente').replace(/[\\/:*?"<>|]/g, '').trim();
  const nombreArch = `Evaluación ${nombreLimpio}.pdf`;

  // ====== UNIR TODO EN UN SOLO PDF ======
  // Si hay adjuntos elegidos, los descargamos del storage y los unimos al final
  // del PDF de la HC: los PDF se anexan página por página (pdf-lib) y las imágenes
  // se pegan cada una en su página. Resultado: UN solo archivo para el paciente.
  if (adjElegidos.length && window.PDFLib) {
    mostrarCargandoPDF('Uniendo archivos… esto puede tardar unos segundos.');
    try {
      const { PDFDocument } = window.PDFLib;
      // 1) Partimos del PDF de la HC ya armado
      const hcBytes = doc.output('arraybuffer');
      const mergedPdf = await PDFDocument.load(hcBytes);

      // 2) Recorremos cada adjunto, lo bajamos del storage y lo anexamos
      for (const adj of adjElegidos) {
        try {
          const { data: signed, error: sErr } = await sb.storage.from(ADJ_BUCKET)
            .createSignedUrl(adj.storage_path, 60 * 5);
          if (sErr) throw sErr;
          const resp = await fetch(signed.signedUrl);
          const bytes = await resp.arrayBuffer();
          const mime = (adj.tipo_mime || '').toLowerCase();
          const nombre = (adj.nombre_original || '').toLowerCase();

          if (mime.includes('pdf') || nombre.endsWith('.pdf')) {
            // Anexar todas las páginas del PDF adjunto
            const adjuntoPdf = await PDFDocument.load(bytes, { ignoreEncryption: true });
            const paginas = await mergedPdf.copyPages(adjuntoPdf, adjuntoPdf.getPageIndices());
            paginas.forEach(p => mergedPdf.addPage(p));
          } else if (mime.startsWith('image/') || /\.(jpg|jpeg|png)$/.test(nombre)) {
            // Pegar la imagen en una página nueva, centrada y escalada
            let img;
            if (mime.includes('png') || nombre.endsWith('.png')) {
              img = await mergedPdf.embedPng(bytes);
            } else {
              img = await mergedPdf.embedJpg(bytes);
            }
            const pagina = mergedPdf.addPage([595.28, 841.89]); // A4 en pt
            const margen = 40;
            const maxW = pagina.getWidth() - margen * 2;
            const maxH = pagina.getHeight() - margen * 2;
            const escala = Math.min(maxW / img.width, maxH / img.height, 1);
            const w = img.width * escala;
            const h = img.height * escala;
            pagina.drawImage(img, {
              x: (pagina.getWidth() - w) / 2,
              y: (pagina.getHeight() - h) / 2,
              width: w, height: h
            });
          } else {
            // Tipo no soportado para incrustar (ej: .docx, .xlsx): lo dejamos listado nomás
            console.warn('Adjunto no incrustable en PDF:', adj.nombre_original);
          }
        } catch (eAdj) {
          console.warn('No se pudo unir el adjunto', adj.nombre_original, eAdj.message);
        }
      }

      // 3) Guardar el PDF final único y descargarlo
      const finalBytes = await mergedPdf.save();
      if (!window.__batchMode) descargarBytesPDF(finalBytes, nombreArch);
      ocultarCargandoPDF();
      if (subirEspacio) await guardarEvalEnEspacio(finalBytes, nombreArch, currentHCId, hc.persona_id);
    } catch (e) {
      ocultarCargandoPDF();
      console.error('Error al unir adjuntos:', e);
      // Si algo falla al unir, igual entregamos la HC sola para no dejar a Lu sin nada
      if (window.__batchMode) { throw e; }
      doc.save(nombreArch);
      alert('Se generó el PDF de la historia clínica, pero hubo un problema al unir algún adjunto (puede ser muy pesado o estar protegido). El PDF de la HC se descargó igual; los adjuntos podés enviarlos aparte.');
    }
  } else {
    // Sin adjuntos: PDF normal
    if (!window.__batchMode) doc.save(nombreArch);
    if (subirEspacio) await guardarEvalEnEspacio(doc.output('arraybuffer'), nombreArch, currentHCId, hc.persona_id);
  }

  cerrarSelectorPDF();

  // Si se pidió enviar por WhatsApp: abrir el chat del paciente con un mensaje listo.
  if (conWhatsApp) {
    const cel = (persona?.celular || '').replace(/\D/g, '');
    const primer = (persona?.nombre || '').split(' ')[0] || '';
    if (!cel) {
      showToast('✓ PDF descargado (sin celular para WhatsApp)');
      alert('El PDF se descargó, pero esta persona no tiene celular cargado para abrir WhatsApp. Adjuntalo manualmente.');
      return;
    }
    let num = cel;
    if (num.startsWith('0')) num = num.substring(1);
    if (!num.startsWith('54')) num = '549' + num;
    const msg = encodeURIComponent(`Hola ${primer}! Te enviamos tu historia clínica de PuntoBiO 📋\n\nEl archivo PDF que se acaba de descargar adjuntalo acá. Cualquier duda quedamos a disposición.\n\nPuntoBiO · Centro de Rehabilitación y Entrenamiento`);
    setTimeout(() => {
      window.open(`https://wa.me/${num}?text=${msg}`, '_blank');
    }, 700);
    showToast('✓ PDF descargado — adjuntalo en el WhatsApp que se abrió');
  } else {
    if (!window.__batchMode) showToast('✓ PDF generado');
  }
}

// Descarga un PDF a partir de bytes (Uint8Array) — usado para el PDF unido
function descargarBytesPDF(bytes, nombre) {
  const blob = new Blob([bytes], { type: 'application/pdf' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = nombre;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

// Cartelito de "uniendo archivos…" mientras se procesan los adjuntos
function mostrarCargandoPDF(texto) {
  let el = document.getElementById('pdfCargando');
  if (!el) {
    el = document.createElement('div');
    el.id = 'pdfCargando';
    el.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:10000; display:flex; align-items:center; justify-content:center;';
    el.innerHTML = `<div style="background:#fff; padding:28px 32px; border-radius:14px; text-align:center; max-width:340px;">
      <div class="loader" style="margin:0 auto 14px;"></div>
      <div id="pdfCargandoTxt" style="font-size:14px; color:#111;">${escapeHtml(texto || 'Generando…')}</div>
    </div>`;
    document.body.appendChild(el);
  } else {
    document.getElementById('pdfCargandoTxt').textContent = texto || 'Generando…';
    el.style.display = 'flex';
  }
}
function ocultarCargandoPDF() {
  const el = document.getElementById('pdfCargando');
  if (el) el.remove();
}
</script>
