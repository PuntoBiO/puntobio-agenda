<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PuntoBiO · Comunicados masivos</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg-deep:#f1f5f9;--bg-card:#fff;--bg-soft:#f8fafc;--border:#e5e7eb;
  --turquoise:#1e9fe0;--turquoise-dim:#0c7bb8;--text:#0f172a;--text-dim:#64748b;--text-faint:#94a3b8;
  --green:#16a34a;--green-bg:#dcfce7;--amber:#d97706;--amber-bg:#fef3c7;--red:#dc2626;--red-bg:#fee2e2;--blue-bg:#dbeafe;
}
*{box-sizing:border-box}
body{font-family:'Manrope',system-ui,sans-serif;background:var(--bg-deep);color:var(--text);margin:0;padding:24px 32px 80px;min-height:100vh}
h1{font-size:24px;margin:0 0 4px;display:flex;align-items:center;gap:10px}
.sub{color:var(--text-dim);font-size:14px;margin:0 0 24px}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:22px;max-width:760px;box-shadow:0 1px 3px rgba(0,0,0,.05);margin-bottom:22px}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.card-title{font-size:18px;font-weight:800;margin:0}
.card-desc{font-size:13.5px;color:var(--text-dim);margin:4px 0 0;line-height:1.5}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:4px 12px;background:var(--blue-bg);color:var(--turquoise-dim);white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}
.kpi{background:var(--bg-soft);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center}
.kpi .n{font-size:26px;font-weight:800;line-height:1}
.kpi .l{font-size:12px;color:var(--text-dim);margin-top:4px}
.kpi.ok .n{color:var(--green)}
.kpi.pend .n{color:var(--amber)}
.bar{height:10px;border-radius:6px;background:#e2e8f0;overflow:hidden;margin:4px 0 18px}
.bar > i{display:block;height:100%;background:var(--turquoise);border-radius:6px;transition:width .3s}
.acciones{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--border);padding-top:16px}
.acciones label{font-size:13px;color:var(--text-dim)}
.acciones input[type=number]{width:72px;padding:8px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:14px;text-align:center}
.btn{background:var(--turquoise);color:#fff;border:none;border-radius:10px;padding:12px 20px;font-family:inherit;font-size:14.5px;font-weight:800;cursor:pointer;box-shadow:0 6px 16px rgba(30,159,224,.25);transition:transform .12s,filter .12s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.05)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn.sec{background:transparent;color:var(--text-dim);border:1.5px solid var(--border);box-shadow:none}
.btn.danger{background:transparent;color:var(--red);border:1.5px solid #fecaca;box-shadow:none}
.res{margin-top:14px;font-size:13.5px;padding:12px 14px;border-radius:10px;display:none}
.res.show{display:block}
.res.ok{background:var(--green-bg);color:#166534}
.res.err{background:var(--red-bg);color:#991b1b}
.det{margin-top:18px}
.det summary{cursor:pointer;font-size:13.5px;font-weight:700;color:var(--turquoise-dim);list-style:none}
.det summary::-webkit-details-marker{display:none}
.lista{margin-top:10px;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.lista-scroll{max-height:360px;overflow:auto}
.fila .idx{color:var(--text-faint);font-variant-numeric:tabular-nums;margin-right:8px}
.fila{display:flex;justify-content:space-between;gap:8px;padding:9px 14px;font-size:13px;border-bottom:1px solid #f1f5f9}
.fila:last-child{border-bottom:none}
.fila .r{color:var(--text-dim)}
.warn{background:var(--amber-bg);color:#92400e;border-radius:10px;padding:12px 14px;font-size:13px;margin-top:14px}
.preview{background:var(--bg-soft);border:1px solid var(--border);border-radius:10px;padding:14px;font-size:13.5px;line-height:1.6;color:#334155;margin-top:10px}
.preview b{color:var(--text)}
.lock{max-width:520px;background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:28px;text-align:center;color:var(--text-dim)}
.muted{color:var(--text-faint);font-size:12.5px}
/* ── Armador de comunicados ── */
.f-row{margin-bottom:14px}
.f-row label{display:block;font-size:12.5px;font-weight:700;color:var(--text-dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
.f-row input[type=text], .f-row textarea, .f-row select{width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:10px;font-family:inherit;font-size:14.5px}
.f-row textarea{min-height:120px;resize:vertical;line-height:1.55}
.aud-opts{display:flex;gap:8px;flex-wrap:wrap}
.aud-opt{flex:1;min-width:170px;border:1.5px solid var(--border);border-radius:12px;padding:12px;cursor:pointer;font-size:13.5px;background:var(--bg-soft);transition:border-color .12s}
.aud-opt.sel{border-color:var(--turquoise);background:#eaf6fd;font-weight:700}
.aud-opt small{display:block;color:var(--text-dim);font-weight:400;margin-top:3px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{background:#eaf6fd;color:var(--turquoise-dim);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.chip b{cursor:pointer}
.buscador-res{border:1px solid var(--border);border-radius:10px;margin-top:6px;max-height:200px;overflow:auto;display:none}
.buscador-res div{padding:8px 12px;font-size:13.5px;cursor:pointer;border-bottom:1px solid #f1f5f9}
.buscador-res div:hover{background:var(--bg-soft)}
.dest-box{background:var(--bg-soft);border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-size:13.5px;margin-top:8px}
</style>
</head>
<body>
  <h1>📢 Comunicados masivos</h1>
  <p class="sub">Armá el mail, elegí a quién, y mandalo por tandas sin pasarte del límite diario.</p>

  <div id="tope-global"></div>
  <div id="nuevo"></div>
  <div id="campanias"></div>
  <div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://bqpjtoiictnzcasxfucf.supabase.co'
const SUPABASE_KEY = 'sb_publishable_yvuXDxrkRrhXwmZBnE_a_Q_zDBz0iDi'
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { lock: (name, acquireTimeout, fn) => fn() } })

// Quién puede usar comunicados (administración). Si querés sumar a alguien, agregá su mail.
const ADMINS = [
  'liclucianavelaz@gmail.com',   // Lu
  'jimenahllorente@gmail.com',   // Jime
  'paukappes@gmail.com',         // Pau
  'alejandraperna@gmail.com'     // Ale
]

const $ = id => document.getElementById(id)
let adminEmail = null
let estActual = null
let comsHoy = 0                 // mails de comunicados enviados HOY (para el tope compartido)
const TOPE_DIARIO = 70          // máximo de mails por día ENTRE TODO (aumento + comunicados)
const fmt$ = n => '$' + Math.round(Number(n)||0).toLocaleString('es-AR')
const esc = s => String(s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))
const fechaAR = d => new Intl.DateTimeFormat('en-CA',{timeZone:'America/Argentina/Cordoba',year:'numeric',month:'2-digit',day:'2-digit'}).format(d)
const esHoyAR = ts => { if(!ts) return false; try { return fechaAR(new Date(ts)) === fechaAR(new Date()) } catch(_){ return false } }
const hoyISO = () => fechaAR(new Date())
const fmtDMA = iso => iso ? iso.split('-').reverse().join('/') : ''

// ─────────────────────────────────────────────────────────────
//  TOPE DIARIO COMPARTIDO (aumento + comunicados)
// ─────────────────────────────────────────────────────────────
function enviadosHoyTotal(){ return (estActual ? estActual.enviadosHoy : 0) + comsHoy }
function restanteHoy(){ return Math.max(0, TOPE_DIARIO - enviadosHoyTotal()) }
function renderTope(){
  const tot = enviadosHoyTotal(), rest = restanteHoy()
  $('tope-global').innerHTML = tot > 0
    ? `<div class="warn" style="max-width:760px;background:${rest>0?'#eff6ff':'var(--amber-bg)'};color:${rest>0?'#1e40af':'#92400e'};border:1px solid ${rest>0?'#bfdbfe':'#fde68a'}">
        ${rest>0 ? `📮 Hoy llevás <b>${tot}</b> mails enviados (entre todas las campañas). Te quedan <b>${rest}</b>.`
                 : `🛑 Ya llegaste al tope diario de <b>${TOPE_DIARIO}</b> mails. Seguí mañana para no caer en spam.`}
      </div>`
    : ''
}

// ─────────────────────────────────────────────────────────────
//  ALUMNOS ACTIVOS (base para todas las audiencias)
// ─────────────────────────────────────────────────────────────
let ACTIVOS = null   // [{id,nombre,email,plan}] con mail válido, sin equipo, sin baja
async function cargarActivos(){
  if (ACTIVOS) return ACTIVOS
  const { data: insc } = await sb.from('inscripciones_tf')
    .select('persona_id, plan, estado').in('estado', ['ACTIVO','BONIFICADO'])
  const ids = Array.from(new Set((insc||[]).map(i => i.persona_id)))
  const planPor = {}; (insc||[]).forEach(i => { if(!planPor[i.persona_id]) planPor[i.persona_id] = i.plan })
  let personas = []
  for (let i = 0; i < ids.length; i += 400) {           // in() por tandas para no pasarnos de URL
    const { data } = await sb.from('personas')
      .select('id, nombre, email, mail, es_equipo, estado').in('id', ids.slice(i, i+400))
    personas = personas.concat(data || [])
  }
  ACTIVOS = personas
    .filter(p => !p.es_equipo && !/baja/i.test(String(p.estado||'')))
    .map(p => ({ id: p.id, nombre: p.nombre || '(sin nombre)',
                 email: (String(p.email||'').trim() || String(p.mail||'').trim()),
                 plan: planPor[p.id] || '' }))
    .sort((a,b) => a.nombre.localeCompare(b.nombre))
  return ACTIVOS
}

// ─────────────────────────────────────────────────────────────
//  EVENTOS DE CIERRE (feriados futuros + bloqueos día completo)
// ─────────────────────────────────────────────────────────────
async function cargarEventosCierre(){
  const hoy = hoyISO()
  const eventos = []
  const { data: fers } = await sb.from('feriados').select('fecha, motivo, tipo').gte('fecha', hoy).order('fecha')
  ;(fers||[]).forEach(f => eventos.push({ fechas: [f.fecha], label: `${fmtDMA(f.fecha)} · ${f.motivo || 'Feriado'}` }))
  const { data: blq } = await sb.from('bloqueos_agenda')
    .select('id, area, motivo, fecha_desde, fecha_hasta, hora_desde, activo')
    .eq('activo', true).in('area', ['TF','TRANSVERSAL']).gte('fecha_hasta', hoy)
  ;(blq||[]).forEach(b => {
    if (b.hora_desde) return                                  // franja: no cierra el día
    const fechas = []
    let f = b.fecha_desde, guard = 0
    while (f <= (b.fecha_hasta || b.fecha_desde) && guard < 62) {
      const [y,m,d] = f.split('-').map(Number)
      const dow = new Date(Date.UTC(y,m-1,d)).getUTCDay()
      if (dow >= 1 && dow <= 5 && f >= hoy) fechas.push(f)
      const dt = new Date(Date.UTC(y,m-1,d)); dt.setUTCDate(dt.getUTCDate()+1)
      f = dt.toISOString().slice(0,10); guard++
    }
    if (fechas.length) eventos.push({ fechas, label: `${fechas.map(fmtDMA).join(', ')} · ${b.motivo || 'Cierre del centro'}` })
  })
  return eventos
}

// Alumnos con clase fija ese/esos día(s) de la semana + agregados puntuales de esas fechas
async function afectadosPorFechas(fechas){
  const DIAS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado']
  const sinAc = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  const nombresDia = new Set()
  fechas.forEach(f => {
    const [y,m,d] = f.split('-').map(Number)
    const n = DIAS[new Date(Date.UTC(y,m-1,d)).getUTCDay()]
    nombresDia.add(n); nombresDia.add(sinAc(n))
  })
  const { data: turnos } = await sb.from('turnos').select('id, dia').in('dia', Array.from(nombresDia))
  const turnoIds = (turnos||[]).map(t => t.id)
  if (!turnoIds.length) return new Set()
  const [taRes, agRes] = await Promise.all([
    sb.from('turno_alumnos').select('persona_id').eq('activo', true).in('turno_id', turnoIds),
    sb.from('turno_agregados').select('persona_id, fecha').in('fecha', fechas)
  ])
  const set = new Set()
  ;(taRes.data||[]).forEach(r => set.add(r.persona_id))
  ;(agRes.data||[]).forEach(r => set.add(r.persona_id))
  return set
}

// ─────────────────────────────────────────────────────────────
//  ARMADOR DE COMUNICADO NUEVO
// ─────────────────────────────────────────────────────────────
let audiencia = 'todos'          // 'todos' | 'cierre' | 'manual'
let seleccionManual = []         // [{id,nombre}]
let destinatariosCalc = null     // { ids:[], sinMail:n, desc:'' }
let eventosCierre = []

function renderNuevo(){
  // Conservar lo que ya se escribió (el form se redibuja al agregar/quitar personas o cambiar audiencia)
  const vAsunto = $('nc-asunto') ? $('nc-asunto').value : ''
  const vCuerpo = $('nc-cuerpo') ? $('nc-cuerpo').value : ''
  $('nuevo').innerHTML = `
    <div class="card">
      <div class="card-top">
        <div>
          <p class="card-title">✍️ Nuevo comunicado</p>
          <p class="card-desc">Escribí el mail y elegí a quién va. Podés usar <b>{nombre}</b> para personalizar y <b>*asteriscos*</b> para negrita. Siempre va a alumnos <b>activos</b>.</p>
        </div>
        <span class="pill">Mail · tandas de hasta ${TOPE_DIARIO}/día</span>
      </div>

      <div class="f-row" style="margin-top:16px">
        <label>Asunto</label>
        <input type="text" id="nc-asunto" placeholder="Ej: PuntoBiO — Aviso importante">
      </div>
      <div class="f-row">
        <label>Mensaje</label>
        <textarea id="nc-cuerpo" placeholder="Hola {nombre}, te contamos que..."></textarea>
      </div>

      <div class="f-row">
        <label>¿A quién va?</label>
        <div class="aud-opts">
          <div class="aud-opt ${audiencia==='todos'?'sel':''}" data-aud="todos">👥 Todos los activos<small>Todo el padrón activo (por tandas)</small></div>
          <div class="aud-opt ${audiencia==='cierre'?'sel':''}" data-aud="cierre">🚧 Afectados por un cierre/feriado<small>Los que tienen clase ese día</small></div>
          <div class="aud-opt ${audiencia==='manual'?'sel':''}" data-aud="manual">🎯 Elegir personas<small>Buscás y marcás a quién</small></div>
        </div>
      </div>

      <div class="f-row" id="nc-cierre-row" style="display:${audiencia==='cierre'?'block':'none'}">
        <label>Cierre / feriado</label>
        <select id="nc-evento">${eventosCierre.map((e,i)=>`<option value="${i}">${esc(e.label)}</option>`).join('') || '<option value="">(no hay cierres ni feriados próximos)</option>'}</select>
      </div>

      <div class="f-row" id="nc-manual-row" style="display:${audiencia==='manual'?'block':'none'}">
        <label>Buscar alumno</label>
        <input type="text" id="nc-buscar" placeholder="Escribí un nombre..." autocomplete="off">
        <div class="buscador-res" id="nc-buscar-res"></div>
        <div class="chips" id="nc-chips">${seleccionManual.map(p=>`<span class="chip">${esc(p.nombre)} <b data-quitar="${p.id}">✕</b></span>`).join('')}</div>
      </div>

      <div class="acciones">
        <button class="btn sec" id="nc-calcular">👁️ Ver destinatarios</button>
        <button class="btn" id="nc-crear" disabled>Crear comunicado</button>
        <button class="btn sec" id="nc-prueba">✉️ Enviarme una prueba</button>
      </div>
      <div class="dest-box" id="nc-dest" style="display:none"></div>
      <div class="res" id="nc-res"></div>
    </div>`

  document.querySelectorAll('.aud-opt').forEach(el => el.onclick = () => {
    audiencia = el.dataset.aud; destinatariosCalc = null; renderNuevo()
  })
  // Restaurar lo escrito
  $('nc-asunto').value = vAsunto
  $('nc-cuerpo').value = vCuerpo
  $('nc-calcular').onclick = calcularDestinatarios
  $('nc-crear').onclick = crearComunicado
  $('nc-prueba').onclick = pruebaNuevo
  const buscar = $('nc-buscar')
  if (buscar) {
    buscar.oninput = async () => {
      const q = buscar.value.trim().toLowerCase()
      const box = $('nc-buscar-res')
      if (q.length < 2) { box.style.display = 'none'; return }
      const act = await cargarActivos()
      const yaIds = new Set(seleccionManual.map(p => p.id))
      const hits = act.filter(p => p.nombre.toLowerCase().includes(q) && !yaIds.has(p.id)).slice(0, 12)
      box.innerHTML = hits.map(p => `<div data-add="${p.id}">${esc(p.nombre)} <span class="muted">· ${esc(p.plan)}${p.email?'':' · ⚠️ sin mail'}</span></div>`).join('') || '<div class="muted" style="padding:8px 12px">Sin resultados entre los activos.</div>'
      box.style.display = 'block'
      box.querySelectorAll('[data-add]').forEach(d => d.onclick = () => {
        const p = act.find(x => x.id === +d.dataset.add)
        if (p) seleccionManual.push({ id: p.id, nombre: p.nombre })
        destinatariosCalc = null; renderNuevo(); $('nc-buscar').focus()
      })
    }
  }
  document.querySelectorAll('[data-quitar]').forEach(b => b.onclick = () => {
    seleccionManual = seleccionManual.filter(p => p.id !== +b.dataset.quitar)
    destinatariosCalc = null; renderNuevo()
  })
}

async function calcularDestinatarios(){
  const res = $('nc-res'); res.className = 'res'; res.textContent = ''
  const box = $('nc-dest'); box.style.display = 'block'
  box.innerHTML = '<span class="muted">Calculando destinatarios…</span>'
  try {
    const act = await cargarActivos()
    let elegidos = [], desc = ''
    if (audiencia === 'todos') {
      elegidos = act; desc = 'Todos los alumnos activos'
    } else if (audiencia === 'cierre') {
      const i = $('nc-evento') ? $('nc-evento').value : ''
      const ev = eventosCierre[+i]
      if (!ev) throw new Error('Elegí un cierre o feriado de la lista')
      const setAf = await afectadosPorFechas(ev.fechas)
      elegidos = act.filter(p => setAf.has(p.id))
      desc = 'Afectados por: ' + ev.label
    } else {
      if (!seleccionManual.length) throw new Error('Buscá y elegí al menos una persona')
      const ids = new Set(seleccionManual.map(p => p.id))
      elegidos = act.filter(p => ids.has(p.id))
      desc = 'Selección manual (' + elegidos.length + ')'
    }
    const conMail = elegidos.filter(p => p.email && p.email.includes('@'))
    const sinMail = elegidos.length - conMail.length
    destinatariosCalc = { ids: conMail.map(p => p.id), sinMail, desc }
    box.innerHTML = `<b>${conMail.length}</b> destinatarios con mail${sinMail ? ` · <span style="color:var(--amber)">${sinMail} sin mail (no reciben)</span>` : ''} · <span class="muted">${esc(desc)}</span>`
      + `<details class="det"><summary>Ver lista</summary><div class="lista"><div class="lista-scroll">${conMail.map((p,i)=>`<div class="fila"><span><span class="idx">${i+1}.</span>${esc(p.nombre)}</span><span class="r">${esc(p.email)}</span></div>`).join('')}</div></div></details>`
    $('nc-crear').disabled = conMail.length === 0
  } catch (e) {
    box.style.display = 'none'
    res.className = 'res show err'; res.textContent = '❌ ' + (e.message || e)
  }
}

async function crearComunicado(){
  const res = $('nc-res'); res.className = 'res'; res.textContent = ''
  const asunto = $('nc-asunto').value.trim()
  const cuerpo = $('nc-cuerpo').value.trim()
  if (!asunto || !cuerpo) { res.className='res show err'; res.textContent='❌ Falta el asunto o el mensaje.'; return }
  if (!destinatariosCalc || !destinatariosCalc.ids.length) { res.className='res show err'; res.textContent='❌ Primero tocá "Ver destinatarios".'; return }
  const btn = $('nc-crear'); btn.disabled = true; btn.textContent = 'Creando…'
  try {
    const { error } = await sb.from('comunicados').insert({
      asunto, cuerpo,
      audiencia: destinatariosCalc.desc,
      persona_ids: destinatariosCalc.ids,
      creado_por: adminEmail
    })
    if (error) throw error
    // reset del formulario
    audiencia = 'todos'; seleccionManual = []; destinatariosCalc = null
    renderNuevo()
    $('nc-asunto').value = ''; $('nc-cuerpo').value = ''
    const r2 = $('nc-res'); r2.className = 'res show ok'
    r2.innerHTML = '✅ Comunicado creado. Ahora mandalo por tandas desde la tarjeta de abajo. 👇'
    await refrescarCampanias()
  } catch (e) {
    res.className = 'res show err'; res.textContent = '❌ No se pudo crear: ' + (e.message || e)
    btn.disabled = false; btn.textContent = 'Crear comunicado'
  }
}

async function pruebaNuevo(){
  const res = $('nc-res'); const btn = $('nc-prueba')
  const asunto = $('nc-asunto').value.trim(), cuerpo = $('nc-cuerpo').value.trim()
  if (!asunto || !cuerpo) { res.className='res show err'; res.textContent='❌ Escribí el asunto y el mensaje primero.'; return }
  btn.disabled = true; const t = btn.textContent; btn.textContent = 'Enviando…'
  res.className = 'res'; res.textContent = ''
  try {
    const { data, error } = await sb.functions.invoke('comunicado-mail', { body: { test_email: adminEmail, asunto, cuerpo } })
    if (error) throw error
    res.className = 'res show ok'
    res.innerHTML = data && data.ok ? `✅ Prueba enviada a <b>${esc(adminEmail)}</b>. Revisá tu casilla.` : '⚠️ La función respondió pero el mail no salió.'
  } catch (e) {
    res.className = 'res show err'; res.textContent = '❌ ' + (e.message || e)
  } finally { btn.disabled = false; btn.textContent = t }
}

// ─────────────────────────────────────────────────────────────
//  CAMPAÑAS EN CURSO (comunicados creados)
// ─────────────────────────────────────────────────────────────
async function refrescarCampanias(){
  const [comsRes, envRes] = await Promise.all([
    sb.from('comunicados').select('id, asunto, cuerpo, audiencia, persona_ids, creado_en, cerrado').eq('cerrado', false).order('creado_en', { ascending: false }),
    sb.from('comunicados_enviados').select('comunicado_id, persona_id, enviado_en')
  ])
  const envs = envRes.data || []
  comsHoy = envs.filter(e => esHoyAR(e.enviado_en)).length
  renderTope()
  const porCom = {}
  envs.forEach(e => { (porCom[e.comunicado_id] = porCom[e.comunicado_id] || new Set()).add(e.persona_id) })

  const coms = comsRes.data || []
  $('campanias').innerHTML = coms.map(c => {
    const total = (c.persona_ids || []).length
    const hechos = (porCom[c.id] ? porCom[c.id].size : 0)
    const faltan = Math.max(0, total - hechos)
    const pct = total ? Math.round(hechos / total * 100) : 0
    const rest = restanteHoy()
    const puede = faltan > 0 && rest > 0
    const valorLote = Math.max(1, Math.min(rest || 1, faltan || 1))
    return `
    <div class="card">
      <div class="card-top">
        <div>
          <p class="card-title">📨 ${esc(c.asunto)}</p>
          <p class="card-desc">${esc(c.audiencia || '')} · creado el ${fmtDMA(String(c.creado_en).slice(0,10))}</p>
        </div>
        ${faltan === 0 ? '<span class="pill" style="background:var(--green-bg);color:#166534">Completo 🎉</span>' : ''}
      </div>
      <div class="kpis">
        <div class="kpi ok"><div class="n">${hechos}</div><div class="l">Enviados</div></div>
        <div class="kpi pend"><div class="n">${faltan}</div><div class="l">Faltan</div></div>
        <div class="kpi"><div class="n">${total}</div><div class="l">Total</div></div>
      </div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="acciones">
        <label>Enviar de a</label>
        <input type="number" id="lote-${c.id}" min="1" max="${rest || 1}" value="${valorLote}" ${puede ? '' : 'disabled'}>
        <button class="btn" data-enviar="${c.id}" ${puede ? '' : 'disabled'}>Enviar el próximo lote</button>
        <button class="btn sec" data-prueba="${c.id}">✉️ Prueba</button>
        ${faltan === 0 ? `<button class="btn sec" data-cerrar="${c.id}">✔ Dar por terminado</button>` : `<button class="btn danger" data-cerrar="${c.id}">Archivar</button>`}
      </div>
      <div class="res" id="res-${c.id}"></div>
      <details class="det"><summary>Ver el texto que se envía</summary>
        <div class="preview"><b>Asunto:</b> ${esc(c.asunto)}<br><br>${esc(c.cuerpo).replace(/\n/g,'<br>')}</div>
      </details>
    </div>`
  }).join('') || ''

  document.querySelectorAll('[data-enviar]').forEach(b => b.onclick = () => enviarLoteCom(+b.dataset.enviar))
  document.querySelectorAll('[data-prueba]').forEach(b => b.onclick = () => pruebaCom(+b.dataset.prueba))
  document.querySelectorAll('[data-cerrar]').forEach(b => b.onclick = () => cerrarCom(+b.dataset.cerrar))
}

async function enviarLoteCom(id){
  const rest = restanteHoy()
  const res = $('res-' + id)
  if (rest <= 0) { res.className='res show err'; res.textContent = `🛑 Ya llegaste al tope de ${TOPE_DIARIO} mails por hoy. Seguí mañana.`; return }
  let n = Math.max(1, Math.min(100, parseInt($('lote-' + id).value) || rest))
  n = Math.min(n, rest)
  res.className = 'res show'; res.style.background='var(--bg-soft)'; res.textContent = 'Enviando…'
  try {
    const { data, error } = await sb.functions.invoke('comunicado-mail', { body: { comunicado_id: id, limit: n } })
    if (error) throw error
    res.className = 'res show ok'; res.style.background=''
    res.innerHTML = `✅ Enviados: <b>${data.enviados}</b>${data.errores ? ` · con error: ${data.errores}` : ''} · faltan: <b>${data.restantes_sin_enviar}</b>.`
      + (data.fallidos && data.fallidos.length ? `<br><span class="muted">No salieron: ${esc(data.fallidos.join(', '))}</span>` : '')
  } catch (e) {
    res.className = 'res show err'; res.style.background=''
    res.textContent = '❌ No se pudo enviar: ' + (e.message || e) + '. Verificá que la función "comunicado-mail" esté deployada.'
  } finally {
    await refrescarCampanias()
  }
}

async function pruebaCom(id){
  const res = $('res-' + id)
  res.className = 'res show'; res.style.background='var(--bg-soft)'; res.textContent = 'Enviando prueba…'
  try {
    const { data, error } = await sb.functions.invoke('comunicado-mail', { body: { test_email: adminEmail, comunicado_id: id } })
    if (error) throw error
    res.className = 'res show ok'; res.style.background=''
    res.innerHTML = data && data.ok ? `✅ Prueba enviada a <b>${esc(adminEmail)}</b>.` : '⚠️ No salió la prueba.'
  } catch (e) { res.className = 'res show err'; res.style.background=''; res.textContent = '❌ ' + (e.message || e) }
}

async function cerrarCom(id){
  if (!confirm('¿Archivar este comunicado? No se van a mandar más lotes.')) return
  await sb.from('comunicados').update({ cerrado: true }).eq('id', id)
  await refrescarCampanias()
}

// ─────────────────────────────────────────────────────────────
//  CAMPAÑA "AUMENTO JULIO 2026" (igual que antes, tope compartido)
// ─────────────────────────────────────────────────────────────
async function cargarEstado(){
  const { data: tar } = await sb.from('tarifario_tf').select('plan, valor_nuevo, aumento_desde')
  const precio = {}
  ;(tar||[]).forEach(t => { if(t.valor_nuevo != null && t.aumento_desde) precio[t.plan] = Number(t.valor_nuevo) })

  const { data: insc } = await sb.from('inscripciones_tf')
    .select('persona_id, plan, estado, dia_vencimiento').eq('estado','ACTIVO')

  const porPersona = {}
  ;(insc||[]).forEach(i => {
    if(!i.plan || /BON/i.test(i.plan)) return
    if(precio[i.plan] == null || precio[i.plan] <= 0) return
    const dia = Number(i.dia_vencimiento) || 99
    if(!porPersona[i.persona_id] || dia < porPersona[i.persona_id].dia)
      porPersona[i.persona_id] = { persona_id:i.persona_id, plan:i.plan, precio:precio[i.plan], dia }
  })

  const ids = Object.keys(porPersona).map(Number)
  let personas = []
  if(ids.length){
    const { data } = await sb.from('personas')
      .select('id, nombre, email, mail, aviso_aumento_jul26_mail').in('id', ids)
    personas = data || []
  }
  const perById = {}; personas.forEach(p => perById[p.id] = p)

  const lista = Object.values(porPersona).map(c => {
    const p = perById[c.persona_id] || {}
    const email = (p.email && String(p.email).trim()) || (p.mail && String(p.mail).trim()) || ''
    return { ...c, nombre:p.nombre || '(sin nombre)', email, emailOk: email.includes('@'), enviado: !!p.aviso_aumento_jul26_mail, mailAt: p.aviso_aumento_jul26_mail || null }
  })

  const conMail   = lista.filter(c => c.emailOk)
  const enviados  = conMail.filter(c => c.enviado).sort((a,b) => new Date(b.mailAt||0) - new Date(a.mailAt||0))
  const pendientes= conMail.filter(c => !c.enviado).sort((a,b) => a.dia - b.dia)
  const sinEmail  = lista.filter(c => !c.emailOk).sort((a,b) => String(a.nombre).localeCompare(b.nombre))
  const enviadosHoy = enviados.filter(c => esHoyAR(c.mailAt)).length
  return { total: conMail.length, enviados, pendientes, sinEmail, enviadosHoy }
}

function fmtFechaCorta(ts){
  if(!ts) return ''
  try {
    const d = new Date(ts)
    return d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'}) + ' ' + d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})
  } catch(_){ return '' }
}

function filaPersona(c, i, derecha){
  return `<div class="fila"><span><span class="idx">${i}.</span>${esc(c.nombre)} · <span class="r">${esc(c.plan)} · ${fmt$(c.precio)}</span></span><span class="r">${derecha}</span></div>`
}

function listaCompleta(items, derechaFn, vacio){
  if(!items.length) return `<div class="lista"><div class="fila"><span class="r">${vacio}</span></div></div>`
  return `<div class="lista"><div class="lista-scroll">${items.map((c,idx)=>filaPersona(c, idx+1, derechaFn(c))).join('')}</div></div>`
}

function render(est){
  estActual = est
  renderTope()
  const pct = est.total ? Math.round(est.enviados.length / est.total * 100) : 0
  const rest = restanteHoy()
  const topeAlcanzado = rest <= 0
  const puedeEnviar = est.pendientes.length > 0 && !topeAlcanzado
  const valorLote = Math.min(TOPE_DIARIO, rest || TOPE_DIARIO, est.pendientes.length || TOPE_DIARIO) || 1
  $('app').innerHTML = `
    <div class="card">
      <div class="card-top">
        <div>
          <p class="card-title">Aumento de cuota · Julio 2026</p>
          <p class="card-desc">Le avisa a cada alumno cuánto pasa a pagar su plan desde julio. Empieza por los que vencen a principio de mes. No repite a nadie. (Bonificados quedan afuera.)</p>
        </div>
        <span class="pill">Mail · lotes de ${TOPE_DIARIO}/día</span>
      </div>

      <div class="kpis">
        <div class="kpi ok"><div class="n">${est.enviados.length}</div><div class="l">Enviados</div></div>
        <div class="kpi pend"><div class="n">${est.pendientes.length}</div><div class="l">Faltan</div></div>
        <div class="kpi"><div class="n">${est.total}</div><div class="l">Total con mail</div></div>
      </div>
      <div class="bar"><i style="width:${pct}%"></i></div>

      <div class="acciones">
        <label>Enviar de a</label>
        <input id="lote" type="number" min="1" max="${rest || 1}" value="${valorLote}" ${puedeEnviar ? '' : 'disabled'}>
        <button class="btn" id="btnEnviar" ${puedeEnviar ? '' : 'disabled'}>Enviar el próximo lote</button>
        <button class="btn sec" id="btnPrueba">✉️ Enviarme una prueba</button>
        <button class="btn sec" id="btnRefrescar">↻ Actualizar</button>
        ${est.pendientes.length ? '' : '<span class="muted">¡Listo! No quedan pendientes 🎉</span>'}
      </div>

      ${topeAlcanzado && est.pendientes.length ? `<div class="warn">🛑 Hoy ya se enviaron <b>${enviadosHoyTotal()}</b> mails entre todas las campañas (tope ${TOPE_DIARIO}). Seguí <b>mañana</b>.</div>` : ''}

      <div class="res" id="res"></div>

      <details class="det">
        <summary>✅ Ya recibieron el mail (${est.enviados.length})</summary>
        ${listaCompleta(est.enviados, c => 'enviado ' + (fmtFechaCorta(c.mailAt) || ''), 'Todavía no se envió a nadie.')}
      </details>

      <details class="det" ${est.pendientes.length ? '' : ''}>
        <summary>⏳ Todavía falta enviarles (${est.pendientes.length})</summary>
        ${listaCompleta(est.pendientes, c => 'vence día ' + (c.dia===99?'—':c.dia), 'No quedan pendientes. 🎉')}
      </details>

      <details class="det">
        <summary>⚠️ Sin email cargado (${est.sinEmail.length})</summary>
        ${listaCompleta(est.sinEmail, () => 'sin mail', 'Todos tienen mail cargado. 👍')}
      </details>

      <details class="det">
        <summary>Ver el texto que se envía</summary>
        <div class="preview">
          <b>Asunto:</b> PuntoBiO — Actualización de tu cuota desde julio<br><br>
          Hola {nombre}, te contamos que <b>a partir del 1 de julio de 2026</b> la cuota de tu plan <b>{plan}</b> pasa a <b>{precio} / mes</b>. Cualquier duda, escribinos. ¡Gracias por ser parte de PuntoBiO! 💙
        </div>
      </details>
    </div>`

  $('btnEnviar').addEventListener('click', enviarLote)
  $('btnPrueba').addEventListener('click', enviarPrueba)
  $('btnRefrescar').addEventListener('click', refrescar)
}

async function refrescar(){
  try {
    await refrescarCampanias()
    render(await cargarEstado())
  }
  catch(e){ $('app').innerHTML = `<div class="lock">No se pudo cargar el estado: ${esc(e.message||e)}</div>` }
}

async function enviarPrueba(){
  const res = $('res'); const btn = $('btnPrueba')
  const txt = btn.textContent; btn.disabled = true; btn.textContent = 'Enviando prueba...'
  res.className = 'res'; res.textContent = ''
  try {
    const { data, error } = await sb.functions.invoke('aviso-aumento-mail', { body: { test_email: adminEmail } })
    if(error) throw error
    res.className = 'res show ok'
    res.innerHTML = data && data.ok
      ? `✅ Te envié un mail de prueba a <b>${esc(adminEmail)}</b>. Revisá tu casilla (y la carpeta de spam por las dudas).`
      : `⚠️ La función respondió pero el mail no salió. Revisá el secret RESEND_API_KEY.`
  } catch(e) {
    res.className = 'res show err'
    res.textContent = '❌ No se pudo enviar la prueba: ' + (e.message || e)
  } finally {
    btn.textContent = txt; btn.disabled = false
  }
}

async function enviarLote(){
  const rest = restanteHoy()
  if(rest <= 0){
    const res = $('res'); res.className = 'res show err'
    res.textContent = `🛑 Ya se enviaron ${enviadosHoyTotal()} mails hoy entre todas las campañas (tope ${TOPE_DIARIO}). Seguí mañana.`
    return
  }
  let n = Math.max(1, Math.min(100, parseInt($('lote').value) || TOPE_DIARIO))
  n = Math.min(n, rest) // nunca pasarse del tope diario compartido
  const btn = $('btnEnviar'); const res = $('res')
  btn.disabled = true; const txt = btn.textContent; btn.textContent = 'Enviando...'
  res.className = 'res'; res.textContent = ''
  try {
    const { data, error } = await sb.functions.invoke('aviso-aumento-mail', { body: { limit: n } })
    if(error) throw error
    res.className = 'res show ok'
    res.innerHTML = `✅ Enviados: <b>${data.enviados}</b>${data.errores ? ` · con error: ${data.errores}` : ''} · faltan: <b>${data.restantes_sin_enviar}</b>.`
      + (data.fallidos && data.fallidos.length ? `<br><span class="muted">No salieron: ${esc(data.fallidos.join(', '))}</span>` : '')
  } catch(e) {
    res.className = 'res show err'
    res.textContent = '❌ No se pudo enviar: ' + (e.message || e) + '. Verificá que la función "aviso-aumento-mail" esté deployada y con el secret RESEND_API_KEY.'
  } finally {
    btn.textContent = txt
    await refrescar()
  }
}

;(async function init(){
  let email = null
  try {
    const { data: s } = await sb.auth.getSession()
    email = s?.session?.user?.email || null
    if(!email){ const { data: u } = await sb.auth.getUser(); email = u?.user?.email || null }
  } catch(_){}
  if(!email || !ADMINS.includes(email.toLowerCase())){
    $('app').innerHTML = `<div class="lock">🔒 Esta sección es solo para administración.</div>`
    return
  }
  adminEmail = email
  eventosCierre = await cargarEventosCierre()
  renderNuevo()
  await refrescar()
})()
</script>
