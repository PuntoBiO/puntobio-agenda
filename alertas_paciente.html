<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alertas Paciente · PuntoBiO</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --celeste: #1e9fe0;
    --celeste-dark: #1788c2;
    --celeste-light: #e8f5fc;
    --negro: #1a1a1a;
    --gris-texto: #666;
    --gris-borde: #e0e0e0;
    --gris-bg: #f7f9fa;
    --rojo: #dc2626;
    --rojo-light: #fee2e2;
    --verde: #16a34a;
    --naranja: #f59e0b;
    --naranja-light: #fef3c7;
    --violeta: #7c3aed;
  }
  html, body {
    background: #ffffff;
    color: var(--negro);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
  }
  .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
  h1 { font-size: 22px; margin-bottom: 4px; color: var(--negro); }
  .subtitle { color: var(--gris-texto); font-size: 13.5px; margin-bottom: 18px; }

  /* STATS */
  .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
  .stat-card { background: var(--gris-bg); border: 1px solid var(--gris-borde); border-radius: 12px; padding: 14px 16px; }
  .stat-card.rojo { background: var(--rojo-light); border-color: #fca5a5; }
  .stat-card.naranja { background: var(--naranja-light); border-color: #fcd34d; }
  .stat-card.celeste { background: var(--celeste-light); border-color: #bae6fd; }
  .stat-card .label { font-size: 11.5px; color: var(--gris-texto); text-transform: uppercase; letter-spacing: .3px; font-weight: 700; }
  .stat-card .value { font-size: 26px; font-weight: 800; margin-top: 4px; }

  /* CONTROLES */
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; }
  .tab { border: 1px solid var(--gris-borde); background: #fff; color: var(--gris-texto); border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 700; cursor: pointer; transition: .12s; }
  .tab:hover { border-color: var(--celeste); }
  .tab.active { background: var(--celeste); color: #fff; border-color: var(--celeste); }
  .tab .badge { display: inline-block; background: rgba(0,0,0,.12); border-radius: 999px; padding: 1px 7px; font-size: 11px; margin-left: 5px; }
  .tab.active .badge { background: rgba(255,255,255,.3); }
  .spacer { flex: 1; }
  select, input.search {
    border: 1px solid var(--gris-borde); border-radius: 9px; padding: 8px 11px; font-size: 13px; background: #fff; color: var(--negro);
  }
  input.search { min-width: 200px; }
  select:focus, input.search:focus { outline: none; border-color: var(--celeste); }

  /* LISTA */
  .lista { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .card-p {
    border: 1px solid var(--gris-borde); border-radius: 12px; padding: 13px 15px; background: #fff; cursor: pointer;
    transition: .12s; display: flex; gap: 12px; align-items: flex-start;
  }
  .card-p:hover { border-color: var(--celeste); box-shadow: 0 3px 12px rgba(30,159,224,.10); }
  .card-p.alerta-roja { border-left: 4px solid var(--rojo); }
  .card-p.alerta-naranja { border-left: 4px solid var(--naranja); }
  .avatar {
    width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0; background: var(--celeste-light);
    display: flex; align-items: center; justify-content: center; font-weight: 800; color: var(--celeste-dark); font-size: 15px;
    background-size: cover; background-position: center; overflow: hidden;
  }
  .card-body { flex: 1; min-width: 0; }
  .card-nombre { font-weight: 800; font-size: 14.5px; color: var(--negro); }
  .card-meta { font-size: 11.5px; color: var(--gris-texto); margin-top: 1px; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
  .chip { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; }
  .chip.gris { background: #eef2ff; color: #475569; }
  .empty { grid-column: 1/-1; text-align: center; color: var(--gris-texto); padding: 40px 20px; font-size: 14px; }
  .loader { grid-column: 1/-1; text-align: center; padding: 40px; color: var(--gris-texto); }

  /* MODAL */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 9999; display: none; align-items: center; justify-content: center; padding: 14px; }
  .modal-overlay.open { display: flex; }
  .modal { background: #fff; border-radius: 16px; max-width: 560px; width: 100%; max-height: 90vh; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
  .modal-header { padding: 16px 20px; border-radius: 16px 16px 0 0; color: #fff; display: flex; justify-content: space-between; align-items: flex-start; background: linear-gradient(135deg,#8b5cf6,#6d28d9); }
  .modal-header h2 { font-size: 17px; margin: 0; }
  .modal-header .meta { font-size: 12px; opacity: .9; margin-top: 2px; }
  .modal-close { background: rgba(255,255,255,.3); border: none; color: #fff; width: 30px; height: 30px; border-radius: 50%; font-size: 20px; cursor: pointer; line-height: 1; }
  .modal-body { overflow-y: auto; padding: 16px 20px; flex: 1; }
  .modal-footer { padding: 13px 20px; border-top: 1px solid var(--gris-borde); background: var(--gris-bg); text-align: right; border-radius: 0 0 16px 16px; }
  .btn { border: 1px solid var(--gris-borde); background: #fff; border-radius: 9px; padding: 8px 16px; font-size: 13px; font-weight: 700; cursor: pointer; }
  .btn-primary { background: var(--celeste); color: #fff; border-color: var(--celeste); }
  .dia-card { padding: 9px 11px; background: var(--gris-bg); border: 1px solid var(--gris-borde); border-radius: 8px; margin-bottom: 6px; }
  .dia-fecha { font-size: 11.5px; color: var(--violeta); font-weight: 800; }

  /* TOAST */
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--negro); color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 13px; z-index: 10000; opacity: 0; transition: .2s; pointer-events: none; }
  .toast.show { opacity: 1; }

  @media (max-width: 760px) {
    .stats-row { grid-template-columns: 1fr 1fr; }
    .lista { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="container">
  <h1>🩹 Alertas Paciente</h1>
  <p class="subtitle">Cómo se vienen sintiendo los pacientes según lo que cargan en Mi Espacio. Detectá quién viene manifestando dolor o Borg alto.</p>

  <div class="stats-row" id="statsRow">
    <div class="stat-card rojo"><div class="label">🩹 Con dolor</div><div class="value" id="stDolor">—</div></div>
    <div class="stat-card naranja"><div class="label">⚠️ Dolor alto (EVA ≥ 5)</div><div class="value" id="stDolorAlto">—</div></div>
    <div class="stat-card"><div class="label">💪 Borg alto (≥ 7)</div><div class="value" id="stBorg">—</div></div>
    <div class="stat-card celeste"><div class="label">📋 Pacientes con registro</div><div class="value" id="stTotal">—</div></div>
  </div>

  <div class="controls">
    <div class="tabs" id="tabs">
      <button class="tab active" data-tab="todas" onclick="setTab('todas')">Todas <span class="badge" id="bgTodas">0</span></button>
      <button class="tab" data-tab="dolor" onclick="setTab('dolor')">🩹 Dolor <span class="badge" id="bgDolor">0</span></button>
      <button class="tab" data-tab="borg" onclick="setTab('borg')">💪 Borg alto <span class="badge" id="bgBorg">0</span></button>
      <button class="tab" data-tab="bienestar" onclick="setTab('bienestar')">😴 Bienestar bajo <span class="badge" id="bgBienestar">0</span></button>
    </div>
    <div class="spacer"></div>
    <select id="periodo" onchange="recargar()">
      <option value="7">Últimos 7 días</option>
      <option value="14" selected>Últimos 14 días</option>
      <option value="30">Últimos 30 días</option>
    </select>
    <input type="text" class="search" id="buscar" placeholder="Buscar paciente…" oninput="render()">
  </div>

  <div class="lista" id="lista"><div class="loader">Cargando…</div></div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal" onclick="if(event.target===this)cerrarModal()">
  <div class="modal">
    <div class="modal-header">
      <div>
        <h2 id="mNombre">—</h2>
        <div class="meta" id="mMeta">—</div>
      </div>
      <button class="modal-close" onclick="cerrarModal()">×</button>
    </div>
    <div class="modal-body" id="mBody">—</div>
    <div class="modal-footer">
      <button class="btn" onclick="cerrarModal()">Cerrar</button>
      <button class="btn btn-primary" id="mVerHC" onclick="abrirHC()">📋 Ver Historia Clínica</button>
    </div>
  </div>
</div>

<div class="toast" id="toast">Listo</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = 'https://bqpjtoiictnzcasxfucf.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJxcGp0b2lpY3RuemNhc3hmdWNmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3MDQwOTMsImV4cCI6MjA5NDI4MDA5M30.N1pG65Bm0EmPqxe8hzEFQqE0v1_N5pwrv8HO8We8Xdw';
// Mismo fix de Safari (auth.lock override) que el resto del Ecosistema
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { lock: (name, acquireTimeout, fn) => fn() } });

// Quiénes pueden ver esta pantalla: Santi, Lauti, Lean, Lu, Jime, Male
const EMAILS_PERMITIDOS = [
  'liclucianavelaz@gmail.com',       // Lu
  'jimenahllorente@gmail.com',       // Jime
  'loz.magdalena@gmail.com',         // Male
  'santiagoferreira1999@gmail.com',  // Santi
  'leacrespin97@gmail.com',          // Lean
  'leut.molina@gmail.com'            // Lauti
];
function normEmail(e) { return (e || '').toLowerCase().trim(); }
let usuarioActual = null;

// Detecta el profesional logueado (mismo patrón que el resto del sistema)
async function detectarUsuario() {
  try {
    const { data: { user } } = await sb.auth.getUser();
    if (user) usuarioActual = { email: user.email };
  } catch (e) { console.warn('No se pudo detectar usuario:', e.message); }
}
function puedeVer() {
  return usuarioActual && EMAILS_PERMITIDOS.includes(normEmail(usuarioActual.email));
}

// Umbrales de alerta
const EVA_ALTO  = 5;   // Dolor EVA >= 5 => alerta
const BORG_ALTO = 7;   // Borg >= 7 (CR10) => alerta
const SUENO_BAJO = 2;  // Sueño <= 2 / Día <= 2 => bienestar bajo

let PACIENTES = [];    // agregado por persona
let currentTab = 'todas';
let modalPid = null;

function esc(s) { return (s == null ? '' : String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function colorEsc(v, max) { if (v == null) return '#94a3b8'; const p = v/max; if (p <= 0.3) return '#16a34a'; if (p <= 0.6) return '#f59e0b'; return '#dc2626'; }
function fmtFecha(f) {
  if (!f) return '';
  const d = new Date(String(f).length <= 10 ? f + 'T12:00:00' : f);
  if (isNaN(d.getTime())) return f;
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;
}
function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1800); }

// Borg máximo de una fila de bitácora (PB y/o deporte)
function borgFila(b) {
  let m = null;
  if (b.entreno_en_pb && b.fatiga_post_pb != null) m = Math.max(m == null ? -1 : m, b.fatiga_post_pb);
  if (b.hizo_deporte && b.fatiga_post_deporte != null) m = Math.max(m == null ? -1 : m, b.fatiga_post_deporte);
  return m;
}

async function recargar() {
  const lista = document.getElementById('lista');
  lista.innerHTML = '<div class="loader">Cargando…</div>';
  const dias = parseInt(document.getElementById('periodo').value, 10) || 14;
  const desdeD = new Date(); desdeD.setDate(desdeD.getDate() - dias);
  const desde = `${desdeD.getFullYear()}-${String(desdeD.getMonth()+1).padStart(2,'0')}-${String(desdeD.getDate()).padStart(2,'0')}`;

  try {
    // 1) Bitácora del período
    const { data: bit, error: e1 } = await sb.from('bitacora_fatiga')
      .select('persona_id,fecha,sueno,estado_general,dolor_nivel,dolor_zona,entreno_en_pb,fatiga_post_pb,hizo_deporte,fatiga_post_deporte,deporte_descripcion,notas')
      .gte('fecha', desde)
      .order('fecha', { ascending: false });
    if (e1) throw e1;
    const filas = bit || [];

    // 2) Nombres de las personas que aparecen
    const ids = [...new Set(filas.map(f => f.persona_id))];
    let personasMap = {};
    if (ids.length) {
      const { data: pers, error: e2 } = await sb.from('personas')
        .select('id,nombre,foto_perfil')
        .in('id', ids);
      if (e2) throw e2;
      (pers || []).forEach(p => { personasMap[p.id] = p; });
    }

    // 3) Agregar por persona
    const map = {};
    filas.forEach(b => {
      const pid = b.persona_id;
      if (!map[pid]) {
        map[pid] = {
          pid,
          nombre: (personasMap[pid] && personasMap[pid].nombre) || 'Paciente',
          foto: (personasMap[pid] && personasMap[pid].foto_perfil) || null,
          filas: [],
          maxEva: null, zonaEva: null, diasDolor: new Set(),
          maxBorg: null, diasBorgAlto: new Set(),
          minSueno: null, minDia: null,
          ultimaFecha: b.fecha
        };
      }
      const a = map[pid];
      a.filas.push(b);
      // Dolor
      if (b.dolor_nivel != null && b.dolor_nivel > 0) {
        a.diasDolor.add(b.fecha);
        if (a.maxEva == null || b.dolor_nivel > a.maxEva) { a.maxEva = b.dolor_nivel; a.zonaEva = b.dolor_zona || a.zonaEva; }
      }
      // Borg
      const bf = borgFila(b);
      if (bf != null) {
        if (a.maxBorg == null || bf > a.maxBorg) a.maxBorg = bf;
        if (bf >= BORG_ALTO) a.diasBorgAlto.add(b.fecha);
      }
      // Bienestar
      if (b.sueno != null && (a.minSueno == null || b.sueno < a.minSueno)) a.minSueno = b.sueno;
      if (b.estado_general != null && (a.minDia == null || b.estado_general < a.minDia)) a.minDia = b.estado_general;
      // Última fecha (filas vienen ordenadas desc, alcanza la primera)
      if (b.fecha > a.ultimaFecha) a.ultimaFecha = b.fecha;
    });

    PACIENTES = Object.values(map).map(a => {
      a.tieneDolor = a.maxEva != null && a.maxEva > 0;
      a.dolorAlto = a.maxEva != null && a.maxEva >= EVA_ALTO;
      a.borgAlto = a.maxBorg != null && a.maxBorg >= BORG_ALTO;
      a.bienestarBajo = (a.minSueno != null && a.minSueno <= SUENO_BAJO) || (a.minDia != null && a.minDia <= SUENO_BAJO);
      // score para ordenar: dolor manda, después Borg, después recencia
      a.score = (a.maxEva || 0) * 100 + (a.maxBorg || 0) * 5;
      return a;
    });

    actualizarStats();
    render();
  } catch (err) {
    lista.innerHTML = `<div class="empty">No se pudo cargar la información.<br><span style="font-size:12px">${esc(err.message || err)}</span></div>`;
    console.error(err);
  }
}

function actualizarStats() {
  const conDolor = PACIENTES.filter(p => p.tieneDolor).length;
  const dolorAlto = PACIENTES.filter(p => p.dolorAlto).length;
  const borg = PACIENTES.filter(p => p.borgAlto).length;
  const bienestar = PACIENTES.filter(p => p.bienestarBajo).length;
  document.getElementById('stDolor').textContent = conDolor;
  document.getElementById('stDolorAlto').textContent = dolorAlto;
  document.getElementById('stBorg').textContent = borg;
  document.getElementById('stTotal').textContent = PACIENTES.length;
  document.getElementById('bgTodas').textContent = PACIENTES.length;
  document.getElementById('bgDolor').textContent = conDolor;
  document.getElementById('bgBorg').textContent = borg;
  document.getElementById('bgBienestar').textContent = bienestar;
}

function setTab(t) {
  currentTab = t;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === t));
  render();
}

function filtrar() {
  let arr = PACIENTES.slice();
  if (currentTab === 'dolor') arr = arr.filter(p => p.tieneDolor);
  else if (currentTab === 'borg') arr = arr.filter(p => p.borgAlto);
  else if (currentTab === 'bienestar') arr = arr.filter(p => p.bienestarBajo);
  const q = (document.getElementById('buscar').value || '').trim().toLowerCase();
  if (q) arr = arr.filter(p => (p.nombre || '').toLowerCase().includes(q));
  // Orden: más urgente arriba; en "todas" priorizo los que tienen alguna alerta
  arr.sort((a, b) => {
    const ua = a.dolorAlto || a.borgAlto ? 1 : 0;
    const ub = b.dolorAlto || b.borgAlto ? 1 : 0;
    if (ub !== ua) return ub - ua;
    if (b.score !== a.score) return b.score - a.score;
    return (b.ultimaFecha || '').localeCompare(a.ultimaFecha || '');
  });
  return arr;
}

function chipDolor(p) {
  if (!p.tieneDolor) return '';
  const c = colorEsc(p.maxEva, 10);
  const z = p.zonaEva ? ' · ' + esc(p.zonaEva) : '';
  return `<span class="chip" style="background:${c}22;color:${c}">🩹 EVA ${p.maxEva}${z}</span>`;
}
function chipBorg(p) {
  if (p.maxBorg == null) return '';
  const c = colorEsc(p.maxBorg, 10);
  return `<span class="chip" style="background:${c}22;color:${c}">💪 Borg ${p.maxBorg}</span>`;
}
function chipDias(p) {
  const d = p.diasDolor.size;
  if (!d) return '';
  return `<span class="chip gris">🗓 ${d} día${d > 1 ? 's' : ''} c/dolor</span>`;
}

function render() {
  const cont = document.getElementById('lista');
  const arr = filtrar();
  if (!arr.length) {
    cont.innerHTML = '<div class="empty">No hay pacientes en este filtro para el período elegido.</div>';
    return;
  }
  cont.innerHTML = arr.map(p => {
    const cls = p.dolorAlto ? 'alerta-roja' : (p.borgAlto ? 'alerta-naranja' : '');
    const avatar = p.foto
      ? `<div class="avatar" style="background-image:url('${esc(p.foto)}')"></div>`
      : `<div class="avatar">${esc((p.nombre || '?').trim().charAt(0).toUpperCase())}</div>`;
    const chips = [chipDolor(p), chipBorg(p), chipDias(p)].filter(Boolean).join('') ||
      '<span class="chip gris">Sin alertas · cargó bitácora</span>';
    return `<div class="card-p ${cls}" onclick="abrirModal(${p.pid})">
      ${avatar}
      <div class="card-body">
        <div class="card-nombre">${esc(p.nombre)}</div>
        <div class="card-meta">#${p.pid} · último registro ${fmtFecha(p.ultimaFecha)}</div>
        <div class="chips">${chips}</div>
      </div>
    </div>`;
  }).join('');
}

function renderTimeline(filas) {
  return filas.map(b => {
    const chips = [];
    if (b.sueno) chips.push(`<span class="chip gris">😴 Sueño ${b.sueno}/5</span>`);
    if (b.estado_general) chips.push(`<span class="chip gris">🌟 Día ${b.estado_general}/5</span>`);
    if (b.entreno_en_pb) { const c = colorEsc(b.fatiga_post_pb, 10); chips.push(`<span class="chip" style="background:${c}22;color:${c}">💪 PB · Borg ${b.fatiga_post_pb ?? '—'}</span>`); }
    if (b.hizo_deporte) { const c = colorEsc(b.fatiga_post_deporte, 10); chips.push(`<span class="chip" style="background:${c}22;color:${c}">🏃 Deporte · Borg ${b.fatiga_post_deporte ?? '—'}</span>`); }
    if (b.dolor_nivel != null) { const c = colorEsc(b.dolor_nivel, 10); chips.push(`<span class="chip" style="background:${c}22;color:${c}">🩹 Dolor EVA ${b.dolor_nivel}${b.dolor_zona ? ' · ' + esc(b.dolor_zona) : ''}</span>`); }
    return `<div class="dia-card">
      <div class="dia-fecha">${fmtFecha(b.fecha)}</div>
      <div class="chips" style="margin-top:5px">${chips.join('') || '<span class="chip gris">Sin datos</span>'}</div>
      ${b.deporte_descripcion ? `<div style="font-size:12.5px;color:#0f172a;margin-top:5px">🏃 ${esc(b.deporte_descripcion)}</div>` : ''}
      ${b.notas ? `<div style="font-size:12px;color:#64748b;margin-top:4px;font-style:italic">${esc(b.notas)}</div>` : ''}
    </div>`;
  }).join('');
}

function abrirModal(pid) {
  const p = PACIENTES.find(x => String(x.pid) === String(pid));
  if (!p) return;
  modalPid = pid;
  document.getElementById('mNombre').textContent = '💪 ' + p.nombre;
  document.getElementById('mMeta').textContent = `#${p.pid} · ${p.filas.length} registro${p.filas.length > 1 ? 's' : ''} en el período`;
  document.getElementById('mBody').innerHTML = renderTimeline(p.filas);
  document.getElementById('modal').classList.add('open');
}
function cerrarModal() { document.getElementById('modal').classList.remove('open'); modalPid = null; }
function abrirHC() {
  // Abre Historias Clínicas (la búsqueda interna del panel filtra por nombre)
  const p = PACIENTES.find(x => String(x.pid) === String(modalPid));
  window.open('historias_clinicas.html', '_blank');
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarModal(); });

async function init() {

  if (!puedeVer()) {

}
init();
