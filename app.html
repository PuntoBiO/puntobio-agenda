<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PuntoBiO · Sistema</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-deep: #0a1020;
  --bg-card: #0f1729;
  --bg-elev: #16213d;
  --bg-soft: #1a2540;
  --border: rgba(30, 159, 224, 0.15);
  --border-bright: rgba(30, 159, 224, 0.4);
  --turquoise: #1e9fe0;
  --turquoise-dim: rgba(30, 159, 224, 0.6);
  --text: #e7eef7;
  --text-dim: #8a9bb8;
  --text-faint: #5a6c8a;
  --green: #6ee7a8;
  --amber: #fbbf6b;
  --red: #f87171;
  --pink: #f9a8d4;
  --purple: #c084fc;
  --blue: #60a5fa;
  --sidebar-w: 240px;
  --header-h: 60px;
}

html, body { height: 100%; overflow: hidden; }

body {
  font-family: 'Manrope', system-ui, sans-serif;
  background: var(--bg-deep);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}

/* ======================
   LOADING INICIAL
====================== */
#loader {
  position: fixed;
  inset: 0;
  background: var(--bg-deep);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}

.loader-logo {
  width: 80px;
  height: 80px;
  margin-bottom: 24px;
  animation: pulse 1.5s ease-in-out infinite;
  filter: drop-shadow(0 0 20px rgba(30, 159, 224, 0.4));
}

@keyframes pulse {
  0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(30, 159, 224, 0.4); }
  50% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(30, 159, 224, 0); }
}

.loader-text {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  letter-spacing: 2px;
  color: var(--text-dim);
  text-transform: uppercase;
}

/* ======================
   LAYOUT GENERAL
====================== */
#app {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  grid-template-rows: var(--header-h) 1fr;
  height: 100vh;
  opacity: 0;
  transition: opacity 0.3s;
}

#app.ready { opacity: 1; }

/* ======================
   SIDEBAR
====================== */
aside.sidebar {
  grid-row: 1 / 3;
  background: var(--bg-card);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  overflow-x: hidden;
}

.brand-area {
  padding: 18px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-logo {
  width: 40px;
  height: 40px;
  flex-shrink: 0;
  filter: drop-shadow(0 0 8px rgba(30, 159, 224, 0.3));
}

.brand-text {
  font-weight: 800;
  font-size: 16px;
  letter-spacing: -0.5px;
}

.brand-text .accent { color: var(--turquoise); }

.brand-sub {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: 1.5px;
  color: var(--text-faint);
  text-transform: uppercase;
}

.nav {
  padding: 16px 10px;
  flex: 1;
}

.nav-section {
  margin-bottom: 18px;
}

.nav-section-title {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: 1.5px;
  color: var(--text-faint);
  padding: 0 12px 8px;
  text-transform: uppercase;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 9px 12px;
  border-radius: 7px;
  font-size: 13px;
  color: var(--text-dim);
  cursor: pointer;
  transition: all 0.15s;
  text-decoration: none;
  margin-bottom: 2px;
}

.nav-item:hover {
  background: var(--bg-soft);
  color: var(--text);
}

.nav-item.active {
  background: rgba(30, 159, 224, 0.1);
  color: var(--turquoise);
  font-weight: 600;
}

.nav-item.active::before {
  content: '';
  position: absolute;
  left: 0;
  width: 3px;
  height: 20px;
  background: var(--turquoise);
  border-radius: 0 3px 3px 0;
  margin-left: -10px;
}

.nav-icon {
  width: 18px;
  text-align: center;
  font-size: 14px;
  flex-shrink: 0;
}

.nav-label { flex: 1; }

.nav-badge {
  background: var(--red);
  color: var(--text);
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 8px;
  font-weight: 700;
}

.nav-badge.muted {
  background: rgba(138, 155, 184, 0.2);
  color: var(--text-dim);
}

.user-card {
  padding: 14px 16px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  transition: background 0.15s;
}

.user-card:hover { background: var(--bg-soft); }

.user-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--turquoise);
  color: var(--bg-deep);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 12px;
  flex-shrink: 0;
}

.user-info { flex: 1; min-width: 0; }

.user-name {
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.user-role {
  font-size: 10px;
  color: var(--text-faint);
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

/* ======================
   HEADER
====================== */
header.topbar {
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  display: flex;
  align-items: center;
  gap: 16px;
}

.search-box {
  flex: 1;
  max-width: 480px;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  transition: border-color 0.15s;
}

.search-box:hover { border-color: var(--border-bright); }

.search-icon { font-size: 13px; color: var(--text-faint); }

.search-placeholder {
  flex: 1;
  font-size: 13px;
  color: var(--text-faint);
}

.search-kbd {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  background: var(--bg-deep);
  padding: 2px 6px;
  border-radius: 3px;
  color: var(--text-faint);
  border: 1px solid var(--border);
}

.topbar-spacer { flex: 1; }

.topbar-btn {
  width: 34px;
  height: 34px;
  border-radius: 7px;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  cursor: pointer;
  position: relative;
  transition: all 0.15s;
}

.topbar-btn:hover { border-color: var(--turquoise); }

.dot-alert {
  position: absolute;
  top: 7px;
  right: 7px;
  width: 7px;
  height: 7px;
  background: var(--red);
  border-radius: 50%;
  border: 2px solid var(--bg-card);
}

/* ======================
   CONTENIDO
====================== */
main.content {
  overflow-y: auto;
  background: var(--bg-deep);
  position: relative;
}

main.content::before {
  content: '';
  position: absolute;
  top: -200px;
  left: 50%;
  transform: translateX(-50%);
  width: 800px;
  height: 800px;
  background: radial-gradient(circle, rgba(30, 159, 224, 0.05) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

.content-inner {
  padding: 32px 40px;
  max-width: 1280px;
  margin: 0 auto;
  position: relative;
  z-index: 1;
}

/* MODULO EMBEBIDO (iframe ocupa todo el área de contenido) */
#content.module-embed {
  padding: 0;
  max-width: none;
  margin: 0;
  height: calc(100vh - var(--header-h));
}

.module-iframe-tab {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
  background: #fff;
}

/* HERO HOME */
.hero {
  margin-bottom: 32px;
  animation: fadeUp 0.4s ease;
}

.hero-tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 2px;
  color: var(--turquoise);
  text-transform: uppercase;
  margin-bottom: 10px;
}

.hero h1 {
  font-size: 36px;
  font-weight: 800;
  letter-spacing: -1.5px;
  margin-bottom: 8px;
  line-height: 1.1;
}

.hero h1 .accent { color: var(--turquoise); }

.hero-sub {
  font-size: 15px;
  color: var(--text-dim);
}

/* KPIs */
.kpis-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 14px;
  margin-bottom: 32px;
}

.kpi-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 18px;
  position: relative;
  overflow: hidden;
  cursor: pointer;
  transition: all 0.2s;
  animation: fadeUp 0.5s ease both;
}

.kpi-card:hover {
  border-color: var(--border-bright);
  transform: translateY(-2px);
}

.kpi-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 3px;
  height: 100%;
  background: var(--kpi-color, var(--turquoise));
}

.kpi-label {
  font-size: 11px;
  color: var(--text-dim);
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 8px;
}

.kpi-value {
  font-size: 28px;
  font-weight: 800;
  letter-spacing: -1px;
  color: var(--kpi-color, var(--turquoise));
  line-height: 1;
  margin-bottom: 6px;
}

.kpi-sub {
  font-size: 11px;
  color: var(--text-faint);
}

/* COLS */
.cols-2 {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 20px;
}

.panel {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
  animation: fadeUp 0.6s ease both;
}

.panel-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.panel-title {
  font-size: 14px;
  font-weight: 700;
}

.panel-link {
  font-size: 11px;
  color: var(--turquoise);
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 0.5px;
  cursor: pointer;
  text-transform: uppercase;
}

.panel-body { padding: 6px 0; }

.empty-state {
  padding: 32px 20px;
  text-align: center;
  color: var(--text-faint);
  font-size: 13px;
}

.empty-state-icon {
  font-size: 32px;
  margin-bottom: 12px;
  display: block;
  opacity: 0.4;
}

/* ACCESOS RÁPIDOS */
.accesos-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px;
  margin-bottom: 32px;
}

.acceso-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px 16px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  text-decoration: none;
  color: var(--text);
  display: block;
}

.acceso-card:hover {
  border-color: var(--turquoise);
  transform: translateY(-3px);
  box-shadow: 0 8px 24px rgba(30, 159, 224, 0.1);
}

.acceso-icon {
  font-size: 28px;
  margin-bottom: 10px;
  display: block;
}

.acceso-title {
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 4px;
}

.acceso-desc {
  font-size: 11px;
  color: var(--text-dim);
}

/* PLACEHOLDER PARA MÓDULOS */
.placeholder-module {
  background: var(--bg-card);
  border: 2px dashed var(--border);
  border-radius: 16px;
  padding: 60px 32px;
  text-align: center;
  margin-top: 24px;
}

.placeholder-module h2 {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 8px;
}

.placeholder-module p {
  color: var(--text-dim);
  font-size: 14px;
  max-width: 480px;
  margin: 0 auto 24px;
}

.placeholder-icon {
  font-size: 48px;
  margin-bottom: 16px;
  opacity: 0.5;
}

.placeholder-tag {
  display: inline-block;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 1.5px;
  color: var(--amber);
  background: rgba(251, 191, 107, 0.1);
  border: 1px solid rgba(251, 191, 107, 0.3);
  padding: 4px 10px;
  border-radius: 4px;
  text-transform: uppercase;
}

/* MODAL BÚSQUEDA */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(10, 16, 32, 0.8);
  backdrop-filter: blur(8px);
  z-index: 200;
  display: none;
  align-items: flex-start;
  justify-content: center;
  padding-top: 100px;
}

.modal-overlay.open { display: flex; }

.search-modal {
  background: var(--bg-card);
  border: 1px solid var(--border-bright);
  border-radius: 16px;
  width: 90%;
  max-width: 600px;
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
  animation: fadeDown 0.2s ease;
}

.search-input-box {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
}

.search-input {
  flex: 1;
  background: transparent;
  border: none;
  color: var(--text);
  font-size: 15px;
  font-family: inherit;
  outline: none;
}

.search-input::placeholder { color: var(--text-faint); }

.search-results {
  padding: 12px;
  max-height: 400px;
  overflow-y: auto;
}

.search-empty {
  padding: 40px 20px;
  text-align: center;
  color: var(--text-faint);
  font-size: 13px;
}

.search-result-item {
  padding: 10px 14px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  gap: 12px;
}

.search-result-item:hover {
  background: var(--bg-soft);
  color: var(--text);
}

.search-footer {
  padding: 12px 20px;
  border-top: 1px solid var(--border);
  font-size: 11px;
  color: var(--text-faint);
  font-family: 'JetBrains Mono', monospace;
  display: flex;
  justify-content: space-between;
}

.kbd-hint {
  background: var(--bg-elev);
  padding: 2px 5px;
  border-radius: 3px;
  margin: 0 2px;
}

/* DROPDOWN USUARIO */
.user-dropdown {
  position: absolute;
  bottom: 70px;
  left: 14px;
  width: calc(var(--sidebar-w) - 28px);
  background: var(--bg-elev);
  border: 1px solid var(--border-bright);
  border-radius: 10px;
  padding: 6px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
  display: none;
  z-index: 50;
}

.user-dropdown.open { display: block; }

.dropdown-item {
  padding: 8px 12px;
  border-radius: 6px;
  font-size: 13px;
  color: var(--text-dim);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
}

.dropdown-item:hover {
  background: var(--bg-soft);
  color: var(--text);
}

.dropdown-item.danger:hover {
  color: var(--red);
  background: rgba(248, 113, 113, 0.08);
}

.dropdown-divider {
  height: 1px;
  background: var(--border);
  margin: 4px 0;
}

/* ANIMATIONS */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeDown {
  from { opacity: 0; transform: translateY(-15px); }
  to { opacity: 1; transform: translateY(0); }
}

/* RESPONSIVE */
@media (max-width: 900px) {
  #app { grid-template-columns: 1fr; }
  aside.sidebar { display: none; }
  .content-inner { padding: 20px; }
  .hero h1 { font-size: 28px; }
  .cols-2 { grid-template-columns: 1fr; }
}

/* SCROLLBAR */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--bg-deep); }
::-webkit-scrollbar-thumb { background: var(--bg-elev); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--border-bright); }
</style>
</head>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

const SUPABASE_URL = 'https://bqpjtoiictnzcasxfucf.supabase.co'
const SUPABASE_KEY = 'sb_publishable_yvuXDxrkRrhXwmZBnE_a_Q_zDBz0iDi'

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY)

// ESTADO GLOBAL
let usuario = null
let permisos = null

// ======================
// INICIALIZACION
// ======================
async function init() {
  const { data: { session } } = await supabase.auth.getSession()

  if (!session) {
    window.location.href = 'login.html'
    return
  }

  const { data: persona } = await supabase
    .from('personas')
    .select('id, nombre, email, rol_principal, es_equipo, activo_sistema')
    .eq('auth_user_id', session.user.id)
    .maybeSingle()

  if (!persona) {
    alert('No estás vinculado al padrón. Cerrando sesión.')
    await supabase.auth.signOut()
    window.location.href = 'login.html'
    return
  }

  usuario = persona

  if (persona.es_equipo) {
    const { data: perm } = await supabase
      .from('permisos_equipo')
      .select('*')
      .eq('persona_id', persona.id)
      .maybeSingle()
    permisos = perm || {}
  } else {
    permisos = { es_cliente: true }
  }

  renderShell()
  renderHome()

  document.getElementById('loader').style.display = 'none'
  document.getElementById('app').classList.add('ready')
}

// ======================
// SHELL: SIDEBAR + USER CARD
// ======================
function renderShell() {
  // User card
  const iniciales = usuario.nombre.split(' ').slice(0, 2).map(p => p[0]).join('').toUpperCase()
  document.getElementById('user-avatar').textContent = iniciales
  document.getElementById('user-name').textContent = usuario.nombre.split(' ').slice(0, 2).join(' ')
  document.getElementById('user-role').textContent = rolLabel(usuario.rol_principal)

  // Navegación según permisos
  const nav = document.getElementById('nav-items')
  nav.innerHTML = buildNav()
}

function rolLabel(rol) {
  return {
    'admin_general': 'Admin general',
    'administrativa': 'Administrativa',
    'profe': 'Profe',
    'kine': 'Kinesiólogo/a',
    'masoterapeuta': 'Masoterapeuta',
    'alumno': 'Alumno/a',
    'paciente': 'Paciente'
  }[rol] || rol
}

function buildNav() {
  const items = []

  // SECCIÓN: General
  items.push(`<div class="nav-section">
    <div class="nav-section-title">General</div>
    <div class="nav-item active" onclick="irA('inicio')">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">Inicio</span>
    </div>
    <div class="nav-item" onclick="irA('agenda')">
      <span class="nav-icon">📅</span>
      <span class="nav-label">Agenda</span>
    </div>`)

  if (permisos.operativo_general || permisos.admin_total) {
    items.push(`<div class="nav-item" onclick="irA('padron')">
      <span class="nav-icon">👥</span>
      <span class="nav-label">Padrón</span>
      <span class="nav-badge muted">420</span>
    </div>`)
  }

  items.push(`</div>`)

  // SECCIÓN: Áreas según permisos
  const areas = []
  if (permisos.ve_terapia_fisica) {
    areas.push({ icon: '🏋️', label: 'Terapia Física', id: 'terapia-fisica' })
  }
  if (permisos.ve_consultorios) {
    areas.push({ icon: '🩺', label: 'Consultorios', id: 'consultorios' })
  }
  if (permisos.ve_especialidades) {
    areas.push({ icon: '✨', label: 'Especialidades', id: 'especialidades' })
  }
  if (permisos.ve_biolab) {
    areas.push({ icon: '🔬', label: 'BioLab', id: 'biolab' })
  }
  if (permisos.ve_masoterapia) {
    areas.push({ icon: '💆', label: 'Masoterapia', id: 'masoterapia' })
  }

  if (areas.length > 0) {
    items.push(`<div class="nav-section">
      <div class="nav-section-title">Áreas</div>`)
    areas.forEach(a => {
      items.push(`<div class="nav-item" onclick="irA('${a.id}')">
        <span class="nav-icon">${a.icon}</span>
        <span class="nav-label">${a.label}</span>
      </div>`)
    })
    items.push(`</div>`)
  }

  // SECCIÓN: Administración (caja, liquidaciones, reportes)
  if (permisos.admin_total || permisos.operativo_general) {
    items.push(`<div class="nav-section">
      <div class="nav-section-title">Administración</div>
      <div class="nav-item" onclick="irA('caja-diaria')">
        <span class="nav-icon">💵</span>
        <span class="nav-label">Caja diaria</span>
      </div>`)

    if (permisos.admin_total) {
      items.push(`<div class="nav-item" onclick="irA('liquidaciones')">
        <span class="nav-icon">💰</span>
        <span class="nav-label">Liquidaciones</span>
      </div>
      <div class="nav-item" onclick="irA('reportes')">
        <span class="nav-icon">📊</span>
        <span class="nav-label">Reportes</span>
      </div>`)
    }

    items.push(`</div>`)
  }

  // SECCIÓN: Sistema (solo admin)
  if (permisos.admin_total) {
    items.push(`<div class="nav-section">
      <div class="nav-section-title">Sistema</div>
      <div class="nav-item" onclick="irA('equipo')">
        <span class="nav-icon">👨‍⚕️</span>
        <span class="nav-label">Equipo</span>
      </div>
    </div>`)
  }

  return items.join('')
}

// ======================
// NAVEGACIÓN
// ======================
window.irA = function(modulo) {
  // Actualizar item activo
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'))
  event.target.closest('.nav-item')?.classList.add('active')

  // Cerrar dropdown si está abierto
  document.getElementById('user-dropdown').classList.remove('open')

  if (modulo === 'inicio') renderHome()
  else if (modulo === 'terapia-fisica') renderTerapiaFisica()
  else if (modulo === 'padron') renderPadron()
  else if (modulo === 'caja-diaria') renderCajaDiaria()
  else renderPlaceholder(modulo)
}

// ======================
window.toggleUserMenu = function(e) {
  e.stopPropagation()
  document.getElementById('user-dropdown').classList.toggle('open')
}

document.addEventListener('click', (e) => {
  if (!e.target.closest('#user-card') && !e.target.closest('#user-dropdown')) {
    document.getElementById('user-dropdown').classList.remove('open')
  }
})

window.cerrarSesion = async function() {
  await supabase.auth.signOut()
  window.location.href = 'login.html'
}

// ======================
// BUSCADOR
// ======================
window.abrirBuscador = function() {
  document.getElementById('search-modal-overlay').classList.add('open')
  setTimeout(() => document.getElementById('search-input').focus(), 50)
}

window.cerrarBuscador = function(e) {
  if (!e || e.target.id === 'search-modal-overlay') {
    document.getElementById('search-modal-overlay').classList.remove('open')
  }
}

document.addEventListener('keydown', (e) => {
  // Ctrl+K o Cmd+K abre buscador
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
    e.preventDefault()
    abrirBuscador()
  }
  // Escape cierra modal
  if (e.key === 'Escape') {
    document.getElementById('search-modal-overlay').classList.remove('open')
    document.getElementById('user-dropdown').classList.remove('open')
  }
})

init()
