<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liquidación SARKMED</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --naranja:#f47b20; --celeste:#29abe2; --azul:#1c75bc;
    --texto:#1e293b; --muted:#64748b; --gris-claro:#94a3b8;
    --linea:#e6eaf2; --fondo:#f4f6fb;
    --verde:#16a34a; --verde-soft:#dcfce7;
    --rojo:#dc2626; --rojo-soft:#fee2e2;
    --ambar:#b45309; --ambar-soft:#fef3c7;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--fondo);color:var(--texto);
    font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px;margin:0 auto;padding:22px 18px 60px}
  .card{background:#fff;border:1px solid var(--linea);border-radius:16px;box-shadow:0 1px 2px rgba(15,23,42,.04)}

  h1{font-size:26px;margin:0;letter-spacing:-.01em}
  h1 .s1{color:var(--naranja)} h1 .s2{color:var(--celeste)} h1 .s3{color:var(--azul)}
  .sub{color:var(--muted);font-size:14px;margin:4px 0 0}
  .top{display:flex;gap:14px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
  .mes{display:flex;gap:8px;align-items:center}
  .mes .nombre{font-weight:800;font-size:16px;min-width:150px;text-align:center;text-transform:capitalize}

  .btn{border:0;cursor:pointer;font:inherit;font-weight:700;font-size:14px;padding:9px 14px;border-radius:10px;background:var(--naranja);color:#fff}
  .btn.sec{background:#eef4fb;color:var(--azul)}
  .btn.gris{background:#f1f5f9;color:var(--muted)}
  .btn:hover{filter:brightness(1.05)}
  .btn:focus-visible{outline:3px solid var(--celeste);outline-offset:2px}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:18px}
  .kpi{padding:16px 18px}
  .kpi .n{font-size:26px;font-weight:800;letter-spacing:-.02em}
  .kpi .l{font-size:12.5px;color:var(--muted);margin-top:5px}
  .kpi .d{font-size:11.5px;color:var(--gris-claro);margin-top:6px}

  .seccion{margin-top:22px}
  .seccion h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gris-claro);font-weight:700;margin:0 0 10px}

  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gris-claro);
    padding:10px 14px;border-bottom:1px solid var(--linea);font-weight:700}
  td{padding:12px 14px;border-bottom:1px solid #f1f5f9}
  tr:last-child td{border-bottom:0}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .nombre{font-weight:600}
  .dim{color:var(--gris-claro);font-size:12px}
  tfoot td{font-weight:800;border-top:2px solid var(--linea)}

  .pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:10.5px;font-weight:700;letter-spacing:.4px}
  .pill.ok{background:var(--verde-soft);color:#166534}
  .pill.debe{background:var(--rojo-soft);color:#991b1b}
  .pill.destino{background:#eef4fb;color:var(--azul)}

  .rendicion{padding:16px 18px;font-size:14.5px;line-height:1.7}
  .rendicion b{font-variant-numeric:tabular-nums}
  .aviso{padding:12px 14px;border-radius:10px;font-size:13.5px;margin-bottom:14px}
  .aviso.err{background:var(--rojo-soft);color:#991b1b}
  .aviso.ambar{background:var(--ambar-soft);color:var(--ambar)}
  .vacio{padding:26px 16px;text-align:center;color:var(--muted);font-size:14px}

  details{border-top:1px solid #f1f5f9}
  details:first-of-type{border-top:0}
  summary{cursor:pointer;padding:12px 16px;font-weight:700;font-size:14px;display:flex;justify-content:space-between;gap:12px}
  summary::-webkit-details-marker{display:none}
  summary .fecha{text-transform:capitalize}
  summary .tot{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}

  @media (max-width:680px){
    .wrap{padding:16px 12px 44px}
    th:nth-child(2),td:nth-child(2){display:none}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div>
      <h1 id="titulo">Liquidación <span class="s1">SAR</span><span class="s2">K</span><span class="s3">MED</span></h1>
      <p class="sub" id="bajada">Se reparte solo lo que el paciente pagó completo, de las jornadas ya realizadas.</p>
    </div>
    <div class="mes">
      <button class="btn gris" id="mes-ant">‹</button>
      <div class="nombre" id="mes-nombre">—</div>
      <button class="btn gris" id="mes-sig">›</button>
      <button class="btn sec" id="btn-refrescar">↻</button>
    </div>
  </div>

  <div id="alerta"></div>
  <div class="kpis" id="kpis"></div>

  <section class="seccion">
    <h2 id="tit-reparto">Lo que le toca a cada uno</h2>
    <div class="card"><div id="tabla-reparto"><div class="vacio">Cargando…</div></div></div>
  </section>

  <section class="seccion" id="sec-plata" hidden>
    <h2>Dónde está la plata</h2>
    <div class="card rendicion" id="box-plata"></div>
  </section>

  <section class="seccion" id="sec-pendientes" hidden>
    <h2>Hicieron el circuito y falta cobrarles</h2>
    <div class="card"><div id="tabla-pendientes"></div></div>
  </section>

  <section class="seccion">
    <h2>Jornada por jornada</h2>
    <div class="card" id="detalle"></div>
  </section>
</div>

<script>
/* ════════════════════════════════════════════════════════════════
   SUPABASE
   ════════════════════════════════════════════════════════════════ */
const SUPABASE_URL = 'https://bqpjtoiictnzcasxfucf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_yvuXDxrkRrhXwmZBnE_a_Q_zDBz0iDi';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { lock: (name, acquireTimeout, fn) => fn() } });

const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS  = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

/* Las estaciones del circuito y de qué campo de la tarifa sale cada parte. */
const ESTACIONES = [
  { id:'MEDICA',    label:'Médica',        campo:'monto_medica' },
  { id:'NUTRICION', label:'Nutrición',     campo:'monto_nutricion' },
  { id:'SUELO',     label:'Suelo pélvico', campo:'monto_suelo_pelvico' },
  { id:'BIOLAB',    label:'BiOLAB',        campo:'monto_biolab' }
];

/* ════════════════════════════════════════════════════════════════
   ESTADO
   ════════════════════════════════════════════════════════════════ */
const SOLO_MIO = new URLSearchParams(location.search).get('solo') === 'mi';
let mesAncla = new Date();
let miEmail = '', miAcceso = null, accesos = [];
let tarifas = [];       // todas, ordenadas por vigencia
let jornadas = [];      // realizadas del mes
let turnos = [];        // de esas jornadas
let cobros = [];        // aplicados de esas jornadas
let calculo = null;     // resultado del reparto

/* ════════════════════════════════════════════════════════════════
   HELPERS
   ════════════════════════════════════════════════════════════════ */
const $ = (id) => document.getElementById(id);
function fmtFecha(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fechaDeISO(iso){ const [y,m,d] = String(iso).slice(0,10).split('-').map(Number); return new Date(y, m-1, d); }
function fechaLarga(iso){ const d = fechaDeISO(iso); return DIAS[d.getDay()] + ' ' + d.getDate() + ' de ' + MESES[d.getMonth()]; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function num(v){ return Number(v)||0; }
function fmt(v){ return '$' + num(v).toLocaleString('es-AR',{maximumFractionDigits:0}); }
function aviso(txt, tipo){ $('alerta').innerHTML = txt ? '<div class="aviso '+(tipo||'err')+'">'+esc(txt)+'</div>' : ''; }
function rangoMes(){
  const y = mesAncla.getFullYear(), m = mesAncla.getMonth();
  return { ini: fmtFecha(new Date(y,m,1)), fin: fmtFecha(new Date(y,m+1,0)) };
}
/* La tarifa que regía ese día: los aumentos no cambian lo ya liquidado. */
function tarifaDe(iso){
  const f = String(iso).slice(0,10);
  let elegida = null;
  tarifas.forEach(t => { if(String(t.vigente_desde).slice(0,10) <= f) elegida = t; });
  return elegida;
}

/* ════════════════════════════════════════════════════════════════
   PERMISOS
   ════════════════════════════════════════════════════════════════ */
async function cargarPermisos(){
  try{
    const { data:{ session } } = await sb.auth.getSession();
    miEmail = (session && session.user && session.user.email ? session.user.email : '').toLowerCase().trim();
  }catch(e){ miEmail = ''; }
  try{
    const { data } = await sb.from('sarkmed_accesos')
      .select('email, nombre, rol, estacion, ve_liquidacion, activo').eq('activo', true);
    accesos = (data || []).map(a => ({ ...a, email: (a.email||'').toLowerCase().trim() }));
  }catch(e){ accesos = []; }
  miAcceso = accesos.find(a => a.email === miEmail) || null;
  // Sin fila (equipo del centro) se asume que puede ver el circuito completo.
  return SOLO_MIO ? true : (!miAcceso || miAcceso.ve_liquidacion === true || miAcceso.rol === 'ADMIN');
}
function nombreDeEstacion(id){
  const p = accesos.find(a => a.estacion === id);
  const e = ESTACIONES.find(x => x.id === id);
  return p && p.nombre ? p.nombre : (e ? e.label : id);
}
function miEstacion(){ return miAcceso ? miAcceso.estacion : null; }

/* ════════════════════════════════════════════════════════════════
   CARGA · siempre acotada al mes que se está mirando
   ════════════════════════════════════════════════════════════════ */
async function cargarTodo(){
  const { ini, fin } = rangoMes();

  const tRes = await sb.from('sarkmed_tarifa').select('*').order('vigente_desde');
  tarifas = tRes.data || [];

  const jRes = await sb.from('jornadas_sarkmed')
    .select('id, fecha, estado, activo')
    .eq('activo', true).eq('estado', 'REALIZADA')
    .gte('fecha', ini).lte('fecha', fin).order('fecha');
  if(jRes.error){ aviso('No se pudieron leer las jornadas: ' + jRes.error.message); jornadas = []; }
  else jornadas = jRes.data || [];

  const fechas = jornadas.map(j => String(j.fecha).slice(0,10));
  if(!fechas.length){ turnos = []; cobros = []; return; }

  const [tuRes, cRes] = await Promise.all([
    sb.from('turnos_sarkmed')
      .select('id, fecha, hora, estado, paciente_id, biolab_soporte, paciente:pacientes_sarkmed(id, apellido_nombre, dni)')
      .in('fecha', fechas).eq('estado', 'PRESENTE').order('fecha').order('hora'),
    sb.from('cobros_sarkmed')
      .select('id, paciente_id, fecha_jornada, importe, destino, situacion, anulado')
      .in('fecha_jornada', fechas).eq('anulado', false).eq('situacion', 'APLICADO')
  ]);
  turnos = tuRes.error ? [] : (tuRes.data || []);
  cobros = cRes.error ? [] : (cRes.data || []);
}

/* ════════════════════════════════════════════════════════════════
   EL CÁLCULO
   Regla de Lu: se reparte SOLO el circuito pago completo, y solo de
   jornadas ya realizadas. La seña sola es plata reservando el turno,
   no se toca hasta que el paciente venga y complete.
   ════════════════════════════════════════════════════════════════ */
function calcular(){
  const porProfesional = {};   // clave → { nombre, circuitos, monto }
  const sumar = (clave, nombre, monto) => {
    if(!porProfesional[clave]) porProfesional[clave] = { nombre, circuitos:0, monto:0 };
    porProfesional[clave].circuitos++;
    porProfesional[clave].monto += monto;
  };

  const pendientes = [];
  const porJornada = {};
  let totalLiquidado = 0, circuitosLiquidados = 0;

  turnos.forEach(t => {
    const iso = String(t.fecha).slice(0,10);
    const tar = tarifaDe(iso);
    if(!tar) return;
    const precio = num(tar.precio_circuito);
    const cobrado = cobros
      .filter(c => c.paciente_id === t.paciente_id && String(c.fecha_jornada).slice(0,10) === iso)
      .reduce((a,c) => a + num(c.importe), 0);
    const p = t.paciente || {};

    if(cobrado < precio){
      pendientes.push({ iso, nombre: p.apellido_nombre || '—', dni: p.dni, cobrado, precio, falta: precio - cobrado });
      return;
    }

    const soporte = t.biolab_soporte ? num(tar.monto_soporte_biolab) : 0;
    const partes = [
      { clave:'MEDICA',    nombre: nombreDeEstacion('MEDICA'),    monto: num(tar.monto_medica) },
      { clave:'NUTRICION', nombre: nombreDeEstacion('NUTRICION'), monto: num(tar.monto_nutricion) },
      { clave:'SUELO',     nombre: nombreDeEstacion('SUELO'),     monto: num(tar.monto_suelo_pelvico) },
      { clave:'BIOLAB',    nombre: nombreDeEstacion('BIOLAB'),    monto: num(tar.monto_biolab) - soporte }
    ];
    if(soporte > 0){
      const quien = t.biolab_soporte === 'MALE' ? 'Male' : 'Bruno';
      partes.push({ clave:'SOPORTE_' + t.biolab_soporte, nombre: quien + ' (soporte BiOLAB)', monto: soporte });
    }
    if(num(tar.monto_centro) > 0) partes.push({ clave:'CENTRO', nombre:'PuntoBiO (centro)', monto: num(tar.monto_centro) });

    partes.forEach(x => sumar(x.clave, x.nombre, x.monto));
    totalLiquidado += precio;
    circuitosLiquidados++;

    if(!porJornada[iso]) porJornada[iso] = { pacientes: [], total: 0 };
    porJornada[iso].pacientes.push({
      nombre: p.apellido_nombre || '—', dni: p.dni, precio,
      soporte: t.biolab_soporte || null, partes
    });
    porJornada[iso].total += precio;
  });

  // Dónde está la plata: mira TODO lo cobrado de esas jornadas, incluso lo de
  // los que todavía no completaron, porque igual está en la mano de alguien.
  const enMati = cobros.filter(c => c.destino === 'MATI').reduce((a,c) => a + num(c.importe), 0);
  const enPB   = cobros.filter(c => c.destino !== 'MATI').reduce((a,c) => a + num(c.importe), 0);

  calculo = { porProfesional, pendientes, porJornada, totalLiquidado, circuitosLiquidados, enMati, enPB };
}

/* ════════════════════════════════════════════════════════════════
   RENDER
   ════════════════════════════════════════════════════════════════ */
function render(){
  $('mes-nombre').textContent = MESES[mesAncla.getMonth()] + ' ' + mesAncla.getFullYear();
  if(SOLO_MIO){
    $('titulo').textContent = 'Mi facturación · SARKMED';
    $('bajada').textContent = 'Lo que te corresponde de los circuitos pagos, jornada por jornada.';
    $('tit-reparto').textContent = 'Lo tuyo';
  }
  renderKpis();
  renderReparto();
  renderPlata();
  renderPendientes();
  renderDetalle();
}

function lasMias(){
  const est = miEstacion();
  const todas = calculo ? calculo.porProfesional : {};
  if(!SOLO_MIO) return todas;
  if(!est) return {};
  return todas[est] ? { [est]: todas[est] } : {};
}

function renderKpis(){
  if(!calculo){ $('kpis').innerHTML = ''; return; }
  const filas = lasMias();
  const mio = Object.values(filas).reduce((a,x) => a + x.monto, 0);
  const tiles = [];
  if(SOLO_MIO){
    const circ = Object.values(filas).reduce((a,x) => Math.max(a, x.circuitos), 0);
    tiles.push('<div class="card kpi"><div class="n" style="color:var(--verde)">'+fmt(mio)+'</div>' +
      '<div class="l">te corresponde este mes</div><div class="d">' + circ + ' ' + (circ===1?'circuito':'circuitos') + '</div></div>');
  }else{
    tiles.push('<div class="card kpi"><div class="n" style="color:var(--verde)">'+fmt(calculo.totalLiquidado)+'</div>' +
      '<div class="l">se reparte este mes</div><div class="d">' + calculo.circuitosLiquidados + ' ' +
      (calculo.circuitosLiquidados===1?'circuito pago':'circuitos pagos') + '</div></div>');
    tiles.push('<div class="card kpi"><div class="n">'+jornadas.length+'</div>' +
      '<div class="l">' + (jornadas.length===1?'jornada realizada':'jornadas realizadas') + '</div>' +
      '<div class="d">solo se liquida lo cerrado en la agenda</div></div>');
    if(calculo.pendientes.length){
      const falta = calculo.pendientes.reduce((a,p) => a + p.falta, 0);
      tiles.push('<div class="card kpi"><div class="n" style="color:var(--rojo)">'+fmt(falta)+'</div>' +
        '<div class="l">sin cobrar</div><div class="d">' + calculo.pendientes.length + ' ' +
        (calculo.pendientes.length===1?'paciente que vino y no completó':'pacientes que vinieron y no completaron') + '</div></div>');
    }
  }
  $('kpis').innerHTML = tiles.join('');
}

function renderReparto(){
  const cont = $('tabla-reparto');
  const filas = Object.entries(lasMias());
  if(!filas.length){
    cont.innerHTML = '<div class="vacio">' +
      (SOLO_MIO ? 'Este mes no tenés circuitos liquidados.' : 'Todavía no hay circuitos pagos en jornadas realizadas de este mes.') +
      '</div>';
    return;
  }
  const total = filas.reduce((a,[,x]) => a + x.monto, 0);
  cont.innerHTML = '<table><thead><tr><th>Profesional</th><th class="num">Circuitos</th><th class="num">Le toca</th></tr></thead><tbody>' +
    filas.map(([,x]) =>
      '<tr><td class="nombre">' + esc(x.nombre) + '</td>' +
      '<td class="num">' + x.circuitos + '</td>' +
      '<td class="num">' + fmt(x.monto) + '</td></tr>').join('') +
    '</tbody><tfoot><tr><td>Total</td><td class="num"></td><td class="num">' + fmt(total) + '</td></tr></tfoot></table>';
}

/* Quién tiene la plata en la mano y qué tiene que pasar para que cierre. */
function renderPlata(){
  if(SOLO_MIO || !calculo){ $('sec-plata').hidden = true; return; }
  $('sec-plata').hidden = false;
  const leToca = calculo.porProfesional['MEDICA'] ? calculo.porProfesional['MEDICA'].monto : 0;
  const nombreMedica = nombreDeEstacion('MEDICA');
  const diferencia = calculo.enMati - leToca;
  let cierre;
  if(Math.abs(diferencia) < 1) cierre = 'Justo: lo que cobró es exactamente lo que le toca.';
  else if(diferencia > 0) cierre = '<b>' + esc(nombreMedica) + ' rinde ' + fmt(diferencia) + '</b> al centro.';
  else cierre = 'El centro le paga <b>' + fmt(Math.abs(diferencia)) + '</b> a ' + esc(nombreMedica) + '.';

  $('box-plata').innerHTML =
    '<div>Entró a PuntoBiO: <b>' + fmt(calculo.enPB) + '</b> · a ' + esc(nombreMedica) + ': <b>' + fmt(calculo.enMati) + '</b></div>' +
    '<div style="color:var(--muted);font-size:13.5px">A ' + esc(nombreMedica) + ' le corresponden ' + fmt(leToca) + ' por los circuitos del mes. ' + cierre + '</div>' +
    '<div style="color:var(--gris-claro);font-size:12.5px;margin-top:6px">Incluye todo lo cobrado de estas jornadas, también las señas de los que todavía no completaron: esa plata está en la mano de alguien aunque no se reparta.</div>';
}

function renderPendientes(){
  if(SOLO_MIO || !calculo || !calculo.pendientes.length){ $('sec-pendientes').hidden = true; return; }
  $('sec-pendientes').hidden = false;
  $('tabla-pendientes').innerHTML =
    '<table><thead><tr><th>Paciente</th><th>Jornada</th><th class="num">Pagó</th><th class="num">Falta</th></tr></thead><tbody>' +
    calculo.pendientes.map(p =>
      '<tr><td><div class="nombre">' + esc(p.nombre) + '</div><div class="dim">DNI ' + esc(p.dni || '—') + '</div></td>' +
      '<td class="dim">' + fechaLarga(p.iso) + '</td>' +
      '<td class="num">' + fmt(p.cobrado) + '</td>' +
      '<td class="num"><span class="pill debe">' + fmt(p.falta) + '</span></td></tr>').join('') +
    '</tbody></table>' +
    '<div style="padding:12px 16px;color:var(--muted);font-size:13px;border-top:1px solid #f1f5f9">' +
    'Hicieron el circuito pero no lo pagaron entero, así que no entran en el reparto. Cuando salden, aparecen solos.</div>';
}

function renderDetalle(){
  const cont = $('detalle');
  const fechas = Object.keys(calculo ? calculo.porJornada : {}).sort().reverse();
  if(!fechas.length){ cont.innerHTML = '<div class="vacio">Sin circuitos liquidables en el mes.</div>'; return; }
  const est = miEstacion();

  cont.innerHTML = fechas.map(iso => {
    const j = calculo.porJornada[iso];
    const filas = j.pacientes.map(p => {
      const partes = SOLO_MIO ? p.partes.filter(x => x.clave === est) : p.partes;
      if(SOLO_MIO && !partes.length) return '';
      const detalle = partes.map(x => esc(x.nombre.split(' ')[0]) + ' ' + fmt(x.monto)).join(' · ');
      const mio = partes.reduce((a,x) => a + x.monto, 0);
      return '<tr><td><div class="nombre">' + esc(p.nombre) + '</div>' +
        '<div class="dim">' + detalle + (p.soporte ? ' · soporte ' + esc(p.soporte.toLowerCase()) : '') + '</div></td>' +
        '<td class="num">' + fmt(SOLO_MIO ? mio : p.precio) + '</td></tr>';
    }).filter(Boolean).join('');
    if(!filas) return '';
    const totalDia = SOLO_MIO
      ? j.pacientes.reduce((a,p) => a + p.partes.filter(x => x.clave === est).reduce((b,x) => b + x.monto, 0), 0)
      : j.total;
    return '<details><summary><span class="fecha">' + fechaLarga(iso) + '</span>' +
      '<span class="tot">' + j.pacientes.length + ' ' + (j.pacientes.length===1?'circuito':'circuitos') + ' · ' + fmt(totalDia) + '</span></summary>' +
      '<table><tbody>' + filas + '</tbody></table></details>';
  }).filter(Boolean).join('') || '<div class="vacio">Sin circuitos tuyos en el mes.</div>';
}

/* ════════════════════════════════════════════════════════════════
   ARRANQUE
   ════════════════════════════════════════════════════════════════ */
async function recargar(){
  await cargarTodo();
  calcular();
  render();
}
$('mes-ant').addEventListener('click', async () => {
  mesAncla = new Date(mesAncla.getFullYear(), mesAncla.getMonth()-1, 1); await recargar();
});
$('mes-sig').addEventListener('click', async () => {
  mesAncla = new Date(mesAncla.getFullYear(), mesAncla.getMonth()+1, 1); await recargar();
});
$('btn-refrescar').addEventListener('click', recargar);

(async function init(){
  const habilitado = await cargarPermisos();
  if(!habilitado){
    document.querySelector('.wrap').innerHTML =
      '<div class="card" style="padding:28px;text-align:center"><h1>Liquidación SARKMED</h1>' +
      '<p class="sub">Tu usuario ve su propia facturación, no el reparto del circuito.</p></div>';
    return;
  }
  if(SOLO_MIO && !miEstacion() && miAcceso){
    aviso('Tu usuario no tiene una estación del circuito asignada, así que no hay nada que facturar. Si esto no es correcto, avisale a Lu.', 'ambar');
  }
  await recargar();
})();
</script>
