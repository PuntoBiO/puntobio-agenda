<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PuntoBiO — Agenda</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --celeste: #1e9fe0;
    --celeste-oscuro: #1a8bc4;
    --celeste-claro: #e8f4fb;
    --celeste-medio: #b8dcf0;
    --negro: #111111;
    --gris-oscuro: #1e1e1e;
    --gris-medio: #2d2d2d;
    --gris-borde: #e2e2e0;
    --gris-fondo: #f5f5f3;
    --blanco: #ffffff;
    --texto: #1a1a18;
    --texto-suave: #6b6b65;
    --verde-ok: #22c55e;
    --rojo: #ef4444;
    --amarillo: #f59e0b;
    --radio: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--gris-fondo); color: var(--texto); min-height: 100vh; }
  header {
    background: var(--negro);
    padding: 0 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 60px;
    border-bottom: 2px solid var(--celeste);
  }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-img {
    width: 38px; height: 38px;
    background: #1e9fe0 center/contain no-repeat;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .logo-texto { font-size: 18px; font-weight: 600; color: white; letter-spacing: -0.3px; }
  .logo-texto span { color: var(--celeste); }
  .logo-sub { font-size: 10px; color: rgba(255,255,255,0.35); letter-spacing: 0.08em; text-transform: uppercase; }
  .semana-nav {
    display: flex; align-items: center; gap: 10px;
    background: var(--gris-medio);
    padding: 7px 14px; border-radius: var(--radio);
    border: 1px solid rgba(255,255,255,0.08);
  }
  .semana-nav button {
    background: none; border: none; color: var(--celeste);
    font-size: 16px; cursor: pointer; opacity: 0.8; transition: opacity 0.15s;
  }
  .semana-nav button:hover { opacity: 1; }
  .semana-label {
    font-family: 'DM Mono', monospace; font-size: 12px;
    color: rgba(255,255,255,0.8); min-width: 130px; text-align: center;
  }
  .filtros {
    padding: 12px 32px; display: flex; gap: 8px; align-items: center;
    background: var(--blanco); border-bottom: 1px solid var(--gris-borde);
  }
  .filtro-btn {
    padding: 6px 16px; border-radius: 99px;
    border: 1.5px solid var(--gris-borde);
    background: transparent;
    font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500;
    cursor: pointer; transition: all 0.15s; color: var(--texto-suave);
  }
  .filtro-btn:hover { border-color: var(--celeste); color: var(--celeste); }
  .filtro-btn.activo { background: var(--negro); color: white; border-color: var(--negro); }
  .filtro-btn.entrenamiento.activo { background: var(--celeste); border-color: var(--celeste); color: white; }
  .filtro-btn.kinefilaxia.activo { background: #16a34a; border-color: #16a34a; color: white; }
  .contenido { padding: 20px 32px 40px; }
  .dias-tabs {
    display: flex; gap: 3px; margin-bottom: 20px;
    border-bottom: 2px solid var(--gris-borde);
  }
  .dia-tab {
    padding: 10px 18px 12px; border: none; background: none;
    font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500;
    cursor: pointer; color: var(--texto-suave);
    border-bottom: 2px solid transparent; margin-bottom: -2px;
    transition: all 0.15s; border-radius: 6px 6px 0 0; text-align: center;
  }
  .dia-tab:hover { color: var(--texto); background: rgba(30,159,224,0.05); }
  .dia-tab.activo { color: var(--celeste-oscuro); border-bottom-color: var(--celeste); font-weight: 600; }
  .dia-tab .dia-nombre { display: block; }
  .dia-tab .dia-fecha { display: block; font-size: 11px; font-family: 'DM Mono', monospace; color: var(--texto-suave); margin-top: 2px; }
  .dia-tab.hoy .dia-nombre { color: var(--celeste); }
  .dia-tab.hoy .dia-fecha { color: var(--celeste); }
  .dia-tab.hoy.activo { border-bottom-color: var(--celeste); }
  .resumen-top {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 10px; margin-bottom: 20px;
  }
  .resumen-card {
    background: var(--blanco); border: 1px solid var(--gris-borde);
    border-radius: var(--radio); padding: 14px 16px;
  }
  .resumen-card.destacado { border-color: var(--celeste); background: var(--celeste-claro); }
  .resumen-num { font-size: 26px; font-weight: 600; font-family: 'DM Mono', monospace; line-height: 1; margin-bottom: 4px; }
  .resumen-card.destacado .resumen-num { color: var(--celeste-oscuro); }
  .resumen-label { font-size: 12px; color: var(--texto-suave); }
  .turnos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
  .turno-card {
    background: var(--blanco); border-radius: var(--radio);
    border: 1px solid var(--gris-borde); overflow: hidden;
    transition: box-shadow 0.15s, transform 0.15s, border-color 0.15s; cursor: pointer;
  }
  .turno-card:hover {
    box-shadow: 0 4px 20px rgba(30,159,224,0.12);
    transform: translateY(-1px); border-color: var(--celeste-medio);
  }
  .turno-header {
    padding: 12px 14px; display: flex; align-items: center;
    justify-content: space-between; border-bottom: 1px solid var(--gris-borde);
  }
  .turno-hora { font-family: 'DM Mono', monospace; font-size: 17px; font-weight: 500; }
  .turno-tipo {
    font-size: 11px; font-weight: 600; padding: 3px 10px;
    border-radius: 99px; letter-spacing: 0.04em; text-transform: uppercase;
  }
  .tipo-entrenamiento { background: var(--celeste-claro); color: var(--celeste-oscuro); border: 1px solid var(--celeste-medio); }
  .tipo-kinefilaxia { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
  .turno-body { padding: 12px 14px; }
  .turno-profes { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; }
  .profe-tag {
    background: var(--gris-fondo); border: 1px solid var(--gris-borde);
    padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 500;
  }
  .turno-ocupacion { display: flex; align-items: center; gap: 10px; }
  .ocupacion-barra { flex: 1; height: 5px; background: var(--gris-borde); border-radius: 99px; overflow: hidden; }
  .ocupacion-fill { height: 100%; border-radius: 99px; transition: width 0.4s ease; }
  .fill-celeste { background: var(--celeste); }
  .fill-amarillo { background: var(--amarillo); }
  .fill-rojo { background: var(--rojo); }
  .ocupacion-texto { font-family: 'DM Mono', monospace; font-size: 12px; font-weight: 500; min-width: 38px; text-align: right; }
  .turno-footer {
    padding: 9px 14px; background: var(--gris-fondo);
    border-top: 1px solid var(--gris-borde);
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; color: var(--texto-suave);
  }
  .btn-ver {
    background: none; border: 1px solid var(--gris-borde);
    padding: 4px 12px; border-radius: 6px;
    font-family: 'DM Sans', sans-serif; font-size: 12px;
    cursor: pointer; color: var(--texto); transition: all 0.15s;
  }
  .btn-ver:hover { background: var(--celeste); color: white; border-color: var(--celeste); }
  .sin-turnos { text-align: center; padding: 60px 20px; color: var(--texto-suave); font-size: 14px; grid-column: 1/-1; }
  /* Modal */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.5); z-index: 100;
    align-items: center; justify-content: center; padding: 16px;
  }
  .modal-overlay.activo { display: flex; }
  .modal {
    background: white; border-radius: 14px;
    width: 460px; max-width: 100%; max-height: 88vh; overflow-y: auto;
    box-shadow: 0 24px 64px rgba(0,0,0,0.25);
    border-top: 3px solid var(--celeste);
  }
  .modal-header {
    padding: 18px 22px 14px; border-bottom: 1px solid var(--gris-borde);
    display: flex; align-items: flex-start; justify-content: space-between;
    position: sticky; top: 0; background: white; z-index: 1;
  }
  .modal-titulo { font-size: 17px; font-weight: 600; }
  .modal-subtitulo { font-size: 13px; color: var(--texto-suave); margin-top: 2px; }
  .modal-cerrar {
    background: var(--gris-fondo); border: none; width: 28px; height: 28px;
    border-radius: 50%; cursor: pointer; font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-left: 12px; color: var(--texto-suave); transition: background 0.15s;
  }
  .modal-cerrar:hover { background: var(--gris-borde); }
  .modal-body { padding: 18px 22px; }
  .modal-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .modal-chip {
    font-size: 12px; padding: 4px 12px; border-radius: 99px;
    background: var(--gris-fondo); border: 1px solid var(--gris-borde);
    color: var(--texto); font-weight: 500;
  }
  .ocupacion-grande {
    font-size: 32px; font-weight: 700; font-family: 'DM Mono', monospace; line-height: 1; margin-bottom: 4px;
  }
  .ocupacion-detalle { font-size: 12px; color: var(--texto-suave); margin-bottom: 16px; }
  .alumnos-titulo {
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.07em; color: var(--texto-suave); margin-bottom: 8px;
    padding-bottom: 6px; border-bottom: 1px solid var(--gris-borde);
  }
  .alumno-item {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 9px 10px; border-radius: 7px; margin-bottom: 3px; transition: background 0.1s;
  }
  .alumno-item:hover { background: var(--gris-fondo); }
  .alumno-nombre { font-size: 13px; font-weight: 500; }
  .alumno-id { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--texto-suave); margin-top: 1px; }
  .estado-badge { font-size: 11px; padding: 2px 9px; border-radius: 99px; font-weight: 500; text-transform: capitalize; }
  .estado-presente { background: #dcfce7; color: #166534; }
  .estado-ausente { background: #fee2e2; color: #991b1b; }
  .estado-reservado { background: var(--celeste-claro); color: var(--celeste-oscuro); }
  .modal-footer {
    padding: 14px 22px; border-top: 1px solid var(--gris-borde);
    display: flex; gap: 8px; justify-content: flex-end;
    background: var(--gris-fondo); border-radius: 0 0 14px 14px;
  }
  .btn-modal {
    padding: 8px 18px; border-radius: 8px;
    font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500;
    cursor: pointer; transition: all 0.15s;
    border: 1.5px solid var(--gris-borde); background: white; color: var(--texto);
  }
  .btn-modal:hover { background: var(--gris-borde); }
  .btn-modal.primario { background: var(--celeste); color: white; border-color: var(--celeste); }
  .btn-modal.primario:hover { background: var(--celeste-oscuro); border-color: var(--celeste-oscuro); }
  .btn-asistencia {
    width: 28px; height: 28px;
    border-radius: 50%; border: none;
    font-size: 13px; cursor: pointer;
    transition: all 0.15s;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .btn-presente { background: #dcfce7; color: #166534; }
  .btn-presente:hover, .btn-presente.activo { background: #16a34a; color: white; }
  .btn-ausente { background: #fee2e2; color: #991b1b; }
  .btn-ausente:hover, .btn-ausente.activo { background: #dc2626; color: white; }
  .alumno-acciones { display: flex; gap: 5px; align-items: center; }
  .alumno-item { cursor: default; }
  .resumen-asistencia {
    display: flex; gap: 12px; margin-bottom: 16px;
    padding: 10px 12px; background: var(--gris-fondo);
    border-radius: 8px; font-size: 13px;
  }
  .resumen-asistencia span { font-weight: 500; }
  .res-presente { color: #16a34a; }
  .res-ausente { color: #dc2626; }
  .res-pendiente { color: var(--texto-suave); }
  /* Cartel justificación */
  .justif-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.5); z-index: 200;
    align-items: center; justify-content: center; padding: 16px;
  }
  .justif-overlay.activo { display: flex; }
  .justif-modal {
    background: white; border-radius: 12px;
    width: 360px; max-width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    border-top: 3px solid var(--rojo);
    overflow: hidden;
  }
  .justif-header {
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--gris-borde);
  }
  .justif-titulo { font-size: 15px; font-weight: 600; }
  .justif-nombre { font-size: 13px; color: var(--texto-suave); margin-top: 2px; }
  .justif-body { padding: 16px 20px; }
  .justif-pregunta { font-size: 14px; font-weight: 500; margin-bottom: 12px; }
  .justif-opciones { display: flex; gap: 8px; margin-bottom: 14px; }
  .justif-opcion {
    flex: 1; padding: 10px; border-radius: 8px;
    border: 2px solid var(--gris-borde);
    background: white; font-family: 'DM Sans', sans-serif;
    font-size: 13px; font-weight: 500; cursor: pointer;
    transition: all 0.15s; text-align: center;
  }
  .justif-opcion:hover { border-color: var(--celeste); }
  .justif-opcion.seleccionado-si { border-color: #16a34a; background: #dcfce7; color: #166534; }
  .justif-opcion.seleccionado-no { border-color: var(--rojo); background: #fee2e2; color: #991b1b; }
  .justif-motivo {
    width: 100%; padding: 8px 12px; border-radius: 8px;
    border: 1.5px solid var(--gris-borde); font-family: 'DM Sans', sans-serif;
    font-size: 13px; resize: none; outline: none; transition: border-color 0.15s;
    display: none;
  }
  .justif-motivo:focus { border-color: var(--celeste); }
  .justif-motivo.visible { display: block; }
  .justif-footer {
    padding: 12px 20px; border-top: 1px solid var(--gris-borde);
    display: flex; gap: 8px; justify-content: flex-end;
    background: var(--gris-fondo);
  }
  /* LOGIN */
  .login-overlay {
    display: flex; position: fixed; inset: 0;
    background: var(--negro); z-index: 999;
    align-items: center; justify-content: center;
    padding: 20px;
  }
  .login-overlay.oculto { display: none; }
  .login-box {
    background: #1a1a1a; border-radius: 16px;
    padding: 40px; width: 360px; max-width: 100%;
    border: 1px solid rgba(255,255,255,0.08);
    border-top: 3px solid var(--celeste);
  }
  .login-logo {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 32px; justify-content: center;
  }
  .login-logo-img {
    width: 56px; height: 56px;
    background: #1e9fe0 center/contain no-repeat;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .login-logo-texto { font-size: 22px; font-weight: 600; color: white; }
  .login-logo-texto span { color: var(--celeste); }
  .login-subtitulo {
    font-size: 11px; color: rgba(255,255,255,0.35);
    text-transform: uppercase; letter-spacing: 0.08em;
    text-align: center; margin-bottom: 28px;
  }
  .login-campo {
    margin-bottom: 14px;
  }
  .login-label {
    display: block; font-size: 12px; color: rgba(255,255,255,0.5);
    margin-bottom: 6px; font-weight: 500;
  }
  .login-input {
    width: 100%; padding: 11px 14px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.06);
    color: white; font-family: 'DM Sans', sans-serif;
    font-size: 14px; outline: none; transition: border-color 0.15s;
  }
  .login-input:focus { border-color: var(--celeste); }
  .login-btn {
    width: 100%; padding: 12px; border-radius: 8px;
    background: var(--celeste); color: white; border: none;
    font-family: 'DM Sans', sans-serif; font-size: 14px;
    font-weight: 600; cursor: pointer; margin-top: 8px;
    transition: background 0.15s;
  }
  .login-btn:hover { background: var(--celeste-oscuro); }
  .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .login-error {
    color: #ef4444; font-size: 13px; text-align: center;
    margin-top: 10px; display: none;
  }
  .login-error.visible { display: block; }
  /* ===== Panel de Evolución ===== */
  .evo-check {
    width: 22px; height: 22px; flex-shrink: 0;
    border: 2px solid var(--gris-borde); border-radius: 6px;
    cursor: pointer; transition: all 0.12s; margin-right: 4px;
    display: flex; align-items: center; justify-content: center;
  }
  .evo-check:hover { border-color: var(--celeste); }
  .evo-check.marcado { background: var(--celeste); border-color: var(--celeste); }
  .evo-check.marcado::after { content: '✓'; color: white; font-size: 13px; font-weight: 700; }
  .evo-mini {
    font-size: 11px; color: #16a34a; margin-top: 3px;
    background: #f0fdf4; border-radius: 5px; padding: 3px 7px;
    display: inline-block; max-width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .btn-asistencia.evo-hecha { box-shadow: 0 0 0 2px rgba(22,163,74,0.18); }
  .evo-panel {
    border-top: 2px solid var(--celeste);
    background: var(--celeste-claro);
    padding: 16px 24px 20px; margin: 0;
  }
  .evo-titulo { font-size: 15px; font-weight: 600; color: var(--celeste-oscuro); margin-bottom: 12px; }
  .evo-sublabel { font-size: 11px; font-weight: 600; color: var(--texto-suave); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; }
  .evo-recientes-wrap { margin-bottom: 14px; }
  .evo-recientes { display: flex; flex-wrap: wrap; gap: 6px; }
  .evo-reciente {
    background: var(--blanco); border: 1px solid var(--celeste-medio);
    color: var(--celeste-oscuro); border-radius: 99px;
    padding: 5px 12px; font-size: 12px; cursor: pointer;
    font-family: 'DM Sans', sans-serif; transition: all 0.12s;
  }
  .evo-reciente:hover { background: var(--celeste); color: white; border-color: var(--celeste); }
  .evo-campos { display: flex; flex-direction: column; gap: 8px; }
  .evo-input {
    width: 100%; padding: 9px 12px; border-radius: 8px;
    border: 1px solid var(--gris-borde); background: var(--blanco);
    font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--texto);
    outline: none; resize: vertical; transition: border-color 0.12s;
  }
  .evo-input:focus { border-color: var(--celeste); }
  .evo-fila { display: flex; gap: 18px; flex-wrap: wrap; }
  .evo-grupo { flex: 1; min-width: 200px; }
  .evo-caritas { display: flex; flex-wrap: wrap; gap: 5px; }
  .evo-carita {
    background: var(--blanco); border: 1px solid var(--gris-borde);
    border-radius: 8px; padding: 6px 9px; font-size: 12px; cursor: pointer;
    font-family: 'DM Sans', sans-serif; transition: all 0.12s; white-space: nowrap;
  }
  .evo-carita:hover { border-color: var(--celeste); }
  .evo-carita.sel { background: var(--celeste); color: white; border-color: var(--celeste); }
  .evo-dolor { display: flex; gap: 6px; }
  .evo-dolor-btn {
    background: var(--blanco); border: 1px solid var(--gris-borde);
    border-radius: 8px; padding: 7px 18px; font-size: 13px; cursor: pointer;
    font-family: 'DM Sans', sans-serif; font-weight: 500; transition: all 0.12s;
  }
  .evo-dolor-btn:hover { border-color: var(--celeste); }
  #evo-dolor-no.sel { background: var(--verde-ok); color: white; border-color: var(--verde-ok); }
  #evo-dolor-si.sel { background: var(--rojo); color: white; border-color: var(--rojo); }
  .evo-acciones { display: flex; gap: 8px; margin-top: 14px; align-items: center; }
  .evo-btn-sec {
    background: var(--blanco); border: 1.5px solid var(--celeste);
    color: var(--celeste-oscuro); border-radius: 8px; padding: 9px 14px;
    font-size: 13px; font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif;
    transition: all 0.12s; white-space: nowrap;
  }
  .evo-btn-sec:hover { background: var(--celeste); color: white; }
  .evo-btn-pri {
    flex: 1; background: var(--celeste); border: none; color: white;
    border-radius: 8px; padding: 10px 14px; font-size: 13px; font-weight: 600;
    cursor: pointer; font-family: 'DM Sans', sans-serif; transition: background 0.12s;
  }
  .evo-btn-pri:hover:not(:disabled) { background: var(--celeste-oscuro); }
  .evo-btn-pri:disabled { opacity: 0.5; cursor: not-allowed; }
  .evo-ayuda { font-size: 11px; color: var(--texto-suave); margin-top: 10px; line-height: 1.5; }
  @media (max-width: 600px) {
    header { padding: 0 16px; }
    .contenido { padding: 14px 16px 32px; }
    .filtros { padding: 10px 16px; }
    .dias-tabs { overflow-x: auto; }
    .dia-tab { padding: 8px 12px 10px; font-size: 12px; }
    .evo-panel { padding: 14px 16px 18px; }
    .evo-fila { gap: 12px; }
  }
</style>
</head>
<body>
<header>
  <div class="logo">
    <div class="logo-img"></div>
    <div>

// Fecha REAL (date) del día activo dentro de la semana que se está viendo
function fechaRealDiaActivo() {
  const lunes = getLunes(offsetSemana);
  const idx = DIAS.indexOf(diaActivo);
  const f = getDiaFecha(idx < 0 ? 0 : idx, lunes);
  // YYYY-MM-DD en horario local (no UTC, para que no se corra un día)
  const y = f.getFullYear();
  const m = String(f.getMonth() + 1).padStart(2, '0');
  const d = String(f.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

// Cache de datos
let HORARIOS = [];
let ALUMNOS_POR_TURNO = {};
let cargando = false;
async function cargarDatos() {
  if (cargando) return;
  cargando = true;
  mostrarCargando(true);
  try {
    // Cargar turnos
    const turnos = await supabaseQuery('turnos', '?select=*&order=dia,hora,servicio');
    
    // Cargar profes por turno
    const profes = await supabaseQuery('turno_profes', '?select=*');
    const mapaProfe = {};
    profes.forEach(p => {
      if (!mapaProfe[p.turno_id]) mapaProfe[p.turno_id] = [];
      mapaProfe[p.turno_id].push(p.nombre_profe);
    });
    HORARIOS = turnos.map(t => ({
      id: t.id,
      dia: t.dia,
      hora: t.hora,
      servicio: t.servicio,
      capacidad: t.capacidad,
      profes: mapaProfe[t.id] || []
    }));
    // Cargar alumnos por turno
    const alumnosTurno = await supabaseQuery('turno_alumnos', '?select=turno_id,persona_id,personas(id,nombre)&activo=eq.true');
    
    ALUMNOS_POR_TURNO = {};
    alumnosTurno.forEach(at => {
      const turno = HORARIOS.find(t => t.id === at.turno_id);
      if (!turno) return;
      const key = `${turno.dia}-${turno.hora}-${turno.servicio}`;
      if (!ALUMNOS_POR_TURNO[key]) ALUMNOS_POR_TURNO[key] = [];
      ALUMNOS_POR_TURNO[key].push({
        id: String(at.personas.id),
        nombre: at.personas.nombre,
        estado: 'reservado'
      });
    });
    renderDiasTabs();
    renderTurnos();
  } catch(err) {
    console.error('Error cargando datos:', err);
    document.getElementById('turnos-grid').innerHTML = 
      '<div class="sin-turnos">Error conectando a la base de datos. Recargá la página.</div>';
  } finally {
    cargando = false;
    mostrarCargando(false);
  }
}
function mostrarCargando(activo) {
  const grid = document.getElementById('turnos-grid');
  if (activo) {
    grid.innerHTML = '<div class="sin-turnos" style="color:var(--celeste)">⟳ Cargando datos...</div>';
  }
}
const DIAS = ['Lunes','Martes','Miércoles','Jueves','Viernes'];
let diaActivo = '';
let filtroActivo = 'todos';
let offsetSemana = 0;
function getLunes(offset) {
  const hoy = new Date();
  const dia = hoy.getDay();
  const diff = dia === 0 ? -6 : 1 - dia;
  const lunes = new Date(hoy);
  lunes.setDate(hoy.getDate() + diff + offset * 7);
  lunes.setHours(0,0,0,0);
  return lunes;
}
function formatFecha(f) {
  return f.toLocaleDateString('es-AR', {day:'2-digit', month:'2-digit'});
}
function getDiaFecha(idx, lunes) {
  const f = new Date(lunes);
  f.setDate(lunes.getDate() + idx);
  return f;
}
function esHoy(fecha) {
  const h = new Date();
  return fecha.getDate()===h.getDate() && fecha.getMonth()===h.getMonth() && fecha.getFullYear()===h.getFullYear();
}
function actualizarSemanaLabel() {
  const lunes = getLunes(offsetSemana);
  const viernes = new Date(lunes);
  viernes.setDate(lunes.getDate() + 4);
  document.getElementById('semana-label').textContent = formatFecha(lunes) + ' — ' + formatFecha(viernes);
}
function cambiarSemana(delta) {
  offsetSemana += delta;
  actualizarSemanaLabel();
  renderDiasTabs();
  renderTurnos();
}
function renderDiasTabs() {
  const lunes = getLunes(offsetSemana);
  const container = document.getElementById('dias-tabs');
  container.innerHTML = '';
  DIAS.forEach((dia, i) => {
    const fecha = getDiaFecha(i, lunes);
    const hoy = esHoy(fecha);
    const btn = document.createElement('button');
    btn.className = 'dia-tab' + (dia===diaActivo?' activo':'') + (hoy?' hoy':'');
    btn.innerHTML = `<span class="dia-nombre">${dia}</span><span class="dia-fecha">${formatFecha(fecha)}</span>`;
    btn.onclick = () => seleccionarDia(dia);
    container.appendChild(btn);
  });
}
function seleccionarDia(dia) {
  diaActivo = dia;
  renderDiasTabs();
  renderTurnos();
}
function getTurnosDia() {
  return HORARIOS.filter(t => {
    if (t.dia !== diaActivo) return false;
    if (filtroActivo !== 'todos' && t.servicio !== filtroActivo) return false;
    return true;
  }).sort((a,b) => {
    const ha = parseInt(a.hora.replace(':',''));
    const hb = parseInt(b.hora.replace(':',''));
    return ha !== hb ? ha - hb : a.servicio.localeCompare(b.servicio);
  });
}
function getAlumnos(t) {
  return ALUMNOS_POR_TURNO[`${t.dia}-${t.hora}-${t.servicio}`] || [];
}
function renderResumen() {
  const turnos = getTurnosDia();
  const totalCap = turnos.reduce((s,t)=>s+t.capacidad,0);
  const totalOcup = turnos.reduce((s,t)=>s+getAlumnos(t).length,0);
  const pct = totalCap > 0 ? Math.round(totalOcup/totalCap*100) : 0;
  document.getElementById('resumen-top').innerHTML = `
    <div class="resumen-card"><div class="resumen-num">${turnos.length}</div><div class="resumen-label">Turnos del día</div></div>
    <div class="resumen-card destacado"><div class="resumen-num">${totalOcup}</div><div class="resumen-label">Alumnos anotados</div></div>
    <div class="resumen-card"><div class="resumen-num">${totalCap-totalOcup}</div><div class="resumen-label">Lugares libres</div></div>
    <div class="resumen-card"><div class="resumen-num">${pct}%</div><div class="resumen-label">Ocupación</div></div>
  `;
}
function renderTurnos() {
  renderResumen();
  const turnos = getTurnosDia();
  const container = document.getElementById('turnos-grid');
  if (!diaActivo) {
    container.innerHTML = '<div class="sin-turnos">Seleccioná un día para ver los turnos</div>';
    return;
  }
  if (!turnos.length) {
    container.innerHTML = '<div class="sin-turnos">No hay turnos para este filtro</div>';
    return;
  }
  container.innerHTML = turnos.map(t => {
    const alumnos = getAlumnos(t);
    const ocup = alumnos.length;
    const pct = Math.round(ocup/t.capacidad*100);
    const colorFill = pct>=100?'fill-rojo':pct>=75?'fill-amarillo':'fill-celeste';
    const colorTexto = pct>=100?'var(--rojo)':pct>=75?'var(--amarillo)':'var(--celeste-oscuro)';
    const tipoClass = t.servicio==='Entrenamiento'?'tipo-entrenamiento':'tipo-kinefilaxia';
    const libres = t.capacidad - ocup;
    return `
      <div class="turno-card" onclick="abrirModal('${t.dia}','${t.hora}','${t.servicio}')">
        <div class="turno-header">
          <span class="turno-hora">${t.hora}</span>
          <span class="turno-tipo ${tipoClass}">${t.servicio}</span>
        </div>
        <div class="turno-body">
          <div class="turno-profes">${t.profes.map(p=>`<span class="profe-tag">${p}</span>`).join('')}</div>
          <div class="turno-ocupacion">
            <div class="ocupacion-barra"><div class="ocupacion-fill ${colorFill}" style="width:${Math.min(pct,100)}%"></div></div>
            <span class="ocupacion-texto" style="color:${colorTexto}">${ocup}/${t.capacidad}</span>
          </div>
        </div>
        <div class="turno-footer">
          <span>${libres} lugar${libres!==1?'es':''} libre${libres!==1?'s':''}</span>
          <button class="btn-ver" onclick="event.stopPropagation();abrirModal('${t.dia}','${t.hora}','${t.servicio}')">Ver lista</button>
        </div>
      </div>
    `;
  }).join('');
}
// =============================================
// ASISTENCIA (persiste en tabla `asistencia`)
// =============================================
// Estado en memoria (key: dia-hora-servicio-id) — espejo de lo que hay en la base
const asistenciaEstados = {};
const asistenciaMotivos = {};
// Guardamos el id de la fila en `asistencia` para poder borrarla al volver a "reservado"
const asistenciaFilaId = {};

function getEstadoAlumno(dia, hora, servicio, id) {
  const key = `${dia}-${hora}-${servicio}-${id}`;
  return asistenciaEstados[key] || 'reservado';
}

// Carga la asistencia ya guardada de un turno en una fecha (al abrir el modal)
async function cargarAsistenciaTurno(t) {
  const fecha = fechaRealDiaActivo();
  try {
    const filas = await supabaseQuery('asistencia',
      `?select=*&turno_id=eq.${t.id}&fecha=eq.${fecha}`);
    (filas || []).forEach(f => {
      const key = `${t.dia}-${t.hora}-${t.servicio}-${f.persona_id}`;
      asistenciaEstados[key] = f.estado;
      asistenciaFilaId[key] = f.id;
      if (f.motivo) asistenciaMotivos[key] = f.motivo;
    });
  } catch (e) {
    console.warn('No se pudo cargar asistencia', e);
  }
}

// Guarda (o borra) la asistencia de un alumno en la base
async function guardarAsistencia(t, personaId, estado, motivo) {
  const key = `${t.dia}-${t.hora}-${t.servicio}-${personaId}`;
  const fecha = fechaRealDiaActivo();
  try {
    if (estado === 'reservado') {
      // Volver a reservado = borrar el registro de asistencia
      if (asistenciaFilaId[key]) {
        await supabaseDelete('asistencia', `id=eq.${asistenciaFilaId[key]}`);
        delete asistenciaFilaId[key];
      }
      delete asistenciaEstados[key];
      delete asistenciaMotivos[key];
      return;
    }
    if (asistenciaFilaId[key]) {
      // Ya existía → actualizar
      await supabaseUpdate('asistencia', `id=eq.${asistenciaFilaId[key]}`,
        { estado, motivo: motivo || null });
    } else {
      // Nuevo → insertar y guardar el id
      const filas = await supabaseInsertReturn('asistencia',
        { turno_id: t.id, persona_id: parseInt(personaId), fecha, estado, motivo: motivo || null });
      if (filas && filas[0]) asistenciaFilaId[key] = filas[0].id;
    }
    asistenciaEstados[key] = estado;
    if (motivo) asistenciaMotivos[key] = motivo; else delete asistenciaMotivos[key];
  } catch (e) {
    console.error('Error guardando asistencia', e);
    toast('No se pudo guardar la asistencia: ' + e.message, 'err');
  }
}

function toggleEstado(dia, hora, servicio, id, nuevoEstado) {
  const t = HORARIOS.find(x=>x.dia===dia&&x.hora===hora&&x.servicio===servicio);
  if (!t) return;
  const key = `${dia}-${hora}-${servicio}-${id}`;
  const actual = asistenciaEstados[key] || 'reservado';
  if (nuevoEstado === 'ausente') {
    if (actual === 'ausente' || actual === 'ausente-justificada') {
      // Ya estaba ausente → vuelve a reservado
      guardarAsistencia(t, id, 'reservado').then(() => {
        renderModalBody(dia, hora, servicio);
        renderTurnos();
      });
    } else {
      // Abrir cartel de justificación
      const alumnos = getAlumnos({dia, hora, servicio});
      const alumno = alumnos.find(a => a.id === id);
      abrirJustif(dia, hora, servicio, id, alumno ? alumno.nombre : id);
    }
    return;
  }
  const destino = actual === nuevoEstado ? 'reservado' : nuevoEstado;
  guardarAsistencia(t, id, destino).then(() => {
    renderModalBody(dia, hora, servicio);
    renderTurnos();
  });
}

  if (t.includes('😀')) return 5;
  if (t.includes('🙂')) return 4;
  if (t.includes('😴')) return 3;
  if (t.includes('😐')) return 2;
  if (t.includes('😣')) return 1;
  return null;
}
// Evoluciones ya cargadas para el turno+fecha abierto (key: persona_id -> fila)
let EVO_TURNO = {};      // persona_id -> {id, modulo, contenido, ...}
let EVO_RECIENTES = [];  // últimas anotaciones cargadas (para reusar)
let evoSeleccion = new Set(); // persona_id seleccionados para aplicar en lote

async function cargarEvolucionesTurno(t) {
  EVO_TURNO = {};
  const fecha = fechaRealDiaActivo();
  try {
    const filas = await supabaseQuery('evoluciones_tf',
      `?select=*&turno_id=eq.${t.id}&fecha=eq.${fecha}`);
    (filas || []).forEach(f => { EVO_TURNO[String(f.persona_id)] = f; });
  } catch (e) { console.warn('No se pudo cargar evoluciones', e); }
}

// Carga las últimas anotaciones distintas (para el cajón de "recientes")
async function cargarEvolucionesRecientes(servicio) {
  try {
    const filas = await supabaseQuery('evoluciones_tf',
      `?select=modulo,contenido&order=creado_en.desc&limit=40`);
    // Quedarnos con combinaciones únicas de modulo+contenido (las más recientes)
    const vistas = new Set();
    EVO_RECIENTES = [];
    (filas || []).forEach(f => {
      const k = (f.modulo||'') + '||' + (f.contenido||'');
      if (k === '||') return;
      if (vistas.has(k)) return;
      vistas.add(k);
      EVO_RECIENTES.push({ modulo: f.modulo||'', contenido: f.contenido||'' });
    });
    EVO_RECIENTES = EVO_RECIENTES.slice(0, 8);
  } catch (e) { EVO_RECIENTES = []; }
}

// Toggle de selección de un alumno para el lote
window.evoToggleSel = (personaId) => {
  const k = String(personaId);
  if (evoSeleccion.has(k)) evoSeleccion.delete(k); else evoSeleccion.add(k);
  pintarSeleccionEvo();
};
window.evoSelTodos = () => {
  const alumnos = getAlumnos(evoTurnoActual);
  const todos = alumnos.every(a => evoSeleccion.has(String(a.id)));
  evoSeleccion = new Set(todos ? [] : alumnos.map(a => String(a.id)));
  pintarSeleccionEvo();
};
function pintarSeleccionEvo() {
  document.querySelectorAll('[data-evo-check]').forEach(el => {
    const id = el.getAttribute('data-evo-check');
    el.classList.toggle('marcado', evoSeleccion.has(id));
  });
  const n = evoSeleccion.size;
  const btn = document.getElementById('evo-aplicar-btn');
  if (btn) {
    btn.textContent = n > 0 ? `Guardar evolución a ${n} alumno${n!==1?'s':''}` : 'Elegí alumnos para aplicar';
    btn.disabled = n === 0;
  }
  const bt = document.getElementById('evo-seltodos-btn');
  if (bt) {
    const alumnos = getAlumnos(evoTurnoActual);
    const todos = alumnos.length>0 && alumnos.every(a => evoSeleccion.has(String(a.id)));
    bt.textContent = todos ? 'Quitar todos' : 'Seleccionar todos';
  }
}
// Traer una anotación reciente al panel
window.evoUsarReciente = (i) => {
  const r = EVO_RECIENTES[i];
  if (!r) return;
  document.getElementById('evo-modulo').value = r.modulo || '';
  document.getElementById('evo-contenido').value = r.contenido || '';
};
// Guardar la anotación del panel a TODOS los seleccionados
window.evoAplicarLote = async () => {
  if (evoSeleccion.size === 0) return;
  const t = evoTurnoActual;
  const datosBase = leerPanelEvo();
  if (!datosBase.modulo && !datosBase.contenido && !datosBase.observacion && !datosBase.como_se_sintio && !datosBase.dolor) {
    toast('Escribí algo en la evolución antes de aplicar', 'err'); return;
  }
  const btn = document.getElementById('evo-aplicar-btn');
  btn.disabled = true; btn.textContent = 'Guardando...';
  let ok = 0;
  for (const pid of evoSeleccion) {
    try { await guardarEvolucionAlumno(t, pid, datosBase); ok++; }
    catch (e) { console.error('evo', pid, e); }
  }
  await cargarEvolucionesTurno(t);
  await cargarEvolucionesRecientes(t.servicio);
  evoSeleccion = new Set();
  // Limpiar panel
  document.getElementById('evo-modulo').value = '';
  document.getElementById('evo-contenido').value = '';
  document.getElementById('evo-obs').value = '';
  evoCaritaSel = ''; evoDolorSel = false;
  toast(`✓ Evolución guardada a ${ok} alumno${ok!==1?'s':''}`);
  renderModalBody(t.dia, t.hora, t.servicio);
};
// Lee el panel "Anotación de hoy"
let evoCaritaSel = '';
let evoDolorSel = false;
function leerPanelEvo() {
  return {
    modulo: (document.getElementById('evo-modulo')?.value || '').trim(),
    contenido: (document.getElementById('evo-contenido')?.value || '').trim(),
    como_se_sintio: evoCaritaSel || null,
    dolor: !!evoDolorSel,
    observacion: (document.getElementById('evo-obs')?.value || '').trim() || null
  };
}
window.evoSetCarita = (c) => {
  evoCaritaSel = (evoCaritaSel === c) ? '' : c;
  document.querySelectorAll('[data-evo-carita]').forEach(el => {
    el.classList.toggle('sel', el.getAttribute('data-evo-carita') === evoCaritaSel);
  });
};
window.evoSetDolor = (v) => {
  evoDolorSel = v;
  document.getElementById('evo-dolor-si')?.classList.toggle('sel', v);
  document.getElementById('evo-dolor-no')?.classList.toggle('sel', !v);
};

// Guarda la evolución de UN alumno (insert o update)
async function guardarEvolucionAlumno(t, personaId, datos) {
  const fecha = fechaRealDiaActivo();
  const existente = EVO_TURNO[String(personaId)];
  const fila = {
    turno_id: t.id,
    persona_id: parseInt(personaId),
    fecha,
    servicio: t.servicio,
    modulo: datos.modulo || null,
    contenido: datos.contenido || null,
    como_se_sintio: datos.como_se_sintio || null,
    dolor: !!datos.dolor,
    observacion: datos.observacion || null,
    score: scoreDesdeCarita(datos.como_se_sintio)
  };
  if (existente) {
    fila.editado_en = new Date().toISOString();
    fila.editado_por_nombre = USUARIO_ACTUAL?.nombre || null;
    fila.editado_por_email = USUARIO_ACTUAL?.email || null;
    await supabaseUpdate('evoluciones_tf', `id=eq.${existente.id}`, fila);
  } else {
    fila.autor_id = USUARIO_ACTUAL?.id || null;
    fila.autor_nombre = USUARIO_ACTUAL?.nombre || null;
    fila.autor_email = USUARIO_ACTUAL?.email || null;
    await supabaseInsert('evoluciones_tf', fila);
  }
  // Marcar presente automáticamente si estaba sin marcar (cargó evolución = vino)
  const key = `${t.dia}-${t.hora}-${t.servicio}-${personaId}`;
  if ((asistenciaEstados[key] || 'reservado') === 'reservado') {
    await guardarAsistencia(t, personaId, 'presente');
  }
}

// Abrir el panel de evolución individual de un alumno (precargado si ya tiene)
window.abrirEvoIndividual = (personaId) => {
  const ev = EVO_TURNO[String(personaId)];
  // Cargar al panel los datos del alumno (o vacío) y seleccionarlo solo a él
  document.getElementById('evo-modulo').value = ev?.modulo || '';
  document.getElementById('evo-contenido').value = ev?.contenido || '';
  document.getElementById('evo-obs').value = ev?.observacion || '';
  evoCaritaSel = ev?.como_se_sintio || '';
  evoDolorSel = !!ev?.dolor;
  evoSeleccion = new Set([String(personaId)]);
  pintarSeleccionEvo();
  document.querySelectorAll('[data-evo-carita]').forEach(el => {
    el.classList.toggle('sel', el.getAttribute('data-evo-carita') === evoCaritaSel);
  });
  document.getElementById('evo-dolor-si')?.classList.toggle('sel', evoDolorSel);
  document.getElementById('evo-dolor-no')?.classList.toggle('sel', !evoDolorSel);
  // Scroll al panel
  document.getElementById('evo-panel')?.scrollIntoView({behavior:'smooth', block:'center'});
};

function renderModalBody(dia, hora, servicio) {
  const t = HORARIOS.find(x=>x.dia===dia&&x.hora===hora&&x.servicio===servicio);
  if (!t) return;
  evoTurnoActual = t;
  const alumnos = getAlumnos(t);
  const ocup = alumnos.length;
  const pct = Math.round(ocup/t.capacidad*100);
  const colorOcup = pct>=100?'var(--rojo)':pct>=75?'var(--amarillo)':'var(--celeste)';
  const tipoClass = servicio==='Entrenamiento'?'tipo-entrenamiento':'tipo-kinefilaxia';
  const presentes = alumnos.filter(a=>getEstadoAlumno(dia,hora,servicio,a.id)==='presente').length;
  const ausentesJust = alumnos.filter(a=>getEstadoAlumno(dia,hora,servicio,a.id)==='ausente-justificada').length;
  const ausentesSinJust = alumnos.filter(a=>getEstadoAlumno(dia,hora,servicio,a.id)==='ausente').length;
  const ausentes = ausentesJust + ausentesSinJust;
  const pendientes = alumnos.length - presentes - ausentes;
  document.getElementById('modal-titulo').textContent = `${servicio} · ${hora}`;
  document.getElementById('modal-subtitulo').textContent = dia;
  document.getElementById('modal-body').innerHTML = `
    <div class="modal-chips">
      <span class="turno-tipo ${tipoClass}">${servicio}</span>
      ${t.profes.map(p=>`<span class="modal-chip">${p}</span>`).join('')}
      <span class="modal-chip">Cap. ${t.capacidad}</span>
    </div>
    <div class="ocupacion-grande" style="color:${colorOcup}">${ocup}<span style="font-size:16px;color:var(--texto-suave)">/${t.capacidad}</span></div>
    <div class="resumen-asistencia">
      <span class="res-presente">✓ ${presentes} presentes</span>
      <span class="res-ausente">✗ ${ausentesSinJust} ausentes</span>
      ${ausentesJust > 0 ? `<span style="color:#16a34a">✓ ${ausentesJust} justif.</span>` : ''}
      <span class="res-pendiente">○ ${pendientes} sin marcar</span>
    </div>
    <div class="alumnos-titulo">Lista de alumnos — marcá asistencia</div>
    ${alumnos.length===0
      ? '<div style="color:var(--texto-suave);font-size:13px;padding:8px 0">Sin alumnos anotados</div>'
      : alumnos.map(a => {
          const est = getEstadoAlumno(dia,hora,servicio,a.id);
          const esAusente = est==='ausente' || est==='ausente-justificada';
          const motivo = asistenciaMotivos[`${dia}-${hora}-${servicio}-${a.id}`] || '';
          const ev = EVO_TURNO[String(a.id)];
          const tieneEvo = !!ev;
          const resumenEvo = tieneEvo
            ? `<div class="evo-mini">📝 ${[ev.modulo, ev.contenido].filter(Boolean).join(' · ') || 'evolución cargada'}${ev.como_se_sintio? ' · '+ev.como_se_sintio : ''}${ev.dolor? ' · ⚠️ dolor':''}</div>`
            : '';
          return `
          <div class="alumno-item" style="background:${est==='presente'?'#f0fdf4':esAusente?'#fef2f2':'transparent'}">
            <div class="evo-check" data-evo-check="${a.id}" onclick="evoToggleSel(${a.id})" title="Seleccionar para cargar evolución"></div>
            <div style="flex:1; min-width:0">
              <div class="alumno-nombre">${a.nombre}</div>
              <div class="alumno-id">#${a.id}${est==='ausente-justificada'?' · <span style="color:#16a34a;font-size:11px">justificada</span>':est==='ausente'?' · <span style="color:#dc2626;font-size:11px">sin justificar</span>':''}</div>
              ${motivo ? `<div style="font-size:11px;color:var(--texto-suave);margin-top:2px">${motivo}</div>` : ''}
              ${resumenEvo}
            </div>
            <div class="alumno-acciones">
              <button class="btn-asistencia btn-presente ${est==='presente'?'activo':''}"
                onclick="toggleEstado('${dia}','${hora}','${servicio}','${a.id}','presente')"
                title="Marcar presente">✓</button>
              <button class="btn-asistencia btn-ausente ${esAusente?'activo':''}"
                onclick="toggleEstado('${dia}','${hora}','${servicio}','${a.id}','ausente')"
                title="Marcar ausente">✗</button>
              <button class="btn-asistencia ${tieneEvo?'evo-hecha':''}" style="${tieneEvo?'background:#16a34a;color:white;border-color:#16a34a;':'background:#f0f9ff;color:#1e9fe0;border-color:#b8dcf0;'}"
                onclick="abrirEvoIndividual(${a.id})"
                title="${tieneEvo?'Ver / editar evolución':'Cargar evolución'}">📝</button>
              <button class="btn-asistencia" style="background:#1e9fe0;color:white;border-color:#1e9fe0;"
                onclick="parent.postMessage({tipo:'VER_HC',persona_id:${a.id}},'*')"
                title="Ver historia clínica">🩺</button>
            </div>
          </div>`;
        }).join('')
    }
  `;
  renderPanelEvo();
}

// Pinta el panel "Anotación de hoy" debajo del body (separado para no recargar inputs al re-render de la lista)
function renderPanelEvo() {
  const cont = document.getElementById('evo-panel');
  if (!cont) return;
  const recientesHtml = EVO_RECIENTES.length
    ? EVO_RECIENTES.map((r,i) => `<button class="evo-reciente" onclick="evoUsarReciente(${i})" title="${[r.modulo,r.contenido].filter(Boolean).join(' · ').replace(/"/g,'&quot;')}">${(r.modulo || r.contenido || '').slice(0,32)}${(r.modulo||r.contenido||'').length>32?'…':''}</button>`).join('')
    : '<span style="font-size:12px;color:var(--texto-suave)">Todavía no hay anotaciones previas para reusar.</span>';
  cont.innerHTML = `
    <div class="evo-titulo">📝 Anotación de hoy</div>
    <div class="evo-recientes-wrap">
      <div class="evo-sublabel">Reusar una reciente:</div>
      <div class="evo-recientes">${recientesHtml}</div>
    </div>
    <div class="evo-campos">
      <input id="evo-modulo" class="evo-input" placeholder="Módulo (ej: CORE, Cir. Funcional, Pilates Mat)" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" name="evo-modulo-field" data-lpignore="true" data-form-type="other">
      <textarea id="evo-contenido" class="evo-input" rows="2" placeholder="Contenido breve (ej: sentadilla, estocada, tracciones con banda...)" autocomplete="off" spellcheck="false" data-lpignore="true" data-form-type="other"></textarea>
      <div class="evo-fila">
        <div class="evo-grupo">
          <div class="evo-sublabel">Cómo se sintió</div>
          <div class="evo-caritas">
            ${CARITAS.map(c => `<button class="evo-carita" data-evo-carita="${c}" onclick="evoSetCarita('${c}')">${c}</button>`).join('')}
          </div>
        </div>
        <div class="evo-grupo">
          <div class="evo-sublabel">Dolor / molestia</div>
          <div class="evo-dolor">
            <button id="evo-dolor-no" class="evo-dolor-btn sel" onclick="evoSetDolor(false)">No</button>
            <button id="evo-dolor-si" class="evo-dolor-btn" onclick="evoSetDolor(true)">Sí</button>
          </div>
        </div>
      </div>
      <textarea id="evo-obs" class="evo-input" rows="2" placeholder="Observación (opcional)" autocomplete="off" spellcheck="false" data-lpignore="true" data-form-type="other"></textarea>
    </div>
    <div class="evo-acciones">
      <button id="evo-seltodos-btn" class="evo-btn-sec" onclick="evoSelTodos()">Seleccionar todos</button>
      <button id="evo-aplicar-btn" class="evo-btn-pri" onclick="evoAplicarLote()" disabled>Elegí alumnos para aplicar</button>
    </div>
    <div class="evo-ayuda">Tildá ☐ a la izquierda de cada alumno para elegir a quiénes aplicar esta anotación. El botón 📝 de cada alumno la abre solo para esa persona.</div>
  `;
  // Restaurar selección visual de caritas/dolor
  document.querySelectorAll('[data-evo-carita]').forEach(el => {
    el.classList.toggle('sel', el.getAttribute('data-evo-carita') === evoCaritaSel);
  });
  document.getElementById('evo-dolor-si')?.classList.toggle('sel', evoDolorSel);
  document.getElementById('evo-dolor-no')?.classList.toggle('sel', !evoDolorSel);
  pintarSeleccionEvo();
}
async function abrirModal(dia, hora, servicio) {
  const t = HORARIOS.find(x=>x.dia===dia&&x.hora===hora&&x.servicio===servicio);
  if (!t) return;
  evoTurnoActual = t;
  evoSeleccion = new Set();
  evoCaritaSel = ''; evoDolorSel = false;
  document.getElementById('modal-overlay').classList.add('activo');
  // Render inicial (rápido) y después traemos lo guardado
  renderModalBody(dia, hora, servicio);
  document.getElementById('modal-body').insertAdjacentHTML('afterbegin',
    '<div id="evo-cargando" style="font-size:12px;color:var(--celeste);padding:4px 0">⟳ Cargando asistencia y evoluciones...</div>');
  await Promise.all([
    cargarAsistenciaTurno(t),
    cargarEvolucionesTurno(t),
    cargarEvolucionesRecientes(t.servicio)
  ]);
  renderModalBody(dia, hora, servicio);
}
function cerrarModal(e) { if (e.target===document.getElementById('modal-overlay')) cerrarModalBtn(); }
function cerrarModalBtn() { document.getElementById('modal-overlay').classList.remove('activo'); }
function filtrar(tipo, btn) {
  filtroActivo = tipo;
  document.querySelectorAll('.filtro-btn').forEach(b=>b.classList.remove('activo'));
  btn.classList.add('activo');
  renderTurnos();
}
// Justificación de ausencias
let justifDia = '', justifHora = '', justifServicio = '', justifId = '', justifNombreAlumno = '';
let justifSeleccion = '';
function abrirJustif(dia, hora, servicio, id, nombre) {
  justifDia = dia; justifHora = hora; justifServicio = servicio;
  justifId = id; justifNombreAlumno = nombre;
  justifSeleccion = '';
  document.getElementById('justif-nombre').textContent = nombre;
  document.getElementById('justif-si').className = 'justif-opcion';
  document.getElementById('justif-no').className = 'justif-opcion';
  document.getElementById('justif-motivo').value = '';
  document.getElementById('justif-motivo').className = 'justif-motivo';
  document.getElementById('justif-overlay').classList.add('activo');
}
function seleccionarJustif(opcion) {
  justifSeleccion = opcion;
  document.getElementById('justif-si').className = 'justif-opcion' + (opcion==='si'?' seleccionado-si':'');
  document.getElementById('justif-no').className = 'justif-opcion' + (opcion==='no'?' seleccionado-no':'');
  document.getElementById('justif-motivo').className = 'justif-motivo visible';
}
function cancelarJustif() {
  document.getElementById('justif-overlay').classList.remove('activo');
}
function confirmarJustif() {
  if (!justifSeleccion) {
    document.getElementById('justif-si').style.borderColor = 'var(--rojo)';
    return;
  }
  const t = HORARIOS.find(x=>x.dia===justifDia&&x.hora===justifHora&&x.servicio===justifServicio);
  const motivo = document.getElementById('justif-motivo').value.trim();
  const estado = justifSeleccion === 'si' ? 'ausente-justificada' : 'ausente';
  document.getElementById('justif-overlay').classList.remove('activo');
  if (t) {
    guardarAsistencia(t, justifId, estado, motivo).then(() => {
      renderModalBody(justifDia, justifHora, justifServicio);
      renderTurnos();
    });
  }
}
// =============================================
// AUTENTICACIÓN
// =============================================
let sesionActiva = false;
async function verificarSesion() {
  try {
    const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${obtenerToken()}`
      }
    });
    if (res.ok) {
      sesionActiva = true;
      document.getElementById('login-overlay').classList.add('oculto');
      cargarUsuarioActual();
      cargarDatos();
    } else {
      document.getElementById('login-overlay').classList.remove('oculto');
    }
  } catch(e) {
    document.getElementById('login-overlay').classList.remove('oculto');
  }
}
function obtenerToken() {
  return sessionStorage.getItem('pb_token') || '';
}
function guardarToken(token) {
  sessionStorage.setItem('pb_token', token);
}
async function hacerLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-pass').value;
  const btn = document.getElementById('login-btn');
  const error = document.getElementById('login-error');
  if (!email || !pass) return;
  btn.disabled = true;
  btn.textContent = 'Ingresando...';
  error.classList.remove('visible');
  try {
    const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ email, password: pass })
    });
    const data = await res.json();
    if (res.ok && data.access_token) {
      guardarToken(data.access_token);
      sesionActiva = true;
      document.getElementById('login-overlay').classList.add('oculto');
      cargarUsuarioActual();
      cargarDatos();
    } else {
      error.classList.add('visible');
    }
  } catch(e) {
    error.classList.add('visible');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Ingresar';
  }
}
function init() {
  const hoy = new Date().getDay();
  const diasMap = {1:'Lunes',2:'Martes',3:'Miércoles',4:'Jueves',5:'Viernes'};
  diaActivo = diasMap[hoy] || 'Lunes';
  actualizarSemanaLabel();
  renderDiasTabs();
  verificarSesion();
}
init();
</script>
