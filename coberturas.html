<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coberturas y faltas · PuntoBiO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#111;--card:#1c1c1c;--card2:#222;--line:#2c2c2c;
    --blue:#1e9fe0;--blue-dim:rgba(30,159,224,.14);
    --txt:#f4f6f8;--muted:#9aa3ab;--muted2:#6c757d;
    --warn:#ffb24d;--warn-dim:rgba(255,178,77,.13);
    --ok:#3ecf8e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Manrope',system-ui,sans-serif;
    background:
      radial-gradient(900px 500px at 100% -10%, rgba(30,159,224,.10), transparent 60%),
      radial-gradient(700px 400px at -10% 110%, rgba(30,159,224,.06), transparent 55%),
      var(--bg);
    color:var(--txt);min-height:100vh;-webkit-font-smoothing:antialiased;padding:28px 18px 60px;
  }
  .wrap{max-width:760px;margin:0 auto}

  .head{display:flex;align-items:flex-start;gap:14px;margin-bottom:6px}
  .head .ico{width:46px;height:46px;border-radius:13px;flex:0 0 auto;
    background:linear-gradient(145deg,var(--blue),#1577a8);display:grid;place-items:center;font-size:24px;
    box-shadow:0 8px 22px rgba(30,159,224,.28)}
  h1{font-size:26px;font-weight:800;letter-spacing:-.4px;line-height:1.1}
  .sub{color:var(--muted);font-size:14px;margin-top:4px;font-weight:500;max-width:560px}
  .divider{height:1px;background:var(--line);margin:22px 0}

  .next-label{font-size:11.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;
    color:var(--blue);margin-bottom:10px;display:flex;align-items:center;gap:7px}
  .next-label::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px var(--blue-dim)}
  .next-card{background:linear-gradient(135deg,rgba(30,159,224,.16),rgba(30,159,224,.04));
    border:1px solid rgba(30,159,224,.35);border-radius:18px;padding:22px 24px;display:flex;align-items:center;gap:20px;overflow:hidden}
  .next-card .big-date{display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(0,0,0,.25);border-radius:14px;padding:12px 18px;min-width:92px;flex:0 0 auto}
  .next-card .big-date .d{font-size:40px;font-weight:800;line-height:1;color:#fff}
  .next-card .big-date .m{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--blue);margin-top:4px}
  .next-card .info .dow{font-size:13px;color:var(--muted);font-weight:600;text-transform:capitalize}
  .next-card .info .mot{font-size:21px;font-weight:700;margin:3px 0 8px;letter-spacing:-.3px}
  .next-card .info .when{font-size:13.5px;color:var(--warn);font-weight:600}
  .closed-pill{display:inline-flex;align-items:center;gap:6px;background:var(--warn-dim);color:var(--warn);
    border:1px solid rgba(255,178,77,.3);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;
    letter-spacing:.3px;text-transform:uppercase;margin-top:10px}

  .section-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;margin:30px 0 12px}
  .list{display:flex;flex-direction:column;gap:9px}
  .row{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:14px 18px;transition:border-color .15s,transform .15s}
  .row:hover{border-color:#3a3a3a;transform:translateX(2px)}
  .row .date-box{display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-width:58px;flex:0 0 auto;border-right:1px solid var(--line);padding-right:16px}
  .row .date-box .d{font-size:24px;font-weight:800;line-height:1}
  .row .date-box .m{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--blue);margin-top:2px}
  .row .meta{flex:1;min-width:0}
  .row .meta .mot{font-size:16px;font-weight:700;letter-spacing:-.2px}
  .row .meta .dow{font-size:13px;color:var(--muted);font-weight:500;text-transform:capitalize;margin-top:2px}
  .row .tag{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;background:var(--warn-dim);
    color:var(--warn);border:1px solid rgba(255,178,77,.25);border-radius:999px;padding:4px 11px;flex:0 0 auto}
  .row.past{opacity:.45;filter:saturate(.4)}
  .row.past .date-box .m,.row.past .tag{color:var(--muted2);background:transparent;border-color:var(--line)}
  .row.past .tag{background:#1a1a1a}

  .year-head{display:flex;align-items:center;gap:12px;margin:30px 0 12px}
  .year-head .yr{font-size:18px;font-weight:800}
  .year-head .ln{flex:1;height:1px;background:var(--line)}

  .cov-wrap{margin-top:6px}
  .cov-banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
  .cov-banner h2{font-size:20px;font-weight:800;letter-spacing:-.3px}
  .cov-lock{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.4px;
    text-transform:uppercase;background:var(--blue-dim);color:var(--blue);border:1px solid rgba(30,159,224,.3);
    border-radius:999px;padding:4px 11px}
  .cov-intro{color:var(--muted);font-size:13.5px;font-weight:500;margin:2px 0 18px;max-width:600px}
  .cov-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
  .cov-top{display:flex;align-items:center;gap:14px;margin-bottom:12px}
  .cov-top .db{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:52px;
    background:#161616;border:1px solid var(--line);border-radius:11px;padding:7px 0;flex:0 0 auto}
  .cov-top .db .d{font-size:21px;font-weight:800;line-height:1}
  .cov-top .db .m{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--blue);margin-top:2px}
  .cov-top .mot{font-size:15.5px;font-weight:700;flex:1;min-width:0}
  .cov-top .mot small{display:block;font-size:12px;font-weight:500;color:var(--muted);text-transform:capitalize;margin-top:2px}
  .cov-status{font-size:12px;font-weight:700;color:var(--ok);opacity:0;transition:opacity .25s;flex:0 0 auto}
  .cov-status.show{opacity:1}
  .cov-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .cov-fields .full{grid-column:1 / -1}
  .cov-fields label{display:block;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
  .cov-fields select,.cov-fields input{width:100%;background:#161616;border:1px solid var(--line);color:var(--txt);
    border-radius:10px;padding:10px 12px;font-family:inherit;font-size:14px;font-weight:600;outline:none}
  .cov-fields select:focus,.cov-fields input:focus{border-color:var(--blue)}
  .cov-fields input{font-weight:500}
  .cov-edited{font-size:11.5px;color:var(--muted2);margin-top:10px;font-weight:500}

  .state{text-align:center;padding:60px 20px;color:var(--muted)}
  .state .emo{font-size:42px;margin-bottom:14px;opacity:.7}
  .state.error{color:var(--warn)}
  .spinner{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .foot{margin-top:34px;text-align:center;color:var(--muted2);font-size:12px;font-weight:500;line-height:1.6}
  .foot b{color:var(--muted)}

  @media(max-width:520px){
    body{padding:20px 12px 50px}h1{font-size:22px}
    .next-card{flex-direction:column;align-items:flex-start;gap:14px}
    .next-card .big-date{flex-direction:row;gap:8px;min-width:0;padding:8px 14px}
    .next-card .big-date .d{font-size:30px}.next-card .big-date .m{margin-top:0}
    .cov-fields{grid-template-columns:1fr}
  }

  /* === Coberturas y faltas (sección nueva) === */
  .cf-sub{font-size:13.5px;font-weight:800;color:var(--txt);margin:22px 0 12px;letter-spacing:-.2px}
  .cf-form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;
    display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .cf-form label{display:block;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
  .cf-form input,.cf-form select{width:100%;background:#161616;border:1px solid var(--line);color:var(--txt);
    border-radius:10px;padding:10px 12px;font-family:inherit;font-size:14px;font-weight:600;outline:none}
  .cf-form input:focus,.cf-form select:focus{border-color:var(--blue)}
  .cf-form .full{grid-column:1 / -1}
  .btn{width:100%;background:var(--blue);color:#fff;border:none;border-radius:10px;padding:12px;
    font-family:inherit;font-size:14px;font-weight:800;cursor:pointer;letter-spacing:.2px}
  .btn:hover{filter:brightness(1.08)}.btn:disabled{opacity:.6;cursor:default}
  .cf-list{display:flex;flex-direction:column;gap:9px;margin-top:4px}
  .cf-item{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 15px}
  .cf-item.done{opacity:.5}
  .cf-db{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:48px;
    background:#161616;border:1px solid var(--line);border-radius:10px;padding:6px 0;flex:0 0 auto}
  .cf-db .d{font-size:19px;font-weight:800;line-height:1}
  .cf-db .m{font-size:10px;font-weight:700;text-transform:uppercase;color:var(--blue);margin-top:2px}
  .cf-main{flex:1;min-width:0}
  .cf-line{font-size:14px;font-weight:600;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .cf-nota{font-size:12.5px;color:var(--muted);margin-top:4px}
  .badge{font-size:10.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;border-radius:999px;padding:3px 9px;border:1px solid transparent;white-space:nowrap}
  .badge-cubre{background:var(--blue-dim);color:var(--blue);border-color:rgba(30,159,224,.3)}
  .badge-cambio{background:var(--warn-dim);color:var(--warn);border-color:rgba(255,178,77,.3)}
  .badge-horas{background:#161616;color:var(--muted);border-color:var(--line)}
  .badge-extra{background:rgba(255,178,77,.16);color:var(--warn);border-color:rgba(255,178,77,.35)}
  .cf-calc{margin-top:8px;padding:8px 11px;background:#0d1922;border:1px solid rgba(30,159,224,.25);border-radius:10px;font-size:12.5px}
  .cf-calc-row{display:flex;justify-content:space-between;gap:12px;color:var(--muted);padding:2px 0}
  .cf-calc-row b{color:var(--txt)}
  .cf-calc-row.total{margin-top:4px;padding-top:6px;border-top:1px solid var(--line);color:var(--txt);font-weight:700}
  .cf-calc-row.total b{color:var(--blue)}
  .cf-calc-warn{color:var(--muted);background:#161616;border-color:var(--line)}
  .cf-calc-row.falta,.cf-calc-row.falta b{color:#f87171}
  .cf-tarifas{margin-bottom:14px;padding:12px 14px;background:#0d1922;border:1px solid rgba(30,159,224,.22);border-radius:12px}
  .cf-tarifas-t{font-weight:700;font-size:13px;color:var(--txt);margin-bottom:9px}
  .cf-tarifas-grid{display:flex;flex-wrap:wrap;gap:12px}
  .cf-tarifas-grid label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--muted);font-weight:600}
  .cf-tarifas-grid input{width:108px;padding:6px 8px;background:#111;border:1px solid var(--line);border-radius:7px;color:var(--txt);font-size:13px}
  .cf-tarifas-grid input:disabled{opacity:.55;cursor:not-allowed}
  .cf-tarifas-hint{margin-top:8px;font-size:11px;color:var(--muted)}
  .badge-done{background:rgba(62,207,142,.12);color:var(--ok);border-color:rgba(62,207,142,.3)}
  .cf-actions{display:flex;align-items:center;gap:7px;flex:0 0 auto}
  .btn-mini{background:#161616;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:6px 10px;
    font-family:inherit;font-size:12px;font-weight:700;cursor:pointer}
  .btn-mini:hover{border-color:var(--blue);color:var(--blue)}
  .btn-del{background:transparent;border:1px solid var(--line);color:var(--muted2);border-radius:8px;
    width:30px;height:30px;cursor:pointer;font-size:13px;font-weight:700;flex:0 0 auto}
  .btn-del:hover{border-color:var(--warn);color:var(--warn)}
  .cf-empty{text-align:center;color:var(--muted2);font-size:13px;padding:18px;border:1px dashed var(--line);border-radius:12px}
  .debt-grid{display:flex;flex-direction:column;gap:8px}
  .debt-card{background:var(--warn-dim);border:1px solid rgba(255,178,77,.25);border-radius:12px;padding:11px 15px;font-size:14px;font-weight:600}
  .debt-h{color:var(--warn);font-weight:800}
  @media(max-width:520px){.cf-form{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <div class="ico">🔄</div>
    <div>
      <h1>Coberturas y faltas</h1>
      <div class="sub">Organicen entre ustedes quién falta, quién cubre y los cambios de horas. Se guarda solo apenas lo cargás.</div>
    </div>
  </div>

  <div id="cobertura">
    <div class="state"><div class="spinner"></div>Cargando…</div>
  </div>

  <div class="foot">
    Coberturas y faltas · <b>PuntoBiO</b> · Córdoba
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL='https://bqpjtoiictnzcasxfucf.supabase.co';
  const SUPABASE_KEY='sb_publishable_yvuXDxrkRrhXwmZBnE_a_Q_zDBz0iDi';
  const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

  const PROFES=['Santiago','Lean','Lautaro','Male','Jime','Lu'];
  const opts=v=>['<option value="">— Sin asignar —</option>']
    .concat(PROFES.map(p=>`<option ${v===p?'selected':''}>${p}</option>`)).join('');
  const profeOpts=v=>['<option value="">— Elegí —</option>']
    .concat(PROFES.map(p=>`<option ${v===p?'selected':''}>${p}</option>`)).join('');

  const MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const MESES_LARGO=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

  function parseFecha(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
  function hoy0(){const t=new Date();t.setHours(0,0,0,0);return t;}
  function diasHasta(f){return Math.round((f-hoy0())/86400000);}
  function textoCuando(n){
    if(n===0)return'Es HOY · cerrado';if(n===1)return'Es mañana';if(n<7)return`En ${n} días`;
    if(n<14)return'La próxima semana';if(n<31)return`En ${Math.round(n/7)} semanas`;return`En ${Math.round(n/30)} mes(es)`;}
  function oportunidad(f){
    const wd=parseFecha(f).getDay();
    if(wd===1||wd===5)return'finde largo';
    if(wd===2)return'puente (pedí el lunes)';if(wd===4)return'puente (pedí el viernes)';return null;}

  function rowHTML(f,esPasado){
    const fch=parseFecha(f.fecha);
    return `<div class="row ${esPasado?'past':''}">
      <div class="date-box"><div class="d">${fch.getDate()}</div><div class="m">${MESES[fch.getMonth()]}</div></div>
      <div class="meta"><div class="mot">${f.motivo||'Feriado'}</div><div class="dow">${DIAS[fch.getDay()]}</div></div>
      <div class="tag">${esPasado?'Pasado':'🔒 Cerrado'}</div></div>`;}

  let FERIADOS_FUTUROS=[];
  let AH_DATA=[];
  let COB_ADMIN=false, COB_VE_TODO=false, MI_PROFE=null, SUELDO_DE={}, SUELDO_LATEST={}, TARIFA_DE={};
  const ADMIN_EMAILS=['liclucianavelaz@gmail.com','jimenahllorente@gmail.com'];
  const PROFES_BONO=['Santiago','Lean','Lautaro','Male']; // ganan bono / cobran hora extra
  const TARIFA_DEFAULT={Santiago:7300,Lean:7300,Lautaro:7300,Male:16500};
  const sueldoKey=p=>p==='Santiago'?'Santi':p; // el sueldo se guarda con 'Santi'
  // Días enteros FUERA DEL SUELDO por profe (debe coincidir con HORAS_EXTRA_FIJAS de app.html).
  // En esos días, faltar NO descuenta la jornada (no era parte del sueldo) y se perdona 1 vez al mes.
  // El que los trabaja/cubre cobra hora extra + 2% (aunque no se tilde "horas extra"). { DIA: horas }
  const DIAS_FUERA_SUELDO={ 'Lean':{ 'VIERNES':4 } };
  let EXTRA_ORDINAL={};  // id de cobertura -> nº de viernes cubierto del mes para ese profe (1 = perdonado)
  function diaSemanaNorm(fecha){
    const p=(fecha||'').split('-').map(Number);
    if(!p[0])return '';
    return new Date(p[0],p[1]-1,p[2]).toLocaleDateString('es-AR',{weekday:'long'}).toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  }
  function esDiaFueraSueldo(nombreFalta,fecha){
    const pr=profeDelUsuario(nombreFalta); if(!pr)return false;
    const dias=DIAS_FUERA_SUELDO[pr]; if(!dias)return false;
    return dias[diaSemanaNorm(fecha)]!=null;
  }
  function horasFueraSueldo(nombreFalta,fecha){
    const pr=profeDelUsuario(nombreFalta); if(!pr)return 0;
    const dias=DIAS_FUERA_SUELDO[pr]; if(!dias)return 0;
    return dias[diaSemanaNorm(fecha)]||0;
  }
  function profeDelUsuario(nombre){
    const first=(nombre||'').toLowerCase().trim().split(/\s+/)[0];
    if(!first)return null;
    return PROFES.find(p=>{const lp=p.toLowerCase();
      return first.startsWith(lp)||lp.startsWith(first)||first.slice(0,4)===lp.slice(0,4);})||null;
  }
  const fmtPeso=n=>'$'+Math.round(n||0).toLocaleString('es-AR');
  function sueldoDeCobertura(cubre,fecha){
    const k=sueldoKey(cubre),m=SUELDO_DE[k];
    if(m&&m[(fecha||'').slice(0,7)]!=null)return m[fecha.slice(0,7)];
    return SUELDO_LATEST[k]?SUELDO_LATEST[k].monto:0;
  }
  function bonoCobInfo(r){
    const sueldo=sueldoDeCobertura(r.cubre,r.fecha);
    const fueraSueldo=esDiaFueraSueldo(r.falta,r.fecha);
    const conExtra=!!r.horas_extra||fueraSueldo;  // viernes de Lean = siempre hora extra + 2%
    const pct=conExtra?2:5, bono=sueldo*pct/100;
    const tarifa=TARIFA_DE[r.cubre]||0;
    const cant=fueraSueldo?(Number(r.horas_extra_cant)||horasFueraSueldo(r.falta,r.fecha)):Number(r.horas_extra_cant||0);
    const ot=conExtra?cant*tarifa:0;
    return {sueldo,pct,bono,tarifa,cant,ot,total:bono+ot,conExtra};
  }
  function breakdownHTML(r){
    let rows='';
    if(r.cubre&&PROFES_BONO.includes(r.cubre)){
      const i=bonoCobInfo(r);
      if(!i.sueldo){
        rows+='<div class="cf-calc-row"><span>Bono de '+r.cubre+'</span><b>Cargá su sueldo en Bonos</b></div>';
      }else{
        rows+='<div class="cf-calc-row"><span>Bono cobertura ('+i.pct+'% de '+fmtPeso(i.sueldo)+')</span><b>'+fmtPeso(i.bono)+'</b></div>';
        if(i.conExtra)rows+='<div class="cf-calc-row"><span>Horas extra ('+i.cant+' h \u00d7 '+fmtPeso(i.tarifa)+')</span><b>'+fmtPeso(i.ot)+'</b></div>';
        rows+='<div class="cf-calc-row total"><span>Total a pagarle de m\u00e1s a '+r.cubre+'</span><b>'+fmtPeso(i.total)+'</b></div>';
      }
    }
    if(r.falta){
      if(esDiaFueraSueldo(r.falta,r.fecha)){
        const ord=EXTRA_ORDINAL[r.id]||1;
        if(ord<=1){
          rows+='<div class="cf-calc-row" style="color:#b45309"><span>\u2b50 '+r.falta+': es su hora extra fija \u00b7 no se le descuenta'+(r.cubre?' (la hizo '+r.cubre+')':'')+'</span><b>1 viernes/mes no pierde el premio</b></div>';
        }else{
          rows+='<div class="cf-calc-row falta"><span>\u26a0\ufe0f '+r.falta+': '+ord+'\u00ba viernes cubierto del mes</span><b>este s\u00ed le baja el premio del mes</b></div>';
        }
      }else{
        rows+='<div class="cf-calc-row falta"><span>\u{1F912} '+r.falta+': se descuenta la jornada</span><b>fuera del premio del mes</b></div>';
      }
    }
    return rows?'<div class="cf-calc">'+rows+'</div>':'';
  }
  // Vista del propio profe: solo lo suyo, % y horas (el monto en $ va por RPC, en el motor)
  function breakdownProfe(r){
    if(MI_PROFE&&r.cubre===MI_PROFE&&PROFES_BONO.includes(MI_PROFE)){
      const pct=r.horas_extra?2:5;
      let t='Te corresponde: bono cobertura '+pct+'%';
      if(r.horas_extra&&r.horas_extra_cant)t+=' + '+r.horas_extra_cant+' h extra';
      return '<div class="cf-calc"><div class="cf-calc-row total"><span>'+t+'</span><b></b></div></div>';
    }
    if(MI_PROFE&&r.falta===MI_PROFE){
      if(esDiaFueraSueldo(r.falta,r.fecha))return '<div class="cf-calc"><div class="cf-calc-row total"><span>\u2b50 Era tu hora extra del viernes \u00b7 no se te descuenta. 1 al mes no afecta el premio.</span><b></b></div></div>';
      return '<div class="cf-calc cf-calc-warn">\u{1F912} Faltaste ese día.</div>';
    }
    return '';
  }

  async function cargarFeriados(){
    try{
      const{data}=await sb.from('feriados').select('fecha, motivo').order('fecha',{ascending:true});
      const hoy=hoy0();
      FERIADOS_FUTUROS=(data||[]).filter(f=>parseFecha(f.fecha)>=hoy);
    }catch(e){FERIADOS_FUTUROS=[];}
  }

  async function cargarCobertura(){
    const box=document.getElementById('cobertura');
    try{
      const{data:u}=await sb.auth.getUser();
      COB_EMAIL=u&&u.user?u.user.email:null;
      const{data:ok}=await sb.rpc('puede_ver_cobertura');
      COB_OK=ok===true;
    }catch(e){COB_OK=false;}
    if(!COB_OK){box.innerHTML='';return;}
    try{const{data}=await sb.from('feriados_cobertura').select('*');FC_MAPA={};(data||[]).forEach(r=>FC_MAPA[r.fecha]=r);}catch(e){FC_MAPA={};}
    try{const{data}=await sb.from('coberturas_faltas').select('*').order('creado_en',{ascending:false,nullsFirst:false}).order('fecha',{ascending:false});CF_DATA=data||[];}catch(e){CF_DATA=[];}
    try{const{data}=await sb.from('ausencias_horas').select('*').order('creado_en',{ascending:false,nullsFirst:false}).order('fecha',{ascending:false});AH_DATA=data||[];}catch(e){AH_DATA=[];}
    COB_ADMIN=false; COB_VE_TODO=false; MI_PROFE=null;
    try{
      const{data:{session}}=await sb.auth.getSession();
      if(session&&session.user){
        const{data:persona}=await sb.from('personas').select('id, nombre, es_equipo').eq('auth_user_id',session.user.id).maybeSingle();
        if(persona){
          MI_PROFE=profeDelUsuario(persona.nombre);
          if(persona.es_equipo){
            const{data:perm}=await sb.from('permisos_equipo').select('admin_total, operativo_general').eq('persona_id',persona.id).maybeSingle();
            COB_ADMIN=!!(perm&&perm.admin_total);
            COB_VE_TODO=!!(perm&&(perm.admin_total||perm.operativo_general));
          }
        }
      }
    }catch(e){}
    if(!COB_ADMIN&&COB_EMAIL&&ADMIN_EMAILS.includes(COB_EMAIL.toLowerCase())){COB_ADMIN=true;COB_VE_TODO=true;}
    // Lu/Jime/Pau/Ale ven TODO (contabilidad). Cada profe ve SOLO lo suyo.
    if(!COB_VE_TODO)CF_DATA=MI_PROFE?CF_DATA.filter(r=>r.falta===MI_PROFE||r.cubre===MI_PROFE):[];
    if(COB_VE_TODO){
      try{
        const{data:su}=await sb.from('sueldos_profes_tf').select('profe, mes, sueldo_bolsillo');
        SUELDO_DE={};SUELDO_LATEST={};
        (su||[]).forEach(x=>{const p=x.profe,mes=x.mes,monto=Number(x.sueldo_bolsillo)||0;
          (SUELDO_DE[p]=SUELDO_DE[p]||{})[mes]=monto;
          if(!SUELDO_LATEST[p]||mes>SUELDO_LATEST[p].mes)SUELDO_LATEST[p]={mes,monto};});
      }catch(e){SUELDO_DE={};SUELDO_LATEST={};}
      try{const{data:ta}=await sb.from('tarifas_hora_extra').select('profe, monto');
        TARIFA_DE={};(ta||[]).forEach(t=>{TARIFA_DE[t.profe]=Number(t.monto)||0;});
      }catch(e){TARIFA_DE={};}
      PROFES_BONO.forEach(p=>{if(TARIFA_DE[p]==null)TARIFA_DE[p]=TARIFA_DEFAULT[p]||0;});
    }
    renderCobertura();
  }

  function calcDeudas(){
    const net={};
    CF_DATA.forEach(r=>{
      if(r.tipo!=='cambio'||r.devuelto||!r.horas||!r.falta||!r.cubre)return;
      const key=r.falta+'|'+r.cubre;
      net[key]=(net[key]||0)+Number(r.horas);
    });
    const vistos=new Set(),out=[];
    Object.keys(net).forEach(k=>{
      if(vistos.has(k))return;
      const[a,b]=k.split('|');const opp=b+'|'+a;
      const ab=net[k]||0,ba=net[opp]||0;
      vistos.add(k);vistos.add(opp);
      const dif=Math.round((ab-ba)*10)/10;
      if(dif>0)out.push({deudor:a,acreedor:b,horas:dif});
      else if(dif<0)out.push({deudor:b,acreedor:a,horas:-dif});
    });
    return out;
  }

  function renderCobertura(){
    const box=document.getElementById('cobertura');
    let html=`<div class="cov-wrap">`;

    html+=`<div class="cf-sub">🔄 Faltas y cambios — cualquier día</div>
      ${COB_VE_TODO?`<div class="cf-tarifas">
        <div class="cf-tarifas-t">⏰ Tarifa de hora extra (por hora) — solo lectura</div>
        <div class="cf-tarifas-grid">${PROFES_BONO.map(p=>`<label>${p}<input type="number" data-tarifa="${p}" value="${TARIFA_DE[p]||0}" disabled></label>`).join('')}</div>
        <div class="cf-tarifas-hint">Estos montos se cargan en <b>Sistema · Sueldos y tarifas</b> (solo Lu y Jime). Acá se muestran nomás.</div>
      </div>`:''}
      <div class="cf-form">
        <div><label>Día</label><input type="date" id="cf-fecha"></div>
        <div><label>Tipo</label><select id="cf-tipo">
          <option value="cubre">Cobertura (no devuelve horas)</option>
          <option value="cambio">Cambio (devuelve horas)</option>
        </select></div>
        <div><label>Falta</label><select id="cf-falta">${profeOpts('')}</select></div>
        <div><label>Cubre</label><select id="cf-cubre">${profeOpts('')}</select></div>
        <div id="cf-horas-wrap" class="full" style="display:none"><label>Horas que va a devolver</label><input type="number" id="cf-horas" min="0" step="0.5" placeholder="Ej: 3"></div>
        <div id="cf-extra-wrap" class="full"><label style="display:flex;align-items:center;gap:9px;cursor:pointer;text-transform:none;letter-spacing:0;color:var(--txt);font-weight:600;font-size:13.5px"><input type="checkbox" id="cf-extra" style="width:17px;height:17px;cursor:pointer;flex:0 0 auto">⏰ Genera horas extra (cubre un día que no es suyo) → bono 2% en vez de 5%</label></div>
        <div id="cf-extra-cant-wrap" class="full" style="display:none"><label>¿Cuántas horas extra?</label><input type="number" id="cf-extra-cant" min="0" step="0.5" placeholder="Ej: 4"></div>
        <div class="full"><label>Nota (opcional)</label><input id="cf-nota" maxlength="120" placeholder="Ej: Lean falta el viernes, lo cubre Santi…"></div>
        <div class="full"><button class="btn" id="cf-add">➕ Agregar</button></div>
      </div>`;

    html+=`<div class="cf-sub" style="margin-top:26px">🗒️ Horas sueltas que no asistió — para descontar del sueldo</div>
      <div class="cf-form">
        <div><label>Profe</label><select id="ah-profe">${profeOpts('')}</select></div>
        <div><label>Día</label><input type="date" id="ah-fecha"></div>
        <div><label>Horas que no asistió</label><input type="number" id="ah-horas" min="0" step="0.5" placeholder="Ej: 1"></div>
        <div class="full"><label>Motivo</label><input id="ah-motivo" maxlength="160" placeholder="Ej: no fue a las 15h, se quedó encerrado"></div>
        <div class="full"><button class="btn" id="ah-add">➕ Agregar a la bitácora</button></div>
      </div>`;
    html+=`<div class="cf-sub" style="margin-top:26px">📜 Historial — ${COB_VE_TODO?'lo último arriba':'tus faltas, coberturas y horas · lo último arriba'}</div>`;
    {
      const ahVis = COB_VE_TODO ? AH_DATA : (MI_PROFE ? AH_DATA.filter(r=>r.profe===MI_PROFE) : []);
      // Contar viernes cubiertos por (profe, mes): el 1º se perdona, del 2º en adelante baja el premio.
      EXTRA_ORDINAL={};
      const grpV={};
      (CF_DATA||[]).forEach(r=>{
        if(r.tipo==='cambio')return;
        if(!esDiaFueraSueldo(r.falta,r.fecha))return;
        const k=(profeDelUsuario(r.falta)||r.falta)+'|'+(r.fecha||'').slice(0,7);
        (grpV[k]=grpV[k]||[]).push(r);
      });
      Object.keys(grpV).forEach(k=>{
        grpV[k].sort((a,b)=>((a.fecha||'').localeCompare(b.fecha||''))||((a.creado_en||'').localeCompare(b.creado_en||'')));
        grpV[k].forEach((r,i)=>{ EXTRA_ORDINAL[r.id]=i+1; });
      });
      const merged = [
        ...CF_DATA.map(r=>({kind:'cf', r:r, fecha:r.fecha, creado:r.creado_en||''})),
        ...(ahVis||[]).map(r=>({kind:'ah', r:r, fecha:r.fecha, creado:r.creado_en||''}))
      ];
      merged.sort((a,b)=> a.fecha!==b.fecha ? (b.fecha||'').localeCompare(a.fecha||'') : (b.creado||'').localeCompare(a.creado||''));
      if(merged.length){
        html+=`<div class="cf-list">`;
        merged.forEach(it=>{
          const r=it.r, fch=parseFecha(r.fecha);
          if(it.kind==='ah'){
            html+=`<div class="cf-item">
              <div class="cf-db"><div class="d">${fch.getDate()}</div><div class="m">${MESES[fch.getMonth()]}</div></div>
              <div class="cf-main"><div class="cf-line"><b>${r.profe||'?'}</b> · <span class="badge badge-extra">${r.horas||'?'} h no asistió</span></div>
                ${r.motivo?`<div class="cf-nota">📝 ${(r.motivo||'').replace(/</g,'&lt;')}</div>`:''}</div>
              <div class="cf-actions"><button class="btn-del" data-ahdel="${r.id}" title="Borrar">✕</button></div>
            </div>`;
          } else {
            const esCambio=r.tipo==='cambio';
            html+=`<div class="cf-item ${r.devuelto?'done':''}">
              <div class="cf-db"><div class="d">${fch.getDate()}</div><div class="m">${MESES[fch.getMonth()]}</div></div>
              <div class="cf-main">
                <div class="cf-line"><b>${r.falta||'?'}</b> falta${r.cubre?` · cubre <b>${r.cubre}</b>`:' · sin cubrir'}
                  <span class="badge ${esCambio?'badge-cambio':'badge-cubre'}">${esCambio?'Cambio':'Cobertura'}</span>
                  ${esCambio&&r.horas?`<span class="badge badge-horas">${r.horas} h</span>`:''}
                  ${(!esCambio&&(r.horas_extra||esDiaFueraSueldo(r.falta,r.fecha)))?`<span class="badge badge-extra">⏰ Hora extra${esDiaFueraSueldo(r.falta,r.fecha)?' (viernes)':''} · 2%</span>`:''}
                  ${r.devuelto?`<span class="badge badge-done">Saldado ✓</span>`:''}
                </div>
                ${r.nota?`<div class="cf-nota">${(r.nota||'').replace(/</g,'&lt;')}</div>`:''}
                ${(!esCambio)?(COB_VE_TODO?((r.falta||(r.cubre&&PROFES_BONO.includes(r.cubre)))?breakdownHTML(r):''):breakdownProfe(r)):''}
              </div>
              <div class="cf-actions">
                ${esCambio&&!r.devuelto?`<button class="btn-mini" data-saldar="${r.id}">Saldar</button>`:''}
                ${esCambio&&r.devuelto?`<button class="btn-mini" data-reabrir="${r.id}">Reabrir</button>`:''}
                <button class="btn-del" data-del="${r.id}" title="Borrar">✕</button>
              </div>
            </div>`;
          }
        });
        html+=`</div>`;
      } else {
        html+=`<div class="cf-empty">Todavía no hay faltas, coberturas ni horas cargadas.</div>`;
      }
    }

    const deudas=calcDeudas();
    if(deudas.length){
      html+=`<div class="cf-sub" style="margin-top:30px">⏳ Horas que se deben (cambios sin saldar)</div><div class="debt-grid">`;
      deudas.forEach(d=>{html+=`<div class="debt-card"><b>${d.deudor}</b> le debe <span class="debt-h">${d.horas} h</span> a <b>${d.acreedor}</b></div>`;});
      html+=`</div>`;
    }

    html+=`</div>`;
    box.innerHTML=html;
    wireCobertura();
  }

  function wireCobertura(){
    const box=document.getElementById('cobertura');
    box.querySelectorAll('.cov-card').forEach(card=>{
      const fecha=card.dataset.fecha;
      const toma=card.querySelector('.f-toma'),cubre=card.querySelector('.f-cubre'),
            nota=card.querySelector('.f-nota'),status=card.querySelector('.cov-status'),
            edited=card.querySelector('.cov-edited');
      async function guardar(){
        try{
          const{error}=await sb.from('feriados_cobertura').upsert({
            fecha,se_lo_toma:toma.value||null,cubre:cubre.value||null,
            nota:nota.value.trim()||null,actualizado_por:COB_EMAIL||'equipo',actualizado_en:new Date().toISOString()
          },{onConflict:'fecha'});
          if(error)throw error;
          status.textContent='Guardado ✓';status.style.color='var(--ok)';status.classList.add('show');
          edited.textContent='Última edición: '+(COB_EMAIL||'equipo');
          setTimeout(()=>status.classList.remove('show'),1600);
        }catch(e){status.textContent='Error al guardar';status.style.color='var(--warn)';status.classList.add('show');console.error(e);}
      }
      toma.addEventListener('change',guardar);
      cubre.addEventListener('change',guardar);
      let t;nota.addEventListener('input',()=>{clearTimeout(t);t=setTimeout(guardar,800);});
    });

    const tipo=document.getElementById('cf-tipo'),horasWrap=document.getElementById('cf-horas-wrap'),extraWrap=document.getElementById('cf-extra-wrap');
    const extraChk=document.getElementById('cf-extra'),extraCantWrap=document.getElementById('cf-extra-cant-wrap');
    function syncExtraCant(){const on=extraChk&&extraChk.checked&&tipo.value!=='cambio';if(extraCantWrap)extraCantWrap.style.display=on?'':'none';}
    if(tipo)tipo.addEventListener('change',()=>{
      const esCambio=tipo.value==='cambio';
      horasWrap.style.display=esCambio?'':'none';
      if(extraWrap)extraWrap.style.display=esCambio?'none':'';
      syncExtraCant();
    });
    if(extraChk)extraChk.addEventListener('change',syncExtraCant);
    if(COB_ADMIN)document.querySelectorAll('[data-tarifa]').forEach(inp=>inp.addEventListener('change',async()=>{
      const p=inp.dataset.tarifa,monto=Number(inp.value||0);
      TARIFA_DE[p]=monto;
      try{await sb.from('tarifas_hora_extra').upsert({profe:p,monto,actualizado_en:new Date().toISOString()},{onConflict:'profe'});
        renderCobertura();
      }catch(e){alert('No se pudo guardar la tarifa: '+(e.message||e));}
    }));

    const addBtn=document.getElementById('cf-add');
    if(addBtn)addBtn.addEventListener('click',async()=>{
      const fecha=document.getElementById('cf-fecha').value;
      const falta=document.getElementById('cf-falta').value;
      const cubre=document.getElementById('cf-cubre').value;
      const tp=document.getElementById('cf-tipo').value;
      const horas=document.getElementById('cf-horas').value;
      const extraEl=document.getElementById('cf-extra');
      const horasExtra=(tp==='cubre'&&extraEl&&extraEl.checked);
      const extraCantEl=document.getElementById('cf-extra-cant');
      const horasExtraCant=horasExtra&&extraCantEl&&extraCantEl.value?Number(extraCantEl.value):null;
      const nota=document.getElementById('cf-nota').value.trim();
      if(!fecha||!falta){alert('Poné al menos el día y quién falta.');return;}
      if(cubre&&falta===cubre){alert('El que falta y el que cubre no pueden ser el mismo.');return;}
      addBtn.disabled=true;addBtn.textContent='Guardando…';
      try{
        const{error}=await sb.from('coberturas_faltas').insert({
          fecha,falta,cubre:cubre||null,tipo:tp,
          horas:(tp==='cambio'&&horas)?Number(horas):null,
          horas_extra:horasExtra,
          horas_extra_cant:horasExtraCant,
          nota:nota||null,creado_por:COB_EMAIL||'equipo',creado_en:new Date().toISOString()
        });
        if(error)throw error;
        await cargarCobertura();
      }catch(e){alert('No se pudo guardar: '+(e.message||e));addBtn.disabled=false;addBtn.textContent='➕ Agregar';}
    });

    const ahBtn=document.getElementById('ah-add');
    if(ahBtn)ahBtn.addEventListener('click',async()=>{
      const profe=document.getElementById('ah-profe').value;
      const fecha=document.getElementById('ah-fecha').value;
      const horas=document.getElementById('ah-horas').value;
      const motivo=document.getElementById('ah-motivo').value.trim();
      if(!profe||!fecha||!horas){alert('Poné el profe, el día y cuántas horas no asistió.');return;}
      ahBtn.disabled=true;ahBtn.textContent='Guardando…';
      try{
        const{error}=await sb.from('ausencias_horas').insert({profe,fecha,horas:Number(horas),motivo:motivo||null,creado_por:COB_EMAIL||'equipo',creado_en:new Date().toISOString()});
        if(error)throw error;
        await cargarCobertura();
      }catch(e){alert('No se pudo guardar: '+(e.message||e));ahBtn.disabled=false;ahBtn.textContent='➕ Agregar a la bitácora';}
    });
    box.querySelectorAll('[data-ahdel]').forEach(b=>b.addEventListener('click',async()=>{
      if(!confirm('¿Borrar esta hora de la bitácora?'))return;
      try{await sb.from('ausencias_horas').delete().eq('id',b.dataset.ahdel);await cargarCobertura();}catch(e){alert('No se pudo borrar.');}
    }));

    box.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',async()=>{
      if(!confirm('¿Borrar este registro?'))return;
      try{await sb.from('coberturas_faltas').delete().eq('id',b.dataset.del);await cargarCobertura();}catch(e){alert('No se pudo borrar.');}
    }));
    box.querySelectorAll('[data-saldar]').forEach(b=>b.addEventListener('click',async()=>{
      try{await sb.from('coberturas_faltas').update({devuelto:true}).eq('id',b.dataset.saldar);await cargarCobertura();}catch(e){alert('No se pudo.');}
    }));
    box.querySelectorAll('[data-reabrir]').forEach(b=>b.addEventListener('click',async()=>{
      try{await sb.from('coberturas_faltas').update({devuelto:false}).eq('id',b.dataset.reabrir);await cargarCobertura();}catch(e){alert('No se pudo.');}
    }));
  }

  (async()=>{await cargarFeriados();await cargarCobertura();})();
</script>
