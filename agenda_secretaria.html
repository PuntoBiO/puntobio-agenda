<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda Secretaría · PuntoBiO</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#f5f7fb; --card:#ffffff; --ink:#1e293b; --muted:#64748b;
    --line:#e2e8f0; --azul:#2f7ff6; --verde:#16a34a; --ambar:#d97706;
    --rojo:#dc2626; --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:var(--bg);color:var(--ink);min-height:100vh;padding:24px}
  .wrap{max-width:980px;margin:0 auto}

  .eyebrow{font-size:12px;font-weight:700;letter-spacing:3px;color:var(--muted);
           text-transform:uppercase;margin-bottom:6px}
  h1{font-size:30px;font-weight:800;margin-bottom:4px}
  h1 .azul{color:var(--azul)}
  .sub{color:var(--muted);font-size:14px;margin-bottom:20px}

  .topbar{display:flex;justify-content:space-between;align-items:flex-end;
          flex-wrap:wrap;gap:12px;margin-bottom:20px}
  .btn{border:none;border-radius:12px;padding:11px 18px;font-size:14px;font-weight:700;
       cursor:pointer;transition:filter .15s}
  .btn:hover{filter:brightness(.95)}
  .btn-azul{background:var(--azul);color:#fff}
  .btn-ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn-sm{padding:6px 12px;font-size:12.5px;border-radius:9px}

  /* contadores */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
         gap:12px;margin-bottom:22px}
  .stat{background:var(--card);border-radius:var(--radius);padding:14px 16px;
        border-left:4px solid var(--line);box-shadow:0 1px 3px rgba(15,23,42,.06)}
  .stat .n{font-size:26px;font-weight:800}
  .stat .l{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--muted);
           text-transform:uppercase}
  .stat.st-pend{border-color:var(--azul)}   .stat.st-pend .n{color:var(--azul)}
  .stat.st-curso{border-color:var(--ambar)} .stat.st-curso .n{color:var(--ambar)}
  .stat.st-res{border-color:var(--verde)}   .stat.st-res .n{color:var(--verde)}

  /* tabs y filtros */
  .tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .tab{padding:9px 18px;border-radius:999px;font-size:14px;font-weight:700;
       cursor:pointer;background:#fff;border:1px solid var(--line);color:var(--muted)}
  .tab.on{background:var(--azul);border-color:var(--azul);color:#fff}
  .tab .pill{display:inline-block;min-width:20px;text-align:center;margin-left:6px;
             background:var(--rojo);color:#fff;border-radius:999px;font-size:11px;
             padding:1px 6px;vertical-align:1px}
  .tab.on .pill{background:rgba(255,255,255,.28)}
  .filtros{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
  .chip{padding:5px 13px;border-radius:999px;font-size:12.5px;font-weight:600;
        cursor:pointer;background:#fff;border:1px solid var(--line);color:var(--muted)}
  .chip.on{background:#eaf2ff;border-color:var(--azul);color:var(--azul)}

  /* tarjetas de tarea */
  .lista{display:flex;flex-direction:column;gap:10px}
  .tarea{background:var(--card);border-radius:var(--radius);padding:14px 16px;
         border-left:4px solid var(--azul);box-shadow:0 1px 3px rgba(15,23,42,.06);
         display:flex;gap:12px;align-items:flex-start}
  .tarea.e-en_curso{border-left-color:var(--ambar)}
  .tarea.e-resuelto{border-left-color:var(--verde);opacity:.85}
  .tarea.e-no_resuelto{border-left-color:var(--rojo);opacity:.9}
  .check{width:26px;height:26px;min-width:26px;border-radius:50%;
         border:2px solid var(--line);cursor:pointer;display:flex;
         align-items:center;justify-content:center;font-size:15px;margin-top:2px;
         background:#fff;transition:all .15s}
  .check:hover{border-color:var(--verde)}
  .check.ok{background:var(--verde);border-color:var(--verde);color:#fff}
  .check.no{background:var(--rojo);border-color:var(--rojo);color:#fff}
  .t-body{flex:1;min-width:0}
  .t-tit{font-size:15.5px;font-weight:700}
  .t-tit.tachado{text-decoration:line-through;color:var(--muted)}
  .t-det{font-size:13.5px;color:var(--muted);margin-top:3px;white-space:pre-wrap}
  .t-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
  .tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px}
  .tag-pers{background:#eaf2ff;color:var(--azul)}
  .tag-comun{background:#f1f5f9;color:var(--muted)}
  .tag-alta{background:#fee2e2;color:var(--rojo)}
  .tag-baja{background:#f1f5f9;color:var(--muted)}
  .tag-fecha{background:#fef3c7;color:#92400e}
  .tag-fecha.vencida{background:#fee2e2;color:var(--rojo)}
  .tag-aviso{background:#fff7ed;color:#c2410c}
  .t-quien{font-size:12px;color:var(--muted)}
  .t-acciones{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .link{background:none;border:none;color:var(--azul);font-size:12.5px;
        font-weight:700;cursor:pointer;padding:0}
  .link.gris{color:var(--muted)}

  /* comentarios */
  .coments{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;
           display:none}
  .coments.open{display:block}
  .com{font-size:13px;margin-bottom:8px;background:#f8fafc;border-radius:10px;
       padding:8px 11px}
  .com b{color:var(--azul)}
  .com .cf{color:var(--muted);font-size:11px;margin-left:6px}
  .com-form{display:flex;gap:6px;margin-top:6px}
  .com-form input{flex:1;border:1px solid var(--line);border-radius:10px;
                  padding:8px 11px;font-size:13px;font-family:inherit}

  .vacio{text-align:center;color:var(--muted);padding:50px 20px;font-size:14.5px}
  .vacio .emo{font-size:44px;display:block;margin-bottom:10px}

  /* modales */
  .overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;
           align-items:center;justify-content:center;z-index:50;padding:16px}
  .overlay.open{display:flex}
  .modal{background:#fff;border-radius:20px;padding:24px;width:100%;max-width:480px;
         max-height:90vh;overflow-y:auto;box-shadow:0 20px 50px rgba(15,23,42,.3)}
  .modal h2{font-size:19px;margin-bottom:16px}
  .campo{margin-bottom:13px}
  .campo label{display:block;font-size:12px;font-weight:700;letter-spacing:1px;
               text-transform:uppercase;color:var(--muted);margin-bottom:5px}
  .campo input[type=text],.campo textarea,.campo select,.campo input[type=date]{
    width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 12px;
    font-size:14px;font-family:inherit}
  .campo textarea{resize:vertical;min-height:70px}
  .campo-check{display:flex;align-items:center;gap:9px;font-size:13.5px;
               background:#fff7ed;border-radius:11px;padding:11px 13px;cursor:pointer}
  .campo-check input{width:17px;height:17px;accent-color:var(--azul)}
  .modal-botones{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
  .fila2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  /* modal de avisos al iniciar sesión */
  .aviso-item{background:#fff7ed;border-left:4px solid #f97316;border-radius:12px;
              padding:12px 14px;margin-bottom:9px;font-size:14px}
  .aviso-item b{display:block;margin-bottom:2px}
  .aviso-item .de{font-size:12px;color:#c2410c}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
         background:var(--ink);color:#fff;padding:11px 20px;border-radius:12px;
         font-size:14px;font-weight:600;opacity:0;pointer-events:none;
         transition:opacity .25s;z-index:99}
  .toast.show{opacity:1}

  /* calendario */
  .cal-top{display:flex;align-items:center;justify-content:space-between;
           margin-bottom:10px}
  .cal-top h3{font-size:17px;font-weight:800;text-transform:capitalize}
  .cal-nav{display:flex;gap:6px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .cal-dow{font-size:10.5px;font-weight:700;letter-spacing:1px;color:var(--muted);
           text-transform:uppercase;text-align:center;padding:4px 0}
  .cal-dia{background:var(--card);border-radius:12px;min-height:78px;padding:6px;
           border:1px solid var(--line);cursor:pointer;overflow:hidden}
  .cal-dia:hover{border-color:var(--azul)}
  .cal-dia.otro{opacity:.35}
  .cal-dia.hoy{border:2px solid var(--azul)}
  .cal-dia.sel{background:#eaf2ff;border-color:var(--azul)}
  .cal-num{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:3px}
  .cal-dia.hoy .cal-num{color:var(--azul)}
  .cal-chip{font-size:10.5px;font-weight:600;border-radius:6px;padding:2px 5px;
            margin-bottom:2px;white-space:nowrap;overflow:hidden;
            text-overflow:ellipsis;background:#eaf2ff;color:var(--azul)}
  .cal-chip.c-en_curso{background:#fef3c7;color:#92400e}
  .cal-chip.c-resuelto{background:#dcfce7;color:var(--verde);text-decoration:line-through}
  .cal-chip.c-no_resuelto{background:#fee2e2;color:var(--rojo)}
  .cal-chip.c-vencida{background:#fee2e2;color:var(--rojo)}
  .cal-mas{font-size:10px;color:var(--muted);font-weight:700}
  .cal-detalle{margin-top:14px}
  .cal-detalle h4{font-size:13px;font-weight:700;letter-spacing:1.5px;
                  text-transform:uppercase;color:var(--muted);margin-bottom:8px}

  @media(max-width:640px){
    body{padding:14px}
    h1{font-size:24px}
    .fila2{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <div class="eyebrow" id="fechaHoy"></div>
      <h1>📝 Agenda <span class="azul">Secretaría</span></h1>
      <div class="sub">Pendientes compartidos del equipo · chau papelitos 🗒️❌</div>
    </div>
    <button class="btn btn-azul" onclick="abrirNueva()">＋ Nueva tarea</button>
  </div>

  <div class="stats">
    <div class="stat st-pend"><div class="n" id="nPend">–</div><div class="l">Pendientes</div></div>
    <div class="stat st-curso"><div class="n" id="nCurso">–</div><div class="l">En curso</div></div>
    <div class="stat st-res"><div class="n" id="nRes">–</div><div class="l">Resueltas (mes)</div></div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="filtros" id="filtros"></div>
  <div class="lista" id="lista"><div class="vacio">Cargando…</div></div>
</div>

<!-- Modal nueva tarea -->
<div class="overlay" id="ovNueva">
  <div class="modal">
    <h2>Nueva tarea</h2>
    <div class="campo"><label>Título</label>
      <input type="text" id="fTitulo" placeholder="Ej: llamar a la obra social por autorizaciones" maxlength="140"></div>
    <div class="campo"><label>Detalle (opcional)</label>
      <textarea id="fDetalle" placeholder="Más info si hace falta…"></textarea></div>
    <div class="fila2">
      <div class="campo"><label>Para</label><select id="fAsignada"></select></div>
      <div class="campo"><label>Prioridad</label>
        <select id="fPrioridad">
          <option value="normal">Normal</option>
          <option value="alta">🔴 Alta</option>
          <option value="baja">Baja</option>
        </select></div>
    </div>
    <div class="campo"><label>Fecha límite (opcional)</label>
      <input type="date" id="fFecha"></div>
    <label class="campo-check">
      <input type="checkbox" id="fAviso">
      <span>🔔 Avisar apenas inicie sesión (le aparece un cartel)</span>
    </label>
    <div class="modal-botones">
      <button class="btn btn-ghost" onclick="cerrar('ovNueva')">Cancelar</button>
      <button class="btn btn-azul" onclick="guardarTarea()">Guardar</button>
    </div>
  </div>
</div>

<!-- Modal resolver -->
<div class="overlay" id="ovResolver">
  <div class="modal">
    <h2 id="rTitulo">¿Cómo quedó?</h2>
    <div class="campo"><label>Comentario (qué se hizo / por qué no salió)</label>
      <textarea id="rComentario" placeholder="Opcional pero recomendado 😉"></textarea></div>
    <div class="modal-botones">
      <button class="btn btn-ghost" onclick="cerrar('ovResolver')">Cancelar</button>
      <button class="btn" style="background:#fee2e2;color:var(--rojo)" onclick="resolver('no_resuelto')">❌ No resuelto</button>
      <button class="btn" style="background:#dcfce7;color:var(--verde)" onclick="resolver('resuelto')">✅ Resuelto</button>
    </div>
  </div>
</div>

<!-- Modal avisos al entrar -->
<div class="overlay" id="ovAvisos">
  <div class="modal">
    <h2 id="avisosTitulo">🔔 Tenés avisos de tus compañeras</h2>
    <div id="avisosLista"></div>
    <div class="modal-botones">
      <button class="btn btn-azul" onclick="marcarAvisosVistos()">Ya lo vi 👍</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ================== CONFIG ==================
const SUPABASE_URL = 'https://bqpjtoiictnzcasxfucf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_yvuXDxrkRrhXwmZBnE_a_Q_zDBz0iDi';
// Mail de cada una → nombre corto. COMPLETAR con los mails reales:
const USUARIOS = {
  'paukappes@gmail.com': 'Pau',
  'alejandraperna@gmail.com': 'Ale',
  'jimenahllorente@gmail.com': 'Jime',
  'liclucianavelaz@gmail.com': 'Lu'
};
const NOMBRES = ['Pau','Ale','Jime','Lu'];
// ============================================

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let YO = null;              // nombre corto de quien está logueada
let tareas = [];
let comentCounts = {};
let tabActual = 'pendiente';
let filtroActual = 'todas';
let tareaResolviendo = null;
let avisosPendientes = [];

const $ = id => document.getElementById(id);
const esc = s => (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}
function cerrar(id){ $(id).classList.remove('open'); }

// ---------- init ----------
(async function init(){
  const hoy = new Date();
  $('fechaHoy').textContent = hoy.toLocaleDateString('es-AR',
    {weekday:'long', day:'numeric', month:'long'}).toUpperCase();

  const { data: { user } } = await db.auth.getUser();
  if (!user){
    $('lista').innerHTML = '<div class="vacio"><span class="emo">🔒</span>Iniciá sesión en el Ecosistema para ver la agenda.</div>';
    return;
  }
  YO = USUARIOS[(user.email||'').toLowerCase()] || user.email;

  // selects y filtros
  const sel = $('fAsignada');
  sel.innerHTML = '<option value="">👥 Común (todas)</option>' +
    NOMBRES.map(n => `<option value="${n}">${n}</option>`).join('');
  $('filtros').innerHTML =
    ['todas','comun',...NOMBRES].map(f =>
      `<div class="chip ${f==='todas'?'on':''}" data-f="${f}" onclick="setFiltro('${f}')">` +
      (f==='todas'?'Todas':(f==='comun'?'👥 Común':f)) + '</div>').join('');

  await cargar();
  await chequearAvisos();
})();

// ---------- carga ----------
async function cargar(){
  const { data, error } = await db.from('tareas_secretaria')
    .select('*').eq('archivada', false)
    .order('prioridad', {ascending:true})
    .order('fecha_limite', {ascending:true, nullsFirst:false})
    .order('created_at', {ascending:false});
  if (error){ toast('Error cargando tareas'); console.error(error); return; }
  tareas = data || [];

  // contadores de comentarios
  comentCounts = {};
  if (tareas.length){
    const ids = tareas.map(t=>t.id);
    const { data: coms } = await db.from('tareas_comentarios')
      .select('tarea_id').in('tarea_id', ids);
    (coms||[]).forEach(c => { comentCounts[c.tarea_id] = (comentCounts[c.tarea_id]||0)+1; });
  }
  render();
  // Si está embebida en app.html, avisar para que refresque el globito del sidebar
  try { window.parent.postMessage({ tipo:'REFRESCAR_BADGE_AGENDA_SEC' }, '*'); } catch(e){}
}

function counts(){
  const pend = tareas.filter(t=>t.estado==='pendiente').length;
  const curso = tareas.filter(t=>t.estado==='en_curso').length;
  const inicioMes = new Date(); inicioMes.setDate(1); inicioMes.setHours(0,0,0,0);
  const res = tareas.filter(t=>(t.estado==='resuelto'||t.estado==='no_resuelto')
      && t.resuelto_at && new Date(t.resuelto_at) >= inicioMes).length;
  return {pend, curso, res};
}

function render(){
  const c = counts();
  $('nPend').textContent = c.pend;
  $('nCurso').textContent = c.curso;
  $('nRes').textContent = c.res;

  $('tabs').innerHTML = [
    ['pendiente', 'Pendientes', c.pend],
    ['en_curso', 'En curso', c.curso],
    ['resueltas', 'Resueltas', null],
    ['calendario', '📅 Calendario', null]
  ].map(([k,l,n]) =>
    `<div class="tab ${tabActual===k?'on':''}" onclick="setTab('${k}')">${l}` +
    (n ? `<span class="pill">${n}</span>` : '') + '</div>').join('');

  if (tabActual === 'calendario'){ renderCalendario(); return; }

  let lista = tareas.filter(t => tabActual==='resueltas'
    ? (t.estado==='resuelto'||t.estado==='no_resuelto')
    : t.estado===tabActual);
  if (filtroActual==='comun') lista = lista.filter(t=>!t.asignada_a);
  else if (filtroActual!=='todas') lista = lista.filter(t=>t.asignada_a===filtroActual);

  // alta primero dentro de la pestaña
  const peso = {alta:0, normal:1, baja:2};
  lista.sort((a,b)=> peso[a.prioridad]-peso[b.prioridad]);

  if (!lista.length){
    $('lista').innerHTML = `<div class="vacio"><span class="emo">${tabActual==='resueltas'?'📂':'🎉'}</span>` +
      (tabActual==='resueltas' ? 'Todavía no hay tareas resueltas acá.' : 'Nada por acá. ¡Al día!') + '</div>';
    return;
  }

  const hoyStr = new Date().toISOString().slice(0,10);
  $('lista').innerHTML = lista.map(t => {
    const resuelta = t.estado==='resuelto', noRes = t.estado==='no_resuelto';
    const nCom = comentCounts[t.id]||0;
    const vencida = t.fecha_limite && t.fecha_limite < hoyStr && !resuelta && !noRes;
    return `
    <div class="tarea e-${t.estado}">
      <div class="check ${resuelta?'ok':(noRes?'no':'')}"
           title="${resuelta||noRes?'Reabrir':'Marcar cómo quedó'}"
           onclick="${resuelta||noRes?`reabrir('${t.id}')`:`abrirResolver('${t.id}')`}">
        ${resuelta?'✓':(noRes?'✕':'')}</div>
      <div class="t-body">
        <div class="t-tit ${resuelta?'tachado':''}">${esc(t.titulo)}</div>
        ${t.detalle?`<div class="t-det">${esc(t.detalle)}</div>`:''}
        <div class="t-meta">
          <span class="tag ${t.asignada_a?'tag-pers':'tag-comun'}">${t.asignada_a?'👤 '+esc(t.asignada_a):'👥 Común'}</span>
          ${t.prioridad==='alta'?'<span class="tag tag-alta">🔴 Alta</span>':''}
          ${t.prioridad==='baja'?'<span class="tag tag-baja">Baja</span>':''}
          ${t.fecha_limite?`<span class="tag tag-fecha ${vencida?'vencida':''}">📅 ${t.fecha_limite.split('-').reverse().join('/')}${vencida?' ⚠️':''}</span>`:''}
          ${t.aviso && !resuelta && !noRes ?'<span class="tag tag-aviso">🔔 Con aviso</span>':''}
          <span class="t-quien">por ${esc(t.creada_por)}${t.resuelto_por?` · cerró ${esc(t.resuelto_por)}`:''}</span>
        </div>
        <div class="t-acciones">
          ${t.estado==='pendiente'?`<button class="link" onclick="pasarACurso('${t.id}')">▶ Pasar a en curso</button>`:''}
          <button class="link gris" onclick="toggleComs('${t.id}')">💬 Comentarios${nCom?` (${nCom})`:''}</button>
          ${(resuelta||noRes)?`<button class="link gris" onclick="archivar('${t.id}')">🗄 Archivar</button>`:''}
        </div>
        <div class="coments" id="coms-${t.id}">
          <div id="comsLista-${t.id}"></div>
          <div class="com-form">
            <input type="text" id="comsInput-${t.id}" placeholder="Escribir comentario…"
                   onkeydown="if(event.key==='Enter')comentar('${t.id}')">
            <button class="btn btn-azul btn-sm" onclick="comentar('${t.id}')">Enviar</button>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
}

function setTab(k){ tabActual = k; render(); }

// ---------- calendario ----------
let calAnio = new Date().getFullYear();
let calMes = new Date().getMonth();      // 0-11
let calDiaSel = null;                    // 'YYYY-MM-DD'

function tareasFiltradasCal(){
  let lista = tareas.filter(t => t.fecha_limite);
  if (filtroActual==='comun') lista = lista.filter(t=>!t.asignada_a);
  else if (filtroActual!=='todas') lista = lista.filter(t=>t.asignada_a===filtroActual);
  return lista;
}

function renderCalendario(){
  const hoyStr = new Date().toISOString().slice(0,10);
  const porDia = {};
  tareasFiltradasCal().forEach(t => {
    (porDia[t.fecha_limite] = porDia[t.fecha_limite] || []).push(t);
  });

  const primero = new Date(calAnio, calMes, 1);
  const nombreMes = primero.toLocaleDateString('es-AR', {month:'long', year:'numeric'});
  // Lunes = 0
  const offset = (primero.getDay() + 6) % 7;
  const diasEnMes = new Date(calAnio, calMes+1, 0).getDate();
  const p2 = x => String(x).padStart(2,'0');

  let celdas = '';
  // días del mes anterior para completar la primera fila
  const prevDias = new Date(calAnio, calMes, 0).getDate();
  for (let i = offset-1; i >= 0; i--){
    celdas += `<div class="cal-dia otro"><div class="cal-num">${prevDias-i}</div></div>`;
  }
  for (let d = 1; d <= diasEnMes; d++){
    const f = `${calAnio}-${p2(calMes+1)}-${p2(d)}`;
    const ts = porDia[f] || [];
    const chips = ts.slice(0,3).map(t => {
      const vencida = t.fecha_limite < hoyStr && (t.estado==='pendiente'||t.estado==='en_curso');
      const clase = vencida ? 'c-vencida' : 'c-'+t.estado;
      return `<div class="cal-chip ${clase}">${t.asignada_a?esc(t.asignada_a)+': ':''}${esc(t.titulo)}</div>`;
    }).join('');
    const mas = ts.length > 3 ? `<div class="cal-mas">+${ts.length-3} más</div>` : '';
    celdas += `<div class="cal-dia ${f===hoyStr?'hoy':''} ${f===calDiaSel?'sel':''}"
      onclick="selDiaCal('${f}')"><div class="cal-num">${d}</div>${chips}${mas}</div>`;
  }

  let detalle = '';
  if (calDiaSel && porDia[calDiaSel]){
    detalle = `<div class="cal-detalle">
      <h4>📌 Tareas del ${calDiaSel.split('-').reverse().join('/')}</h4>
      <div class="lista">` +
      porDia[calDiaSel].map(t => `
        <div class="tarea e-${t.estado}">
          <div class="t-body">
            <div class="t-tit ${t.estado==='resuelto'?'tachado':''}">${esc(t.titulo)}</div>
            ${t.detalle?`<div class="t-det">${esc(t.detalle)}</div>`:''}
            <div class="t-meta">
              <span class="tag ${t.asignada_a?'tag-pers':'tag-comun'}">${t.asignada_a?'👤 '+esc(t.asignada_a):'👥 Común'}</span>
              ${t.prioridad==='alta'?'<span class="tag tag-alta">🔴 Alta</span>':''}
              <span class="t-quien">por ${esc(t.creada_por)}</span>
            </div>
            ${(t.estado==='pendiente'||t.estado==='en_curso')?`<div class="t-acciones">
              <button class="link" onclick="setTab('${t.estado}')">Ir a la tarea →</button>
            </div>`:''}
          </div>
        </div>`).join('') + '</div></div>';
  }

  $('lista').innerHTML = `
    <div class="cal-top">
      <h3>${nombreMes}</h3>
      <div class="cal-nav">
        <button class="btn btn-ghost btn-sm" onclick="moverMesCal(-1)">‹ Anterior</button>
        <button class="btn btn-ghost btn-sm" onclick="hoyCal()">Hoy</button>
        <button class="btn btn-ghost btn-sm" onclick="moverMesCal(1)">Siguiente ›</button>
      </div>
    </div>
    <div class="cal-grid">
      ${['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${celdas}
    </div>
    ${detalle}
    <p style="margin-top:12px;font-size:12px;color:var(--muted)">
      Solo aparecen las tareas que tienen fecha límite. Las que vencen HOY (o ya vencieron)
      le avisan solas a la persona apenas inicia sesión.</p>`;
}
function moverMesCal(delta){
  calMes += delta;
  if (calMes < 0){ calMes = 11; calAnio--; }
  if (calMes > 11){ calMes = 0; calAnio++; }
  calDiaSel = null; renderCalendario();
}
function hoyCal(){
  const h = new Date(); calAnio = h.getFullYear(); calMes = h.getMonth();
  calDiaSel = h.toISOString().slice(0,10); renderCalendario();
}
function selDiaCal(f){ calDiaSel = (calDiaSel===f ? null : f); renderCalendario(); }function setFiltro(f){
  filtroActual = f;
  document.querySelectorAll('.chip').forEach(c =>
    c.classList.toggle('on', c.dataset.f===f));
  render();
}

// ---------- crear ----------
function abrirNueva(){
  $('fTitulo').value=''; $('fDetalle').value=''; $('fAsignada').value='';
  $('fPrioridad').value='normal'; $('fFecha').value=''; $('fAviso').checked=false;
  $('ovNueva').classList.add('open');
  setTimeout(()=>$('fTitulo').focus(), 50);
}
async function guardarTarea(){
  const titulo = $('fTitulo').value.trim();
  if (!titulo){ toast('Poné un título 🙂'); return; }
  const { error } = await db.from('tareas_secretaria').insert({
    titulo,
    detalle: $('fDetalle').value.trim() || null,
    creada_por: YO,
    asignada_a: $('fAsignada').value || null,
    prioridad: $('fPrioridad').value,
    fecha_limite: $('fFecha').value || null,
    aviso: $('fAviso').checked
  });
  if (error){ toast('Error al guardar'); console.error(error); return; }
  cerrar('ovNueva'); toast('Tarea creada ✅'); await cargar();
}

// ---------- resolver / reabrir / en curso ----------
function abrirResolver(id){
  tareaResolviendo = id;
  const t = tareas.find(x=>x.id===id);
  $('rTitulo').textContent = '¿Cómo quedó "' + (t?t.titulo:'') + '"?';
  $('rComentario').value = '';
  $('ovResolver').classList.add('open');
}
async function resolver(estado){
  const id = tareaResolviendo; if (!id) return;
  const coment = $('rComentario').value.trim();
  const { error } = await db.from('tareas_secretaria').update({
    estado, resuelto_por: YO, resuelto_at: new Date().toISOString()
  }).eq('id', id);
  if (error){ toast('Error'); console.error(error); return; }
  if (coment){
    await db.from('tareas_comentarios').insert({ tarea_id:id, autor:YO,
      texto:(estado==='resuelto'?'✅ ':'❌ ')+coment });
  }
  cerrar('ovResolver');
  toast(estado==='resuelto'?'Marcada como resuelta ✅':'Marcada como no resuelta ❌');
  await cargar();
}
async function reabrir(id){
  const { error } = await db.from('tareas_secretaria').update({
    estado:'pendiente', resuelto_por:null, resuelto_at:null }).eq('id', id);
  if (error){ toast('Error'); return; }
  toast('Tarea reabierta 🔄'); await cargar();
}
async function pasarACurso(id){
  const { error } = await db.from('tareas_secretaria')
    .update({estado:'en_curso'}).eq('id', id);
  if (error){ toast('Error'); return; }
  await cargar();
}
async function archivar(id){
  const { error } = await db.from('tareas_secretaria')
    .update({archivada:true}).eq('id', id);
  if (error){ toast('Error'); return; }
  toast('Archivada 🗄'); await cargar();
}

// ---------- comentarios ----------
async function toggleComs(id){
  const box = $('coms-'+id);
  if (box.classList.contains('open')){ box.classList.remove('open'); return; }
  box.classList.add('open');
  const { data } = await db.from('tareas_comentarios')
    .select('*').eq('tarea_id', id).order('created_at', {ascending:true});
  $('comsLista-'+id).innerHTML = (data&&data.length)
    ? data.map(c=>`<div class="com"><b>${esc(c.autor)}</b>` +
        `<span class="cf">${new Date(c.created_at).toLocaleDateString('es-AR',{day:'numeric',month:'short'})}</span>` +
        `<div>${esc(c.texto)}</div></div>`).join('')
    : '<div class="com" style="color:var(--muted)">Sin comentarios todavía.</div>';
}
async function comentar(id){
  const inp = $('comsInput-'+id);
  const texto = inp.value.trim(); if (!texto) return;
  const { error } = await db.from('tareas_comentarios')
    .insert({tarea_id:id, autor:YO, texto});
  if (error){ toast('Error'); return; }
  inp.value = '';
  comentCounts[id] = (comentCounts[id]||0)+1;
  const box = $('coms-'+id);
  box.classList.remove('open');
  await toggleComs(id);
}

// ---------- avisos al iniciar sesión ----------
async function chequearAvisos(){
  const hoyStr = new Date().toISOString().slice(0,10);
  const activas = tareas.filter(t => t.estado==='pendiente'||t.estado==='en_curso');
  const mias = t => (!t.asignada_a || t.asignada_a === YO);

  // 1) Avisos 🔔 puntuales de compañeras (se ven UNA vez, quedan en tareas_vistas)
  const candidatas = activas.filter(t => t.aviso && t.creada_por !== YO && mias(t));
  let nuevas = [];
  if (candidatas.length){
    const ids = candidatas.map(t=>t.id);
    const { data: vistas } = await db.from('tareas_vistas')
      .select('tarea_id').in('tarea_id', ids).eq('usuario', YO);
    const vistasSet = new Set((vistas||[]).map(v=>v.tarea_id));
    nuevas = candidatas.filter(t=>!vistasSet.has(t.id));
  }
  avisosPendientes = nuevas;

  // 2) Para HOY + vencidas (automático por fecha límite; aparece cada vez
  //    que inicia sesión hasta que la tarea se resuelva)
  const deHoy = activas.filter(t => mias(t) && t.fecha_limite === hoyStr);
  const vencidas = activas.filter(t => mias(t) && t.fecha_limite && t.fecha_limite < hoyStr);

  if (!nuevas.length && !deHoy.length && !vencidas.length) return;

  const item = (t, extra) =>
    `<div class="aviso-item"><b>${esc(t.titulo)}</b>` +
    (t.detalle?`<div>${esc(t.detalle)}</div>`:'') +
    `<div class="de">${extra}</div></div>`;

  let html = '';
  if (nuevas.length){
    html += `<h4 style="font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:4px 0 8px">🔔 Avisos de tus compañeras</h4>`;
    html += nuevas.map(t => item(t, 'de ' + esc(t.creada_por) +
      (t.fecha_limite?` · para el ${t.fecha_limite.split('-').reverse().join('/')}`:''))).join('');
  }
  if (deHoy.length){
    html += `<h4 style="font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:12px 0 8px">📅 Para hoy</h4>`;
    html += deHoy.map(t => item(t, `vence HOY · por ${esc(t.creada_por)}`)).join('');
  }
  if (vencidas.length){
    html += `<h4 style="font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--rojo);margin:12px 0 8px">⚠️ Vencidas sin resolver</h4>`;
    html += vencidas.map(t => item(t,
      `venció el ${t.fecha_limite.split('-').reverse().join('/')} · por ${esc(t.creada_por)}`)).join('');
  }
  $('avisosLista').innerHTML = html;
  $('avisosTitulo').textContent = nuevas.length ? '🔔 Tenés avisos y tareas del día' : '📅 Lo tuyo para hoy';
  $('ovAvisos').classList.add('open');
}
async function marcarAvisosVistos(){
  const filas = avisosPendientes.map(t=>({tarea_id:t.id, usuario:YO}));
  if (filas.length) await db.from('tareas_vistas').upsert(filas);
  avisosPendientes = [];
  cerrar('ovAvisos');
}
</script>
