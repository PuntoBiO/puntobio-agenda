<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nuevo cobro TF · PuntoBiO</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#f8fafc; --panel:#ffffff; --panel-2:#f1f5f9;
    --border:#e5e7eb; --text:#0f172a; --muted:#64748b;
    --accent:#1e9fe0; --accent-2:#0c7bb8;
    --green:#22c55e; --red:#ef4444; --yellow:#eab308;
  }
  *{box-sizing:border-box}
  body{
    font-family:-apple-system,system-ui,'Segoe UI',sans-serif;
    background:var(--bg); color:var(--text);
    margin:0; padding:0; min-height:100vh;
  }
  .wrap{max-width:780px; margin:0 auto; padding:24px 16px 80px;}
  h1{color:var(--accent); margin:0 0 20px; font-size:22px; display:flex; align-items:center; gap:10px;}
  .loading{text-align:center; padding:60px 20px; color:var(--muted);}

  /* Buscador */
  .search-wrap{position:relative;}
  .search-box{
    width:100%; padding:14px 18px; font-size:16px;
    background:var(--panel); border:1px solid var(--border);
    border-radius:10px; color:var(--text);
  }
  .search-box:focus{outline:none; border-color:var(--accent);}
  .clear-btn{
    position:absolute; right:14px; top:50%; transform:translateY(-50%);
    background:transparent; border:none; color:var(--muted);
    font-size:18px; cursor:pointer; display:none;
  }
  .clear-btn.visible{display:block;}

  /* Resultados */
  .results{
    margin-top:8px; max-height:380px; overflow-y:auto;
    background:var(--panel); border:1px solid var(--border);
    border-radius:10px; display:none;
  }
  .results.visible{display:block;}
  .result-item{
    padding:12px 16px; border-bottom:1px solid var(--border);
    cursor:pointer; display:flex; justify-content:space-between; gap:12px;
    align-items:center;
  }
  .result-item:hover{background:#eff6ff;}
  .result-item:last-child{border-bottom:none;}
  .result-id{
    font-family:monospace; color:var(--muted); font-size:12px;
    background:var(--panel-2); padding:3px 8px; border-radius:4px; min-width:50px; text-align:center;
  }
  .result-info{flex:1;}
  .result-name{font-weight:600; font-size:14px;}
  .result-detail{color:var(--muted); font-size:12px; margin-top:2px;}
  .result-empty{padding:20px; text-align:center; color:var(--muted);}

  .badge{
    padding:3px 10px; border-radius:6px; font-size:10px;
    font-weight:700; letter-spacing:0.4px;
  }
  .badge-activo{background:#dcfce7; color:var(--green);}
  .badge-baja{background:#fee2e2; color:var(--red);}

  /* Panel de datos del alumno */
  .panel{
    margin-top:20px; padding:18px;
    background:var(--panel); border:1px solid var(--border);
    border-radius:10px; display:none;
  }
  .panel.visible{display:block;}
  .panel-title{
    font-size:12px; text-transform:uppercase; letter-spacing:1px;
    color:var(--muted); margin-bottom:12px;
  }
  .row{
    display:flex; justify-content:space-between; padding:7px 0;
    border-bottom:1px solid var(--border);
  }
  .row:last-child{border-bottom:none;}
  .row-label{color:var(--muted); font-size:14px;}
  .row-value{font-weight:600; font-size:14px;}
  .row-monto .row-value{color:var(--accent); font-size:18px;}

  /* Historial de pagos */
  .pagos-list{margin-top:8px;}
  .pago-line{
    display:flex; justify-content:space-between; padding:6px 0;
    font-size:13px; border-bottom:1px dashed var(--border);
  }
  .pago-line:last-child{border-bottom:none;}
  .pago-info{color:var(--muted);}
  .pago-monto{font-weight:600; color:var(--green);}
  .pagos-empty{color:var(--muted); font-size:13px; font-style:italic; text-align:center; padding:10px;}

  /* Form */
  .form-cobro{
    margin-top:20px; padding:18px;
    background:var(--panel); border:1px solid var(--border);
    border-radius:10px; display:none;
  }
  .form-cobro.visible{display:block;}
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media (max-width:520px){.form-grid{grid-template-columns:1fr;}}
  .form-group{margin-bottom:14px;}
  .form-group label{
    display:block; margin-bottom:6px;
    color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:0.5px;
  }
  .form-group input,
  .form-group select,
  .form-group textarea{
    width:100%; padding:10px 12px;
    background:var(--bg); border:1px solid var(--border);
    border-radius:6px; color:var(--text);
    font-size:15px; font-family:inherit;
  }
  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus{
    outline:none; border-color:var(--accent);
  }
  .quick-amounts{
    display:flex; gap:6px; margin-top:6px; flex-wrap:wrap;
  }
  .quick-amount{
    padding:5px 10px; font-size:12px;
    background:var(--panel-2); border:1px solid var(--border);
    border-radius:5px; color:var(--text); cursor:pointer;
  }
  .quick-amount:hover{border-color:var(--accent);}

  .btn-submit{
    width:100%; padding:14px; font-size:16px;
    background:var(--accent); color:white;
    border:none; border-radius:8px; cursor:pointer;
    font-weight:700; margin-top:12px;
    transition:background 0.15s;
  }
  .btn-submit:hover:not(:disabled){background:var(--accent-2);}
  .btn-submit:disabled{opacity:0.5; cursor:not-allowed;}

  .btn-update{
    width:100%; padding:12px; font-size:15px;
    background:transparent; color:var(--accent);
    border:1px solid var(--accent); border-radius:8px;
    cursor:pointer; font-weight:600;
  }
  .btn-update:hover:not(:disabled){background:#dbeafe;}
  .btn-update:disabled{opacity:0.5; cursor:not-allowed;}

  .mod-toggle{cursor:pointer; user-select:none;}
  .mod-toggle:hover{color:var(--accent);}

  .radio-group{display:flex; flex-direction:column; gap:8px; margin-top:4px;}
  .radio-opt{
    display:flex; align-items:center; gap:8px;
    padding:10px 14px; background:var(--bg);
    border:1px solid var(--border); border-radius:6px;
    cursor:pointer; font-size:14px;
  }
  .radio-opt:hover{border-color:var(--accent);}
  .radio-opt input[type="radio"]{accent-color:var(--accent); cursor:pointer;}

  .message{
    padding:14px 16px; border-radius:8px; margin-top:16px;
    display:none; font-size:14px; font-weight:500;
  }
  .message.visible{display:block;}
  .message.success{background:#dcfce7; color:var(--green); border:1px solid rgba(34,197,94,0.3);}
  .message.error{background:#fee2e2; color:var(--red); border:1px solid rgba(239,68,68,0.3);}
</style>
</head>
<body>
<div class="wrap">
  <h1>💰 Nuevo cobro · Terapia Física</h1>

  <div id="loading" class="loading">Cargando alumnos...</div>

  <div id="main" style="display:none;">

    <div class="search-wrap">
      <input type="text" id="search" class="search-box"
             placeholder="Buscar alumno por nombre o ID..." autocomplete="off" />
      <button class="clear-btn" id="clear-btn" title="Limpiar">✕</button>
    </div>
    <div id="results" class="results"></div>

    <!-- Datos del alumno -->
    <div id="panel-alumno" class="panel">
      <div class="panel-title">Datos del alumno</div>
      <div class="row"><span class="row-label">Alumno</span><span class="row-value" id="al-nombre"></span></div>
      <div class="row"><span class="row-label">ID</span><span class="row-value" id="al-id"></span></div>
      <div class="row"><span class="row-label">Plan</span><span class="row-value" id="al-plan"></span></div>
      <div class="row"><span class="row-label">Valor lista</span><span class="row-value" id="al-valor"></span></div>
      <div class="row"><span class="row-label">Descuento</span><span class="row-value" id="al-desc"></span></div>
      <div class="row row-monto"><span class="row-label">Monto a pagar</span><span class="row-value" id="al-monto"></span></div>
      <div class="row"><span class="row-label">Vencimiento</span><span class="row-value" id="al-venc"></span></div>
      <div class="row"><span class="row-label">Estado</span><span class="row-value" id="al-estado"></span></div>
    </div>

    <!-- Historial reciente -->
    <div id="panel-pagos" class="panel">
      <div class="panel-title">Pagos recientes</div>
      <div id="pagos-list" class="pagos-list"></div>
    </div>

    <!-- Modificar inscripción (colapsable) -->
    <div id="panel-modificar" class="panel">
      <div class="panel-title mod-toggle" onclick="toggleModificar()">
        ✏️ Modificar inscripción <span id="mod-arrow">▾</span>
      </div>
      <div id="mod-content" style="display:none; margin-top:8px;">
        <div class="form-grid">
          <div class="form-group">
            <label>Plan</label>
            <select id="mod-plan"></select>
          </div>
          <div class="form-group">
            <label>Descuento permanente</label>
            <input type="number" id="mod-descuento" min="0" step="100" />
          </div>
        </div>
        <div class="form-group">
          <label>Día de vencimiento (opcional)</label>
          <input type="number" id="mod-vencimiento" min="1" max="31" />
        </div>
        <button class="btn-update" id="btn-actualizar">Guardar cambios en la inscripción</button>
        <div id="mod-message" class="message" style="margin-top:10px;"></div>
      </div>
    </div>

    <!-- Cambio de fecha de vencimiento con prorrateo -->
    <div id="panel-prorrateo" class="panel">
      <div class="panel-title mod-toggle" onclick="toggleProrrateo()">
        📅 Cambiar fecha de vencimiento (con prorrateo) <span id="pro-arrow">▾</span>
      </div>
      <div id="pro-content" style="display:none; margin-top:8px;">
        <div class="form-grid">
          <div class="form-group">
            <label>Vencimiento actual (desde)</label>
            <input type="date" id="pro-desde" />
          </div>
          <div class="form-group">
            <label>Nueva fecha de vencimiento (hasta)</label>
            <input type="date" id="pro-hasta" />
          </div>
        </div>

        <div id="pro-calc" style="display:none;">
          <div class="row"><span class="row-label">Días a prorratear</span><span class="row-value" id="pro-dias"></span></div>
          <div class="row"><span class="row-label">Valor por día</span><span class="row-value" id="pro-val-dia"></span></div>
          <div class="row row-monto"><span class="row-label">Proporcional</span><span class="row-value" id="pro-prop"></span></div>

          <div class="form-group" style="margin-top:14px;">
            <label>¿Cómo cobra?</label>
            <div class="radio-group">
              <label class="radio-opt">
                <input type="radio" name="pro-opcion" value="solo" checked />
                <span id="opt-solo-label">Solo proporcional</span>
              </label>
              <label class="radio-opt">
                <input type="radio" name="pro-opcion" value="adelanto" />
                <span id="opt-adelanto-label">Proporcional + Mes siguiente completo</span>
              </label>
            </div>
          </div>

          <div class="form-grid">
            <div class="form-group">
              <label>Medio de pago</label>
              <select id="pro-medio">
                <option value="EFECTIVO">Efectivo</option>
                <option value="TRANSFERENCIA">Transferencia</option>
                <option value="DEBITO">Débito</option>
              </select>
            </div>
            <div class="form-group">
              <label>Total a cobrar</label>
              <input type="number" id="pro-total" readonly style="background:var(--panel-2); font-weight:700; color:var(--accent);" />
            </div>
          </div>

          <button class="btn-update" id="btn-prorratear">Aplicar cambio de vencimiento + Cobrar</button>
        </div>

        <div id="pro-message" class="message" style="margin-top:10px;"></div>
      </div>
    </div>

    <!-- Form -->
    <div id="form-cobro" class="form-cobro">
      <!-- Pago parcial: paga una parte y queda debiendo el resto (NO es descuento) -->
      <label for="es_parcial" style="display:flex; align-items:center; gap:8px; margin-bottom:10px; cursor:pointer; font-weight:600; padding:10px 12px; border:1px solid var(--border); border-radius:8px; background:var(--panel-2);">
        <input type="checkbox" id="es_parcial" style="width:18px; height:18px; cursor:pointer; flex:none;" />
        🟠 Es pago parcial — paga una parte y queda debiendo el resto
      </label>
      <div id="parcial-hint" style="display:none; margin:-2px 0 12px; font-size:13px; font-weight:600; color:#b45309;"></div>

      <div class="form-grid" id="grid-monto">
        <div class="form-group" id="fg-descuento">
          <label>Descuento temporal (este mes)</label>
          <input type="number" id="descuento_temporal" min="0" step="100" value="0" />
        </div>

        <div class="form-group">
          <label id="lbl-importe">Importe a cobrar</label>
          <input type="number" id="importe" required min="0" step="100" />
        </div>
      </div>

      <div class="quick-amounts" id="quick-amounts"></div>
      <div id="sorteo-hint" style="display:none;margin-top:8px;padding:8px 12px;border-radius:8px;background:rgba(219,39,119,.12);border:1px solid rgba(219,39,119,.35);color:#f9a8d4;font-size:13px;"></div>

      <div class="form-grid" style="margin-top:14px;">
        <div class="form-group">
          <label>Medio</label>
          <select id="medio" required>
            <option value="EFECTIVO">Efectivo</option>
            <option value="TRANSFERENCIA">Transferencia</option>
            <option value="DEBITO">Débito</option>
          </select>
        </div>

        <div class="form-group">
          <label>Mes imputado</label>
          <select id="mes_imputado" required></select>
        </div>
      </div>

      <div class="form-group">
        <label>Tipo de cobro</label>
        <select id="tipo_cobro">
          <option value="NORMAL">Normal</option>
          <option value="CORTESIA">Cortesía (gratis)</option>
          <option value="MANUAL">Manual (con descuento temporal)</option>
        </select>
      </div>

      <div class="form-group">
        <label>Observaciones (opcional)</label>
        <textarea id="observaciones" rows="2" placeholder="Ej: pago parcial, motivo del descuento, etc."></textarea>
      </div>

      <button id="btn-cobrar" class="btn-submit">Registrar cobro</button>
    </div>

    <div id="message" class="message"></div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://bqpjtoiictnzcasxfucf.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_yvuXDxrkRrhXwmZBnE_a_Q_zDBz0iDi';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { lock: (name, acquireTimeout, fn) => fn() } });

  let alumnos = [];        // todos los alumnos TF (inscripciones + personas + tarifario)
  let alumnoSel = null;    // alumno actualmente seleccionado
  let descSorteo = new Set(); // 'persona_id|YYYY-MM': ganadores del sorteo de cumple con 25% OFF

  // === Utilidades ===
  const fmt = n => '$' + Number(n||0).toLocaleString('es-AR');
  const monthLabel = (yyyy_mm) => {
    const [y,m] = yyyy_mm.split('-');
    const d = new Date(parseInt(y), parseInt(m)-1, 1);
    return d.toLocaleString('es-AR',{month:'long',year:'numeric'});
  };

  // === Init ===
  // ===== "Cargado por": usuario logueado (se guarda en cada pago) =====
  let CARGADO_POR = null;
  const EMAIL_A_NOMBRE = {
    'liclucianavelaz@gmail.com': 'Lu',
    'jimenahllorente@gmail.com': 'Jime',
    'loz.magdalena@gmail.com': 'Male',
    'brunitovelez99@gmail.com': 'Bruno',
    'veronicasandler@hotmail.com': 'Vero',
    'paukappes@gmail.com': 'Pau',
    'alejandraperna@gmail.com': 'Ale',
    'santiagoferreira1999@gmail.com': 'Santi',
    'leacrespin97@gmail.com': 'Lean',
    'leut.molina@gmail.com': 'Lauti'
  };
  async function resolverCargadoPor(){
    try {
      const { data: { session } } = await sb.auth.getSession();
      if (!session || !session.user) return;
      const email = (session.user.email || '').toLowerCase().trim();
      let nombre = EMAIL_A_NOMBRE[email] || '';
      if (!nombre) {
        const { data: p } = await sb.from('personas').select('nombre').eq('auth_user_id', session.user.id).maybeSingle();
        if (p && p.nombre) { const w = p.nombre.trim().split(/\s+/)[0]; nombre = w ? (w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()) : ''; }
      }
      CARGADO_POR = nombre || null;
    } catch(e){ console.warn('No se pudo detectar el usuario logueado:', e.message); }
  }

  async function init(){
    resolverCargadoPor();
    try {
      const [inscR, tarR, sorR] = await Promise.all([
        sb.from('inscripciones_tf').select('id, plan, actividad, descuento_libre, dia_vencimiento, estado, persona_id'),
        sb.from('tarifario_tf').select('plan, actividad, valor_lista, valor_nuevo, aumento_desde'),
        // 🎰 Ganadores del sorteo de cumpleaños con premio 25% OFF (todos: la tabla es chica)
        sb.from('sorteos_cumple').select('persona_id, mes_descuento').eq('premio', 'DESCUENTO')
      ]);
      descSorteo = new Set(((sorR && sorR.data) || []).map(s => s.persona_id + '|' + s.mes_descuento));
      if (inscR.error) throw inscR.error;
      if (tarR.error) throw tarR.error;

      // Cargar personas (nombre)
      const personaIds = [...new Set(inscR.data.map(i => i.persona_id))];
      const persR = await sb.from('personas').select('id, nombre').in('id', personaIds);
      if (persR.error) throw persR.error;
      const persMap = {};
      persR.data.forEach(p => persMap[p.id] = p.nombre || '(sin nombre)');

      // Tarifario map
      const tarMap = {};
      tarR.data.forEach(t => tarMap[`${t.plan}|${t.actividad}`] = {
        valor_lista: parseFloat(t.valor_lista),
        valor_nuevo: t.valor_nuevo != null ? parseFloat(t.valor_nuevo) : null,
        aumento_desde: t.aumento_desde || null
      });
      planes_tarifario = tarR.data
        .filter(t => t.actividad === 'TERAPIA_FISICA')
        .map(t => ({plan: t.plan, valor_lista: parseFloat(t.valor_lista)}))
        .sort((a,b) => a.valor_lista - b.valor_lista);

      // Combinar
      alumnos = inscR.data.map(i => ({
        inscripcion_id: i.id,
        persona_id: i.persona_id,
        nombre: persMap[i.persona_id] || '(sin nombre)',
        plan: i.plan,
        actividad: i.actividad,
        descuento_libre: parseFloat(i.descuento_libre) || 0,
        valor_lista: tarMap[`${i.plan}|${i.actividad}`]?.valor_lista || 0,
        valor_nuevo: tarMap[`${i.plan}|${i.actividad}`]?.valor_nuevo ?? null,
        aumento_desde: tarMap[`${i.plan}|${i.actividad}`]?.aumento_desde || null,
        dia_vencimiento: i.dia_vencimiento,
        estado: i.estado
      })).sort((a,b) => a.nombre.localeCompare(b.nombre, 'es'));

      console.log(`✅ ${alumnos.length} alumnos cargados`);

      document.getElementById('loading').style.display = 'none';
      document.getElementById('main').style.display = 'block';

      poblarMeses();
      setupSearch();
      setupSubmit();
      setupClear();
      setupDescuentoTemporal();
      setupActualizar();
      setupProrrateo();
    } catch (e) {
      document.getElementById('loading').textContent = 'Error: ' + (e.message || e);
      console.error(e);
    }
  }

  function poblarMeses(){
    const sel = document.getElementById('mes_imputado');
    const hoy = new Date();
    // De -3 meses a +3 meses respecto al actual
    for (let i = -3; i <= 3; i++){
      const d = new Date(hoy.getFullYear(), hoy.getMonth() + i, 1);
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth()+1).padStart(2,'0');
      const val = `${yyyy}-${mm}`;
      const opt = document.createElement('option');
      opt.value = val;
      let nom = d.toLocaleString('es-AR',{month:'long',year:'numeric'});
      nom = nom.charAt(0).toUpperCase() + nom.slice(1);
      if (i === 0) nom += ' (este mes)';
      if (i === -1) nom += ' (mes anterior)';
      opt.textContent = nom;
      if (i === 0) opt.selected = true;
      sel.appendChild(opt);
    }
    // Si cambia el mes a imputar, recalcular precio del mes (junio/julio) y re-evaluar el 25% OFF
    sel.addEventListener('change', () => {
      if (alumnoSel) seleccionar(alumnoSel);
      else aplicarDescuentoSorteo();
    });
  }

  // === Búsqueda ===
  function setupSearch(){
    const input = document.getElementById('search');
    const box   = document.getElementById('results');
    const clear = document.getElementById('clear-btn');

    input.addEventListener('input', () => {
      const q = input.value.trim();
      clear.classList.toggle('visible', q.length > 0);
      if (q.length < 2){ box.classList.remove('visible'); return; }

      const qUp = q.toUpperCase();
      const matches = alumnos.filter(a =>
        a.nombre.toUpperCase().includes(qUp) || String(a.persona_id).startsWith(q)
      ).slice(0, 25);

      box.innerHTML = '';
      if (matches.length === 0){
        box.innerHTML = '<div class="result-empty">Sin resultados</div>';
      } else {
        matches.forEach(a => {
          const div = document.createElement('div');
          div.className = 'result-item';
          const monto = precioBaseMes(a, mesImputadoSel()) - a.descuento_libre;
          div.innerHTML = `
            <div class="result-id">${a.persona_id}</div>
            <div class="result-info">
              <div class="result-name">${a.nombre}</div>
              <div class="result-detail">${a.plan} · ${fmt(monto)}</div>
            </div>
            <span class="badge badge-${a.estado.toLowerCase()}">${a.estado}</span>
          `;
          div.onclick = () => seleccionar(a);
          box.appendChild(div);
        });
      }
      box.classList.add('visible');
    });
  }

  function setupClear(){
    document.getElementById('clear-btn').addEventListener('click', resetForm);
  }

  async function seleccionar(a){
    alumnoSel = a;
    document.getElementById('search').value = a.nombre;
    document.getElementById('results').classList.remove('visible');
    document.getElementById('clear-btn').classList.add('visible');

    // Panel
    document.getElementById('al-nombre').textContent = a.nombre;
    document.getElementById('al-id').textContent = a.persona_id;
    document.getElementById('al-plan').textContent = a.plan;
    document.getElementById('al-valor').textContent = fmt(precioBaseMes(a, mesImputadoSel()));
    document.getElementById('al-desc').textContent = a.descuento_libre > 0 ? '-' + fmt(a.descuento_libre) : 'Sin descuento';
    const monto = precioBaseMes(a, mesImputadoSel()) - a.descuento_libre;
    document.getElementById('al-monto').textContent = fmt(monto);
    document.getElementById('al-venc').textContent = a.dia_vencimiento ? `Día ${a.dia_vencimiento}` : '—';
    const est = document.getElementById('al-estado');
    est.textContent = a.estado;
    est.className = 'row-value badge badge-' + a.estado.toLowerCase();

    document.getElementById('panel-alumno').classList.add('visible');

    // Reset descuento temporal e importe
    document.getElementById('descuento_temporal').value = 0;
    document.getElementById('importe').value = monto;
    document.getElementById('tipo_cobro').value = 'NORMAL';
    document.getElementById('es_parcial').checked = false;
    actualizarParcial();
    aplicarDescuentoSorteo();

    // Quick amounts: monto completo, mitad
    const qa = document.getElementById('quick-amounts');
    qa.innerHTML = '';
    [
      {label:'Total ' + fmt(monto), val: monto},
      {label:'Mitad ' + fmt(Math.round(monto/2)), val: Math.round(monto/2)}
    ].forEach(o => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'quick-amount'; b.textContent = o.label;
      b.onclick = () => {
        document.getElementById('importe').value = o.val;
        if (esParcial()) {
          document.getElementById('descuento_temporal').value = 0;
        } else {
          document.getElementById('descuento_temporal').value = Math.max(0, monto - o.val);
        }
        sincronizarTipoCobro();
        actualizarParcialHint();
      };
      qa.appendChild(b);
    });

    document.getElementById('form-cobro').classList.add('visible');

    // Poblar sección "Modificar inscripción"
    poblarSelectPlanes(a.plan);
    document.getElementById('mod-descuento').value = a.descuento_libre || 0;
    document.getElementById('mod-vencimiento').value = a.dia_vencimiento || '';
    document.getElementById('panel-modificar').classList.add('visible');
    document.getElementById('panel-prorrateo').classList.add('visible');

    // Cargar pagos recientes
    await cargarPagosRecientes(a.inscripcion_id);

    document.getElementById('panel-alumno').scrollIntoView({behavior:'smooth', block:'start'});
  }

  // Helpers de pago parcial
  function esParcial(){
    const cb = document.getElementById('es_parcial');
    return !!(cb && cb.checked);
  }
  // Precio del plan según el mes que se imputa: desde el mes del aumento usa el nuevo; antes, el de lista.
  function mesImputadoSel(){
    const el = document.getElementById('mes_imputado');
    return el ? el.value : '';
  }
  function precioBaseMes(a, mes){
    if (a && a.valor_nuevo != null && a.aumento_desde && mes && (mes + '-01') >= a.aumento_desde) return a.valor_nuevo;
    return a ? (a.valor_lista || 0) : 0;
  }
  function montoAlumno(){
    if (!alumnoSel) return 0;
    return Math.max(0, precioBaseMes(alumnoSel, mesImputadoSel()) - (alumnoSel.descuento_libre || 0));
  }
  // Muestra cuánto queda debiendo (sólo en modo parcial)
  function actualizarParcialHint(){
    const hint = document.getElementById('parcial-hint');
    if (!hint) return;
    if (!esParcial() || !alumnoSel){ hint.style.display = 'none'; return; }
    const monto = montoAlumno();
    const imp = parseFloat(document.getElementById('importe').value) || 0;
    const saldo = Math.max(0, Math.round(monto - imp));
    if (imp <= 0){
      hint.style.display = 'none';
    } else if (saldo > 0){
      hint.style.display = 'block';
      hint.style.color = '#b45309';
      hint.textContent = `🟠 Queda debiendo ${fmt(saldo)} — se guarda como SALDO PENDIENTE (no es descuento).`;
    } else {
      hint.style.display = 'block';
      hint.style.color = '#166534';
      hint.textContent = `✅ Cubre el mes completo (${fmt(monto)}). No queda saldo.`;
    }
  }
  // Activa/desactiva el modo parcial: oculta el descuento y fuerza tipo NORMAL.
  function actualizarParcial(){
    const inputDesc = document.getElementById('descuento_temporal');
    const fgDesc = document.getElementById('fg-descuento');
    const grid = document.getElementById('grid-monto');
    const lblImporte = document.getElementById('lbl-importe');
    const tipoSel = document.getElementById('tipo_cobro');
    if (esParcial()){
      // En parcial, lo que NO paga es deuda, no descuento → ocultamos el descuento.
      inputDesc.value = 0;
      if (fgDesc) fgDesc.style.display = 'none';
      if (grid) grid.style.gridTemplateColumns = '1fr';
      if (lblImporte) lblImporte.textContent = 'Importe que paga ahora';
      if (tipoSel.value !== 'CORTESIA') tipoSel.value = 'NORMAL';
    } else {
      if (fgDesc) fgDesc.style.display = '';
      if (grid) grid.style.gridTemplateColumns = '';
      if (lblImporte) lblImporte.textContent = 'Importe a cobrar';
      // Al salir de parcial, recalcular descuento según importe actual
      if (alumnoSel){
        const imp = parseFloat(document.getElementById('importe').value) || 0;
        inputDesc.value = Math.max(0, montoAlumno() - imp);
      }
      sincronizarTipoCobro();
    }
    actualizarParcialHint();
  }

  // Recalcular importe cuando cambia el descuento temporal
  function setupDescuentoTemporal(){
    const inputDesc = document.getElementById('descuento_temporal');
    const inputImp = document.getElementById('importe');
    const cbParcial = document.getElementById('es_parcial');

    if (cbParcial) cbParcial.addEventListener('change', actualizarParcial);

    inputDesc.addEventListener('input', () => {
      if (!alumnoSel || esParcial()) return;
      const monto = montoAlumno();
      const desc = Math.max(0, parseFloat(inputDesc.value) || 0);
      inputImp.value = Math.max(0, monto - desc);
      sincronizarTipoCobro();
    });

    inputImp.addEventListener('input', () => {
      if (!alumnoSel) return;
      if (esParcial()){
        // En parcial NO tocamos el descuento; lo no pagado queda como saldo.
        actualizarParcialHint();
        return;
      }
      const monto = montoAlumno();
      const imp = parseFloat(inputImp.value) || 0;
      const desc = Math.max(0, monto - imp);
      inputDesc.value = desc;
      sincronizarTipoCobro();
    });
  }

  // 🎰 25% OFF del sorteo de cumpleaños: si el alumno ganó el descuento para
  // el mes que se está imputando, se precarga solo (descuento + importe + obs).
  // Si se cambia a un mes sin premio, se deshace solo (solo si lo puso esta función).
  const OBS_SORTEO = '🎂 25% OFF ganador sorteo cumpleañeros';
  function aplicarDescuentoSorteo(){
    const hint = document.getElementById('sorteo-hint');
    if (!alumnoSel){ if (hint) hint.style.display = 'none'; return; }
    const mes = document.getElementById('mes_imputado').value;
    const gana = descSorteo.has(alumnoSel.persona_id + '|' + mes);
    const monto = montoAlumno();
    const obs = document.getElementById('observaciones');
    if (gana && !esParcial()){
      const desc = Math.round(monto * 0.25);
      document.getElementById('descuento_temporal').value = desc;
      document.getElementById('importe').value = monto - desc;
      sincronizarTipoCobro();
      if (obs && !obs.value.includes(OBS_SORTEO)) obs.value = (obs.value ? obs.value + ' · ' : '') + OBS_SORTEO;
      if (hint){
        hint.style.display = 'block';
        hint.textContent = '🎰 Ganó el sorteo de cumpleañeros: la cuota de este mes va con 25% OFF (ya precargado: paga ' + fmt(monto - desc) + ').';
      }
    } else {
      // Deshacer SOLO si el precargado vino del sorteo (lo delata la observación)
      if (obs && obs.value.includes(OBS_SORTEO)){
        obs.value = obs.value.replace(' · ' + OBS_SORTEO, '').replace(OBS_SORTEO, '').trim();
        if (!esParcial()){
          document.getElementById('descuento_temporal').value = 0;
          document.getElementById('importe').value = monto;
          sincronizarTipoCobro();
        }
      }
      if (hint) hint.style.display = 'none';
    }
  }

  function sincronizarTipoCobro(){
    const desc = parseFloat(document.getElementById('descuento_temporal').value) || 0;
    const imp = parseFloat(document.getElementById('importe').value) || 0;
    const tipoSel = document.getElementById('tipo_cobro');
    // Sólo auto-cambiamos si el usuario no eligió CORTESIA manualmente
    if (tipoSel.value === 'CORTESIA') return;
    // En pago parcial el cobro es NORMAL (lo no pagado es deuda, no descuento)
    if (esParcial()){ tipoSel.value = 'NORMAL'; return; }
    if (imp === 0) tipoSel.value = 'CORTESIA';
    else if (desc > 0) tipoSel.value = 'MANUAL';
    else tipoSel.value = 'NORMAL';
  }

  function setupActualizar(){
    document.getElementById('btn-actualizar').addEventListener('click', async () => {

      const btn = document.getElementById('btn-actualizar');
      btn.disabled = true; btn.textContent = 'Guardando...';

        plan: nuevoPlan,
        descuento_libre: nuevoDesc,

      }).eq('id', alumnoSel.inscripcion_id);

      alumnoSel.valor_lista = tar ? tar.valor_lista : alumnoSel.valor_lista;
      alumnoSel.dia_vencimiento = nuevoVenc;

      const idx = alumnos.findIndex(a => a.inscripcion_id === alumnoSel.inscripcion_id);

  // === Prorrateo cambio de fecha ===
  function toggleProrrateo(){
    const c = document.getElementById('pro-content');
    const arrow = document.getElementById('pro-arrow');
    if (c.style.display === 'none'){
      c.style.display = 'block';
      arrow.textContent = '▴';
      inicializarFechasProrrateo();
    } else {
      c.style.display = 'none';
      arrow.textContent = '▾';
    }
  }

  function inicializarFechasProrrateo(){
    if (!alumnoSel || !alumnoSel.dia_vencimiento) return;
    // Calcular próximo vencimiento del alumno
    const hoy = new Date();
    const dia = alumnoSel.dia_vencimiento;
    let prox = new Date(hoy.getFullYear(), hoy.getMonth(), dia);
    if (prox <= hoy) {
      // ya pasó este mes, usar próximo mes
      prox = new Date(hoy.getFullYear(), hoy.getMonth() + 1, dia);
    }
    const yyyy = prox.getFullYear();
    const mm = String(prox.getMonth()+1).padStart(2,'0');
    const dd = String(prox.getDate()).padStart(2,'0');
    document.getElementById('pro-desde').value = `${yyyy}-${mm}-${dd}`;
    document.getElementById('pro-hasta').value = '';
    document.getElementById('pro-calc').style.display = 'none';
  }

  function setupProrrateo(){
    const desdeInp = document.getElementById('pro-desde');
    const hastaInp = document.getElementById('pro-hasta');
    desdeInp.addEventListener('change', calcularProrrateo);
    hastaInp.addEventListener('change', calcularProrrateo);
    document.querySelectorAll('input[name="pro-opcion"]').forEach(r => {
      r.addEventListener('change', actualizarTotalProrrateo);
    });
    document.getElementById('btn-prorratear').addEventListener('click', aplicarProrrateo);
  }

  function calcularProrrateo(){
    if (!alumnoSel) return;
    const desdeStr = document.getElementById('pro-desde').value;
    const hastaStr = document.getElementById('pro-hasta').value;
    if (!desdeStr || !hastaStr) { document.getElementById('pro-calc').style.display = 'none'; return; }

    const [yD,mD,dD] = desdeStr.split('-').map(Number);
    const [yH,mH,dH] = hastaStr.split('-').map(Number);
    const desde = new Date(yD, mD-1, dD);
    const hasta = new Date(yH, mH-1, dH);

    if (hasta <= desde){
      msg('La nueva fecha tiene que ser POSTERIOR a la actual', 'error', 'pro-message');
      document.getElementById('pro-calc').style.display = 'none';
      return;
    }

    const dias = Math.round((hasta - desde) / (1000*60*60*24));
    const monto = alumnoSel.valor_lista - alumnoSel.descuento_libre;
    // Días reales del mes del vencimiento actual (desde)
    const diasMes = new Date(yD, mD, 0).getDate(); // último día del mes
    const valorDia = monto / diasMes;
    const proporcional = Math.round(valorDia * dias);

    document.getElementById('pro-dias').textContent = `${dias} días`;
    document.getElementById('pro-val-dia').textContent = fmt(Math.round(valorDia)) + ` (mes /${diasMes})`;
    document.getElementById('pro-prop').textContent = fmt(proporcional);

    document.getElementById('opt-solo-label').textContent = `Solo proporcional · ${fmt(proporcional)}`;
    document.getElementById('opt-adelanto-label').textContent = `Proporcional + Mes siguiente completo · ${fmt(proporcional + monto)}`;

    document.getElementById('pro-calc').style.display = 'block';
    actualizarTotalProrrateo();
  }

  function actualizarTotalProrrateo(){
    if (!alumnoSel) return;
    const propText = document.getElementById('pro-prop').textContent || '$0';
    const prop = parseInt(propText.replace(/[^0-9]/g,'')) || 0;
    const monto = alumnoSel.valor_lista - alumnoSel.descuento_libre;
    const opcion = document.querySelector('input[name="pro-opcion"]:checked').value;
    const total = opcion === 'solo' ? prop : prop + monto;
    document.getElementById('pro-total').value = total;
  }

  async function aplicarProrrateo(){
    if (!alumnoSel) return;
    const desdeStr = document.getElementById('pro-desde').value;
    const hastaStr = document.getElementById('pro-hasta').value;
    if (!desdeStr || !hastaStr){ msg('Falta completar fechas', 'error', 'pro-message'); return; }

    const [yD,mD,dD] = desdeStr.split('-').map(Number);
    const [yH,mH,dH] = hastaStr.split('-').map(Number);
    const desde = new Date(yD, mD-1, dD);
    const hasta = new Date(yH, mH-1, dH);
    const dias = Math.round((hasta - desde) / (1000*60*60*24));
    const monto = alumnoSel.valor_lista - alumnoSel.descuento_libre;
    const diasMes = new Date(yD, mD, 0).getDate();
    const valorDia = monto / diasMes;
    const proporcional = Math.round(valorDia * dias);
    const opcion = document.querySelector('input[name="pro-opcion"]:checked').value;
    const medio = document.getElementById('pro-medio').value;
    const nuevoDia = hasta.getDate();
    const diaActual = alumnoSel.dia_vencimiento;
    const mesDesde = `${yD}-${String(mD).padStart(2,'0')}`;
    const mesHasta = `${yH}-${String(mH).padStart(2,'0')}`;
    const hoy = new Date().toISOString().substring(0,10);

    const btn = document.getElementById('btn-prorratear');
    btn.disabled = true; btn.textContent = 'Procesando...';

    try {
      // 1) UPDATE día de vencimiento
      const upd = await sb.from('inscripciones_tf').update({
        dia_vencimiento: nuevoDia
      }).eq('id', alumnoSel.inscripcion_id);
      if (upd.error) throw upd.error;

      // 2) INSERT pago proporcional
      const obsBase = `Prorrateo ${dias} días: cambio venc día ${diaActual} → día ${nuevoDia}`;
      const pago1 = await sb.from('pagos_tf').insert({
        inscripcion_id: alumnoSel.inscripcion_id,
        mes_imputado: mesDesde,
        fecha: hoy,
        importe: proporcional,
        medio: medio,
        tipo_cobro: 'MANUAL',
        descuento_temporal: 0,
        observaciones: obsBase + ' (proporcional)',
        cargado_por: CARGADO_POR
      });
      if (pago1.error) throw pago1.error;

      // 3) Si adelanto: INSERT mes siguiente
      if (opcion === 'adelanto'){
        const pago2 = await sb.from('pagos_tf').insert({
          inscripcion_id: alumnoSel.inscripcion_id,
          mes_imputado: mesHasta,
          fecha: hoy,
          importe: monto,
          medio: medio,
          tipo_cobro: 'NORMAL',
          descuento_temporal: 0,
          observaciones: obsBase + ' (mes adelantado)',
          cargado_por: CARGADO_POR
        });
        if (pago2.error) throw pago2.error;
      }

      // Actualizar cache local
      alumnoSel.dia_vencimiento = nuevoDia;
      const idx = alumnos.findIndex(a => a.inscripcion_id === alumnoSel.inscripcion_id);
      if (idx >= 0) alumnos[idx].dia_vencimiento = nuevoDia;

      msg(`✅ Cambio aplicado · ${opcion === 'adelanto' ? 'Cobrados 2 pagos' : 'Cobrado proporcional'}`, 'success', 'pro-message');

      // Cerrar y refrescar
      setTimeout(() => {
        document.getElementById('pro-content').style.display = 'none';
        document.getElementById('pro-arrow').textContent = '▾';
        seleccionar(alumnoSel);
      }, 1800);

    } catch(e){
      msg('Error: ' + (e.message || e), 'error', 'pro-message');
    }
    btn.disabled = false; btn.textContent = 'Aplicar cambio de vencimiento + Cobrar';
  }

  async function cargarPagosRecientes(inscripcion_id){
    const lista = document.getElementById('pagos-list');
    lista.innerHTML = '<div class="pagos-empty">Cargando...</div>';
    document.getElementById('panel-pagos').classList.add('visible');

    const { data, error } = await sb
      .from('pagos_tf')
      .select('fecha, importe, medio, mes_imputado, tipo_cobro, observaciones')
      .eq('inscripcion_id', inscripcion_id)
      .order('fecha', {ascending:false})
      .limit(6);

    if (error){ lista.innerHTML = '<div class="pagos-empty">Error al cargar pagos</div>'; return; }

    if (!data || data.length === 0){
      lista.innerHTML = '<div class="pagos-empty">No hay pagos registrados todavía</div>';
      return;
    }

    lista.innerHTML = '';
    data.forEach(p => {
      const div = document.createElement('div');
      div.className = 'pago-line';
      const fecha = new Date(p.fecha+'T00:00:00').toLocaleDateString('es-AR');
      div.innerHTML = `
        <span class="pago-info">${fecha} · ${p.medio} · imputa ${monthLabel(p.mes_imputado)}</span>
        <span class="pago-monto">${fmt(p.importe)}</span>
      `;
      lista.appendChild(div);
    });
  }

  function setupSubmit(){
    document.getElementById('btn-cobrar').addEventListener('click', async () => {
      if (!alumnoSel){ msg('Primero seleccioná un alumno', 'error'); return; }
      const importe = parseFloat(document.getElementById('importe').value);
      if (!importe || importe <= 0){ msg('El importe tiene que ser mayor a 0', 'error'); return; }

      const parcial = esParcial();
      const monto = montoAlumno();
      const saldo = Math.max(0, Math.round(monto - importe));
      const obsManual = (document.getElementById('observaciones').value || '').trim();

      // En parcial: lo no pagado es DEUDA (no descuento). Si no queda saldo, no es parcial.
      let descuentoTemp, tipoCobro, observaciones;
      if (parcial){
        if (saldo <= 0){
          msg('El importe cubre todo el mes: destildá "Es pago parcial" o cobrá el total.', 'error');
          return;
        }
        descuentoTemp = 0;
        tipoCobro = 'NORMAL';
        // Formato que lee el sistema de morosos: empieza con PARCIAL y trae saldo=NNN (entero, sin separadores)
        observaciones = `PARCIAL · pagó ${fmt(importe)} · saldo=${saldo}` + (obsManual ? ` — ${obsManual}` : '');
      } else {
        descuentoTemp = parseFloat(document.getElementById('descuento_temporal').value) || 0;
        tipoCobro = document.getElementById('tipo_cobro').value;
        observaciones = obsManual || null;
      }

      const btn = document.getElementById('btn-cobrar');
      btn.disabled = true; btn.textContent = 'Guardando...';

      const hoy = new Date().toISOString().substring(0,10);
      const { error } = await sb.from('pagos_tf').insert({
        inscripcion_id: alumnoSel.inscripcion_id,
        mes_imputado: document.getElementById('mes_imputado').value,
        fecha: hoy,
        importe: importe,
        medio: document.getElementById('medio').value,
        tipo_cobro: tipoCobro,
        descuento_temporal: descuentoTemp,
        observaciones: observaciones,
        cargado_por: CARGADO_POR
      });

      btn.disabled = false; btn.textContent = 'Registrar cobro';

      if (error){ msg('Error al guardar: ' + error.message, 'error'); return; }

      const nombreOk = alumnoSel.nombre;
      const importeOk = fmt(importe);
      msg(parcial
        ? `✅ Parcial registrado: ${importeOk} de ${nombreOk} · queda debiendo ${fmt(saldo)}`
        : `✅ Cobro registrado: ${importeOk} de ${nombreOk}`, 'success');

      setTimeout(resetForm, 1500);
    });
  }

  function msg(texto, tipo, destinoId){
    const el = document.getElementById(destinoId || 'message');
    el.textContent = texto;
    el.className = 'message visible ' + tipo;
    if (tipo === 'success') setTimeout(() => el.classList.remove('visible'), 4000);
  }

  init();
</script>
</body>
</html>
