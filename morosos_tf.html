<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>PuntoBiO — Morosos · Terapia Física</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --azul: #1e9fe0; --azul-soft: #dbeafe;
    --bg: #f8fafc; --bg-card: #ffffff; --bg-hover: #f1f5f9; --border: #e5e7eb;
    --text: #0f172a; --text-dim: #64748b;
    --rojo: #dc2626; --rojo-soft: #fee2e2;
    --naranja: #d97706; --naranja-soft: #fef3c7;
    --verde: #16a34a; --verde-soft: #dcfce7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; padding: 20px; }
  h1 { color: var(--azul); margin-bottom: 20px; font-size: 22px; }
  .controles { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 20px; }
  select, input, textarea { background: var(--bg-card); color: var(--text); border: 1px solid var(--border); padding: 8px 12px; border-radius: 6px; font-size: 14px; font-family: inherit; }
  select:focus, input:focus, textarea:focus { outline: none; border-color: var(--azul); }
  label { color: var(--text-dim); font-size: 13px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .card-label { color: var(--text-dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .card-value { font-size: 24px; font-weight: 600; color: var(--text); }
  .card.rojo { border-color: var(--rojo); } .card.rojo .card-value { color: var(--rojo); }
  .card.naranja { border-color: var(--naranja); } .card.naranja .card-value { color: var(--naranja); }
  .card-sub { font-size: 11px; color: var(--text-dim); margin-top: 4px; }
  .filtros { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .filtro-btn { background: var(--bg-card); color: var(--text-dim); border: 1px solid var(--border); padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 13px; transition: all 0.15s; }
  .filtro-btn:hover { background: var(--bg-hover); }
  .filtro-btn.active { background: var(--azul-soft); color: var(--azul); border-color: var(--azul); }
  .resumen { color: var(--text-dim); font-size: 13px; margin-bottom: 12px; }
  table { width: 100%; border-collapse: collapse; background: var(--bg-card); border-radius: 10px; overflow: hidden; }
  thead { background: #f8fafc; }
  th { padding: 12px; text-align: left; color: var(--text-dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
  th.right { text-align: right; }
  td { padding: 12px; border-top: 1px solid var(--border); }
  td.right { text-align: right; font-variant-numeric: tabular-nums; }
  tr.row:hover { background: var(--bg-hover); }
  .alumno-id { color: var(--text-dim); font-size: 11px; margin-left: 6px; }
  .badge { padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; display: inline-block; }
  .badge.rojo { background: var(--rojo-soft); color: var(--rojo); }
  .badge.naranja { background: var(--naranja-soft); color: var(--naranja); }
  .badge.gris { background: #e5e7eb; color: var(--text-dim); }
  .empty, .loading { text-align: center; padding: 40px; color: var(--text-dim); }
  .monto-rojo { color: var(--rojo); font-weight: 600; }
  .monto-naranja { color: var(--naranja); font-weight: 600; }
  .total-row { background: #f8fafc; font-weight: 600; }
  .total-row td { border-top: 2px solid var(--azul); }
  .center { text-align: center; }
  .acciones-cell { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .btn-accion { border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; transition: all 0.15s; white-space: nowrap; }
  .btn-cobrar { background: var(--verde); color: white; }
  .btn-cobrar:hover { background: #1ea14c; }
  .btn-baja { background: var(--rojo-soft); color: var(--rojo); border: 1px solid var(--rojo); }
  .btn-baja:hover { background: var(--rojo); color: white; }
  .btn-wa { background: var(--azul-soft); color: var(--azul); border: 1px solid var(--azul); }
  .btn-wa:hover { background: var(--azul); color: white; }
  .btn-copy { background: var(--bg-hover); color: var(--text-dim); border: 1px solid var(--border); }
  .btn-copy:hover { background: #e2e8f0; color: var(--text); }
  .modal-backdrop { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.5); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
  .modal-backdrop.activo { display: flex; }
  .modal { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(15, 23, 42, 0.15); }
  .modal-header { padding: 18px 22px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .modal-title { font-size: 16px; font-weight: 600; }
  .modal-title-cobrar { color: var(--verde); }
  .modal-title-baja { color: var(--rojo); }
  .modal-close { background: none; border: none; color: var(--text-dim); font-size: 22px; cursor: pointer; padding: 0; line-height: 1; }
  .modal-close:hover { color: var(--text); }
  .modal-body { padding: 22px; }
  .modal-info { background: var(--bg); border-radius: 8px; padding: 12px 14px; margin-bottom: 18px; font-size: 13px; color: var(--text-dim); border-left: 3px solid var(--azul); }
  .modal-info strong { color: var(--text); font-weight: 600; }
  .modal-warning { background: #fef2f2; border-radius: 8px; padding: 12px 14px; margin-bottom: 18px; font-size: 12px; color: var(--text-dim); border-left: 3px solid var(--rojo); line-height: 1.6; }
  .modal-warning strong { color: var(--rojo); font-weight: 600; display: block; margin-bottom: 4px; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; margin-bottom: 6px; font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }
  .form-group input, .form-group select, .form-group textarea { width: 100%; }
  .form-group textarea { resize: vertical; min-height: 60px; }
  .form-hint { font-size: 11px; color: var(--text-dim); margin-top: 4px; }
  .form-hint.warning { color: var(--naranja); }
  .modal-footer { padding: 16px 22px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }
  .btn-modal { border: none; padding: 9px 18px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; transition: all 0.15s; }
  .btn-cancelar { background: var(--bg-hover); color: var(--text); border: 1px solid var(--border); }
  .btn-cancelar:hover { background: #e2e8f0; }
  .btn-confirmar-cobro { background: var(--verde); color: white; }
  .btn-confirmar-cobro:hover { background: #1ea14c; }
  .btn-confirmar-baja { background: var(--rojo); color: white; }
  .btn-confirmar-baja:hover { background: #d63b3b; }
  .btn-modal:disabled { opacity: 0.5; cursor: not-allowed; }
  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--bg-card); border: 1px solid var(--verde); color: var(--text); padding: 14px 18px; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); display: none; z-index: 2000; max-width: 320px; font-size: 14px; }
  .toast.activo { display: block; }
  .toast.error { border-color: var(--rojo); }
</style>
</head>
<body>

<h1>⚠️ Morosos · Terapia Física</h1>

<div class="controles">
  <label>Mes a controlar:</label>
  <select id="selectMes"></select>
  <span style="color:var(--text-dim); font-size:13px;">| Cálculo al día de hoy: <span id="hoyTexto"></span></span>
</div>

<div class="cards" id="cards"></div>

<div class="filtros">
  <button class="filtro-btn active" data-filtro="todos">Todos los morosos</button>
  <button class="filtro-btn" data-filtro="primer">🟡 Primer aviso (2-6 días)</button>
  <button class="filtro-btn" data-filtro="segundo">🔴 Segundo aviso (7+ días)</button>
  <button class="filtro-btn" data-filtro="recien">Recién vencidos (0-1 días)</button>
</div>

<div class="resumen" id="resumen"></div>
<div id="tabla-wrap"></div>

<div class="modal-backdrop" id="modalCobrar">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title modal-title-cobrar">💵 Registrar cobro</span>
      <button class="modal-close" onclick="cerrarModal('modalCobrar')">×</button>
    </div>
    <div class="modal-body">
      <div class="modal-info" id="cobrarInfo"></div>
      <div class="form-group"><label>Importe a cobrar</label><input type="number" id="cobrarImporte" step="500" min="0"><div class="form-hint" id="cobrarHint"></div></div>
      <div class="form-group"><label>Mes a imputar</label><select id="cobrarMesImputado"></select></div>
      <div class="form-group"><label>Medio de pago</label><select id="cobrarMedio"><option value="EFECTIVO">Efectivo</option><option value="TRANSFERENCIA" selected>Transferencia</option><option value="DEBITO">Débito</option></select></div>
      <div class="form-group" style="background:#fef3c7;border:1px solid #d97706;border-radius:8px;padding:10px 12px;">
        <label style="display:flex;align-items:center;gap:8px;color:#92400e;cursor:pointer;font-weight:600;">
          <input type="checkbox" id="cobrarParcial" style="width:16px;height:16px;cursor:pointer;" onchange="togglePagoParcial()">
          Pago parcial (queda saldo pendiente)
        </label>
        <div id="cobrarParcialBox" style="display:none;margin-top:8px;">
          <label style="color:#92400e;">Saldo que queda debiendo</label>
          <input type="number" id="cobrarSaldoPendiente" step="500" min="0" placeholder="0" style="width:100%;margin-top:4px;">
          <div class="form-hint" id="cobrarParcialHint" style="color:#92400e;"></div>
        </div>
      </div>
      <div class="form-group"><label>Observaciones (opcional)</label><textarea id="cobrarObs" placeholder="Notas sobre el cobro..."></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn-modal btn-cancelar" onclick="cerrarModal('modalCobrar')">Cancelar</button>
      <button class="btn-modal btn-confirmar-cobro" id="btnConfirmarCobro" onclick="confirmarCobro()">Confirmar cobro</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="modalBaja">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title modal-title-baja">❌ Dar de baja</span>
      <button class="modal-close" onclick="cerrarModal('modalBaja')">×</button>
    </div>
    <div class="modal-body">
      <div class="modal-info" id="bajaInfo"></div>
      <div class="modal-warning">
        <strong>⚠️ Esta acción va a:</strong>
        1. Cambiar el estado de la inscripción a <strong style="color:var(--rojo)">BAJA</strong><br>
        2. Liberar todos los turnos asignados al alumno<br>
        3. Sacarlo de la lista de morosos (la deuda deja de reclamarse)
      </div>
      <div class="form-group"><label>Motivo de la baja</label><select id="bajaMotivo">
        <option value="FALTA_PAGO">Falta de pago — sin respuesta a avisos</option>
        <option value="RENUNCIA">Renuncia voluntaria</option>
        <option value="CAMBIO_LUGAR">Cambio a otro lugar</option>
        <option value="SALUD">Problema de salud</option>
        <option value="OTRO">Otro</option>
      </select></div>
      <div class="form-group"><label>Detalle / Observación <span id="bajaObligatorio" style="color:var(--naranja); display:none;">(obligatorio)</span></label><textarea id="bajaObs" placeholder="Detalle adicional (opcional)..."></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn-modal btn-cancelar" onclick="cerrarModal('modalBaja')">Cancelar</button>
      <button class="btn-modal btn-confirmar-baja" id="btnConfirmarBaja" onclick="confirmarBaja()">Confirmar baja</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
  const supa = createClient('https://bqpjtoiictnzcasxfucf.supabase.co', 'sb_publishable_yvuXDxrkRrhXwmZBnE_a_Q_zDBz0iDi');
  const $ = (id) => document.getElementById(id);
  const fmt = (n) => '$' + Math.round(n).toLocaleString('es-AR');

  let inscripciones = [], pagos = [], tarifario = {};
  let filtroActivo = 'todos', mesActual, inscripcionEnAccion = null;

  function calcMesActual() {
    const hoy = new Date();
    return `${hoy.getFullYear()}-${String(hoy.getMonth() + 1).padStart(2, '0')}`;
  }
  function mesAnterior(mes) {
    let [y, m] = mes.split('-').map(Number);
    m--; if (m === 0) { m = 12; y--; }
    return `${y}-${String(m).padStart(2, '0')}`;
  }
  function nombreMes(mes) {
    const [y, m] = mes.split('-').map(Number);
    const meses = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
    return `${meses[m - 1]} ${y}`;
  }
  function nombreMesSolo(mes) {
    const [y, m] = mes.split('-').map(Number);
    const meses = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
    return meses[m - 1];
  }
  function capitalizar(s) {
    if (!s) return '';
    return s.split(' ').map(p => p.charAt(0).toUpperCase() + p.slice(1).toLowerCase()).join(' ');
  }
  function formatearTel(telRaw) {
    if (!telRaw) return '';
    let tel = String(telRaw).replace(/\D/g, '');
    if (!tel) return '';
    if (tel.startsWith('0')) tel = tel.slice(1);
    if (tel.startsWith('15')) tel = tel.slice(2);
    if (!tel.startsWith('54')) tel = '54' + tel;
    if (!tel.startsWith('549')) tel = '549' + tel.slice(2);
    return tel;
  }

  function poblarSelectorMes() {
    const sel = $('selectMes');
    const hoy = new Date();
    const opts = [];
    for (let i = -2; i <= 1; i++) {
      const d = new Date(hoy.getFullYear(), hoy.getMonth() + i, 1);
      const mes = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
      const etiqueta = nombreMes(mes) + (i === 0 ? ' (este mes)' : i === -1 ? ' (mes anterior)' : '');
      opts.push(`<option value="${mes}">${etiqueta}</option>`);
    }
    sel.innerHTML = opts.join('');
    sel.value = calcMesActual();
    mesActual = sel.value;
  }

  async function cargarTodo() {
    $('tabla-wrap').innerHTML = '<div class="loading">Cargando...</div>';
    const mesAnt = mesAnterior(mesActual);
    const [insR, pagR, tarR] = await Promise.all([
      supa.from('inscripciones_tf').select('id, persona_id, plan, actividad, descuento_libre, dia_vencimiento, estado, fecha_alta, fecha_reingreso').eq('estado', 'ACTIVO').neq('plan', 'COD0BON'),
      supa.from('pagos_tf').select('inscripcion_id, mes_imputado, importe, descuento_temporal, tipo_cobro, observaciones').in('mes_imputado', [mesActual, mesAnt]),
      supa.from('tarifario_tf').select('plan, actividad, valor_lista')
    ]);
    if (insR.error || pagR.error || tarR.error) {
      $('tabla-wrap').innerHTML = '<div class="empty">❌ Error: ' + (insR.error?.message || pagR.error?.message || tarR.error?.message) + '</div>';
      return;
    }
    inscripciones = insR.data || [];
    pagos = pagR.data || [];
    tarifario = {};
    (tarR.data || []).forEach(t => { tarifario[`${t.plan}__${t.actividad}`] = Number(t.valor_lista); });
    const ids = [...new Set(inscripciones.map(i => i.persona_id))];
    if (ids.length) {
      const { data: pers } = await supa.from('personas').select('*').in('id', ids);
      const mapPers = {};
      (pers || []).forEach(p => { mapPers[p.id] = p; });
      inscripciones.forEach(i => {
        const p = mapPers[i.persona_id] || {};
        i.nombre = p.nombre || `(sin nombre ID ${i.persona_id})`;
        i.telefono = p.telefono || p.celular || p.tel || p.phone || '';
      });
    }
    render();
  }

  // Un pago se considera PARCIAL (deja saldo) si sus observaciones empiezan con "PARCIAL".
  // Ese texto lo escribe el modal de cobro cuando se tilda "pago parcial", e incluye el saldo: "PARCIAL|saldo=65000|..."
  function saldoParcial(p) {
    const obs = (p.observaciones || '').trim();
    if (!obs.toUpperCase().startsWith('PARCIAL')) return null;
    const m = obs.match(/saldo=(\d+)/i);
    return m ? Number(m[1]) : 0;
  }

  // mes: el mes a evaluar. montoMensual: cuota actual del plan. esMesAnterior: true para meses ya pasados.
  // Para meses YA PASADOS, un pago NORMAL (no parcial) salda el mes sin importar el monto,
  // porque ese pago se cobró en su momento con el plan que la persona tenía entonces.
  // Esto evita deudas falsas cuando alguien cambió de plan (la cuota de hoy != la de ese mes).
  // Si el pago se marcó como PARCIAL, se respeta el saldo que quedó debiendo.
  function calcularDeudaMes(inscripcionId, mes, montoMensual, esMesAnterior) {
    const pagosMes = pagos.filter(p => p.inscripcion_id === inscripcionId && p.mes_imputado === mes);
    if (pagosMes.length === 0) return { pagado: 0, descuento: 0, cortesia: false, debe: montoMensual };
    const cortesia = pagosMes.some(p => p.tipo_cobro === 'CORTESIA');
    if (cortesia) return { pagado: 0, descuento: 0, cortesia: true, debe: 0 };
    const pagado = pagosMes.reduce((s, p) => s + Number(p.importe || 0), 0);
    const descuento = pagosMes.reduce((s, p) => s + Number(p.descuento_temporal || 0), 0);
    // ¿Hay algún pago marcado como parcial este mes?
    const saldosParciales = pagosMes.map(saldoParcial).filter(s => s !== null);
    if (saldosParciales.length > 0) {
      // Pago parcial explícito: debe el saldo que se cargó al cobrar.
      const debeParcial = saldosParciales.reduce((s, v) => s + v, 0);
      return { pagado, descuento, cortesia: false, debe: Math.max(0, debeParcial) };
    }
    if (esMesAnterior) {
      // Mes pasado con pago NORMAL y sin marca de parcial => saldado (pagó lo de su plan de entonces).
      return { pagado, descuento, cortesia: false, debe: 0 };
    }
    // Mes en curso: se calcula contra la cuota actual del plan (que es la correcta para hoy).
    return { pagado, descuento, cortesia: false, debe: Math.max(0, montoMensual - pagado - descuento) };
  }

  function clasificar(insc) {
    const precio = tarifario[`${insc.plan}__${insc.actividad}`] || 0;
    const montoMensual = Math.max(0, precio - Number(insc.descuento_libre || 0));
    const fechaInicioStr = insc.fecha_reingreso || insc.fecha_alta;
    const fechaInicio = fechaInicioStr ? new Date(fechaInicioStr + 'T00:00:00') : null;
    function debeEseMes(mesStr) {
      if (!fechaInicio) return true;
      const [y, m] = mesStr.split('-').map(Number);
      const ultDiaMes = new Date(y, m, 0);
      return fechaInicio <= ultDiaMes;
    }
    const deudaActual = debeEseMes(mesActual) ? calcularDeudaMes(insc.id, mesActual, montoMensual, false) : { pagado: 0, descuento: 0, cortesia: false, debe: 0 };
    const deudaAnt = debeEseMes(mesAnterior(mesActual)) ? calcularDeudaMes(insc.id, mesAnterior(mesActual), montoMensual, true) : { pagado: 0, descuento: 0, cortesia: false, debe: 0 };
    const hoy = new Date();
    const esMesEnCurso = mesActual === calcMesActual();
    const yaVencioMesActual = esMesEnCurso ? hoy.getDate() > Number(insc.dia_vencimiento || 1) : true;
    const debeActual = yaVencioMesActual ? deudaActual.debe : 0;
    const debeArrastre = deudaAnt.debe;
    const debeTotal = debeActual + debeArrastre;
    let diasVencido = 0;
    if (debeArrastre > 0) {
      const [y, m] = mesActual.split('-').map(Number);
      let mesAntN = m - 1, anioAnt = y;
      if (mesAntN === 0) { mesAntN = 12; anioAnt--; }
      let vencDate = new Date(anioAnt, mesAntN - 1, Number(insc.dia_vencimiento || 1));
      if (fechaInicio && fechaInicio > vencDate) vencDate = fechaInicio;
      diasVencido = Math.floor((hoy - vencDate) / 86400000);
    } else if (debeActual > 0) {
      const [y, m] = mesActual.split('-').map(Number);
      let vencDate = new Date(y, m - 1, Number(insc.dia_vencimiento || 1));
      if (fechaInicio && fechaInicio > vencDate) vencDate = fechaInicio;
      diasVencido = Math.floor((hoy - vencDate) / 86400000);
    }
    let bucket;
    if (diasVencido <= 1) bucket = 'recien';
    else if (diasVencido <= 6) bucket = 'primer_aviso';
    else bucket = 'segundo_aviso';
    const mesAdeudadoMasViejo = debeArrastre > 0 ? mesAnterior(mesActual) : mesActual;
    const montoMesAdeudado = debeArrastre > 0 ? debeArrastre : debeActual;
    return { ...insc, precio, montoMensual, deudaActual, deudaAnt, debeActual, debeArrastre, debeTotal, yaVencioMesActual, diasVencido, bucket, fechaInicio, mesAdeudadoMasViejo, montoMesAdeudado };
  }

  function render() {
    const clasif = inscripciones.map(clasificar).filter(c => c.debeTotal > 0);
    let visibles;
    if (filtroActivo === 'todos') visibles = clasif;
    else if (filtroActivo === 'primer') visibles = clasif.filter(c => c.bucket === 'primer_aviso');
    else if (filtroActivo === 'segundo') visibles = clasif.filter(c => c.bucket === 'segundo_aviso');
    else if (filtroActivo === 'recien') visibles = clasif.filter(c => c.bucket === 'recien');

    const totalMorosos = clasif.length;
    const totalAdeudado = clasif.reduce((s, c) => s + c.debeTotal, 0);
    const cantPrimer = clasif.filter(c => c.bucket === 'primer_aviso').length;
    const cantSegundo = clasif.filter(c => c.bucket === 'segundo_aviso').length;
    const cantRecien = clasif.filter(c => c.bucket === 'recien').length;
    const montoPrimer = clasif.filter(c => c.bucket === 'primer_aviso').reduce((s,c) => s + c.debeTotal, 0);
    const montoSegundo = clasif.filter(c => c.bucket === 'segundo_aviso').reduce((s,c) => s + c.debeTotal, 0);

    $('cards').innerHTML = `
      <div class="card"><div class="card-label">Total morosos</div><div class="card-value">${totalMorosos}</div><div class="card-sub">${fmt(totalAdeudado)} adeudado total</div></div>
      <div class="card naranja"><div class="card-label">🟡 Primer aviso</div><div class="card-value">${cantPrimer}</div><div class="card-sub">${fmt(montoPrimer)} · vencidos 2-6 días</div></div>
      <div class="card rojo"><div class="card-label">🔴 Segundo aviso</div><div class="card-value">${cantSegundo}</div><div class="card-sub">${fmt(montoSegundo)} · vencidos 7+ días</div></div>
      <div class="card"><div class="card-label">Recién vencidos</div><div class="card-value">${cantRecien}</div><div class="card-sub">0-1 días · no enviar todavía</div></div>
    `;
    $('hoyTexto').textContent = new Date().toLocaleDateString('es-AR');
    $('resumen').textContent = `Mostrando ${visibles.length} de ${clasif.length} morosos`;

    if (visibles.length === 0) {
      $('tabla-wrap').innerHTML = '<div class="empty">🎉 No hay morosos con este filtro</div>';
      return;
    }
    visibles.sort((a, b) => b.diasVencido - a.diasVencido);
    window._morososCache = {};
    visibles.forEach(c => { window._morososCache[c.id] = c; });
    window._mensajes = {};
    visibles.forEach(c => { window._mensajes[c.id] = armarMensaje(c); });

    const filas = visibles.map(c => {
      let badge;
      if (c.bucket === 'segundo_aviso') badge = '<span class="badge rojo">🔴 SEGUNDO AVISO</span>';
      else if (c.bucket === 'primer_aviso') badge = '<span class="badge naranja">🟡 PRIMER AVISO</span>';
      else badge = '<span class="badge gris">Recién vencido</span>';
      const tel = formatearTel(c.telefono);
      const btnWA = c.bucket === 'recien' ? '' :
        (tel ? `<button class="btn-accion btn-wa" onclick="abrirWA(${c.id})" title="Enviar a ${c.telefono}">💬 WA</button>` :
               `<button class="btn-accion btn-copy" onclick="copiarMsg(${c.id})" title="Sin teléfono · copiar mensaje">📋 Copiar</button>`);
      const acciones = `<div class="acciones-cell">
        <button class="btn-accion btn-cobrar" onclick="abrirCobro(${c.id})" title="Registrar cobro">💵 Cobrar</button>
        <button class="btn-accion btn-baja" onclick="abrirBaja(${c.id})" title="Dar de baja al alumno">❌ Dar de baja</button>
        ${btnWA}
      </div>`;
      return `<tr class="row">
        <td><strong>${c.nombre}</strong> <span class="alumno-id">#${c.persona_id}</span></td>
        <td>${c.plan}</td>
        <td class="right">Día ${c.dia_vencimiento}</td>
        <td class="right"><strong class="${c.bucket === 'segundo_aviso' ? 'monto-rojo' : c.bucket === 'primer_aviso' ? 'monto-naranja' : ''}">${c.diasVencido} días</strong></td>
        <td class="right">${fmt(c.montoMensual)}</td>
        <td class="right"><strong class="monto-rojo">${fmt(c.debeTotal)}</strong></td>
        <td>${badge}</td>
        <td>${acciones}</td>
      </tr>`;
    }).join('');
    const totalVisibles = visibles.reduce((s, c) => s + c.debeTotal, 0);
    $('tabla-wrap').innerHTML = `<table>
      <thead><tr>
        <th>Alumno</th><th>Plan</th><th class="right">Vencimiento</th><th class="right">Días vencido</th>
        <th class="right">Cuota mensual</th><th class="right">TOTAL DEUDA</th><th>Estado</th><th class="center">Acciones</th>
      </tr></thead>
      <tbody>${filas}<tr class="total-row"><td colspan="5"><strong>TOTAL VISIBLE</strong></td><td class="right monto-rojo">${fmt(totalVisibles)}</td><td colspan="2"></td></tr></tbody>
    </table>`;
  }

  function armarMensaje(c) {
    const mesAdeudado = c.debeArrastre > 0 ? mesAnterior(mesActual) : mesActual;
    const monto = c.debeArrastre > 0 ? c.debeArrastre : c.debeActual;
    const monto10 = Math.round(monto * 1.10);
    const mesTexto = nombreMesSolo(mesAdeudado);
    const primerNombre = capitalizar((c.nombre || '').split(' ')[0]);
    if (c.bucket === 'segundo_aviso') {
      return `Hola ${primerNombre}! Nos comunicamos de PuntoBiO porque tu mensualidad del mes de ${mesTexto} (${fmt(monto)}) venció el día ${c.dia_vencimiento} de ${mesTexto} y a la fecha sigue pendiente.\nAl haber pasado más de 7 días desde el vencimiento, se aplica un recargo del 10% sobre el total.\nPor ende el total a pagar es de ${fmt(monto10)}\nDe no recibir respuesta procederemos a dar de baja los turnos asignados.\nEn caso de abonar con transferencia te pedimos que nos envíes el comprobante para que impacte el pago en nuestros sistemas.\nSaludos\nAdministracion PuntoBiO`;
    }
    return `Hola ${primerNombre}! Nos comunicamos de PuntoBiO para recordarte que tu mensualidad del mes de ${mesTexto} (${fmt(monto)}) venció el día ${c.dia_vencimiento} de ${mesTexto} y todavía figura pendiente.\nTe recordamos que en caso de no abonar dentro de los 7 días posteriores al vencimiento, se aplicará un recargo del 10% sobre el total. De no recibir respuesta procederemos a dar de baja los turnos asignados.\nEn caso de abonar con transferencia te pedimos que nos envíes el comprobante para que impacte el pago en nuestros sistemas.\nSaludos\nAdministracion PuntoBiO`;
  }

  window.abrirWA = function(inscripcionId) {
    const c = inscripciones.find(i => i.id === inscripcionId);
    if (!c) return;
    const tel = formatearTel(c.telefono);
    const msg = window._mensajes[inscripcionId];
    if (!tel) { copiarMsg(inscripcionId); return; }
    window.open(`https://wa.me/${tel}?text=${encodeURIComponent(msg)}`, '_blank');
  };
  window.copiarMsg = function(inscripcionId) {
    const msg = window._mensajes[inscripcionId];
    if (!msg) return;
    navigator.clipboard.writeText(msg).then(() => mostrarToast('✓ Mensaje copiado al portapapeles')).catch(() => prompt('Copiá este mensaje:', msg));
  };

  window.abrirCobro = function(inscripcionId) {
    const c = window._morososCache[inscripcionId];
    if (!c) return;
    inscripcionEnAccion = c;
    const monto = c.montoMesAdeudado;
    const conRecargo = c.bucket === 'segundo_aviso';
    const sugerencia = conRecargo ? Math.round(monto * 1.10) : monto;
    $('cobrarInfo').innerHTML = `<strong>${c.nombre}</strong> · ${c.plan}<br>Cuota mensual: ${fmt(c.montoMensual)} · Deuda total: ${fmt(c.debeTotal)} · ${c.diasVencido} días vencido`;
    $('cobrarImporte').value = sugerencia;
    if (conRecargo) {
      $('cobrarHint').innerHTML = `Sugerencia: ${fmt(monto)} + 10% recargo por +7 días = <strong>${fmt(sugerencia)}</strong>`;
      $('cobrarHint').className = 'form-hint warning';
    } else {
      $('cobrarHint').innerHTML = `Sugerencia: cuota del mes adeudado = <strong>${fmt(sugerencia)}</strong>`;
      $('cobrarHint').className = 'form-hint';
    }
    const opciones = [];
    if (c.debeArrastre > 0) {
      opciones.push(`<option value="${mesAnterior(mesActual)}" selected>${nombreMes(mesAnterior(mesActual))} (atrasado)</option>`);
      opciones.push(`<option value="${mesActual}">${nombreMes(mesActual)}</option>`);
    } else {
      opciones.push(`<option value="${mesActual}" selected>${nombreMes(mesActual)}</option>`);
    }
    $('cobrarMesImputado').innerHTML = opciones.join('');
    $('cobrarMedio').value = 'TRANSFERENCIA';
    $('cobrarObs').value = '';
    $('cobrarParcial').checked = false;
    $('cobrarSaldoPendiente').value = '';
    $('cobrarParcialBox').style.display = 'none';
    $('cobrarParcialHint').textContent = '';
    $('modalCobrar').classList.add('activo');
    setTimeout(() => $('cobrarImporte').focus(), 50);
  };

  window.togglePagoParcial = function() {
    const on = $('cobrarParcial').checked;
    $('cobrarParcialBox').style.display = on ? 'block' : 'none';
    if (on && inscripcionEnAccion) {
      const c = inscripcionEnAccion;
      const importe = Number($('cobrarImporte').value || 0);
      // Saldo sugerido = lo que el sistema cree que debe ese mes, menos lo que se está cobrando ahora.
      const cuotaMes = c.montoMensual || 0;
      const saldoSug = Math.max(0, cuotaMes - importe);
      $('cobrarSaldoPendiente').value = saldoSug;
      $('cobrarParcialHint').textContent = `Cuota del mes: ${fmt(cuotaMes)}. Cobrando ${fmt(importe)}, queda ${fmt(saldoSug)}.`;
    }
  };

  window.confirmarCobro = async function() {
    if (!inscripcionEnAccion) return;
    const c = inscripcionEnAccion;
    const importe = Number($('cobrarImporte').value || 0);
    if (!importe || importe <= 0) { mostrarToast('El importe debe ser mayor a 0', 'error'); return; }
    const esParcial = $('cobrarParcial').checked;
    const obsManual = $('cobrarObs').value.trim();
    let observaciones = obsManual || null;
    if (esParcial) {
      const saldo = Number($('cobrarSaldoPendiente').value || 0);
      if (!saldo || saldo <= 0) { mostrarToast('Cargá el saldo que queda debiendo', 'error'); return; }
      // La marca PARCIAL|saldo=XXXX la lee el cálculo de morosos para mantener la deuda.
      observaciones = `PARCIAL|saldo=${saldo}` + (obsManual ? ' | ' + obsManual : '');
    }
    const btn = $('btnConfirmarCobro');
    btn.disabled = true; btn.textContent = 'Guardando...';
    const { error } = await supa.from('pagos_tf').insert({
      inscripcion_id: c.id,
      mes_imputado: $('cobrarMesImputado').value,
      fecha: new Date().toISOString().slice(0, 10),
      importe: importe,
      medio: $('cobrarMedio').value,
      tipo_cobro: 'NORMAL',
      observaciones: observaciones
    });
    btn.disabled = false; btn.textContent = 'Confirmar cobro';
    if (error) { mostrarToast('❌ Error: ' + error.message, 'error'); return; }
    cerrarModal('modalCobrar');
    mostrarToast(`✅ Cobro de ${fmt(importe)} registrado a ${c.nombre}`);
    inscripcionEnAccion = null;
    await cargarTodo();
  };

  window.abrirBaja = function(inscripcionId) {
    const c = window._morososCache[inscripcionId];
    if (!c) return;
    inscripcionEnAccion = c;
    $('bajaInfo').innerHTML = `<strong>${c.nombre}</strong> · ${c.plan}<br>${c.diasVencido} días vencido · Deuda total: ${fmt(c.debeTotal)}`;
    $('bajaMotivo').value = 'FALTA_PAGO';
    $('bajaObs').value = '';
    $('bajaObligatorio').style.display = 'none';
    $('modalBaja').classList.add('activo');
  };

  document.addEventListener('change', (e) => {
    if (e.target.id === 'bajaMotivo') {
      $('bajaObligatorio').style.display = e.target.value === 'OTRO' ? 'inline' : 'none';
    }
  });

  window.confirmarBaja = async function() {
    if (!inscripcionEnAccion) return;
    const c = inscripcionEnAccion;
    const motivo = $('bajaMotivo').value;
    const obs = $('bajaObs').value.trim();
    if (motivo === 'OTRO' && !obs) { mostrarToast('Si elegís "Otro", la observación es obligatoria', 'error'); return; }
    const etiquetas = {
      'FALTA_PAGO': 'Falta de pago - sin respuesta a avisos',
      'RENUNCIA': 'Renuncia voluntaria',
      'CAMBIO_LUGAR': 'Cambio a otro lugar',
      'SALUD': 'Problema de salud',
      'OTRO': 'Otro'
    };
    const motivoFinal = etiquetas[motivo] + (obs ? ': ' + obs : '');
    const hoy = new Date().toISOString().slice(0, 10);
    const btn = $('btnConfirmarBaja');
    btn.disabled = true; btn.textContent = 'Procesando...';

    const { error: errInsc } = await supa.from('inscripciones_tf')
      .update({ estado: 'BAJA', fecha_baja: hoy, motivo_baja: motivoFinal })
      .eq('id', c.id);
    if (errInsc) {
      btn.disabled = false; btn.textContent = 'Confirmar baja';
      mostrarToast('❌ Error al dar de baja: ' + errInsc.message, 'error');
      return;
    }

    const { error: errTurnos, count: turnosLib } = await supa.from('turno_alumnos')
      .update({ activo: false }, { count: 'exact' })
      .eq('persona_id', c.persona_id)
      .eq('activo', true);

    btn.disabled = false; btn.textContent = 'Confirmar baja';
    if (errTurnos) {
      mostrarToast(`⚠️ Inscripción dada de baja, pero error al liberar turnos: ${errTurnos.message}`, 'error');
    } else {
      const turnosTexto = turnosLib ? ` y ${turnosLib} turno(s) liberado(s)` : '';
      mostrarToast(`✅ ${c.nombre} dado de baja${turnosTexto}`);
    }
    cerrarModal('modalBaja');
    inscripcionEnAccion = null;
    await cargarTodo();
  };

  window.cerrarModal = function(id) {
    $(id).classList.remove('activo');
    inscripcionEnAccion = null;
  };

  document.querySelectorAll('.modal-backdrop').forEach(b => {
    b.addEventListener('click', (e) => { if (e.target === b) cerrarModal(b.id); });
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') document.querySelectorAll('.modal-backdrop.activo').forEach(b => cerrarModal(b.id));
  });

  function mostrarToast(mensaje, tipo = 'success') {
    const t = $('toast');
    t.textContent = mensaje;
    t.className = 'toast activo' + (tipo === 'error' ? ' error' : '');
    setTimeout(() => { t.classList.remove('activo'); }, 3500);
  }
  window.mostrarToast = mostrarToast;

  $('selectMes').addEventListener('change', (e) => { mesActual = e.target.value; cargarTodo(); });
  document.querySelectorAll('.filtro-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filtroActivo = btn.dataset.filtro;
      render();
    });
  });

  poblarSelectorMes();
  cargarTodo();
</script>

</body>
</html>
