<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>PuntoBiO — Morosos · Terapia Física</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --azul: #1e9fe0;
    --azul-soft: rgba(30,159,224,0.15);
    --bg: #111;
    --bg-card: #1a1a1a;
    --bg-hover: #222;
    --border: #2a2a2a;
    --text: #e8e8e8;
    --text-dim: #888;
    --rojo: #ef4444;
    --rojo-soft: rgba(239,68,68,0.15);
    --naranja: #f59e0b;
    --naranja-soft: rgba(245,158,11,0.15);
    --verde: #22c55e;
    --verde-soft: rgba(34,197,94,0.15);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; padding: 20px; }
  h1 { color: var(--azul); margin-bottom: 20px; font-size: 22px; }
  .controles { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 20px; }
  select, input, textarea { background: var(--bg-card); color: var(--text); border: 1px solid var(--border); padding: 8px 12px; border-radius: 6px; font-size: 14px; font-family: inherit; }
  select:focus, input:focus, textarea:focus { outline: none; border-color: var(--azul); }
  label { color: var(--text-dim); font-size: 13px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .card-label { color: var(--text-dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .card-value { font-size: 24px; font-weight: 600; color: var(--text); }
  .card.rojo { border-color: var(--rojo); }
  .card.rojo .card-value { color: var(--rojo); }
  .card.naranja { border-color: var(--naranja); }
  .card.naranja .card-value { color: var(--naranja); }
  .card-sub { font-size: 11px; color: var(--text-dim); margin-top: 4px; }
  .filtros { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .filtro-btn { background: var(--bg-card); color: var(--text-dim); border: 1px solid var(--border); padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 13px; transition: all 0.15s; }
  .filtro-btn:hover { background: var(--bg-hover); }
  .filtro-btn.active { background: var(--azul-soft); color: var(--azul); border-color: var(--azul); }
  .resumen { color: var(--text-dim); font-size: 13px; margin-bottom: 12px; }
  table { width: 100%; border-collapse: collapse; background: var(--bg-card); border-radius: 10px; overflow: hidden; }
  thead { background: #1f1f1f; }
  th { padding: 12px; text-align: left; color: var(--text-dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
  th.right { text-align: right; }
  td { padding: 12px; border-top: 1px solid var(--border); }
  td.right { text-align: right; font-variant-numeric: tabular-nums; }
  tr.row { cursor: pointer; }
  tr.row:hover { background: var(--bg-hover); }
  .alumno-id { color: var(--text-dim); font-size: 11px; margin-left: 6px; }
  .badge { padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; display: inline-block; }
  .badge.rojo { background: var(--rojo-soft); color: var(--rojo); }
  .badge.naranja { background: var(--naranja-soft); color: var(--naranja); }
  .badge.verde { background: var(--verde-soft); color: var(--verde); }
  .badge.gris { background: #2a2a2a; color: var(--text-dim); }
  .empty { text-align: center; padding: 40px; color: var(--text-dim); }
  .loading { text-align: center; padding: 40px; color: var(--text-dim); }
  .monto-rojo { color: var(--rojo); font-weight: 600; }
  .monto-naranja { color: var(--naranja); font-weight: 600; }
  .total-row { background: #1f1f1f; font-weight: 600; }
  .total-row td { border-top: 2px solid var(--azul); }
  .center { text-align: center; }
  /* Botones de acción */
  .acciones-cell { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .btn-accion {
    border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer;
    font-size: 12px; font-weight: 600; transition: all 0.15s;
    white-space: nowrap; display: inline-flex; align-items: center; gap: 4px;
  }
  .btn-cobrar { background: var(--verde); color: white; }
  .btn-cobrar:hover { background: #1ea14c; }
  .btn-sin-cobro { background: var(--bg-hover); color: var(--text); border: 1px solid var(--border); }
  .btn-sin-cobro:hover { background: #333; border-color: var(--text-dim); }
  .btn-wa { background: #25D366; color: white; }
  .btn-wa:hover { background: #1ea952; }
  .btn-copy { background: var(--bg-hover); color: var(--text-dim); border: 1px solid var(--border); }
  .btn-copy:hover { background: #333; color: var(--text); }
  /* Modal */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    display: none; align-items: center; justify-content: center;
    z-index: 1000; padding: 20px;
  }
  .modal-backdrop.activo { display: flex; }
  .modal {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
    width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .modal-header {
    padding: 18px 22px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
  }
  .modal-title { font-size: 16px; font-weight: 600; color: var(--text); }
  .modal-title-cobrar { color: var(--verde); }
  .modal-title-sin-cobro { color: var(--azul); }
  .modal-close {
    background: none; border: none; color: var(--text-dim); font-size: 22px;
    cursor: pointer; padding: 0; line-height: 1; transition: color 0.15s;
  }
  .modal-close:hover { color: var(--text); }
  .modal-body { padding: 22px; }
  .modal-info {
    background: var(--bg); border-radius: 8px; padding: 12px 14px;
    margin-bottom: 18px; font-size: 13px; color: var(--text-dim);
    border-left: 3px solid var(--azul);
  }
  .modal-info strong { color: var(--text); font-weight: 600; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; margin-bottom: 6px; font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }
  .form-group input, .form-group select, .form-group textarea { width: 100%; }
  .form-group textarea { resize: vertical; min-height: 60px; font-family: inherit; }
  .form-hint { font-size: 11px; color: var(--text-dim); margin-top: 4px; }
  .form-hint.warning { color: var(--naranja); }
  .modal-footer {
    padding: 16px 22px; border-top: 1px solid var(--border);
    display: flex; justify-content: flex-end; gap: 10px;
  }
  .btn-modal {
    border: none; padding: 9px 18px; border-radius: 6px; cursor: pointer;
    font-size: 14px; font-weight: 600; transition: all 0.15s;
  }
  .btn-cancelar { background: var(--bg-hover); color: var(--text); border: 1px solid var(--border); }
  .btn-cancelar:hover { background: #333; }
  .btn-confirmar-cobro { background: var(--verde); color: white; }
  .btn-confirmar-cobro:hover { background: #1ea14c; }
  .btn-confirmar-sin-cobro { background: var(--azul); color: white; }
  .btn-confirmar-sin-cobro:hover { background: #178cc5; }
  .btn-modal:disabled { opacity: 0.5; cursor: not-allowed; }
  /* Toast */
  .toast {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--bg-card); border: 1px solid var(--verde);
    color: var(--text); padding: 14px 18px; border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    display: none; z-index: 2000; max-width: 320px;
    font-size: 14px; animation: slideIn 0.25s ease-out;
  }
  .toast.activo { display: block; }
  .toast.error { border-color: var(--rojo); }
  @keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
</style>
</head>
<body>

<h1>⚠️ Morosos · Terapia Física</h1>

<div class="controles">
  <label>Mes a controlar:</label>
  <select id="selectMes"></select>
  <span style="color:var(--text-dim); font-size:13px;">| Cálculo al día de hoy: <span id="hoyTexto"></span></span>
</div>

<div class="cards" id="cards"></div>

<div class="filtros">
  <button class="filtro-btn active" data-filtro="todos">Todos los morosos</button>
  <button class="filtro-btn" data-filtro="primer">🟡 Primer aviso (2-6 días)</button>
  <button class="filtro-btn" data-filtro="segundo">🔴 Segundo aviso (7+ días)</button>
  <button class="filtro-btn" data-filtro="recien">Recién vencidos (0-1 días)</button>
</div>

<div class="resumen" id="resumen"></div>

<div id="tabla-wrap"></div>

<!-- MODAL COBRAR -->
<div class="modal-backdrop" id="modalCobrar">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title modal-title-cobrar">💵 Registrar cobro</span>
      <button class="modal-close" onclick="cerrarModal('modalCobrar')">×</button>
    </div>
    <div class="modal-body">
      <div class="modal-info" id="cobrarInfo"></div>
      <div class="form-group">
        <label>Importe a cobrar</label>
        <input type="number" id="cobrarImporte" step="500" min="0">
        <div class="form-hint" id="cobrarHint"></div>
      </div>
      <div class="form-group">
        <label>Mes a imputar</label>
        <select id="cobrarMesImputado"></select>
      </div>
      <div class="form-group">
        <label>Medio de pago</label>
        <select id="cobrarMedio">
          <option value="EFECTIVO">Efectivo</option>
          <option value="TRANSFERENCIA" selected>Transferencia</option>
          <option value="DEBITO">Débito</option>
        </select>
      </div>
      <div class="form-group">
        <label>Observaciones (opcional)</label>
        <textarea id="cobrarObs" placeholder="Notas sobre el cobro..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-modal btn-cancelar" onclick="cerrarModal('modalCobrar')">Cancelar</button>
      <button class="btn-modal btn-confirmar-cobro" id="btnConfirmarCobro" onclick="confirmarCobro()">Confirmar cobro</button>
    </div>
  </div>
</div>

<!-- MODAL SIN COBRO -->
<div class="modal-backdrop" id="modalSinCobro">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title modal-title-sin-cobro">🚫 Marcar sin cobro</span>
      <button class="modal-close" onclick="cerrarModal('modalSinCobro')">×</button>
    </div>
    <div class="modal-body">
      <div class="modal-info" id="sinCobroInfo"></div>
      <div class="form-group">
        <label>Motivo</label>
        <select id="sinCobroMotivo">
          <option value="CORTESIA">Cortesía / Bonificado (no se cobra)</option>
          <option value="ACUERDO">Acuerdo de pago especial</option>
          <option value="CUOTAS">Pago en cuotas (negociado)</option>
          <option value="BAJA_TEMP">Baja temporal con turnos activos</option>
          <option value="OTRO">Otro</option>
        </select>
      </div>
      <div class="form-group">
        <label>Mes a marcar</label>
        <select id="sinCobroMesImputado"></select>
      </div>
      <div class="form-group">
        <label>Detalle / Observación <span id="sinCobroObligatorio" style="color:var(--naranja); display:none;">(obligatorio)</span></label>
        <textarea id="sinCobroObs" placeholder="Detalle del motivo..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-modal btn-cancelar" onclick="cerrarModal('modalSinCobro')">Cancelar</button>
      <button class="btn-modal btn-confirmar-sin-cobro" id="btnConfirmarSinCobro" onclick="confirmarSinCobro()">Confirmar</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

  const supa = createClient(
    'https://bqpjtoiictnzcasxfucf.supabase.co',
    'sb_publishable_yvuXDxrkRrhXwmZBnE_a_Q_zDBz0iDi'
  );

  const $ = (id) => document.getElementById(id);
  const fmt = (n) => '$' + Math.round(n).toLocaleString('es-AR');

  // Estado
  let inscripciones = [];
  let pagos = [];
  let tarifario = {};
  let filtroActivo = 'todos';
  let mesActual; // 'YYYY-MM'
  let inscripcionEnAccion = null; // referencia al moroso activo en modal

  // ============ MES SELECTOR ============
  function calcMesActual() {
    const hoy = new Date();
    return `${hoy.getFullYear()}-${String(hoy.getMonth() + 1).padStart(2, '0')}`;
  }

  function mesAnterior(mes) {
    let [y, m] = mes.split('-').map(Number);
    m--;
    if (m === 0) { m = 12; y--; }
    return `${y}-${String(m).padStart(2, '0')}`;
  }

  function nombreMes(mes) {
    const [y, m] = mes.split('-').map(Number);
    const meses = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
    return `${meses[m - 1]} ${y}`;
  }

  function poblarSelectorMes() {
    const sel = $('selectMes');
    const hoy = new Date();
    const opts = [];
    for (let i = -2; i <= 1; i++) {
      const d = new Date(hoy.getFullYear(), hoy.getMonth() + i, 1);
      const mes = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
      const etiqueta = nombreMes(mes) + (i === 0 ? ' (este mes)' : i === -1 ? ' (mes anterior)' : '');
      opts.push(`<option value="${mes}">${etiqueta}</option>`);
    }
    sel.innerHTML = opts.join('');
    sel.value = calcMesActual();
    mesActual = sel.value;
  }

  // ============ CARGA DE DATOS ============
  async function cargarTodo() {
    $('tabla-wrap').innerHTML = '<div class="loading">Cargando...</div>';

    const mesAnt = mesAnterior(mesActual);

    const [insR, pagR, tarR] = await Promise.all([
      supa.from('inscripciones_tf')
        .select('id, persona_id, plan, actividad, descuento_libre, dia_vencimiento, estado, fecha_alta, fecha_reingreso')
        .eq('estado', 'ACTIVO')
        .neq('plan', 'COD0BON'),
      supa.from('pagos_tf')
        .select('inscripcion_id, mes_imputado, importe, descuento_temporal, tipo_cobro')
        .in('mes_imputado', [mesActual, mesAnt]),
      supa.from('tarifario_tf')
        .select('plan, actividad, valor_lista')
    ]);

    if (insR.error || pagR.error || tarR.error) {
      $('tabla-wrap').innerHTML = '<div class="empty">❌ Error: ' + (insR.error?.message || pagR.error?.message || tarR.error?.message) + '</div>';
      return;
    }

    inscripciones = insR.data || [];
    pagos = pagR.data || [];
    tarifario = {};
    (tarR.data || []).forEach(t => {
      tarifario[`${t.plan}__${t.actividad}`] = Number(t.valor_lista);
    });

    // Cargar nombres y teléfonos de personas
    const ids = [...new Set(inscripciones.map(i => i.persona_id))];
    if (ids.length) {
      const { data: pers } = await supa.from('personas').select('*').in('id', ids);
      const mapPers = {};
      (pers || []).forEach(p => { mapPers[p.id] = p; });
      inscripciones.forEach(i => {
        const p = mapPers[i.persona_id] || {};
        i.nombre = p.nombre || `(sin nombre ID ${i.persona_id})`;
        i.telefono = p.telefono || p.celular || p.tel || p.phone || '';
      });
    }

    render();
  }

  // ============ CÁLCULO ============
  function calcularDeudaMes(inscripcionId, mes, montoMensual) {
    const pagosMes = pagos.filter(p => p.inscripcion_id === inscripcionId && p.mes_imputado === mes);
    if (pagosMes.length === 0) {
      return { pagado: 0, descuento: 0, cortesia: false, debe: montoMensual };
    }
    const cortesia = pagosMes.some(p => p.tipo_cobro === 'CORTESIA');
    if (cortesia) return { pagado: 0, descuento: 0, cortesia: true, debe: 0 };
    const pagado = pagosMes.reduce((s, p) => s + Number(p.importe || 0), 0);
    const descuento = pagosMes.reduce((s, p) => s + Number(p.descuento_temporal || 0), 0);
    const debe = Math.max(0, montoMensual - pagado - descuento);
    return { pagado, descuento, cortesia: false, debe };
  }

  function clasificar(insc) {
    const precio = tarifario[`${insc.plan}__${insc.actividad}`] || 0;
    const montoMensual = Math.max(0, precio - Number(insc.descuento_libre || 0));

    // Fecha de inicio del cobro: reingreso si hay, sino alta
    const fechaInicioStr = insc.fecha_reingreso || insc.fecha_alta;
    const fechaInicio = fechaInicioStr ? new Date(fechaInicioStr + 'T00:00:00') : null;

    // Helper: si el alumno empezó DESPUÉS del último día del mes, no debe ese mes
    function debeEseMes(mesStr) {
      if (!fechaInicio) return true;
      const [y, m] = mesStr.split('-').map(Number);
      const ultDiaMes = new Date(y, m, 0); // último día del mes
      return fechaInicio <= ultDiaMes;
    }

    const deudaActual = debeEseMes(mesActual)
      ? calcularDeudaMes(insc.id, mesActual, montoMensual)
      : { pagado: 0, descuento: 0, cortesia: false, debe: 0 };
    const deudaAnt = debeEseMes(mesAnterior(mesActual))
      ? calcularDeudaMes(insc.id, mesAnterior(mesActual), montoMensual)
      : { pagado: 0, descuento: 0, cortesia: false, debe: 0 };

    const hoy = new Date();
    const esMesEnCurso = mesActual === calcMesActual();
    const yaVencioMesActual = esMesEnCurso
      ? hoy.getDate() > Number(insc.dia_vencimiento || 1)
      : true;

    const debeActual = yaVencioMesActual ? deudaActual.debe : 0;
    const debeArrastre = deudaAnt.debe;
    const debeTotal = debeActual + debeArrastre;

    // Calcular días vencido desde la fecha más antigua aplicable
    let diasVencido = 0;
    if (debeArrastre > 0) {
      const [y, m] = mesActual.split('-').map(Number);
      let mesAnt = m - 1, anioAnt = y;
      if (mesAnt === 0) { mesAnt = 12; anioAnt--; }
      let vencDate = new Date(anioAnt, mesAnt - 1, Number(insc.dia_vencimiento || 1));
      // Si el alumno empezó después del vencimiento del mes anterior, usar fecha_inicio
      if (fechaInicio && fechaInicio > vencDate) vencDate = fechaInicio;
      diasVencido = Math.floor((hoy - vencDate) / (1000 * 60 * 60 * 24));
    } else if (debeActual > 0) {
      const [y, m] = mesActual.split('-').map(Number);
      let vencDate = new Date(y, m - 1, Number(insc.dia_vencimiento || 1));
      if (fechaInicio && fechaInicio > vencDate) vencDate = fechaInicio;
      diasVencido = Math.floor((hoy - vencDate) / (1000 * 60 * 60 * 24));
    }

    let bucket;
    if (diasVencido <= 1) bucket = 'recien';
    else if (diasVencido <= 6) bucket = 'primer_aviso';
    else bucket = 'segundo_aviso';

    // Determinar el mes más antiguo adeudado (para sugerir en modales)
    const mesAdeudadoMasViejo = debeArrastre > 0 ? mesAnterior(mesActual) : mesActual;
    const montoMesAdeudado = debeArrastre > 0 ? debeArrastre : debeActual;

    return {
      ...insc,
      precio,
      montoMensual,
      deudaActual,
      deudaAnt,
      debeActual,
      debeArrastre,
      debeTotal,
      yaVencioMesActual,
      diasVencido,
      bucket,
      fechaInicio,
      mesAdeudadoMasViejo,
      montoMesAdeudado
    };
  }

  // ============ RENDER ============
  function render() {
    const clasif = inscripciones
      .map(clasificar)
      .filter(c => c.debeTotal > 0);

    // Filtro
    let visibles;
    if (filtroActivo === 'todos') visibles = clasif;
    else if (filtroActivo === 'primer') visibles = clasif.filter(c => c.bucket === 'primer_aviso');
    else if (filtroActivo === 'segundo') visibles = clasif.filter(c => c.bucket === 'segundo_aviso');
    else if (filtroActivo === 'recien') visibles = clasif.filter(c => c.bucket === 'recien');

    // Conteos por bucket
    const totalMorosos = clasif.length;
    const totalAdeudado = clasif.reduce((s, c) => s + c.debeTotal, 0);
    const cantPrimer = clasif.filter(c => c.bucket === 'primer_aviso').length;
    const cantSegundo = clasif.filter(c => c.bucket === 'segundo_aviso').length;
    const cantRecien = clasif.filter(c => c.bucket === 'recien').length;
    const montoPrimer = clasif.filter(c => c.bucket === 'primer_aviso').reduce((s,c) => s + c.debeTotal, 0);
    const montoSegundo = clasif.filter(c => c.bucket === 'segundo_aviso').reduce((s,c) => s + c.debeTotal, 0);

    $('cards').innerHTML = `
      <div class="card">
        <div class="card-label">Total morosos</div>
        <div class="card-value">${totalMorosos}</div>
        <div class="card-sub">${fmt(totalAdeudado)} adeudado total</div>
      </div>
      <div class="card naranja">
        <div class="card-label">🟡 Primer aviso</div>
        <div class="card-value">${cantPrimer}</div>
        <div class="card-sub">${fmt(montoPrimer)} · vencidos 2-6 días</div>
      </div>
      <div class="card rojo">
        <div class="card-label">🔴 Segundo aviso</div>
        <div class="card-value">${cantSegundo}</div>
        <div class="card-sub">${fmt(montoSegundo)} · vencidos 7+ días</div>
      </div>
      <div class="card">
        <div class="card-label">Recién vencidos</div>
        <div class="card-value">${cantRecien}</div>
        <div class="card-sub">0-1 días · no enviar todavía</div>
      </div>
    `;

    $('hoyTexto').textContent = new Date().toLocaleDateString('es-AR');
    $('resumen').textContent = `Mostrando ${visibles.length} de ${clasif.length} morosos`;

    // Tabla
    if (visibles.length === 0) {
      $('tabla-wrap').innerHTML = '<div class="empty">🎉 No hay morosos con este filtro</div>';
      return;
    }

    // Ordenar por diasVencido descendente (los más viejos primero)
    visibles.sort((a, b) => b.diasVencido - a.diasVencido);

    // Cache global para acceso desde modales
    window._morososCache = {};
    visibles.forEach(c => { window._morososCache[c.id] = c; });

    // Cache de mensajes WhatsApp
    window._mensajes = {};
    visibles.forEach(c => {
      window._mensajes[c.id] = armarMensaje(c);
    });

    const filas = visibles.map(c => {
      let badge;
      if (c.bucket === 'segundo_aviso') badge = '<span class="badge rojo">🔴 SEGUNDO AVISO</span>';
      else if (c.bucket === 'primer_aviso') badge = '<span class="badge naranja">🟡 PRIMER AVISO</span>';
      else badge = '<span class="badge gris">Recién vencido</span>';

      const tel = formatearTel(c.telefono);
      const btnWA = c.bucket === 'recien'
        ? '' // recién vencidos: no se envía WhatsApp todavía
        : (tel
          ? `<button class="btn-accion btn-wa" onclick="abrirWA(${c.id})" title="Enviar a ${c.telefono}">💬 WA</button>`
          : `<button class="btn-accion btn-copy" onclick="copiarMsg(${c.id})" title="Sin teléfono · copiar mensaje">📋 Copiar</button>`);

      const acciones = `
        <div class="acciones-cell">
          <button class="btn-accion btn-cobrar" onclick="abrirCobro(${c.id})" title="Registrar cobro">💵 Cobrar</button>
          <button class="btn-accion btn-sin-cobro" onclick="abrirSinCobro(${c.id})" title="Marcar sin cobro">🚫 Sin cobro</button>
          ${btnWA}
        </div>
      `;

      return `
        <tr class="row">
          <td><strong>${c.nombre}</strong> <span class="alumno-id">#${c.persona_id}</span></td>
          <td>${c.plan}</td>
          <td class="right">Día ${c.dia_vencimiento}</td>
          <td class="right"><strong class="${c.bucket === 'segundo_aviso' ? 'monto-rojo' : c.bucket === 'primer_aviso' ? 'monto-naranja' : ''}">${c.diasVencido} días</strong></td>
          <td class="right">${fmt(c.montoMensual)}</td>
          <td class="right"><strong class="monto-rojo">${fmt(c.debeTotal)}</strong></td>
          <td>${badge}</td>
          <td>${acciones}</td>
        </tr>
      `;
    }).join('');

    const totalVisibles = visibles.reduce((s, c) => s + c.debeTotal, 0);

    $('tabla-wrap').innerHTML = `
      <table>
        <thead>
          <tr>
            <th>Alumno</th>
            <th>Plan</th>
            <th class="right">Vencimiento</th>
            <th class="right">Días vencido</th>
            <th class="right">Cuota mensual</th>
            <th class="right">TOTAL DEUDA</th>
            <th>Estado</th>
            <th class="center">Acciones</th>
          </tr>
        </thead>
        <tbody>
          ${filas}
          <tr class="total-row">
            <td colspan="5"><strong>TOTAL VISIBLE</strong></td>
            <td class="right monto-rojo">${fmt(totalVisibles)}</td>
            <td colspan="2"></td>
          </tr>
        </tbody>
      </table>
    `;
  }

  // ============ MENSAJES WHATSAPP ============
  function capitalizar(s) {
    if (!s) return '';
    return s.split(' ').map(p => p.charAt(0).toUpperCase() + p.slice(1).toLowerCase()).join(' ');
  }

  function formatearTel(telRaw) {
    if (!telRaw) return '';
    let tel = String(telRaw).replace(/\D/g, '');
    if (!tel) return '';
    if (tel.startsWith('0')) tel = tel.slice(1);
    if (tel.startsWith('15')) tel = tel.slice(2);
    if (!tel.startsWith('54')) tel = '54' + tel;
    if (!tel.startsWith('549')) tel = '549' + tel.slice(2);
    return tel;
  }

  function nombreMesSolo(mes) {
    const [y, m] = mes.split('-').map(Number);
    const meses = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
    return meses[m - 1];
  }

  function armarMensaje(c) {
    const mesAdeudado = c.debeArrastre > 0 ? mesAnterior(mesActual) : mesActual;
    const monto = c.debeArrastre > 0 ? c.debeArrastre : c.debeActual;
    const monto10 = Math.round(monto * 1.10);
    const mesTexto = nombreMesSolo(mesAdeudado);
    const primerNombre = capitalizar((c.nombre || '').split(' ')[0]);

    if (c.bucket === 'segundo_aviso') {
      return `Hola ${primerNombre}! Nos comunicamos de PuntoBiO porque tu mensualidad del mes de ${mesTexto} (${fmt(monto)}) venció el día ${c.dia_vencimiento} de ${mesTexto} y a la fecha sigue pendiente.
Al haber pasado más de 7 días desde el vencimiento, se aplica un recargo del 10% sobre el total.
Por ende el total a pagar es de ${fmt(monto10)}
De no recibir respuesta procederemos a dar de baja los turnos asignados.
En caso de abonar con transferencia te pedimos que nos envíes el comprobante para que impacte el pago en nuestros sistemas.
Saludos
Administracion PuntoBiO`;
    }

    return `Hola ${primerNombre}! Nos comunicamos de PuntoBiO para recordarte que tu mensualidad del mes de ${mesTexto} (${fmt(monto)}) venció el día ${c.dia_vencimiento} de ${mesTexto} y todavía figura pendiente.
Te recordamos que en caso de no abonar dentro de los 7 días posteriores al vencimiento, se aplicará un recargo del 10% sobre el total. De no recibir respuesta procederemos a dar de baja los turnos asignados.
En caso de abonar con transferencia te pedimos que nos envíes el comprobante para que impacte el pago en nuestros sistemas.
Saludos
Administracion PuntoBiO`;
  }

  window.abrirWA = function(inscripcionId) {
    const c = inscripciones.find(i => i.id === inscripcionId);
    if (!c) return;
    const tel = formatearTel(c.telefono);
    const msg = window._mensajes[inscripcionId];
    if (!tel) {
      copiarMsg(inscripcionId);
      return;
    }
    const url = `https://wa.me/${tel}?text=${encodeURIComponent(msg)}`;
    window.open(url, '_blank');
  };

  window.copiarMsg = function(inscripcionId) {
    const msg = window._mensajes[inscripcionId];
    if (!msg) return;
    navigator.clipboard.writeText(msg).then(() => {
      mostrarToast('✓ Mensaje copiado al portapapeles');
    }).catch(() => {
      prompt('Copiá este mensaje:', msg);
    });
  };

  // ============ MODAL COBRAR ============
  window.abrirCobro = function(inscripcionId) {
    const c = window._morososCache[inscripcionId];
    if (!c) return;
    inscripcionEnAccion = c;

    // Sugerencia de importe
    const monto = c.montoMesAdeudado;
    const conRecargo = c.bucket === 'segundo_aviso';
    const sugerencia = conRecargo ? Math.round(monto * 1.10) : monto;

    // Poblar info
    $('cobrarInfo').innerHTML = `
      <strong>${c.nombre}</strong> · ${c.plan}<br>
      Cuota mensual: ${fmt(c.montoMensual)} · Deuda total: ${fmt(c.debeTotal)} · ${c.diasVencido} días vencido
    `;

    // Importe sugerido
    $('cobrarImporte').value = sugerencia;
    if (conRecargo) {
      $('cobrarHint').innerHTML = `Sugerencia: ${fmt(monto)} + 10% recargo por +7 días = <strong>${fmt(sugerencia)}</strong>`;
      $('cobrarHint').className = 'form-hint warning';
    } else {
      $('cobrarHint').innerHTML = `Sugerencia: cuota del mes adeudado = <strong>${fmt(sugerencia)}</strong>`;
      $('cobrarHint').className = 'form-hint';
    }

    // Mes a imputar: ofrecer el más antiguo adeudado + el actual
    const opciones = [];
    if (c.debeArrastre > 0) {
      opciones.push(`<option value="${mesAnterior(mesActual)}" selected>${nombreMes(mesAnterior(mesActual))} (atrasado)</option>`);
      opciones.push(`<option value="${mesActual}">${nombreMes(mesActual)}</option>`);
    } else {
      opciones.push(`<option value="${mesActual}" selected>${nombreMes(mesActual)}</option>`);
    }
    $('cobrarMesImputado').innerHTML = opciones.join('');

    // Reset medio y observaciones
    $('cobrarMedio').value = 'TRANSFERENCIA';
    $('cobrarObs').value = '';

    $('modalCobrar').classList.add('activo');
    setTimeout(() => $('cobrarImporte').focus(), 50);
  };

  window.confirmarCobro = async function() {
    if (!inscripcionEnAccion) return;
    const c = inscripcionEnAccion;
    const importe = Number($('cobrarImporte').value || 0);
    const mes = $('cobrarMesImputado').value;
    const medio = $('cobrarMedio').value;
    const obs = $('cobrarObs').value.trim() || null;

    if (!importe || importe <= 0) {
      mostrarToast('El importe debe ser mayor a 0', 'error');
      return;
    }

    const btn = $('btnConfirmarCobro');
    btn.disabled = true;
    btn.textContent = 'Guardando...';

    const { error } = await supa.from('pagos_tf').insert({
      inscripcion_id: c.id,
      mes_imputado: mes,
      fecha: new Date().toISOString().slice(0, 10),
      importe: importe,
      medio: medio,
      tipo_cobro: 'NORMAL',
      observaciones: obs
    });

    btn.disabled = false;
    btn.textContent = 'Confirmar cobro';

    if (error) {
      mostrarToast('❌ Error al guardar: ' + error.message, 'error');
      return;
    }

    cerrarModal('modalCobrar');
    mostrarToast(`✅ Cobro de ${fmt(importe)} registrado a ${c.nombre}`);
    inscripcionEnAccion = null;
    await cargarTodo();
  };

  // ============ MODAL SIN COBRO ============
  window.abrirSinCobro = function(inscripcionId) {
    const c = window._morososCache[inscripcionId];
    if (!c) return;
    inscripcionEnAccion = c;

    $('sinCobroInfo').innerHTML = `
      <strong>${c.nombre}</strong> · ${c.plan}<br>
      Vas a marcar como <strong>sin cobro</strong> el mes adeudado. El alumno saldrá de la lista de morosos.
    `;

    // Mes a marcar: el más antiguo adeudado
    const opciones = [];
    if (c.debeArrastre > 0) {
      opciones.push(`<option value="${mesAnterior(mesActual)}" selected>${nombreMes(mesAnterior(mesActual))} (atrasado)</option>`);
      opciones.push(`<option value="${mesActual}">${nombreMes(mesActual)}</option>`);
    } else {
      opciones.push(`<option value="${mesActual}" selected>${nombreMes(mesActual)}</option>`);
    }
    $('sinCobroMesImputado').innerHTML = opciones.join('');

    $('sinCobroMotivo').value = 'CORTESIA';
    $('sinCobroObs').value = '';
    $('sinCobroObligatorio').style.display = 'none';

    $('modalSinCobro').classList.add('activo');
  };

  // Validar campo obligatorio si motivo = OTRO
  document.addEventListener('change', (e) => {
    if (e.target.id === 'sinCobroMotivo') {
      const esOtro = e.target.value === 'OTRO';
      $('sinCobroObligatorio').style.display = esOtro ? 'inline' : 'none';
    }
  });

  window.confirmarSinCobro = async function() {
    if (!inscripcionEnAccion) return;
    const c = inscripcionEnAccion;
    const motivo = $('sinCobroMotivo').value;
    const mes = $('sinCobroMesImputado').value;
    const obs = $('sinCobroObs').value.trim();

    if (motivo === 'OTRO' && !obs) {
      mostrarToast('Si elegís "Otro", la observación es obligatoria', 'error');
      return;
    }

    const etiquetasMotivo = {
      'CORTESIA': 'Cortesía / Bonificado',
      'ACUERDO': 'Acuerdo de pago especial',
      'CUOTAS': 'Pago en cuotas negociado',
      'BAJA_TEMP': 'Baja temporal con turnos activos',
      'OTRO': 'Otro'
    };
    const observacionFinal = `SIN_COBRO [${etiquetasMotivo[motivo]}]${obs ? ': ' + obs : ''}`;

    const btn = $('btnConfirmarSinCobro');
    btn.disabled = true;
    btn.textContent = 'Guardando...';

    const { error } = await supa.from('pagos_tf').insert({
      inscripcion_id: c.id,
      mes_imputado: mes,
      fecha: new Date().toISOString().slice(0, 10),
      importe: 0,
      medio: 'EFECTIVO', // valor placeholder, no se usa
      tipo_cobro: 'CORTESIA', // clave: el módulo lee esto como deuda saldada
      observaciones: observacionFinal
    });

    btn.disabled = false;
    btn.textContent = 'Confirmar';

    if (error) {
      mostrarToast('❌ Error al guardar: ' + error.message, 'error');
      return;
    }

    cerrarModal('modalSinCobro');
    mostrarToast(`✅ ${c.nombre} marcado sin cobro (${etiquetasMotivo[motivo]})`);
    inscripcionEnAccion = null;
    await cargarTodo();
  };

  window.cerrarModal = function(id) {
    $(id).classList.remove('activo');
    inscripcionEnAccion = null;
  };

  // Cerrar modal con click en backdrop
  document.querySelectorAll('.modal-backdrop').forEach(b => {
    b.addEventListener('click', (e) => {
      if (e.target === b) cerrarModal(b.id);
    });
  });

  // Cerrar modal con ESC
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      document.querySelectorAll('.modal-backdrop.activo').forEach(b => cerrarModal(b.id));
    }
  });

  // ============ TOAST ============
  function mostrarToast(mensaje, tipo = 'success') {
    const t = $('toast');
    t.textContent = mensaje;
    t.className = 'toast activo' + (tipo === 'error' ? ' error' : '');
    setTimeout(() => { t.classList.remove('activo'); }, 3500);
  }
  window.mostrarToast = mostrarToast;

  // ============ EVENTOS ============
  $('selectMes').addEventListener('change', (e) => {
    mesActual = e.target.value;
    cargarTodo();
  });

  document.querySelectorAll('.filtro-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filtroActivo = btn.dataset.filtro;
      render();
    });
  });

  // ============ INIT ============
  poblarSelectorMes();
  cargarTodo();
</script>

</body>
</html>
