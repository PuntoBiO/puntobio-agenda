<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrenamiento en casa · PuntoBiO</title>
<style>
  :root{ --bg:#f6f8fb; --panel:#fff; --border:#e2e8f0; --txt:#0f172a; --sub:#64748b; --azul:#2563eb; --verde:#16a34a; --rojo:#dc2626; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--txt);padding:22px 26px 90px}
  h1{font-size:22px;color:var(--azul)}
  .sub{font-size:13px;color:var(--sub);margin:2px 0 16px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:14px}
  label.tit{display:block;font-size:12px;font-weight:800;color:var(--sub);text-transform:uppercase;letter-spacing:.4px;margin:10px 0 5px}
  input[type=text], textarea{width:100%;border:1px solid #cbd5e1;border-radius:9px;padding:9px 12px;font-family:inherit;font-size:13.5px;background:#fff}
  textarea{min-height:110px;resize:vertical}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
  .chip{background:#dbeafe;color:#1d4ed8;border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:800;display:inline-flex;align-items:center;gap:6px}
  .chip .x{cursor:pointer;font-weight:900}
  .chip.todos{background:#dcfce7;color:#166534}
  .btn{border:none;border-radius:9px;padding:9px 16px;font-weight:800;font-size:13px;cursor:pointer}
  .btn:disabled{opacity:.55}
  .btn-verde{background:var(--verde);color:#fff}
  .btn-gris{background:#f1f5f9;color:#334155;border:1px solid #cbd5e1}
  .dropres{display:none;position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #cbd5e1;border-radius:9px;margin-top:4px;max-height:220px;overflow:auto;z-index:20;box-shadow:0 8px 20px rgba(0,0,0,.1)}
  .dropres div{padding:9px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid #f1f5f9}
  .dropres div:hover{background:#eff6ff}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:700;display:none;z-index:80;max-width:90vw;text-align:center}
  .gate{background:#fef2f2;border:1.5px solid #fca5a5;border-radius:12px;padding:24px;text-align:center;color:#991b1b;font-weight:700}
  .hint{font-size:12px;color:var(--sub);margin-top:5px}

  /* ── 📚 Clases enviadas ── */
  .ec-ver{background:none;border:1px solid var(--border);border-radius:8px;padding:3px 10px;font-size:11.5px;font-weight:700;color:#0c80b8;cursor:pointer}
  .ec-ver:hover{background:#f1f5f9}
  .ec-del{background:none;border:1px solid #fecaca;border-radius:8px;padding:3px 9px;font-size:11.5px;font-weight:700;color:var(--rojo);cursor:pointer}
  .ec-del:hover{background:#fef2f2}
  .ec-sub{font-size:11px;font-weight:800;letter-spacing:.4px;color:#64748b;margin:10px 0 4px;text-transform:uppercase}
  .ec-envio{background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:9px 11px;font-size:12.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word;color:#0f172a}
  .ec-dest{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12.5px;padding:4px 0;border-bottom:1px dotted var(--border)}
  .ec-filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:2px 0 12px}
  .ec-filtros input,.ec-filtros select{border:1px solid #cbd5e1;border-radius:9px;padding:7px 10px;font-size:12.5px;font-family:inherit;background:#fff;color:var(--txt)}
  .ec-filtros input{min-width:210px;flex:1}
  .ec-tabs{display:flex;border:1px solid #cbd5e1;border-radius:9px;overflow:hidden}
  .ec-tabs button{border:none;background:#fff;padding:7px 13px;font-size:12.5px;font-weight:800;cursor:pointer;color:#64748b}
  .ec-tabs button.on{background:var(--azul);color:#fff}
  .ec-tarjeta{border:1px solid var(--border);border-left:4px solid var(--verde);border-radius:10px;padding:10px 13px;margin-bottom:8px;background:#fff}
  .ec-tarjeta.sel{border-color:#93c5fd;border-left-color:var(--azul);background:#f8fbff}
  .ec-carp{border:1px solid var(--border);border-radius:10px;margin-bottom:8px;overflow:hidden;background:#fff}
  .ec-carp-h{display:flex;align-items:center;gap:10px;padding:10px 13px;cursor:pointer;background:#f8fafc}
  .ec-carp-h:hover{background:#eff6ff}
  .ec-carp-b{padding:4px 13px 10px;border-top:1px solid var(--border)}
  .ec-clase{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:8px 0;border-bottom:1px dotted var(--border)}
  .ec-clase b{font-size:12.5px}
  .ec-barra{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:12px;display:none;align-items:center;gap:14px;z-index:70;box-shadow:0 12px 28px rgba(0,0,0,.28);font-size:13px;font-weight:800}
  .ec-barra button{border:none;border-radius:8px;padding:7px 13px;font-size:12.5px;font-weight:800;cursor:pointer}
  .ec-chk{width:15px;height:15px;cursor:pointer;accent-color:#2563eb;flex:none}
  .ec-badge{border-radius:6px;padding:2px 8px;font-size:11px;font-weight:800;white-space:nowrap}
  .ec-link{font-size:11.5px;color:#2563eb;font-weight:700;text-decoration:none}
  .ec-link:hover{text-decoration:underline}
</style>
</head>
<body>
  <h1>🏠 Entrenamiento en casa</h1>
  <div class="sub">Mandales una clase o rutina a tus alumnos — con video de YouTube, PDF o lo que quieras. Les llega a su Mi Espacio, con los links clickeables.</div>
  <div id="app"><div class="card">⏳ Cargando…</div></div>
  <div class="toast" id="toast"></div>
  <div class="ec-barra" id="ecBarra">
    <span id="ecBarraTxt">0 seleccionadas</span>
    <button style="background:#dc2626;color:#fff" onclick="ecBorrarSeleccion(this)">🗑️ Borrar</button>
    <button style="background:#334155;color:#fff" onclick="ecLimpiarSeleccion()">Cancelar</button>
  </div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
  const supa = createClient('https://bqpjtoiictnzcasxfucf.supabase.co', 'sb_publishable_yvuXDxrkRrhXwmZBnE_a_Q_zDBz0iDi', { auth: { lock: (name, acquireTimeout, fn) => fn() } });
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const attr = (s) => esc(s).replace(/'/g,'&#39;');
  const toast = (t) => { const el=$('toast'); el.textContent=t; el.style.display='block'; setTimeout(()=>el.style.display='none', 3600); };

  // 🔒 Lu, Jime, Pau y Ale (administración)
  const ALLOW = ['liclucianavelaz@gmail.com', 'jimenahllorente@gmail.com',
                 'paukappes@gmail.com', 'alejandraperna@gmail.com'];

  let miId = null, miNombre = '';
  let destinos = new Map();   // persona_id -> nombre (elegidos)
  let modoTodos = false;
  let todosLista = [];        // [{id, nombre}] resueltos para "Todos los TF activos"
  let timerB = null;

  // Estado del historial
  let ecGrupos = [];                // envíos agrupados (contenido + minuto)
  let ecPorMsj = new Map();         // mensaje_id -> { g, d }
  let ecFiltro = { texto:'', alumno:'', estado:'', vista:'alumno', meses:'6' };
  let ecSel = new Set();            // 'G:gk' (envío entero) · 'C:msjId|link' (una clase de un alumno)
  let ecAbiertos = new Set();       // envíos con el detalle desplegado
  let ecCarpAbiertas = new Set();   // carpetas de alumno desplegadas
  let ecAlumnosOpc = [];

  async function boot(){
    const { data: u } = await supa.auth.getUser();
    const email = (u && u.user && u.user.email || '').toLowerCase().trim();
    if (!ALLOW.includes(email)){
      $('app').innerHTML = `<div class="gate">🔒 Este módulo es solo para administración (Lu, Jime, Pau y Ale).</div>`;
      return;
    }
    const { data: pid } = await supa.rpc('mi_persona_id');
    miId = pid || null;
    if (miId){
      const { data: yo } = await supa.from('personas').select('nombre').eq('id', miId).single();
      miNombre = (yo && yo.nombre) || '';
    }
    render();
  }

  function render(){
    $('app').innerHTML = `
      <div class="card">
        <label class="tit">Para</label>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
          <div style="position:relative;flex:1;min-width:240px">
            <input type="text" id="ecBusca" placeholder="🔍 Buscá y agregá alumnos por nombre…" autocomplete="off" oninput="ecBuscar(this.value)">
            <div id="ecRes" class="dropres"></div>
          </div>
          <button class="btn btn-gris" onclick="ecTodos(this)">👥 Todos los TF activos</button>
        </div>
        <div class="chips" id="ecChips"></div>
        <div class="hint" id="ecHint"></div>
        <div id="ecListaTodos" style="display:none;margin-top:8px;max-height:190px;overflow:auto;border:1px solid var(--border);border-radius:9px;padding:8px 11px;font-size:12.5px;line-height:1.7;background:#f8fafc"></div>

        <label class="tit">Título</label>
        <input type="text" id="ecTitulo" placeholder="Ej: Entrenamiento en casa · Semana del 21/7">

        <label class="tit">Clase / instrucciones</label>
        <textarea id="ecTexto" placeholder="Escribí la rutina o las instrucciones… Pegá el link del video de YouTube acá: les queda clickeable."></textarea>
        <div class="hint">Cada link es una clase. Poné el nombre de la clase en la línea de arriba del link (o en la misma línea) y el alumno la marca por separado.</div>

        <label class="tit">Archivos</label>
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <label class="btn btn-gris" style="cursor:pointer">📎 Adjuntar
            <input id="ecArchivos" type="file" multiple style="display:none" onchange="ecArch()">
          </label>
          <span id="ecListaArch" style="font-size:12px;color:var(--sub)"></span>
        </div>

        <div style="display:flex;justify-content:flex-end;margin-top:14px">
          <button class="btn btn-verde" id="ecEnviarBtn" onclick="ecEnviar(this)" style="padding:10px 26px;font-size:14px">🏠 Enviar</button>
        </div>
      </div>

      <div class="card">
        <div style="font-size:15px;font-weight:800;margin-bottom:4px">📚 Clases enviadas</div>
        <div class="hint" style="margin:0 0 10px">Cada link es una clase. En “Por alumno” ves la carpeta de cada uno con sus clases sueltas; en “Por envío”, el mail completo tal cual lo mandaste.</div>
        <div class="ec-filtros">
          <input type="text" id="ecFTexto" placeholder="🔍 Buscar por clase, texto del envío o alumno…" autocomplete="off" oninput="ecCambiaFiltro('texto', this.value)">
          <select id="ecFAlumno" onchange="ecCambiaFiltro('alumno', this.value)"><option value="">👤 Todos los alumnos</option></select>
          <select id="ecFEstado" onchange="ecCambiaFiltro('estado', this.value)">
            <option value="">Cualquier estado</option>
            <option value="sinver">○ Sin ver</option>
            <option value="vista">👀 La vio, no la hizo</option>
            <option value="hecha">✅ La hizo</option>
          </select>
          <select id="ecFMeses" onchange="ecCambiaFiltro('meses', this.value)">
            <option value="3">Últimos 3 meses</option>
            <option value="6" selected>Últimos 6 meses</option>
            <option value="12">Último año</option>
            <option value="0">Todo el historial</option>
          </select>
          <div class="ec-tabs">
            <button id="ecTabAlumno" class="on" onclick="ecCambiaFiltro('vista','alumno')">📁 Por alumno</button>
            <button id="ecTabEnvio" onclick="ecCambiaFiltro('vista','envio')">📋 Por envío</button>
          </div>
        </div>
        <div id="ecHistorial">⏳ Cargando…</div>
      </div>`;
    pintarChips();
    cargarHistorial();
  }

  // ── Lectura paginada (el tope de 1000 filas de Supabase manda sobre .limit)
  async function ecLeerTodo(armarQuery){
    const filas = [];
    for (let desde = 0; desde < 40000; desde += 1000){
      const { data, error } = await armarQuery().range(desde, desde + 999);
      if (error) throw error;
      filas.push(...(data || []));
      if (!data || data.length < 1000) break;
    }
    return filas;
  }

  async function cargarHistorial(){
    const cont = $('ecHistorial');
    cont.innerHTML = '⏳ Cargando…';
    try {
      const meses = parseInt(ecFiltro.meses, 10) || 0;
      let desdeISO = null;
      if (meses > 0){ const d = new Date(); d.setMonth(d.getMonth() - meses); desdeISO = d.toISOString(); }

      const msjs = await ecLeerTodo(() => {
        let q = supa.from('mensajes_equipo')
          .select('id, autor_persona_id, autor_nombre, destinatario_persona_id, contenido, creado_en')
          .eq('enviado_desde', 'equipo')
          .like('contenido', '🏠 ENTRENAMIENTO EN CASA%')
          .order('creado_en', { ascending: false })
          .order('id', { ascending: false });
        if (desdeISO) q = q.gte('creado_en', desdeISO);
        return q;
      });

      if (!msjs.length){
        ecGrupos = []; ecPorMsj = new Map(); ecAlumnosOpc = []; ecSel.clear();
        ecPintarBarra(); ecLlenarSelectAlumnos();
        cont.innerHTML = '<div class="hint">No hay clases enviadas en este período.</div>';
        return;
      }

      // Lecturas (supervisoras ven todas; Pau/Ale las de lo suyo)
      const ids = msjs.map(m => m.id);
      const lecSet = new Set();
      for (let i = 0; i < ids.length; i += 300){
        const { data: lec } = await supa.from('mensajes_lecturas')
          .select('mensaje_id, persona_id').in('mensaje_id', ids.slice(i, i + 300));
        (lec||[]).forEach(l => lecSet.add(l.mensaje_id + '|' + l.persona_id));
      }

      // Nombres de los destinatarios
      const pids = [...new Set(msjs.map(m => m.destinatario_persona_id).filter(Boolean))];
      const nombrePersona = {};
      for (let i = 0; i < pids.length; i += 300){
        const { data: ps } = await supa.from('personas').select('id, nombre').in('id', pids.slice(i, i + 300));
        (ps||[]).forEach(p => { nombrePersona[p.id] = p.nombre; });
      }

      // RESPUESTAS de los alumnos: son filas de evoluciones_tf (origen='casa'),
      // las mismas que ven la agenda y la historia clínica. Acá solo se leen.
      const respPorClase = new Map();     // mensaje_id|link -> respuesta
      for (let i = 0; i < ids.length; i += 300){
        const { data: rs } = await supa.from('evoluciones_tf')
          .select('id, persona_id, mensaje_id, clase_ref, fecha, dificultad, dolor, dolor_nivel, dolor_zona')
          .eq('origen', 'casa').in('mensaje_id', ids.slice(i, i + 300));
        (rs||[]).forEach(r => respPorClase.set(r.mensaje_id + '|' + (r.clase_ref || ''), r));
      }

      // Agrupar por envío: mismo contenido + mismo minuto
      const grupos = new Map();
      msjs.forEach(m => {
        const k = String(m.creado_en).slice(0, 16) + '§' + m.contenido;
        if (!grupos.has(k)) grupos.set(k, { contenido: m.contenido, creado_en: m.creado_en, autor: m.autor_nombre, filas: [] });
        grupos.get(k).filas.push(m);
      });

      ecPorMsj = new Map();
      ecGrupos = [...grupos.values()].map((g, i) => {
        g.gk = 'g' + i;
        g.clases = ecClasesDe(g.contenido);
        g.titulo = String(g.contenido).split('\n')[0]
          .replace('🏠 ENTRENAMIENTO EN CASA — ', '').replace('🏠 ENTRENAMIENTO EN CASA', '(sin título)');
        g.dests = g.filas.map(m => {
          const pid = m.destinatario_persona_id;
          const vio = lecSet.has(m.id + '|' + pid);
          const nombre = nombrePersona[pid] || ('#' + pid);
          const d = {
            gk: g.gk, msjId: m.id, pid, vio, nombre,
            clases: g.clases.map(c => {
              const r = respPorClase.get(m.id + '|' + (c.link || ''));
              return {
                titulo: c.titulo, link: c.link, consigna: c.consigna, msjId: m.id, pid, gk: g.gk, nombreAlumno: nombre,
                resp: r || null, estado: r ? 'hecha' : (vio ? 'vista' : 'sinver')
              };
            })
          };
          d.hechas = d.clases.filter(c => c.resp).length;
          ecPorMsj.set(m.id, { g, d });
          return d;
        }).sort((a,b) => a.nombre.localeCompare(b.nombre, 'es'));
        return g;
      });

      const vistos = new Map();
      ecGrupos.forEach(g => g.dests.forEach(d => vistos.set(d.pid, d.nombre)));
      ecAlumnosOpc = [...vistos.entries()].map(([id, nombre]) => ({ id, nombre }))
        .sort((a,b) => a.nombre.localeCompare(b.nombre, 'es'));
      ecLlenarSelectAlumnos();

      ecSel.clear(); ecPintarBarra();
      ecPintarHistorial();
    } catch(e){
      cont.innerHTML = '<div class="hint">No se pudo cargar el historial: ' + esc(e.message || '') + '</div>';
    }
  }

  function ecLlenarSelectAlumnos(){
    const sel = $('ecFAlumno'); if (!sel) return;
    const actual = ecFiltro.alumno;
    sel.innerHTML = '<option value="">👤 Todos los alumnos</option>' +
      ecAlumnosOpc.map(a => `<option value="${a.id}">${esc(a.nombre)}</option>`).join('');
    if (actual && ecAlumnosOpc.some(a => String(a.id) === String(actual))) sel.value = actual;
    else { sel.value = ''; ecFiltro.alumno = ''; }
  }

  window.ecCambiaFiltro = function(campo, valor){
    ecFiltro[campo] = valor;
    if (campo === 'vista'){
      $('ecTabEnvio').classList.toggle('on', valor === 'envio');
      $('ecTabAlumno').classList.toggle('on', valor === 'alumno');
      ecSel.clear(); ecPintarBarra();
    }
    if (campo === 'meses'){ cargarHistorial(); return; }
    ecPintarHistorial();
  };

  // ── Filtrado a nivel CLASE
  function ecClasesFiltradas(){
    const txt = (ecFiltro.texto || '').toLowerCase().trim();
    const alum = ecFiltro.alumno ? String(ecFiltro.alumno) : '';
    const est = ecFiltro.estado || '';
    const items = [];
    ecGrupos.forEach(g => g.dests.forEach(d => {
      if (alum && String(d.pid) !== alum) return;
      const coincideAlumno = !txt || d.nombre.toLowerCase().includes(txt);
      d.clases.forEach(c => {
        if (est && c.estado !== est) return;
        if (txt && !coincideAlumno
            && !(c.titulo || '').toLowerCase().includes(txt)
            && !(g.contenido || '').toLowerCase().includes(txt)) return;
        items.push({ g, d, c });
      });
    }));
    return items;
  }

  function ecPintarHistorial(){
    const cont = $('ecHistorial'); if (!cont) return;
    const items = ecClasesFiltradas();
    if (!items.length){
      cont.innerHTML = ecGrupos.length
        ? '<div class="hint">Ninguna clase coincide con el filtro. Probá limpiando la búsqueda o ampliando el período.</div>'
        : '<div class="hint">Todavía no enviaste ninguna clase.</div>';
      ecPintarBarra(); return;
    }
    cont.innerHTML = (ecFiltro.vista === 'envio' ? ecVistaPorEnvio(items) : ecVistaPorAlumno(items));
    ecPintarBarra();
  }

  // ── 📁 Vista por alumno: una carpeta por alumno, con sus CLASES sueltas
  function ecVistaPorAlumno(items){
    const carp = new Map();
    items.forEach(it => {
      if (!carp.has(it.d.pid)) carp.set(it.d.pid, { pid: it.d.pid, nombre: it.d.nombre, clases: [] });
      carp.get(it.d.pid).clases.push(it);
    });
    const carpetas = [...carp.values()].sort((a,b) => a.nombre.localeCompare(b.nombre, 'es'));
    return carpetas.map(c => {
      const n = c.clases.length;
      const hechas = c.clases.filter(x => x.c.resp).length;
      const sinVer = c.clases.filter(x => x.c.estado === 'sinver').length;
      const abierta = ecCarpAbiertas.has(String(c.pid));
      const orden = c.clases.slice().sort((a,b) => String(b.g.creado_en).localeCompare(String(a.g.creado_en)));
      const yaDesplegado = new Set();   // el mail se muestra una sola vez, no debajo de cada clase
      const cuerpo = !abierta ? '' : `<div class="ec-carp-b">` + orden.map(({ g, c: cl }) => {
        const k = 'C:' + cl.msjId + '|' + cl.link;
        const sel = ecSel.has(k);
        let det = '';
        if (ecAbiertos.has(g.gk) && !yaDesplegado.has(g.gk)){ yaDesplegado.add(g.gk); det = ecDetalle(g); }
        return `<div class="ec-clase">
          <input type="checkbox" class="ec-chk" ${sel?'checked':''} onchange="ecToggleSel('${attr(k)}')">
          <div style="flex:1;min-width:170px">
            <b>${esc(cl.titulo)}</b>
            ${cl.consigna ? `<div class="hint" style="margin:1px 0 0">${esc(cl.consigna)}</div>` : ''}
          </div>
          ${ecBadgeClase(cl)}
          <span class="hint" style="margin:0">${esc(ecFechaCorta(g.creado_en))}</span>
          ${cl.link ? `<a class="ec-link" href="${attr(cl.link)}" target="_blank" rel="noopener">🔗 abrir</a>` : ''}
          <button class="ec-ver" title="Ver el mail completo" onclick="ecVerEnvio('${g.gk}')">👁️ El envío</button>
          <button class="ec-del" title="Sacarle esta clase a ${attr(cl.nombreAlumno)}" onclick="ecBorrarClase(${cl.msjId}, '${attr(cl.link)}', this)">🗑️</button>
        </div>${det}`;
      }).join('') + `</div>`;
      return `<div class="ec-carp">
        <div class="ec-carp-h" onclick="ecToggleCarpeta('${c.pid}')">
          <span style="font-size:16px">${abierta ? '📂' : '📁'}</span>
          <b style="font-size:13.5px;flex:1">${esc(c.nombre)}</b>
          <span class="hint" style="margin:0">${n} clase${n===1?'':'s'} · ${hechas} hecha${hechas===1?'':'s'}${sinVer ? ` · ${sinVer} sin ver` : ''}</span>
        </div>${cuerpo}
      </div>`;
    }).join('');
  }

  function ecBadgeClase(cl){
    if (cl.resp){
      const dif = (cl.resp.dificultad !== null && cl.resp.dificultad !== undefined) ? ` · dificultad ${cl.resp.dificultad}` : '';
      const dol = (cl.resp.dolor || (cl.resp.dolor_nivel||0) > 0)
        ? ` · dolor ${cl.resp.dolor_nivel || ''}${cl.resp.dolor_zona ? ' ' + cl.resp.dolor_zona : ''} ⚠️` : '';
      return `<span class="ec-badge" style="background:#ecfdf5;color:#047857">✅ la hizo${esc(dif)}${esc(dol)}</span>`;
    }
    return cl.estado === 'vista'
      ? `<span class="ec-badge" style="background:#f1f5f9;color:#64748b">👀 la vio, no la hizo</span>`
      : `<span class="ec-badge" style="background:#fff7ed;color:#c2410c">○ sin ver</span>`;
  }

  // ── 📋 Vista por envío: el mail completo, con sus clases adentro
  function ecVistaPorEnvio(items){
    const porGrupo = new Map();
    items.forEach(it => {
      if (!porGrupo.has(it.g.gk)) porGrupo.set(it.g.gk, { g: it.g, pids: new Set() });
      porGrupo.get(it.g.gk).pids.add(it.d.pid);
    });
    const lista = [...porGrupo.values()];
    return lista.slice(0, 60).map(({ g, pids }) => {
      const dests = g.dests.filter(d => pids.has(d.pid));
      const total = dests.length;
      const vistos = dests.filter(d => d.vio || d.hechas).length;
      const nombres = total <= 3
        ? dests.map(d => esc(d.nombre)).join(' · ')
        : `${esc(dests[0].nombre)}, ${esc(dests[1].nombre)} y ${total - 2} más`;
      const chipV = (vistos >= total && total > 0)
        ? `<span class="ec-badge" style="background:#dcfce7;color:#166534">✓ Lo vieron todos (${vistos}/${total})</span>`
        : `<span class="ec-badge" style="background:#f1f5f9;color:#64748b">👀 ${vistos}/${total} lo vieron</span>`;
      const chipC = `<span class="ec-badge" style="background:#eff6ff;color:#1d4ed8">${g.clases.length} clase${g.clases.length===1?'':'s'}</span>`;
      const sel = ecSel.has('G:' + g.gk);
      return `<div class="ec-tarjeta ${sel ? 'sel' : ''}">
        <div style="display:flex;align-items:flex-start;gap:9px">
          <input type="checkbox" class="ec-chk" style="margin-top:3px" ${sel?'checked':''} onchange="ecToggleSel('G:${g.gk}')">
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
              <b style="font-size:13.5px">${esc(g.titulo)}</b> ${chipC} ${chipV}
            </div>
            <div class="hint" style="margin-top:3px">${esc(ecFecha(g.creado_en))} · ${esc(g.autor || '')}</div>
            <div style="font-size:12.5px;margin-top:4px"><span style="color:var(--sub)">Para:</span> <b>${nombres}</b></div>
            <div style="margin-top:7px;display:flex;gap:7px;flex-wrap:wrap">
              <button class="ec-ver" onclick="ecVerEnvio('${g.gk}')">👁️ Ver las clases y quién las hizo</button>
              <button class="ec-del" onclick="ecBorrarEnvio('${g.gk}', this)">🗑️ Borrar el envío entero</button>
            </div>
            ${ecAbiertos.has(g.gk) ? ecDetalle(g) : ''}
          </div>
        </div>
      </div>`;
    }).join('') + (lista.length > 60 ? `<div class="hint">Mostrando los 60 envíos más nuevos de ${lista.length}. Afiná con el buscador o el período.</div>` : '');
  }

  function ecDetalle(g){
    const total = g.filas.length;
    const filasClase = g.clases.map(c => {
      const hechas = g.dests.filter(d => d.clases.some(x => x.link === c.link && x.resp));
      const difs = hechas.map(d => (d.clases.find(x => x.link === c.link) || {}).resp)
        .map(r => r && r.dificultad).filter(v => v !== null && v !== undefined);
      const prom = difs.length ? (difs.reduce((a,b)=>a+b,0)/difs.length).toFixed(1).replace('.0','') : null;
      const conDolor = g.dests.filter(d => {
        const r = (d.clases.find(x => x.link === c.link) || {}).resp;
        return r && (r.dolor || (r.dolor_nivel||0) > 0);
      }).length;
      return `<div class="ec-clase">
        <div style="flex:1;min-width:170px">
          <b>${esc(c.titulo)}</b>
          ${c.consigna ? `<div class="hint" style="margin:1px 0 0">${esc(c.consigna)}</div>` : ''}
        </div>
        <span style="font-size:12.5px;color:#166534;font-weight:700">la hicieron ${hechas.length}/${total}</span>
        ${prom !== null ? `<span class="hint" style="margin:0">dificultad promedio ${prom}</span>` : ''}
        ${conDolor ? `<span class="ec-badge" style="background:#fef2f2;color:#b91c1c">${conDolor} con dolor ⚠️</span>` : ''}
        ${c.link ? `<a class="ec-link" href="${attr(c.link)}" target="_blank" rel="noopener">🔗 abrir</a>` : ''}
        <button class="ec-del" title="Sacar esta clase del envío, para todos" onclick="ecBorrarClaseGrupo('${g.gk}', '${attr(c.link)}', this)">🗑️ Sacar esta clase</button>
      </div>`;
    }).join('');
    const listaDest = g.dests.map(d => `<div class="ec-dest">
        <span>${esc(d.nombre)}</span>
        <span style="display:flex;align-items:center;gap:9px">
          ${d.hechas ? `<span style="color:#166534;font-weight:700">✅ hizo ${d.hechas} de ${g.clases.length}</span>`
                     : (d.vio ? `<span style="color:#64748b">👀 lo vio</span>` : `<span style="color:#94a3b8">○ sin ver</span>`)}
          <button class="ec-del" title="Borrarle el envío a ${attr(d.nombre)}" onclick="ecBorrarCopia(${d.msjId}, '${attr(d.nombre)}', this)">🗑️</button>
        </span></div>`).join('');
    return `<div style="margin-top:9px;border-top:1px dashed var(--border);padding-top:6px">
      <div class="ec-sub">🎯 Las clases de este envío</div>
      ${filasClase}
      <div class="ec-sub">📄 El mail tal cual lo mandaste</div>
      <div class="ec-envio">${ecLinkify(esc(g.contenido))}</div>
      <div class="ec-sub">👥 A quiénes se lo mandaste</div>
      ${listaDest}
    </div>`;
  }

  function ecFecha(iso){
    const d = new Date(iso);
    return d.toLocaleDateString('es-AR', { day:'numeric', month:'numeric', year:'numeric' })
         + ' · ' + d.toLocaleTimeString('es-AR', { hour:'2-digit', minute:'2-digit' });
  }
  function ecFechaCorta(iso){
    return new Date(iso).toLocaleDateString('es-AR', { day:'numeric', month:'numeric', year:'2-digit' });
  }

  window.ecVerEnvio = function(gk){
    if (ecAbiertos.has(gk)) ecAbiertos.delete(gk); else ecAbiertos.add(gk);
    ecPintarHistorial();
  };
  window.ecToggleCarpeta = function(pid){
    const k = String(pid);
    if (ecCarpAbiertas.has(k)) ecCarpAbiertas.delete(k); else ecCarpAbiertas.add(k);
    ecPintarHistorial();

  window.ecToggleSel = function(k){

  function ecPintarBarra(){

    const n = ecSel.size;

  // ══════════════════════════════════════════════════════════════
  // 🗑️ BORRADO
  // Sacar una clase = sacarle el link (y su título) al mail.
  // Borrar un envío = borrar el mensaje entero.
  // Lo que el alumno ya cargó vive en evoluciones_tf y NO se toca:
  // sigue en su historia clínica aunque acá desaparezca la clase.
  // ══════════════════════════════════════════════════════════════

  function ecContenidoSinClases(contenido, links){
    const clases = ecClasesDe(contenido);
    const quedan = clases.filter(c => !links.includes(c.link));
    const seQuedan = new Set();
    quedan.forEach(c => (c.owned || []).forEach(i => seQuedan.add(i)));
    const fuera = new Set();
    clases.forEach(c => {
      if (!links.includes(c.link)) return;
      (c.owned || []).forEach(i => { if (!seQuedan.has(i)) fuera.add(i); });
    });
    const nuevo = String(contenido || '').split('\n')
      .filter((_, i) => !fuera.has(i)).join('\n')
      .replace(/\n{3,}/g, '\n\n').trim();
    return { contenido: nuevo, quedan: quedan.length };
  }

  async function ecBorrarMensajes(ids){
    let borrados = 0;
    for (let i = 0; i < ids.length; i += 200){
      const trozo = ids.slice(i, i + 200);
      await supa.from('mensajes_lecturas').delete().in('mensaje_id', trozo);
      await supa.from('mensajes_adjuntos').delete().in('mensaje_id', trozo);
      const { data, error } = await supa.from('mensajes_equipo').delete().in('id', trozo).select('id');
      if (error) throw error;
      borrados += (data || []).length;
    }
    return borrados;
  }

  async function ecActualizarContenido(ids, contenido){
    let tocados = 0;
    for (let i = 0; i < ids.length; i += 200){
      const { data, error } = await supa.from('mensajes_equipo')
        .update({ contenido }).in('id', ids.slice(i, i + 200)).select('id');
      if (error) throw error;
      tocados += (data || []).length;
    }
    return tocados;
  }

  // ops = { del:[ids], upd:[{ids, contenido}] }
  async function ecEjecutar(ops, aviso, btn){
    if (!confirm(aviso)) return;
    const txtOrig = btn ? btn.textContent : '';
    if (btn){ btn.disabled = true; btn.textContent = '…'; }
    try {
      let n = 0;
      for (const u of (ops.upd || [])){
        const t = await ecActualizarContenido(u.ids, u.contenido);
        if (!t) throw new Error('la base no dejó modificar el mensaje (permiso RLS)');
        n += t;
      }
      if ((ops.del || []).length){
        const b = await ecBorrarMensajes(ops.del);
        if (!b) throw new Error('la base no dejó borrar el mensaje (permiso RLS)');
        n += b;
      }
      toast(`🗑️ Listo — ${n} mensaje(s) actualizados`);
      await cargarHistorial();
    } catch(e){
      toast('❌ No se pudo: ' + (e.message || ''));
    } finally {
      if (btn){ btn.disabled = false; btn.textContent = txtOrig; }
    }
  }

  // Sacar UNA clase, solo a UN alumno
  window.ecBorrarClase = async function(msjId, link, btn){
    const ref = ecPorMsj.get(msjId); if (!ref) return;
    const g = ref.g, d = ref.d;
    const cl = d.clases.find(c => c.link === link); if (!cl) return;
    const r = ecContenidoSinClases(g.contenido, [link]);
    let aviso = `¿Sacarle la clase "${cl.titulo}" a ${d.nombre}?\n\nDeja de verla en su Mi Espacio.`;
    if (cl.resp) aviso += `\n\n⚠️ Ya la había hecho. La evolución queda en su historia clínica igual.`;
    if (!r.quedan){
      await ecEjecutar({ del: [msjId] }, aviso + `\n\nEra la única clase del mail, así que se le borra el envío entero.\n\nEsto no se puede deshacer.`, btn);
    } else {
      await ecEjecutar({ upd: [{ ids: [msjId], contenido: r.contenido }] }, aviso + `\n\nLe quedan ${r.quedan} clase(s) de ese mail.`, btn);
    }
  };

  // Sacar UNA clase a TODOS los del envío
  window.ecBorrarClaseGrupo = async function(gk, link, btn){
    const g = ecGrupos.find(x => x.gk === gk); if (!g) return;
    const cl = g.clases.find(c => c.link === link); if (!cl) return;
    const ids = g.filas.map(m => m.id);
    const hechas = g.dests.filter(d => d.clases.some(c => c.link === link && c.resp)).length;
    const r = ecContenidoSinClases(g.contenido, [link]);
    let aviso = `¿Sacar la clase "${cl.titulo}" de este envío?\n\nLa dejan de ver los ${ids.length} alumno(s).`;
    if (hechas) aviso += `\n\n⚠️ ${hechas} ya la hicieron. Esas evoluciones quedan en la historia clínica.`;
    if (!r.quedan){
      await ecEjecutar({ del: ids }, aviso + `\n\nEra la única clase, así que se borra el envío entero.\n\nEsto no se puede deshacer.`, btn);
    } else {
      await ecEjecutar({ upd: [{ ids, contenido: r.contenido }] }, aviso + `\n\nQuedan ${r.quedan} clase(s) en el mail.`, btn);
    }

  // Borrar el envío entero
  window.ecBorrarEnvio = async function(gk, btn){

    const hechas = g.dests.reduce((a,d) => a + d.hechas, 0);
    let aviso = `¿Borrar el envío "${g.titulo}" con sus ${g.clases.length} clase(s)?\n\nSe le saca a ${g.filas.length} alumno(s).`;
    if (hechas) aviso += `\n\n⚠️ Hay ${hechas} clase(s) ya hechas. Las evoluciones quedan en la historia clínica.`;
    await ecEjecutar({ del: g.filas.map(m => m.id) }, aviso + `\n\nEsto no se puede deshacer.`, btn);
  };

  // Borrar el envío para UN alumno
  window.ecBorrarCopia = async function(msjId, nombre, btn){
    const ref = ecPorMsj.get(msjId); if (!ref) return;
    let aviso = `¿Borrarle el envío "${ref.g.titulo}" a ${nombre}?\n\nSe le va con todas sus clases.`;
    if (ref.d.hechas) aviso += `\n\n⚠️ Ya hizo ${ref.d.hechas}. Esas evoluciones quedan en su historia clínica.`;
    await ecEjecutar({ del: [msjId] }, aviso + `\n\nEsto no se puede deshacer.`, btn);

  // Borrado múltiple
  window.ecBorrarSeleccion = async function(btn){
    const del = new Set();
    const porMsj = new Map();      // msjId -> [links]
    ecSel.forEach(k => {
      if (k.startsWith('G:')){
        const g = ecGrupos.find(x => x.gk === k.slice(2));
        if (g) g.filas.forEach(m => del.add(m.id));
      } else {
        const resto = k.slice(2);
        const corte = resto.indexOf('|');
        const id = parseInt(resto.slice(0, corte), 10);
        const link = resto.slice(corte + 1);
        if (!porMsj.has(id)) porMsj.set(id, []);
        porMsj.get(id).push(link);
      }
    });
    const upd = [];
    let clasesQuitadas = 0;
    porMsj.forEach((links, id) => {
      if (del.has(id)) return;                       // ya se borra el mensaje entero
      const ref = ecPorMsj.get(id); if (!ref) return;
      clasesQuitadas += links.length;
      const r = ecContenidoSinClases(ref.g.contenido, links);
      if (!r.quedan) del.add(id);
      else upd.push({ ids: [id], contenido: r.contenido });
    });
    const ids = [...del];
    if (!ids.length && !upd.length) return;
    const aviso = `¿Borrar lo seleccionado?\n\n· ${clasesQuitadas} clase(s) que se sacan del mail\n· ${ids.length} mensaje(s) que se borran enteros\n\nLo que los alumnos ya hicieron queda en la historia clínica.\nEsto no se puede deshacer.`;
    await ecEjecutar({ del: ids, upd }, aviso, btn);
    ecSel.clear();
  };

  // ══════════════════════════════════════════════════════════════
  // Un envío trae VARIAS clases: UN LINK = UNA CLASE.
  //
  // El nombre de la clase sale de la línea PEGADA arriba del link
  // (o de la misma línea). Si arriba hay un renglón en blanco, esa
  // línea NO es el título: es la consigna de la clase anterior, que
  // va escrita DEBAJO de su link. Sin esta regla, "ejercicio 7/8/9…"
  // se colaba como nombre de la clase siguiente.
  //
  // Cada clase se queda con sus propias líneas (`owned`): el título,
  // el link y la consigna de abajo. Eso es lo que se saca del mail
  // cuando se borra la clase.
  // ══════════════════════════════════════════════════════════════
  function ecClasesDe(contenido){
    const lineas = String(contenido || '').split('\n');
    const tituloEnvio = (lineas[0] || '')
      .replace('🏠 ENTRENAMIENTO EN CASA — ', '')
      .replace('🏠 ENTRENAMIENTO EN CASA', '').trim() || 'Entrenamiento en casa';
    const RX = /(https?:\/\/[^\s]+)/;

    const idx = [];
    lineas.forEach((l, i) => { if (RX.test(l)) idx.push(i); });
    if (!idx.length) return [{ titulo: tituloEnvio, link: '', li: -1, lt: -1, consigna: '', owned: [] }];

    // Línea del título de cada link: solo si está PEGADA arriba y no es el encabezado
    const lts = idx.map(i => {
      const resto = lineas[i].replace(lineas[i].match(RX)[1], '').trim();
      if (resto) return -1;                       // el título va en la misma línea del link
      const j = i - 1;
      if (j <= 0) return -1;                      // la línea 0 es el encabezado del mail
      const prev = (lineas[j] || '').trim();
      if (!prev || RX.test(prev)) return -1;      // renglón en blanco u otro link: no hay título propio
      return j;
    });
    const ltSet = new Set(lts.filter(x => x >= 0));

    return idx.map((i, n) => {
      const link = lineas[i].match(RX)[1];
      let tit = lineas[i].replace(link, '').trim();
      if (!tit && lts[n] >= 0) tit = (lineas[lts[n]] || '').trim();
      tit = tit.replace(/^\d+\s*[-.\)·:]\s*/, '').trim();

      // Consigna: lo que va debajo del link, hasta el próximo link
      const fin = (n + 1 < idx.length) ? idx[n + 1] : lineas.length;
      const consLineas = [], owned = [];
      if (lts[n] >= 0) owned.push(lts[n]);
      owned.push(i);
      for (let k = i + 1; k < fin; k++){
        if (ltSet.has(k)) continue;               // esa línea es el título del próximo link
        owned.push(k);
        if ((lineas[k] || '').trim()) consLineas.push(lineas[k].trim());
      }
      return {
        titulo: tit || (idx.length > 1 ? `${tituloEnvio} · clase ${n + 1}` : tituloEnvio),
        link, li: i, lt: lts[n], consigna: consLineas.join(' · '), owned
      };
    });
  }

  function ecLinkify(txtEscapado){
    return String(txtEscapado || '').replace(/(https?:\/\/[^\s<]+)/g,
      m => `<a href="${m}" target="_blank" rel="noopener" style="color:#2563eb;font-weight:700">${m}</a>`);
  }

  // ── Destinatarios del composer
  function pintarChips(){
    const cont = $('ecChips'); if (!cont) return;
    if (modoTodos){
      cont.innerHTML = `<span class="chip todos">👥 TODOS los TF activos (${todosLista.length}) <span class="x" onclick="ecLimpiar()">×</span></span>
        <button class="ec-ver" onclick="ecVerListaTodos()">👁️ Ver a quiénes les llega</button>`;
    } else {
      cont.innerHTML = [...destinos.entries()].map(([id, nom]) =>
        `<span class="chip">${esc(nom)} <span class="x" onclick="ecQuitar(${id})">×</span></span>`).join('');
      const lt = $('ecListaTodos'); if (lt) lt.style.display = 'none';
    }
    $('ecHint').textContent = modoTodos ? '' : (destinos.size ? `${destinos.size} destinatario(s)` : '');
  }

  window.ecVerListaTodos = function(){
    const el = $('ecListaTodos'); if (!el) return;
    if (el.style.display === 'block'){ el.style.display = 'none'; return; }
    el.innerHTML = todosLista.map((p, i) => `${i+1}. ${esc(p.nombre)}`).join('<br>') || 'Sin alumnos activos.';
    el.style.display = 'block';
  };

  window.ecBuscar = function(q){
    clearTimeout(timerB);
    q = (q||'').trim();
    if (q.length < 2){ $('ecRes').style.display='none'; return; }
    timerB = setTimeout(async () => {
      const { data } = await supa.from('personas').select('id, nombre, es_equipo')
        .ilike('nombre', '%' + q + '%').neq('es_prueba', true).order('nombre').limit(8);
      const lista = (data||[]).filter(p => !p.es_equipo || true); // el equipo también puede recibirse una clase 😄
      const res = $('ecRes');
      if (!lista.length){ res.style.display='none'; return; }
      res.innerHTML = lista.map(p =>
        `<div onclick="ecAgregar(${p.id}, '${attr(p.nombre)}')">${esc(p.nombre)} <span style="color:#94a3b8;font-size:11.5px">#${p.id}</span></div>`).join('');
      res.style.display='block';
    }, 250);
  };
  window.ecAgregar = function(id, nombre){
    modoTodos = false;
    destinos.set(id, nombre);
    $('ecBusca').value=''; $('ecRes').style.display='none';
    pintarChips();
  };
  window.ecQuitar = function(id){ destinos.delete(id); pintarChips(); };
  window.ecLimpiar = function(){ modoTodos = false; destinos = new Map(); todosLista = []; pintarChips(); };

  async function ecResolverTodos(){
    const { data: insc } = await supa.from('inscripciones_tf').select('persona_id').eq('estado','ACTIVO').neq('plan','COD0BON');
    const unicos = [...new Set((insc||[]).map(i => i.persona_id))];
    const validos = [];
    for (let i = 0; i < unicos.length; i += 300){
      const { data: pers } = await supa.from('personas').select('id, nombre, es_prueba, es_equipo').in('id', unicos.slice(i, i + 300));
      (pers||[]).forEach(p => { if (!p.es_prueba && !p.es_equipo) validos.push({ id: p.id, nombre: p.nombre || ('#' + p.id) }); });
    }
    return validos.sort((a,b) => a.nombre.localeCompare(b.nombre, 'es'));
  }

  window.ecTodos = async function(btn){
    const orig = btn ? btn.textContent : '';
    if (btn){ btn.disabled = true; btn.textContent = '⏳ Buscando…'; }
    try {
      todosLista = await ecResolverTodos();
      modoTodos = true; destinos = new Map();
      pintarChips();
      if (!todosLista.length) toast('No hay TF activos para enviar');
    } catch(e){
      toast('No se pudo armar la lista: ' + (e.message || ''));
    } finally {
      if (btn){ btn.disabled = false; btn.textContent = orig; }
    }
  };

  window.ecArch = function(){
    const fs = $('ecArchivos').files;
    $('ecListaArch').textContent = fs.length ? [...fs].map(f=>f.name).join(' · ') : '';
  };

  window.ecEnviar = async function(btn){
    const titulo = ($('ecTitulo').value || '').trim();
    const texto  = ($('ecTexto').value || '').trim();
    const archivos = [...($('ecArchivos').files || [])];
    if (!modoTodos && !destinos.size){ toast('Elegí al menos un destinatario'); return; }
    if (!titulo && !texto && !archivos.length){ toast('Escribí la clase o adjuntá algo'); return; }

    let ids = [];
    if (modoTodos){
      if (!todosLista.length) todosLista = await ecResolverTodos();
      ids = todosLista.map(p => p.id);
    } else {
      ids = [...destinos.keys()];
    }
    if (!ids.length){ toast('No hay destinatarios válidos'); return; }

    const contenido = (titulo ? `🏠 ENTRENAMIENTO EN CASA — ${titulo}\n\n` : '🏠 ENTRENAMIENTO EN CASA\n\n') + (texto || '(ver adjuntos)');
    const cuantasClases = ecClasesDe(contenido).filter(c => c.link).length;
    const quienes = modoTodos ? `${ids.length} alumno(s) — TODOS los TF activos` : [...destinos.values()].join(', ');
    if (!confirm(`¿Enviar "${titulo || 'esta clase'}" (${cuantasClases} clase/s con link) a:\n\n${quienes}`)) return;

    btn.disabled = true;
    try {
      // Archivos: se suben UNA sola vez (carpeta masivos/) y todos los mensajes
      // apuntan al mismo archivo — así "Todos" no sube 200 copias.
      let archivosSubidos = [];
      for (const f of archivos){
        btn.textContent = `Subiendo ${f.name}…`;
        const safe = f.name.replace(/[^a-zA-Z0-9._-]/g,'_');
        const path = `masivos/${Date.now()}_${safe}`;
        const { error: upErr } = await supa.storage.from('mensajes-adjuntos').upload(path, f, {
          contentType: f.type || 'application/octet-stream', upsert: false });
        if (upErr) throw upErr;
        archivosSubidos.push({ path, nombre: f.name, mime: f.type || null, tam: f.size });
      }

      btn.textContent = 'Enviando…';
      const filas = ids.map(pid => ({
        autor_persona_id: miId,
        autor_nombre: miNombre,
        destinatario_persona_id: pid,
        contenido,
        enviado_desde: 'equipo'
      }));
      let enviados = 0;
      const TANDA = 50;
      let msjIds = [];
      for (let i = 0; i < filas.length; i += TANDA){
        const { data: nuevos, error } = await supa.from('mensajes_equipo')
          .insert(filas.slice(i, i + TANDA)).select('id, destinatario_persona_id');
        if (error) throw error;
        msjIds = msjIds.concat((nuevos||[]).map(n => n.id));
        enviados += (nuevos||[]).length;
        btn.textContent = `Enviando… ${enviados}/${filas.length}`;
      }

      if (archivosSubidos.length && msjIds.length){
        const adjFilas = [];
        msjIds.forEach(mid => archivosSubidos.forEach(a => adjFilas.push({
          mensaje_id: mid, storage_path: a.path, nombre_original: a.nombre,
          tipo_mime: a.mime, tamano_bytes: a.tam })));
        for (let i = 0; i < adjFilas.length; i += 200){
          const { error: eA } = await supa.from('mensajes_adjuntos').insert(adjFilas.slice(i, i + 200));
          if (eA) throw eA;
        }
      }

      toast(`✅ Clase enviada a ${enviados} alumno(s) — les llega a su Mi Espacio`);
      $('ecTitulo').value=''; $('ecTexto').value=''; $('ecArchivos').value=''; $('ecListaArch').textContent='';
      ecLimpiar();
      cargarHistorial();
    } catch(e){
      toast('❌ ' + (e.message || 'No se pudo enviar'));
    } finally {
      btn.disabled = false; btn.textContent = '🏠 Enviar';
    }
  };

  boot();
</script>
</body>
</html>
