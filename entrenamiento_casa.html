<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrenamiento en casa · PuntoBiO</title>
<style>
  :root{ --bg:#f6f8fb; --panel:#fff; --border:#e2e8f0; --txt:#0f172a; --sub:#64748b; --azul:#2563eb; --verde:#16a34a; --rojo:#dc2626; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--txt);padding:22px 26px}
  h1{font-size:22px;color:var(--azul)}
  .sub{font-size:13px;color:var(--sub);margin:2px 0 16px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:14px}
  label.tit{display:block;font-size:12px;font-weight:800;color:var(--sub);text-transform:uppercase;letter-spacing:.4px;margin:10px 0 5px}
  input[type=text], textarea{width:100%;border:1px solid #cbd5e1;border-radius:9px;padding:9px 12px;font-family:inherit;font-size:13.5px;background:#fff}
  textarea{min-height:110px;resize:vertical}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{background:#dbeafe;color:#1d4ed8;border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:800;display:inline-flex;align-items:center;gap:6px}
  .chip .x{cursor:pointer;font-weight:900}
  .chip.todos{background:#dcfce7;color:#166534}
  .btn{border:none;border-radius:9px;padding:9px 16px;font-weight:800;font-size:13px;cursor:pointer}
  .btn:disabled{opacity:.55}
  .btn-verde{background:var(--verde);color:#fff}
  .btn-gris{background:#f1f5f9;color:#334155;border:1px solid #cbd5e1}
  .dropres{display:none;position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #cbd5e1;border-radius:9px;margin-top:4px;max-height:220px;overflow:auto;z-index:20;box-shadow:0 8px 20px rgba(0,0,0,.1)}
  .dropres div{padding:9px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid #f1f5f9}
  .dropres div:hover{background:#eff6ff}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:700;display:none;z-index:50}
  .gate{background:#fef2f2;border:1.5px solid #fca5a5;border-radius:12px;padding:24px;text-align:center;color:#991b1b;font-weight:700}
  .hint{font-size:12px;color:var(--sub);margin-top:5px}
</style>
</head>
<body>
  <h1>🏠 Entrenamiento en casa</h1>
  <div class="sub">Mandales una clase o rutina a tus alumnos — con video de YouTube, PDF o lo que quieras. Les llega a su Mi Espacio, con los links clickeables.</div>
  <div id="app"><div class="card">⏳ Cargando…</div></div>
  <div class="toast" id="toast"></div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
  const supa = createClient('https://bqpjtoiictnzcasxfucf.supabase.co', 'sb_publishable_yvuXDxrkRrhXwmZBnE_a_Q_zDBz0iDi', { auth: { lock: (name, acquireTimeout, fn) => fn() } });
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const toast = (t) => { const el=$('toast'); el.textContent=t; el.style.display='block'; setTimeout(()=>el.style.display='none', 2600); };

  // 🔒 Lu, Jime, Pau y Ale (administración)
  const ALLOW = ['liclucianavelaz@gmail.com', 'jimenahllorente@gmail.com',
                 'paukappes@gmail.com', 'alejandraperna@gmail.com'];

  let miId = null, miNombre = '';
  let destinos = new Map();   // persona_id -> nombre (elegidos)
  let modoTodos = false;
  let timerB = null;

  async function boot(){
    const { data: u } = await supa.auth.getUser();
    const email = (u && u.user && u.user.email || '').toLowerCase().trim();
    if (!ALLOW.includes(email)){
      $('app').innerHTML = `<div class="gate">🔒 Este módulo es solo para administración (Lu, Jime, Pau y Ale).</div>`;
      return;
    }
    const { data: pid } = await supa.rpc('mi_persona_id');
    miId = pid || null;
    if (miId){
      const { data: yo } = await supa.from('personas').select('nombre').eq('id', miId).single();
      miNombre = (yo && yo.nombre) || '';
    }
    render();
  }

  function render(){
    $('app').innerHTML = `
      <div class="card">
        <label class="tit">Para</label>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
          <div style="position:relative;flex:1;min-width:240px">
            <input type="text" id="ecBusca" placeholder="🔍 Buscá y agregá alumnos por nombre…" autocomplete="off" oninput="ecBuscar(this.value)">
            <div id="ecRes" class="dropres"></div>
          </div>
          <button class="btn btn-gris" onclick="ecTodos()">👥 Todos los TF activos</button>
        </div>
        <div class="chips" id="ecChips"></div>
        <div class="hint" id="ecHint"></div>

        <label class="tit">Título</label>
        <input type="text" id="ecTitulo" placeholder="Ej: Entrenamiento en casa · Semana del 21/7">

        <label class="tit">Clase / instrucciones</label>
        <textarea id="ecTexto" placeholder="Escribí la rutina o las instrucciones… Pegá el link del video de YouTube acá: les queda clickeable."></textarea>

        <label class="tit">Archivos</label>
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <label class="btn btn-gris" style="cursor:pointer">📎 Adjuntar
            <input id="ecArchivos" type="file" multiple style="display:none" onchange="ecArch()">
          </label>
          <span id="ecListaArch" style="font-size:12px;color:var(--sub)"></span>
        </div>

        <div style="display:flex;justify-content:flex-end;margin-top:14px">
          <button class="btn btn-verde" id="ecEnviarBtn" onclick="ecEnviar(this)" style="padding:10px 26px;font-size:14px">🏠 Enviar</button>
        </div>
      </div>
      <div class="card">
        <div style="font-size:15px;font-weight:800;margin-bottom:4px">📚 Clases enviadas</div>
        <div class="hint" style="margin:0 0 10px">Registro de lo que mandaste (agrupado por envío), con cuántos la vieron.</div>
        <div id="ecHistorial">⏳ Cargando…</div>
        <style>
          .ec-ver{background:none;border:1px solid var(--border);border-radius:8px;padding:3px 10px;font-size:11.5px;font-weight:700;color:#0c80b8;cursor:pointer}
          .ec-ver:hover{background:#f1f5f9}
          .ec-sub{font-size:11px;font-weight:800;letter-spacing:.4px;color:#64748b;margin:9px 0 4px;text-transform:uppercase}
          .ec-envio{background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:9px 11px;font-size:12.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word;color:#0f172a}
          .ec-res-clase{font-size:12.5px;padding:4px 0;border-bottom:1px dotted var(--border)}
          .ec-dest{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:3px 0;border-bottom:1px dotted var(--border)}
        </style>
      </div>`;
    pintarChips();
    cargarHistorial();
  }

  // ── 📚 Historial: los envíos quedan ASENTADOS (agrupados por contenido+minuto)
  async function cargarHistorial(){
    const cont = $('ecHistorial');
    try {
      const { data: msjs, error } = await supa.from('mensajes_equipo')
        .select('id, autor_persona_id, autor_nombre, destinatario_persona_id, contenido, creado_en')
        .eq('enviado_desde', 'equipo')
        .like('contenido', '🏠 ENTRENAMIENTO EN CASA%')
        .order('creado_en', { ascending: false })
        .limit(400);
      if (error) throw error;
      if (!msjs || !msjs.length){ cont.innerHTML = '<div class="hint">Todavía no enviaste ninguna clase.</div>'; return; }

      // Lecturas de esos mensajes (supervisoras ven todas; Pau/Ale las de lo suyo)
      const ids = msjs.map(m => m.id);
      let lecSet = new Set();
      for (let i = 0; i < ids.length; i += 300){
        const { data: lec } = await supa.from('mensajes_lecturas')
          .select('mensaje_id, persona_id').in('mensaje_id', ids.slice(i, i + 300));
        (lec||[]).forEach(l => lecSet.add(l.mensaje_id + '|' + l.persona_id));
      }

      // Nombres de los destinatarios (para mostrar A QUIÉN se lo mandaste)
      const pids = [...new Set(msjs.map(m => m.destinatario_persona_id).filter(Boolean))];
      const nombrePersona = {};
      for (let i = 0; i < pids.length; i += 300){
        const { data: ps } = await supa.from('personas').select('id, nombre').in('id', pids.slice(i, i + 300));
        (ps||[]).forEach(p => { nombrePersona[p.id] = p.nombre; });
      }

      // RESPUESTAS de los alumnos. NO se cuentan acá: son las mismas filas de
      // evoluciones_tf (origen='casa') que ven la agenda y la historia clínica.
      const resp = [];
      for (let i = 0; i < ids.length; i += 300){
        const { data: rs } = await supa.from('evoluciones_tf')
          .select('id, persona_id, mensaje_id, clase_ref, modulo, fecha, dificultad, dolor, dolor_nivel, dolor_zona')
          .eq('origen', 'casa').in('mensaje_id', ids.slice(i, i + 300));
        (rs||[]).forEach(r => resp.push(r));
      }
      const respPorMsj = {};                       // mensaje_id -> [respuestas]
      resp.forEach(r => { (respPorMsj[r.mensaje_id] = respPorMsj[r.mensaje_id] || []).push(r); });

      // Agrupar por envío: mismo contenido + mismo minuto
      const grupos = new Map();
      msjs.forEach(m => {
        const k = String(m.creado_en).slice(0, 16) + '§' + m.contenido;
        if (!grupos.has(k)) grupos.set(k, { contenido: m.contenido, creado_en: m.creado_en, autor: m.autor_nombre, filas: [] });
        grupos.get(k).filas.push(m);
      });

      cont.innerHTML = [...grupos.values()].slice(0, 25).map((g, gi) => {
        const total = g.filas.length;
        const vistos = g.filas.filter(m => lecSet.has(m.id + '|' + m.destinatario_persona_id)).length;
        const primeraLinea = String(g.contenido).split('\n')[0].replace('🏠 ENTRENAMIENTO EN CASA — ', '').replace('🏠 ENTRENAMIENTO EN CASA', '(sin título)');
        const fecha = new Date(g.creado_en).toLocaleDateString('es-AR', { day: 'numeric', month: 'numeric', year: 'numeric' }) + ' · ' + new Date(g.creado_en).toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
        const chipV = vistos >= total && total > 0
          ? `<span style="background:#dcfce7;color:#166534;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:800">✓ La vieron todos (${vistos}/${total})</span>`
          : `<span style="background:#f1f5f9;color:#64748b;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:800">👀 ${vistos}/${total} la vieron</span>`;
        const dests = total === 1 ? 'a 1 alumno' : `a ${total} alumnos`;

        // Todas las respuestas de este envío (juntando todas sus filas/destinatarios)
        const rsG = g.filas.flatMap(m => respPorMsj[m.id] || []);
        const hechasPorPersona = {};
        rsG.forEach(r => { hechasPorPersona[r.persona_id] = (hechasPorPersona[r.persona_id] || 0) + 1; });
        const clases = ecClasesDe(g.contenido);

        // Resumen por clase: cuántos la hicieron, dificultad promedio, con dolor
        const resumen = clases.map(c => {
          const rr = rsG.filter(r => (r.clase_ref || '') === (c.link || ''));
          if (!rr.length) return `<div class="ec-res-clase"><b>${esc(c.titulo)}</b> <span class="hint">· todavía no la hizo nadie</span></div>`;
          const difs = rr.map(r => r.dificultad).filter(v => v !== null && v !== undefined);
          const prom = difs.length ? (difs.reduce((a,b)=>a+b,0)/difs.length).toFixed(1).replace('.0','') : null;
          const conDolor = rr.filter(r => r.dolor || (r.dolor_nivel||0) > 0).length;
          return `<div class="ec-res-clase"><b>${esc(c.titulo)}</b>
            <span style="color:#166534;font-weight:700">la hicieron ${rr.length}/${total}</span>
            ${prom !== null ? `· dificultad promedio ${prom}` : ''}
            ${conDolor ? `· <span style="color:#b91c1c;font-weight:700">${conDolor} con dolor ⚠️</span>` : '· sin dolor'}
          </div>`;
        }).join('');

        // A quién se lo mandaste, uno por uno
        const listaDest = g.filas.map(m => {
          const vio = lecSet.has(m.id + '|' + m.destinatario_persona_id);
          const hechas = hechasPorPersona[m.destinatario_persona_id] || 0;
          const nom = nombrePersona[m.destinatario_persona_id] || ('#' + m.destinatario_persona_id);
          const estado = hechas
            ? `<span style="color:#166534;font-weight:700">✅ hizo ${hechas} de ${clases.length}</span>`
            : (vio ? `<span style="color:#64748b">👀 la vio</span>` : `<span style="color:#94a3b8">○ sin ver</span>`);
          return `<div class="ec-dest"><span>${esc(nom)}</span> ${estado}</div>`;
        }).join('');

        return `<div style="border:1px solid var(--border);border-left:4px solid var(--verde);border-radius:10px;padding:10px 13px;margin-bottom:8px">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <b style="font-size:13.5px">${esc(primeraLinea)}</b> ${chipV}
          </div>
          <div class="hint" style="margin-top:3px">${esc(fecha)} · ${esc(g.autor || '')} · ${dests}</div>
          <div style="margin-top:6px">
            <button class="ec-ver" onclick="ecVerEnvio(${gi})">👁️ Ver lo que mandé y quién la hizo</button>
          </div>
          <div id="ecDet${gi}" style="display:none;margin-top:9px;border-top:1px dashed var(--border);padding-top:9px">
            <div class="ec-sub">📄 Lo que mandaste</div>
            <div class="ec-envio">${ecLinkify(esc(g.contenido))}</div>
            <div class="ec-sub">📊 Cómo les fue</div>
            ${resumen}
            <div class="ec-sub">👥 A quiénes se lo mandaste</div>
            ${listaDest}
          </div>
        </div>`;
      }).join('');
    } catch(e){
      cont.innerHTML = '<div class="hint">No se pudo cargar el historial: ' + esc(e.message || '') + '</div>';
    }
  }

  // Un envío puede traer VARIAS clases (un link = una clase). Mismo criterio
  // que Mi Espacio, para que los números coincidan de los dos lados.
  function ecClasesDe(contenido){
    const lineas = String(contenido || '').split('\n');
    const tituloEnvio = (lineas[0] || '')
      .replace('🏠 ENTRENAMIENTO EN CASA — ', '')
      .replace('🏠 ENTRENAMIENTO EN CASA', '').trim() || 'Entrenamiento en casa';
    const RX = /(https?:\/\/[^\s]+)/;
    const clases = [];
    for (let i = 0; i < lineas.length; i++){
      const hit = lineas[i].match(RX);
      if (!hit) continue;
      const link = hit[1];
      let tit = lineas[i].replace(link, '').trim();
      if (!tit){
        for (let j = i - 1; j > 0; j--){
          const prev = (lineas[j] || '').trim();
          if (!prev) continue;
          if (RX.test(prev)) break;
          tit = prev; break;
        }
      }
      tit = tit.replace(/^\d+\s*[-.\)·:]\s*/, '').trim();
      clases.push({ titulo: tit || tituloEnvio, link });
    }
    if (!clases.length) clases.push({ titulo: tituloEnvio, link: '' });
    return clases;
  }

  function ecLinkify(txtEscapado){
    return String(txtEscapado || '').replace(/(https?:\/\/[^\s<]+)/g,
      m => `<a href="${m}" target="_blank" rel="noopener" style="color:#2563eb;font-weight:700">${m}</a>`);
  }

  window.ecVerEnvio = function(gi){
    const el = document.getElementById('ecDet' + gi);
    if (!el) return;
    el.style.display = (el.style.display === 'none' ? 'block' : 'none');
  };

  function pintarChips(){
    const cont = $('ecChips'); if (!cont) return;
    if (modoTodos){
      cont.innerHTML = `<span class="chip todos">👥 TODOS los TF activos <span class="x" onclick="ecLimpiar()">×</span></span>`;
    } else {
      cont.innerHTML = [...destinos.entries()].map(([id, nom]) =>
        `<span class="chip">${esc(nom)} <span class="x" onclick="ecQuitar(${id})">×</span></span>`).join('');
    }
    $('ecHint').textContent = modoTodos ? '' : (destinos.size ? `${destinos.size} destinatario(s)` : '');
  }

  window.ecBuscar = function(q){
    clearTimeout(timerB);
    q = (q||'').trim();
    if (q.length < 2){ $('ecRes').style.display='none'; return; }
    timerB = setTimeout(async () => {
      const { data } = await supa.from('personas').select('id, nombre, es_equipo')
        .ilike('nombre', '%' + q + '%').neq('es_prueba', true).order('nombre').limit(8);
      const lista = (data||[]).filter(p => !p.es_equipo || true); // el equipo también puede recibirse una clase 😄
      const res = $('ecRes');
      if (!lista.length){ res.style.display='none'; return; }
      res.innerHTML = lista.map(p =>
        `<div onclick="ecAgregar(${p.id}, '${esc(p.nombre).replace(/'/g,'&#39;')}')">${esc(p.nombre)} <span style="color:#94a3b8;font-size:11.5px">#${p.id}</span></div>`).join('');
      res.style.display='block';
    }, 250);
  };
  window.ecAgregar = function(id, nombre){
    modoTodos = false;
    destinos.set(id, nombre);
    $('ecBusca').value=''; $('ecRes').style.display='none';
    pintarChips();
  };
  window.ecQuitar = function(id){ destinos.delete(id); pintarChips(); };
  window.ecLimpiar = function(){ modoTodos = false; destinos = new Map(); pintarChips(); };
  window.ecTodos = function(){ modoTodos = true; destinos = new Map(); pintarChips(); };
  window.ecArch = function(){
    const fs = $('ecArchivos').files;
    $('ecListaArch').textContent = fs.length ? [...fs].map(f=>f.name).join(' · ') : '';
  };

  window.ecEnviar = async function(btn){
    const titulo = ($('ecTitulo').value || '').trim();
    const texto  = ($('ecTexto').value || '').trim();
    const archivos = [...($('ecArchivos').files || [])];
    if (!modoTodos && !destinos.size){ toast('Elegí al menos un destinatario'); return; }
    if (!titulo && !texto && !archivos.length){ toast('Escribí la clase o adjuntá algo'); return; }

    // Resolver destinatarios
    let ids = [];
    if (modoTodos){
      const { data: insc } = await supa.from('inscripciones_tf').select('persona_id').eq('estado','ACTIVO').neq('plan','COD0BON');
      const unicos = [...new Set((insc||[]).map(i => i.persona_id))];
      const { data: pers } = await supa.from('personas').select('id, es_prueba, es_equipo').in('id', unicos);
      const validos = new Set((pers||[]).filter(p => !p.es_prueba && !p.es_equipo).map(p => p.id));
      ids = unicos.filter(id => validos.has(id));
    } else {
      ids = [...destinos.keys()];
    }
    if (!ids.length){ toast('No hay destinatarios válidos'); return; }
    if (!confirm(`¿Enviar "${titulo || 'esta clase'}" a ${ids.length} alumno(s)?`)) return;

    btn.disabled = true;
    try {
      // Contenido: título arriba, links clickeables (el Mi Espacio los linkea)
      const contenido = (titulo ? `🏠 ENTRENAMIENTO EN CASA — ${titulo}\n\n` : '🏠 ENTRENAMIENTO EN CASA\n\n') + (texto || '(ver adjuntos)');

      // Archivos: se suben UNA sola vez (carpeta masivos/) y todos los mensajes
      // apuntan al mismo archivo — así "Todos" no sube 200 copias.
      let archivosSubidos = [];
      for (const f of archivos){
        btn.textContent = `Subiendo ${f.name}…`;
        const safe = f.name.replace(/[^a-zA-Z0-9._-]/g,'_');
        const path = `masivos/${Date.now()}_${safe}`;
        const { error: upErr } = await supa.storage.from('mensajes-adjuntos').upload(path, f, {
          contentType: f.type || 'application/octet-stream', upsert: false });
        if (upErr) throw upErr;
        archivosSubidos.push({ path, nombre: f.name, mime: f.type || null, tam: f.size });
      }

      // Mensajes en tandas (para no pasarse de tamaño de request)
      btn.textContent = 'Enviando…';
      const filas = ids.map(pid => ({
        autor_persona_id: miId,
        autor_nombre: miNombre,
        destinatario_persona_id: pid,
        contenido,
        enviado_desde: 'equipo'
      }));
      let enviados = 0;
      const TANDA = 50;
      let msjIds = [];
      for (let i = 0; i < filas.length; i += TANDA){
        const { data: nuevos, error } = await supa.from('mensajes_equipo')
          .insert(filas.slice(i, i + TANDA)).select('id, destinatario_persona_id');
        if (error) throw error;
        msjIds = msjIds.concat((nuevos||[]).map(n => n.id));
        enviados += (nuevos||[]).length;
        btn.textContent = `Enviando… ${enviados}/${filas.length}`;
      }

      // Adjuntos: una fila por mensaje apuntando al archivo compartido
      if (archivosSubidos.length && msjIds.length){
        const adjFilas = [];
        msjIds.forEach(mid => archivosSubidos.forEach(a => adjFilas.push({
          mensaje_id: mid, storage_path: a.path, nombre_original: a.nombre,
          tipo_mime: a.mime, tamano_bytes: a.tam })));
        for (let i = 0; i < adjFilas.length; i += 200){
          const { error: eA } = await supa.from('mensajes_adjuntos').insert(adjFilas.slice(i, i + 200));
          if (eA) throw eA;
        }
      }

      toast(`✅ Clase enviada a ${enviados} alumno(s) — les llega a su Mi Espacio`);
      cargarHistorial();
      $('ecTitulo').value=''; $('ecTexto').value=''; $('ecArchivos').value=''; $('ecListaArch').textContent='';
      ecLimpiar();
    } catch(e){
      toast('❌ ' + (e.message || 'No se pudo enviar'));
    } finally {
      btn.disabled = false; btn.textContent = '🏠 Enviar';
    }
  };

  boot();
</script>
</body>
</html>
