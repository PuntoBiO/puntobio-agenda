<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revisión HC equipo · PuntoBiO</title>
<style>
  :root { --celeste:#1e9fe0; --negro:#111; --gris:#64748b; --borde:#e2e8f0; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:#f4f6f9; color:var(--negro); }
  header { background:var(--negro); color:#fff; padding:18px 22px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; font-weight:800; }
  header h1 span { color:var(--celeste); }
  .wrap { max-width:1100px; margin:0 auto; padding:18px 16px 60px; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:18px; }
  .kpi { background:#fff; border:1px solid var(--borde); border-radius:12px; padding:14px 16px; }
  .kpi .n { font-size:26px; font-weight:800; color:var(--celeste); }
  .kpi .l { font-size:12px; color:var(--gris); margin-top:2px; }
  .controls { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px; }
  .controls input, .controls select { padding:8px 11px; border:1px solid var(--borde); border-radius:8px; font-size:13px; background:#fff; }
  .controls input { flex:1; min-width:180px; }
  .card { background:#fff; border:1px solid var(--borde); border-radius:12px; margin-bottom:18px; overflow:hidden; }
  .card h2 { font-size:14px; margin:0; padding:13px 16px; border-bottom:1px solid var(--borde); background:#fafbfc; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:9px 14px; border-bottom:1px solid #eef1f4; }
  th { font-size:11px; text-transform:uppercase; letter-spacing:.4px; color:var(--gris); background:#fafbfc; }
  tr:last-child td { border-bottom:none; }
  .pill { display:inline-block; font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; }
  .pill.hc { background:#dbeafe; color:#1e40af; }
  .pill.pdf { background:#dcfce7; color:#15803d; }
  .pill.cero { background:#fee2e2; color:#b91c1c; }
  .pill.ok { background:#dcfce7; color:#15803d; }
  .muted { color:var(--gris); }
  .estado { text-align:center; padding:40px 20px; color:var(--gris); }
  .num { font-variant-numeric:tabular-nums; font-weight:700; }
  .alerta { background:#fff7ed; border:1px solid #fdba74; color:#9a3412; padding:10px 14px; border-radius:10px; font-size:13px; margin-bottom:16px; }
  @media (max-width:560px){ th.opt, td.opt { display:none; } }
</style>
</head>
<body>
<header>
  <h1>👁 Revisión HC <span>Equipo</span></h1>
  <div style="font-size:12px;opacity:.8">Quién abre las historias clínicas y los PDF</div>
</header>
<div class="wrap">
  <div id="contenido"><div class="estado">Cargando bitácora…</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = 'https://bqpjtoiictnzcasxfucf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_yvuXDxrkRrhXwmZBnE_a_Q_zDBz0iDi';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { lock: (name, t, fn) => fn() } });

let accesos = [];
let nombrePorPersona = {};   // persona_id -> nombre (pacientes)
let equipo = [];             // {id, nombre, email}
let hcPorPersona = {};       // persona_id -> {persona_id, dni, total, ultima}
let personasConEval = new Set(); // pacientes cuya HC tiene evaluación cargada (TF)
let filtroTexto = '';
let filtroAccion = 'todas';
let soloSinVer = false;
let soloConEval = true;      // por defecto: solo HC con evaluación cargada
let dias = 30;
let diasHC = 0;   // antigüedad de las HC listadas (0 = todas). El filtro fuerte es "con evaluación".

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmt(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  const hoy = new Date(); const ayer = new Date(); ayer.setDate(hoy.getDate()-1);
  const sameDay = (a,b)=>a.toDateString()===b.toDateString();
  const hh = d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
  if (sameDay(d,hoy)) return 'Hoy ' + hh;
  if (sameDay(d,ayer)) return 'Ayer ' + hh;
  return d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'}) + ' ' + hh;
}
function nombrePac(pid){ return pid==null ? '—' : (nombrePorPersona[pid] || ('Paciente #'+pid)); }
function norm(s){ return String(s||'').toLowerCase().trim(); }

async function cargar() {
  try {
    // Sesión (necesaria para que RLS deje leer la bitácora)
    const { data: { user } } = await sb.auth.getUser();
    if (!user) { mostrarSinAcceso('Iniciá sesión en el sistema y volvé a abrir esta página.'); return; }

    // Equipo (para detectar quién NUNCA abrió nada)
    try {
      const { data: eq } = await sb.from('personas').select('id, nombre, email').eq('es_equipo', true);
      equipo = eq || [];
    } catch(e){ equipo = []; }

    await recargar();
  } catch (e) {
    mostrarSinAcceso('No se pudo cargar: ' + e.message);
  }
}

async function recargar() {
  let q = sb.from('hc_accesos').select('*').order('creado_en', { ascending: false }).limit(3000);
  if (dias > 0) {
    const desde = new Date(); desde.setDate(desde.getDate() - dias);
    q = q.gte('creado_en', desde.toISOString());
  }
  const { data, error } = await q;
  if (error) { mostrarSinAcceso('Solo las administradoras pueden ver la bitácora.\n(' + error.message + ')'); return; }
  accesos = data || [];

  // Cargar TODAS las HC (para listar incluso las que nadie abrió)
  let hcRows = [];
  try {
    const r = await sb.from('historias_clinicas').select('persona_id, dni, completado_en, origen');
    hcRows = r.data || [];
  } catch (e) { hcRows = []; }
  hcPorPersona = {};
  personasConEval = new Set();
  hcRows.forEach(h => {
    if (h.persona_id == null) return;
    if (!hcPorPersona[h.persona_id]) hcPorPersona[h.persona_id] = { persona_id: h.persona_id, dni: h.dni || null, total: 0, ultima: null };
    const g = hcPorPersona[h.persona_id];
    g.total++;
    if (!g.dni && h.dni) g.dni = h.dni;
    if (!g.ultima || (h.completado_en && h.completado_en > g.ultima)) g.ultima = h.completado_en;
    // HC abierta por profesional = tiene evaluación profesional cargada
    if (h.origen === 'profesional') personasConEval.add(h.persona_id);
  });

  // Adjuntos cargados por el equipo (las "Evaluación X.pdf") = también cuentan como evaluación
  try {
    const { data: adjs } = await sb.from('hc_adjuntos').select('persona_id, subido_por_alumno');
    (adjs || []).forEach(a => {
      if (a.persona_id != null && a.subido_por_alumno !== true) personasConEval.add(a.persona_id);
    });
  } catch (e) {}
  // Evaluaciones MOPLEX (si existen) también cuentan
  try {
    const { data: mop } = await sb.from('evaluaciones_moplex').select('persona_id');
    (mop || []).forEach(m => { if (m.persona_id != null) personasConEval.add(m.persona_id); });
  } catch (e) {}

  // Nombres de pacientes (unión: los que tienen accesos + los que tienen HC)
  const ids = [...new Set([
    ...accesos.map(a => a.persona_id),
    ...Object.keys(hcPorPersona).map(Number)
  ].filter(x => x != null))];
  nombrePorPersona = {};
  if (ids.length) {
    try {
      const { data: pers } = await sb.from('personas').select('id, nombre').in('id', ids);
      (pers || []).forEach(p => { nombrePorPersona[p.id] = p.nombre; });
    } catch(e){}
  }
  render();
}

function mostrarSinAcceso(msg) {
  document.getElementById('contenido').innerHTML =
    `<div class="estado"><h3>Sin acceso</h3><p style="white-space:pre-line">${esc(msg)}</p></div>`;
}

function render() {
  const cont = document.getElementById('contenido');
  const t = norm(filtroTexto);

  // --- Resumen por profesional ---
  const porProfe = {};   // email -> {nombre, hc, pdf, ult}
  accesos.forEach(a => {
    const k = norm(a.visor_email) || ('id'+a.visor_persona_id);
    if (!porProfe[k]) porProfe[k] = { nombre: a.visor_nombre || a.visor_email || '—', email: a.visor_email, hc:0, pdf:0, ult:null };
    if (a.accion === 'abrir_pdf') porProfe[k].pdf++; else porProfe[k].hc++;
    if (!porProfe[k].ult || a.creado_en > porProfe[k].ult) porProfe[k].ult = a.creado_en;
  });
  equipo.forEach(p => {
    const k = norm(p.email);
    if (k && !porProfe[k]) porProfe[k] = { nombre: p.nombre, email: p.email, hc:0, pdf:0, ult:null, sinActividad:true };
  });
  const filasProfe = Object.values(porProfe).sort((a,b) => {
    if (!a.ult && b.ult) return 1;
    if (a.ult && !b.ult) return -1;
    if (a.ult && b.ult) return a.ult < b.ult ? 1 : -1;
    return 0;
  });

  const totalHC = accesos.filter(a => a.accion !== 'abrir_pdf').length;
  const totalPDF = accesos.filter(a => a.accion === 'abrir_pdf').length;
  const profesActivos = filasProfe.filter(f => f.ult).length;
  const sinActividad = filasProfe.filter(f => f.sinActividad);

  // --- Quién vio cada paciente (a partir de los accesos) ---
  const viewersPorPac = {}; // persona_id -> { key -> {nombre, hc, pdf, ult} }
  accesos.forEach(a => {
    if (a.persona_id == null) return;
    if (!viewersPorPac[a.persona_id]) viewersPorPac[a.persona_id] = {};
    const m = viewersPorPac[a.persona_id];
    const k = norm(a.visor_email) || (a.visor_nombre || '—');
    if (!m[k]) m[k] = { nombre: a.visor_nombre || a.visor_email || '—', hc:0, pdf:0, ult:null };
    if (a.accion === 'abrir_pdf') m[k].pdf++; else m[k].hc++;
    if (!m[k].ult || a.creado_en > m[k].ult) m[k].ult = a.creado_en;
  });

  // --- Filas por historia clínica ---
  // Lo que importa: HC con EVALUACIÓN cargada (TF). Las de fisio sin evaluación se omiten.
  let cutoffHC = null;
  if (diasHC > 0) {
    const d = new Date(); d.setDate(d.getDate() - diasHC);
    cutoffHC = d.toISOString();
  }
  const pasaBase = (g) => {
    if (soloConEval && !personasConEval.has(g.persona_id)) return false;
    if (cutoffHC && !(g.ultima && g.ultima >= cutoffHC)) return false;
    return true;
  };
  let filasHC = Object.values(hcPorPersona).filter(pasaBase).map(g => {
    const vs = Object.values(viewersPorPac[g.persona_id] || {});
    let ult = null;
    vs.forEach(v => { if (v.ult && (!ult || v.ult > ult)) ult = v.ult; });
    return {
      persona_id: g.persona_id,
      nombre: nombrePac(g.persona_id),
      dni: g.dni,
      total: g.total,
      cargada: g.ultima,              // fecha en que se cargó la HC
      viewers: vs.sort((a,b) => (b.ult||'') < (a.ult||'') ? -1 : 1),
      ultVista: ult
    };
  });
  // Filtros del listado
  filasHC = filasHC.filter(f => {
    if (soloSinVer && f.viewers.length) return false;
    if (!t) return true;
    if (norm(f.nombre).includes(t) || norm(f.dni).includes(t)) return true;
    return f.viewers.some(v => norm(v.nombre).includes(t));
  });
  // Orden: la más recientemente cargada arriba
  filasHC.sort((a,b) => (b.cargada || '') < (a.cargada || '') ? -1 : 1);

  // KPIs sobre el conjunto que importa (HC con evaluación)
  const baseHC = Object.values(hcPorPersona).filter(pasaBase);
  const totalHCpac = baseHC.length;
  const sinVer = baseHC.filter(g => !(viewersPorPac[g.persona_id] && Object.keys(viewersPorPac[g.persona_id]).length)).length;

  // --- Actividad reciente ---
  const recientes = accesos.filter(a => {
    if (filtroAccion === 'hc' && a.accion === 'abrir_pdf') return false;
    if (filtroAccion === 'pdf' && a.accion !== 'abrir_pdf') return false;
    if (!t) return true;
    return norm(a.visor_nombre).includes(t) || norm(nombrePac(a.persona_id)).includes(t) || norm(a.adjunto_nombre).includes(t);
  }).slice(0, 400);

  // ===== HTML =====
  let html = `
    <div class="kpis">
      <div class="kpi"><div class="n">${totalHCpac}</div><div class="l">${soloConEval?'HC con evaluación cargada':'HC en total'}</div></div>
      <div class="kpi"><div class="n" style="color:${sinVer?'#dc2626':'#16a34a'}">${sinVer}</div><div class="l">De esas, sin ver todavía</div></div>
      <div class="kpi"><div class="n">${totalHC}</div><div class="l">Aperturas de HC (${dias>0?'últimos '+dias+' días':'histórico'})</div></div>
      <div class="kpi"><div class="n">${totalPDF}</div><div class="l">PDF / evaluaciones abiertos</div></div>
    </div>`;

  if (sinActividad.length) {
    html += `<div class="alerta">⚠️ <strong>Del equipo, no abrió ninguna HC en este período:</strong> ${sinActividad.map(f => esc(f.nombre)).join(', ')}.</div>`;
  }

  // Filtros (arriba, aplican a todo)
  html += `<div class="controls">
      <input id="fTexto" placeholder="Buscar paciente, DNI o profe…" value="${esc(filtroTexto)}">
      <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--gris);cursor:pointer;font-weight:700">
        <input type="checkbox" id="fEval" ${soloConEval?'checked':''}> Solo con evaluación cargada
      </label>
      <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--gris);cursor:pointer">
        <input type="checkbox" id="fSinVer" ${soloSinVer?'checked':''}> Solo las que nadie vio
      </label>
      <select id="fDiasHC">
        <option value="0">Antigüedad HC: todas</option>
        <option value="30">Cargadas: últimos 30 días</option>
        <option value="60">Cargadas: últimos 60 días</option>
        <option value="90">Cargadas: últimos 90 días</option>
      </select>
      <select id="fDias">
        <option value="7">Ver accesos: últimos 7 días</option>
        <option value="30">Ver accesos: últimos 30 días</option>
        <option value="60">Ver accesos: últimos 60 días</option>
        <option value="0">Ver accesos: todo</option>
      </select>
    </div>`;

  // TABLA PRINCIPAL: Por historia clínica → quién la vio
  html += `<div class="card"><h2>🩺 Historias clínicas con evaluación · quién las vio (${filasHC.length})</h2>
    <table><thead><tr>
      <th>Paciente</th><th class="opt">Cargada</th><th>Vista por</th><th class="opt">Última vez</th>
    </tr></thead><tbody>
    ${filasHC.length ? filasHC.map(f => {
      const chips = f.viewers.length
        ? f.viewers.map(v => `<span class="pill ok" style="margin:2px 3px 2px 0;display:inline-block">${esc(v.nombre)}${v.hc>1?' ·'+v.hc+'×':''}${v.pdf?' 📄':''}</span>`).join('')
        : '<span class="pill cero">Todavía nadie la vio</span>';
      return `<tr>
        <td><strong>${esc(f.nombre)}</strong>${f.total>1?` <span class="muted">(${f.total} HC)</span>`:''}${f.dni?`<div class="muted" style="font-size:11px">DNI ${esc(f.dni)}</div>`:''}</td>
        <td class="opt muted">${f.cargada ? fmt(f.cargada) : '—'}</td>
        <td>${chips}</td>
        <td class="opt muted">${f.ultVista ? fmt(f.ultVista) : '—'}</td>
      </tr>`;
    }).join('') : '<tr><td colspan="4" class="muted" style="text-align:center;padding:24px">No hay HC recientes con ese filtro.</td></tr>'}
    </tbody></table></div>`;

  // Tabla por profesional
  html += `<div class="card"><h2>📊 Por persona del equipo</h2>
    <table><thead><tr>
      <th>Persona</th><th>HC abiertas</th><th>PDF abiertos</th><th>Última vez</th>
    </tr></thead><tbody>
    ${filasProfe.map(f => `<tr>
      <td><strong>${esc(f.nombre)}</strong></td>
      <td class="num">${f.hc}</td>
      <td class="num">${f.pdf}</td>
      <td>${f.ult ? fmt(f.ult) : '<span class="pill cero">Nunca</span>'}</td>
    </tr>`).join('')}
    </tbody></table></div>`;

  // Actividad reciente
  html += `<div class="card"><h2>🕑 Actividad reciente (${recientes.length})</h2>
    <table><thead><tr>
      <th>Cuándo</th><th>Quién</th><th>Acción</th><th>Paciente</th><th class="opt">Archivo</th><th class="opt">Desde</th>
    </tr></thead><tbody>
    ${recientes.length ? recientes.map(a => `<tr>
      <td class="muted">${fmt(a.creado_en)}</td>
      <td><strong>${esc(a.visor_nombre || a.visor_email || '—')}</strong></td>
      <td>${a.accion === 'abrir_pdf' ? '<span class="pill pdf">📄 Abrió PDF</span>' : '<span class="pill hc">🩺 Abrió HC</span>'}</td>
      <td>${esc(nombrePac(a.persona_id))}</td>
      <td class="opt muted">${esc(a.adjunto_nombre || '—')}</td>
      <td class="opt muted">${a.origen === 'agenda' ? 'Agenda' : (a.origen === 'hc_modulo' ? 'Módulo HC' : 'Visor')}</td>
    </tr>`).join('') : '<tr><td colspan="6" class="muted" style="text-align:center;padding:24px">Sin registros con ese filtro.</td></tr>'}
    </tbody></table></div>`;

  cont.innerHTML = html;

  // Reenganchar controles
  const fT = document.getElementById('fTexto');
  const fD = document.getElementById('fDias');
  const fDH = document.getElementById('fDiasHC');
  const fS = document.getElementById('fSinVer');
  const fE = document.getElementById('fEval');
  fD.value = String(dias);
  fDH.value = String(diasHC);
  fT.oninput = () => { filtroTexto = fT.value; const pos = fT.selectionStart; render(); const n = document.getElementById('fTexto'); n.focus(); n.setSelectionRange(pos,pos); };
  fD.onchange = () => { dias = parseInt(fD.value); recargar(); };
  fDH.onchange = () => { diasHC = parseInt(fDH.value); render(); };
  fS.onchange = () => { soloSinVer = fS.checked; render(); };
  fE.onchange = () => { soloConEval = fE.checked; render(); };
}

document.addEventListener('DOMContentLoaded', cargar);
</script>
</body>
</html>
