<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PuntoBiO · Cajas Históricas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-deep: #f1f5f9;
  --bg-card: #ffffff;
  --bg-elev: #ffffff;
  --bg-soft: #f8fafc;
  --border: #e5e7eb;
  --border-bright: #1e9fe0;
  --turquoise: #1e9fe0;
  --turquoise-dim: #0c7bb8;
  --text: #0f172a;
  --text-dim: #64748b;
  --text-faint: #94a3b8;
  --green: #16a34a;
  --amber: #d97706;
  --red: #dc2626;
  --purple: #9333ea;
  --blue: #2563eb;
  --pink: #db2777;
}

body {
  font-family: 'Manrope', system-ui, sans-serif;
  background: var(--bg-deep);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  padding: 32px 40px;
}

body::before {
  content: '';
  position: fixed;
  top: -200px;
  left: 50%;
  transform: translateX(-50%);
  width: 800px;
  height: 800px;
  background: radial-gradient(circle, #f0f9ff 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

.container {
  max-width: 1400px;
  margin: 0 auto;
  position: relative;
  z-index: 1;
}

/* HERO */
.hero { margin-bottom: 28px; animation: fadeUp 0.4s ease; }
.hero-tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 2px;
  color: var(--turquoise);
  text-transform: uppercase;
  margin-bottom: 10px;
}
.hero h1 {
  font-size: 32px;
  font-weight: 800;
  letter-spacing: -1px;
  margin-bottom: 6px;
  line-height: 1.1;
}
.hero h1 .accent { color: var(--turquoise); }
.hero-sub { font-size: 14px; color: var(--text-dim); }

/* TOOLBAR */
.toolbar {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 18px;
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  animation: fadeUp 0.45s ease;
}
.toolbar-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text-faint);
}
.toolbar select {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 7px 12px;
  border-radius: 7px;
  font-family: inherit;
  font-size: 13px;
  outline: none;
  transition: border-color 0.15s;
  cursor: pointer;
}
.toolbar select:hover, .toolbar select:focus { border-color: var(--turquoise); }
.toolbar-spacer { flex: 1; }

.btn {
  background: var(--turquoise);
  color: #ffffff;
  border: none;
  padding: 8px 16px;
  border-radius: 7px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.btn:hover { background: #2cb2f3; transform: translateY(-1px); }
.btn-secondary {
  background: var(--bg-elev);
  color: var(--text);
  border: 1px solid var(--border);
}
.btn-secondary:hover { border-color: var(--turquoise); background: var(--bg-soft); }

/* KPIs GRANDES (totales) */
.kpis-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 14px;
  margin-bottom: 24px;
}
.kpi-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 18px;
  position: relative;
  overflow: hidden;
  transition: all 0.2s;
  animation: fadeUp 0.5s ease both;
}
.kpi-card:hover { border-color: var(--border-bright); transform: translateY(-2px); }
.kpi-card::before {
  content: '';
  position: absolute; top: 0; left: 0;
  width: 3px; height: 100%;
  background: var(--kpi-color, var(--turquoise));
}
.kpi-card.featured {
  background: linear-gradient(135deg, var(--bg-card) 0%, var(--bg-soft) 100%);
}
.kpi-card.featured::before { width: 4px; }
.kpi-label {
  font-size: 11px;
  color: var(--text-dim);
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.kpi-value {
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -0.5px;
  color: var(--kpi-color, var(--turquoise));
  line-height: 1;
  margin-bottom: 6px;
}
.kpi-value.large { font-size: 32px; }
.kpi-sub { font-size: 11px; color: var(--text-faint); }

/* COLS 2 */
.cols-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 24px;
}
.panel {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
  animation: fadeUp 0.6s ease both;
}
.panel-header {
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.panel-title {
  font-size: 13px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}
.panel-link {
  font-size: 11px;
  color: var(--turquoise);
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.panel-body { padding: 8px 12px 12px; }

.list-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 12px;
  border-radius: 7px;
  transition: background 0.15s;
}
.list-row:hover { background: var(--bg-soft); }
.list-row-label {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  color: var(--text);
}
.list-row-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.list-row-value {
  font-weight: 700;
  font-size: 14px;
  color: var(--text);
  font-variant-numeric: tabular-nums;
}

/* TABLA */
.table-panel {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
  animation: fadeUp 0.7s ease both;
}
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th {
  background: var(--bg-elev);
  padding: 10px 14px;
  text-align: left;
  font-weight: 600;
  font-size: 11px;
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-dim);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
  position: sticky;
  top: 0;
}
thead th.numeric { text-align: right; }
tbody td {
  padding: 10px 14px;
  border-bottom: 1px solid #f0f9ff;
  color: var(--text);
}
tbody td.numeric { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
tbody td.dim { color: var(--text-dim); }
tbody td.small { font-size: 12px; }
tbody tr:hover { background: var(--bg-soft); }
tbody tr:last-child td { border-bottom: none; }

/* fila de totales al pie de la tabla */
tfoot td {
  padding: 14px;
  background: var(--bg-soft);
  border-top: 2px solid var(--turquoise);
  font-weight: 800;
  font-size: 14px;
  font-variant-numeric: tabular-nums;
}
tfoot td.numeric { text-align: right; }
tfoot td.label { color: var(--text-dim); font-size: 12px; text-transform: uppercase; letter-spacing: 1px; font-family: 'JetBrains Mono', monospace; }

.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 10px;
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  font-weight: 600;
}
.badge-efectivo { background: rgba(110, 231, 168, 0.15); color: var(--green); }
.badge-debito { background: rgba(96, 165, 250, 0.15); color: var(--blue); }
.badge-transferencia { background: rgba(192, 132, 252, 0.15); color: var(--purple); }
.badge-default { background: rgba(138, 155, 184, 0.15); color: var(--text-dim); }

.badge-area {
  display: inline-block;
  padding: 2px 9px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 700;
}

/* EMPTY / LOADING */
.empty-state { padding: 50px 20px; text-align: center; color: var(--text-faint); }
.empty-state-icon { font-size: 48px; margin-bottom: 14px; display: block; opacity: 0.4; }
.empty-state-title { font-size: 16px; font-weight: 700; color: var(--text-dim); margin-bottom: 6px; }
.empty-state-desc { font-size: 13px; max-width: 360px; margin: 0 auto 18px; }
.loading { padding: 60px 20px; text-align: center; color: var(--text-dim); }
.loading-dot {
  display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  background: var(--turquoise); margin: 0 3px;
  animation: bounce 1.4s infinite ease-in-out both;
}
.loading-dot:nth-child(1) { animation-delay: -0.32s; }
.loading-dot:nth-child(2) { animation-delay: -0.16s; }
@keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

@media (max-width: 768px) {
  body { padding: 20px; }
  .cols-2 { grid-template-columns: 1fr; }
  .hero h1 { font-size: 24px; }
}

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--bg-deep); }
::-webkit-scrollbar-thumb { background: var(--bg-elev); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--border-bright); }
</style>
</head>
<body>

<div class="container">

  <!-- HERO -->
  <div class="hero">
    <div class="hero-tag">Administración · Histórico</div>
    <h1><span class="accent">📚</span> Cajas Históricas</h1>
    <p class="hero-sub" id="hero-sub">Control mensual de todos los cobros de todas las áreas.</p>
  </div>

  <!-- TOOLBAR -->
  <div class="toolbar">
    <span class="toolbar-label">Mes</span>
    <select id="filtro-mes"></select>
    <select id="filtro-anio"></select>
    <span class="toolbar-label">Área</span>
    <select id="filtro-area">
      <option value="">Todas</option>
      <option value="FISIO">Fisio</option>
      <option value="ESPECIALIDADES">Especialidades</option>
      <option value="MASOTERAPIA">Masoterapia</option>
      <option value="BIOLAB">BioLab</option>
      <option value="TF">Terapia Física (TF)</option>
    </select>
    <div class="toolbar-spacer"></div>
    <button class="btn-secondary btn" onclick="cargarDatos()">↻ Recargar</button>
    <button class="btn" onclick="exportarCSV()">⬇ Exportar CSV</button>
  </div>

  <!-- KPIs TOTALES -->
  <div class="kpis-grid" id="kpis-zone"></div>

  <!-- 2 PANELES: por área + por forma de pago -->
  <div class="cols-2" id="paneles-zone"></div>

  <!-- TABLA DETALLE -->
  <div class="table-panel">
    <div class="panel-header">
      <div class="panel-title"><span>📋</span><span>Detalle de cobros</span></div>
      <div class="panel-link" id="detalle-count">— cobros</div>
    </div>
    <div class="table-wrap" id="tabla-zone"></div>
  </div>

</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

const SUPABASE_URL = 'https://bqpjtoiictnzcasxfucf.supabase.co'
const SUPABASE_KEY = 'sb_publishable_yvuXDxrkRrhXwmZBnE_a_Q_zDBz0iDi'
const sb = createClient(SUPABASE_URL, SUPABASE_KEY)

// ======================
// MAPEO PRÁCTICA → ÁREA
// ======================
const PRACTICA_AREA = {
  // FISIO (todas las variantes)
  'FISIO': 'FISIO', 'FISIO_PC': 'FISIO', 'FISIO_SC': 'FISIO', 'FISIO_DESC': 'FISIO', 'FISIO_PQ': 'FISIO',
  // ESPECIALIDADES (incluye terapia manual y RPG)
  'OSTEO': 'ESPECIALIDADES', 'SUELO_PEL': 'ESPECIALIDADES', 'PUNC_SECA': 'ESPECIALIDADES',
  'DRENAJE': 'ESPECIALIDADES', 'TERAPIA_MANUAL': 'ESPECIALIDADES', 'TERAP_MANUAL': 'ESPECIALIDADES', 'RPG': 'ESPECIALIDADES',
  // MASOTERAPIA
  'MASAJES_C': 'MASOTERAPIA', 'MASAJES_CC': 'MASOTERAPIA', 'MASAJES_EYC': 'MASOTERAPIA',
  'MASAJES_PAK': 'MASOTERAPIA', 'MASAJES_R': 'MASOTERAPIA', 'MASAJES_CERO': 'MASOTERAPIA',
  // BIOLAB
  'EVAL': 'BIOLAB', 'MOPLEX': 'BIOLAB',
}

const AREA_LABEL = {
  'FISIO': 'Fisio',
  'ESPECIALIDADES': 'Especialidades',
  'MASOTERAPIA': 'Masoterapia',
  'BIOLAB': 'BioLab',
  'TF': 'Terapia Física',
  'OTRA': 'Otra',
}
const AREA_COLOR = {
  'FISIO': 'var(--blue)',
  'ESPECIALIDADES': 'var(--purple)',
  'MASOTERAPIA': 'var(--pink)',
  'BIOLAB': 'var(--amber)',
  'TF': 'var(--turquoise)',
  'OTRA': 'var(--text-faint)',
}
const AREA_BADGE_BG = {
  'FISIO': 'rgba(37,99,235,0.12)',
  'ESPECIALIDADES': 'rgba(147,51,234,0.12)',
  'MASOTERAPIA': 'rgba(219,39,119,0.12)',
  'BIOLAB': 'rgba(217,119,6,0.12)',
  'TF': 'rgba(30,159,224,0.12)',
  'OTRA': 'rgba(138,155,184,0.12)',
}

// Nombre lindo de cada práctica (para mostrar el detalle dentro del área)
const PRACTICA_LABEL = {
  'FISIO': 'Fisio', 'FISIO_PC': 'Fisio (PC)', 'FISIO_SC': 'Fisio (SC)', 'FISIO_DESC': 'Fisio (desc.)', 'FISIO_PQ': 'Fisio (PQ)',
  'OSTEO': 'Osteopatía', 'SUELO_PEL': 'Suelo pélvico', 'PUNC_SECA': 'Punción seca',
  'DRENAJE': 'DLM (drenaje)', 'TERAPIA_MANUAL': 'Terapia manual', 'TERAP_MANUAL': 'Terapia manual', 'RPG': 'RPG',
  'MASAJES_C': 'Masaje C', 'MASAJES_CC': 'Masaje CC', 'MASAJES_EYC': 'Masaje EyC',
  'MASAJES_PAK': 'Masaje PAK', 'MASAJES_R': 'Masaje R', 'MASAJES_CERO': 'Masaje',
  'EVAL': 'Evaluación', 'MOPLEX': 'MOPLEX',
  'TF': 'Cuota TF',
}

// ======================
// ESTADO
// ======================
let cobros = []  // lista normalizada de todos los cobros del mes

const fmt = n => '$' + Math.round(Number(n) || 0).toLocaleString('es-AR')
function pct(parte, total) { if (!total) return '0%'; return Math.round(parte / total * 100) + '%' }

// ======================
// INIT
// ======================
function init() {
  const hoy = new Date()
  const meses = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre']
  const selMes = document.getElementById('filtro-mes')
  meses.forEach((nombre, i) => {
    const opt = document.createElement('option')
    opt.value = i + 1; opt.textContent = nombre
    if (i + 1 === hoy.getMonth() + 1) opt.selected = true
    selMes.appendChild(opt)
  })
  const selAnio = document.getElementById('filtro-anio')
  const anioActual = hoy.getFullYear()
  for (let y = anioActual - 2; y <= anioActual + 1; y++) {
    const opt = document.createElement('option')
    opt.value = y; opt.textContent = y
    if (y === anioActual) opt.selected = true
    selAnio.appendChild(opt)
  }
  document.getElementById('filtro-mes').addEventListener('change', cargarDatos)
  document.getElementById('filtro-anio').addEventListener('change', cargarDatos)
  document.getElementById('filtro-area').addEventListener('change', renderTodo)
  cargarDatos()
}

// ======================
// CARGAR DATOS (consultorio + TF)
// ======================
window.cargarDatos = async function() {
  document.getElementById('kpis-zone').innerHTML = '<div class="loading" style="grid-column:1/-1;"><span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span></div>'
  document.getElementById('paneles-zone').innerHTML = ''
  document.getElementById('tabla-zone').innerHTML = ''

  const m = Number(document.getElementById('filtro-mes').value)
  const a = Number(document.getElementById('filtro-anio').value)
  const desde = `${a}-${String(m).padStart(2,'0')}-01`
  const ultDia = new Date(a, m, 0).getDate()
  const hasta = `${a}-${String(m).padStart(2,'0')}-${ultDia}`
  const meses = ['','Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre']
  document.getElementById('hero-sub').textContent = `Control mensual · ${meses[m]} ${a}`

  try {
    cobros = []

    // ===== 1) PAGOS CONSULTORIO (Fisio, Especialidades, Masoterapia, BioLab) =====
    const { data: pcData, error: errPC } = await sb
      .from('pagos_consultorio')
      .select('*')
      .gte('fecha', desde).lte('fecha', hasta)
    if (errPC) throw errPC
    const pagosPC = pcData || []

    // Mapear tratamiento → practica_codigo
    const tratIds = [...new Set(pagosPC.map(p => p.tratamiento_id).filter(Boolean))]
    let tratMap = {}
    if (tratIds.length > 0) {
      const { data: tratData } = await sb.from('tratamientos').select('id, practica_codigo').in('id', tratIds)
      ;(tratData || []).forEach(t => tratMap[t.id] = t.practica_codigo)
    }
    // Pacientes en lote
    const persIdsPC = [...new Set(pagosPC.map(p => p.persona_id).filter(Boolean))]
    let pacMapPC = {}
    if (persIdsPC.length > 0) {
      const { data: pacData } = await sb.from('personas').select('id, nombre').in('id', persIdsPC)
      ;(pacData || []).forEach(p => pacMapPC[p.id] = p.nombre)
    }

    pagosPC.forEach(p => {
      const practica = tratMap[p.tratamiento_id] || ''
      const area = PRACTICA_AREA[practica] || 'OTRA'
      cobros.push({
        fecha: p.fecha,
        area,
        practica,
        paciente: pacMapPC[p.persona_id] || `ID ${p.persona_id || '—'}`,
        medio: normMedio(p.medio_pago),
        quien_cobro: (p.quien_cobro || '—').split('(')[0].trim() || '—',
        profesional: p.profesional || '—',
        importe: Number(p.importe) || 0,
        centro: Number(p.monto_centro) || 0,
        prof: Number(p.monto_profesional) || 0,
      })
    })

    // ===== 2) PAGOS TF (todo a PuntoBiO / Centro) =====
    const { data: tfData, error: errTF } = await sb
      .from('pagos_tf')
      .select('id, inscripcion_id, fecha, importe, medio, mes_imputado')
      .gte('fecha', desde).lte('fecha', hasta)
    if (errTF) throw errTF
    const pagosTF = tfData || []

    // inscripcion → persona
    const inscIds = [...new Set(pagosTF.map(p => p.inscripcion_id).filter(Boolean))]
    let inscMap = {}
    if (inscIds.length > 0) {
      const { data: inscData } = await sb.from('inscripciones_tf').select('id, persona_id').in('id', inscIds)
      ;(inscData || []).forEach(i => inscMap[i.id] = i.persona_id)
    }
    const persIdsTF = [...new Set(Object.values(inscMap).filter(Boolean))]
    let pacMapTF = {}
    if (persIdsTF.length > 0) {
      const { data: pacData } = await sb.from('personas').select('id, nombre').in('id', persIdsTF)
      ;(pacData || []).forEach(p => pacMapTF[p.id] = p.nombre)
    }

    pagosTF.forEach(p => {
      const persId = inscMap[p.inscripcion_id]
      const importe = Number(p.importe) || 0
      cobros.push({
        fecha: p.fecha,
        area: 'TF',
        practica: 'TF',
        paciente: pacMapTF[persId] || `ID ${persId || '—'}`,
        medio: normMedio(p.medio),
        quien_cobro: 'PuntoBiO',
        profesional: 'PuntoBiO',
        importe: importe,
        centro: importe,   // TF: todo al centro
        prof: 0,
      })
    })

    // Ordenar por fecha descendente
    cobros.sort((x, y) => (y.fecha || '').localeCompare(x.fecha || ''))

    renderTodo()
  } catch (err) {
    console.error('Error cargando datos:', err)
    document.getElementById('kpis-zone').innerHTML = `
      <div class="empty-state" style="grid-column:1/-1; background:var(--bg-card); border:1px solid var(--border); border-radius:14px;">
        <span class="empty-state-icon">⚠️</span>
        <div class="empty-state-title">Error al cargar</div>
        <div class="empty-state-desc">${err.message}</div>
      </div>`
  }
}

function normMedio(s) {
  const n = (s || '').toString().normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().trim()
  if (n.includes('EFECTIVO')) return 'EFECTIVO'
  if (n.includes('DEBITO')) return 'DEBITO'
  if (n.includes('TRANSFER')) return 'TRANSFERENCIA'
  if (n.includes('CREDITO')) return 'CREDITO'
  return n || '—'
}

// ======================
// RENDER
// ======================
window.renderTodo = function() {
  const areaFiltro = document.getElementById('filtro-area').value
  const lista = areaFiltro ? cobros.filter(c => c.area === areaFiltro) : cobros

  if (lista.length === 0) {
    document.getElementById('kpis-zone').innerHTML = `
      <div class="empty-state" style="grid-column:1/-1; background:var(--bg-card); border:1px solid var(--border); border-radius:14px;">
        <span class="empty-state-icon">📭</span>
        <div class="empty-state-title">Sin cobros en este período</div>
        <div class="empty-state-desc">No hay pagos registrados para el mes y área seleccionados.</div>
      </div>`
    document.getElementById('paneles-zone').innerHTML = ''
    document.getElementById('tabla-zone').innerHTML = ''
    document.getElementById('detalle-count').textContent = '0 cobros'
    return
  }

  renderKPIs(lista)
  renderPaneles(lista)
  renderTabla(lista)
}

function renderKPIs(lista) {
  let total = 0, centro = 0, prof = 0
  lista.forEach(c => { total += c.importe; centro += c.centro; prof += c.prof })

  document.getElementById('kpis-zone').innerHTML = `
    <div class="kpi-card featured" style="--kpi-color: var(--turquoise); grid-column: span 2;">
      <div class="kpi-label">Total cobrado</div>
      <div class="kpi-value large">${fmt(total)}</div>
      <div class="kpi-sub">${lista.length} cobro${lista.length !== 1 ? 's' : ''}</div>
    </div>
    <div class="kpi-card" style="--kpi-color: var(--green);">
      <div class="kpi-label">Quedó al Centro</div>
      <div class="kpi-value">${fmt(centro)}</div>
      <div class="kpi-sub">${pct(centro, total)} del total</div>
    </div>
    <div class="kpi-card" style="--kpi-color: var(--purple);">
      <div class="kpi-label">Para Profesionales</div>
      <div class="kpi-value">${fmt(prof)}</div>
      <div class="kpi-sub">${pct(prof, total)} del total</div>
    </div>
  `
}

function renderPaneles(lista) {
  // Por área
  const porArea = {}
  // Por forma de pago
  const porMedio = {}
  lista.forEach(c => {
    porArea[c.area] = (porArea[c.area] || 0) + c.importe
    porMedio[c.medio] = (porMedio[c.medio] || 0) + c.importe
  })

  const listaAreas = Object.entries(porArea).sort((a,b) => b[1] - a[1])
  const listaMedios = Object.entries(porMedio).sort((a,b) => b[1] - a[1])

  const medioLabel = { 'EFECTIVO':'Efectivo', 'DEBITO':'Débito', 'TRANSFERENCIA':'Transferencia', 'CREDITO':'Crédito' }
  const medioColor = { 'EFECTIVO':'var(--green)', 'DEBITO':'var(--blue)', 'TRANSFERENCIA':'var(--purple)', 'CREDITO':'var(--amber)' }

  document.getElementById('paneles-zone').innerHTML = `
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title"><span>🏷️</span><span>Por área</span></div>
        <div class="panel-link">${listaAreas.length}</div>
      </div>
      <div class="panel-body">
        ${listaAreas.map(([area, monto]) => `
          <div class="list-row">
            <div class="list-row-label">
              <div class="list-row-dot" style="background:${AREA_COLOR[area] || 'var(--text-faint)'};"></div>
              <div>${AREA_LABEL[area] || area}</div>
            </div>
            <div class="list-row-value">${fmt(monto)}</div>
          </div>
        `).join('')}
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <div class="panel-title"><span>💳</span><span>Por forma de pago</span></div>
        <div class="panel-link">${listaMedios.length}</div>
      </div>
      <div class="panel-body">
        ${listaMedios.map(([medio, monto]) => `
          <div class="list-row">
            <div class="list-row-label">
              <div class="list-row-dot" style="background:${medioColor[medio] || 'var(--text-faint)'};"></div>
              <div>${medioLabel[medio] || medio}</div>
            </div>
            <div class="list-row-value">${fmt(monto)}</div>
          </div>
        `).join('')}
      </div>
    </div>
  `
}

function renderTabla(lista) {
  document.getElementById('detalle-count').textContent = lista.length + ' cobro' + (lista.length !== 1 ? 's' : '')

  let totImporte = 0, totCentro = 0, totProf = 0

  const filas = lista.map(c => {
    totImporte += c.importe; totCentro += c.centro; totProf += c.prof
    const fechaTxt = c.fecha ? new Date(c.fecha + 'T12:00').toLocaleDateString('es-AR', { day:'2-digit', month:'2-digit' }) : '—'
    let badgeMedio = 'badge-default'
    if (c.medio === 'EFECTIVO') badgeMedio = 'badge-efectivo'
    else if (c.medio === 'DEBITO') badgeMedio = 'badge-debito'
    else if (c.medio === 'TRANSFERENCIA') badgeMedio = 'badge-transferencia'
    const medioLabel = { 'EFECTIVO':'Efectivo', 'DEBITO':'Débito', 'TRANSFERENCIA':'Transferencia', 'CREDITO':'Crédito' }[c.medio] || c.medio

    return `
      <tr>
        <td class="dim small">${fechaTxt}</td>
        <td>
          <span class="badge-area" style="background:${AREA_BADGE_BG[c.area] || 'rgba(138,155,184,0.12)'}; color:${AREA_COLOR[c.area] || 'var(--text-dim)'};">${AREA_LABEL[c.area] || c.area}</span>
          <div style="font-size:11px; color:var(--text-faint); margin-top:3px;">${PRACTICA_LABEL[c.practica] || c.practica || ''}</div>
        </td>
        <td>${c.paciente}</td>
        <td><span class="badge ${badgeMedio}">${medioLabel}</span></td>
        <td class="dim small">${c.quien_cobro}</td>
        <td class="dim">${c.profesional}</td>
        <td class="numeric">${fmt(c.importe)}</td>
        <td class="numeric dim small">${fmt(c.centro)}</td>
        <td class="numeric dim small">${fmt(c.prof)}</td>
      </tr>
    `
  }).join('')

  document.getElementById('tabla-zone').innerHTML = `
    <table>
      <thead>
        <tr>
          <th>Fecha</th>
          <th>Área</th>
          <th>Paciente / Alumno</th>
          <th>Forma de pago</th>
          <th>Quién cobró</th>
          <th>Profesional</th>
          <th class="numeric">Importe</th>
          <th class="numeric">Centro</th>
          <th class="numeric">Profesional</th>
        </tr>
      </thead>
      <tbody>${filas}</tbody>
      <tfoot>
        <tr>
          <td class="label" colspan="6">Totales del período</td>
          <td class="numeric">${fmt(totImporte)}</td>
          <td class="numeric">${fmt(totCentro)}</td>
          <td class="numeric">${fmt(totProf)}</td>
        </tr>
      </tfoot>
    </table>
  `
}

// EXPORTAR CSV
// ======================
window.exportarCSV = function() {
  const areaFiltro = document.getElementById('filtro-area').value
  const lista = areaFiltro ? cobros.filter(c => c.area === areaFiltro) : cobros
  if (lista.length === 0) { alert('No hay cobros para exportar.'); return }

  const headers = ['Fecha','Area','Practica','Paciente','FormaDePago','QuienCobro','Profesional','Importe','Centro','Profesional']
  const rows = lista.map(c => [
    c.fecha, AREA_LABEL[c.area] || c.area, PRACTICA_LABEL[c.practica] || c.practica || '',
    (c.paciente || '').replace(/[,;]/g,' '),
    c.medio, c.quien_cobro, c.profesional, c.importe, c.centro, c.prof
  ])
  let totI = 0, totC = 0, totP = 0
  lista.forEach(c => { totI += c.importe; totC += c.centro; totP += c.prof })
  rows.push(['TOTALES','','','','','','', totI, totC, totP])

  const csv = [headers.join(';'), ...rows.map(r => r.join(';'))].join('\n')
  const m = document.getElementById('filtro-mes').value
  const a = document.getElementById('filtro-anio').value
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' })
  const url = URL.createObjectURL(blob)
  const link = document.createElement('a')
  link.href = url
  link.download = `caja_historica_${a}_${String(m).padStart(2,'0')}.csv`
  link.click()
  URL.revokeObjectURL(url)
}

init()
