<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PuntoBiO — Centro de Rehabilitación y Entrenamiento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0f1729;
    --navy-soft: #1a2542;
    --turquoise: #1e9fe0;
    --turquoise-dim: #0e8acc;
    --white: #ffffff;
    --gray-100: #f5f7fa;
    --gray-300: #cfd6e0;
    --gray-500: #8892a6;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Manrope', system-ui, -apple-system, sans-serif;
    background: var(--navy);
    color: var(--white);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    overflow-x: hidden;
  }

  /* Sutiles destellos turquesa de fondo */
  body::before, body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.18;
    pointer-events: none;
    z-index: 0;
  }
  body::before {
    top: -120px; left: -120px;
    width: 380px; height: 380px;
    background: var(--turquoise);
  }
  body::after {
    bottom: -120px; right: -120px;
    width: 480px; height: 480px;
    background: var(--turquoise);
  }

  .hub {
    position: relative;
    z-index: 1;
    max-width: 920px;
    width: 100%;
    text-align: center;
  }

  .logo-wrap {
    width: 140px; height: 140px;
    border-radius: 50%;
    background: #ffffff;
    border: 3px solid var(--turquoise);
    margin: 0 auto 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    box-shadow: 0 10px 40px rgba(30, 159, 224, 0.25);
  }
  .logo-wrap img {
    width: 100%; height: 100%;
    object-fit: contain;
    display: block;
  }

  h1 {
    font-size: 56px;
    font-weight: 800;
    letter-spacing: -1.5px;
    margin-bottom: 8px;
  }
  h1 span {
    color: var(--turquoise);
  }

  .subtitle {
    font-size: 17px;
    color: var(--gray-300);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 56px;
    font-weight: 500;
  }

  .cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    max-width: 760px;
    margin: 0 auto;
  }

  .card {
    background: var(--navy-soft);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 40px 32px;
    cursor: pointer;
    text-decoration: none;
    color: var(--white);
    transition: all 0.25s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }
  .card:hover {
    transform: translateY(-4px);
    border-color: var(--turquoise);
    box-shadow: 0 16px 50px rgba(30, 159, 224, 0.18);
  }

  .card-icon {
    width: 72px; height: 72px;
    border-radius: 50%;
    background: rgba(30, 159, 224, 0.12);
    color: var(--turquoise);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s ease;
  }
  .card:hover .card-icon {
    background: var(--turquoise);
    color: var(--navy);
  }
  .card-icon svg {
    width: 36px; height: 36px;
  }

  .card-title {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }
  .card-desc {
    font-size: 14px;
    color: var(--gray-500);
    line-height: 1.5;
    max-width: 240px;
  }
  .card-arrow {
    margin-top: 4px;
    color: var(--turquoise);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  footer {
    position: absolute;
    bottom: 24px;
    left: 0; right: 0;
    text-align: center;
    color: var(--gray-500);
    font-size: 13px;
    font-weight: 500;
    z-index: 1;
  }

  @media (max-width: 640px) {
    h1 { font-size: 40px; }
    .subtitle { font-size: 13px; letter-spacing: 1.5px; margin-bottom: 40px; }
    .cards { grid-template-columns: 1fr; }
    .logo-wrap { width: 110px; height: 110px; }
    .card { padding: 32px 24px; }
  }
</style>
</head>
