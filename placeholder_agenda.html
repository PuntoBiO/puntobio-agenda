<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda · PuntoBiO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg-deep: #0a1020;
  --bg-card: #0f1729;
  --bg-elev: #16213d;
  --border: rgba(30, 159, 224, 0.15);
  --border-bright: rgba(30, 159, 224, 0.4);
  --turquoise: #1e9fe0;
  --text: #e7eef7;
  --text-dim: #8a9bb8;
  --amber: #fbbf6b;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Manrope', system-ui, sans-serif;
  background: var(--bg-deep);
  color: var(--text);
  min-height: 100vh;
  padding: 40px 32px;
  -webkit-font-smoothing: antialiased;
}
.shell { max-width: 920px; margin: 0 auto; }
.breadcrumb {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--turquoise);
  margin-bottom: 16px;
}
.title {
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: 28px;
  font-weight: 700;
  margin-bottom: 8px;
}
.title-icon { font-size: 36px; }
.subtitle {
  color: var(--text-dim);
  font-size: 15px;
  margin-bottom: 32px;
}
.notice-card {
  background: var(--bg-card);
  border: 1px dashed var(--border-bright);
  border-radius: 12px;
  padding: 40px 32px;
  text-align: center;
  margin-bottom: 24px;
}
.notice-icon {
  font-size: 48px;
  margin-bottom: 16px;
  display: block;
}
.notice-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--amber);
  margin-bottom: 10px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  font-family: 'JetBrains Mono', monospace;
}
.notice-text {
  color: var(--text-dim);
  font-size: 14px;
  line-height: 1.7;
  max-width: 540px;
  margin: 0 auto;
}
.notice-text strong { color: var(--text); }
</style>
</head>
<body>
<div class="shell">
  <div class="breadcrumb" id="breadcrumb">— · AGENDA</div>
  <div class="title">
    <span class="title-icon" id="title-icon">📅</span>
    <span id="title-text">Agenda</span>
  </div>
  <div class="subtitle" id="subtitle">Turnos y disponibilidad del área.</div>

  <div class="notice-card">
    <span class="notice-icon">🚧</span>
    <div class="notice-title">Próximamente</div>
    <div class="notice-text">
      La agenda específica de <strong id="area-name">esta área</strong> está en desarrollo. Mientras tanto, podés ver todos los turnos en la <strong>Agenda general</strong> (panel izquierdo, sección General).
    </div>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search)
const area = params.get('area') || 'esta área'
const icon = params.get('icon') || '📅'
document.getElementById('breadcrumb').textContent = area.toUpperCase() + ' · AGENDA'
document.getElementById('title-icon').textContent = icon
document.getElementById('title-text').textContent = 'Agenda ' + area
document.getElementById('subtitle').textContent = 'Turnos y disponibilidad de ' + area + '.'
document.getElementById('area-name').textContent = area
document.title = 'Agenda ' + area + ' · PuntoBiO'
</script>
</body>
</html>
