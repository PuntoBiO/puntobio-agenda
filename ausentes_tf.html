<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>PuntoBiO — Ausentes · Terapia Física</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --azul: #1e9fe0; --azul-soft: #dbeafe; --azul-osc: #0c6ca8;
    --bg: #f8fafc; --bg-card: #ffffff; --bg-hover: #f1f5f9; --border: #e5e7eb;
    --text: #0f172a; --text-dim: #64748b;
    --rojo: #dc2626; --rojo-soft: #fee2e2; --rojo-osc: #991b1b;
    --naranja: #ea580c; --naranja-soft: #ffedd5; --naranja-osc: #9a3412;
    --amarillo: #ca8a04; --amarillo-soft: #fef9c3; --amarillo-osc: #713f12;
    --verde: #16a34a; --verde-soft: #dcfce7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; padding: 20px; }
  h1 { color: var(--azul); margin-bottom: 6px; font-size: 22px; }
  .subtitle { color: var(--text-dim); font-size: 13px; margin-bottom: 18px; }
  .nav-semana { display: flex; gap: 10px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
  .nav-semana button { background: var(--bg-card); border: 1px solid var(--border); padding: 7px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--text); }
  .nav-semana button:hover { background: var(--bg-hover); border-color: var(--azul); }
  .nav-semana .rango { font-weight: 600; color: var(--text); font-size: 14px; padding: 0 8px; }
  .nav-semana .tag-actual { background: var(--azul); color: white; font-size: 11px; padding: 2px 8px; border-radius: 99px; font-weight: 700; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .card-label { color: var(--text-dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .card-value { font-size: 26px; font-weight: 600; color: var(--text); line-height: 1; }
  .card.rojo { border-color: var(--rojo); border-left: 5px solid var(--rojo); }
  .card.rojo .card-value { color: var(--rojo); }
  .card.naranja { border-color: var(--naranja); border-left: 5px solid var(--naranja); }
  .card.naranja .card-value { color: var(--naranja); }
  .card.amarillo { border-color: var(--amarillo); border-left: 5px solid var(--amarillo); }
  .card.amarillo .card-value { color: var(--amarillo); }
  .card-sub { font-size: 11px; color: var(--text-dim); margin-top: 6px; }

  .seccion { margin-bottom: 28px; }
  .seccion-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 2px solid var(--border); }
  .seccion-head h2 { font-size: 16px; font-weight: 700; }
  .seccion-head.rojo h2 { color: var(--rojo-osc); }
  .seccion-head.rojo { border-bottom-color: var(--rojo); }
  .seccion-head.naranja h2 { color: var(--naranja-osc); }
  .seccion-head.naranja { border-bottom-color: var(--naranja); }
  .seccion-head.amarillo h2 { color: var(--amarillo-osc); }
  .seccion-head.amarillo { border-bottom-color: var(--amarillo); }
  .seccion-head .count { background: var(--bg-card); border: 1px solid var(--border); padding: 2px 9px; border-radius: 99px; font-size: 12px; font-weight: 600; color: var(--text-dim); }
  .seccion-help { font-size: 12px; color: var(--text-dim); margin-left: auto; }

  .alumnos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 10px; }
  .alumno-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .alumno-card.rojo { border-left: 4px solid var(--rojo); }
  .alumno-card.naranja { border-left: 4px solid var(--naranja); }
  .alumno-card.amarillo { border-left: 4px solid var(--amarillo); }
  .alumno-nombre { font-size: 14px; font-weight: 600; color: var(--text); }
  .alumno-id { color: var(--text-dim); font-size: 11px; font-weight: 400; margin-left: 4px; }
  .alumno-meta { display: flex; flex-wrap: wrap; gap: 8px; font-size: 12px; color: var(--text-dim); align-items: center; }
  .plan-chip { background: var(--azul-soft); color: var(--azul-osc); padding: 2px 9px; border-radius: 99px; font-size: 11px; font-weight: 600; }
  .ratio-chip { padding: 2px 9px; border-radius: 99px; font-size: 11px; font-weight: 700; }
  .ratio-chip.rojo { background: var(--rojo-soft); color: var(--rojo-osc); }
  .ratio-chip.naranja { background: var(--naranja-soft); color: var(--naranja-osc); }
  .ratio-chip.amarillo { background: var(--amarillo-soft); color: var(--amarillo-osc); }
  .alumno-clases { font-size: 12px; color: var(--text-dim); }
  .alumno-clases ul { list-style: none; padding-left: 0; margin-top: 4px; display: flex; flex-direction: column; gap: 2px; }
  .alumno-clases li { padding-left: 14px; position: relative; font-size: 11px; }
  .alumno-clases li.f::before { content: '✗'; position: absolute; left: 0; color: var(--rojo); font-weight: 700; }
  .alumno-clases li.p::before { content: '✓'; position: absolute; left: 0; color: var(--verde); font-weight: 700; }
  .alumno-clases li.j::before { content: 'i'; position: absolute; left: 0; color: var(--azul); font-weight: 700; font-style: italic; }
  .alumno-acciones { display: flex; gap: 6px; margin-top: 4px; }
  .btn-accion { border: none; padding: 7px 12px; border-radius: 7px; cursor: pointer; font-size: 12px; font-weight: 600; transition: all 0.15s; white-space: nowrap; flex: 1; text-align: center; }
  .btn-wa { background: #25D366; color: white; }
  .btn-wa:hover { background: #1ea14c; }
  .btn-wa:disabled { background: #e5e7eb; color: var(--text-dim); cursor: not-allowed; }
  .btn-copiar { background: var(--azul-soft); color: var(--azul-osc); border: 1px solid var(--azul); }
  .btn-copiar:hover { background: var(--azul); color: white; }
  .btn-tel { background: var(--bg-card); color: var(--text-dim); border: 1px solid var(--border); }
  .btn-tel:hover { background: var(--bg-hover); color: var(--text); }

  .empty, .loading { text-align: center; padding: 40px; color: var(--text-dim); background: var(--bg-card); border: 1px dashed var(--border); border-radius: 10px; }
  .empty.ok { color: var(--verde); background: var(--verde-soft); border-color: var(--verde); }

  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: white; padding: 10px 18px; border-radius: 8px; font-size: 13px; z-index: 9999; opacity: 0; transition: opacity 0.2s; }
  .toast.visible { opacity: 1; }

  /* Modal mensaje sugerido */
  .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.5); display: flex; align-items: center; justify-content: center; z-index: 9000; padding: 20px; }
  .modal { background: white; border-radius: 12px; width: 100%; max-width: 520px; max-height: 80vh; display: flex; flex-direction: column; overflow: hidden; }
  .modal-head { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .modal-head h3 { margin: 0; font-size: 15px; }
  .modal-head button { background: transparent; border: none; font-size: 20px; cursor: pointer; color: var(--text-dim); }
  .modal-body { padding: 14px 18px; overflow-y: auto; }
  .modal-body textarea { width: 100%; min-height: 130px; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font: inherit; font-size: 13px; resize: vertical; }
  .modal-body .info { font-size: 12px; color: var(--text-dim); margin-bottom: 8px; }
  .modal-actions { padding: 12px 18px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; }
  .modal-actions button { padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; }
  .modal-actions .btn-enviar { background: #25D366; color: white; }
  .modal-actions .btn-enviar:hover { background: #1ea14c; }
  .modal-actions .btn-cancelar { background: var(--bg-hover); color: var(--text); border: 1px solid var(--border); }
</style>
</head>
<body>

<h1>📋 Ausentes · Terapia Física</h1>
<div class="subtitle">Relevamiento semanal de alumnos que faltaron. Para enviarles WhatsApp y ver cómo siguen.</div>

<div class="nav-semana">
  <button onclick="cambiarSemana(-1)">← Semana anterior</button>
  <span class="rango" id="rango-semana">—</span>
  <span class="tag-actual" id="tag-actual" style="display:none">ACTUAL</span>
  <button onclick="cambiarSemana(1)">Semana siguiente →</button>
  <button onclick="irSemanaActual()" style="margin-left:auto;background:var(--azul-soft);color:var(--azul-osc);border-color:var(--azul)">Hoy</button>
</div>

<div class="cards" id="cards"></div>

<div id="contenido">
  <div class="loading">Cargando datos de la semana…</div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
  const supa = createClient('https://bqpjtoiictnzcasxfucf.supabase.co', 'sb_publishable_yvuXDxrkRrhXwmZBnE_a_Q_zDBz0iDi', { auth: { lock: (name, acquireTimeout, fn) => fn() } });

  const $ = (id) => document.getElementById(id);

  // === Fecha helpers ===
  function hoyISO() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  function lunesDe(d) {
    const x = new Date(d);
    const dia = x.getDay(); // 0=domingo, 1=lunes, ...
    const diff = (dia === 0 ? -6 : 1 - dia);
    x.setDate(x.getDate() + diff);
    x.setHours(0,0,0,0);
    return x;
  }
  function addDias(d, n) { const x = new Date(d); x.setDate(x.getDate()+n); return x; }
  function toIso(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
  function fmtCorto(d) { return `${d.getDate()}/${d.getMonth()+1}`; }

  const DIAS_NOMBRE = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const DIA_AGENDA_A_INDEX = { 'Lunes':1, 'Martes':2, 'Miércoles':3, 'Miercoles':3, 'Jueves':4, 'Viernes':5 };

  // Estado
  let offsetSemana = 0; // 0 = semana actual, -1 = anterior, +1 = siguiente
  let datos = null; // { alumnosCategorizados, totales }

  function getRangoSemana() {
    const lunesActual = lunesDe(new Date());
    const lunes = addDias(lunesActual, offsetSemana * 7);
    const viernes = addDias(lunes, 4);
    return { lunes, viernes, lunesIso: toIso(lunes), viernesIso: toIso(viernes), sabIso: toIso(addDias(lunes,5)) };
  }

  function actualizarRangoUI() {
    const { lunes, viernes } = getRangoSemana();
    $('rango-semana').textContent = `${fmtCorto(lunes)} — ${fmtCorto(viernes)}`;
    $('tag-actual').style.display = offsetSemana === 0 ? 'inline-block' : 'none';
  }

  // === Limpiar teléfono ===
  function formatearTel(telRaw) {
    if (!telRaw) return '';
    let tel = String(telRaw).replace(/\D/g, '');
    if (!tel) return '';
    if (tel.startsWith('0')) tel = tel.slice(1);
    if (tel.startsWith('15')) tel = tel.slice(2);
    if (!tel.startsWith('54')) tel = '54' + tel;
    if (!tel.startsWith('549')) tel = '549' + tel.slice(2);
    return tel;
  }

  function nombreCorto(nombre) {
    if (!nombre) return '';
    return nombre.trim().split(' ')[0];
  }

  // Capitalizar nombres tipo "JUAN PEREZ" → "Juan Perez"
  function tt(s) {
    if (!s) return '';
    return String(s).toLowerCase().split(' ').map(p => p.charAt(0).toUpperCase() + p.slice(1)).join(' ');
  }

  // === Cargar todo ===
  async function cargarSemana() {
    $('contenido').innerHTML = '<div class="loading">Cargando…</div>';
    $('cards').innerHTML = '';

    const { lunesIso, viernesIso, sabIso } = getRangoSemana();
    const hoy = hoyISO();

    try {
      // En paralelo: todo lo que necesitamos
      const [insR, perR, turR, taR, agR, asR, feR, ccR] = await Promise.all([
        // 1) Inscripciones ACTIVAS (excluimos bonificados sin cuota — no se reclaman)
        supa.from('inscripciones_tf').select('id, persona_id, plan, estado, fecha_alta, fecha_reingreso').eq('estado','ACTIVO').neq('plan','COD0BON'),
        // 2) Personas (para nombre + tel) — select * para no fallar si alguna col no existe
        supa.from('personas').select('*'),
        // 3) Turnos (catálogo: id, día, hora, servicio)
        supa.from('turnos').select('id, dia, hora, servicio, capacidad'),
        // 4) Turno_alumnos activos (fijos)
        supa.from('turno_alumnos').select('persona_id, turno_id, fecha_desde, activo').eq('activo', true),
        // 5) Agregados puntuales DENTRO de la semana
        //    Importante: NO filtrar por activo=true — esa columna puede ser NULL en recuperatorios.
        //    La agenda en producción no filtra por activo. Lo único que importa es la fecha.
        supa.from('turno_agregados').select('persona_id, turno_id, fecha, tipo').gte('fecha', lunesIso).lt('fecha', sabIso),
        // 6) Asistencias de la semana
        supa.from('asistencia').select('persona_id, turno_id, fecha, estado').gte('fecha', lunesIso).lt('fecha', sabIso),
        // 7) Feriados de la semana
        supa.from('feriados').select('fecha, motivo').gte('fecha', lunesIso).lt('fecha', sabIso),
        // 8) Clases cerradas (informativo, no excluye del conteo)
        supa.from('clases_cerradas').select('turno_id, fecha').gte('fecha', lunesIso).lt('fecha', sabIso)
      ]);

      if (insR.error) throw new Error('inscripciones: ' + insR.error.message);
      if (perR.error) throw new Error('personas: ' + perR.error.message);
      if (turR.error) throw new Error('turnos: ' + turR.error.message);
      if (taR.error) throw new Error('turno_alumnos: ' + taR.error.message);

      const inscripciones = insR.data || [];
      const personasMap = {};
      (perR.data || []).forEach(p => { personasMap[p.id] = p; });
      const turnosMap = {};
      (turR.data || []).forEach(t => { turnosMap[t.id] = t; });

      // Set de fechas de feriados (esas clases no se le imputan a nadie)
      const fechasBloqueadas = new Set();
      (feR.data || []).forEach(f => { if (f.fecha) fechasBloqueadas.add(f.fecha); });

      // Índice de asistencia por (persona, turno, fecha)
      const asiMap = {};
      (asR.data || []).forEach(a => {
        asiMap[`${a.persona_id}-${a.turno_id}-${a.fecha}`] = a.estado;
      });

      // Cierre por (turno, fecha)
      const cierreSet = new Set();
      (ccR.data || []).forEach(c => cierreSet.add(`${c.turno_id}-${c.fecha}`));

      // Fechas de la semana
      const { lunes } = getRangoSemana();
      const fechasSemana = [0,1,2,3,4].map(i => toIso(addDias(lunes, i))); // lun a vie

      // Cantidad de clases por semana según el código del plan (COD1=1, COD2=2, COD3=3, COD2DES3=2, COD3ROT=3, etc.)
      function clasesPorSemanaDelPlan(plan) {
        if (!plan) return 0;
        const m = String(plan).toUpperCase().match(/COD\s*0*([1-9])/);
        return m ? Number(m[1]) : 0;
      }

      // ==== Por cada inscripción, computar asistencia REAL vs lo que pide su plan ====
      // Lógica clave (lo que pidió Lu):
      //   - Lo que importa NO es a cuántos turnos asignados fue, sino cuántas clases CUMPLIÓ
      //     respecto a las que pide su plan semanal.
      //   - Si un alumno COD2 (2 clases/sem) faltó al fijo del martes PERO hizo un recuperatorio
      //     el miércoles → vino 1 clase. Si además vino al jueves → vino 2 = cumplió ✓
      //   - Los recuperatorios + sueltos cuentan como "vino" si fue presente.
      //   - Las faltas a fijos cuentan como "no vino".
      //   - Comparamos contra "esperadas hasta hoy" (sus clases fijas que ya pasaron en la semana)
      //     para ser justos antes de que termine la semana.
      const alumnos = [];
      inscripciones.forEach(insc => {
        const persona = personasMap[insc.persona_id];
        if (!persona) return;
        const planN = clasesPorSemanaDelPlan(insc.plan);
        if (planN === 0) return; // BON o plan sin patrón → no se evalúa

        const fechaInicioStr = insc.fecha_reingreso || insc.fecha_alta;
        const fechaInicio = fechaInicioStr ? new Date(fechaInicioStr + 'T00:00:00') : null;

        const fijosDelAlumno = (taR.data || []).filter(ta => ta.persona_id === insc.persona_id);
        const agregadosDelAlumno = (agR.data || []).filter(ag => ag.persona_id === insc.persona_id);

        // ---- Construir lista de clases EVALUABLES (ya pasaron o son de hoy con estado marcado) ----
        const eventos = []; // { fechaIso, fechaObj, turno, tipo, estado, evaluable }

        fijosDelAlumno.forEach(ta => {
          const turno = turnosMap[ta.turno_id];
          if (!turno) return;
          const idx = DIA_AGENDA_A_INDEX[turno.dia];
          if (!idx) return;
          const fechaTurno = addDias(lunes, idx - 1);
          const fechaIso = toIso(fechaTurno);
          if (fechasBloqueadas.has(fechaIso)) return;
          const fechaDesdeFijo = ta.fecha_desde ? new Date(ta.fecha_desde + 'T00:00:00') : null;
          const fechaInicioAlumno = fechaDesdeFijo || fechaInicio;
          if (fechaInicioAlumno && fechaTurno < fechaInicioAlumno) return;
          const key = `${insc.persona_id}-${turno.id}-${fechaIso}`;
          const est = asiMap[key];
          const esFutura = fechaIso > hoy;
          const esHoy = fechaIso === hoy;
          // Evaluable = ya pasó (estricto) o es hoy y ya está marcado
          const evaluable = !esFutura && !(esHoy && !est);
          eventos.push({ fechaIso, fechaObj: fechaTurno, turno, tipo: 'fijo', estado: est, evaluable });
        });

        agregadosDelAlumno.forEach(ag => {
          const turno = turnosMap[ag.turno_id];
          if (!turno) return;
          const fechaObj = new Date(ag.fecha + 'T00:00:00');
          if (fechasBloqueadas.has(ag.fecha)) return;
          const key = `${insc.persona_id}-${turno.id}-${ag.fecha}`;
          const est = asiMap[key];
          const esFutura = ag.fecha > hoy;
          const esHoy = ag.fecha === hoy;
          const evaluable = !esFutura && !(esHoy && !est);
          const tipoEvento = (ag.tipo === 'recuperatorio' || ag.tipo === 'recupero') ? 'recupero' : (ag.tipo || 'suelto');
          eventos.push({ fechaIso: ag.fecha, fechaObj, turno, tipo: tipoEvento, estado: est, evaluable });
        });

        // Solo eventos evaluables
        const evals = eventos.filter(e => e.evaluable);

        // Clases del plan que ya deberían haberse cumplido hasta hoy = #fijos evaluables
        const fijosEvaluables = evals.filter(e => e.tipo === 'fijo').length;
        // Esperadas = lo que pide el plan (N), acotado por los fijos que YA pasaron en la semana
        // (si el alumno tiene solo 1 fijo en la semana porque arrancó tarde, esperadas = 1, no 2)
        const esperadasHastaHoy = Math.min(planN, fijosEvaluables);
        // Si todavía no le tocó ninguna clase esta semana, no lo evaluamos
        if (esperadasHastaHoy === 0) return;

        // Presentes = TOTAL de presentes en la semana (fijos + recuperos + sueltos)
        // — un recupero al que fue cuenta para cumplir su cuota.
        const presentes = evals.filter(e => e.estado === 'presente').length;
        const justificadas = evals.filter(e => e.estado === 'ausente-justificada').length;

        // Si cumplió (vino igual o más que lo esperado hasta hoy), no aparece
        if (presentes >= esperadasHastaHoy) return;

        // Armar detalle para mostrar (todos los eventos evaluables, ordenados por fecha)
        const detalle = evals.map(e => ({
          fechaIso: e.fechaIso,
          fechaObj: e.fechaObj,
          dia: e.turno.dia,
          hora: e.turno.hora,
          servicio: e.turno.servicio,
          tipo: e.tipo, // 'fijo' | 'recupero' | 'suelto'
          estado: e.estado === 'presente' ? 'p' : (e.estado === 'ausente-justificada' ? 'j' : 'f')
        })).sort((a, b) => a.fechaObj - b.fechaObj);

        alumnos.push({
          insc_id: insc.id,
          persona_id: insc.persona_id,
          nombre: persona.nombre || '',
          plan: insc.plan,
          tel: persona.telefono || persona.celular || persona.tel || persona.phone || '',
          planN,                  // lo que pide el plan (2 para COD2)
          esperadas: esperadasHastaHoy,  // lo que debería haber cumplido hasta hoy
          presentes,              // lo que efectivamente vino
          justificadas,
          detalle
        });
      });

      // Categorización en 2 grupos: AUSENTE TOTAL (no vino a nada) y PARCIAL (vino algunas, faltan algunas)
      const ausenteTotal = alumnos.filter(a => a.presentes === 0);
      const ausenteParcial = alumnos.filter(a => a.presentes > 0);

      // Ordenar: los que más faltaron arriba
      ausenteTotal.sort((a,b) => b.esperadas - a.esperadas || a.nombre.localeCompare(b.nombre));
      ausenteParcial.sort((a,b) => (a.presentes/a.esperadas) - (b.presentes/b.esperadas) || a.nombre.localeCompare(b.nombre));

      datos = { ausenteTotal, ausenteParcial, totalEvaluados: alumnos.length };
      renderTodo();
    } catch (err) {
      console.error(err);
      $('contenido').innerHTML = `<div class="empty">❌ Error al cargar: ${err.message}</div>`;
    }
  }

  function renderTodo() {
    if (!datos) return;
    const { ausenteTotal, ausenteParcial, totalEvaluados } = datos;

    // Cards superiores
    $('cards').innerHTML = `
      <div class="card">
        <div class="card-label">Alumnos evaluados</div>
        <div class="card-value">${totalEvaluados}</div>
        <div class="card-sub">Activos con clases ya pasadas en la semana, sin cumplir su plan</div>
      </div>
      <div class="card rojo">
        <div class="card-label">Ausente total</div>
        <div class="card-value">${ausenteTotal.length}</div>
        <div class="card-sub">No vino a NINGUNA clase ni recupero</div>
      </div>
      <div class="card naranja">
        <div class="card-label">Ausencia parcial</div>
        <div class="card-value">${ausenteParcial.length}</div>
        <div class="card-sub">Vino a algunas, le faltó cumplir el plan</div>
      </div>
    `;

    // Secciones
    $('contenido').innerHTML = `
      ${renderSeccion('rojo', '🔴 Ausente total', 'No vino a ninguna clase de la semana (ni fija ni recupero)', ausenteTotal)}
      ${renderSeccion('naranja', '🟠 Ausencia parcial', 'Vino a algunas pero no cumplió todavía las que pide su plan', ausenteParcial)}
      ${ausenteTotal.length === 0 && ausenteParcial.length === 0
        ? '<div class="empty ok">🎉 ¡Excelente! Todos los alumnos cumplieron su plan esta semana.</div>'
        : ''}
    `;
  }

  function renderSeccion(color, titulo, ayuda, lista) {
    if (lista.length === 0) return '';
    return `
      <div class="seccion">
        <div class="seccion-head ${color}">
          <h2>${titulo}</h2>
          <span class="count">${lista.length}</span>
          <span class="seccion-help">${ayuda}</span>
        </div>
        <div class="alumnos-grid">
          ${lista.map(a => renderAlumnoCard(a, color)).join('')}
        </div>
      </div>
    `;
  }

  function renderAlumnoCard(a, color) {
    const tel = formatearTel(a.tel);
    const detalleHtml = a.detalle.map(d => {
      const cls = d.estado; // p|f|j
      const labelEst = d.estado === 'p' ? 'Vino' : (d.estado === 'j' ? 'Justificada' : 'Faltó');
      const etiquetaTipo = d.tipo === 'recupero' ? ' (recupero)' : (d.tipo === 'suelto' ? ' (suelto)' : '');
      return `<li class="${cls}">${d.dia.slice(0,3)} ${fmtCorto(d.fechaObj)} ${d.hora} · ${d.servicio.slice(0,4)}${etiquetaTipo} — ${labelEst}</li>`;
    }).join('');

    const btnWA = tel
      ? `<button class="btn-accion btn-wa" onclick="abrirWA(${a.persona_id})" title="Enviar WhatsApp">💬 WhatsApp</button>`
      : `<button class="btn-accion btn-wa" disabled title="Sin teléfono cargado">⚠️ Sin tel</button>`;
    const btnCopiar = `<button class="btn-accion btn-copiar" onclick="abrirMensaje(${a.persona_id})" title="Ver y editar mensaje">✏️ Mensaje</button>`;
    const btnTel = a.tel
      ? `<button class="btn-accion btn-tel" onclick="copiarTel(${a.persona_id})" title="${a.tel}">📋 Tel</button>`
      : '';

    // Texto del ratio: vino / esperadas (con planN entre paréntesis si difiere)
    const sufijoPlan = a.esperadas < a.planN ? ` <span style="opacity:.7">(plan ${a.planN})</span>` : '';

    return `
      <div class="alumno-card ${color}">
        <div>
          <span class="alumno-nombre">${tt(a.nombre)}</span>
          <span class="alumno-id">#${a.persona_id}</span>
        </div>
        <div class="alumno-meta">
          <span class="plan-chip">${a.plan}</span>
          <span class="ratio-chip ${color}">${a.presentes}/${a.esperadas} clases${sufijoPlan}${a.justificadas>0?` · ${a.justificadas} just.`:''}</span>
        </div>
        <div class="alumno-clases">
          <strong style="font-size:11px;color:var(--text-dim)">Clases de la semana:</strong>
          <ul>${detalleHtml}</ul>
        </div>
        <div class="alumno-acciones">${btnWA}${btnCopiar}${btnTel}</div>
      </div>
    `;
  }

  // ===== Mensaje sugerido para WhatsApp =====
  function mensajePorDefecto(a) {
    const primer = nombreCorto(tt(a.nombre));
    if (a.presentes === 0) {
      return `Hola ${primer}! 👋 Soy de PuntoBiO. Esta semana no te vimos por el centro, ¿está todo bien? Si necesitás reprogramar o tenés alguna duda contame, ¡te esperamos! 💪`;
    }
    return `Hola ${primer}! 👋 Te extrañamos en alguna clase esta semana (${a.presentes}/${a.esperadas}). ¿Pasó algo? Si necesitás cambiar de horario o sumar un recupero, contame ✨`;
  }

  window.abrirWA = function(personaId) {
    const a = todosLosAlumnos().find(x => x.persona_id === personaId);
    if (!a) return;
    const tel = formatearTel(a.tel);
    if (!tel) { mostrarToast('⚠️ Este alumno no tiene teléfono cargado'); return; }
    const msg = mensajePorDefecto(a);
    window.open(`https://wa.me/${tel}?text=${encodeURIComponent(msg)}`, '_blank');
  };

  window.abrirMensaje = function(personaId) {
    const a = todosLosAlumnos().find(x => x.persona_id === personaId);
    if (!a) return;
    const tel = formatearTel(a.tel);
    const msg = mensajePorDefecto(a);
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
    overlay.innerHTML = `
      <div class="modal">
        <div class="modal-head">
          <h3>💬 Mensaje para ${tt(a.nombre)}</h3>
          <button onclick="this.closest('.modal-overlay').remove()">✕</button>
        </div>
        <div class="modal-body">
          <div class="info">${a.tel ? `Tel: <strong>${a.tel}</strong>` : '⚠️ Sin teléfono cargado'} · ${a.presentes}/${a.esperadas} clases esta semana</div>
          <textarea id="msg-edit">${msg}</textarea>
        </div>
        <div class="modal-actions">
          <button class="btn-cancelar" onclick="this.closest('.modal-overlay').remove()">Cancelar</button>
          <button class="btn-copiar" style="background:var(--azul-soft);color:var(--azul-osc);border:1px solid var(--azul);padding:8px 16px" onclick="navigator.clipboard.writeText(document.getElementById('msg-edit').value).then(()=>{mostrarToast('✓ Mensaje copiado')})">📋 Copiar</button>
          ${tel ? `<button class="btn-enviar" onclick="window.open('https://wa.me/${tel}?text='+encodeURIComponent(document.getElementById('msg-edit').value),'_blank');this.closest('.modal-overlay').remove()">💬 Enviar por WhatsApp</button>` : ''}
        </div>
      </div>`;
    document.body.appendChild(overlay);
  };

  window.copiarTel = function(personaId) {
    const a = todosLosAlumnos().find(x => x.persona_id === personaId);
    if (!a || !a.tel) return;
    navigator.clipboard.writeText(a.tel).then(() => mostrarToast(`✓ Tel copiado: ${a.tel}`));
  };

  function todosLosAlumnos() {
    if (!datos) return [];
    return [...datos.ausenteTotal, ...datos.ausenteParcial];
  }

  function mostrarToast(texto) {
    const t = $('toast');
    t.textContent = texto;
    t.classList.add('visible');
    setTimeout(() => t.classList.remove('visible'), 2200);
  }
  window.mostrarToast = mostrarToast;

  window.cambiarSemana = function(delta) {
    offsetSemana += delta;
    actualizarRangoUI();
    cargarSemana();
  };
  window.irSemanaActual = function() {
    offsetSemana = 0;
    actualizarRangoUI();
    cargarSemana();
  };

  // Init
  actualizarRangoUI();
  cargarSemana();
</script>

</body>
</html>
