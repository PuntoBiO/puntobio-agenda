<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PuntoBiO · Nuevo Cobro</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --color-bg: #ffffff;
    --color-bg-secondary: #f8f7f3;
    --color-bg-info: #e6f1fb;
    --color-bg-warning: #faeeda;
    --color-text: #1f1f1d;
    --color-text-secondary: #6b6b66;
    --color-text-tertiary: #9a9a93;
    --color-text-info: #185fa5;
    --color-text-warning: #854f0b;
    --color-border: rgba(0,0,0,0.12);
    --color-border-info: rgba(24,95,165,0.3);
    --color-border-warning: rgba(133,79,11,0.3);
    --border-radius: 8px;
    --border-radius-lg: 12px;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    font-family: var(--font-sans);
    background: var(--color-bg-secondary);
    color: var(--color-text);
    margin: 0;
    padding: 24px;
    line-height: 1.5;
  }
  .container {
    max-width: 720px;
    margin: 0 auto;
    background: var(--color-bg);
    border-radius: var(--border-radius-lg);
    border: 0.5px solid var(--color-border);
    padding: 24px 28px;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    padding-bottom: 14px;
    border-bottom: 0.5px solid var(--color-border);
  }
  .header-title { font-size: 18px; font-weight: 500; }
  .header-subtitle { font-size: 12px; color: var(--color-text-secondary); }
  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 14px;
  }
  label {
    display: block;
    font-size: 12px;
    color: var(--color-text-secondary);
    margin-bottom: 4px;
  }
  input, select {
    width: 100%;
    padding: 8px 12px;
    border: 0.5px solid var(--color-border);
    border-radius: var(--border-radius);
    font-size: 14px;
    background: white;
    font-family: inherit;
    color: var(--color-text);
  }
  input:focus, select:focus {
    outline: 2px solid var(--color-text-info);
    outline-offset: -1px;
  }
  button {
    padding: 8px 16px;
    border: 0.5px solid var(--color-border);
    background: white;
    border-radius: var(--border-radius);
    cursor: pointer;
    font-size: 14px;
    font-family: inherit;
    transition: all 0.15s;
    color: var(--color-text);
  }
  button:hover { background: var(--color-bg-secondary); }
  button.active {
    background: var(--color-bg-info);
    color: var(--color-text-info);
    border-color: var(--color-border-info);
  }
  .toggle-row { display: flex; gap: 8px; }
  .toggle-row button { flex: 1; }
  .hidden { display: none !important; }
  .box-warning {
    padding: 12px 14px;
    background: var(--color-bg-warning);
    border-radius: var(--border-radius);
    border: 0.5px solid var(--color-border-warning);
    margin-bottom: 14px;
  }
  .box-warning label { color: var(--color-text-warning); font-weight: 500; }
  .box-info {
    padding: 12px 14px;
    background: var(--color-bg-info);
    border-radius: var(--border-radius);
    border: 0.5px solid var(--color-border-info);
    margin-bottom: 14px;
  }
  .box-info label { color: var(--color-text-info); font-weight: 500; }
  .box-secondary {
    padding: 14px 16px;
    background: var(--color-bg-secondary);
    border-radius: var(--border-radius);
    margin-bottom: 14px;
  }
  .split-cards {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
  }
  .split-card { transition: all 0.2s; }
  .split-card.zero { opacity: 0.4; }
  .split-card-label { font-size: 11px; color: var(--color-text-secondary); }
  .split-card-value { font-size: 18px; font-weight: 500; }
  .btn-primary {
    background: var(--color-text-info);
    color: white;
    border: none;
    font-weight: 500;
    padding: 10px 20px;
  }
  .btn-primary:hover { opacity: 0.9; background: var(--color-text-info); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .info-text { font-size: 11px; margin-top: 4px; font-style: italic; color: var(--color-text-secondary); }
  .toast {
    position: fixed;
    top: 20px;
    right: 20px;
    padding: 12px 16px;
    border-radius: var(--border-radius);
    font-size: 14px;
    z-index: 1000;
    opacity: 0;
    transform: translateY(-10px);
    transition: all 0.3s;
    max-width: 400px;
  }
  .toast.show {
    opacity: 1;
    transform: translateY(0);
  }
  .toast.success { background: #d4edda; color: #155724; border: 0.5px solid #c3e6cb; }
  .toast.error { background: #f8d7da; color: #721c24; border: 0.5px solid #f5c6cb; }
  .loading {
    text-align: center;
    padding: 40px;
    color: var(--color-text-secondary);
  }
</style>
</head>
<body>

<!-- ============================================================
     INICIO MÓDULO CAJA - NUEVO COBRO
     Para integrar al app.html: copiar este <div class="container">
     entero + el <script> de abajo. El CSS también.
     ============================================================ -->
<div class="container" id="modulo-caja-cobro">
  <div class="header">
    <div>
      <div class="header-title">Nuevo cobro</div>
      <div class="header-subtitle">PuntoBiO · Caja</div>
    </div>
    <div class="header-subtitle" id="ticket-info">Cargando...</div>
  </div>

  <div id="loading-zone" class="loading">Cargando datos de Supabase...</div>

  <div id="form-zone" class="hidden">

    <!-- Paciente + Profesional -->
    <div class="grid-2">
      <div>
        <label>Paciente</label>
        <input type="text" id="paciente-input" list="lista-pacientes" placeholder="Escribí el nombre...">
        <datalist id="lista-pacientes"></datalist>
      </div>
      <div>
        <label>Profesional que atendió</label>
        <select id="profesional"></select>
      </div>
    </div>

    <!-- Modalidad -->
    <div style="margin-bottom: 14px;">
      <label>Modalidad</label>
      <div class="toggle-row">
        <button class="active" id="btn-particular" type="button">Particular</button>
        <button id="btn-obrasocial" type="button">Obra Social</button>
      </div>
      <select id="obrasocial" class="hidden" style="margin-top: 8px;">
        <!-- Se llena dinámicamente desde tarifario_precios -->
      </select>
    </div>

    <!-- Práctica + Tipo cobro -->
    <div class="grid-2">
      <div>
        <label>Práctica</label>
        <select id="practica"></select>
      </div>
      <div>
        <label>Tipo de cobro</label>
        <select id="tipo">
          <option value="NORMAL">Normal (35/65)</option>
          <option value="SOLO_CENTRO">Solo Centro (PB cobra, prof regala)</option>
          <option value="SOLO_PROF">Solo Profesional (prof cobra, PB regala)</option>
          <option value="CORTESIA">Cortesía total (nadie cobra)</option>
          <option value="MANUAL">Manual</option>
        </select>
      </div>
    </div>

    <!-- Descuento libre -->
    <div class="box-warning">
      <label>Descuento libre <span style="font-weight: 400; opacity: 0.75;">(opcional)</span></label>
      <div style="display: flex; gap: 8px; align-items: stretch;">
        <input type="number" id="desc-valor" placeholder="0" min="0" value="0" style="flex: 1;">
        <button class="active" id="btn-pct" type="button">% Porcentaje</button>
        <button id="btn-fijo" type="button">$ Monto fijo</button>
      </div>
      <div class="info-text" style="color: var(--color-text-warning);">Se aplica al precio lista antes del reparto</div>
    </div>

    <!-- Monto + Método pago -->
    <div class="grid-2">
      <div>
        <label>Monto a cobrar al paciente</label>
        <input type="text" id="monto" readonly style="background: var(--color-bg-secondary); font-weight: 500; font-size: 15px;">
        <div class="info-text" id="precio-info">Precio lista completo</div>
      </div>
      <div>
        <label>Método de pago</label>
        <select id="metodo">
          <option>Efectivo</option>
          <option>Transferencia</option>
          <option>Débito</option>
          <option>Crédito</option>
        </select>
      </div>
    </div>

    <!-- Quien recibió la plata -->
    <div class="box-info">
      <label>Quién recibió la plata</label>
      <select id="quien-cobro" style="background: white;">
        <option>Centro / Recepción</option>
        <option>Bruno (transferencia directa)</option>
        <option>Male (transferencia directa)</option>
        <option>Vero (transferencia directa)</option>
      </select>
      <div class="info-text" style="color: var(--color-text-info);">Si lo recibió un profesional, se descuenta en su liquidación mensual</div>
    </div>

    <!-- Reparto automático -->
    <div class="box-secondary">
      <div style="font-size: 12px; color: var(--color-text-secondary); font-weight: 500; margin-bottom: 10px;">Reparto automático</div>
      <div class="split-cards">
        <div class="split-card" id="card-centro">
          <div class="split-card-label">Centro PB</div>
          <div class="split-card-value" id="split-centro">$0</div>
        </div>
        <div class="split-card" id="card-prof">
          <div class="split-card-label">Profesional</div>
          <div class="split-card-value" id="split-prof">$0</div>
        </div>
        <div class="split-card zero" id="card-moplex">
          <div class="split-card-label">MoPlex</div>
          <div class="split-card-value" id="split-moplex">$0</div>
        </div>
      </div>
      <div class="info-text" id="reparto-info">Seleccioná los datos para calcular</div>
    </div>

    <!-- Observaciones -->
    <div style="margin-bottom: 14px;">
      <label>Observaciones (opcional)</label>
      <input type="text" id="observaciones" placeholder="Ej: motivo de cortesía, nota libre...">
    </div>

    <!-- Botones -->
    <div style="display: flex; gap: 8px;">
      <button class="btn-primary" id="btn-registrar" style="flex: 1;" type="button">Registrar cobro</button>
      <button id="btn-limpiar" type="button">Limpiar</button>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>
<!-- ============================================================
     FIN MÓDULO CAJA
     ============================================================ -->

<script>
// ============================================================
// CONFIGURACIÓN - REEMPLAZÁ TU ANON KEY ACÁ ABAJO
// ============================================================
const SUPABASE_URL = 'https://bqpjtoiictnzcasxfucf.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_yvuXDxrkRrhXwmZBnE_a_Q_zDBz0iDi';
// Para obtenerla: Supabase Dashboard → Settings (⚙️) → API → "anon public" key
// La copiás (es largota, empieza con "eyJ...") y la pegás arriba reemplazando 'TU_ANON_KEY_VA_ACA'
// ============================================================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Estado global
let PACIENTES = [];
let PRACTICAS = [];
let SPLITS = [];
let PRECIOS = [];  // ahora traemos de tarifario_precios
let OBRAS_SOCIALES = [];  // lista única de OS con precios cargados
const PROFESIONALES = ['Bruno','Male','Vero','Lu','Jime'];
let descTipo = 'pct';

const fmt = n => '$' + Math.round(n).toLocaleString('es-AR');

function toast(msg, tipo) {
  tipo = tipo || 'success';
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast ' + tipo + ' show';
  setTimeout(function() { el.classList.remove('show'); }, 3500);
}

async function cargarDatos() {
  try {
    // Cargar prácticas activas
    const { data: practicas, error: errPr } = await sb
      .from('practicas')
      .select('codigo, nombre')
      .eq('activa', true)
      .order('orden');
    if (errPr) throw errPr;
    PRACTICAS = practicas || [];

    // Cargar splits
    const { data: splits, error: errSp } = await sb
      .from('tarifario_splits')
      .select('*');
    if (errSp) throw errSp;
    SPLITS = splits || [];

    // Cargar tarifario de precios (modalidad + obra_social + practica → valor)
    const { data: precios, error: errPx } = await sb
      .from('tarifario_precios')
      .select('modalidad, obra_social, practica_codigo, valor');
    if (errPx) throw errPx;
    PRECIOS = precios || [];

    // Extraer obras sociales únicas (las que tengan modalidad O.S)
    const setOS = new Set();
    PRECIOS.forEach(function(p) {
      if (p.modalidad === 'O.S' && p.obra_social) setOS.add(p.obra_social);
    });
    OBRAS_SOCIALES = Array.from(setOS).sort();

    // Cargar pacientes con su obra social
    const { data: pacientes, error: errPa } = await sb
      .from('personas')
      .select('id, nombre, obra_social')
      .order('nombre')
      .limit(2000);
    if (errPa) throw errPa;
    PACIENTES = pacientes || [];

    llenarSelectores();
    document.getElementById('loading-zone').classList.add('hidden');
    document.getElementById('form-zone').classList.remove('hidden');
    document.getElementById('ticket-info').textContent = PACIENTES.length + ' pacientes · ' + PRACTICAS.length + ' prácticas · ' + PRECIOS.length + ' precios · ' + OBRAS_SOCIALES.length + ' OS';
    calcular();
    toast('Datos cargados correctamente');
  } catch (err) {
    console.error('Error cargando datos:', err);
    document.getElementById('loading-zone').innerHTML =
      '<div style="color: #721c24;"><strong>Error de conexión.</strong><br>' +
      'Revisá que el ANON_KEY esté bien configurado.<br>' +
      '<small style="color: #999;">' + err.message + '</small></div>';
  }
}

function llenarSelectores() {
  const dl = document.getElementById('lista-pacientes');
  dl.innerHTML = PACIENTES.map(function(p) {
    return '<option value="' + p.nombre + '">';
  }).join('');

  document.getElementById('profesional').innerHTML = PROFESIONALES.map(function(p) {
    return '<option value="' + p + '">' + p + '</option>';
  }).join('');

  document.getElementById('practica').innerHTML = PRACTICAS.map(function(p) {
    return '<option value="' + p.codigo + '">' + p.nombre + '</option>';
  }).join('');

  // Llenar select de Obras Sociales dinámicamente desde Supabase
  document.getElementById('obrasocial').innerHTML = OBRAS_SOCIALES.map(function(os) {
    return '<option value="' + os + '">' + os + '</option>';
  }).join('');
}

// Devuelve el precio según modalidad + obra_social + practica_codigo
// Si no encuentra → null (para mostrar warning en UI)
function obtenerPrecio(modalidad, obraSocial, codigoPractica) {
  const fila = PRECIOS.find(function(p) {
    return p.modalidad === modalidad
        && p.obra_social === obraSocial
        && p.practica_codigo === codigoPractica;
  });
  return fila ? Number(fila.valor) : null;
}

function buscarSplit(profesional, codigoPractica) {
  return SPLITS.find(function(s) {
    return s.profesional === profesional && s.practica_codigo === codigoPractica;
  });
}

function calcular() {
  const p = document.getElementById('profesional').value;
  const pr = document.getElementById('practica').value;
  const t = document.getElementById('tipo').value;
  const descVal = parseFloat(document.getElementById('desc-valor').value) || 0;

  // Determinar modalidad y obra social desde la UI
  const esParticular = document.getElementById('btn-particular').classList.contains('active');
  const modalidad = esParticular ? 'Particular' : 'O.S';
  const obraSocial = esParticular ? 'PARTICULAR' : (document.getElementById('obrasocial').value || '');

  // Buscar precio real en tarifario_precios
  let precioLista = obtenerPrecio(modalidad, obraSocial, pr);
  let priceWarning = '';
  if (precioLista === null) {
    precioLista = 0;
    priceWarning = ' · ⚠️ Sin precio cargado para ' + obraSocial + ' + ' + pr;
  }

  let precioBase = precioLista;
  if (descVal > 0) {
    const desc = descTipo === 'pct' ? precioLista * descVal / 100 : descVal;
    precioBase = Math.max(0, precioLista - desc);
  }

  const cfg = buscarSplit(p, pr);
  let montoPaciente = precioBase;
  let centro = 0, prof = 0, moplex = 0;
  let nota = cfg ? (cfg.observaciones || 'Reparto estándar') : 'Sin split definido para esta combinación';
  let priceNote = (descVal > 0 ? ('Con ' + (descTipo === 'pct' ? descVal+'%' : fmt(descVal)) + ' de descuento') : 'Precio lista: ' + fmt(precioLista)) + priceWarning;

  if (t === 'CORTESIA') {
    montoPaciente = 0;
    nota = 'Cortesía total: nadie cobra';
    priceNote = 'Paciente no paga';
  } else if (t === 'SOLO_CENTRO' && cfg) {
    montoPaciente = precioBase * cfg.pct_centro / 100;
    centro = montoPaciente;
    nota = 'Solo Centro: PB cobra ' + cfg.pct_centro + '%, ' + p + ' regala su parte';
  } else if (t === 'SOLO_PROF' && cfg) {
    const pctProf = 100 - cfg.pct_centro - (cfg.pct_moplex || 0);
    montoPaciente = precioBase * pctProf / 100;
    prof = montoPaciente;
    nota = 'Solo Profesional: ' + p + ' cobra ' + pctProf + '%, PB regala su parte';
  } else if (t === 'MANUAL') {
    nota = 'Manual: editar montos uno por uno (próxima versión)';
  } else if (cfg) {
    centro = precioBase * cfg.pct_centro / 100;
    moplex = precioBase * (cfg.pct_moplex || 0) / 100;
    prof = precioBase - centro - moplex;
  }

  document.getElementById('monto').value = fmt(montoPaciente);
  document.getElementById('precio-info').textContent = priceNote;
  document.getElementById('split-centro').textContent = fmt(centro);
  document.getElementById('split-prof').textContent = fmt(prof);
  document.getElementById('split-moplex').textContent = fmt(moplex);
  document.getElementById('reparto-info').textContent = nota;
  document.getElementById('card-centro').classList.toggle('zero', centro === 0);
  document.getElementById('card-prof').classList.toggle('zero', prof === 0);
  document.getElementById('card-moplex').classList.toggle('zero', moplex === 0);

  window._cobroActual = { montoPaciente: montoPaciente, centro: centro, prof: prof, moplex: moplex, nota: nota };
}

function autoSeleccionarObraSocial() {
  const nombre = document.getElementById('paciente-input').value.trim();
  const paciente = PACIENTES.find(function(p) { return p.nombre === nombre; });
  if (!paciente) return;

  if (paciente.obra_social && paciente.obra_social.trim()) {
    // Paciente tiene OS → activar modalidad OS y seleccionar
    document.getElementById('btn-obrasocial').classList.add('active');
    document.getElementById('btn-particular').classList.remove('active');
    document.getElementById('obrasocial').classList.remove('hidden');

    // Buscar la opción que matchee (case-insensitive)
    const select = document.getElementById('obrasocial');
    const osPaciente = paciente.obra_social.trim().toLowerCase();
    let encontrada = false;
    for (let i = 0; i < select.options.length; i++) {
      if (select.options[i].text.toLowerCase() === osPaciente) {
        select.selectedIndex = i;
        encontrada = true;
        break;
      }
    }
    if (encontrada) {
      toast('Cobertura: ' + paciente.obra_social);
    } else {
      toast('OS del paciente "' + paciente.obra_social + '" no está en la lista', 'error');
    }
  } else {
    // Sin OS → modalidad Particular
    document.getElementById('btn-particular').classList.add('active');
    document.getElementById('btn-obrasocial').classList.remove('active');
    document.getElementById('obrasocial').classList.add('hidden');
  }
  calcular();
}

async function registrarCobro() {
  const nombrePaciente = document.getElementById('paciente-input').value.trim();
  const personaMatch = PACIENTES.find(function(p) { return p.nombre === nombrePaciente; });

  if (!personaMatch) {
    toast('Seleccioná un paciente válido de la lista', 'error');
    return;
  }

  const c = window._cobroActual;

  const datos = {
    fecha: new Date().toISOString().split('T')[0],
    hora: new Date().toTimeString().split(' ')[0],
    persona_id: personaMatch.id,
    profesional: document.getElementById('profesional').value,
    tipo_cobro: document.getElementById('tipo').value,
    importe: c.montoPaciente,
    monto_centro: c.centro,
    monto_profesional: c.prof,
    monto_moplex: c.moplex,
    medio_pago: document.getElementById('metodo').value,
    quien_cobro: document.getElementById('quien-cobro').value,
    observaciones: document.getElementById('observaciones').value.trim() || null,
    cargado_por: 'Caja Web'
  };

  const btn = document.getElementById('btn-registrar');
  btn.disabled = true;
  btn.textContent = 'Registrando...';

  try {
    const { data, error } = await sb.from('pagos_consultorio').insert(datos).select();
    if (error) throw error;
    toast('Cobro registrado ✓ Ticket #' + data[0].id);
    limpiarForm();
  } catch (err) {
    console.error(err);
    toast('Error: ' + err.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Registrar cobro';
  }
}

function limpiarForm() {
  document.getElementById('paciente-input').value = '';
  document.getElementById('desc-valor').value = 0;
  document.getElementById('observaciones').value = '';
  document.getElementById('tipo').value = 'NORMAL';
  document.getElementById('metodo').value = 'Efectivo';
  document.getElementById('quien-cobro').value = 'Centro / Recepción';
  calcular();
}

// Event listeners
['profesional','practica','tipo','desc-valor','obrasocial'].forEach(function(id) {
  const el = document.getElementById(id);
  el.addEventListener('change', calcular);
  el.addEventListener('input', calcular);
});

document.getElementById('btn-pct').addEventListener('click', function() {
  descTipo = 'pct';
  document.getElementById('btn-pct').classList.add('active');
  document.getElementById('btn-fijo').classList.remove('active');
  calcular();
});
document.getElementById('btn-fijo').addEventListener('click', function() {
  descTipo = 'fijo';
  document.getElementById('btn-fijo').classList.add('active');
  document.getElementById('btn-pct').classList.remove('active');
  calcular();
});
document.getElementById('btn-particular').addEventListener('click', function() {
  document.getElementById('btn-particular').classList.add('active');
  document.getElementById('btn-obrasocial').classList.remove('active');
  document.getElementById('obrasocial').classList.add('hidden');
  calcular();
});
document.getElementById('btn-obrasocial').addEventListener('click', function() {
  document.getElementById('btn-obrasocial').classList.add('active');
  document.getElementById('btn-particular').classList.remove('active');
  document.getElementById('obrasocial').classList.remove('hidden');
  calcular();
});
document.getElementById('btn-registrar').addEventListener('click', registrarCobro);
document.getElementById('btn-limpiar').addEventListener('click', limpiarForm);

// Auto-cargar OS del paciente al seleccionarlo
document.getElementById('paciente-input').addEventListener('change', autoSeleccionarObraSocial);
document.getElementById('paciente-input').addEventListener('input', function(e) {
  // Cuando el valor coincide exactamente con un paciente (selección de datalist)
  if (PACIENTES.find(function(p) { return p.nombre === e.target.value; })) {
    autoSeleccionarObraSocial();
  }
});

// Inicio
cargarDatos();
</script>
