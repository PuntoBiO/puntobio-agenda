<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda SARKMED · PuntoBiO</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#ffffff; --panel:#ffffff; --panel-2:#fafafa;
    --border:#e5e7eb; --hover:#f9fafb;
    --text:#0f172a; --muted:#64748b; --dim:#94a3b8;

    /* COLORES DEL LOGO SARKMED: naranja "Sar", celeste "K", azul "MED" */
    --primary:#f47b20;           /* NARANJA LOGO */
    --primary-2:#d4620f;
    --primary-soft:#fff6ee;
    --primary-soft-2:#ffe8d4;
    --primary-border:#fbcfa6;

    --azul:#1c75bc;              /* AZUL LOGO */
    --azul-2:#155a91;
    --azul-claro:#29abe2;        /* CELESTE LOGO */
    --azul-soft:#eaf4fc;
    --azul-border:#bcdff5;

    --verde:#16a34a; --verde-soft:#dcfce7;
    --rojo-x:#ef4444; --rojo-soft:#fef2f2;
    --naranja:#f59e0b; --naranja-soft:#fef3c7;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg); color:var(--text); font-size:13px;
  }

  /* HEADER */
  .page-header{padding:22px 32px 14px; background:#fff;}
  .page-title{
    font-size:22px; font-weight:700; color:var(--azul);
    letter-spacing:1.5px; margin:0; display:flex; align-items:center; gap:10px;
  }
  .lg{letter-spacing:0.5px;}
  .lg .sar{color:var(--primary);}
  .lg .k{color:var(--azul-claro);}
  .lg .med{color:var(--azul);}
  .page-title .sep{color:var(--text); font-weight:400;}
  .page-subtitle{
    color:var(--muted); margin-top:4px; font-size:11.5px;
    text-transform:uppercase; letter-spacing:0.8px;
  }
  .header-row{display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap;}

  .view-toggle{display:flex; border-radius:6px; overflow:hidden; border:1px solid var(--border);}
  .view-toggle button{
    padding:7px 16px; border:none; background:#fff; cursor:pointer;
    font-size:12px; font-weight:600; color:var(--muted); transition:all 0.15s;
  }
  .view-toggle button.activo{background:var(--azul); color:#fff;}
  .view-toggle button:not(.activo):hover{background:var(--hover); color:var(--text);}
  .contador{font-size:12px; color:var(--muted);}

  /* TOOLBAR */
  .toolbar{
    padding:14px 32px; background:#fff; border-top:1px solid var(--border);
    border-bottom:1px solid var(--border);
    display:flex; gap:14px; align-items:center; flex-wrap:wrap;
  }
  .nav-btn{
    width:32px; height:32px; border:1px solid var(--border); background:#fff;
    border-radius:6px; cursor:pointer; font-size:14px; color:var(--text);
  }
  .nav-btn:hover{background:var(--hover); border-color:var(--primary);}
  .btn-hoy{
    padding:6px 16px; border:1px solid var(--border); background:#fff;
    border-radius:6px; cursor:pointer; font-size:12px; font-weight:600;
  }
  .btn-hoy:hover{background:var(--primary-soft); border-color:var(--primary);}
  .titulo-periodo{font-size:13px; font-weight:700; letter-spacing:.6px; text-transform:uppercase;}

  .btn{
    padding:7px 14px; border:1px solid var(--border); background:#fff;
    border-radius:6px; cursor:pointer; font-size:12px; font-weight:600; color:var(--text);
  }
  .btn:hover{background:var(--hover);}
  .btn-primary{background:var(--primary); color:#fff; border-color:var(--primary);}
  .btn-primary:hover{background:var(--primary-2); border-color:var(--primary-2);}
  .btn-verde{background:var(--verde); color:#fff; border-color:var(--verde);}
  .btn-rojo{background:var(--rojo-x); color:#fff; border-color:var(--rojo-x);}

  .agenda-wrap{padding:18px 32px 100px;}

  /* ===== VISTA MES ===== */
  .month-grid{display:grid; grid-template-columns:repeat(7,1fr); border:1px solid var(--border); border-radius:8px; overflow:hidden; background:#fff;}
  .month-dow{background:var(--panel-2); font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; text-align:center; padding:10px 4px; border-right:1px solid var(--border); border-bottom:1px solid var(--border);}
  .month-cell{min-height:96px; border-right:1px solid var(--border); border-bottom:1px solid var(--border); padding:8px 10px; display:flex; flex-direction:column; gap:5px; background:#fff;}
  .month-cell.otro-mes{background:#fafbfc;}
  .month-cell.sabado{cursor:pointer; transition:background .1s;}
  .month-cell.sabado:hover{background:var(--primary-soft);}
  .month-cell.hoy{box-shadow:inset 0 0 0 2px var(--azul);}
  .month-cell .md-num{font-size:14px; font-weight:700; color:var(--text); font-variant-numeric:tabular-nums;}
  .month-cell.otro-mes .md-num{color:var(--dim);}
  .month-cell .md-bar{height:6px; border-radius:3px; background:var(--primary); opacity:.85;}
  .month-cell .md-count{font-size:12px; color:var(--primary); font-weight:700;}
  .month-cell .md-abrir{font-size:11px; color:var(--dim);}
  .month-cell .md-cerrada{font-size:11px; color:var(--dim);}
  @media (max-width:760px){.month-cell{min-height:64px; padding:5px 6px;} .month-cell .md-num{font-size:12px;} .month-dow{font-size:9px; padding:6px 2px;}}

  /* ===== VISTA JORNADA ===== */
  .jornada-head{
    display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap;
    background:var(--azul-soft); border:1px solid var(--azul-border);
    border-radius:8px; padding:14px 18px; margin-bottom:16px;
  }
  .jh-fecha{font-size:16px; font-weight:800; color:var(--azul-2); text-transform:capitalize;}
  .jh-sub{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .slots{display:flex; flex-direction:column; gap:8px;}
  .slot{
    display:grid; grid-template-columns:120px 1fr auto; gap:14px; align-items:center;
    border:1px solid var(--border); border-radius:8px; padding:12px 16px; background:#fff;
  }
  .slot.ocupado{border-color:var(--primary-border); background:var(--primary-soft);}
  .slot.fuera{background:var(--panel-2);}
  .slot-hora{font-size:15px; font-weight:800; font-variant-numeric:tabular-nums;}
  .slot-salida{font-size:10.5px; color:var(--muted); font-weight:500; margin-top:2px;}
  .slot-pac{font-size:14px; font-weight:700;}
  .slot-meta{font-size:11.5px; color:var(--muted); margin-top:3px;}
  .slot-libre{font-size:12.5px; color:var(--dim);}
  .estado-pill{padding:3px 10px; border-radius:20px; font-size:10.5px; font-weight:700; letter-spacing:.4px;}
  .estado-pill.PENDIENTE{background:var(--naranja-soft); color:#92400e;}
  .estado-pill.PRESENTE{background:var(--verde-soft); color:#166534;}
  .estado-pill.AUSENTE{background:#e5e7eb; color:#374151;}
  .estado-pill.CANCELADO{background:var(--rojo-soft); color:#991b1b;}
  .aviso-cierre{font-size:10.5px; color:#92400e; background:var(--naranja-soft); padding:2px 8px; border-radius:12px; display:inline-block; margin-top:4px;}

  .vacio{
    text-align:center; padding:60px 20px; color:var(--muted);
    border:1px dashed var(--border); border-radius:8px; background:var(--panel-2);
  }
  .vacio b{display:block; font-size:15px; color:var(--text); margin-bottom:6px;}

  /* MODALES */
  .modal-bg{
    display:none; position:fixed; inset:0; background:rgba(15,23,42,.45);
    z-index:100; align-items:flex-start; justify-content:center; padding:40px 16px; overflow-y:auto;
  }
  .modal-bg.activo{display:flex;}
  .modal{background:#fff; border-radius:10px; width:100%; max-width:520px; box-shadow:0 20px 50px rgba(0,0,0,.2);}
  .modal-head{padding:16px 22px; border-bottom:1px solid var(--border); font-size:15px; font-weight:700;}
  .modal-body{padding:18px 22px;}
  .modal-foot{padding:14px 22px; border-top:1px solid var(--border); display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap;}
  .campo{margin-bottom:12px;}
  .campo label{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); margin-bottom:4px; font-weight:600;}
  .campo input, .campo select, .campo textarea{
    width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:6px;
    font-size:13px; font-family:inherit; color:var(--text); background:#fff;
  }
  .campo input:focus, .campo select:focus, .campo textarea:focus{outline:2px solid var(--primary-border); border-color:var(--primary);}
  .mayus{text-transform:uppercase;}
  .fila-2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .err-box{background:var(--rojo-soft); border:1px solid #fecaca; color:#991b1b; padding:9px 12px; border-radius:6px; font-size:12px; margin-bottom:12px;}
  .ok-box{background:var(--verde-soft); border:1px solid #bbf7d0; color:#166534; padding:9px 12px; border-radius:6px; font-size:12px; margin-bottom:12px;}
  .resultados{border:1px solid var(--border); border-radius:6px; max-height:190px; overflow-y:auto; margin-top:6px;}
  .res-item{padding:9px 12px; cursor:pointer; border-bottom:1px solid var(--border); font-size:12.5px;}
  .res-item:last-child{border-bottom:none;}
  .res-item:hover{background:var(--primary-soft);}
  .res-item b{display:block;}
  .res-item span{color:var(--muted); font-size:11px;}
  .divisor{display:flex; align-items:center; gap:10px; margin:16px 0 12px; color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.6px;}
  .divisor::before, .divisor::after{content:''; flex:1; height:1px; background:var(--border);}

  .toast{
    position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(20px);
    background:#0f172a; color:#fff; padding:11px 20px; border-radius:8px; font-size:13px;
    opacity:0; pointer-events:none; transition:all .2s; z-index:200;
  }
  .toast.activo{opacity:1; transform:translateX(-50%) translateY(0);}
  .toast.ok{background:var(--verde);}
  .toast.err{background:var(--rojo-x);}
</style>
</head>
<body>

<div class="page-header">
  <div class="header-row">
    <div>
      <h1 class="page-title"><span class="lg"><span class="sar">Sar</span><span class="k">K</span><span class="med">MED</span></span> <span class="sep">·</span> AGENDA</h1>
      <div class="page-subtitle">Circuito de valoración muscular · sábados por la mañana</div>
    </div>
    <div style="display:flex; gap:12px; align-items:center;">
      <span class="contador" id="contador"></span>
      <div class="view-toggle">

</div>

<div class="toolbar">
  <button class="nav-btn" onclick="navegar(-1)">‹</button>

  <span class="titulo-periodo" id="titulo-periodo"></span>
  <span style="flex:1"></span>
  <button class="btn" id="btn-refrescar" onclick="refrescarAgenda()" title="Volver a leer la agenda">↻ Actualizar</button>
  <span id="zona-acciones"></span>
</div>

<div class="agenda-wrap" id="agenda-wrap"></div>

<!-- ══════════ MODAL: NUEVO TURNO ══════════ -->
<div class="modal-bg" id="modal-nuevo">
  <div class="modal">
    <div class="modal-head" id="nuevo-head">Nuevo turno</div>
    <div class="modal-body">

      <div class="campo">

      <div id="alta-rapida">

<!-- ══════════ MODAL: DETALLE ══════════ -->
<div class="modal-bg" id="modal-detalle">
  <div class="modal">
    <div class="modal-head">Turno SARKMED</div>
    <div class="modal-body" id="detalle-body"></div>
    <div class="modal-foot" id="detalle-foot"></div>

<!-- ══════════ MODAL: JORNADA ══════════ -->
<div class="modal-bg" id="modal-jornada">
  <div class="modal">
    <div class="modal-head" id="jornada-head">Jornada del circuito</div>
    <div class="modal-body">
      <div id="alerta-jornada"></div>

        <div class="campo">
          <label>Empieza</label>
          <input type="time" id="jo-inicio" value="08:00">

          <label>Termina</label>
          <input type="time" id="jo-fin" value="14:00">

      </div>

<div class="toast" id="toast"></div>

<script>
/* ════════════════════════════════════════════════════════════════
   SUPABASE
   ════════════════════════════════════════════════════════════════ */
const SUPABASE_URL = 'https://bqpjtoiictnzcasxfucf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_yvuXDxrkRrhXwmZBnE_a_Q_zDBz0iDi';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { lock: (name, acquireTimeout, fn) => fn() } });

/* ════════════════════════════════════════════════════════════════
   CONSTANTES
   El circuito se hace SOLO los sábados (getDay()===6) y dura ~1:30 hs
   por paciente, en rueda: entra uno cada 30 min y hay varios adentro
   a la vez, cada uno en una estación distinta.
   ════════════════════════════════════════════════════════════════ */
const DIA_CIRCUITO = 6;          // sábado
const DURACION_CIRCUITO_MIN = 90;
const DOW = ['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'];
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MESES_CORTO = ['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];

/* ════════════════════════════════════════════════════════════════
   ESTADO
   ════════════════════════════════════════════════════════════════ */
let vistaActual = 'mes';           // 'mes' | 'dia'
let mesAncla = new Date();
let diaActual = null;              // ISO del sábado abierto en vista jornada
let jornadas = [];                 // jornadas del mes visible
let turnos = [];                   // turnos del mes visible
let slotActual = null;             // { fecha, hora, jornada_id }
let turnoSel = null;
let jornadaSel = null;
let pacienteElegido = null;        // { id, apellido_nombre, dni }
let buscarTimer = null;
let resultadosBusqueda = [];   // lo último que devolvió el buscador de pacientes

/* ════════════════════════════════════════════════════════════════
   HELPERS
   ════════════════════════════════════════════════════════════════ */
function fmtFecha(d){
  const yy = d.getFullYear();
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return `${yy}-${mm}-${dd}`;
}
function fechaDeISO(iso){ const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d); }
function hMin(h){ const [hh,mm] = h.slice(0,5).split(':').map(Number); return hh*60+mm; }
function minH(m){ return String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0'); }
function fechaLarga(iso){
  const d = fechaDeISO(iso);
  const dias = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  return `${dias[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()].toLowerCase()} de ${d.getFullYear()}`;
}
// Normalizadores · la base guarda siempre igual: nombres en MAYÚSCULA,
// DNI y teléfonos solo números, mail en minúscula.
function aMayus(v){ return (v || '').trim().replace(/\s+/g, ' ').toUpperCase(); }
function soloNumeros(v){ return (v || '').replace(/\D/g, ''); }
function aMinus(v){ return (v || '').trim().toLowerCase(); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function edadDe(nac){
  if(!nac) return null;
  const n = fechaDeISO(nac), hoy = new Date();
  let e = hoy.getFullYear() - n.getFullYear();
  const m = hoy.getMonth() - n.getMonth();
  if(m < 0 || (m === 0 && hoy.getDate() < n.getDate())) e--;
  return e;
}
// Código del informe: año + DNI (el DNI ES el código del paciente)
function armarInformeId(fecha, dni){
  const yy = String(fechaDeISO(fecha).getFullYear()).slice(-2);
  return `A${yy}-${String(dni || '').trim()}`;
}
function cerrarModal(id){ document.getElementById(id).classList.remove('activo'); }
function toast(msg, tipo){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast activo ' + (tipo || '');
  setTimeout(() => t.classList.remove('activo'), 2800);
}

/* ════════════════════════════════════════════════════════════════
   ROL: solo admin_general abre y cierra jornadas
   ════════════════════════════════════════════════════════════════ */
let usuarioRol = null;
let miEmail = '';
async function cargarRolUsuario(){
  try{
    const { data: { session } } = await sb.auth.getSession();
    if(!session){ usuarioRol = null; miEmail = ''; return; }
    miEmail = (session.user?.email || '').trim().toLowerCase();
    const { data: persona } = await sb
      .from('personas')
      .select('rol_principal')
      .eq('auth_user_id', session.user.id)
      .maybeSingle();
    usuarioRol = persona?.rol_principal || null;
  }catch(e){
    console.warn('No se pudo cargar el rol del usuario:', e);
    usuarioRol = null;
  }
}
function esAdminGeneral(){ return usuarioRol === 'admin_general'; }
// Quiénes abren y cierran los sábados: sale de sarkmed_accesos.gestiona_jornadas.
function puedeAbrirJornadas(){
  const yo = accesoDe(miEmail);
  const base = yo ? yo.gestiona_jornadas : esAdminGeneral();
  const vc = new URLSearchParams(location.search).get('vercomo');
  if (vc) { const visto = accesoDe(vc); return base && !!(visto && visto.gestiona_jornadas); }
  return base;
}
// PERMISOS DE SARKMED · viven en la tabla `sarkmed_accesos`, no acá.
let accesosSark = [];
async function cargarAccesosSark(){
  try{
    const { data, error } = await sb
      .from('sarkmed_accesos')
      .select('email, nombre, gestiona_turnos, gestiona_jornadas')
      .eq('activo', true);
    if(error) throw error;
    accesosSark = (data || []).map(a => ({ ...a, email: (a.email||'').toLowerCase().trim() }));
  }catch(e){ console.warn('No se pudieron leer los accesos de SarkMED:', e); accesosSark = []; }
}
function accesoDe(mail){
  const m = (mail || '').toLowerCase().trim();
  return accesosSark.find(a => a.email === m) || null;
}
// VISTA PREVIA: app.html puede pasar ?vercomo=mail para mirar la agenda con los
// ojos de otra persona. Solo sirve para RESTRINGIR lo que se muestra: el mail
// real sigue mandando para todo lo que agregue permisos.
function mailEfectivo(){
  const vc = new URLSearchParams(location.search).get('vercomo');
  return (vc || miEmail || '').toLowerCase().trim();
}
function puedeGestionarTurnos(){
  const yo = accesoDe(miEmail);
  const visto = accesoDe(mailEfectivo());
  // Si no hay fila (equipo del centro sin acceso cargado), manda el rol de siempre.
  const real = yo ? yo.gestiona_turnos : true;
  const previa = visto ? visto.gestiona_turnos : real;
  return real && previa;
}

/* ════════════════════════════════════════════════════════════════
   CARGA DE DATOS (siempre por rango de fechas del mes visible)
   ════════════════════════════════════════════════════════════════ */
function rangoMes(){
  const y = mesAncla.getFullYear(), m = mesAncla.getMonth();
  return { ini: fmtFecha(new Date(y, m, 1)), fin: fmtFecha(new Date(y, m+1, 0)) };
}
async function cargarDatos(){
  const { ini, fin } = rangoMes();
  const [jRes, tRes] = await Promise.all([
    sb.from('jornadas_sarkmed').select('*').gte('fecha', ini).lte('fecha', fin).order('fecha'),
    sb.from('turnos_sarkmed')
      .select('*, paciente:pacientes_sarkmed(id, apellido_nombre, dni, telefono, fecha_nacimiento, sexo)')
      .gte('fecha', ini).lte('fecha', fin).order('fecha').order('hora')
  ]);
  if(jRes.error){ toast('Error al leer jornadas: ' + jRes.error.message, 'err'); return; }
  if(tRes.error){ toast('Error al leer turnos: ' + tRes.error.message, 'err'); return; }
  jornadas = jRes.data || [];
  turnos   = tRes.data || [];
}
/* Botón ↻ Actualizar · vuelve a leer jornadas y turnos sin recargar la página.
   El realtime ya refresca solo, pero esto sirve cuando la conexión se cortó. */
async function refrescarAgenda(){
  const btn = document.getElementById('btn-refrescar');
  if(btn){ btn.disabled = true; btn.textContent = '↻ Actualizando…'; }
  try{
    await cargarDatos();
    render();
    toast('Agenda actualizada', 'ok');
  } finally {
    if(btn){ btn.disabled = false; btn.textContent = '↻ Actualizar'; }
  }
}

function jornadaDe(iso){ return jornadas.find(j => j.fecha === iso && j.activo) || null; }
function turnosDe(iso){ return turnos.filter(t => t.fecha === iso && t.estado !== 'CANCELADO'); }

/* ════════════════════════════════════════════════════════════════
   RENDER
   ════════════════════════════════════════════════════════════════ */
function render(){
  document.getElementById('btn-vista-mes').classList.toggle('activo', vistaActual === 'mes');
  document.getElementById('btn-vista-dia').classList.toggle('activo', vistaActual === 'dia');
  if(vistaActual === 'mes') renderMes(); else renderJornada();
}

function renderMes(){
  document.getElementById('titulo-periodo').textContent = `${MESES[mesAncla.getMonth()].toUpperCase()} ${mesAncla.getFullYear()}`;
  document.getElementById('zona-acciones').innerHTML = puedeAbrirJornadas()
    ? '<span style="font-size:11.5px;color:var(--muted)">Tocá un sábado para abrir o ver la jornada</span>'
    : '';

  const totalMes = turnos.filter(t => t.estado !== 'CANCELADO').length;
  const sabadosAbiertos = jornadas.filter(j => j.activo).length;
  document.getElementById('contador').textContent =
    `${sabadosAbiertos} ${sabadosAbiertos === 1 ? 'sábado abierto' : 'sábados abiertos'} · ${totalMes} ${totalMes === 1 ? 'turno' : 'turnos'}`;

  const y = mesAncla.getFullYear(), m = mesAncla.getMonth();
  const primero = new Date(y, m, 1);
  const arranque = new Date(primero);
  arranque.setDate(arranque.getDate() - primero.getDay());   // domingo previo
  const hoyISO = fmtFecha(new Date());

  let html = '<div class="month-grid">';
  ['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'].forEach(d => { html += `<div class="month-dow">${d}</div>`; });

  for(let i = 0; i < 42; i++){
    const d = new Date(arranque);
    d.setDate(d.getDate() + i);
    const iso = fmtFecha(d);
    const otroMes = d.getMonth() !== m;
    const esSabado = d.getDay() === DIA_CIRCUITO;
    const jor = jornadaDe(iso);
    const cant = turnosDe(iso).length;

    const clases = ['month-cell'];
    if(otroMes) clases.push('otro-mes');
    if(esSabado && !otroMes) clases.push('sabado');
    if(iso === hoyISO) clases.push('hoy');

    let cuerpo = '';
    if(esSabado && !otroMes){
      if(jor){
        cuerpo += '<div class="md-bar"></div>';
        cuerpo += `<div class="md-count">${cant} ${cant === 1 ? 'turno' : 'turnos'}</div>`;
        cuerpo += `<div class="md-abrir">${jor.hora_inicio.slice(0,5)} a ${jor.hora_fin.slice(0,5)}</div>`;
      }else{
        cuerpo += '<div class="md-abrir">Sin circuito</div>';
      }
    }

    const onclick = (esSabado && !otroMes) ? ` onclick="clickSabado('${iso}')"` : '';
    html += `<div class="${clases.join(' ')}"${onclick}><div class="md-num">${d.getDate()}</div>${cuerpo}</div>`;
  }
  html += '</div>';
  document.getElementById('agenda-wrap').innerHTML = html;
}

function renderJornada(){
  const wrap = document.getElementById('agenda-wrap');
  document.getElementById('titulo-periodo').textContent = diaActual ? fechaLarga(diaActual).toUpperCase() : '';
  document.getElementById('zona-acciones').innerHTML = '';

  if(!diaActual){
    document.getElementById('contador').textContent = '';
    wrap.innerHTML = '<div class="vacio"><b>Elegí un sábado</b>Volvé a la vista Mes y tocá el sábado que querés ver.</div>';
    return;
  }

  const jor = jornadaDe(diaActual);
  const delDia = turnosDe(diaActual);
  document.getElementById('contador').textContent = `${delDia.length} ${delDia.length === 1 ? 'turno' : 'turnos'}`;

  if(!jor){
    wrap.innerHTML = `<div class="vacio"><b>Este sábado no tiene circuito</b>${
      puedeAbrirJornadas()
        ? 'Abrilo desde la vista Mes tocando el día.'
        : 'Pedile a Lu o Jime que abra la jornada.'
    }</div>`;
    return;
  }

  const ini = hMin(jor.hora_inicio), fin = hMin(jor.hora_fin), paso = jor.paso_minutos || 30;
  const porHora = {};
  delDia.forEach(t => { porHora[t.hora.slice(0,5)] = t; });

  let html = `
    <div class="jornada-head">
      <div>
        <div class="jh-fecha">${fechaLarga(diaActual)}</div>
        <div class="jh-sub">Entrada cada ${paso} min · de ${jor.hora_inicio.slice(0,5)} a ${jor.hora_fin.slice(0,5)} · cada recorrido dura aprox. 1:30 hs</div>
        ${puedeGestionarTurnos() ? '' : '<div class="jh-sub" style="margin-top:4px">Los turnos los carga secretaría</div>'}
      </div>
      <div style="display:flex; gap:8px;">
        ${puedeAbrirJornadas() ? `<button class="btn" onclick="abrirModalJornada('${diaActual}')">Editar jornada</button>` : ''}
        <button class="btn" onclick="setVista('mes')">Ver el mes</button>
      </div>
    </div>
    <div class="slots">`;

  for(let m = ini; m < fin; m += paso){
    const hora = minH(m);
    const salida = minH(m + DURACION_CIRCUITO_MIN);
    const seVaDeHora = (m + DURACION_CIRCUITO_MIN) > fin;
    const t = porHora[hora];

    if(t){
      const p = t.paciente || {};
      const edad = edadDe(p.fecha_nacimiento);
      html += `
        <div class="slot ocupado">
          <div>
            <div class="slot-hora">${hora}</div>
            <div class="slot-salida">sale ~${salida}</div>
          </div>
          <div>
            <div class="slot-pac">${esc(p.apellido_nombre || '—')}</div>
            <div class="slot-meta">DNI ${esc(p.dni || '—')}${edad != null ? ' · ' + edad + ' años' : ''}${p.telefono ? ' · ' + esc(p.telefono) : ''}${t.informe_id ? ' · ' + esc(t.informe_id) : ''}</div>
          </div>
          <div style="display:flex; gap:10px; align-items:center;">
            <span class="estado-pill ${t.estado}">${t.estado}</span>
            <button class="btn" onclick='abrirDetalle(${JSON.stringify(t.id)})'>Abrir</button>
          </div>
        </div>`;
    }else{
      html += `
        <div class="slot">
          <div>
            <div class="slot-hora">${hora}</div>
            <div class="slot-salida">saldría ~${salida}</div>
          </div>
          <div>
            <div class="slot-libre">Libre</div>
            ${seVaDeHora ? '<div class="aviso-cierre">Se pasa del cierre de la jornada</div>' : ''}
          </div>
          <div>
            ${puedeGestionarTurnos()
              ? `<button class="btn btn-primary" onclick="abrirNuevo('${diaActual}','${hora}',${jor.id})">Dar turno</button>`
              : ''}
          </div>
        </div>`;
    }
  }
  html += '</div>';
  wrap.innerHTML = html;
}

/* ════════════════════════════════════════════════════════════════
   NAVEGACIÓN
   ════════════════════════════════════════════════════════════════ */
async function setVista(v){
  vistaActual = v;
  if(v === 'dia' && !diaActual){
    const prox = jornadas.filter(j => j.activo).map(j => j.fecha).sort();
    diaActual = prox[0] || null;
  }
  render();
}
async function navegar(delta){
  if(vistaActual === 'mes'){
    mesAncla = new Date(mesAncla.getFullYear(), mesAncla.getMonth() + delta, 1);
    await cargarDatos();
    render();
    return;
  }
  // En jornada: saltar al sábado abierto anterior/siguiente del mes
  const abiertas = jornadas.filter(j => j.activo).map(j => j.fecha).sort();
  const i = abiertas.indexOf(diaActual);
  const destino = abiertas[i + delta];
  if(destino){ diaActual = destino; render(); }
  else toast(delta > 0 ? 'No hay más jornadas este mes' : 'No hay jornadas anteriores este mes');
}
async function irHoy(){
  mesAncla = new Date();
  vistaActual = 'mes';
  await cargarDatos();
  render();
}
async function clickSabado(iso){
  const jor = jornadaDe(iso);
  if(jor){ diaActual = iso; vistaActual = 'dia'; render(); return; }
  if(!puedeAbrirJornadas()){ toast('Este sábado no tiene circuito abierto'); return; }
  abrirModalJornada(iso);
}

/* ════════════════════════════════════════════════════════════════
   JORNADAS (abrir / editar / cerrar)
   ════════════════════════════════════════════════════════════════ */
function abrirModalJornada(iso){
  jornadaSel = jornadas.find(j => j.fecha === iso) || null;
  const nueva = !jornadaSel;
  document.getElementById('alerta-jornada').innerHTML = '';
  document.getElementById('jornada-head').textContent = (nueva ? 'Abrir circuito · ' : 'Jornada · ') + fechaLarga(iso);
  document.getElementById('jo-inicio').value = (jornadaSel?.hora_inicio || '08:00').slice(0,5);
  document.getElementById('jo-fin').value    = (jornadaSel?.hora_fin || '14:00').slice(0,5);
  document.getElementById('jo-paso').value   = jornadaSel?.paso_minutos || 30;
  document.getElementById('jo-notas').value  = jornadaSel?.notas || '';

  const btns = [`<button class="btn" onclick="cerrarModal('modal-jornada')">Cerrar</button>`];
  if(jornadaSel && jornadaSel.activo){
    btns.push(`<button class="btn btn-rojo" onclick="cerrarJornada()">Cerrar el circuito de ese día</button>`);
  }
  btns.push(`<button class="btn btn-primary" onclick="guardarJornada('${iso}')">${nueva ? 'Abrir jornada' : 'Guardar'}</button>`);
  document.getElementById('jornada-foot').innerHTML = btns.join('');
  document.getElementById('modal-jornada').classList.add('activo');
}

async function guardarJornada(iso){
  const alerta = document.getElementById('alerta-jornada');
  alerta.innerHTML = '';
  const hIni  = document.getElementById('jo-inicio').value;
  const hFin  = document.getElementById('jo-fin').value;
  const paso  = parseInt(document.getElementById('jo-paso').value, 10);
  const notas = document.getElementById('jo-notas').value.trim() || null;

  if(!hIni || !hFin || hMin(hFin) <= hMin(hIni)){
    alerta.innerHTML = '<div class="err-box">El horario de cierre tiene que ser posterior al de inicio.</div>';
    return;
  }
  if(!paso || paso < 5){
    alerta.innerHTML = '<div class="err-box">El intervalo entre turnos tiene que ser de al menos 5 minutos.</div>';
    return;
  }

  const fila = { fecha: iso, hora_inicio: hIni, hora_fin: hFin, paso_minutos: paso, notas, activo: true, creado_por_email: miEmail };
  const { error } = jornadaSel
    ? await sb.from('jornadas_sarkmed').update(fila).eq('id', jornadaSel.id)
    : await sb.from('jornadas_sarkmed').insert(fila);

  if(error){ alerta.innerHTML = `<div class="err-box">${esc(error.message)}</div>`; return; }
  cerrarModal('modal-jornada');
  toast(jornadaSel ? 'Jornada actualizada' : 'Circuito abierto', 'ok');
  await cargarDatos();
  diaActual = iso; vistaActual = 'dia';
  render();
}

async function cerrarJornada(){
  if(!jornadaSel) return;
  // Cerrar el circuito NO exige cancelar los turnos: lo que exige es que cada
  // paciente tenga su estado puesto. Cancelar es otra cosa (el que nunca señó
  // y se borra de todos lados), así que solo frenamos por los PENDIENTES.
  const delDia = turnosDe(jornadaSel.fecha);
  const pendientes = delDia.filter(t => t.estado === 'PENDIENTE');
  if(pendientes.length){
    document.getElementById('alerta-jornada').innerHTML =
      `<div class="err-box">Ese sábado tiene ${pendientes.length} ${pendientes.length === 1 ? 'paciente sin marcar' : 'pacientes sin marcar'}. Poné presente o ausente en cada uno y después cerrá el circuito.</div>`;
    return;
  }
  const presentes = delDia.filter(t => t.estado === 'PRESENTE').length;
  const ausentes  = delDia.filter(t => t.estado === 'AUSENTE').length;
  const resumen = delDia.length
    ? `\n\nQuedan registrados ${presentes} ${presentes === 1 ? 'presente' : 'presentes'} y ${ausentes} ${ausentes === 1 ? 'ausente' : 'ausentes'}.`
    : '';
  if(!confirm(`¿Cerrar el circuito del ${fechaLarga(jornadaSel.fecha)}?\n\nEse sábado deja de tener agenda.${resumen}`)) return;
  const { error } = await sb.from('jornadas_sarkmed').update({ activo: false }).eq('id', jornadaSel.id);
  if(error){ toast('Error: ' + error.message, 'err'); return; }
  cerrarModal('modal-jornada');
  toast('Circuito cerrado', 'ok');
  await cargarDatos();
  vistaActual = 'mes';
  render();
}

/* ════════════════════════════════════════════════════════════════
   NUEVO TURNO · padrón propio de SARKMED
   ════════════════════════════════════════════════════════════════ */
function abrirNuevo(fecha, hora, jornadaId){
  slotActual = { fecha, hora, jornada_id: jornadaId };
  pacienteElegido = null;
  document.getElementById('alerta-nuevo').innerHTML = '';
  document.getElementById('nuevo-head').textContent = `Nuevo turno · ${fechaLarga(fecha)} · ${hora}`;
  document.getElementById('busc-paciente').value = '';
  document.getElementById('resultados').style.display = 'none';
  document.getElementById('resultados').innerHTML = '';
  ['np-nombre','np-dni','np-tel','np-nac','np-email','np-ocupacion','np-emergencia','np-emergencia-nombre','inp-obs'].forEach(id => { document.getElementById(id).value = ''; });
  document.getElementById('np-sexo').value = '';
  document.getElementById('paciente-elegido').style.display = 'none';
  document.getElementById('alta-rapida').style.display = '';
  document.getElementById('modal-nuevo').classList.add('activo');
  setTimeout(() => document.getElementById('busc-paciente').focus(), 80);
}

function buscarPacientes(q){
  clearTimeout(buscarTimer);
  const cont = document.getElementById('resultados');
  const txt = (q || '').trim();
  if(txt.length < 2){ cont.style.display = 'none'; cont.innerHTML = ''; return; }
  buscarTimer = setTimeout(async () => {
    const { data, error } = await sb
      .from('pacientes_sarkmed')
      .select('id, apellido_nombre, dni, telefono, fecha_nacimiento')
      .or(`apellido_nombre.ilike.%${txt}%,dni.ilike.%${txt}%`)
      .eq('activo', true)
      .order('apellido_nombre')
      .limit(8);
    if(error){ cont.style.display = 'none'; return; }
    if(!data || !data.length){
      cont.style.display = 'block';
      cont.innerHTML = '<div class="res-item" style="cursor:default;color:var(--muted)">Sin coincidencias · cargalo abajo por primera vez</div>';
      return;
    }
    resultadosBusqueda = data;
    cont.style.display = 'block';
    cont.innerHTML = data.map((p, i) => {
      const edad = edadDe(p.fecha_nacimiento);
      return `<div class="res-item" onclick="elegirPacienteIdx(${i})">
        <b>${esc(p.apellido_nombre)}</b>
        <span>DNI ${esc(p.dni)}${edad != null ? ' · ' + edad + ' años' : ''}${p.telefono ? ' · ' + esc(p.telefono) : ''}</span>
      </div>`;
    }).join('');
  }, 250);
}

function elegirPacienteIdx(i){
  const p = resultadosBusqueda[i];
  if(!p) return;
  elegirPaciente(p.id, p.apellido_nombre, p.dni);
}
function elegirPaciente(id, nombre, dni){
  pacienteElegido = { id, apellido_nombre: nombre, dni };
  document.getElementById('resultados').style.display = 'none';
  document.getElementById('busc-paciente').value = nombre;
  document.getElementById('paciente-elegido-txt').textContent = `${nombre} · DNI ${dni}`;
  document.getElementById('paciente-elegido').style.display = '';
  document.getElementById('alta-rapida').style.display = 'none';
}
function limpiarPacienteElegido(){
  pacienteElegido = null;
  document.getElementById('busc-paciente').value = '';
  document.getElementById('paciente-elegido').style.display = 'none';
  document.getElementById('alta-rapida').style.display = '';
  document.getElementById('busc-paciente').focus();
}

async function guardarTurnoNuevo(){
  const alerta = document.getElementById('alerta-nuevo');
  alerta.innerHTML = '';
  if(!slotActual){ alerta.innerHTML = '<div class="err-box">Elegí día y hora desde la jornada.</div>'; return; }

  let paciente = pacienteElegido;

  // Alta rápida si no eligió a nadie del listado
  if(!paciente){
    const nombre = aMayus(document.getElementById('np-nombre').value);
    const dni    = soloNumeros(document.getElementById('np-dni').value);
    if(!nombre || !dni){
      alerta.innerHTML = '<div class="err-box">Buscá al paciente arriba, o cargá al menos apellido, nombre y DNI para darlo de alta.</div>';
      return;
    }
    const fila = {
      apellido_nombre: nombre,
      dni,
      telefono: soloNumeros(document.getElementById('np-tel').value) || null,
      email: aMinus(document.getElementById('np-email').value) || null,
      fecha_nacimiento: document.getElementById('np-nac').value || null,
      sexo: document.getElementById('np-sexo').value || null,
      ocupacion: aMayus(document.getElementById('np-ocupacion').value) || null,
      contacto_emergencia: soloNumeros(document.getElementById('np-emergencia').value) || null,
      contacto_emergencia_nombre: aMayus(document.getElementById('np-emergencia-nombre').value) || null,
      creado_por_email: miEmail
    };
    const { data, error } = await sb.from('pacientes_sarkmed').insert(fila).select('id, apellido_nombre, dni').single();
    if(error){
      alerta.innerHTML = error.message.includes('ux_pacientes_sarkmed_dni')
        ? '<div class="err-box">Ese DNI ya está cargado en SARKMED. Buscalo arriba por número.</div>'
        : `<div class="err-box">${esc(error.message)}</div>`;
      return;
    }
    paciente = data;
  }

  const turno = {
    jornada_id: slotActual.jornada_id,
    fecha: slotActual.fecha,
    hora: slotActual.hora,
    paciente_id: paciente.id,
    estado: 'PENDIENTE',
    informe_id: armarInformeId(slotActual.fecha, paciente.dni),
    observaciones: document.getElementById('inp-obs').value.trim() || null,
    creado_por_email: miEmail
  };
  const { error } = await sb.from('turnos_sarkmed').insert(turno);
  if(error){
    alerta.innerHTML = error.message.includes('ux_turnos_sarkmed_slot')
      ? '<div class="err-box">Ese horario ya se ocupó recién. Elegí otro.</div>'
      : `<div class="err-box">${esc(error.message)}</div>`;
    return;
  }
  cerrarModal('modal-nuevo');
  toast('Turno dado · ' + slotActual.hora, 'ok');
  await cargarDatos();
  render();
}

/* ════════════════════════════════════════════════════════════════
   DETALLE DEL TURNO
   ════════════════════════════════════════════════════════════════ */
function abrirDetalle(id){
  const t = turnos.find(x => x.id === id);
  if(!t) return;
  turnoSel = t;
  const p = t.paciente || {};
  const edad = edadDe(p.fecha_nacimiento);
  document.getElementById('detalle-body').innerHTML = `
    <div style="display:grid; grid-template-columns:auto 1fr; gap:8px 14px; font-size:13px;">
      <div style="color:var(--muted);">Paciente:</div><div><b>${esc(p.apellido_nombre || '—')}</b></div>
      <div style="color:var(--muted);">DNI:</div><div>${esc(p.dni || '—')}${edad != null ? ' · ' + edad + ' años' : ''}</div>
      <div style="color:var(--muted);">Teléfono:</div><div>${esc(p.telefono || '—')}</div>
      <div style="color:var(--muted);">Entra:</div><div>${fechaLarga(t.fecha)} · <b>${t.hora.slice(0,5)}</b></div>
      <div style="color:var(--muted);">Sale aprox.:</div><div>${minH(hMin(t.hora) + DURACION_CIRCUITO_MIN)}</div>
      <div style="color:var(--muted);">Informe:</div><div>${esc(t.informe_id || '—')}</div>
      <div style="color:var(--muted);">Estado:</div><div><span class="estado-pill ${t.estado}">${t.estado}</span></div>
      ${t.observaciones ? `<div style="color:var(--muted);">Obs.:</div><div>${esc(t.observaciones)}</div>` : ''}
    </div>`;

  const btns = [];
  if(!puedeGestionarTurnos()){
    document.getElementById('detalle-foot').innerHTML =
      `<button class="btn" onclick="cerrarModal('modal-detalle')">Cerrar</button>`;
    document.getElementById('modal-detalle').classList.add('activo');
    return;
  }
  if(t.estado === 'PENDIENTE'){
    btns.push(`<button class="btn btn-verde" onclick="cambiarEstado('PRESENTE')">Marcar presente</button>`);
    btns.push(`<button class="btn" onclick="cambiarEstado('AUSENTE')">Ausente</button>`);
  }else{
    btns.push(`<button class="btn" onclick="cambiarEstado('PENDIENTE')">Volver a pendiente</button>`);
  }
  if(t.estado !== 'CANCELADO'){
    btns.push(`<button class="btn btn-rojo" onclick="cancelarTurno()">Cancelar turno</button>`);
  }
  btns.push(`<button class="btn" onclick="cerrarModal('modal-detalle')">Cerrar</button>`);
  document.getElementById('detalle-foot').innerHTML = btns.join('');
  document.getElementById('modal-detalle').classList.add('activo');
}

async function cambiarEstado(nuevo){
  if(!turnoSel) return;
  const { error } = await sb.from('turnos_sarkmed').update({ estado: nuevo }).eq('id', turnoSel.id);
  if(error){ toast('Error: ' + error.message, 'err'); return; }
  cerrarModal('modal-detalle');
  toast('Estado → ' + nuevo, 'ok');
  await cargarDatos();
  render();
}

async function cancelarTurno(){
  if(!turnoSel) return;
  const p = turnoSel.paciente || {};
  if(!confirm(`¿Cancelar el turno de ${p.apellido_nombre || ''} (${turnoSel.fecha} ${turnoSel.hora.slice(0,5)})?\n\nEl horario queda libre y el turno queda registrado como cancelado.`)) return;
  const { error } = await sb.from('turnos_sarkmed').update({ estado: 'CANCELADO' }).eq('id', turnoSel.id);
  if(error){ toast('Error: ' + error.message, 'err'); return; }
  cerrarModal('modal-detalle');
  toast('Turno cancelado · horario libre', 'ok');
  await cargarDatos();
  render();
}

/* ════════════════════════════════════════════════════════════════
   TIEMPO REAL
   ════════════════════════════════════════════════════════════════ */
let realtimeCanal = null;
let realtimeTimer = null;
function recargarPorRealtime(){
  clearTimeout(realtimeTimer);
  realtimeTimer = setTimeout(async () => {
    if(document.querySelector('.modal-bg.activo')) return;
    await cargarDatos();
    render();
  }, 1200);
}
async function iniciarRealtime(){
  if(!sb || realtimeCanal) return;
  try{
    realtimeCanal = sb
      .channel('agenda-sarkmed-vivo')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'turnos_sarkmed' }, recargarPorRealtime)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'jornadas_sarkmed' }, recargarPorRealtime)
      .subscribe((status, err) => {
        console.log('[REALTIME sarkmed] estado:', status, err || '');
      });
  }catch(e){ console.warn('[REALTIME sarkmed] error al iniciar', e); }
}

  await cargarRolUsuario();
  await cargarAccesosSark();
  await cargarDatos();
  render();
  iniciarRealtime();
})();
