<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aumentos de precios · PuntoBiO</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg-deep:#f1f5f9;--bg-card:#fff;--bg-soft:#f8fafc;--border:#e5e7eb;
  --turquoise:#1e9fe0;--turquoise-dim:#0c7bb8;--text:#0f172a;--text-dim:#64748b;--text-faint:#94a3b8;
  --green:#16a34a;--green-bg:#dcfce7;--amber:#d97706;--amber-bg:#fef3c7;--red:#dc2626;--red-bg:#fee2e2;--blue-bg:#dbeafe;
}
*{box-sizing:border-box}
body{font-family:'Manrope',system-ui,sans-serif;background:var(--bg-deep);color:var(--text);margin:0;padding:24px 32px 90px;min-height:100vh}
h1{font-size:24px;margin:0 0 4px;display:flex;align-items:center;gap:10px}
.sub{color:var(--text-dim);font-size:14px;margin:0 0 22px}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:20px;max-width:880px;box-shadow:0 1px 3px rgba(0,0,0,.05);margin-bottom:18px}
.banner{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--amber-bg);color:#92400e;border-radius:12px;padding:14px 16px;font-size:13.5px;font-weight:600;margin-bottom:16px}
.controls{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:12px;color:var(--text-dim);font-weight:700}
.fld input,.fld select{padding:9px 11px;border:1.5px solid var(--border);border-radius:9px;font-family:inherit;font-size:14px;background:#fff}
.fld input[type=number]{width:90px;text-align:right}
.btn{background:var(--turquoise);color:#fff;border:none;border-radius:10px;padding:11px 18px;font-family:inherit;font-size:14px;font-weight:800;cursor:pointer;box-shadow:0 6px 16px rgba(30,159,224,.25);transition:transform .12s,filter .12s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.05)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn.sec{background:transparent;color:var(--text-dim);border:1.5px solid var(--border);box-shadow:none}
.btn.danger{background:transparent;color:var(--red);border:1.5px solid #fecaca;box-shadow:none}
.btn.sm{padding:8px 12px;font-size:13px}
.hint{font-size:12.5px;color:var(--text-faint);margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
thead th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-faint);padding:8px 10px;border-bottom:1.5px solid var(--border)}
thead th.r,tbody td.r{text-align:right}
tbody td{padding:8px 10px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
tbody tr:hover{background:var(--bg-soft)}
.grp td{background:#eff6fb;color:var(--turquoise-dim);font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.03em;padding:9px 10px}
.actual{color:var(--text-dim);font-variant-numeric:tabular-nums}
.pn{width:110px;padding:7px 9px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:13.5px;text-align:right}
.pn.changed{border-color:var(--turquoise);background:#f0f9ff}
.delta{font-size:11.5px;color:var(--green);font-variant-numeric:tabular-nums;min-width:48px;display:inline-block;text-align:right}
.res{margin-top:14px;font-size:13.5px;padding:12px 14px;border-radius:10px;display:none}
.res.show{display:block}
.res.ok{background:var(--green-bg);color:#166534}
.res.err{background:var(--red-bg);color:#991b1b}
.savebar{position:sticky;bottom:0;background:linear-gradient(to top,var(--bg-deep) 60%,transparent);padding:16px 0 4px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;max-width:880px}
.lock{max-width:520px;background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:28px;text-align:center;color:var(--text-dim)}
.muted{color:var(--text-faint);font-size:12.5px}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:16px;padding:24px;max-width:480px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal h3{margin:0 0 6px;font-size:18px}
.modal p{font-size:14px;color:var(--text-dim);margin:0 0 14px;line-height:1.5}
.modal .lista{max-height:200px;overflow:auto;border:1px solid var(--border);border-radius:10px;margin-bottom:16px}
.modal .lf{display:flex;justify-content:space-between;gap:8px;padding:7px 12px;font-size:12.5px;border-bottom:1px solid #f1f5f9}
.modal .lf:last-child{border-bottom:none}
.modal .acc{display:flex;gap:10px;justify-content:flex-end}
</style>
</head>
<body>
  <h1>💲 Aumentos de precios</h1>
  <p class="sub">Programá un aumento por área con fecha de vigencia. El sistema lo aplica solo desde esa fecha, en todas las pantallas.</p>
  <div id="app"><p class="muted">Cargando…</p></div>

  <div class="overlay" id="overlay">
    <div class="modal">
      <h3>Confirmar aumento</h3>
      <p id="modalTxt"></p>
      <div class="lista" id="modalLista"></div>
      <div class="acc">
        <button class="btn sec" onclick="cerrarModal()">Volver</button>
        <button class="btn" id="modalOk">Sí, programar</button>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://bqpjtoiictnzcasxfucf.supabase.co'
const SUPABASE_KEY = 'sb_publishable_yvuXDxrkRrhXwmZBnE_a_Q_zDBz0iDi'
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { lock: (name, t, fn) => fn() } })

// Solo administración general (Lu y Jime). El motor en la base también lo valida.
const ADMINS = ['liclucianavelaz@gmail.com', 'jimenahllorente@gmail.com']

const $ = id => document.getElementById(id)
const state = { tf: [], co: [], pendiente: null }

const LBL = {
  FISIO:'Fisio', FISIO_PQ:'Fisio (paquete)', EVAL:'Evaluación', OSTEO:'Osteopatía',
  DLM:'Drenaje (DLM)', DRENAJE:'Drenaje', PUNC_SECA:'Punción seca', TERAPIA_MANUAL:'Terapia manual',
  SUELO_PEL:'Suelo pélvico', MOPLEX:'Moplex', PP:'Punción profunda',
  MASAJES_EYC:'Masajes EyC', MASAJES_CC:'Masajes CC', MASAJES_R:'Masajes R', MASAJES_PAK:'Masajes Pak',
  SARKMED_BL:'Sarkmed BiOLAB', SARKMED_PP:'Sarkmed PP'
}
const fmt = n => '$' + Number(n || 0).toLocaleString('es-AR')
const fechaAr = iso => { if(!iso) return '—'; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}` }
function primeroProximoMes(){
  const d = new Date()
  const esDic = d.getMonth() === 11
  const y = esDic ? d.getFullYear()+1 : d.getFullYear()
  const m = (d.getMonth()+1) % 12
  return `${y}-${String(m+1).padStart(2,'0')}-01`
}
function hoyISO(){ return new Date().toISOString().slice(0,10) }
function redondear(v, modo){
  v = Number(v) || 0
  if (modo === 'exacto') return Math.round(v)
  const paso = Number(modo)
  return Math.round(v / paso) * paso
}

async function cargar(){
  const [tfR, coR] = await Promise.all([
    sb.from('tarifario_tf').select('plan, actividad, valor_lista, valor_nuevo, aumento_desde'),
    sb.from('tarifario_precios').select('practica_codigo, modalidad, obra_social, valor, valor_nuevo, aumento_desde')
  ])
  if (tfR.error) throw tfR.error
  if (coR.error) throw coR.error

  state.tf = (tfR.data || []).sort((a,b) => (a.valor_lista||0) - (b.valor_lista||0))
  state.co = (coR.data || []).sort((a,b) =>
    (a.practica_codigo||'').localeCompare(b.practica_codigo||'') ||
    (a.modalidad||'').localeCompare(b.modalidad||'') ||
    (a.obra_social||'').localeCompare(b.obra_social||''))

  // ¿Hay un aumento programado que todavía NO entró en vigencia?
  const hoy = hoyISO()
  const futuras = [...state.tf, ...state.co]
    .map(r => r.aumento_desde).filter(f => f && f > hoy)
  state.pendiente = futuras.length ? futuras.sort()[0] : null

  render()
}

function inputCambiado(inp, actual){
  const v = Number(inp.value) || 0
  const delta = inp.parentElement.querySelector('.delta')
  if (v > 0 && v !== Number(actual)){
    inp.classList.add('changed')
    if (delta){ const p = ((v/actual - 1)*100); delta.textContent = (p>=0?'+':'') + p.toFixed(0) + '%' }
  } else {
    inp.classList.remove('changed')
    if (delta) delta.textContent = ''
  }
}

function render(){
  const hoy = hoyISO()
  let html = ''

  if (state.pendiente){
    html += `<div class="banner">
      <span>⏳ Hay un aumento programado para el <b>${fechaAr(state.pendiente)}</b>. Abajo lo podés editar, o cancelarlo si todavía no entró en vigencia.</span>
      <button class="btn danger sm" onclick="cancelar()">Cancelar aumento</button>
    </div>`
  }

  // Controles
  html += `<div class="card">
    <div class="controls">
      <div class="fld">
        <label>Vigencia desde</label>
        <input type="date" id="fecha" value="${state.pendiente || primeroProximoMes()}">
      </div>
      <div class="fld">
        <label>Aumentar todo</label>
        <input type="number" id="pct" placeholder="ej. 15" min="0" step="1"><span class="muted" style="position:relative;top:-26px;left:74px">%</span>
      </div>
      <div class="fld">
        <label>Redondear</label>
        <select id="redondeo">
          <option value="500" selected>Al 500</option>
          <option value="100">Al 100</option>
          <option value="1000">Al 1000</option>
          <option value="exacto">Exacto</option>
        </select>
      </div>
      <button class="btn sec sm" onclick="aplicarPct()">Aplicar % a todo</button>
      <button class="btn sec sm" onclick="limpiar()">Limpiar columna</button>
    </div>
    <p class="hint">Tip: aplicá un % para llenar todo de una, y después ajustá a mano los precios que quieras. El precio actual no se toca hasta la fecha de vigencia.</p>
  </div>`

  // Tabla TF
  html += `<div class="card"><table><thead><tr>
    <th>Ítem</th><th class="r">Precio actual</th><th class="r">Precio nuevo</th></tr></thead><tbody>`
  html += `<tr class="grp"><td colspan="3">Terapia Física · Planes</td></tr>`
  state.tf.forEach((r, i) => {
    const lbl = r.plan + (r.actividad && r.actividad !== 'TERAPIA_FISICA' ? ` · ${r.actividad}` : '')
    const pre = (r.aumento_desde && r.aumento_desde > hoy && r.valor_nuevo != null) ? r.valor_nuevo : ''
    html += `<tr>
      <td>${lbl}</td>
      <td class="r actual">${fmt(r.valor_lista)}</td>
      <td class="r"><input class="pn" type="number" id="pntf_${i}" value="${pre}" min="0"
            oninput="inputCambiado(this, ${r.valor_lista})"> <span class="delta"></span></td>
    </tr>`
  })

  // Tabla Consultorio (agrupado por práctica)
  html += `<tr class="grp"><td colspan="3">Consultorio · Fisio · Especialidades · Masajes · BiOLAB</td></tr>`
  let practicaActual = null
  state.co.forEach((r, i) => {
    if (r.practica_codigo !== practicaActual){
      practicaActual = r.practica_codigo
      html += `<tr class="grp"><td colspan="3" style="background:#f8fafc;color:var(--text-dim);font-size:11.5px">${LBL[r.practica_codigo] || r.practica_codigo}</td></tr>`
    }
    const mod = (r.modalidad === 'Particular') ? 'Particular' : (r.obra_social || r.modalidad)
    const pre = (r.aumento_desde && r.aumento_desde > hoy && r.valor_nuevo != null) ? r.valor_nuevo : ''
    html += `<tr>
      <td style="padding-left:22px">${mod}</td>
      <td class="r actual">${fmt(r.valor)}</td>
      <td class="r"><input class="pn" type="number" id="pnco_${i}" value="${pre}" min="0"
            oninput="inputCambiado(this, ${r.valor})"> <span class="delta"></span></td>
    </tr>`
  })
  html += `</tbody></table></div>`

  html += `<div class="res" id="res"></div>`
  html += `<div class="savebar">
    <button class="btn" onclick="guardar()">Guardar aumento programado</button>
    <span class="muted">Te muestra un resumen para confirmar antes de guardar.</span>
  </div>`

  $('app').innerHTML = html
  // pintar deltas precargados
  state.tf.forEach((r,i)=>{ const el=$('pntf_'+i); if(el) inputCambiado(el, r.valor_lista) })
  state.co.forEach((r,i)=>{ const el=$('pnco_'+i); if(el) inputCambiado(el, r.valor) })
}

function aplicarPct(){
  const pct = Number($('pct').value)
  if (!pct || pct <= 0){ msg('Poné un porcentaje (ej. 15).', 'err'); return }
  const modo = $('redondeo').value
  const factor = 1 + pct/100
  state.tf.forEach((r,i)=>{ const el=$('pntf_'+i); if(el){ el.value = redondear(r.valor_lista*factor, modo); inputCambiado(el, r.valor_lista) } })
  state.co.forEach((r,i)=>{ const el=$('pnco_'+i); if(el){ el.value = redondear(r.valor*factor, modo); inputCambiado(el, r.valor) } })
}

function limpiar(){
  state.tf.forEach((r,i)=>{ const el=$('pntf_'+i); if(el){ el.value=''; inputCambiado(el, r.valor_lista) } })
  state.co.forEach((r,i)=>{ const el=$('pnco_'+i); if(el){ el.value=''; inputCambiado(el, r.valor) } })
}

function recolectar(){
  const tf = [], co = []
  state.tf.forEach((r,i)=>{ const v=Number(($('pntf_'+i)||{}).value)||0; if(v>0) tf.push({plan:r.plan, actividad:r.actividad, valor_nuevo:v, _lbl:r.plan, _actual:r.valor_lista}) })
  state.co.forEach((r,i)=>{ const v=Number(($('pnco_'+i)||{}).value)||0; if(v>0) co.push({practica_codigo:r.practica_codigo, modalidad:r.modalidad, obra_social:r.obra_social, valor_nuevo:v, _lbl:(LBL[r.practica_codigo]||r.practica_codigo)+' · '+(r.modalidad==='Particular'?'Particular':(r.obra_social||r.modalidad)), _actual:r.valor}) })
  return { tf, co }
}

function guardar(){
  const fecha = $('fecha').value
  if (!fecha){ msg('Elegí la fecha de vigencia.', 'err'); return }
  const { tf, co } = recolectar()
  const total = tf.length + co.length
  if (total === 0){ msg('No cargaste ningún precio nuevo. Aplicá un % o escribí algún precio.', 'err'); return }

  $('modalTxt').innerHTML = `Vas a programar el aumento de <b>${total}</b> precio(s), con vigencia desde el <b>${fechaAr(fecha)}</b>.<br>Hasta esa fecha se sigue cobrando el precio actual.`
  const todos = [...tf, ...co]
  $('modalLista').innerHTML = todos.map(x =>
    `<div class="lf"><span>${x._lbl}</span><span>${fmt(x._actual)} → <b>${fmt(x.valor_nuevo)}</b></span></div>`
  ).join('')
  $('overlay').classList.add('show')
  $('modalOk').onclick = () => confirmarGuardar(tf, co, fecha)
}

async function confirmarGuardar(tf, co, fecha){
  $('modalOk').disabled = true
  try {
    const payloadTf = tf.map(({plan, actividad, valor_nuevo}) => ({plan, actividad, valor_nuevo}))
    const payloadCo = co.map(({practica_codigo, modalidad, obra_social, valor_nuevo}) => ({practica_codigo, modalidad, obra_social, valor_nuevo}))
    const { data, error } = await sb.rpc('programar_aumento', { p_consultorio: payloadCo, p_tf: payloadTf, p_fecha: fecha })
    if (error) throw error
    cerrarModal()
    msg(`✅ Aumento programado para el ${fechaAr(fecha)}: ${data.tf} plan(es) de TF y ${data.consultorio} precio(s) de consultorio. Se aplica solo desde esa fecha.`, 'ok')
    await cargar()
  } catch(e){
    cerrarModal()
    msg('No se pudo guardar: ' + (e.message || e), 'err')
  } finally {
    $('modalOk').disabled = false
  }
}

async function cancelar(){
  if (!confirm('¿Cancelar el aumento programado? Solo se borra lo que todavía no entró en vigencia.')) return
  try {
    const { data, error } = await sb.rpc('cancelar_aumento_programado')
    if (error) throw error
    msg(`Aumento cancelado (${(data.tf||0)+(data.consultorio||0)} precio(s) vueltos al valor actual).`, 'ok')
    await cargar()
  } catch(e){ msg('No se pudo cancelar: ' + (e.message || e), 'err') }
}

function msg(t, tipo){ const r=$('res'); if(!r) return; r.className='res show '+(tipo||'ok'); r.innerHTML=t; r.scrollIntoView({behavior:'smooth', block:'center'}) }
function cerrarModal(){ $('overlay').classList.remove('show') }

;(async function init(){
  let email = null
  try {
    const { data: s } = await sb.auth.getSession()
    email = s?.session?.user?.email || null
    if(!email){ const { data: u } = await sb.auth.getUser(); email = u?.user?.email || null }
  } catch(_){}
  if(!email || !ADMINS.includes(email.toLowerCase())){
    $('app').innerHTML = `<div class="lock">🔒 Esta sección es solo para administración general (Lu y Jime).</div>`
    return
  }
  try { await cargar() }
  catch(e){ $('app').innerHTML = `<div class="lock">Error cargando precios: ${e.message || e}</div>` }
})()
</script>
</body>
</html>
