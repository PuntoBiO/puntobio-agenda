<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aumentos de precios · PuntoBiO</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg-deep:#f1f5f9;--bg-card:#fff;--bg-soft:#f8fafc;--border:#e5e7eb;
  --turquoise:#1e9fe0;--turquoise-dim:#0c7bb8;--text:#0f172a;--text-dim:#64748b;--text-faint:#94a3b8;
  --green:#16a34a;--green-bg:#dcfce7;--amber:#d97706;--amber-bg:#fef3c7;--red:#dc2626;--red-bg:#fee2e2;--blue-bg:#dbeafe;
}
*{box-sizing:border-box}
body{font-family:'Manrope',system-ui,sans-serif;background:var(--bg-deep);color:var(--text);margin:0;padding:24px 32px 90px;min-height:100vh}
h1{font-size:24px;margin:0 0 4px;display:flex;align-items:center;gap:10px}
.sub{color:var(--text-dim);font-size:14px;margin:0 0 22px}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:20px;max-width:900px;box-shadow:0 1px 3px rgba(0,0,0,.05);margin-bottom:18px}
.banner{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--amber-bg);color:#92400e;border-radius:12px;padding:14px 16px;font-size:13.5px;font-weight:600;margin-bottom:16px;max-width:900px}
.controls{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-size:12px;color:var(--text-dim);font-weight:700}
.fld input,.fld select{padding:9px 11px;border:1.5px solid var(--border);border-radius:9px;font-family:inherit;font-size:14px;background:#fff;height:38px}
.inwrap{display:flex;align-items:center;border:1.5px solid var(--border);border-radius:9px;background:#fff;overflow:hidden;height:38px}
.inwrap input{border:none;width:62px;padding:0 4px 0 11px;text-align:right;font-size:14px;font-family:inherit;background:transparent}
.inwrap input:focus{outline:none}
.inwrap .sfx{padding:0 11px 0 2px;color:var(--text-dim);font-weight:700}
.sep{width:1px;align-self:stretch;background:var(--border);margin:0 2px}
.btn{background:var(--turquoise);color:#fff;border:none;border-radius:10px;padding:11px 18px;font-family:inherit;font-size:14px;font-weight:800;cursor:pointer;box-shadow:0 6px 16px rgba(30,159,224,.25);transition:transform .12s,filter .12s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.05)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn.sec{background:transparent;color:var(--text-dim);border:1.5px solid var(--border);box-shadow:none}
.btn.danger{background:transparent;color:var(--red);border:1.5px solid #fecaca;box-shadow:none}
.btn.sm{padding:9px 14px;font-size:13px;height:38px}
.hint{font-size:12.5px;color:var(--text-faint);margin-top:12px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
thead th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-faint);padding:8px 10px;border-bottom:1.5px solid var(--border)}
thead th.r,tbody td.r{text-align:right}
tbody td{padding:8px 10px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
tbody tr:hover{background:var(--bg-soft)}
.grp td{background:#eff6fb;color:var(--turquoise-dim);font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.03em;padding:9px 10px}
.grp.sub td{background:#e1f0fa;color:var(--turquoise-dim);font-size:12px;text-transform:uppercase;letter-spacing:.03em;font-weight:800;border-left:3px solid var(--turquoise);padding:10px 12px}
.pn{width:108px;padding:7px 9px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:13.5px;text-align:right}
.pn.changed{border-color:var(--turquoise);background:#f0f9ff}
.delta{font-size:11.5px;color:var(--green);font-variant-numeric:tabular-nums;min-width:46px;display:inline-block;text-align:right}
.actual{color:var(--text-dim);font-variant-numeric:tabular-nums}
.acc-cell{text-align:center;width:44px}
.del{background:transparent;border:none;cursor:pointer;font-size:15px;opacity:.45;transition:opacity .12s;padding:4px;border-radius:6px}
.del:hover{opacity:1;background:#fee2e2}
.lock-ico{opacity:.3;font-size:13px}
.chev{display:inline-block;width:13px;color:var(--turquoise-dim);font-size:11px}
.addbtn{background:#eff6fb;color:var(--turquoise-dim);border:1px solid #cde8f7;border-radius:8px;padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer;float:right}
.addbtn:hover{background:#e0f0fa}
.res{margin-top:14px;font-size:13.5px;padding:12px 14px;border-radius:10px;display:none;max-width:900px}
.res.show{display:block}
.res.ok{background:var(--green-bg);color:#166534}
.res.err{background:var(--red-bg);color:#991b1b}
.savebar{position:sticky;bottom:0;background:linear-gradient(to top,var(--bg-deep) 60%,transparent);padding:16px 0 4px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;max-width:900px}
.lock{max-width:520px;background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:28px;text-align:center;color:var(--text-dim)}
.muted{color:var(--text-faint);font-size:12.5px}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:16px;padding:24px;max-width:480px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal h3{margin:0 0 14px;font-size:18px}
.modal p{font-size:14px;color:var(--text-dim);margin:0 0 14px;line-height:1.5}
.modal .lista{max-height:200px;overflow:auto;border:1px solid var(--border);border-radius:10px;margin-bottom:16px}
.modal .lf{display:flex;justify-content:space-between;gap:8px;padding:7px 12px;font-size:12.5px;border-bottom:1px solid #f1f5f9}
.modal .lf:last-child{border-bottom:none}
.modal .acc{display:flex;gap:10px;justify-content:flex-end}
.cfld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.cfld label{font-size:12px;color:var(--text-dim);font-weight:700}
.cfld input,.cfld select{padding:9px 11px;border:1.5px solid var(--border);border-radius:9px;font-family:inherit;font-size:14px}
</style>
</head>
<body>
  <h1>💲 Aumentos de precios</h1>
  <p class="sub">Programá un aumento por área con fecha de vigencia. El sistema lo aplica solo desde esa fecha, en todas las pantallas.</p>
  <div id="app"><p class="muted">Cargando…</p></div>

  <!-- modal confirmar guardar -->
  <div class="overlay" id="overlay">
    <div class="modal">
      <h3>Confirmar aumento</h3>
      <p id="modalTxt"></p>
      <div class="lista" id="modalLista"></div>
      <div class="acc">
        <button class="btn sec" onclick="cerrarModal()">Volver</button>
        <button class="btn" id="modalOk">Sí, programar</button>
      </div>
    </div>
  </div>

  <!-- modal crear ítem -->
  <div class="overlay" id="ovCrear">
    <div class="modal">
      <h3 id="crearTitulo">Agregar ítem</h3>
      <div id="crearForm"></div>
      <div class="acc">
        <button class="btn sec" onclick="cerrarCrear()">Cancelar</button>
        <button class="btn" id="crearOk" onclick="guardarCrear()">Crear</button>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://bqpjtoiictnzcasxfucf.supabase.co'
const SUPABASE_KEY = 'sb_publishable_yvuXDxrkRrhXwmZBnE_a_Q_zDBz0iDi'
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { lock: (name, t, fn) => fn() } })

const ADMINS = ['liclucianavelaz@gmail.com', 'jimenahllorente@gmail.com']

const $ = id => document.getElementById(id)
const state = { tf: [], co: [], pendiente: null, planesEnUso: new Set(), practicasEnUso: new Set() }

const LBL = {
  FISIO:'Fisio',
  FISIO_PQ:'Fisio postquirúrgico (PQX)',
  FISIO_SC:'Fisio sin coseguro (solo Jime)',
  EVAL:'Evaluación',
  OSTEO:'Osteopatía',
  OSTEO_C:'Osteopatía (cortesía · no se cobra)',
  DLM:'Drenaje (DLM)', DRENAJE:'Drenaje', PUNC_SECA:'Punción seca', TERAPIA_MANUAL:'Terapia manual',
  SUELO_PEL:'Suelo pélvico', MOPLEX:'Moplex', PP:'Punción profunda',
  MASAJES_EYC:'Masajes EyC (Espalda y Cuello)',
  MASAJES_CC:'Masajes CC (Cuerpo Completo)',
  MASAJES_R:'Masajes R (regalo al paciente · PuntoBiO le paga a Vero)',
  MASAJES_PAK:'Masajes Pak (4 paga 3)',
  MASAJES_CERO:'Masajes cortesía (Vero atiende a las dueñas / equipo)',
  SARKMED_BL:'Sarkmed BiOLAB', SARKMED_PP:'Sarkmed PP'
}
const fmt = n => '$' + Number(n || 0).toLocaleString('es-AR')
const fechaAr = iso => { if(!iso) return '—'; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}` }
function primeroProximoMes(){
  const d = new Date()
  const esDic = d.getMonth() === 11
  const y = esDic ? d.getFullYear()+1 : d.getFullYear()
  const m = (d.getMonth()+1) % 12
  return `${y}-${String(m+1).padStart(2,'0')}-01`
}
function hoyISO(){ return new Date().toISOString().slice(0,10) }
function redondear(v, modo){
  v = Number(v) || 0
  if (modo === 'exacto') return Math.round(v)
  const paso = Number(modo)
  return Math.round(v / paso) * paso
}

async function cargar(){
  const [tfR, coR, usoR, mxR, pqxR] = await Promise.all([
    sb.from('tarifario_tf').select('plan, actividad, valor_lista, valor_nuevo, aumento_desde'),
    sb.from('tarifario_precios').select('practica_codigo, modalidad, obra_social, valor, valor_nuevo, aumento_desde'),
    sb.rpc('tarifario_en_uso'),
    sb.from('tarifario_splits').select('pct_centro, pct_moplex').eq('practica_codigo','MOPLEX').eq('profesional','Bruno').maybeSingle(),
    sb.from('precios_config').select('pqx_recargo').eq('id',1).maybeSingle()
  ])
  if (tfR.error) throw tfR.error
  if (coR.error) throw coR.error

  state.moplexSplit = (mxR && mxR.data) ? mxR.data : { pct_centro: 0, pct_moplex: 0 }
  state.pqxRecargo = (pqxR && pqxR.data && pqxR.data.pqx_recargo != null) ? Number(pqxR.data.pqx_recargo) : 1000

  state.tf = (tfR.data || []).sort((a,b) => (a.valor_lista||0) - (b.valor_lista||0))
  state.co = (coR.data || []).filter(r => r.practica_codigo !== 'RPG').sort((a,b) =>
    (a.practica_codigo||'').localeCompare(b.practica_codigo||'') ||
    (a.modalidad||'').localeCompare(b.modalidad||'') ||
    (a.obra_social||'').localeCompare(b.obra_social||''))

  state.planesEnUso = new Set(((usoR && usoR.data && usoR.data.planes) || []))
  state.practicasEnUso = new Set(((usoR && usoR.data && usoR.data.practicas) || []))

  const hoy = hoyISO()
  const futuras = [...state.tf, ...state.co].map(r => r.aumento_desde).filter(f => f && f > hoy)
  state.pendiente = futuras.length ? futuras.sort()[0] : null

  render()
}

function inputCambiado(inp, actual){
  const v = Number(inp.value) || 0
  const delta = inp.parentElement.querySelector('.delta')
  if (v > 0 && v !== Number(actual)){
    inp.classList.add('changed')
    if (delta){ const p = ((v/actual - 1)*100); delta.textContent = (p>=0?'+':'') + p.toFixed(0) + '%' }
  } else {
    inp.classList.remove('changed')
    if (delta) delta.textContent = ''
  }
}

function celdaAccionTf(r){
  if (state.planesEnUso.has(r.plan)) return `<span class="lock-ico" title="En uso, no se puede borrar">🔒</span>`
  return `<button class="del" title="Borrar plan" onclick="borrarTf('${r.plan}','${r.actividad}')">🗑️</button>`
}
function celdaAccionCo(r){
  if (state.practicasEnUso.has(r.practica_codigo)) return `<span class="lock-ico" title="Práctica en uso, no se puede borrar">🔒</span>`
  return `<button class="del" title="Borrar precio" onclick="borrarCo('${r.practica_codigo}','${r.modalidad}','${(r.obra_social||'')}')">🗑️</button>`
}

function render(){
  const hoy = hoyISO()
  let html = ''

  if (state.pendiente){
    html += `<div class="banner">
      <span>⏳ Hay un aumento programado para el <b>${fechaAr(state.pendiente)}</b>. Abajo lo podés editar, o cancelarlo si todavía no entró en vigencia.</span>
      <button class="btn danger sm" onclick="cancelar()">Cancelar aumento</button>
    </div>`
  }

  html += `<div class="card">
    <div class="controls">
      <div class="fld">
        <label>Vigencia desde</label>
        <input type="date" id="fecha" value="${state.pendiente || primeroProximoMes()}">
      </div>
      <div class="sep"></div>
      <div class="fld">
        <label>Aumentar todo</label>
        <div class="inwrap"><input type="number" id="pct" placeholder="15" min="0" step="1"><span class="sfx">%</span></div>
      </div>
      <div class="fld">
        <label>Redondear</label>
        <select id="redondeo">
          <option value="500" selected>Al 500</option>
          <option value="100">Al 100</option>
          <option value="1000">Al 1000</option>
          <option value="exacto">Exacto</option>
        </select>
      </div>
      <button class="btn sec sm" onclick="aplicarPct()">Aplicar % a todo</button>
      <button class="btn sec sm" onclick="limpiar()">Limpiar columna</button>
    </div>
    <p class="hint">Aplicá un % para llenar todo de una, y después ajustá a mano los precios que quieras. El precio actual no se toca hasta la fecha de vigencia.</p>
  </div>`

  // ===== MOPLEX =====
  const mxRow = state.co.find(r => r.practica_codigo === 'MOPLEX' && r.modalidad === 'Particular')
  const mxPrecio = mxRow ? (mxRow.valor || 0) : 0
  const mxC = Number(state.moplexSplit.pct_centro) || 0
  const mxM = Number(state.moplexSplit.pct_moplex) || 0
  const mxP = 100 - mxC - mxM
  html += `<div class="card" style="border-left:4px solid var(--turquoise)">
    <h3 style="margin:0 0 4px;font-size:16px">🔬 Configurar MOPLEX</h3>
    <p class="hint" style="margin:0 0 14px">Precio a público y reparto de la evaluación. El <b>% profesional</b> es lo que se lleva quien evalúa (Bruno o Male). Las dueñas (Jime/Lu) van siempre 100% al centro. Aplica a las evaluaciones nuevas desde que guardás.</p>
    <div class="controls">
      <div class="fld"><label>Precio a público</label><input type="number" id="mxPrecio" min="0" step="100" value="${mxPrecio}" oninput="calcMoplex()"></div>
      <div class="sep"></div>
      <div class="fld"><label>% Centro</label><div class="inwrap"><input type="number" id="mxCentro" min="0" max="100" step="1" value="${mxC}" oninput="calcMoplex()"><span class="sfx">%</span></div></div>
      <div class="fld"><label>% MOPLEX</label><div class="inwrap"><input type="number" id="mxMoplex" min="0" max="100" step="1" value="${mxM}" oninput="calcMoplex()"><span class="sfx">%</span></div></div>
      <div class="fld"><label>% Profesional</label><div class="inwrap"><input type="text" id="mxProf" value="${mxP}" readonly style="background:#f1f5f9;color:#475569"><span class="sfx">%</span></div></div>
      <button class="btn sm" onclick="guardarMoplex()">Guardar MOPLEX</button>
    </div>
    <p class="hint" id="mxPreview" style="margin:10px 0 0"></p>
  </div>`

  // ===== PQX (postquirúrgico) automático =====
  html += `<div class="card" style="border-left:4px solid var(--turquoise)">
    <h3 style="margin:0 0 4px;font-size:16px">🩹 Postquirúrgico (PQX)</h3>
    <p class="hint" style="margin:0 0 14px">El precio de PQX se calcula <b>solo</b>: es el de Fisio más este recargo. No hace falta cargarlo a mano — cuando cambiás un Fisio, su PQX se acomoda solo.</p>
    <div class="controls">
      <div class="fld"><label>PQX = Fisio +</label><div class="inwrap"><span class="sfx" style="left:10px;right:auto">$</span><input type="number" id="pqxRec" min="0" step="100" value="${state.pqxRecargo}" style="padding-left:22px"></div></div>
      <button class="btn sm" onclick="guardarRecargoPqx()">Guardar recargo</button>
    </div>
  </div>`

  html += `<div class="toolbar2" style="display:flex;gap:8px;align-items:center;margin:0 0 8px;max-width:900px">
    <button class="btn sec sm" onclick="abrirTodo(true)">Abrir todo</button>
    <button class="btn sec sm" onclick="abrirTodo(false)">Cerrar todo</button>
    <span class="muted" style="margin-left:auto">Tocá cada sección para abrirla</span>
  </div>`

  html += `<div class="card"><table><thead><tr>
    <th>Ítem</th>
    <th class="r">Lista vigente</th>
    <th class="r">A lanzar</th>
    <th class="r">De baja</th>
    <th></th></tr></thead><tbody>`

  const dash = '<span class="muted">—</span>'

  // ===== TF =====
  html += `<tr class="grp" onclick="toggleGrp('TF', this)" style="cursor:pointer">
    <td colspan="5"><span class="chev">▸</span> Terapia Física · Planes (${state.tf.length})
    <button class="addbtn" onclick="event.stopPropagation();abrirCrear('tf')">➕ Agregar plan</button></td></tr>`
  state.tf.forEach((r, i) => {
    const lbl = r.plan + (r.actividad && r.actividad !== 'TERAPIA_FISICA' ? ` · ${r.actividad}` : '')
    const e = estadosPrecio(r.valor_lista, r.valor_nuevo, r.aumento_desde, hoy)
    const inputVal = e.futura ? e.aLanzar : ''
    html += `<tr class="r-TF" style="display:none">
      <td>${lbl}</td>
      <td class="r actual">${fmt(e.vigente)}</td>
      <td class="r"><input class="pn" type="number" id="pntf_${i}" value="${inputVal}" min="0" oninput="inputCambiado(this, ${e.vigente})"> <span class="delta"></span></td>
      <td class="r">${e.deBaja != null ? '<span class="actual">'+fmt(e.deBaja)+'</span>' : dash}</td>
      <td class="acc-cell">${celdaAccionTf(r)}</td>
    </tr>`
  })

  // ===== Consultorio =====
  const coCount = {}
  state.co.forEach(r => { coCount[r.practica_codigo] = (coCount[r.practica_codigo]||0) + 1 })

  html += `<tr class="grp"><td colspan="5" style="cursor:default">Consultorio · Fisio · Especialidades · Masajes · BiOLAB
    <button class="addbtn" onclick="event.stopPropagation();abrirCrear('co')">➕ Agregar precio</button></td></tr>`
  let practicaActual = null
  state.co.forEach((r, i) => {
    if (r.practica_codigo !== practicaActual){
      practicaActual = r.practica_codigo
      html += `<tr class="grp sub" onclick="toggleGrp('${r.practica_codigo}', this)" style="cursor:pointer">
        <td colspan="5"><span class="chev">▸</span> ${LBL[r.practica_codigo] || r.practica_codigo} (${coCount[r.practica_codigo]})</td></tr>`
    }
    const mod = (r.modalidad === 'Particular') ? 'Particular' : (r.obra_social || r.modalidad)
    const cls = 'r-' + r.practica_codigo
    const e = estadosPrecio(r.valor, r.valor_nuevo, r.aumento_desde, hoy)
    if (r.practica_codigo === 'FISIO_PQ'){
      // PQX automático = Fisio + recargo. No editable.
      html += `<tr class="${cls}" style="display:none">
        <td style="padding-left:22px">${mod}</td>
        <td class="r actual">${fmt(e.vigente)}</td>
        <td class="r" style="color:var(--text-faint)">${e.aLanzar != null ? fmt(e.aLanzar) + ' ' : ''}<span title="Se calcula solo: Fisio + recargo">🔒 auto</span></td>
        <td class="r">${e.deBaja != null ? '<span class="actual">'+fmt(e.deBaja)+'</span>' : dash}</td>
        <td class="acc-cell"></td>
      </tr>`
    } else {
      const inputVal = e.futura ? e.aLanzar : ''
      html += `<tr class="${cls}" style="display:none">
        <td style="padding-left:22px">${mod}</td>
        <td class="r actual">${fmt(e.vigente)}</td>
        <td class="r"><input class="pn" type="number" id="pnco_${i}" value="${inputVal}" min="0" oninput="inputCambiado(this, ${e.vigente})"> <span class="delta"></span></td>
        <td class="r">${e.deBaja != null ? '<span class="actual">'+fmt(e.deBaja)+'</span>' : dash}</td>
        <td class="acc-cell">${celdaAccionCo(r)}</td>
      </tr>`
    }
  })
  html += `</tbody></table></div>`

  html += `<div class="res" id="res"></div>`
  html += `<div class="savebar">
    <button class="btn" onclick="guardar()">Guardar aumento programado</button>
    <span class="muted">Te muestra un resumen para confirmar antes de guardar.</span>
  </div>`

  $('app').innerHTML = html
  state.tf.forEach((r,i)=>{ const el=$('pntf_'+i); if(el) inputCambiado(el, r.valor_lista) })
  state.co.forEach((r,i)=>{ const el=$('pnco_'+i); if(el) inputCambiado(el, r.valor) })
  calcMoplex()
}

function aplicarPct(){
  const pct = Number($('pct').value)
  if (!pct || pct <= 0){ msg('Poné un porcentaje (ej. 15).', 'err'); return }
  const modo = $('redondeo').value
  const factor = 1 + pct/100
  const hoy = hoyISO()
  state.tf.forEach((r,i)=>{ const el=$('pntf_'+i); if(el){ const v=estadosPrecio(r.valor_lista,r.valor_nuevo,r.aumento_desde,hoy).vigente; el.value = redondear(v*factor, modo); inputCambiado(el, v) } })
  state.co.forEach((r,i)=>{ const el=$('pnco_'+i); if(el){ const v=estadosPrecio(r.valor,r.valor_nuevo,r.aumento_desde,hoy).vigente; el.value = redondear(v*factor, modo); inputCambiado(el, v) } })
}

function limpiar(){
  state.tf.forEach((r,i)=>{ const el=$('pntf_'+i); if(el){ el.value=''; inputCambiado(el, r.valor_lista) } })
  state.co.forEach((r,i)=>{ const el=$('pnco_'+i); if(el){ el.value=''; inputCambiado(el, r.valor) } })
}

// Calcula los tres estados de un precio a partir de los datos + la fecha de hoy.
function estadosPrecio(base, valorNuevo, aumentoDesde, hoy){
  const activa = !!(aumentoDesde && valorNuevo != null && aumentoDesde <= hoy)   // el aumento YA entró
  const futura = !!(aumentoDesde && valorNuevo != null && aumentoDesde >  hoy)   // programado a futuro
  return {
    vigente: activa ? valorNuevo : base,   // lo que se cobra hoy
    aLanzar: futura ? valorNuevo : null,   // el futuro programado
    deBaja:  activa ? base : null,         // el retirado (queda guardado en 'base')
    activa, futura
  }
}

// Plegar / desplegar una sección (puro CSS, no re-dibuja: no se pierden los valores tipeados)
function toggleGrp(code, el){
  const rows = document.querySelectorAll('tr.r-' + code)
  if (!rows.length) return
  const oculto = rows[0].style.display === 'none'
  rows.forEach(r => r.style.display = oculto ? '' : 'none')
  const chev = el.querySelector('.chev'); if (chev) chev.textContent = oculto ? '▾' : '▸'
}

function abrirTodo(abrir){
  document.querySelectorAll('tr.grp .chev').forEach(ch => {
    const tr = ch.closest('tr'); if (!tr) return
    const m = (tr.getAttribute('onclick')||'').match(/toggleGrp\('([^']+)'/)
    if (!m) return
    const rows = document.querySelectorAll('tr.r-' + m[1])
    rows.forEach(r => r.style.display = abrir ? '' : 'none')
    ch.textContent = abrir ? '▾' : '▸'
  })
}

function calcMoplex(){
  if (!$('mxCentro')) return
  const c = Number($('mxCentro').value) || 0
  const m = Number($('mxMoplex').value) || 0
  const p = 100 - c - m
  if ($('mxProf')) $('mxProf').value = p
  const precio = Number(($('mxPrecio')||{}).value) || 0
  const f = n => '$' + Math.round(n).toLocaleString('es-AR')
  if ($('mxPreview')){
    if (c + m > 100){
      $('mxPreview').innerHTML = '<span style="color:var(--red)">⚠️ Centro + MOPLEX no puede superar 100%.</span>'
    } else if (precio > 0){
      $('mxPreview').innerHTML = `De ${f(precio)}: centro ${f(precio*c/100)} · moplex ${f(precio*m/100)} · profesional ${f(precio*p/100)}.`
    } else {
      $('mxPreview').innerHTML = ''
    }
  }
}

async function guardarMoplex(){
  const precio = Number($('mxPrecio').value) || 0
  const c = Number($('mxCentro').value) || 0
  const m = Number($('mxMoplex').value) || 0
  const p = 100 - c - m
  if (c + m > 100){ msg('Centro + MOPLEX no puede superar 100%.', 'err'); return }
  if (precio <= 0){ msg('Poné el precio a público de MOPLEX.', 'err'); return }
  if (!confirm(`Configurar MOPLEX:\n\nPrecio a público: $${precio.toLocaleString('es-AR')}\nCentro: ${c}%  ·  MOPLEX: ${m}%  ·  Profesional: ${p}%\n\nAplica a las evaluaciones nuevas (Bruno/Male). ¿Confirmás?`)) return
  try {
    const { error } = await sb.rpc('configurar_moplex', { p_precio: precio, p_pct_centro: c, p_pct_moplex: m })
    if (error) throw error
    msg('✅ MOPLEX configurado. Las evaluaciones nuevas ya reparten así.', 'ok')
    await cargar()
  } catch(e){ msg('No se pudo configurar MOPLEX: ' + (e.message || e), 'err') }
}

async function guardarRecargoPqx(){
  const rec = Number($('pqxRec').value)
  if (isNaN(rec) || rec < 0){ msg('Poné un recargo válido (ej. 1000).', 'err'); return }
  if (!confirm(`PQX = Fisio + $${rec.toLocaleString('es-AR')}.\n\nSe recalculan todos los precios postquirúrgicos. ¿Confirmás?`)) return
  try {
    const { error } = await sb.rpc('set_pqx_recargo', { p_recargo: rec })
    if (error) throw error
    msg('✅ Recargo guardado. Los PQX ya se acomodaron a Fisio + $' + rec.toLocaleString('es-AR') + '.', 'ok')
    await cargar()
  } catch(e){ msg('No se pudo guardar el recargo: ' + (e.message || e), 'err') }
}

function recolectar(){
  const tf = [], co = []
  state.tf.forEach((r,i)=>{ const v=Number(($('pntf_'+i)||{}).value)||0; if(v>0) tf.push({plan:r.plan, actividad:r.actividad, valor_nuevo:v, _lbl:r.plan, _actual:r.valor_lista}) })
  state.co.forEach((r,i)=>{ const v=Number(($('pnco_'+i)||{}).value)||0; if(v>0) co.push({practica_codigo:r.practica_codigo, modalidad:r.modalidad, obra_social:r.obra_social, valor_nuevo:v, _lbl:(LBL[r.practica_codigo]||r.practica_codigo)+' · '+(r.modalidad==='Particular'?'Particular':(r.obra_social||r.modalidad)), _actual:r.valor}) })
  return { tf, co }
}

function guardar(){
  const fecha = $('fecha').value
  if (!fecha){ msg('Elegí la fecha de vigencia.', 'err'); return }
  const { tf, co } = recolectar()
  const total = tf.length + co.length
  if (total === 0){ msg('No cargaste ningún precio nuevo. Aplicá un % o escribí algún precio.', 'err'); return }

  $('modalTxt').innerHTML = `Vas a programar el aumento de <b>${total}</b> precio(s), con vigencia desde el <b>${fechaAr(fecha)}</b>.<br>Hasta esa fecha se sigue cobrando el precio actual.`
  const todos = [...tf, ...co]
  $('modalLista').innerHTML = todos.map(x => `<div class="lf"><span>${x._lbl}</span><span>${fmt(x._actual)} → <b>${fmt(x.valor_nuevo)}</b></span></div>`).join('')
  $('overlay').classList.add('show')
  $('modalOk').onclick = () => confirmarGuardar(tf, co, fecha)
}

async function confirmarGuardar(tf, co, fecha){
  $('modalOk').disabled = true
  try {
    const payloadTf = tf.map(({plan, actividad, valor_nuevo}) => ({plan, actividad, valor_nuevo}))
    const payloadCo = co.map(({practica_codigo, modalidad, obra_social, valor_nuevo}) => ({practica_codigo, modalidad, obra_social, valor_nuevo}))
    const { data, error } = await sb.rpc('programar_aumento', { p_consultorio: payloadCo, p_tf: payloadTf, p_fecha: fecha })
    if (error) throw error
    cerrarModal()
    msg(`✅ Aumento programado para el ${fechaAr(fecha)}: ${data.tf} plan(es) de TF y ${data.consultorio} precio(s) de consultorio. Se aplica solo desde esa fecha.`, 'ok')
    await cargar()
  } catch(e){
    cerrarModal()
    msg('No se pudo guardar: ' + (e.message || e), 'err')
  } finally {
    $('modalOk').disabled = false
  }
}

async function cancelar(){
  if (!confirm('¿Cancelar el aumento programado? Solo se borra lo que todavía no entró en vigencia.')) return
  try {
    const { data, error } = await sb.rpc('cancelar_aumento_programado')
    if (error) throw error
    msg(`Aumento cancelado (${(data.tf||0)+(data.consultorio||0)} precio(s) vueltos al valor actual).`, 'ok')
    await cargar()
  } catch(e){ msg('No se pudo cancelar: ' + (e.message || e), 'err') }
}

// ---- Borrar ----
async function borrarTf(plan, actividad){
  if(!confirm(`¿Borrar el plan "${plan}"?\n\nSolo se puede si no está en uso en ninguna inscripción.`)) return
  try {
    const { error } = await sb.rpc('tarifario_tf_borrar', { p_plan: plan, p_actividad: actividad })
    if (error) throw error
    msg(`🗑️ Plan "${plan}" borrado.`, 'ok'); await cargar()
  } catch(e){ msg(e.message || String(e), 'err') }
}
async function borrarCo(practica, modalidad, obra_social){
  const etq = (LBL[practica]||practica) + ' · ' + (modalidad==='Particular' ? 'Particular' : (obra_social||modalidad))
  if(!confirm(`¿Borrar este precio?\n\n${etq}\n\nSolo se puede si la práctica no está en uso.`)) return
  try {
    const { error } = await sb.rpc('tarifario_precio_borrar', { p_practica: practica, p_modalidad: modalidad, p_obra_social: obra_social||'' })
    if (error) throw error
    msg(`🗑️ Precio borrado (${etq}).`, 'ok'); await cargar()
  } catch(e){ msg(e.message || String(e), 'err') }
}

// ---- Preview en vivo del plan de TF (solo visual; calca las reglas de la ficha del alumno) ----
// Clases/semana = número pegado a COD (COD4=4, COD4DES3=4). Sufijos DES/ROT/BON no cambian el nº.
function _clasesSemPlan(cod){
  if(!cod) return 0
  const m = String(cod).toUpperCase().match(/COD\s*0*([1-9])/)
  return m ? parseInt(m[1],10) : 0
}
// Recuperatorios/ciclo: BON=14 · ROT=N×5 · Regular=N+2
function _cupoRecupPlan(cod){
  if(!cod) return 0
  const up = String(cod).toUpperCase()
  if(up.includes('BON')) return 14
  const n = _clasesSemPlan(cod)
  if(up.includes('ROT')) return n>0 ? n*5 : 0
  return n>0 ? n+2 : 0
}
function previewPlanTF(){
  const box = $('cPlanPreview'); if(!box) return
  const raw = ($('cPlan').value||'').trim()
  const up = raw.toUpperCase()
  const base = 'display:block;margin:-6px 0 14px;padding:8px 12px;border-radius:8px;font-size:12.5px;line-height:1.45'
  const setBtn = b => { const ok=$('crearOk'); if(ok) ok.disabled = b }
  if(!raw){ box.innerHTML=''; setBtn(false); return }
  // ¿ya existe ese plan en el tarifario? (no permitir duplicar/pisar)
  const yaExiste = (state.tf||[]).some(r => String(r.plan||'').toUpperCase() === up)
  if(yaExiste){
    const enUso = state.planesEnUso && state.planesEnUso.has(raw)
    const nota = enUso ? ' Además <b>tiene alumnos activos</b>, no lo toques desde acá.' : ''
    box.innerHTML = `<div style="${base};background:#fee2e2;color:#b91c1c;border:1px solid #fca5a5">🔒 <b>Ya existe un plan «${up}»</b>. No se puede crear de nuevo.${nota}</div>`
    setBtn(true)
    return
  }
  if(!up.startsWith('COD')){
    box.innerHTML = `<div style="${base};background:#fee2e2;color:#b91c1c;border:1px solid #fca5a5">⚠️ El nombre debería empezar con <b>COD</b>. Si no, el sistema le daría <b>0 clases</b>.</div>`
    setBtn(false)
    return
  }
  if(up.includes('BON')){
    box.innerHTML = `<div style="${base};background:#ede9fe;color:#6d28d9;border:1px solid #c4b5fd">💜 <b>Bonificado</b> · pase libre · ${_cupoRecupPlan(raw)} recuperatorios/ciclo</div>`
    setBtn(false)
    return
  }
  const n = _clasesSemPlan(raw)
  if(n === 0){
    box.innerHTML = `<div style="${base};background:#fef3c7;color:#92400e;border:1px solid #fcd34d">⚠️ No detecto la cantidad de clases. El número tiene que ir <b>pegado a COD</b> (ej: COD4, COD4DES3). Así daría <b>0 clases</b>.</div>`
    setBtn(false)
    return
  }
  const tipo = up.includes('ROT') ? 'Rotativo' : 'Regular'
  box.innerHTML = `<div style="${base};background:#e0f2fe;color:#075985;border:1px solid #7dd3fc">→ <b>${n} clase${n>1?'s':''}/semana</b> · ${_cupoRecupPlan(raw)} recuperatorios/ciclo · ${tipo}</div>`
  setBtn(false)
}

// ---- Crear ----
let crearTipo = null
function abrirCrear(tipo){
  crearTipo = tipo
  $('crearTitulo').textContent = tipo === 'tf' ? 'Agregar plan de TF' : 'Agregar precio de consultorio'
  if (tipo === 'tf'){
    $('crearForm').innerHTML = `
      <div class="cfld"><label>Nombre del plan</label><input id="cPlan" placeholder="ej. COD4" oninput="previewPlanTF()"></div>
      <div id="cPlanPreview"></div>
      <div class="cfld"><label>Precio actual ($)</label><input id="cValor" type="number" min="0" placeholder="0"></div>`
  } else {
    $('crearForm').innerHTML = `
      <div class="cfld"><label>Código de práctica</label><input id="cPractica" placeholder="ej. FISIO, OSTEO, MASAJES_CC"></div>
      <div class="cfld"><label>Modalidad</label><select id="cModalidad" onchange="toggleOS()"><option value="Particular">Particular</option><option value="O.S">Obra Social</option></select></div>
      <div class="cfld" id="cOSwrap" style="display:none"><label>Obra social</label><input id="cObra" placeholder="ej. APROSS"></div>
      <div class="cfld"><label>Precio actual ($)</label><input id="cValor" type="number" min="0" placeholder="0"></div>`
  }
  if($('crearOk')) $('crearOk').disabled = false
  $('ovCrear').classList.add('show')
}
function toggleOS(){ const os = $('cModalidad').value === 'O.S'; $('cOSwrap').style.display = os ? 'block' : 'none' }
function cerrarCrear(){ $('ovCrear').classList.remove('show') }
async function guardarCrear(){
  $('crearOk').disabled = true
  try {
    if (crearTipo === 'tf'){
      const plan = ($('cPlan').value||'').trim()
      const valor = Number($('cValor').value)||0
      if(!plan){ alert('Poné el nombre del plan'); return }
      const { error } = await sb.rpc('tarifario_tf_crear', { p_plan: plan, p_actividad: 'TERAPIA_FISICA', p_valor_lista: valor })
      if (error) throw error
    } else {
      const practica = ($('cPractica').value||'').trim()
      const modalidad = $('cModalidad').value
      const obra = modalidad==='O.S' ? ($('cObra').value||'').trim() : ''
      const valor = Number($('cValor').value)||0
      if(!practica){ alert('Poné el código de práctica'); return }
      if(modalidad==='O.S' && !obra){ alert('Poné la obra social'); return }
      const { error } = await sb.rpc('tarifario_precio_crear', { p_practica: practica, p_modalidad: modalidad, p_obra_social: obra, p_valor: valor })
      if (error) throw error
    }
    cerrarCrear()
    msg('✅ Ítem creado.', 'ok')
    await cargar()
  } catch(e){ alert('No se pudo crear: ' + (e.message || e)) }
  finally { $('crearOk').disabled = false }
}

function msg(t, tipo){ const r=$('res'); if(!r) return; r.className='res show '+(tipo||'ok'); r.innerHTML=t; r.scrollIntoView({behavior:'smooth', block:'center'}) }
function cerrarModal(){ $('overlay').classList.remove('show') }

;(async function init(){
  let email = null
  try {
    const { data: s } = await sb.auth.getSession()
    email = s?.session?.user?.email || null
    if(!email){ const { data: u } = await sb.auth.getUser(); email = u?.user?.email || null }
  } catch(_){}
  if(!email || !ADMINS.includes(email.toLowerCase())){
    $('app').innerHTML = `<div class="lock">🔒 Esta sección es solo para administración general (Lu y Jime).</div>`
    return
  }
  try { await cargar() }
  catch(e){ $('app').innerHTML = `<div class="lock">Error cargando precios: ${e.message || e}</div>` }
})()
</script>
