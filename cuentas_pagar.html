<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuentas a Pagar — PuntoBiO</title>
<style>
:root {
  --azul: #1e9fe0;
  --negro: #111;
  --panel: #1a1f2e;
  --panel-2: #222a3d;
  --borde: rgba(30, 159, 224, 0.25);
  --texto: #e7eef7;
  --texto-dim: #8a9bb8;
  --verde: #16a34a;
  --rojo: #dc2626;
  --amarillo: #f59e0b;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--negro);
  color: var(--texto);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  padding: 20px;
  min-height: 100vh;
}
h1 { font-size: 22px; color: var(--azul); margin-bottom: 4px; }
.subtitulo { color: var(--texto-dim); font-size: 13px; margin-bottom: 18px; }

/* Navegador de mes */
.mes-nav {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 16px; flex-wrap: wrap;
}
.mes-nav button.flecha {
  background: var(--panel-2); border: 1px solid var(--borde); color: var(--texto);
  width: 38px; height: 38px; border-radius: 10px; font-size: 16px; cursor: pointer;
}
.mes-nav button.flecha:hover { background: var(--azul); }
.mes-actual {
  font-size: 18px; font-weight: 800; min-width: 170px; text-align: center;
  text-transform: capitalize;
}
.mes-nav .spacer { flex: 1; }
.btn {
  border: none; border-radius: 10px; padding: 10px 16px; font-weight: 700;
  font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
}
.btn-azul { background: var(--azul); color: #fff; }
.btn-gris { background: var(--panel-2); color: var(--texto); border: 1px solid var(--borde); }
.btn:hover { filter: brightness(1.15); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* Tarjetas resumen */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 18px; }
.card {
  background: var(--panel); border: 1px solid var(--borde); border-radius: 14px;
  padding: 14px 16px;
}
.card .label { font-size: 12px; color: var(--texto-dim); text-transform: uppercase; letter-spacing: 0.5px; }
.card .monto { font-size: 21px; font-weight: 800; margin-top: 4px; }
.card.total .monto { color: var(--azul); }
.card.pagado .monto { color: var(--verde); }
.card.pendiente .monto { color: var(--amarillo); }
.card .detalle { font-size: 12px; color: var(--texto-dim); margin-top: 2px; }

/* Filtro categorías */
.filtros { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.chip {
  background: var(--panel-2); border: 1px solid var(--borde); color: var(--texto-dim);
  border-radius: 999px; padding: 6px 13px; font-size: 12px; font-weight: 600; cursor: pointer;
}
.chip.activo { background: var(--azul); color: #fff; border-color: var(--azul); }

/* Tabla */
.tabla-wrap { background: var(--panel); border: 1px solid var(--borde); border-radius: 14px; overflow: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 760px; }
thead th {
  background: var(--panel-2); color: var(--texto-dim); text-align: left;
  padding: 10px 12px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;
  position: sticky; top: 0;
}
tbody td { padding: 10px 12px; border-top: 1px solid rgba(255,255,255,0.05); }
tbody tr:hover { background: rgba(30,159,224,0.06); }
td.num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
tfoot td { padding: 12px; font-weight: 800; border-top: 2px solid var(--borde); background: var(--panel-2); }
.estado-pill {
  display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700;
}
.estado-pagada { background: rgba(22,163,74,0.18); color: #4ade80; }
.estado-pendiente { background: rgba(245,158,11,0.18); color: #fbbf24; }
.estado-vencida { background: rgba(220,38,38,0.18); color: #f87171; }
.cat-tag { font-size: 11px; color: var(--texto-dim); }
.acciones { white-space: nowrap; }
.acciones button {
  background: none; border: none; cursor: pointer; font-size: 15px; padding: 3px 5px;
  border-radius: 6px;
}
.acciones button:hover { background: var(--panel-2); }
.vacio { padding: 38px; text-align: center; color: var(--texto-dim); }

/* Modal */
.modal-fondo {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7);
  z-index: 100; align-items: center; justify-content: center; padding: 16px;
}
.modal-fondo.visible { display: flex; }
.modal {
  background: var(--panel); border: 1px solid var(--borde); border-radius: 16px;
  padding: 22px; width: 100%; max-width: 460px; max-height: 92vh; overflow: auto;
}
.modal h2 { font-size: 17px; color: var(--azul); margin-bottom: 16px; }
.campo { margin-bottom: 12px; }
.campo label { display: block; font-size: 12px; color: var(--texto-dim); margin-bottom: 5px; font-weight: 600; }
.campo input, .campo select, .campo textarea {
  width: 100%; background: var(--negro); border: 1px solid var(--borde); color: var(--texto);
  border-radius: 9px; padding: 10px 12px; font-size: 14px; font-family: inherit;
}
.campo input:focus, .campo select:focus, .campo textarea:focus { outline: 2px solid var(--azul); border-color: transparent; }
.campos-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.modal-botones { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }

#guardia { padding: 60px 20px; text-align: center; color: var(--texto-dim); font-size: 15px; }
@media (max-width: 600px) {
  body { padding: 12px; }
  .campos-2 { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div id="guardia">Cargando…</div>

<div id="app" style="display:none">
  <h1>💸 Cuentas a Pagar</h1>
  <div class="subtitulo">Gastos del centro · solo Lu y Jime</div>

  <div class="mes-nav">
    <button class="flecha" onclick="cambiarMes(-1)">◀</button>
    <div class="mes-actual" id="mesActual"></div>
    <button class="flecha" onclick="cambiarMes(1)">▶</button>
    <div class="spacer"></div>
    <button class="btn btn-gris" id="btnCopiar" onclick="copiarMesAnterior()">📋 Copiar mes anterior</button>
    <button class="btn btn-azul" onclick="abrirModal()">➕ Nuevo gasto</button>
  </div>

  <div class="cards">
    <div class="card total">
      <div class="label">Total del mes</div>
      <div class="monto" id="cardTotal">$ 0</div>
      <div class="detalle" id="cardTotalDet"></div>
    </div>
    <div class="card pagado">
      <div class="label">Pagado</div>
      <div class="monto" id="cardPagado">$ 0</div>
      <div class="detalle" id="cardPagadoDet"></div>
    </div>
    <div class="card pendiente">
      <div class="label">Pendiente</div>
      <div class="monto" id="cardPendiente">$ 0</div>
      <div class="detalle" id="cardPendienteDet"></div>
    </div>
  </div>

  <div class="filtros" id="filtros"></div>

  <div class="tabla-wrap">
    <table>
      <thead>
        <tr>
          <th>Vencimiento</th>
          <th>Descripción</th>
          <th>Categoría</th>
          <th>Tipo</th>
          <th style="text-align:right">Valor</th>
          <th>Estado</th>
          <th>Pagado el</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
      <tfoot id="tfoot"></tfoot>
    </table>
    <div class="vacio" id="vacio" style="display:none">No hay gastos cargados en este mes.</div>
  </div>
</div>

<!-- Modal alta / edición -->
<div class="modal-fondo" id="modalFondo">
  <div class="modal">
    <h2 id="modalTitulo">Nuevo gasto</h2>
    <div class="campo">
      <label>Descripción *</label>
      <input type="text" id="fDescripcion" placeholder="Ej: ALQUILER, SUELDO PAULA, CLARO WIFI…">
    </div>
    <div class="campos-2">
      <div class="campo">
        <label>Categoría</label>
        <select id="fCategoria">
          <option>SUELDOS</option>
          <option>ALQUILER</option>
          <option>IMPUESTOS</option>
          <option>SERVICIOS</option>
          <option>INSUMOS</option>
          <option>BANCOS</option>
          <option>PROFESIONALES</option>
          <option>OTROS</option>
        </select>
      </div>
      <div class="campo">
        <label>Tipo (beneficiario)</label>
        <select id="fTipo">
          <option>Proveedores</option>
          <option>Empleados</option>
          <option>Organismos oficiales</option>
          <option>Bancos</option>
          <option>Otro</option>
        </select>
      </div>
    </div>
    <div class="campos-2">
      <div class="campo">
        <label>Valor ($) *</label>
        <input type="number" id="fValor" step="0.01" min="0" placeholder="0,00">
      </div>
      <div class="campo">
        <label>Vencimiento</label>
        <input type="date" id="fVencimiento">
      </div>
    </div>
    <div class="campos-2">
      <div class="campo">
        <label>Estado</label>
        <select id="fEstado" onchange="toggleFechaPago()">
          <option value="pendiente">Pendiente</option>
          <option value="pagada">Pagada</option>
        </select>
      </div>
      <div class="campo" id="campoFechaPago" style="display:none">
        <label>Fecha de pago</label>
        <input type="date" id="fFechaPago">
      </div>
    </div>
    <div class="campo">
      <label>Notas (opcional)</label>
      <textarea id="fNotas" rows="2"></textarea>
    </div>
    <div class="modal-botones">
      <button class="btn btn-gris" onclick="cerrarModal()">Cancelar</button>
      <button class="btn btn-azul" id="btnGuardar" onclick="guardar()">Guardar</button>
    </div>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

const SUPABASE_URL = 'https://bqpjtoiictnzcasxfucf.supabase.co'
const SUPABASE_KEY = 'sb_publishable_yvuXDxrkRrhXwmZBnE_a_Q_zDBz0iDi'

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: {
    // Lock sin espera: evita que la pestaña quede colgada si hay otra abierta
    lock: (name, acquireTimeout, fn) => fn()
  },
  global: {
    // Safari cachea respuestas GET; esto fuerza datos frescos siempre
    fetch: (url, opts) => fetch(url, { ...opts, cache: 'no-store' })
  }
})

// Solo Lu y Jime (doble seguridad: además la tabla tiene RLS por email)
const EMAILS_PERMITIDOS = ['liclucianavelaz@gmail.com', 'jimenahllorente@gmail.com']

const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre']

let miEmail = ''
let competencia = ''        // 'YYYY-MM' del mes que se está viendo
let gastos = []             // filas del mes actual
let filtroCategoria = 'TODAS'
let editandoId = null       // null = alta, número = edición

// ---------- Helpers ----------
function hoyISO() {
  const d = new Date()
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0')
}
function mesActualISO() {
  const d = new Date()
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0')
}
function fmtMonto(n) {
  return '$ ' + (Number(n) || 0).toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
}
function fmtFecha(iso) {
  if (!iso) return '—'
  const [a, m, d] = iso.split('-')
  return d + '/' + m + '/' + a
}
function nombreMes(comp) {
  const [a, m] = comp.split('-')
  return MESES[parseInt(m,10)-1] + ' ' + a
}
function sumarMeses(comp, n) {
  let [a, m] = comp.split('-').map(Number)
  m += n
  while (m > 12) { m -= 12; a++ }
  while (m < 1) { m += 12; a-- }
  return a + '-' + String(m).padStart(2,'0')
}
// Corre una fecha 'YYYY-MM-DD' al mismo día del mes destino (ajusta fin de mes)
function correrFechaAlMes(fechaISO, compDestino) {
  if (!fechaISO) return null
  const dia = parseInt(fechaISO.split('-')[2], 10)
  const [a, m] = compDestino.split('-').map(Number)
  const ultimoDia = new Date(a, m, 0).getDate()
  return compDestino + '-' + String(Math.min(dia, ultimoDia)).padStart(2,'0')
}
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
}

// ---------- Arranque ----------
async function init() {
  const { data: { session } } = await supabase.auth.getSession()
  const email = (session && session.user && session.user.email ? session.user.email : '').toLowerCase().trim()
  if (!session || !EMAILS_PERMITIDOS.includes(email)) {
    document.getElementById('guardia').textContent = 'No tenés permiso para ver este módulo.'
    return
  }
  miEmail = email
  competencia = mesActualISO()
  document.getElementById('guardia').style.display = 'none'
  document.getElementById('app').style.display = 'block'
  await cargarMes()
}

// ---------- Datos ----------
async function cargarMes() {
  document.getElementById('mesActual').textContent = nombreMes(competencia)
  const { data, error } = await supabase
    .from('cuentas_pagar')
    .select('*')
    .eq('competencia', competencia)
    .order('vencimiento', { ascending: true, nullsFirst: false })
    .order('id', { ascending: true })
  if (error) {
    alert('Error al cargar gastos: ' + error.message)
    return
  }
  gastos = data || []
  render()
}

window.cambiarMes = function(n) {
  competencia = sumarMeses(competencia, n)
  filtroCategoria = 'TODAS'
  cargarMes()
}

// ---------- Render ----------
function render() {
  // Resumen (sobre TODOS los gastos del mes, sin filtro)
  const total = gastos.reduce((s, g) => s + Number(g.valor || 0), 0)
  const pagados = gastos.filter(g => g.estado === 'pagada')
  const pendientes = gastos.filter(g => g.estado !== 'pagada')
  const sumPag = pagados.reduce((s, g) => s + Number(g.valor || 0), 0)
  const sumPen = pendientes.reduce((s, g) => s + Number(g.valor || 0), 0)

  document.getElementById('cardTotal').textContent = fmtMonto(total)
  document.getElementById('cardTotalDet').textContent = gastos.length + (gastos.length === 1 ? ' gasto' : ' gastos')
  document.getElementById('cardPagado').textContent = fmtMonto(sumPag)
  document.getElementById('cardPagadoDet').textContent = pagados.length + (pagados.length === 1 ? ' gasto' : ' gastos')
  document.getElementById('cardPendiente').textContent = fmtMonto(sumPen)
  document.getElementById('cardPendienteDet').textContent = pendientes.length + (pendientes.length === 1 ? ' gasto' : ' gastos')

  // Chips de categorías presentes en el mes
  const cats = ['TODAS', ...new Set(gastos.map(g => g.categoria || 'OTROS'))]
  document.getElementById('filtros').innerHTML = cats.map(c =>
    `<div class="chip ${c === filtroCategoria ? 'activo' : ''}" onclick="setFiltro('${esc(c)}')">${esc(c)}</div>`
  ).join('')

  // Tabla
  const visibles = filtroCategoria === 'TODAS' ? gastos : gastos.filter(g => (g.categoria || 'OTROS') === filtroCategoria)
  const hoy = hoyISO()
  const tbody = document.getElementById('tbody')
  const tfoot = document.getElementById('tfoot')
  const vacio = document.getElementById('vacio')

  if (!visibles.length) {
    tbody.innerHTML = ''
    tfoot.innerHTML = ''
    vacio.style.display = 'block'
    return
  }
  vacio.style.display = 'none'

  tbody.innerHTML = visibles.map(g => {
    let pill
    if (g.estado === 'pagada') {
      pill = '<span class="estado-pill estado-pagada">Pagada</span>'
    } else if (g.vencimiento && g.vencimiento < hoy) {
      pill = '<span class="estado-pill estado-vencida">Vencida</span>'
    } else {
      pill = '<span class="estado-pill estado-pendiente">Pendiente</span>'
    }
    const btnPago = g.estado === 'pagada'
      ? `<button title="Volver a pendiente" onclick="despagar(${g.id})">↩️</button>`
      : `<button title="Marcar pagada hoy" onclick="pagar(${g.id})">✅</button>`
    return `<tr>
      <td>${fmtFecha(g.vencimiento)}</td>
      <td>${esc(g.descripcion)}</td>
      <td class="cat-tag">${esc(g.categoria || 'OTROS')}</td>
      <td class="cat-tag">${esc(g.tipo || '')}</td>
      <td class="num">${fmtMonto(g.valor)}</td>
      <td>${pill}</td>
      <td>${fmtFecha(g.fecha_pago)}</td>
      <td class="acciones">
        ${btnPago}
        <button title="Editar" onclick="editar(${g.id})">✏️</button>
        <button title="Eliminar" onclick="eliminar(${g.id})">🗑️</button>
      </td>
    </tr>`
  }).join('')

  const totVis = visibles.reduce((s, g) => s + Number(g.valor || 0), 0)
  tfoot.innerHTML = `<tr>
    <td colspan="4">Total ${filtroCategoria === 'TODAS' ? 'del mes' : esc(filtroCategoria)}</td>
    <td class="num" style="text-align:right">${fmtMonto(totVis)}</td>
    <td colspan="3"></td>
  </tr>`
}

window.setFiltro = function(c) {
  filtroCategoria = c
  render()
}

// ---------- Alta / edición ----------
window.abrirModal = function() {
  editandoId = null
  document.getElementById('modalTitulo').textContent = 'Nuevo gasto'
  document.getElementById('fDescripcion').value = ''
  document.getElementById('fCategoria').value = 'OTROS'
  document.getElementById('fTipo').value = 'Proveedores'
  document.getElementById('fValor').value = ''
  document.getElementById('fVencimiento').value = competencia + '-10'
  document.getElementById('fEstado').value = 'pendiente'
  document.getElementById('fFechaPago').value = ''
  document.getElementById('fNotas').value = ''
  toggleFechaPago()
  document.getElementById('modalFondo').classList.add('visible')
}

window.editar = function(id) {
  const g = gastos.find(x => x.id === id)
  if (!g) return
  editandoId = id
  document.getElementById('modalTitulo').textContent = 'Editar gasto'
  document.getElementById('fDescripcion').value = g.descripcion || ''
  document.getElementById('fCategoria').value = g.categoria || 'OTROS'
  document.getElementById('fTipo').value = g.tipo || 'Proveedores'
  document.getElementById('fValor').value = g.valor
  document.getElementById('fVencimiento').value = g.vencimiento || ''
  document.getElementById('fEstado').value = g.estado || 'pendiente'
  document.getElementById('fFechaPago').value = g.fecha_pago || ''
  document.getElementById('fNotas').value = g.notas || ''
  toggleFechaPago()
  document.getElementById('modalFondo').classList.add('visible')
}

window.cerrarModal = function() {
  document.getElementById('modalFondo').classList.remove('visible')
}

window.toggleFechaPago = function() {
  const pagada = document.getElementById('fEstado').value === 'pagada'
  document.getElementById('campoFechaPago').style.display = pagada ? 'block' : 'none'
  if (pagada && !document.getElementById('fFechaPago').value) {
    document.getElementById('fFechaPago').value = hoyISO()
  }
}

window.guardar = async function() {
  const descripcion = document.getElementById('fDescripcion').value.trim()
  const valor = parseFloat(document.getElementById('fValor').value)
  if (!descripcion) { alert('Falta la descripción.'); return }
  if (!(valor >= 0)) { alert('El valor no es válido.'); return }

  const estado = document.getElementById('fEstado').value
  const fila = {
    descripcion: descripcion,
    categoria: document.getElementById('fCategoria').value,
    tipo: document.getElementById('fTipo').value,
    valor: valor,
    vencimiento: document.getElementById('fVencimiento').value || null,
    estado: estado,
    fecha_pago: estado === 'pagada' ? (document.getElementById('fFechaPago').value || hoyISO()) : null,
    notas: document.getElementById('fNotas').value.trim() || null,
    competencia: competencia
  }

  const btn = document.getElementById('btnGuardar')
  btn.disabled = true
  try {
    let error
    if (editandoId) {
      fila.editado_en = new Date().toISOString()
      fila.editado_por = miEmail
      ;({ error } = await supabase.from('cuentas_pagar').update(fila).eq('id', editandoId))
    } else {
      fila.creado_por = miEmail
      ;({ error } = await supabase.from('cuentas_pagar').insert(fila))
    }
    if (error) throw error
    cerrarModal()
    await cargarMes()
  } catch (e) {
    alert('Error al guardar: ' + e.message)
  } finally {
    btn.disabled = false
  }
}

// ---------- Acciones rápidas ----------
window.pagar = async function(id) {
  const { error } = await supabase.from('cuentas_pagar')
    .update({ estado: 'pagada', fecha_pago: hoyISO(), editado_en: new Date().toISOString(), editado_por: miEmail })
    .eq('id', id)
  if (error) { alert('Error: ' + error.message); return }
  await cargarMes()
}

window.despagar = async function(id) {
  const { error } = await supabase.from('cuentas_pagar')
    .update({ estado: 'pendiente', fecha_pago: null, editado_en: new Date().toISOString(), editado_por: miEmail })
    .eq('id', id)
  if (error) { alert('Error: ' + error.message); return }
  await cargarMes()
}

window.eliminar = async function(id) {
  const g = gastos.find(x => x.id === id)
  if (!g) return
  if (!confirm('¿Eliminar "' + g.descripcion + '" (' + fmtMonto(g.valor) + ')?')) return
  const { error } = await supabase.from('cuentas_pagar').delete().eq('id', id)
  if (error) { alert('Error: ' + error.message); return }
  await cargarMes()
}

// ---------- Copiar mes anterior ----------
// Trae todos los gastos del mes anterior y los duplica en el mes actual
// como PENDIENTES, corriendo el vencimiento al mismo día de este mes.
window.copiarMesAnterior = async function() {
  const compAnterior = sumarMeses(competencia, -1)
  const { data, error } = await supabase
    .from('cuentas_pagar')
    .select('*')
    .eq('competencia', compAnterior)
  if (error) { alert('Error: ' + error.message); return }
  if (!data || !data.length) {
    alert('No hay gastos cargados en ' + nombreMes(compAnterior) + ' para copiar.')
    return
  }
  if (gastos.length > 0) {
    if (!confirm('Este mes ya tiene ' + gastos.length + ' gastos cargados. ¿Copiar igual los ' + data.length + ' de ' + nombreMes(compAnterior) + '? (se van a sumar, no se pisa nada)')) return
  } else {
    if (!confirm('Se van a copiar ' + data.length + ' gastos de ' + nombreMes(compAnterior) + ' a ' + nombreMes(competencia) + ', todos como PENDIENTES. ¿Dale?')) return
  }

  const nuevos = data.map(g => ({
    descripcion: g.descripcion,
    categoria: g.categoria,
    tipo: g.tipo,
    valor: g.valor,
    vencimiento: correrFechaAlMes(g.vencimiento, competencia),
    estado: 'pendiente',
    fecha_pago: null,
    notas: g.notas,
    competencia: competencia,
    creado_por: miEmail + ' (copia de ' + compAnterior + ')'
  }))

  const btn = document.getElementById('btnCopiar')
  btn.disabled = true
  try {
    const { error: errIns } = await supabase.from('cuentas_pagar').insert(nuevos)
    if (errIns) throw errIns
    await cargarMes()
  } catch (e) {
    alert('Error al copiar: ' + e.message)
  } finally {
    btn.disabled = false
  }
}

init()
</script>
</body>
</html>
