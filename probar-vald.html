<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Probar VALD · BiOLAB</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:#f6f8fb; color:#1f2937; margin:0; padding:24px; }
  .wrap { max-width: 1000px; margin: 0 auto; }
  h1 { font-size: 18px; color:#178cc5; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  button { background:#1e9fe0; color:#fff; border:none; border-radius:9px; padding:10px 16px; font-size:14px; font-weight:600; cursor:pointer; }
  button:hover { background:#178cc5; }
  button.ghost { background:#fff; color:#1e9fe0; border:1px solid #1e9fe0; }
  button:disabled { background:#cbd5e1; cursor:not-allowed; }
  .status { font-size:13px; color:#6b7280; }
  textarea { width:100%; height:62vh; margin-top:10px; border:1px solid #e5e7eb; border-radius:10px; padding:12px; font-family: ui-monospace, Menlo, monospace; font-size:12px; }
  input { padding:9px 12px; border:1px solid #e5e7eb; border-radius:8px; font-size:13px; min-width:320px; }
  label { font-size:12px; color:#6b7280; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🔬 Probar vald-datos-ts</h1>
  <div class="row">
    <label>profileId (vacío = Daniela por defecto):</label>
    <input id="pid" type="text" placeholder="3f0b84b5-... (opcional)">
  </div>
  <div class="row">
    <button id="btn" onclick="probar()">▶︎ Traer datos de VALD</button>
    <button class="ghost" onclick="copiar()">📋 Copiar JSON</button>
    <span class="status" id="status">Listo.</span>
  </div>
  <textarea id="out" readonly placeholder="Acá aparece el JSON que devuelve la función..."></textarea>
</div>

<script>
const SUPABASE_URL = 'https://bqpjtoiictnzcasxfucf.supabase.co';
const ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJxcGp0b2lpY3RuemNhc3hmdWNmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3MDQwOTMsImV4cCI6MjA5NDI4MDA5M30.N1pG65Bm0EmPqxe8hzEFQqE0v1_N5pwrv8HO8We8Xdw';

async function probar() {
  const btn = document.getElementById('btn');
  const status = document.getElementById('status');
  const out = document.getElementById('out');
  btn.disabled = true;
  status.textContent = 'Consultando a VALD... (puede tardar unos segundos)';
  out.value = '';
  try {
    const pid = document.getElementById('pid').value.trim();
    let url = SUPABASE_URL + '/functions/v1/vald-datos-ts';
    if (pid) url += '?profileId=' + encodeURIComponent(pid);
    const resp = await fetch(url, {
      method: 'GET',
      headers: { 'Authorization': 'Bearer ' + ANON, 'apikey': ANON }
    });
    const text = await resp.text();
    status.textContent = 'Respuesta HTTP ' + resp.status + (resp.ok ? ' ✅' : ' ⚠️');
    try { out.value = JSON.stringify(JSON.parse(text), null, 2); }
    catch { out.value = text; }
  } catch (e) {
    status.textContent = 'Error de red';
    out.value = 'ERROR: ' + (e && e.message ? e.message : e);
  } finally {
    btn.disabled = false;
  }
}

function copiar() {
  const out = document.getElementById('out');
  out.select();
  document.execCommand('copy');
  document.getElementById('status').textContent = 'JSON copiado al portapapeles.';
}
</script>
</body>
</html>
