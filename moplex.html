<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOPLEX · BiOLAB · PuntoBiO</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg-deep:#f1f5f9;--bg-card:#fff;--bg-soft:#f8fafc;--border:#e5e7eb;
  --turquoise:#1e9fe0;--turquoise-dim:#0c7bb8;--text:#0f172a;--text-dim:#64748b;--text-faint:#94a3b8;
  --green:#16a34a;--green-bg:#dcfce7;--amber:#d97706;--amber-bg:#fef3c7;--red:#dc2626;--red-bg:#fee2e2;
}
*{box-sizing:border-box}
body{font-family:'Manrope',system-ui,sans-serif;background:var(--bg-deep);color:var(--text);margin:0;padding:24px 32px 60px;min-height:100vh}
h1{font-size:24px;margin:0 0 4px;display:flex;align-items:center;gap:10px}
.sub{color:var(--text-dim);font-size:14px;margin:0 0 18px;max-width:900px}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:20px;max-width:1000px;box-shadow:0 1px 3px rgba(0,0,0,.05);margin-bottom:18px}
.toolbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px;max-width:1000px}
.search{flex:1;min-width:200px;padding:10px 13px;border:1.5px solid var(--border);border-radius:10px;font-family:inherit;font-size:14px;background:#fff}
.chip{font-size:12.5px;font-weight:700;color:var(--turquoise-dim);background:#eff6fb;border:1px solid #cde8f7;border-radius:99px;padding:6px 12px}
.tgl{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text-dim);font-weight:600;cursor:pointer;user-select:none}
table{width:100%;border-collapse:collapse;font-size:13.5px}
thead th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-faint);padding:9px 10px;border-bottom:1.5px solid var(--border)}
thead th.c,tbody td.c{text-align:center}
tbody td{padding:10px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
tbody tr:hover{background:var(--bg-soft)}
.pac{font-weight:700}
.muted{color:var(--text-faint);font-size:12.5px}
.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;display:inline-block}
.b-ped{background:var(--amber-bg);color:#92400e}
.b-no{background:#f1f5f9;color:var(--text-faint)}
.estado{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px}
.e-SALDADO{background:var(--green-bg);color:#166534}
.e-PARCIAL{background:var(--amber-bg);color:#92400e}
.e-PENDIENTE{background:var(--red-bg);color:#991b1b}
.sw{position:relative;width:42px;height:24px;display:inline-block;cursor:pointer}
.sw input{opacity:0;width:0;height:0}
.sw .track{position:absolute;inset:0;background:#cbd5e1;border-radius:99px;transition:.2s}
.sw .track:before{content:"";position:absolute;height:18px;width:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked + .track{background:var(--turquoise)}
.sw input:checked + .track:before{transform:translateX(18px)}
.sw input:disabled + .track{opacity:.5;cursor:not-allowed}
.res{margin:0 0 14px;font-size:13.5px;padding:11px 14px;border-radius:10px;display:none;max-width:1000px}
.res.show{display:block}
.res.ok{background:var(--green-bg);color:#166534}
.res.err{background:var(--red-bg);color:#991b1b}
.empty{padding:40px;text-align:center;color:var(--text-faint)}
.plprice{font-weight:700;color:var(--turquoise-dim)}
</style>
</head>
<body>
  <h1>🦶 MOPLEX</h1>
  <p class="sub">Consultas MOPLEX cargadas desde cualquier lado (Consultorios, agenda o acá). Marcá <b>“solicita plantillas”</b> y queda registrado para todos. Las plantillas se cobran aparte y las cobra el mismo profesional que hizo el estudio.</p>

  <div id="msg" class="res"></div>

  <div class="toolbar">
    <input class="search" id="q" placeholder="Buscar paciente…" oninput="render()">
    <label class="tgl"><input type="checkbox" id="soloPed" onchange="render()"> Solo las que piden plantillas</label>
    <span class="chip" id="stat">…</span>
  </div>

  <div class="card" id="cardTabla">
    <div class="empty" id="app">Cargando…</div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://bqpjtoiictnzcasxfucf.supabase.co'
const SUPABASE_KEY = 'sb_publishable_yvuXDxrkRrhXwmZBnE_a_Q_zDBz0iDi'
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { lock: (n,t,f) => f() } })

const $ = id => document.getElementById(id)
const fmt = n => '$' + Math.round(Number(n)||0).toLocaleString('es-AR')
const norm = s => (s||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
function msg(t, tipo){ const r=$('msg'); r.className='res show '+(tipo||'ok'); r.innerHTML=t; setTimeout(()=>{ r.className='res' }, 4000) }

const state = { ttos: [], personas: {}, sesCount: {}, plantillaPrecio: 0 }

async function cargar(){
  try{
    const [ttoR, plR] = await Promise.all([
      sb.from('tratamientos').select('*').eq('practica_codigo','MOPLEX').order('fecha', { ascending: false }),
      sb.from('tarifario_precios_vigente').select('valor_vigente').eq('practica_codigo','MOPLEX_PLANTILLAS').maybeSingle()
    ])
    if (ttoR.error) throw ttoR.error
    state.ttos = ttoR.data || []
    state.plantillaPrecio = (plR && plR.data && plR.data.valor_vigente != null) ? Number(plR.data.valor_vigente) : 0

    const ids = [...new Set(state.ttos.map(t => t.persona_id).filter(Boolean))]
    if (ids.length){
      const { data: per } = await sb.from('personas').select('id, nombre').in('id', ids)
      ;(per || []).forEach(p => { state.personas[p.id] = p.nombre })
    }
    const ttoIds = state.ttos.map(t => t.id)
    if (ttoIds.length){
      const { data: ses } = await sb.from('sesiones').select('tratamiento_id').in('tratamiento_id', ttoIds)
      ;(ses || []).forEach(s => { state.sesCount[s.tratamiento_id] = (state.sesCount[s.tratamiento_id]||0) + 1 })
    }
    render()
  } catch(e){
    $('app').innerHTML = 'No se pudo cargar: ' + (e.message || e)
  }
}

function render(){
  const q = norm($('q').value)
  const soloPed = $('soloPed').checked
  let rows = state.ttos.filter(t => {
    const pac = state.personas[t.persona_id] || ''
    if (soloPed && !t.solicita_plantillas) return false
    if (q && !norm(pac).includes(q)) return false
    return true
  })

  const totalPiden = state.ttos.filter(t => t.solicita_plantillas).length
  $('stat').textContent = `${state.ttos.length} consultas · ${totalPiden} piden plantillas`

  if (!rows.length){ $('app').innerHTML = '<div class="empty">No hay consultas MOPLEX para mostrar.</div>'; return }

  let html = `<table><thead><tr>
    <th>Paciente</th><th>Fecha</th><th>Profesional</th><th>Estado</th>
    <th class="c">Sesiones</th><th class="c">Solicita plantillas</th><th>Plantilla</th>
  </tr></thead><tbody>`

  rows.forEach(t => {
    const pac = state.personas[t.persona_id] || '(sin nombre)'
    const prof = t.profesional || '—'
    const est = t.estado || '—'
    const ses = state.sesCount[t.id] || 0
    const pide = !!t.solicita_plantillas
    const plantillaCol = pide
      ? `<span class="badge b-ped">solicitada</span> <span class="plprice">${fmt(state.plantillaPrecio)}</span><div class="muted">cobra ${prof}</div>`
      : `<span class="badge b-no">—</span>`
    html += `<tr>
      <td class="pac">${pac}</td>
      <td>${t.fecha || '—'}</td>
      <td>${prof}</td>
      <td><span class="estado e-${est}">${est}</span></td>
      <td class="c">${ses}</td>
      <td class="c">
        <label class="sw">
          <input type="checkbox" ${pide?'checked':''} onchange="togglePlantilla(${t.id}, this)">
          <span class="track"></span>
        </label>
      </td>
      <td>${plantillaCol}</td>
    </tr>`
  })
  html += `</tbody></table>`
  $('app').innerHTML = html
}

async function togglePlantilla(id, el){
  const val = el.checked
  el.disabled = true
  try{
    const { error } = await sb.from('tratamientos').update({ solicita_plantillas: val }).eq('id', id)
    if (error) throw error
    const t = state.ttos.find(x => x.id === id); if (t) t.solicita_plantillas = val
    msg(val ? '✅ Plantilla solicitada. Queda registrada para todos.' : 'Solicitud de plantilla quitada.', 'ok')
    render()
  } catch(e){
    el.checked = !val
    msg('No se pudo guardar: ' + (e.message || e), 'err')
  } finally {
    el.disabled = false
  }
}

cargar()
</script>
</body>
</html>
