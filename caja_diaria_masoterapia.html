<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PuntoBiO · Caja Consultorio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-deep: #f1f5f9;
  --bg-card: #ffffff;
  --bg-elev: #ffffff;
  --bg-soft: #f8fafc;
  --border: #e5e7eb;
  --border-bright: #1e9fe0;
  --turquoise: #1e9fe0;
  --turquoise-dim: #0c7bb8;
  --text: #0f172a;
  --text-dim: #64748b;
  --text-faint: #94a3b8;
  --green: #16a34a;
  --amber: #d97706;
  --red: #dc2626;
  --purple: #9333ea;
  --blue: #2563eb;
  --pink: #db2777;
}

body {
  font-family: 'Manrope', system-ui, sans-serif;
  background: var(--bg-deep);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  padding: 32px 40px;
}

/* RADIAL GLOW */
body::before {
  content: '';
  position: fixed;
  top: -200px;
  left: 50%;
  transform: translateX(-50%);
  width: 800px;
  height: 800px;
  background: radial-gradient(circle, #f0f9ff 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

.container {
  max-width: 1280px;
  margin: 0 auto;
  position: relative;
  z-index: 1;
}

/* HERO */
.hero {
  margin-bottom: 28px;
  animation: fadeUp 0.4s ease;
}

.hero-tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 2px;
  color: var(--turquoise);
  text-transform: uppercase;
  margin-bottom: 10px;
}

.hero h1 {
  font-size: 32px;
  font-weight: 800;
  letter-spacing: -1px;
  margin-bottom: 6px;
  line-height: 1.1;
}

.hero h1 .accent { color: var(--turquoise); }

.hero-sub {
  font-size: 14px;
  color: var(--text-dim);
}

/* TOOLBAR */
.toolbar {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 18px;
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  animation: fadeUp 0.45s ease;
}

.toolbar-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text-faint);
}

.toolbar select, .toolbar input[type="date"] {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 7px 12px;
  border-radius: 7px;
  font-family: inherit;
  font-size: 13px;
  outline: none;
  transition: border-color 0.15s;
  cursor: pointer;
}

.toolbar select:hover, .toolbar input[type="date"]:hover { border-color: var(--turquoise); }

.toolbar select:focus, .toolbar input[type="date"]:focus { border-color: var(--turquoise); }

.tabs {
  display: flex;
  gap: 4px;
  background: var(--bg-elev);
  border-radius: 8px;
  padding: 3px;
  border: 1px solid var(--border);
}

.tab {
  background: transparent;
  border: none;
  color: var(--text-dim);
  padding: 6px 14px;
  border-radius: 6px;
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
}

.tab:hover { color: var(--text); }
.tab.active {
  background: var(--turquoise);
  color: #ffffff;
}

.toolbar-spacer { flex: 1; }

.btn {
  background: var(--turquoise);
  color: #ffffff;
  border: none;
  padding: 8px 16px;
  border-radius: 7px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.btn:hover { background: #2cb2f3; transform: translateY(-1px); }

.btn-secondary {
  background: var(--bg-elev);
  color: var(--text);
  border: 1px solid var(--border);
}

.btn-secondary:hover { border-color: var(--turquoise); background: var(--bg-soft); }

/* KPIs */
.kpis-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 14px;
  margin-bottom: 24px;
}

.kpi-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 18px;
  position: relative;
  overflow: hidden;
  transition: all 0.2s;
  animation: fadeUp 0.5s ease both;
}

.kpi-card:hover {
  border-color: var(--border-bright);
  transform: translateY(-2px);
}

.kpi-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 3px;
  height: 100%;
  background: var(--kpi-color, var(--turquoise));
}

.kpi-card.featured {
  background: linear-gradient(135deg, var(--bg-card) 0%, var(--bg-soft) 100%);
}

.kpi-card.featured::before { width: 4px; }

.kpi-label {
  font-size: 11px;
  color: var(--text-dim);
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 8px;
}

.kpi-value {
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -0.5px;
  color: var(--kpi-color, var(--turquoise));
  line-height: 1;
  margin-bottom: 6px;
}

.kpi-value.large { font-size: 32px; }

.kpi-sub {
  font-size: 11px;
  color: var(--text-faint);
}

/* COLS */
.cols-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 24px;
}

.panel {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
  animation: fadeUp 0.6s ease both;
}

.panel-header {
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.panel-title {
  font-size: 13px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}

.panel-title-icon { font-size: 15px; }

.panel-link {
  font-size: 11px;
  color: var(--turquoise);
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 0.5px;
  cursor: pointer;
  text-transform: uppercase;
}

.panel-body { padding: 8px 12px 12px; }

/* LISTA SIMPLE */
.list-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 12px;
  border-radius: 7px;
  transition: background 0.15s;
}

.list-row:hover { background: var(--bg-soft); }

.list-row-label {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  color: var(--text);
}

.list-row-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

.list-row-value {
  font-weight: 700;
  font-size: 14px;
  color: var(--text);
  font-variant-numeric: tabular-nums;
}

.list-row-value.dim { color: var(--text-faint); font-weight: 500; }

/* TABLA */
.table-panel {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
  animation: fadeUp 0.7s ease both;
}

.table-wrap {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

thead th {
  background: var(--bg-elev);
  padding: 10px 14px;
  text-align: left;
  font-weight: 600;
  font-size: 11px;
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-dim);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}

thead th.numeric { text-align: right; }

tbody td {
  padding: 11px 14px;
  border-bottom: 1px solid #f0f9ff;
  color: var(--text);
}

tbody td.numeric { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
tbody td.dim { color: var(--text-dim); }
tbody td.small { font-size: 12px; }

tbody tr:hover { background: var(--bg-soft); }
tbody tr:last-child td { border-bottom: none; }

.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 10px;
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  font-weight: 600;
}

.badge-efectivo { background: rgba(110, 231, 168, 0.15); color: var(--green); }
.badge-debito { background: rgba(96, 165, 250, 0.15); color: var(--blue); }
.badge-transferencia { background: rgba(192, 132, 252, 0.15); color: var(--purple); }
.badge-credito { background: rgba(251, 191, 107, 0.15); color: var(--amber); }
.badge-default { background: rgba(138, 155, 184, 0.15); color: var(--text-dim); }

.badge-normal { background: #dbeafe; color: var(--turquoise); }
.badge-cortesia { background: rgba(138, 155, 184, 0.15); color: var(--text-dim); }
.badge-solo-centro { background: rgba(249, 168, 212, 0.15); color: var(--pink); }
.badge-solo-prof { background: rgba(192, 132, 252, 0.15); color: var(--purple); }
.badge-manual { background: rgba(251, 191, 107, 0.15); color: var(--amber); }

/* EMPTY STATE */
.empty-state {
  padding: 50px 20px;
  text-align: center;
  color: var(--text-faint);
}

.empty-state-icon {
  font-size: 48px;
  margin-bottom: 14px;
  display: block;
  opacity: 0.4;
}

.empty-state-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--text-dim);
  margin-bottom: 6px;
}

.empty-state-desc {
  font-size: 13px;
  max-width: 360px;
  margin: 0 auto 18px;
}

/* LOADING */
.loading {
  padding: 60px 20px;
  text-align: center;
  color: var(--text-dim);
}

.loading-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--turquoise);
  margin: 0 3px;
  animation: bounce 1.4s infinite ease-in-out both;
}

.loading-dot:nth-child(1) { animation-delay: -0.32s; }
.loading-dot:nth-child(2) { animation-delay: -0.16s; }

@keyframes bounce {
  0%, 80%, 100% { transform: scale(0); }
  40% { transform: scale(1); }
}

/* ANIMATIONS */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}

/* RESPONSIVE */
@media (max-width: 768px) {
  body { padding: 20px; }
  .cols-2 { grid-template-columns: 1fr; }
  .hero h1 { font-size: 24px; }
  .toolbar { padding: 12px; }
}

/* BOTON EDITAR EN TABLA */
.btn-edit {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 4px 8px;
  cursor: pointer;
  font-size: 13px;
  line-height: 1;
  transition: all 0.15s;
}
.btn-edit:hover { border-color: var(--turquoise); background: var(--bg-soft); }

/* MODAL */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.45);
  backdrop-filter: blur(2px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 20px;
}
.modal-overlay.open { display: flex; }

.modal {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  width: 100%;
  max-width: 460px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 20px 60px rgba(15, 23, 42, 0.25);
  animation: fadeUp 0.25s ease;
}

.modal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 22px;
}
.modal-head h2 {
  font-size: 18px;
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: 8px;
}
.modal-close {
  background: none;
  border: none;
  font-size: 20px;
  color: var(--text-faint);
  cursor: pointer;
  line-height: 1;
  padding: 4px;
}
.modal-close:hover { color: var(--text); }

.modal-body { padding: 4px 22px 18px; }

.modal-meta {
  font-size: 13px;
  color: var(--text-dim);
  margin-bottom: 16px;
  line-height: 1.5;
}
.modal-meta strong { color: var(--text); }

.field { margin-bottom: 16px; }
.field label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 6px;
}
.field input, .field select {
  width: 100%;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px 12px;
  border-radius: 9px;
  font-family: inherit;
  font-size: 14px;
  outline: none;
  transition: border-color 0.15s;
}
.field input:focus, .field select:focus { border-color: var(--turquoise); }

.reparto-box {
  background: var(--bg-soft);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 10px 14px;
  margin-bottom: 16px;
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  color: var(--text-dim);
}
.reparto-box strong { color: var(--text); font-weight: 700; }

.modal-foot {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 16px 22px;
  border-top: 1px solid var(--border);
}
.modal-foot .spacer { flex: 1; }

.btn-danger {
  background: none;
  border: 1px solid var(--red);
  color: var(--red);
  padding: 9px 14px;
  border-radius: 8px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
}
.btn-danger:hover { background: rgba(220, 38, 38, 0.08); }

/* SCROLLBAR */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--bg-deep); }
::-webkit-scrollbar-thumb { background: var(--bg-elev); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--border-bright); }
</style>
</head>
<body>

<div class="container">

  <!-- HERO -->
  <div class="hero">
    <div class="hero-tag" id="hero-tag">Consultorio · Caja</div>
    <h1><span class="accent">💵</span> <span id="hero-titulo">Caja Consultorio</span></h1>
    <p class="hero-sub" id="hero-sub">Cobros del día, cierre de caja, arqueo. Gestión operativa de ingresos del área.</p>
  </div>

  <!-- TOOLBAR / FILTROS -->
  <div class="toolbar">
    <div class="tabs">
      <button class="tab active" data-vista="dia" onclick="cambiarVista('dia')">Día</button>
      <button class="tab" data-vista="mes" onclick="cambiarVista('mes')">Mes</button>
      <button class="tab" data-vista="anio" onclick="cambiarVista('anio')">Año</button>
    </div>

    <div style="display:flex; align-items:center; gap:10px;" id="filtro-dia">
      <span class="toolbar-label">Fecha</span>
      <input type="date" id="fecha-dia">
    </div>

    <div style="display:none; align-items:center; gap:10px;" id="filtro-mes">
      <span class="toolbar-label">Mes</span>
      <select id="filtro-mes-num"></select>
      <select id="filtro-mes-anio"></select>
    </div>

    <div style="display:none; align-items:center; gap:10px;" id="filtro-anio">
      <span class="toolbar-label">Año</span>
      <select id="filtro-anio-num"></select>
    </div>

    <div class="toolbar-spacer"></div>

    <button class="btn-secondary btn" onclick="cargarDatos()">↻ Recargar</button>
    <button class="btn" onclick="window.location.href='caja_nuevo_cobro.html'">+ Nuevo cobro</button>
  </div>

  <!-- KPIs PRINCIPALES -->
  <div class="kpis-grid" id="kpis-zone">
    <!-- Se llena por JS -->
  </div>

  <!-- 2 PANELES: Profesional + Quién recibió -->
  <div class="cols-2" id="paneles-zone">
    <!-- Se llena por JS -->
  </div>

  <!-- TABLA DETALLE -->
  <div class="table-panel">
    <div class="panel-header">
      <div class="panel-title">
        <span class="panel-title-icon">📋</span>
        <span>Detalle de cobros</span>
      </div>
      <div class="panel-link" id="detalle-count">— cobros</div>
    </div>
    <div class="table-wrap" id="tabla-zone">
      <!-- Se llena por JS -->
    </div>
  </div>

</div>

<!-- MODAL EDITAR COBRO -->
<div class="modal-overlay" id="modal-editar">
  <div class="modal">
    <div class="modal-head">
      <h2>✏️ Editar cobro</h2>
      <button class="modal-close" onclick="cerrarModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="modal-meta" id="modal-meta">—</div>

      <div class="field">
        <label>Importe abonado ($)</label>
        <input type="number" id="edit-importe" min="0" step="100">
      </div>

      <div class="field">
        <label>Quién atendió (profesional)</label>
        <select id="edit-profesional"></select>
      </div>

      <div class="reparto-box">
        <span>Reparto: Centro <strong id="rep-centro">$0</strong></span>
        <span>Profesional <strong id="rep-prof">$0</strong></span>
      </div>

      <div class="field">
        <label>Quién recibió la plata</label>
        <select id="edit-quien-cobro"></select>
      </div>

      <div class="field">
        <label>Medio de pago</label>
        <select id="edit-medio">
          <option value="EFECTIVO">Efectivo</option>
          <option value="DEBITO">Débito</option>
          <option value="TRANSFERENCIA">Transferencia</option>
        </select>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn-danger" onclick="borrarCobro()">🗑️ Borrar cobro</button>
      <div class="spacer"></div>
      <button class="btn-secondary btn" onclick="cerrarModal()">Cancelar</button>
      <button class="btn" id="btn-guardar" onclick="guardarCobro()">Guardar</button>
    </div>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

const SUPABASE_URL = 'https://bqpjtoiictnzcasxfucf.supabase.co'
const SUPABASE_KEY = 'sb_publishable_yvuXDxrkRrhXwmZBnE_a_Q_zDBz0iDi'
const sb = createClient(SUPABASE_URL, SUPABASE_KEY)

// ======================
// CONFIGURACIÓN POR ÁREA
// (cambiar estas 2 constantes para clonar para otra caja)
// ======================
const AREA_NOMBRE = 'Masoterapia'
const PRACTICAS_INCLUIDAS = ['MASAJES_C','MASAJES_CC','MASAJES_EYC','MASAJES_PAK','MASAJES_R','MASAJES_CERO']

// ======================
// ESTADO
// ======================
let vista = 'dia'
let pagos = []
let pacientesMap = {}
let tratamientosMap = {} // id → practica_codigo

// === FILTRO "SOLO LO MÍO" (solo se activa si el usuario tiene solo_lo_mio=TRUE) ===
const EMAIL_A_NOMBRE = {
  'brunitovelez99@gmail.com':    'Bruno',
  'loz.magdalena@gmail.com':     'Male',
  'veronicasandler@hotmail.com': 'Vero'
}
let miFiltro = null

async function detectarFiltroPropio() {
  try {
    const { data: { user } } = await sb.auth.getUser()
    if (!user || !user.email) return
    const email = user.email.toLowerCase().trim()
    const { data: persona } = await sb.from('personas')
      .select('id').ilike('email', email).maybeSingle()
    if (!persona) return
    const { data: perm } = await sb.from('permisos_equipo')
      .select('solo_lo_mio').eq('persona_id', persona.id).maybeSingle()
    if (perm && perm.solo_lo_mio === true) {
      const nombre = EMAIL_A_NOMBRE[email] || null
      if (nombre) miFiltro = { nombre }
    }
  } catch (e) {
    console.warn('No se pudo determinar filtro propio (se muestra todo):', e.message)
    miFiltro = null
  }
}

function aplicarFiltroPropio(lista) {
  if (!miFiltro) return lista
  const n = miFiltro.nombre
  return lista.filter(p => p.profesional === n || p.quien_cobro === n)
}

const fmt = n => '$' + Math.round(Number(n) || 0).toLocaleString('es-AR')

// ======================
// INIT - configurar selectores
// ======================
function init() {
  // Setear textos del hero según área configurada
  document.getElementById('hero-tag').textContent = `${AREA_NOMBRE} · Caja`
  document.getElementById('hero-titulo').textContent = `Caja ${AREA_NOMBRE}`
  document.title = `PuntoBiO · Caja ${AREA_NOMBRE}`

  // Fecha de hoy
  const hoy = new Date()
  const hoyISO = hoy.toISOString().split('T')[0]
  document.getElementById('fecha-dia').value = hoyISO

  // Selector mes
  const meses = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre']
  const selMes = document.getElementById('filtro-mes-num')
  meses.forEach((nombre, i) => {
    const opt = document.createElement('option')
    opt.value = i + 1
    opt.textContent = nombre
    if (i + 1 === hoy.getMonth() + 1) opt.selected = true
    selMes.appendChild(opt)
  })

  // Selectores año
  const anioActual = hoy.getFullYear()
  const selMesAnio = document.getElementById('filtro-mes-anio')
  const selAnio = document.getElementById('filtro-anio-num')
  for (let y = anioActual - 1; y <= anioActual + 1; y++) {
    const opt1 = document.createElement('option')
    opt1.value = y
    opt1.textContent = y
    if (y === anioActual) opt1.selected = true
    selMesAnio.appendChild(opt1)
    const opt2 = opt1.cloneNode(true)
    if (y === anioActual) opt2.selected = true
    selAnio.appendChild(opt2)
  }

  // Listeners
  document.getElementById('fecha-dia').addEventListener('change', cargarDatos)
  selMes.addEventListener('change', cargarDatos)
  selMesAnio.addEventListener('change', cargarDatos)
  selAnio.addEventListener('change', cargarDatos)

  cargarDatos()
}

window.cambiarVista = function(v) {
  vista = v
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.vista === v)
  })
  document.getElementById('filtro-dia').style.display = v === 'dia' ? 'flex' : 'none'
  document.getElementById('filtro-mes').style.display = v === 'mes' ? 'flex' : 'none'
  document.getElementById('filtro-anio').style.display = v === 'anio' ? 'flex' : 'none'
  cargarDatos()
}

// ======================
// CARGAR DATOS DE SUPABASE
// ======================
window.cargarDatos = async function() {
  document.getElementById('kpis-zone').innerHTML = '<div class="loading"><span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span></div>'
  document.getElementById('paneles-zone').innerHTML = ''
  document.getElementById('tabla-zone').innerHTML = ''

  // Determinar rango de fechas
  let desde, hasta, descripcionPeriodo
  if (vista === 'dia') {
    desde = hasta = document.getElementById('fecha-dia').value
    descripcionPeriodo = new Date(desde + 'T12:00').toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })
  } else if (vista === 'mes') {
    const m = Number(document.getElementById('filtro-mes-num').value)
    const a = Number(document.getElementById('filtro-mes-anio').value)
    desde = `${a}-${String(m).padStart(2,'0')}-01`
    const ultDia = new Date(a, m, 0).getDate()
    hasta = `${a}-${String(m).padStart(2,'0')}-${ultDia}`
    const meses = ['','Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre']
    descripcionPeriodo = `${meses[m]} ${a}`
  } else {
    const a = Number(document.getElementById('filtro-anio-num').value)
    desde = `${a}-01-01`
    hasta = `${a}-12-31`
    descripcionPeriodo = `Año ${a}`
  }

  document.getElementById('hero-sub').textContent = descripcionPeriodo.charAt(0).toUpperCase() + descripcionPeriodo.slice(1)

  try {
    // Cargar pagos del rango
    const { data: pagosData, error: errP } = await sb
      .from('pagos_consultorio')
      .select('*')
      .gte('fecha', desde)
      .lte('fecha', hasta)
      .order('fecha', { ascending: false })
      .order('hora', { ascending: false })
    if (errP) throw errP

    let pagosRaw = pagosData || []

    // Filtrar por prácticas del área (via tratamientos)
    const tratIds = [...new Set(pagosRaw.map(p => p.tratamiento_id).filter(Boolean))]
    if (tratIds.length > 0) {
      const { data: tratData } = await sb
        .from('tratamientos')
        .select('id, practica_codigo')
        .in('id', tratIds)
      tratamientosMap = {}
      ;(tratData || []).forEach(t => tratamientosMap[t.id] = t.practica_codigo)
      // Filtrar pagos: solo los cuyo tratamiento esté en prácticas del área
      pagos = pagosRaw.filter(p => {
        const pc = tratamientosMap[p.tratamiento_id]
        return pc && PRACTICAS_INCLUIDAS.includes(pc)
      })
    } else {
      pagos = []
    }

    // Filtro "solo lo mío" (solo afecta a quien tiene solo_lo_mio=TRUE; admins ven todo)
    pagos = aplicarFiltroPropio(pagos)

    // Cargar pacientes en lote (solo los que aparecen en los pagos filtrados)
    const personaIds = [...new Set(pagos.map(p => p.persona_id).filter(Boolean))]
    if (personaIds.length > 0) {
      const { data: pacData } = await sb
        .from('personas')
        .select('id, nombre')
        .in('id', personaIds)
      pacientesMap = {}
      ;(pacData || []).forEach(p => pacientesMap[p.id] = p.nombre)
    }

    renderTodo()
  } catch (err) {
    console.error('Error cargando datos:', err)
    document.getElementById('kpis-zone').innerHTML = `
      <div class="empty-state" style="grid-column: 1/-1;">
        <span class="empty-state-icon">⚠️</span>
        <div class="empty-state-title">Error al cargar</div>
        <div class="empty-state-desc">${err.message}</div>
      </div>
    `
  }
}

// ======================
// KPIs (totales por medio de pago)
// ======================
function renderKPIs() {
  const totales = { efectivo: 0, debito: 0, transferencia: 0, credito: 0, total: 0 }

  pagos.forEach(p => {
    const importe = Number(p.importe) || 0
    const medio = (p.medio_pago || '').toLowerCase()
    totales.total += importe
    if (medio.includes('efectivo')) totales.efectivo += importe
    else if (medio.includes('débito') || medio.includes('debito')) totales.debito += importe
    else if (medio.includes('transferencia')) totales.transferencia += importe
    else if (medio.includes('crédito') || medio.includes('credito')) totales.credito += importe
  })

  document.getElementById('kpis-zone').innerHTML = `
    <div class="kpi-card featured" style="--kpi-color: var(--turquoise); grid-column: span 2;">
      <div class="kpi-label">Total cobrado</div>
      <div class="kpi-value large">${fmt(totales.total)}</div>
      <div class="kpi-sub">${pagos.length} cobro${pagos.length !== 1 ? 's' : ''}</div>
    </div>
    <div class="kpi-card" style="--kpi-color: var(--green);">
      <div class="kpi-label">Efectivo</div>
      <div class="kpi-value">${fmt(totales.efectivo)}</div>
      <div class="kpi-sub">${pct(totales.efectivo, totales.total)}</div>
    </div>
    <div class="kpi-card" style="--kpi-color: var(--blue);">
      <div class="kpi-label">Débito</div>
      <div class="kpi-value">${fmt(totales.debito)}</div>
      <div class="kpi-sub">${pct(totales.debito, totales.total)}</div>
    </div>
    <div class="kpi-card" style="--kpi-color: var(--purple);">
      <div class="kpi-label">Transferencia</div>
      <div class="kpi-value">${fmt(totales.transferencia)}</div>
      <div class="kpi-sub">${pct(totales.transferencia, totales.total)}</div>
    </div>
    <div class="kpi-card" style="--kpi-color: var(--amber);">
      <div class="kpi-label">Crédito</div>
      <div class="kpi-value">${fmt(totales.credito)}</div>
      <div class="kpi-sub">${pct(totales.credito, totales.total)}</div>
    </div>
  `
}

function pct(parte, total) {
  if (!total) return '0%'
  return Math.round(parte / total * 100) + '%'
}

// ======================
// PANELES (por profesional + quién recibió)
// ======================
function renderPaneles() {
  // Agrupar por profesional (lo generado)
  const porProf = {}
  // Agrupar por quien_cobro (lo que recibió cada persona/lugar)
  const porCobrador = {}

  pagos.forEach(p => {
    const importe = Number(p.importe) || 0
    const mProf = Number(p.monto_profesional) || 0
    const mCentro = Number(p.monto_centro) || 0
    const profesional = p.profesional || 'Sin profesional'

    if (!porProf[profesional]) porProf[profesional] = { centro: 0, prof: 0, total: 0 }
    porProf[profesional].centro += mCentro
    porProf[profesional].prof += mProf
    porProf[profesional].total += (mCentro + mProf)

    // Normalizar quien_cobro (puede venir "Centro / Recepción" o "Bruno (transferencia directa)")
    let cobrador = (p.quien_cobro || 'Sin especificar').split('(')[0].trim()
    if (!porCobrador[cobrador]) porCobrador[cobrador] = 0
    porCobrador[cobrador] += importe
  })

  // Colores fijos por profesional
  const coloresProfs = {
    'Bruno': 'var(--blue)',
    'Male': 'var(--pink)',
    'Vero': 'var(--purple)',
    'Jime': 'var(--green)',
    'Lu': 'var(--turquoise)'
  }

  // Ordenar por total descendente
  const listaProfs = Object.entries(porProf).sort((a,b) => b[1].total - a[1].total)
  const listaCobr = Object.entries(porCobrador).sort((a,b) => b[1] - a[1])

  document.getElementById('paneles-zone').innerHTML = `
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">
          <span class="panel-title-icon">👨‍⚕️</span>
          <span>Generado por profesional</span>
        </div>
        <div class="panel-link">${listaProfs.length}</div>
      </div>
      <div class="panel-body">
        ${listaProfs.length === 0 ? `<div class="empty-state" style="padding: 24px;"><span class="empty-state-icon" style="font-size:32px;">—</span><div class="empty-state-desc">Sin datos</div></div>` : listaProfs.map(([prof, datos]) => `
          <div class="list-row">
            <div class="list-row-label">
              <div class="list-row-dot" style="background: ${coloresProfs[prof] || 'var(--text-faint)'};"></div>
              <div>
                <div>${prof}</div>
                <div style="font-size: 11px; color: var(--text-faint); margin-top: 2px;">
                  Centro ${fmt(datos.centro)} · Prof ${fmt(datos.prof)}
                </div>
              </div>
            </div>
            <div class="list-row-value">${fmt(datos.total)}</div>
          </div>
        `).join('')}
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">
          <span class="panel-title-icon">💰</span>
          <span>Quién recibió la plata</span>
        </div>
        <div class="panel-link">${listaCobr.length}</div>
      </div>
      <div class="panel-body">
        ${listaCobr.length === 0 ? `<div class="empty-state" style="padding: 24px;"><span class="empty-state-icon" style="font-size:32px;">—</span><div class="empty-state-desc">Sin datos</div></div>` : listaCobr.map(([cobr, total]) => `
          <div class="list-row">
            <div class="list-row-label">
              <div class="list-row-dot" style="background: ${coloresProfs[cobr] || 'var(--turquoise)'};"></div>
              <div>${cobr}</div>
            </div>
            <div class="list-row-value">${fmt(total)}</div>
          </div>
        `).join('')}
      </div>
    </div>
  `
}

// TABLA DETALLE

function renderTabla() {
  document.getElementById('detalle-count').textContent = pagos.length + ' cobro' + (pagos.length !== 1 ? 's' : '')

  const filas = pagos.map(p => {
    const paciente = pacientesMap[p.persona_id] || `ID ${p.persona_id || '—'}`
    const fecha = p.fecha ? new Date(p.fecha + 'T12:00').toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit' }) : '—'
    const hora = p.hora ? p.hora.slice(0, 5) : ''
    const medio = (p.medio_pago || '').toLowerCase()
    let badgeMedio = 'badge-default'
    if (medio.includes('efectivo')) badgeMedio = 'badge-efectivo'
    else if (medio.includes('debito') || medio.includes('débito')) badgeMedio = 'badge-debito'
    else if (medio.includes('transferencia')) badgeMedio = 'badge-transferencia'
    else if (medio.includes('credito') || medio.includes('crédito')) badgeMedio = 'badge-credito'

    const tipo = p.tipo_cobro || 'NORMAL'
    const badgeTipo = {
      'NORMAL': 'badge-normal',
      'SOLO_CENTRO': 'badge-solo-centro',
      'SOLO_PROF': 'badge-solo-prof',
      'CORTESIA': 'badge-cortesia',
      'MANUAL': 'badge-manual'
    }[tipo] || 'badge-default'

    const cobrador = (p.quien_cobro || '—').split('(')[0].trim()

    return `
      <tr>
        <td class="dim small">${fecha} ${hora}</td>
        <td>${paciente}</td>
        <td class="dim">${p.profesional || '—'}</td>
        <td><span class="badge ${badgeTipo}">${tipo}</span></td>
        <td><span class="badge ${badgeMedio}">${p.medio_pago || '—'}</span></td>
        <td class="dim small">${cobrador}</td>
        <td class="numeric">${fmt(p.importe)}</td>
        <td class="numeric dim small">${fmt(p.monto_centro)}</td>
        <td class="numeric dim small">${fmt(p.monto_profesional)}</td>

    <table>

        <tr>
          <th>Fecha/Hora</th>
          <th>Paciente</th>
          <th>Profesional</th>
          <th>Tipo</th>
          <th>Medio</th>
          <th>Recibió</th>
          <th class="numeric">Importe</th>
          <th class="numeric">Centro PB</th>
          <th class="numeric">Profesional</th>
          <th style="text-align:center;">Editar</th>

      <tbody>${filas}</tbody>
    </table>

// ======================
// MODAL EDITAR COBRO
// ======================

// Lista de profesionales que pueden atender / recibir en esta área
const PROFESIONALES = ['Vero']
const RECEPTORES = ['Vero', 'PuntoBiO']

// % que se queda el profesional según quién atendió.
// Profes con split 65/35 → 0.65 al prof. Resto (Jime/Lu) = 100% centro → 0 al prof.
const SPLIT_PROF = {
  'Vero': 0.65,
  'Male': 0.65,
  'Bruno': 0.65,
  'Jime': 0,
  'Lu': 0
}

let cobroEnEdicion = null  // guarda el objeto pago que estamos editando

function calcularReparto(importe, profesional) {
  const pctProf = SPLIT_PROF[profesional] ?? 0
  const prof = Math.round(importe * pctProf)
  const centro = importe - prof
  return { centro, prof }
}

function refrescarReparto() {
  const importe = Number(document.getElementById('edit-importe').value) || 0
  const profesional = document.getElementById('edit-profesional').value
  const { centro, prof } = calcularReparto(importe, profesional)
  document.getElementById('rep-centro').textContent = fmt(centro)
  document.getElementById('rep-prof').textContent = fmt(prof)
}

window.abrirModal = function(pagoId) {
  const p = pagos.find(x => String(x.id) === String(pagoId))
  if (!p) { alert('No se encontró el cobro.'); return }
  cobroEnEdicion = p

  const paciente = pacientesMap[p.persona_id] || `ID ${p.persona_id || '—'}`
  document.getElementById('modal-meta').innerHTML =
    `Cobro <strong>#${p.id}</strong> · ${paciente}<br>Fecha: ${p.fecha || '—'}`

  // Importe
  document.getElementById('edit-importe').value = Number(p.importe) || 0

  // Profesional (quién atendió)
  const selProf = document.getElementById('edit-profesional')
  selProf.innerHTML = PROFESIONALES.map(n =>
    `<option value="${n}" ${p.profesional === n ? 'selected' : ''}>${n}</option>`
  ).join('')
  // Si el profesional guardado no está en la lista, lo agregamos para no perderlo
  if (p.profesional && !PROFESIONALES.includes(p.profesional)) {
    selProf.insertAdjacentHTML('afterbegin',
      `<option value="${p.profesional}" selected>${p.profesional}</option>`)
  }

  // Quién recibió la plata — arranca VACÍO para que elijan a conciencia
  let cobradorActual = (p.quien_cobro || '').split('(')[0].trim()
  // "Recepción" (cualquier variante) se trata como PuntoBiO, nunca se muestra
  if (/recep/i.test(cobradorActual)) cobradorActual = 'PuntoBiO'
  const selCobro = document.getElementById('edit-quien-cobro')
  selCobro.innerHTML =
    `<option value="" disabled selected>— Elegí quién recibió —</option>` +
    RECEPTORES.map(n => `<option value="${n}">${n}</option>`).join('')
  // Si el valor guardado no está en la lista, lo agregamos para no perderlo (pero igual no preseleccionamos)
  if (cobradorActual && !RECEPTORES.includes(cobradorActual)) {
    selCobro.insertAdjacentHTML('beforeend',
      `<option value="${cobradorActual}">${cobradorActual}</option>`)
  }

  // Medio de pago — normalizamos (sin tilde, mayúsculas) para matchear el CHECK
  const normMedio = s => (s || '').toString()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '') // saca tildes
    .toUpperCase().trim()
  const selMedio = document.getElementById('edit-medio')
  const medioActual = normMedio(p.medio_pago) || 'EFECTIVO'
  let matched = false
  Array.from(selMedio.options).forEach(o => {
    if (normMedio(o.value) === medioActual) { o.selected = true; matched = true }
  })
  if (!matched) {
    selMedio.insertAdjacentHTML('afterbegin',
      `<option value="${medioActual}" selected>${p.medio_pago || medioActual}</option>`)
  }

  refrescarReparto()
  document.getElementById('modal-editar').classList.add('open')
}

window.cerrarModal = function() {
  document.getElementById('modal-editar').classList.remove('open')
  cobroEnEdicion = null
}

window.guardarCobro = async function() {
  if (!cobroEnEdicion) return
  const btn = document.getElementById('btn-guardar')
  const importe = Number(document.getElementById('edit-importe').value) || 0
  const profesional = document.getElementById('edit-profesional').value
  const quienCobro = document.getElementById('edit-quien-cobro').value
  const medio = document.getElementById('edit-medio').value

  if (importe < 0) { alert('El importe no puede ser negativo.'); return }
  if (!quienCobro) { alert('Tenés que elegir quién recibió la plata.'); return }

  // Cartel de confirmación — que revisen a conciencia antes de guardar
  const pacienteConf = pacientesMap[cobroEnEdicion.persona_id] || `ID ${cobroEnEdicion.persona_id || '—'}`
  const medioLindo = { 'EFECTIVO':'Efectivo', 'DEBITO':'Débito', 'TRANSFERENCIA':'Transferencia' }[medio] || medio
  const okConfirm = confirm(
    `⚠️ Revisá antes de guardar:\n\n` +
    `Paciente: ${pacienteConf}\n` +
    `La sesión la hizo: ${profesional}\n` +
    `La plata la recibió: ${quienCobro}\n` +
    `Importe: ${fmt(importe)} (${medioLindo})\n\n` +
    `¿Está todo correcto?`
  )
  if (!okConfirm) return

  const { centro, prof } = calcularReparto(importe, profesional)

  btn.disabled = true
  btn.textContent = 'Guardando...'

  try {
    const { error } = await sb
      .from('pagos_consultorio')
      .update({
        importe: importe,
        profesional: profesional,
        quien_cobro: quienCobro,
        medio_pago: medio,
        monto_centro: centro,
        monto_profesional: prof
      })
      .eq('id', cobroEnEdicion.id)

    if (error) throw error

    cerrarModal()
    await cargarDatos()
  } catch (err) {
    alert('Error al guardar: ' + err.message)
    console.error(err)
  } finally {
    btn.disabled = false
    btn.textContent = 'Guardar'
  }
}

window.borrarCobro = async function() {
  if (!cobroEnEdicion) return
  const paciente = pacientesMap[cobroEnEdicion.persona_id] || `ID ${cobroEnEdicion.persona_id || '—'}`
  if (!confirm(`¿Borrar el cobro #${cobroEnEdicion.id} de ${paciente} por ${fmt(cobroEnEdicion.importe)}?\n\nEsta acción no se puede deshacer.`)) return

  try {
    const { error } = await sb
      .from('pagos_consultorio')
      .delete()
      .eq('id', cobroEnEdicion.id)

    if (error) throw error

    cerrarModal()
    await cargarDatos()
  } catch (err) {
    alert('Error al borrar: ' + err.message)
    console.error(err)
  }
}

// Recalcular reparto en vivo al cambiar importe o profesional
document.getElementById('edit-importe').addEventListener('input', refrescarReparto)
document.getElementById('edit-profesional').addEventListener('change', refrescarReparto)

// Cerrar modal al clickear afuera o con Escape
document.getElementById('modal-editar').addEventListener('click', (e) => {
  if (e.target.id === 'modal-editar') cerrarModal()
})
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') cerrarModal()
})

// ARRANCAR
detectarFiltroPropio().finally(() => init())
</script>
