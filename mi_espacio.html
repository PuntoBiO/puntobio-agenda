<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mi Espacio · PuntoBiO</title>
<link rel="icon" href="https://www.puntobio.com.ar/favicon.ico" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --celeste:#1e9fe0;
    --celeste-soft:rgba(30,159,224,.12);
    --negro:#111;
    --negro-2:#1a1a1a;
    --gris:#8a8f98;
    --gris-borde:rgba(255,255,255,.08);
    --texto:#e9edf2;
    --texto-tenue:#9aa3ad;
    --verde:#27c08a;
    --verde-soft:rgba(39,192,138,.14);
    --rojo:#ff6b6b;
    --rojo-soft:rgba(255,107,107,.14);
    --ambar:#f5a623;
    --ambar-soft:rgba(245,166,35,.16);
    --violeta:#8b7dff;
    --violeta-soft:rgba(139,125,255,.16);
    --radio:18px;
    --sombra:0 10px 40px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--negro);color:var(--texto);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  body{
    min-height:100vh;
    background:
      radial-gradient(1100px 600px at 80% -10%, rgba(30,159,224,.18), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(30,159,224,.10), transparent 55%),
      var(--negro);
    padding-bottom:60px;
  }
  /* ---------- Header ---------- */
  header.topbar{
    position:sticky;top:0;z-index:30;
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 22px;
    background:rgba(12,12,12,.72);
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--gris-borde);
  }
  .brand{display:flex;align-items:center;gap:12px}
  .brand .esfera{
    width:34px;height:34px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%, #6cd0ff, var(--celeste) 60%, #0f6ca0);
    box-shadow:0 0 0 3px rgba(30,159,224,.18), 0 6px 18px rgba(30,159,224,.35);
  }
  .brand .txt{line-height:1.05}
  .brand .txt b{font-size:16px;letter-spacing:.3px}
  .brand .txt span{display:block;font-size:11px;color:var(--texto-tenue);letter-spacing:1.5px;text-transform:uppercase}
  .salir{
    background:transparent;border:1px solid var(--gris-borde);color:var(--texto-tenue);
    padding:8px 14px;border-radius:999px;font-size:13px;cursor:pointer;transition:.2s;
  }
  .salir:hover{border-color:var(--celeste);color:var(--celeste)}

  /* ---------- Layout ---------- */
  .wrap{max-width:920px;margin:0 auto;padding:26px 18px}
  .saludo{margin:6px 4px 22px}
  .saludo h1{font-size:26px;font-weight:700;letter-spacing:-.4px}
  .saludo h1 .nombre{color:var(--celeste)}
  .saludo p{color:var(--texto-tenue);font-size:14px;margin-top:4px}

  .card{
    background:linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.015));
    border:1px solid var(--gris-borde);
    border-radius:var(--radio);
    padding:20px 20px;
    margin-bottom:18px;
    box-shadow:var(--sombra);
  }
  .card h2{
    font-size:13px;letter-spacing:1.4px;text-transform:uppercase;color:var(--texto-tenue);
    margin-bottom:16px;display:flex;align-items:center;gap:9px;
  }
  .card h2 .dot{width:7px;height:7px;border-radius:50%;background:var(--celeste);box-shadow:0 0 10px var(--celeste)}

  /* Plan */
  .plan-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px}
  .plan-cod{
    font-size:30px;font-weight:800;letter-spacing:-.5px;
    background:linear-gradient(90deg,#7fd4ff,var(--celeste));-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .plan-act{color:var(--texto-tenue);font-size:14px;margin-top:2px}
  .pill{
    display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:999px;
    font-size:12.5px;font-weight:600;letter-spacing:.3px;
  }
  .pill.activo{background:var(--verde-soft);color:var(--verde);border:1px solid rgba(39,192,138,.3)}
  .pill.bonif{background:var(--violeta-soft);color:var(--violeta);border:1px solid rgba(139,125,255,.3)}
  .plan-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:18px}
  .meta-box{background:rgba(255,255,255,.03);border:1px solid var(--gris-borde);border-radius:12px;padding:12px 14px}
  .meta-box .l{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--texto-tenue)}
  .meta-box .v{font-size:16px;font-weight:600;margin-top:4px}

  /* Stats asistencia */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .stat{border-radius:14px;padding:16px 14px;text-align:center;border:1px solid var(--gris-borde)}
  .stat .n{font-size:30px;font-weight:800;line-height:1}
  .stat .t{font-size:11.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--texto-tenue);margin-top:7px}
  .stat.asis{background:var(--verde-soft)} .stat.asis .n{color:var(--verde)}
  .stat.aus{background:var(--rojo-soft)} .stat.aus .n{color:var(--rojo)}
  .stat.rec{background:var(--violeta-soft)} .stat.rec .n{color:var(--violeta)}

  /* Recuperatorios countdown */
  .recu{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 14px;border-radius:13px;border:1px solid var(--gris-borde);margin-bottom:10px;background:rgba(255,255,255,.025)}
  .recu:last-child{margin-bottom:0}
  .recu .info .fa{font-weight:600;font-size:14.5px}
  .recu .info .sub{font-size:12.5px;color:var(--texto-tenue);margin-top:3px}
  .cuenta{text-align:center;min-width:74px}
  .cuenta .d{font-size:24px;font-weight:800;line-height:1}
  .cuenta .l{font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--texto-tenue);margin-top:3px}
  .cuenta.ok .d{color:var(--verde)}
  .cuenta.warn .d{color:var(--ambar)}
  .cuenta.urge .d{color:var(--rojo)}
  .badge-fer{font-size:10.5px;font-weight:700;letter-spacing:.5px;color:var(--ambar);background:var(--ambar-soft);padding:3px 8px;border-radius:6px;text-transform:uppercase}

  /* Pagos */
  .pago-row{display:flex;align-items:center;justify-content:space-between;padding:12px 4px;border-bottom:1px solid var(--gris-borde)}
  .pago-row:last-child{border-bottom:none}
  .pago-row .pl .mes{font-weight:600;font-size:14.5px}
  .pago-row .pl .sub{font-size:12px;color:var(--texto-tenue);margin-top:2px}
  .pago-row .imp{font-weight:700;font-size:15px;color:var(--celeste)}
  .pago-row .medio{font-size:11px;color:var(--texto-tenue);text-transform:uppercase;letter-spacing:.5px;margin-top:2px;text-align:right}

  /* Evolución */
  .evo{padding:14px;border-radius:13px;border:1px solid var(--gris-borde);background:rgba(255,255,255,.025);margin-bottom:11px}
  .evo:last-child{margin-bottom:0}
  .evo .head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
  .evo .head .f{font-size:12.5px;color:var(--texto-tenue)}
  .evo .head .serv{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--celeste);background:var(--celeste-soft);padding:3px 9px;border-radius:7px}
  .evo .cont{font-size:14px;line-height:1.5}
  .evo .autor{font-size:12px;color:var(--texto-tenue);margin-top:9px;font-style:italic}
  .evo .score{display:inline-flex;gap:3px;margin-top:8px}
  .evo .score i{width:18px;height:6px;border-radius:3px;background:rgba(255,255,255,.12)}
  .evo .score i.on{background:var(--celeste)}

  /* HC resumen */
  .hc-row{display:flex;align-items:center;justify-content:space-between;padding:11px 2px;border-bottom:1px solid var(--gris-borde)}
  .hc-row:last-child{border-bottom:none}
  .hc-row .k{font-size:13.5px;color:var(--texto-tenue)}
  .hc-row .v{font-size:14px;font-weight:600;text-align:right;max-width:60%}

  .empty{color:var(--texto-tenue);font-size:13.5px;padding:8px 2px;font-style:italic}

  .nota{font-size:12px;color:var(--texto-tenue);margin-top:12px;line-height:1.5;padding:11px 13px;border-radius:11px;background:rgba(255,255,255,.025);border:1px solid var(--gris-borde)}

  .wa-btn{
    display:inline-flex;align-items:center;gap:8px;margin-top:14px;
    background:#25D366;color:#073;border:none;font-weight:700;font-size:14px;
    padding:11px 18px;border-radius:12px;cursor:pointer;text-decoration:none;transition:.2s;
  }
  .wa-btn:hover{filter:brightness(1.08);transform:translateY(-1px)}

  /* Loading / login */
  .center-screen{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}
  .spinner{width:42px;height:42px;border:3px solid rgba(30,159,224,.2);border-top-color:var(--celeste);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:18px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .center-screen h2{font-size:20px;margin-bottom:8px}
  .center-screen p{color:var(--texto-tenue);font-size:14px;max-width:380px;line-height:1.5}
  .center-screen a.boton{margin-top:18px;background:var(--celeste);color:#001;font-weight:700;padding:12px 22px;border-radius:12px;text-decoration:none}

  .reveal{opacity:0;transform:translateY(10px);animation:rise .5s ease forwards}
  @keyframes rise{to{opacity:1;transform:translateY(0)}}
  .d1{animation-delay:.05s}.d2{animation-delay:.12s}.d2b{animation-delay:.16s}.d3{animation-delay:.19s}.d4{animation-delay:.26s}.d5{animation-delay:.33s}.d6{animation-delay:.40s}

  /* ---------- Mis clases fijas + Avisar falta ---------- */
  .clase-fija{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 14px;border-radius:13px;border:1px solid var(--gris-borde);background:rgba(255,255,255,.025);margin-bottom:10px;flex-wrap:wrap}
  .clase-fija:last-child{margin-bottom:0}
  .clase-fija .cf-info{flex:1;min-width:160px}
  .clase-fija .cf-dia{font-weight:600;font-size:14.5px}
  .clase-fija .cf-sub{font-size:12.5px;color:var(--texto-tenue);margin-top:3px}
  .btn-faltar{
    background:transparent;border:1px solid var(--ambar);color:var(--ambar);
    padding:8px 14px;border-radius:10px;font-size:12.5px;font-weight:600;cursor:pointer;
    transition:.15s;white-space:nowrap;
  }
  .btn-faltar:hover{background:var(--ambar-soft)}
  .btn-faltar:disabled{opacity:.5;cursor:not-allowed}
  .falta-slot{width:100%}
  .aviso-falta{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:11px 13px;border-radius:11px;background:var(--verde-soft);border:1px solid rgba(39,192,138,.3);
    font-size:13px;color:var(--verde);margin-top:8px;flex-wrap:wrap;
  }
  .aviso-falta .cd{font-family:'DM Mono','Courier New',monospace;font-weight:700}
  .aviso-falta .deshacer{
    background:transparent;border:1px solid var(--verde);color:var(--verde);
    padding:6px 14px;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer;
  }
  .aviso-falta .deshacer:hover{background:rgba(39,192,138,.22)}
  .aviso-falta.firme{background:rgba(255,255,255,.04);border-color:var(--gris-borde);color:var(--texto-tenue)}

  /* ---------- Panel: Agenda de la semana ---------- */
  .ag-tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
  .ag-tab{
    padding:8px 12px;border-radius:11px;border:1px solid var(--gris-borde);
    background:rgba(255,255,255,.025);color:var(--texto-tenue);
    cursor:pointer;transition:.18s;
    display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.1;min-width:58px;
  }
  .ag-tab .ag-tab-dia{font-size:11px;letter-spacing:.6px;text-transform:uppercase;font-weight:600;opacity:.85}
  .ag-tab .ag-tab-num{font-size:15px;font-weight:700;color:var(--texto)}
  .ag-tab:hover:not(.activo):not(:disabled){border-color:rgba(30,159,224,.5);transform:translateY(-1px)}
  .ag-tab.activo{background:linear-gradient(180deg, rgba(30,159,224,.22), rgba(30,159,224,.10));border-color:var(--celeste);color:var(--celeste);box-shadow:0 4px 14px rgba(30,159,224,.18)}
  .ag-tab.activo .ag-tab-num{color:#fff}

  .ag-grupo{
    background:rgba(255,255,255,.022);border:1px solid var(--gris-borde);
    border-radius:14px;padding:6px 14px 10px;margin-bottom:11px;
  }
  .ag-hora-titulo{
    font-size:11px;letter-spacing:2px;text-transform:uppercase;
    color:var(--celeste);font-weight:700;
    padding:9px 0 7px;border-bottom:1px solid rgba(255,255,255,.04);
    margin-bottom:6px;
  }
  .ag-turno{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:9px 2px;
  }
  .ag-turno + .ag-turno{border-top:1px solid rgba(255,255,255,.025)}
  .ag-turno-info{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
  .ag-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
  .ag-dot.ent{background:var(--celeste);box-shadow:0 0 10px rgba(30,159,224,.6)}
  .ag-dot.kine{background:var(--violeta);box-shadow:0 0 10px rgba(139,125,255,.6)}
  .ag-turno-nombre{font-size:13.5px;font-weight:600}
  .ag-turno-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;min-width:94px}
  .ag-cupo-num{
    font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:7px;
    font-family:ui-monospace,'DM Mono','SF Mono','Courier New',monospace;letter-spacing:.3px;
  }
  .ag-cupo-num.libre{color:var(--verde);background:var(--verde-soft);border:1px solid rgba(39,192,138,.25)}
  .ag-cupo-num.medio{color:var(--ambar);background:var(--ambar-soft);border:1px solid rgba(245,166,35,.3)}
  .ag-cupo-num.casi{color:#ff9966;background:rgba(255,153,102,.14);border:1px solid rgba(255,153,102,.3)}
  .ag-cupo-num.lleno{color:var(--texto-tenue);background:rgba(255,255,255,.04);border:1px solid var(--gris-borde)}
  .ag-bar{width:94px;height:4px;background:rgba(255,255,255,.06);border-radius:4px;overflow:hidden}
  .ag-bar-fill{height:100%;border-radius:4px;transition:width .35s ease}
  .ag-bar-fill.libre{background:var(--verde)}
  .ag-bar-fill.medio{background:var(--ambar)}
  .ag-bar-fill.casi{background:#ff9966}
  .ag-bar-fill.lleno{background:var(--gris)}
</style>
</head>
<body>

<!-- ===== Pantalla de carga / sin sesión (se reemplaza al cargar) ===== -->
<div id="boot" class="center-screen">
  <div class="spinner"></div>
  <h2>Cargando tu espacio…</h2>
  <p>Un segundo, estamos buscando tu información.</p>
</div>

<!-- ===== App (oculta hasta cargar) ===== -->
<div id="app" style="display:none">
  <header class="topbar">
    <div class="brand">
      <div class="esfera"></div>
      <div class="txt"><b>Mi Espacio</b><span>PuntoBiO</span></div>
    </div>
    <button class="salir" onclick="cerrarSesion()">Salir</button>
  </header>

  <div class="wrap">
    <div class="saludo reveal d1">
      <h1>Hola, <span class="nombre" id="nombre">…</span> 👋</h1>
      <p id="subsaludo">Este es tu espacio personal en PuntoBiO.</p>
    </div>

    <!-- contenido dinámico -->
    <div id="contenido"></div>
  </div>
</div>

<script>
// ============================================================
//  CONFIG SUPABASE
// ============================================================
const SUPABASE_URL = "https://bqpjtoiictnzcasxfucf.supabase.co";
const SUPABASE_ANON = "sb_publishable_yvuXDxrkRrhXwmZBnE_a_Q_zDBz0iDi";
const WHATSAPP_CENTRO = "5493513023476"; // WhatsApp PuntoBiO
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

const DIAS_PARA_RECUPERAR = 60; // regla del centro

// ============================================================
//  HELPERS
// ============================================================
const $ = (id)=>document.getElementById(id);
const esc = (s)=> (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtMoneda = (n)=> '$'+Number(n||0).toLocaleString('es-AR');
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function fmtFecha(f){
  if(!f) return '—';
  const d = new Date(f+'T00:00:00');
  if(isNaN(d)) { const d2=new Date(f); if(isNaN(d2)) return '—'; return d2.getDate()+' '+MESES[d2.getMonth()]+' '+d2.getFullYear(); }
  return d.getDate()+' '+MESES[d.getMonth()]+' '+d.getFullYear();
}
function fmtMesImputado(m){ // "2026-05" -> "Mayo 2026"
  if(!m) return '—';
  const p = String(m).split('-');
  if(p.length<2) return m;
  const nombres=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const i = parseInt(p[1],10)-1;
  return (nombres[i]||p[1])+' '+p[0];
}
function diasEntre(desde, hasta){
  const a = new Date(desde+'T00:00:00'); const b = new Date(hasta+'T00:00:00');
  return Math.round((b-a)/86400000);
}
function hoyISO(){
  const d=new Date(); const off=d.getTimezoneOffset(); const l=new Date(d-off*60000);
  return l.toISOString().slice(0,10);
}

// ============================================================
//  ARRANQUE
// ============================================================
(async function init(){
  // 1) ¿hay sesión?
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){
    mostrarSinSesion();
    return;
  }
  // 2) ¿qué persona soy? (RLS Nivel C: solo veo mi propia fila)
  const { data:per, error } = await sb
    .from('personas')
    .select('id, nombre, email, mail, dni, es_equipo, auth_user_id')
    .eq('auth_user_id', session.user.id)
    .maybeSingle();

  if(error){ console.error(error); mostrarError('No pudimos cargar tu información. Probá de nuevo en un momento.'); return; }
  if(!per){ mostrarSinFicha(); return; }

  // Si es SOLO equipo (sin plan de alumno activo), este no es su lugar.
  // Si es equipo PERO también tiene plan TF activo (doble rol), sí puede ver su espacio.
  if(per.es_equipo){
    let tienePlan = false;
    try {
      const { data:tp } = await sb.rpc('tiene_plan_tf_activo', { p_persona_id: per.id });
      tienePlan = (tp === true);
    } catch(e){ tienePlan = false; }
    if(!tienePlan){ mostrarEquipo(); return; }
  }

  await cargarEspacio(per);
})();

// ============================================================
//  PANTALLAS DE ESTADO
// ============================================================
function mostrarSinSesion(){
  $('boot').innerHTML = `
    <h2>Iniciá sesión</h2>
    <p>Para ver tu espacio personal necesitás entrar con tu cuenta.</p>
    <a class="boton" href="/login.html">Ir a iniciar sesión</a>`;
}
function mostrarSinFicha(){
  $('boot').innerHTML = `
    <h2>No encontramos tu ficha</h2>
    <p>Tu cuenta está activa pero todavía no está vinculada a tu legajo. Avisanos por WhatsApp y lo resolvemos enseguida.</p>
    <a class="boton" href="https://wa.me/${WHATSAPP_CENTRO}" target="_blank">Escribir al centro</a>`;
}
function mostrarEquipo(){
  $('boot').innerHTML = `
    <h2>Hola 👋</h2>
    <p>Tu cuenta es del equipo. Para administrar el sistema usá el panel completo.</p>
    <a class="boton" href="/app.html">Ir al sistema</a>`;
}
function mostrarError(msg){
  $('boot').innerHTML = `<h2>Ups…</h2><p>${esc(msg)}</p>
    <a class="boton" href="">Reintentar</a>`;
  $('boot').querySelector('a').onclick=(e)=>{e.preventDefault();location.reload();};
}
async function cerrarSesion(){ await sb.auth.signOut(); location.href='/login.html'; }

// ============================================================
//  CARGA PRINCIPAL
// ============================================================
async function cargarEspacio(per){
  const nombre = (per.nombre||'').trim() || 'alumno';
  $('nombre').textContent = nombre;

  // Traemos todo lo del alumno en paralelo, filtrando SIEMPRE por su persona_id.
  // (No dependemos solo del RLS: el equipo con doble rol no debe ver datos de otros aquí.)
  const pid = per.id;

  // Primero: TODAS las inscripciones de esta persona (para poder filtrar sus pagos por inscripcion_id)
  const inscAll = await sb.from('inscripciones_tf').select('id, plan, actividad, estado, fecha_alta, fecha_baja, dia_vencimiento').eq('persona_id', pid).order('id', {ascending:false});
  const misInscIds = (inscAll.data||[]).map(r => r.id);
  const inscripcion = (inscAll.data||[]).find(r => r.estado === 'ACTIVO') || null;

  // Rango de fechas para el panel "Agenda de la semana": de hoy hasta 7 días más
  const _hoyD = new Date();
  const _hoyISO = (function(){ const d=_hoyD; const o=d.getTimezoneOffset(); return new Date(d-o*60000).toISOString().slice(0,10); })();
  const _hastaISO = (function(){ const d=new Date(_hoyD); d.setDate(d.getDate()+9); const o=d.getTimezoneOffset(); return new Date(d-o*60000).toISOString().slice(0,10); })();

  const [asis, recus, evos, hc, moplex, misTurnosRes, todosTurnosRes, allFijosRes, agregadosRes, ausentesRes] = await Promise.all([
    sb.from('asistencia').select('*').eq('persona_id',pid),
    sb.from('recuperatorios_tf').select('*').eq('persona_id',pid).order('fecha_ausencia',{ascending:false}),
    sb.from('evoluciones_tf').select('*').eq('persona_id',pid).order('fecha',{ascending:false}).limit(15),
    sb.from('historias_clinicas').select('*').eq('persona_id',pid).order('completado_en',{ascending:false}).limit(1),
    sb.from('evaluaciones_moplex').select('*').eq('persona_id',pid).order('completado_en',{ascending:false}).limit(1),
    // Turnos fijos del alumno (JOIN con tabla turnos para traer dia/hora/servicio)
    sb.from('turno_alumnos')
      .select('turno_id, turnos!inner(id, dia, hora, servicio, capacidad)')
      .eq('persona_id', pid)
      .eq('activo', true),
    // Todos los turnos del centro (para el panel "Agenda de la semana")
    sb.from('turnos').select('id, dia, hora, servicio, capacidad'),
    // Conteo de inscriptos fijos por turno (solo activos, sin nombres)
    sb.from('turno_alumnos').select('turno_id').eq('activo', true),
    // Agregados puntuales (recuperatorios/sueltos) de los próximos 9 días
    sb.from('turno_agregados').select('turno_id, fecha').gte('fecha', _hoyISO).lte('fecha', _hastaISO),
    // Ausencias (no van) de los próximos 9 días — solo cuento para restar
    sb.from('asistencia').select('turno_id, fecha').gte('fecha', _hoyISO).lte('fecha', _hastaISO).in('estado', ['ausente','ausente-justificada']),
  ]);
  // Aplanar el JOIN: cada fila de turno_alumnos trae el turno adentro
  const misTurnos = (misTurnosRes.data || [])
    .map(r => r.turnos)
    .filter(t => t && t.id);

  // Pagos: SOLO los de MIS inscripciones. Si no tengo inscripciones, no hay pagos.
  let misPagos = [];
  if (misInscIds.length > 0) {
    const pagosRes = await sb.from('pagos_tf').select('*').in('inscripcion_id', misInscIds).order('fecha',{ascending:false});
    misPagos = pagosRes.data || [];
  }

  // ===== Datos pre-procesados para el panel "Agenda de la semana" =====
  // Conteo de fijos activos por turno_id
  const fijosPorTurno = {};
  (allFijosRes.data || []).forEach(r => {
    fijosPorTurno[r.turno_id] = (fijosPorTurno[r.turno_id]||0) + 1;
  });
  // Conteo de agregados por "turno_id|fecha"
  const agregadosPorClave = {};
  (agregadosRes.data || []).forEach(r => {
    const k = r.turno_id+'|'+r.fecha;
    agregadosPorClave[k] = (agregadosPorClave[k]||0) + 1;
  });
  // Conteo de ausentes por "turno_id|fecha"
  const ausentesPorClave = {};
  (ausentesRes.data || []).forEach(r => {
    const k = r.turno_id+'|'+r.fecha;
    ausentesPorClave[k] = (ausentesPorClave[k]||0) + 1;
  });
  // Datos consolidados para pasarle al bloque (sin nombres ni datos personales)
  window._agendaData = {
    turnos: todosTurnosRes.data || [],
    fijosPorTurno,
    agregadosPorClave,
    ausentesPorClave,
    actividadAlumno: (inscripcion && inscripcion.actividad) ? inscripcion.actividad : 'AMBOS',
    esBonificado: inscripcion ? /BON/i.test(inscripcion.plan||'') : false,
  };

  const html = [
    bloquePlan(inscripcion),
    bloqueMisClases(misTurnos),
    bloqueAgenda(window._agendaData),
    bloqueAsistencia(asis.data||[]),
    bloqueRecuperatorios(recus.data||[]),
    bloquePagos(misPagos),
    bloqueEvoluciones(evos.data||[]),
    bloqueHC(hc.data&&hc.data[0], moplex.data&&moplex.data[0]),
    bloqueContacto()
  ].join('');

  $('contenido').innerHTML = html;
  $('boot').style.display='none';
  $('app').style.display='block';
  _renderAgendaInicial();
}

// ============================================================
//  MIS CLASES FIJAS + AVISAR FALTA
// ============================================================
const ORDEN_DIAS = {'Lunes':1,'Martes':2,'Miércoles':3,'Miercoles':3,'Jueves':4,'Viernes':5,'Sábado':6,'Sabado':6,'Domingo':7};
const DIAS_SEM_NUM = {'Domingo':0,'Lunes':1,'Martes':2,'Miércoles':3,'Miercoles':3,'Jueves':4,'Viernes':5,'Sábado':6,'Sabado':6};
const TIMERS_DESHACER = {}; // {turnoId: intervalId}

// Devuelve ISO YYYY-MM-DD de la próxima vez que ese turno se dicta.
// Si hoy es ese día y faltan más de 2 horas para la hora del turno -> hoy.
// Si ya pasó la hora o quedan menos de 2hs -> la próxima semana.
function proximaFechaDelTurno(diaSemana, hora){
  const ahora = new Date();
  const targetDia = DIAS_SEM_NUM[diaSemana];
  if(targetDia==null) return hoyISO();
  const hoyDia = ahora.getDay();
  if(hoyDia === targetDia){
    const [hh,mm] = String(hora||'00:00').split(':').map(Number);
    const horaTurno = new Date(ahora);
    horaTurno.setHours(hh||0, mm||0, 0, 0);
    if(horaTurno - ahora > 2*3600*1000) return fechaToISO(ahora);
    const next = new Date(ahora); next.setDate(next.getDate()+7);
    return fechaToISO(next);
  }
  let diasFaltan = targetDia - hoyDia;
  if(diasFaltan <= 0) diasFaltan += 7;
  const prox = new Date(ahora); prox.setDate(prox.getDate() + diasFaltan);
  return fechaToISO(prox);
}
function fechaToISO(d){
  const off = d.getTimezoneOffset();
  const l = new Date(d.getTime() - off*60000);
  return l.toISOString().slice(0,10);
}
function fmtFechaCorta(iso){
  if(!iso) return '—';
  const d = new Date(iso+'T00:00:00');
  if(isNaN(d)) return '—';
  const DIAS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  return `${DIAS[d.getDay()]} ${d.getDate()}/${d.getMonth()+1}`;
}

function bloqueMisClases(turnos){
  if(!turnos || turnos.length===0){
    return `<section class="card reveal d2b">
      <h2><span class="dot"></span>Mis clases fijas</h2>
      <p class="empty">No tenés horarios fijos asignados. Si esperabas tener, escribinos.</p>
    </section>`;
  }
  // Ordenar por día y hora
  turnos.sort((a,b)=> (ORDEN_DIAS[a.dia]||99) - (ORDEN_DIAS[b.dia]||99) || (a.hora||'').localeCompare(b.hora||''));

  let rows='';
  turnos.forEach(t=>{
    const proxISO = proximaFechaDelTurno(t.dia, t.hora);
    const proxLegible = fmtFechaCorta(proxISO);
    const dia = esc(t.dia||'');
    const hora = esc(t.hora||'');
    const serv = esc(t.servicio||'');
    rows += `<div class="clase-fija">
      <div class="cf-info">
        <div class="cf-dia">${dia} · ${hora}</div>
        <div class="cf-sub">${serv} · Próxima: ${proxLegible}</div>
      </div>
      <button class="btn-faltar" id="btn-${t.id}" onclick="avisarFalta(${t.id},'${dia}','${hora}','${serv}','${proxISO}')">🚫 Avisar falta</button>
      <div class="falta-slot" id="falta-${t.id}"></div>
    </div>`;
  });

  return `<section class="card reveal d2b">
    <h2><span class="dot"></span>Mis clases fijas</h2>
    ${rows}
    <div class="nota">Si no vas a poder venir, avisanos al menos <b>2 horas antes</b> del turno para que puedas recuperar la clase. Si avisás a último momento, esa clase se pierde.</div>
  </section>`;
}

window.avisarFalta = async function(turnoId, dia, hora, servicio, fechaISO){
  const btn = document.getElementById('btn-'+turnoId);
  const slot = document.getElementById('falta-'+turnoId);
  if(!confirm(`¿Avisar que vas a faltar al turno del ${fmtFechaCorta(fechaISO)} (${dia} ${hora} · ${servicio})?`)) return;

  btn.disabled = true;
  btn.textContent = 'Avisando…';

  try {
    const { error } = await sb.rpc('alumno_avisar_falta', {
      p_turno_id: turnoId,
      p_fecha: fechaISO
    });
    if(error) throw error;

    // Éxito: ocultar botón, mostrar aviso con deshacer + countdown
    btn.style.display = 'none';
    slot.innerHTML = `<div class="aviso-falta" id="aviso-${turnoId}">
      <div>✓ Falta avisada para <b>${fmtFechaCorta(fechaISO)}</b>. Podés deshacer en <span class="cd" id="cd-${turnoId}">5:00</span></div>
      <button class="deshacer" onclick="deshacerFalta(${turnoId},'${fechaISO}')">Deshacer</button>
    </div>`;
    iniciarCountdown(turnoId, fechaISO);
  } catch(e){
    btn.disabled = false;
    btn.textContent = '🚫 Avisar falta';
    const raw = (e && e.message) ? String(e.message).toLowerCase() : '';
    let msg = 'No se pudo avisar tu falta.';
    if(raw.includes('2 hora') || raw.includes('tarde') || raw.includes('horas antes')) msg = 'Llegaste tarde: el turno empieza en menos de 2 horas. Esta clase ya no se puede recuperar.';
    else if(raw.includes('plan')) msg = 'No tenés un plan TF activo. Escribinos para resolverlo.';
    else if(raw.includes('ya') && (raw.includes('avis') || raw.includes('exist'))) msg = 'Ya avisaste esta falta antes.';
    else if(raw.includes('turno') && raw.includes('tuy')) msg = 'Este turno no figura como tuyo. Hablá con el centro.';
    else if(raw.includes('fecha')) msg = 'La fecha no es válida para este turno.';
    else if(e && e.message) msg = 'No se pudo avisar: '+e.message;
    alert(msg);
  }
};

function iniciarCountdown(turnoId, fechaISO){
  const FIN = Date.now() + 5*60*1000;
  const tick = ()=>{
    const cd = document.getElementById('cd-'+turnoId);
    const aviso = document.getElementById('aviso-'+turnoId);
    if(!cd || !aviso) { clearInterval(TIMERS_DESHACER[turnoId]); return; }
    const rest = FIN - Date.now();
    if(rest <= 0){
      // Se acabó el deshacer: aviso firme
      aviso.classList.add('firme');
      aviso.innerHTML = `<div>✓ Falta avisada para <b>${fmtFechaCorta(fechaISO)}</b> (ya no se puede deshacer)</div>`;
      clearInterval(TIMERS_DESHACER[turnoId]);
      delete TIMERS_DESHACER[turnoId];
      return;
    }
    const mm = Math.floor(rest/60000);
    const ss = Math.floor((rest%60000)/1000);
    cd.textContent = `${mm}:${String(ss).padStart(2,'0')}`;
  };
  tick();
  TIMERS_DESHACER[turnoId] = setInterval(tick, 1000);
}

window.deshacerFalta = async function(turnoId, fechaISO){
  if(!confirm('¿Deshacer el aviso de falta? Volvés a quedar como reservado en esa clase.')) return;
  try {
    let ok = false;
    // Intento 1: RPC alumno_deshacer_falta (si Lu la creó en Supabase)
    try {
      const { error } = await sb.rpc('alumno_deshacer_falta', {
        p_turno_id: turnoId,
        p_fecha: fechaISO
      });
      if(!error) ok = true;
    } catch(_){ /* la función puede no existir, intentamos fallback */ }

    // Intento 2 (fallback): DELETE directo sobre asistencia
    if(!ok){
      const { error } = await sb.from('asistencia')
        .delete()
        .eq('turno_id', turnoId)
        .eq('fecha', fechaISO)
        .eq('estado', 'ausente-justificada');
      if(error) throw error;
    }

    // Limpiar UI: volver al estado inicial
    clearInterval(TIMERS_DESHACER[turnoId]);
    delete TIMERS_DESHACER[turnoId];
    const slot = document.getElementById('falta-'+turnoId);
    const btn = document.getElementById('btn-'+turnoId);
    if(slot) slot.innerHTML = '';
    if(btn){ btn.style.display = ''; btn.disabled = false; btn.textContent = '🚫 Avisar falta'; }
  } catch(e){
    alert('No pudimos deshacer el aviso desde acá. Escribinos por WhatsApp y lo arreglamos enseguida.\n\n('+(e.message||'error')+')');
  }
};

// Mapea actividad de la inscripción -> filtro para turnos.servicio
function turnoCoincideConActividad(servicio, actividadAlumno, esBonificado){
  if(esBonificado) return true;                                  // bonificados ven todo
  if(!actividadAlumno || actividadAlumno === 'AMBOS') return true;
  const s = String(servicio||'').toUpperCase();
  if(actividadAlumno === 'ENTRENAMIENTO') return s.includes('ENTREN') || s.includes('PILATES');
  if(actividadAlumno === 'KINEFILAXIA')    return s.includes('KINE') || s.includes('REHAB');
  return true;
}

// Devuelve ISO YYYY-MM-DD del próximo día de semana correspondiente.
// targetDia: 1=Lun, 2=Mar... 5=Vie. Devuelve siempre fecha >= hoy.
function fechaDelDiaDeEstaSemana(targetDia){
  const ahora = new Date();
  const hoyDia = ahora.getDay() === 0 ? 7 : ahora.getDay(); // Domingo->7
  let diff = targetDia - hoyDia;
  if(diff < 0) diff += 7; // ya pasó esta semana -> próxima semana
  const d = new Date(ahora);
  d.setDate(d.getDate() + diff);
  return fechaToISO(d);
}

function bloqueAgenda(data){
  if(!data || !data.turnos || data.turnos.length === 0){
    return `<section class="card reveal d2b">
      <h2><span class="dot"></span>Agenda de la semana</h2>
      <p class="empty">No pudimos cargar la agenda. Si seguís sin verla, escribinos por WhatsApp.</p>
    </section>`;
  }
  // Día por defecto: hoy si es lun-vie, sino el lunes próximo
  const hoyDia = new Date().getDay(); // 0=dom, 6=sab
  const diaDefault = (hoyDia>=1 && hoyDia<=5) ? hoyDia : 1;

  // Tabs Lun-Vie con la fecha real
  const DIA_LBL = {1:'Lun',2:'Mar',3:'Mié',4:'Jue',5:'Vie'};
  let tabs = '<div class="ag-tabs">';
  for(let d=1; d<=5; d++){
    const fecha = fechaDelDiaDeEstaSemana(d);
    const partes = fecha.split('-'); // YYYY-MM-DD
    const dm = `${parseInt(partes[2],10)}/${parseInt(partes[1],10)}`;
    const cls = (d===diaDefault) ? 'ag-tab activo' : 'ag-tab';
    tabs += `<button class="${cls}" data-dia="${d}" onclick="cambiarDiaAgenda(${d})"><span class="ag-tab-dia">${DIA_LBL[d]}</span><span class="ag-tab-num">${dm}</span></button>`;
  }
  tabs += '</div>';

  return `<section class="card reveal d2b">
    <h2><span class="dot"></span>Agenda de la semana</h2>
    ${tabs}
    <div id="agenda-lista"></div>
    <div class="nota" style="margin-top:14px">Mostramos cuántos compañeros van a estar en cada clase. Si avisaron falta, no los contamos. Pronto vas a poder anotarte directo en un recuperatorio desde acá.</div>
  </section>`;
}

const _ORDEN_DIAS_AG = {'Lunes':1,'Martes':2,'Miércoles':3,'Miercoles':3,'Jueves':4,'Viernes':5,'Sábado':6,'Sabado':6,'Domingo':7};

window.cambiarDiaAgenda = function(dia){
  // Actualizar estado visual de los tabs
  document.querySelectorAll('.ag-tab').forEach(b=>{
    if(parseInt(b.dataset.dia,10) === dia) b.classList.add('activo');
    else b.classList.remove('activo');
  });
  renderAgendaDia(dia);
};

// Devuelve {cls, pct} para el badge y la barra de cupo según ocupación
function nivelDeOcupacion(efectivos, cap){
  if(!cap || cap===0) return {cls:'libre', pct:0};
  if(efectivos >= cap) return {cls:'lleno', pct:100};
  const pct = Math.min(100, Math.round((efectivos/cap)*100));
  if(pct < 60) return {cls:'libre', pct};
  if(pct < 80) return {cls:'medio', pct};
  return {cls:'casi', pct};
}
// Clase del puntito de color según servicio (ENTRENAMIENTO=azul, KINEFILAXIA=violeta)
function dotServicio(servicio){
  const s = String(servicio||'').toUpperCase();
  if(s.includes('KINE') || s.includes('REHAB')) return 'kine';
  return 'ent';
}
// Nombre "humano" del servicio (Title Case)
function nombreServicio(servicio){
  if(!servicio) return 'Clase';
  const s = String(servicio).toLowerCase();
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function renderAgendaDia(dia){
  const cont = document.getElementById('agenda-lista');
  const data = window._agendaData;
  if(!cont || !data) return;
  const fechaISO = fechaDelDiaDeEstaSemana(dia);

  // Filtrar turnos: día de semana coincide + actividad del alumno
  const turnos = data.turnos.filter(t =>
    _ORDEN_DIAS_AG[t.dia] === dia &&
    turnoCoincideConActividad(t.servicio, data.actividadAlumno, data.esBonificado)
  );
  turnos.sort((a,b)=> (a.hora||'').localeCompare(b.hora||''));

  if(turnos.length === 0){
    cont.innerHTML = `<p class="empty">No hay turnos disponibles para tu actividad ese día.</p>`;
    return;
  }

  // Agrupar por hora
  const porHora = {};
  turnos.forEach(t => {
    const h = t.hora || '—';
    if(!porHora[h]) porHora[h] = [];
    porHora[h].push(t);
  });
  const horasOrdenadas = Object.keys(porHora).sort();

  let html = '';
  horasOrdenadas.forEach(hora => {
    const tsHora = porHora[hora];
    // Dentro de cada hora, ordenar Entrenamiento antes que Kinefilaxia
    tsHora.sort((a,b)=> dotServicio(a.servicio).localeCompare(dotServicio(b.servicio)));

    let filas = '';
    tsHora.forEach(t => {
      const fijos = data.fijosPorTurno[t.id] || 0;
      const agreg = data.agregadosPorClave[t.id+'|'+fechaISO] || 0;
      const aus   = data.ausentesPorClave[t.id+'|'+fechaISO] || 0;
      const efectivos = Math.max(0, fijos + agreg - aus);
      const cap = t.capacidad || 0;
      const niv = nivelDeOcupacion(efectivos, cap);
      const dot = dotServicio(t.servicio);
      const nom = nombreServicio(t.servicio);
      filas += `<div class="ag-turno">
        <div class="ag-turno-info">
          <span class="ag-dot ${dot}"></span>
          <span class="ag-turno-nombre">${esc(nom)}</span>
        </div>
        <div class="ag-turno-right">
          <div class="ag-cupo-num ${niv.cls}">${efectivos} / ${cap || '?'}</div>
          <div class="ag-bar"><div class="ag-bar-fill ${niv.cls}" style="width:${niv.pct}%"></div></div>
        </div>
      </div>`;
    });

    html += `<div class="ag-grupo">
      <div class="ag-hora-titulo">${esc(hora)}</div>
      ${filas}
    </div>`;
  });

  cont.innerHTML = html;
}

// Renderizar el día por defecto apenas se construye el bloque (corre al final del cargarEspacio)
function _renderAgendaInicial(){
  const hoyDia = new Date().getDay();
  const dia = (hoyDia>=1 && hoyDia<=5) ? hoyDia : 1;
  // Esperar un tick a que el DOM exista
  setTimeout(()=> renderAgendaDia(dia), 0);
}

function bloqueAsistencia(asis){
  let pres=0, aus=0, rec=0;
  asis.forEach(a=>{
    const e=(a.estado||'').toLowerCase();
    if(e.includes('presente')||e==='presente') pres++;
    else if(e.includes('recup')) rec++;
    else if(e.includes('ausente')||e.includes('falta')) aus++;
  });
  return `<section class="card reveal d3">
    <h2><span class="dot"></span>Mis clases</h2>
    <div class="stats">
      <div class="stat asis"><div class="n">${pres}</div><div class="t">Asistí</div></div>
      <div class="stat aus"><div class="n">${aus}</div><div class="t">Ausentes</div></div>
      <div class="stat rec"><div class="n">${rec}</div><div class="t">Recuperadas</div></div>
    </div>
  </section>`;
}

function bloqueRecuperatorios(recus){
  const hoy = hoyISO();
  // pendientes: estado pendiente y sin fecha de recupero todavía
  const pend = recus.filter(r=>{
    const e=(r.estado||'').toLowerCase();
    return e==='pendiente' || (e!=='cumplido' && e!=='vencido' && e!=='cancelado' && !r.fecha_recupero);
  });
  let rows='';
  if(pend.length===0){
    rows = `<p class="empty">No tenés clases pendientes de recuperar. ¡Al día! 🎉</p>`;
  } else {
    pend.forEach(r=>{
      const dias = DIAS_PARA_RECUPERAR - diasEntre(r.fecha_ausencia, hoy);
      const esFeriado = (r.tipo||'').toLowerCase().includes('feriado');
      let cls='ok', lbl='días';
      if(dias<=0){ cls='urge'; }
      else if(dias<=10){ cls='urge'; }
      else if(dias<=25){ cls='warn'; }
      const dnum = dias<=0 ? '0' : dias;
      const lblTxt = dias<=0 ? 'vencido' : (dias===1?'día':'días');
      rows += `<div class="recu">
        <div class="info">
          <div class="fa">Falta del ${fmtFecha(r.fecha_ausencia)} ${esFeriado?'<span class="badge-fer">Feriado</span>':''}</div>
          <div class="sub">${esFeriado?'Se repone sin gastar cupo.':'Podés recuperarla coordinando con el centro.'}</div>
        </div>
        <div class="cuenta ${cls}">
          <div class="d">${dnum}</div>
          <div class="l">${lblTxt}</div>
        </div>
      </div>`;
    });
  }
  return `<section class="card reveal d3">
    <h2><span class="dot"></span>Recuperatorios pendientes</h2>
    ${rows}
    <div class="nota">Tenés ${DIAS_PARA_RECUPERAR} días desde la falta para recuperar la clase. Para reprogramar, coordiná con el centro.</div>
  </section>`;
}

function bloquePagos(pagos){
  if(!pagos || pagos.length===0){
    return `<section class="card reveal d4">
      <h2><span class="dot"></span>Mis pagos</h2>
      <p class="empty">Todavía no hay pagos registrados.</p>
    </section>`;
  }
  // ordenar por fecha desc
  pagos.sort((a,b)=> (b.fecha||'').localeCompare(a.fecha||''));
  const visibles = pagos.slice(0,12);
  let rows='';
  visibles.forEach(p=>{
    rows += `<div class="pago-row">
      <div class="pl">
        <div class="mes">${fmtMesImputado(p.mes_imputado)}</div>
        <div class="sub">Pagado el ${fmtFecha(p.fecha)}</div>
      </div>
      <div style="text-align:right">
        <div class="imp">${fmtMoneda(p.importe)}</div>
        <div class="medio">${esc(p.medio||'')}</div>
      </div>
    </div>`;
  });
  const extra = pagos.length>12 ? `<div class="nota">Mostrando los últimos 12 pagos de ${pagos.length} en total.</div>` : '';
  return `<section class="card reveal d4">
    <h2><span class="dot"></span>Mis pagos</h2>
    ${rows}
    ${extra}
  </section>`;
}

function bloqueEvoluciones(evos){
  if(!evos || evos.length===0){
    return `<section class="card reveal d5">
      <h2><span class="dot"></span>Evoluciones de los profes</h2>
      <p class="empty">Todavía no hay evoluciones cargadas.</p>
    </section>`;
  }
  let rows='';
  evos.forEach(e=>{
    let score='';
    if(e.score!=null){
      let bars='';
      for(let k=1;k<=5;k++) bars+=`<i class="${k<=e.score?'on':''}"></i>`;
      score=`<div class="score" title="Cómo se sintió">${bars}</div>`;
    }
    rows += `<div class="evo">
      <div class="head">
        <span class="f">${fmtFecha(e.fecha)}</span>
        ${e.servicio?`<span class="serv">${esc(e.servicio)}</span>`:''}
      </div>
      <div class="cont">${esc(e.contenido||e.observacion||'—')}</div>
      ${score}
      ${e.autor_nombre?`<div class="autor">— ${esc(e.autor_nombre)}</div>`:''}
    </div>`;
  });
  return `<section class="card reveal d5">
    <h2><span class="dot"></span>Evoluciones de los profes</h2>
    ${rows}
  </section>`;
}

function bloqueHC(hc, moplex){
  if(!hc && !moplex){
    return `<section class="card reveal d6">
      <h2><span class="dot"></span>Mi historia clínica</h2>
      <p class="empty">Todavía no completaste tu historia clínica. Si tu profe te pasó el link, podés completarla cuando quieras.</p>
    </section>`;
  }
  let rows='';
  if(hc){
    if(hc.motivo_consulta) rows+=hcRow('Motivo de consulta', hc.motivo_consulta);
    if(hc.objetivo_funcional) rows+=hcRow('Objetivo', hc.objetivo_funcional);
    if(Array.isArray(hc.servicios_requeridos)&&hc.servicios_requeridos.length) rows+=hcRow('Servicios', hc.servicios_requeridos.join(', '));
    if(hc.completado_en) rows+=hcRow('Completada', fmtFecha(hc.completado_en.slice(0,10)));
  }
  if(moplex){
    if(moplex.altura) rows+=hcRow('Altura', moplex.altura);
    if(moplex.peso) rows+=hcRow('Peso', moplex.peso);
    if(moplex.completado_en) rows+=hcRow('Evaluación MOPLEX', fmtFecha(moplex.completado_en.slice(0,10)));
  }
  if(!rows) rows=`<p class="empty">Tu historia clínica está cargada.</p>`;
  return `<section class="card reveal d6">
    <h2><span class="dot"></span>Mi historia clínica</h2>
    ${rows}
    <div class="nota">Esta es la información que cargaste vos. Las notas clínicas internas del equipo no se muestran acá.</div>
  </section>`;
}
function hcRow(k,v){ return `<div class="hc-row"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`; }
