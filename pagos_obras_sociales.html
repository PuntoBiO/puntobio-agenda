<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagos Obras Sociales · PuntoBiO</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg-deep: #f1f5f9;
    --bg-card: #ffffff;
    --bg-soft: #f8fafc;
    --border: #e5e7eb;
    --celeste: #1e9fe0;
    --celeste-dark: #1788c2;
    --text: #0f172a;
    --text-dim: #64748b;
    --text-faint: #94a3b8;
    --verde: #16a34a;
    --verde-bg: #dcfce7;
  }
  html, body {
    background: var(--bg-deep);
    color: var(--text);
    font-family: 'Manrope', system-ui, -apple-system, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 22px 16px 60px; }
  .hero { margin-bottom: 22px; }
  .hero .tag {
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px;
    color: var(--celeste-dark); font-weight: 700;
  }
  .hero h1 { font-size: 22px; margin-top: 2px; }
  .hero .sub { color: var(--text-dim); font-size: 13px; margin-top: 4px; }
  .user-badge {
    display: inline-block; margin-top: 8px; font-size: 12px;
    background: #e8f5fc; color: var(--celeste-dark);
    padding: 4px 10px; border-radius: 12px; font-weight: 600;
  }

  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 18px;
  }
  .card h2 { font-size: 15px; margin-bottom: 14px; }

  .field { margin-bottom: 14px; }
  .field label {
    display: block; font-size: 12px; font-weight: 600;
    color: var(--text-dim); margin-bottom: 5px;
    text-transform: uppercase; letter-spacing: 0.3px;
  }
  .field input, .field select {
    width: 100%; padding: 10px 12px;
    border: 1px solid var(--border); border-radius: 9px;
    font-size: 14px; font-family: inherit; background: #fff; color: var(--text);
  }
  .field input:focus, .field select:focus { outline: none; border-color: var(--celeste); }

  .btn {
    width: 100%; padding: 12px; border: none; border-radius: 10px;
    background: var(--celeste); color: #fff; font-size: 15px; font-weight: 700;
    font-family: inherit; cursor: pointer; transition: background 0.15s;
  }
  .btn:hover { background: var(--celeste-dark); }
  .btn:disabled { opacity: 0.6; cursor: default; }

  .warn {
    background: #fef2f2; border: 1px solid #fca5a5; color: #b91c1c;
    border-radius: 9px; padding: 10px 12px; font-size: 13px; font-weight: 600;
    margin-bottom: 14px;
  }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    text-align: left; padding: 8px 10px; font-size: 11px;
    text-transform: uppercase; color: var(--text-dim); font-weight: 700;
    border-bottom: 1px solid var(--border); letter-spacing: 0.3px;
  }
  tbody td { padding: 9px 10px; border-bottom: 1px solid var(--border); }
  tbody tr:last-child td { border-bottom: none; }
  .empty { text-align: center; color: var(--text-faint); padding: 24px; font-style: italic; }
  .pill {
    display: inline-block; padding: 2px 8px; border-radius: 10px;
    font-size: 11px; font-weight: 700;
  }
  .pill-leido { background: var(--verde-bg); color: var(--verde); }
  .pill-nuevo { background: #fef3c7; color: #b45309; }
  .monto { font-weight: 700; }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--verde); color: #fff; padding: 12px 22px;
    border-radius: 10px; font-weight: 600; font-size: 14px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.2); display: none; z-index: 999;
  }
  .toast.show { display: block; }
  .loader {
    border: 3px solid #e5e7eb; border-top: 3px solid var(--celeste);
    border-radius: 50%; width: 28px; height: 28px;
    animation: spin 0.8s linear infinite; margin: 24px auto;
  }
  @keyframes spin { 100% { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="wrap">
  <div class="hero">
    <div class="tag">💳 Obras Sociales</div>
    <h1>Carga de pagos de obras sociales</h1>
    <p class="sub">Registrá acá los pagos que te entran de las obras sociales. Queda avisado automáticamente, sin mandar WhatsApp.</p>
    <div class="user-badge" id="userBadge">Identificando…</div>
  </div>

  <!-- FORMULARIO DE CARGA -->
  <div class="card" id="formCard">
    <h2>➕ Nuevo pago recibido</h2>
    <div id="warnZone"></div>
    <div class="field">
      <label>Obra social</label>
      <select id="inOS">
        <option value="">Elegí una obra social…</option>
      </select>
    </div>
    <div class="field">
      <label>Monto recibido</label>
      <input type="number" id="inMonto" placeholder="Ej: 45000" min="0" step="0.01">
    </div>
    <div class="field">
      <label>Fecha del pago</label>
      <input type="date" id="inFecha">
    </div>
    <button class="btn" id="btnGuardar">Guardar pago</button>
  </div>

  <!-- MIS PAGOS CARGADOS -->
  <div class="card">
    <h2>📋 Mis pagos cargados</h2>
    <div id="listaZone"><div class="loader"></div></div>
  </div>
</div>

<div class="toast" id="toast">Listo</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = 'https://bqpjtoiictnzcasxfucf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_yvuXDxrkRrhXwmZBnE_a_Q_zDBz0iDi';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Lista de obras sociales reales (sin PARTICULAR)
const OBRAS_SOCIALES = [
  'Apross','Avalian','Boreal','Caja de abogados','Ciencias económicas',
  'Daspu','Dasuten','Federada Salud','Iosfa','Jerarquicos Salud',
  'Medicus','Medifé','OSDE','Osseg','Prevención Salud','Sancor Salud','Unimed'
];

let usuarioActual = null; // {id, nombre, email}
let misPagos = [];

const fmt = n => '$' + Math.round(Number(n) || 0).toLocaleString('es-AR');

document.addEventListener('DOMContentLoaded', async () => {
  // Llenar el desplegable de obras sociales
  const sel = document.getElementById('inOS');
  // "Otros" va primero (para cuando no se sabe de qué obra social es)
  const oOtros = document.createElement('option');
  oOtros.value = 'Otros'; oOtros.textContent = 'Otros';
  sel.appendChild(oOtros);
  // Después las obras sociales reales
  OBRAS_SOCIALES.forEach(os => {
    const o = document.createElement('option');
    o.value = os; o.textContent = os;
    sel.appendChild(o);
  });
  // Fecha de hoy por defecto
  document.getElementById('inFecha').value = new Date().toISOString().split('T')[0];

  await detectarUsuario();
  await cargarMisPagos();

  document.getElementById('btnGuardar').onclick = guardarPago;
});

// Detecta al profesional logueado (igual que el resto del sistema, por email)
async function detectarUsuario() {
  try {
    const { data: { user } } = await sb.auth.getUser();
    if (!user || !user.email) {
      bloquearSinLogin('No detectamos tu usuario. Iniciá sesión para cargar pagos.');
      return;
    }
    const { data: persona } = await sb.from('personas')
      .select('id, nombre')
      .ilike('email', user.email)
      .maybeSingle();
    if (persona) {
      usuarioActual = { id: persona.id, nombre: persona.nombre, email: user.email };
      const primer = (persona.nombre || '').split(' ')[0];
      document.getElementById('userBadge').textContent = '👤 ' + primer;
    } else {
      usuarioActual = { id: null, nombre: user.email, email: user.email };
      document.getElementById('userBadge').textContent = '👤 ' + user.email;
    }
  } catch (e) {
    console.warn('No se pudo detectar usuario:', e.message);
    bloquearSinLogin('No detectamos tu usuario. Iniciá sesión para cargar pagos.');
  }
}

function bloquearSinLogin(msg) {
  document.getElementById('warnZone').innerHTML = `<div class="warn">⚠️ ${msg}</div>`;
  document.getElementById('btnGuardar').disabled = true;
  document.getElementById('userBadge').textContent = '⚠️ Sin sesión';
}

async function guardarPago() {
  if (!usuarioActual) { alert('Iniciá sesión para cargar pagos.'); return; }
  const os = document.getElementById('inOS').value;
  const monto = parseFloat(document.getElementById('inMonto').value);
  const fecha = document.getElementById('inFecha').value;

  if (!os) { alert('Elegí una obra social.'); return; }
  if (!monto || monto <= 0) { alert('Ingresá un monto válido.'); return; }
  if (!fecha) { alert('Elegí la fecha del pago.'); return; }

  const btn = document.getElementById('btnGuardar');
  btn.disabled = true;
  btn.textContent = 'Guardando…';
  try {
    const fila = {
      obra_social: os,
      monto: monto,
      fecha: fecha,
      profesional_id: usuarioActual.id,
      profesional_nombre: usuarioActual.nombre,
      profesional_email: usuarioActual.email,
      leido: false
    };
    const { data, error } = await sb.from('pagos_obras_sociales').insert(fila).select().single();
    if (error) throw error;
    misPagos.unshift(data);
    // Limpiar formulario (menos la fecha)
    document.getElementById('inOS').value = '';
    document.getElementById('inMonto').value = '';
    renderMisPagos();
    showToast('✓ Pago guardado. Quedó avisado.');
  } catch (e) {
    alert('Error al guardar: ' + e.message);
  }
  btn.disabled = false;
  btn.textContent = 'Guardar pago';
}

async function cargarMisPagos() {
  const zona = document.getElementById('listaZone');
  if (!usuarioActual) { zona.innerHTML = '<div class="empty">Iniciá sesión para ver tus pagos.</div>'; return; }
  try {
    const { data, error } = await sb.from('pagos_obras_sociales')
      .select('*')
      .eq('profesional_id', usuarioActual.id)
      .order('creado_en', { ascending: false });
    if (error) throw error;
    misPagos = data || [];
    renderMisPagos();
  } catch (e) {
    zona.innerHTML = `<div class="empty">Error al cargar: ${e.message}</div>`;
  }
}

function formatFecha(iso) {
  if (!iso) return '—';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

function renderMisPagos() {
  const zona = document.getElementById('listaZone');
  if (!misPagos.length) {
    zona.innerHTML = '<div class="empty">Todavía no cargaste ningún pago.</div>';
    return;
  }
  zona.innerHTML = `
    <table>
      <thead>
        <tr><th>Fecha</th><th>Obra social</th><th>Monto</th><th>Estado</th></tr>
      </thead>
      <tbody>
        ${misPagos.map(p => `
          <tr>
            <td>${formatFecha(p.fecha)}</td>
            <td>${escapeHtml(p.obra_social)}</td>
            <td class="monto">${fmt(p.monto)}</td>
            <td>${p.leido
              ? '<span class="pill pill-leido">✓ Visto</span>'
              : '<span class="pill pill-nuevo">Enviado</span>'}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
</script>
</body>
</html>
