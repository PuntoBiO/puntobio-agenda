<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda BiOLAB · PuntoBiO</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#140808; --panel:#1c1010; --panel-2:#241414;
    --border:#3a1f1f; --hover:#2a1616;
    --text:#f0e8e8; --muted:#a88; --dim:#866;
    --accent:#1e9fe0; --accent-2:#0c7bb8; --accent-soft:rgba(30,159,224,0.15);
    --moplex:#8b0000; --moplex-soft:rgba(139,0,0,0.25);
    --eval:#3b82f6; --eval-soft:rgba(59,130,246,0.18);
    --sarkmed:#a855f7; --sarkmed-soft:rgba(168,85,247,0.18);
    --verde:#22c55e; --verde-soft:rgba(34,197,94,0.18);
    --rojo:#ef4444; --rojo-soft:rgba(239,68,68,0.18);
    --naranja:#f59e0b; --naranja-soft:rgba(245,158,11,0.18);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background: linear-gradient(180deg, #1a0e0e 0%, #100808 100%) fixed;
    color:var(--text); font-size:14px;
  }
  .header{
    padding:16px 20px; border-bottom:1px solid var(--border); background:var(--panel);
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;
  }
  .header h1{margin:0; font-size:18px; color:var(--accent); font-weight:600;}
  .header h1 span{color:var(--muted); font-weight:400; font-size:14px; margin-left:8px;}

  .toolbar{
    padding:12px 20px; border-bottom:1px solid var(--border); background:var(--panel-2);
    display:flex; gap:10px; align-items:center; flex-wrap:wrap;
  }
  .nav-week{display:flex; gap:6px; align-items:center;}
  .btn{
    padding:7px 14px; background:var(--panel); color:var(--text);
    border:1px solid var(--border); border-radius:6px; cursor:pointer; font-size:13px;
    transition:all 0.15s;
  }
  .btn:hover{background:var(--hover); border-color:var(--accent);}
  .btn-primary{
    background:var(--accent); color:white; border-color:var(--accent); font-weight:600;
  }
  .btn-primary:hover{background:var(--accent-2); border-color:var(--accent-2);}
  .btn-danger{background:transparent; color:var(--rojo); border-color:var(--rojo);}
  .btn-danger:hover{background:var(--rojo-soft);}
  .btn-verde{background:transparent; color:var(--verde); border-color:var(--verde);}
  .btn-verde:hover{background:var(--verde-soft);}
  .week-label{font-weight:600; font-size:14px; color:var(--text); min-width:240px; text-align:center;}

  select{
    padding:6px 10px; background:var(--panel); color:var(--text);
    border:1px solid var(--border); border-radius:6px; font-size:13px; cursor:pointer;
  }
  input[type="text"], input[type="number"], input[type="date"], input[type="time"]{
    padding:8px 10px; background:var(--panel); color:var(--text);
    border:1px solid var(--border); border-radius:6px; font-size:13px; width:100%;
  }
  label{display:block; font-size:11px; color:var(--muted); margin-bottom:4px; text-transform:uppercase; letter-spacing:0.5px;}

  /* GRILLA AGENDA */
  .agenda-wrap{padding:16px 20px;}
  .agenda{
    display:grid;
    grid-template-columns: 72px repeat(5, 1fr);
    background:var(--panel);
    border:1px solid var(--border); border-radius:10px; overflow:hidden;
  }
  .col-header{
    padding:10px 6px; background:#2a1616; border-right:1px solid var(--border); border-bottom:1px solid var(--border);
    text-align:center; font-weight:600; font-size:12px; color:var(--muted); text-transform:uppercase;
  }
  .col-header.feriado{background:#5a2828; color:#fff2cc;}
  .col-header.hoy{background:var(--accent-soft); color:var(--accent);}
  .col-header .dia-num{display:block; font-size:18px; color:var(--text); margin-top:2px;}
  .col-header .feriado-motivo{display:block; font-size:9px; color:#fff2cc; margin-top:2px; font-weight:400;}

  .hora-cell{
    padding:4px 6px; background:#220e0e; border-right:1px solid var(--border); border-bottom:1px solid var(--border);
    text-align:right; font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums;
    min-height:32px; display:flex; align-items:center; justify-content:flex-end;
  }
  .hora-cell.hora-cero{color:var(--text); font-weight:600; font-size:12px;}

  .slot{
    border-right:1px solid var(--border); border-bottom:1px solid var(--border);
    min-height:32px; padding:2px; cursor:pointer; position:relative; transition:background 0.1s;
    background:#1c1010;
  }
  .slot:hover{background:var(--hover);}
  .slot.no-disp{background:repeating-linear-gradient(45deg, #1a0e0e, #1a0e0e 4px, #2a1818 4px, #2a1818 8px); cursor:not-allowed;}
  .slot.no-disp:hover{background:repeating-linear-gradient(45deg, #1a0e0e, #1a0e0e 4px, #2a1818 4px, #2a1818 8px);}
  .slot.feriado{background:#3a2020; cursor:not-allowed;}
  .slot.feriado:hover{background:#3a2020;}
  .slot.gap{background:#0e0606; cursor:default; border-bottom:1px dashed #2a1616;}
  .slot.gap:hover{background:#0e0606;}

  /* CHIPS DE TURNO */
  .turno{
    padding:3px 6px; border-radius:4px; font-size:10.5px; line-height:1.25; cursor:pointer;
    height:100%; display:flex; flex-direction:column; justify-content:center;
    border:1px solid transparent; overflow:hidden;
  }
  .turno .t-paciente{font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .turno .t-meta{font-size:9px; opacity:0.85; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .turno.moplex{background:var(--moplex); color:#fff;}
  .turno.evaluacion_ingreso, .turno.evaluacion_deportista{background:var(--eval); color:#fff;}
  .turno.sarkmed{background:var(--sarkmed); color:#fff;}
  .turno.presente{box-shadow:inset 0 0 0 2px var(--verde);}
  .turno.cancelado{opacity:0.4; text-decoration:line-through;}
  .turno.ausente{opacity:0.5; border:1px dashed #fff;}
  .turno .tilde{font-size:10px; margin-left:3px;}

  /* Leyenda */
  .leyenda{display:flex; gap:14px; padding:10px 20px; border-bottom:1px solid var(--border); background:var(--panel-2); font-size:11px; color:var(--muted); flex-wrap:wrap; align-items:center;}
  .leyenda .l-item{display:flex; align-items:center; gap:5px;}
  .leyenda .l-dot{width:10px; height:10px; border-radius:2px;}

  /* MODALES */
  .modal-bg{
    position:fixed; inset:0; background:rgba(0,0,0,0.75); display:none;
    align-items:center; justify-content:center; z-index:1000; padding:16px;
  }
  .modal-bg.activo{display:flex;}
  .modal{
    background:var(--panel); border:1px solid var(--border); border-radius:10px;
    width:100%; max-width:480px; max-height:92vh; overflow-y:auto;
    box-shadow:0 20px 60px rgba(0,0,0,0.6);
  }
  .modal-header{padding:14px 18px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;}
  .modal-title{font-size:15px; font-weight:600; color:var(--accent);}
  .modal-close{background:none; border:none; color:var(--muted); font-size:22px; cursor:pointer; padding:0; line-height:1;}
  .modal-close:hover{color:var(--text);}
  .modal-body{padding:18px;}
  .modal-footer{padding:14px 18px; border-top:1px solid var(--border); display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap;}
  .form-row{margin-bottom:12px;}
  .form-row-2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}

  /* Lista de pacientes en buscador */
  .paciente-results{
    background:var(--panel-2); border:1px solid var(--border); border-radius:6px;
    max-height:160px; overflow-y:auto; margin-top:4px; display:none;
  }
  .paciente-results.activo{display:block;}
  .paciente-item{padding:7px 10px; border-bottom:1px solid var(--border); cursor:pointer; font-size:12px;}
  .paciente-item:hover{background:var(--hover);}
  .paciente-item .pid{color:var(--muted); font-size:10px;}

  .info-box{background:var(--accent-soft); border-left:3px solid var(--accent); padding:8px 12px; border-radius:4px; font-size:12px; margin-bottom:12px;}
  .warn-box{background:rgba(245,158,11,0.12); border-left:3px solid var(--naranja); padding:8px 12px; border-radius:4px; font-size:12px; margin-bottom:12px;}
  .err-box{background:var(--rojo-soft); border-left:3px solid var(--rojo); padding:8px 12px; border-radius:4px; font-size:12px; margin-bottom:12px;}

  .estado-pill{display:inline-block; padding:2px 8px; border-radius:10px; font-size:10px; font-weight:600;}
  .estado-pill.RESERVADO{background:#3a3a3a; color:#ccc;}
  .estado-pill.PRESENTE{background:var(--verde-soft); color:var(--verde);}
  .estado-pill.CANCELADO{background:var(--rojo-soft); color:var(--rojo);}
  .estado-pill.AUSENTE{background:var(--naranja-soft); color:var(--naranja);}

  /* Toast */
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--panel); border:1px solid var(--accent); padding:10px 18px;
    border-radius:8px; font-size:13px; z-index:2000; display:none;
    box-shadow:0 4px 20px rgba(0,0,0,0.5);
  }
  .toast.ok{border-color:var(--verde); color:var(--verde);}
  .toast.err{border-color:var(--rojo); color:var(--rojo);}
  .toast.activo{display:block;}

  .loading{text-align:center; padding:40px; color:var(--muted);}
</style>
</head>
<body>

<div class="header">
  <h1>🔬 Agenda BiOLAB <span id="rango-fechas">cargando...</span></h1>
  <div style="display:flex; gap:8px; align-items:center;">
    <span style="font-size:12px; color:var(--muted);" id="contador-turnos">—</span>
  </div>
</div>

<div class="toolbar">
  <div class="nav-week">

<div class="agenda-wrap">

<!-- ─────────────────────── MODAL NUEVO TURNO ─────────────────────── -->
<div class="modal-bg" id="modal-nuevo">

<!-- ─────────────────────── MODAL DETALLE TURNO ─────────────────────── -->
<div class="modal-bg" id="modal-detalle">

      <span class="modal-title">📋 Detalle del turno</span>
      <button class="modal-close" onclick="cerrarModal('modal-detalle')">×</button>

      <!-- se rellena dinámicamente -->
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ════════════════════════════════════════════════════════════════
   CONFIGURACIÓN SUPABASE
   ════════════════════════════════════════════════════════════════ */
const SUPABASE_URL = 'https://kxlczgcojkkjsbwwgcyz.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt4bGN6Z2NvamtranNid3dnY3l6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Mjk2MTU5MTksImV4cCI6MjA0NTE5MTkxOX0.LeMpvETHJBSqWY-bWKaqlqaTYwoNJN-V5sIijbZTCBQ';
// ⚠️ IMPORTANTE: si las credenciales de arriba NO son las de PuntoBiO,
// reemplazalas por las que aparecen en agenda_consultorios.html (líneas iniciales del <script>)
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ════════════════════════════════════════════════════════════════
   CONSTANTES BIOLAB
   ════════════════════════════════════════════════════════════════ */
const HORARIOS = [
  '08:00','08:15','08:30','08:45',
  '09:00','09:15','09:30','09:45',
  '10:00','10:15','10:30','10:45',
  '11:00','11:15','11:30','11:45',
  '12:00','12:15','12:30','12:45',
  // gap 13:00-14:45
  '13:00','13:15','13:30','13:45',
  '14:00','14:15','14:30','14:45',
  '15:00','15:15','15:30','15:45',
  '16:00','16:15','16:30','16:45',
  '17:00','17:15','17:30','17:45',
  // gap 18:00-19:45
  '18:00','18:15','18:30','18:45',
  '19:00','19:15','19:30','19:45',
  '20:00','20:15','20:30','20:45'
];

const DIAS_LV = ['LUN','MAR','MIE','JUE','VIE'];

const FERIADOS = {
  '2026-05-01':'Día del trabajador',
  '2026-05-25':'Revolución de Mayo',
  '2026-06-15':'Martín de Güemes',
  '2026-07-09':'Día de la Independencia',
  '2026-08-17':'Día de San Martín',
  '2026-10-12':'Día de la Raza',
  '2026-11-23':'Día de la Soberanía',
  '2026-12-08':'Día de la Virgen',
  '2026-12-24':'Fiestas Navideñas',
  '2026-12-25':'Fiestas Navideñas',
  '2026-12-31':'Año Nuevo',
  '2027-01-01':'Año Nuevo'
};

// Duración por (práctica, profesional) → minutos
function duracionMin(practica, profesional){
  if(['EVALUACION_INGRESO','EVALUACION_DEPORTISTA','SARKMED'].includes(practica)) return 60;
  if(practica === 'MOPLEX'){
    if(profesional === 'BRUNO') return 15;
    if(['MALE','LU','JIME'].includes(profesional)) return 30;
  }
  return 0;
}

// Capacidad MOPLEX por hora
function capacidadMoplex(profesional){
  if(profesional === 'BRUNO') return 4;
  if(['MALE','LU','JIME'].includes(profesional)) return 2;
  return 0;
}

/* ════════════════════════════════════════════════════════════════
   ESTADO GLOBAL
   ════════════════════════════════════════════════════════════════ */
let semanaActual = lunesDeFecha(new Date());
let disponibilidad = []; // filas de tabla disponibilidad para BIOLAB
let turnosSemana = [];   // turnos de la semana actual
let personasCache = [];  // cache de personas para buscador
let slotActual = null;   // {fecha, hora, slotEl}
let turnoSelDetalle = null;

/* ════════════════════════════════════════════════════════════════
   UTILES FECHAS
   ════════════════════════════════════════════════════════════════ */
function lunesDeFecha(d){
  const x = new Date(d);
  const day = x.getDay() || 7; // dom=0 → 7
  x.setDate(x.getDate() - (day - 1));
  x.setHours(0,0,0,0);
  return x;
}
function fmtFecha(d){
  return d.toISOString().slice(0,10);
}
function fmtFechaLarga(d){
  const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return `${d.getDate()} ${meses[d.getMonth()]}`;
}
function diasDeLaSemana(){
  const out = [];
  for(let i=0;i<5;i++){
    const d = new Date(semanaActual);
    d.setDate(d.getDate() + i);
    out.push(d);
  }
  return out;
}
function hMin(h){
  const [hh,mm] = h.split(':').map(Number);
  return hh*60 + mm;
}
function minH(m){
  return String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0');
}
function esGap(hora){
  const m = hMin(hora);
  return (m >= 13*60 && m < 15*60) || (m >= 18*60 && m < 20*60);
}

/* ════════════════════════════════════════════════════════════════
   DISPONIBILIDAD
   ════════════════════════════════════════════════════════════════ */
async function cargarDisponibilidad(){
  // Intentamos leer de la tabla `disponibilidad` (si existe en Supabase)
  // Si no, usamos la disponibilidad hardcodeada según el Excel
  const { data, error } = await sb
    .from('disponibilidad')
    .select('*')
    .ilike('area', '%BIOMECANICA%')
    .eq('activo', 'SI');

  if(error || !data || data.length === 0){
    // Fallback hardcodeado (basado en disponibilidad.xlsx activas SI)
    disponibilidad = DISPONIBILIDAD_HARDCODE;
  } else {
    disponibilidad = data.map(r => ({
      profesional: normProf(r.profesional),
      practica: r.practica,
      dia_numero: Number(r.dia_numero),
      hora_inicio: typeof r.hora_inicio === 'string' ? r.hora_inicio.slice(0,5) : r.hora_inicio,
      hora_fin: typeof r.hora_fin === 'string' ? r.hora_fin.slice(0,5) : r.hora_fin
    }));
  }
}

function normProf(x){
  const t = String(x||'').toUpperCase();
  if(t.includes('BRUNO')) return 'BRUNO';
  if(t.includes('LUCIANA') || t === 'LU') return 'LU';
  if(t.includes('MAGDALENA') || t.includes('MALE')) return 'MALE';
  if(t.includes('JIMENA') || t.includes('JIME')) return 'JIME';
  return t;
}

// Disponibilidad hardcoded (subset ACTIVO=SI del Excel disponibilidad.xlsx para BIOLAB)
const DISPONIBILIDAD_HARDCODE = [
  // BRUNO LUNES 8-12
  ...['08:00','09:00','10:00','11:00'].map(h => ({profesional:'BRUNO', practica:'EVALUACION_INGRESO', dia_numero:1, hora_inicio:h, hora_fin:minH(hMin(h)+60)})),
  ...['08:00','09:00','10:00','11:00'].map(h => ({profesional:'BRUNO', practica:'EVALUACION_DEPORTISTA', dia_numero:1, hora_inicio:h, hora_fin:minH(hMin(h)+60)})),
  ...[480,495,510,525,540,555,570,585,600,615,630,645,660,675,690,705].map(m => ({profesional:'BRUNO', practica:'MOPLEX', dia_numero:1, hora_inicio:minH(m), hora_fin:minH(m+15)})),
  // BRUNO LUNES 20-21
  {profesional:'BRUNO', practica:'EVALUACION_INGRESO', dia_numero:1, hora_inicio:'20:00', hora_fin:'21:00'},

// Devuelve los profesionales/prácticas disponibles para un día+hora
function disponiblesEn(diaNum, hora){
  const m = hMin(hora);
  return disponibilidad.filter(d =>
    d.dia_numero === diaNum &&
    m >= hMin(d.hora_inicio) &&
    m < hMin(d.hora_fin)
  );
}

/* ════════════════════════════════════════════════════════════════
   CARGA DE TURNOS
   ════════════════════════════════════════════════════════════════ */
async function cargarTurnos(){
  const fInicio = fmtFecha(semanaActual);
  const dFin = new Date(semanaActual); dFin.setDate(dFin.getDate()+4);
  const fFin = fmtFecha(dFin);

  const { data, error } = await sb
    .from('turnos_biolab')
    .select('*')
    .gte('fecha', fInicio)
    .lte('fecha', fFin)
    .order('fecha').order('hora_inicio');

  if(error){
    toast('Error cargando turnos: ' + error.message, 'err');
    turnosSemana = [];
    return;
  }
  turnosSemana = (data || []).map(t => ({
    ...t,
    hora_inicio: typeof t.hora_inicio === 'string' ? t.hora_inicio.slice(0,5) : t.hora_inicio,
    hora_fin: typeof t.hora_fin === 'string' ? t.hora_fin.slice(0,5) : t.hora_fin
  }));
}

/* ════════════════════════════════════════════════════════════════
   RENDER GRILLA
   ════════════════════════════════════════════════════════════════ */
function render(){
  const grid = document.getElementById('agenda');
  grid.innerHTML = '';

  const dias = diasDeLaSemana();
  const hoyStr = fmtFecha(new Date());

  // Header de columnas
  const hcorner = document.createElement('div');
  hcorner.className = 'col-header';
  hcorner.textContent = 'HORA';
  grid.appendChild(hcorner);

  dias.forEach((d, idx) => {
    const fStr = fmtFecha(d);
    const esF = FERIADOS[fStr];
    const esHoy = fStr === hoyStr;
    const h = document.createElement('div');
    h.className = 'col-header' + (esF ? ' feriado' : '') + (esHoy ? ' hoy' : '');
    h.innerHTML = `${DIAS_LV[idx]}<span class="dia-num">${d.getDate()}</span>` +
      (esF ? `<span class="feriado-motivo">${esF}</span>` : '');
    grid.appendChild(h);
  });

  // Header fechas
  document.getElementById('rango-fechas').textContent =
    `${fmtFechaLarga(dias[0])} – ${fmtFechaLarga(dias[4])} · ${dias[4].getFullYear()}`;
  document.getElementById('week-label').textContent =
    `Semana del ${fmtFechaLarga(dias[0])}`;
  document.getElementById('contador-turnos').textContent =
    `${turnosSemana.filter(t => t.estado !== 'CANCELADO').length} turnos activos`;

  // Filas
  HORARIOS.forEach(hora => {
    const esCero = hora.endsWith(':00');
    const gap = esGap(hora);

    const hCell = document.createElement('div');
    hCell.className = 'hora-cell' + (esCero ? ' hora-cero' : '');
    hCell.textContent = (esCero || hora.endsWith(':30')) ? hora : '';
    grid.appendChild(hCell);

    dias.forEach((d, didx) => {
      const fStr = fmtFecha(d);
      const diaNum = didx + 1;
      const slot = document.createElement('div');
      slot.className = 'slot';
      slot.dataset.fecha = fStr;
      slot.dataset.hora = hora;

      if(gap){
        slot.classList.add('gap');
        grid.appendChild(slot);
        return;
      }
      if(FERIADOS[fStr]){
        slot.classList.add('feriado');
        grid.appendChild(slot);
        return;
      }

      // ¿Hay turno?
      const turnosAqui = turnosSemana.filter(t =>
        t.fecha === fStr && t.hora_inicio === hora
      );

      if(turnosAqui.length > 0){
        // Si hay varios MOPLEX al mismo tiempo (caso raro), mostramos el primero principal y los otros como puntitos
        turnosAqui.forEach((t, ti) => {
          if(ti === 0) pintarTurno(slot, t);
        });
        if(turnosAqui.length > 1){
          const extra = document.createElement('div');
          extra.style.cssText = 'position:absolute; top:1px; right:3px; font-size:9px; color:#fff; background:rgba(0,0,0,0.5); padding:1px 4px; border-radius:8px;';
          extra.textContent = '+' + (turnosAqui.length-1);
          slot.appendChild(extra);
        }
        slot.onclick = () => abrirDetalleTurno(turnosAqui[0]);
      } else {
        // ¿Está dentro de una franja ocupada por una eval? (los slots intermedios de una eval de 60min)
        const ocupadoPorEval = turnosSemana.find(t =>
          t.fecha === fStr &&
          ['EVALUACION_INGRESO','EVALUACION_DEPORTISTA','SARKMED'].includes(t.practica) &&
          t.estado !== 'CANCELADO' &&
          hMin(hora) > hMin(t.hora_inicio) &&
          hMin(hora) < hMin(t.hora_fin)
        );

        if(ocupadoPorEval){
          slot.classList.add('no-disp');
          slot.style.cursor = 'default';
          slot.onclick = () => abrirDetalleTurno(ocupadoPorEval);
        } else {
          const disp = disponiblesEn(diaNum, hora);
          if(disp.length === 0){
            slot.classList.add('no-disp');
          } else {
            slot.onclick = () => abrirNuevoDesdeSlot(fStr, hora, d, diaNum);
          }
        }
      }
      grid.appendChild(slot);
    });
  });
}

function pintarTurno(slot, t){
  const div = document.createElement('div');
  div.className = `turno ${t.practica.toLowerCase()} ${t.estado.toLowerCase()}`;
  const tilde = t.estado === 'PRESENTE' ? '<span class="tilde">✓</span>' : '';
  div.innerHTML = `
    <div class="t-paciente">${t.paciente}${tilde}</div>
    <div class="t-meta">${t.profesional} · ${practicaCorta(t.practica)}</div>
  `;
  slot.appendChild(div);
}

function practicaCorta(p){
  return {
    'MOPLEX':'MOPLEX',
    'EVALUACION_INGRESO':'EVAL.ING',
    'EVALUACION_DEPORTISTA':'EVAL.DEP',
    'SARKMED':'SARKMED'
  }[p] || p;
}

   NAVEGACIÓN
   ════════════════════════════════════════════════════════════════ */
async function cambiarSemana(delta){
  semanaActual.setDate(semanaActual.getDate() + delta*7);
  await cargarTurnos();
  render();
}
async function irHoy(){
  semanaActual = lunesDeFecha(new Date());
  await cargarTurnos();
  render();
}

  slotActual = null;

}

function abrirNuevoDesdeSlot(fecha, hora, dateObj, diaNum){
  slotActual = { fecha, hora, diaNum };
  document.getElementById('info-slot').innerHTML =
    `📅 <b>${fmtFechaLarga(dateObj)}</b> · 🕐 <b>${hora}</b>`;
  document.getElementById('alerta-nuevo').innerHTML = '';
  document.getElementById('busc-paciente').value = '';
  document.getElementById('paciente-results').classList.remove('activo');
  document.getElementById('busc-paciente').dataset.personaId = '';
  document.getElementById('inp-tto').value = '';
  document.getElementById('inp-obs').value = '';
  document.getElementById('sel-obra').value = 'PARTICULAR';

  // Filtrar opciones profesional/práctica según disponibilidad
  const disp = disponiblesEn(diaNum, hora);
  const profsDisp = [...new Set(disp.map(d => d.profesional))];
  const selProf = document.getElementById('sel-profesional');
  selProf.value = '';
  Array.from(selProf.options).forEach(opt => {
    if(opt.value === '') return;
    opt.disabled = !profsDisp.includes(opt.value);
    opt.style.color = opt.disabled ? '#555' : '';
  });
  if(profsDisp.length === 1) selProf.value = profsDisp[0];

  actualizarPracticasDisponibles();
  document.getElementById('modal-nuevo').classList.add('activo');
}

function actualizarPracticasDisponibles(){
  if(!slotActual) return;
  const prof = document.getElementById('sel-profesional').value;
  const disp = disponiblesEn(slotActual.diaNum, slotActual.hora);
  let practicasDisp = [];
  if(prof){
    practicasDisp = [...new Set(disp.filter(d => d.profesional === prof).map(d => d.practica))];
  } else {
    practicasDisp = [...new Set(disp.map(d => d.practica))];
  }
  const selP = document.getElementById('sel-practica');
  Array.from(selP.options).forEach(opt => {
    if(opt.value === '') return;
    opt.disabled = !practicasDisp.includes(opt.value);
    opt.style.color = opt.disabled ? '#555' : '';
  });
  if(selP.value && !practicasDisp.includes(selP.value)) selP.value = '';
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('sel-profesional').addEventListener('change', actualizarPracticasDisponibles);
});

/* ════════════════════════════════════════════════════════════════
   BÚSQUEDA DE PACIENTES
   ════════════════════════════════════════════════════════════════ */
async function buscarPacientes(q){
  if(!q || q.length < 2){
    document.getElementById('paciente-results').classList.remove('activo');
    return;
  }
  // Buscar en cache primero
  let res;
  if(personasCache.length === 0){
    const { data } = await sb.from('personas').select('id,nombre,dni,celular').order('nombre').limit(500);
    personasCache = data || [];
  }
  const qLow = q.toLowerCase();
  res = personasCache.filter(p =>
    (p.nombre || '').toLowerCase().includes(qLow) ||
    String(p.dni || '').includes(q) ||
    String(p.id) === q.replace('#','')
  ).slice(0, 15);

  const box = document.getElementById('paciente-results');
  if(res.length === 0){
    box.innerHTML = `<div class="paciente-item" style="color:var(--muted);">Sin coincidencias</div>`;
  } else {
    box.innerHTML = res.map(p => `
      <div class="paciente-item" onclick='seleccionarPaciente(${p.id}, ${JSON.stringify(p.nombre)})'>
        <b>${p.nombre}</b> <span class="pid">#${p.id}${p.dni ? ' · DNI '+p.dni : ''}</span>
      </div>
    `).join('');
  }
  box.classList.add('activo');
}

function seleccionarPaciente(id, nombre){
  document.getElementById('busc-paciente').value = nombre;
  document.getElementById('busc-paciente').dataset.personaId = id;
  document.getElementById('paciente-results').classList.remove('activo');
}

document.addEventListener('DOMContentLoaded', () => {
  const inp = document.getElementById('busc-paciente');
  let tid;
  inp.addEventListener('input', e => {
    inp.dataset.personaId = '';
    clearTimeout(tid);
    tid = setTimeout(() => buscarPacientes(e.target.value), 200);
  });
});

/* ════════════════════════════════════════════════════════════════
   GUARDAR NUEVO TURNO
   ════════════════════════════════════════════════════════════════ */
async function guardarTurnoNuevo(){
  const alertaEl = document.getElementById('alerta-nuevo');
  alertaEl.innerHTML = '';

  if(!slotActual){
    alertaEl.innerHTML = '<div class="err-box">Elegí día y hora en la grilla antes de guardar.</div>';
    return;
  }
  const personaId = document.getElementById('busc-paciente').dataset.personaId;
  const paciente = document.getElementById('busc-paciente').value.trim();
  const profesional = document.getElementById('sel-profesional').value;
  const practica = document.getElementById('sel-practica').value;
  const obraSocial = document.getElementById('sel-obra').value;
  const idTto = document.getElementById('inp-tto').value.trim() || null;
  const obs = document.getElementById('inp-obs').value.trim() || null;

  if(!paciente || !personaId){
    alertaEl.innerHTML = '<div class="err-box">Buscá y seleccioná un paciente del listado.</div>';
    return;
  }
  if(!profesional || !practica){
    alertaEl.innerHTML = '<div class="err-box">Elegí profesional y práctica.</div>';
    return;
  }

  const dur = duracionMin(practica, profesional);
  if(!dur){
    alertaEl.innerHTML = '<div class="err-box">Combinación práctica/profesional inválida.</div>';
    return;
  }

  const horaFin = minH(hMin(slotActual.hora) + dur);

  // Validar exclusión mutua y capacidad
  const conflicto = validarConflicto(slotActual.fecha, slotActual.hora, horaFin, profesional, practica);
  if(conflicto){
    alertaEl.innerHTML = `<div class="err-box">${conflicto}</div>`;
    return;
  }

  // Generar id_turno
  const now = new Date();
  const idTurno = 'TD-' + now.getFullYear() +
    String(now.getMonth()+1).padStart(2,'0') +
    String(now.getDate()).padStart(2,'0') + '-' +
    String(now.getHours()).padStart(2,'0') +
    String(now.getMinutes()).padStart(2,'0') +
    String(now.getSeconds()).padStart(2,'0');

  const { error } = await sb.from('turnos_biolab').insert({
    id_turno: idTurno,
    fecha: slotActual.fecha,
    hora_inicio: slotActual.hora,
    hora_fin: horaFin,
    profesional,
    persona_id: Number(personaId),
    paciente,
    tratamiento_id: idTto,
    practica,
    obra_social: obraSocial,
    estado: 'RESERVADO',
    observaciones: obs
  });

  if(error){
    alertaEl.innerHTML = `<div class="err-box">Error: ${error.message}</div>`;
    return;
  }

  cerrarModal('modal-nuevo');
  toast('Turno reservado ✓', 'ok');
  await cargarTurnos();
  render();
}

function validarConflicto(fecha, horaIni, horaFin, profesional, practica){
  const iniM = hMin(horaIni);
  const finM = hMin(horaFin);
  const esMoplex = practica === 'MOPLEX';
  const esEval = ['EVALUACION_INGRESO','EVALUACION_DEPORTISTA','SARKMED'].includes(practica);

  const turnosDia = turnosSemana.filter(t =>
    t.fecha === fecha && t.estado !== 'CANCELADO'
  );

  for(const t of turnosDia){
    const tIni = hMin(t.hora_inicio);
    const tFin = hMin(t.hora_fin);
    const seSuperpone = iniM < tFin && finM > tIni;
    if(!seSuperpone) continue;

    // Exclusión mutua MOPLEX vs EVAL en la misma franja, mismo profesional
    if(t.profesional === profesional){
      if(esEval) return 'Esa franja ya tiene un turno del mismo profesional.';
      if(esMoplex && ['EVALUACION_INGRESO','EVALUACION_DEPORTISTA','SARKMED'].includes(t.practica)){
        return 'No se puede agregar MOPLEX: esa franja está reservada para evaluación.';
      }
      // Mismo horario exacto MOPLEX → ya está ocupado
      if(esMoplex && t.practica === 'MOPLEX' && t.hora_inicio === horaIni){
        return 'Ese horario exacto ya tiene un MOPLEX cargado.';
      }
    }
  }

  // Capacidad MOPLEX por hora para ese profesional
  if(esMoplex){
    const horaBase = Math.floor(iniM / 60) * 60;
    const fin = horaBase + 60;
    const cantMoplex = turnosDia.filter(t =>
      t.profesional === profesional &&
      t.practica === 'MOPLEX' &&
      hMin(t.hora_inicio) >= horaBase &&
      hMin(t.hora_inicio) < fin
    ).length;
    const cap = capacidadMoplex(profesional);
    if(cantMoplex >= cap){
      return `${profesional} ya tiene la capacidad MOPLEX completa para esa hora (${cap}/h).`;
    }
  }

  return null;
}

/* ════════════════════════════════════════════════════════════════

function abrirDetalleTurno(t){
  turnoSelDetalle = t;
  const body = document.getElementById('detalle-body');
  const footer = document.getElementById('detalle-footer');

  body.innerHTML = `
    <div style="display:grid; grid-template-columns: auto 1fr; gap:8px 14px; font-size:13px;">
      <div style="color:var(--muted);">Paciente:</div><div><b>${t.paciente}</b> <span style="color:var(--muted);">#${t.persona_id || '—'}</span></div>
      <div style="color:var(--muted);">Fecha:</div><div>${t.fecha} · <b>${t.hora_inicio}</b> – ${t.hora_fin}</div>
      <div style="color:var(--muted);">Profesional:</div><div>${t.profesional}</div>
      <div style="color:var(--muted);">Práctica:</div><div>${t.practica}</div>
      <div style="color:var(--muted);">Tratamiento:</div><div>${t.tratamiento_id || '—'}</div>
      <div style="color:var(--muted);">Obra social:</div><div>${t.obra_social || '—'}</div>
      <div style="color:var(--muted);">Estado:</div><div><span class="estado-pill ${t.estado}">${t.estado}</span></div>
      ${t.observaciones ? `<div style="color:var(--muted);">Obs.:</div><div>${t.observaciones}</div>` : ''}
    </div>
  `;

  const btns = [];
  if(t.estado === 'RESERVADO'){
    btns.push(`<button class="btn btn-verde" onclick="cambiarEstadoTurno('PRESENTE')">✓ Marcar presente</button>`);
    btns.push(`<button class="btn" onclick="cambiarEstadoTurno('AUSENTE')">Ausente</button>`);
    btns.push(`<button class="btn btn-danger" onclick="cambiarEstadoTurno('CANCELADO')">Cancelar</button>`);
  } else if(t.estado === 'PRESENTE' || t.estado === 'AUSENTE'){
    btns.push(`<button class="btn" onclick="cambiarEstadoTurno('RESERVADO')">↩ Reabrir</button>`);
    btns.push(`<button class="btn btn-danger" onclick="cambiarEstadoTurno('CANCELADO')">Cancelar</button>`);
  } else if(t.estado === 'CANCELADO'){
    btns.push(`<button class="btn" onclick="cambiarEstadoTurno('RESERVADO')">↩ Reactivar</button>`);
  }
  btns.push(`<button class="btn" onclick="cerrarModal('modal-detalle')">Cerrar</button>`);
  footer.innerHTML = btns.join('');

  document.getElementById('modal-detalle').classList.add('activo');
}

async function cambiarEstadoTurno(nuevo){
  if(!turnoSelDetalle) return;
  const { error } = await sb
    .from('turnos_biolab')
    .update({ estado: nuevo })
    .eq('id', turnoSelDetalle.id);
  if(error){
    toast('Error: ' + error.message, 'err');
    return;
  }
  cerrarModal('modal-detalle');
  toast('Estado actualizado → ' + nuevo, 'ok');
  await cargarTurnos();
  render();
}

/* ════════════════════════════════════════════════════════════════
   UI HELPERS
   ════════════════════════════════════════════════════════════════ */
function cerrarModal(id){ document.getElementById(id).classList.remove('activo'); }

function toast(msg, tipo){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast activo ' + (tipo || '');
  setTimeout(() => t.classList.remove('activo'), 2800);
}

/* ════════════════════════════════════════════════════════════════
   INIT
   ════════════════════════════════════════════════════════════════ */
(async () => {
  await cargarDisponibilidad();
  await cargarTurnos();
  render();
})();
</script>
</body>
</html>
