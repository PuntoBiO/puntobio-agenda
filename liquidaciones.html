        <th>Fecha</th><th>Paciente</th><th>Profesional</th><th>Tipo</th><th>Descripción</th><th class="num">$ a MOPLEX</th><th>Pago a MOPLEX</th>
      </tr></thead><tbody>`;
    franqVista.sort((a,b)=> (a.fecha||'').localeCompare(b.fecha||''));
    for (const f of franqVista){
      const esPlant = (f.tipo === 'Plantilla' && f.montoMoplex > 0.5);
      const saldado = !!saldos[f.tratId];
      if (esPlant){ moplexTotalVista += f.montoMoplex; if (saldado) moplexSald += f.montoMoplex; else moplexPend += f.montoMoplex; }
      let estadoCell = '<span style="color:#999">—</span>';
      if (esPlant){
        estadoCell = saldado
          ? `<button class="btn" style="background:#10b981;padding:5px 10px;font-size:12px" onclick="toggleMoplexSaldado(${f.tratId}, false)" title="Ya le pagaste esta plantilla a MOPLEX. Clic para deshacer.">✅ Pagado</button>`
          : `<button class="btn" style="background:#f59e0b;padding:5px 10px;font-size:12px" onclick="toggleMoplexSaldado(${f.tratId}, true)" title="Todavía no le pagaste esta plantilla a MOPLEX. Clic cuando la pagues.">⏳ Falta pagar</button>`;
      }
      html += `<tr${esPlant&&saldado?' style="opacity:.5"':''}>
        <td>${f.fecha}</td><td>${f.paciente}</td><td>${badge(f.prof)}</td>
        <td>${f.tipo}</td><td>${f.desc}</td>
        <td class="num">${fmt(f.montoMoplex)}</td><td>${estadoCell}</td></tr>`;
    }
    html += `<tr style="font-weight:700;background:#fef3c7;color:#92400e;"><td colspan="5">Pendiente de pagar a MOPLEX</td><td class="num">${fmt(moplexPend)}</td><td></td></tr>`;
    if (moplexSald > 0.5) html += `<tr style="font-weight:700;background:#d1fae5;color:#065f46;"><td colspan="5">Ya saldado con MOPLEX</td><td class="num">${fmt(moplexSald)}</td><td></td></tr>`;
    html += `</tbody></table>`;
  }

  // ===== 🦶 MOPLEX — TODAS las consultas del mes (informativo, NO cambia totales) =====
  if (mostrarMoplex && moplexEnVista){
    const cons = window._moplexConsultasMes || [];
    if (cons.length){
      html += `<h2 class="bloque-tit">🦶 MOPLEX — todas las consultas del mes</h2>
        <p style="color:#666;font-size:13px;margin:-6px 0 12px;">Todas las consultas MOPLEX del mes por <b>fecha de consulta</b> (estén cobradas o no). Las de <b>$0</b> y las <b>sin cobrar</b> son <b>informativas</b>: figuran para que no falte nadie, pero <b>no cambian los totales</b> de la liquidación (esos salen de lo efectivamente cobrado, más arriba).</p>
        <table style="margin-bottom:8px;"><thead><tr>
          <th>Fecha</th><th>Paciente</th><th>Profesional</th><th>Consulta</th><th>Plantilla</th>
          <th class="num">$ Paciente</th><th class="num">$ Prof</th><th class="num">$ Centro</th><th class="num">$ MOPLEX</th><th>Estado</th>
        </tr></thead><tbody>`;
      let nGratis=0, nSin=0, nCob=0;
      for (const c of cons){
        let est, estSty;
        if (c.gratis){ est='$0 (gratis)'; estSty='background:#f1f5f9;color:#64748b'; nGratis++; }
        else if (c.cobrado){ est='Cobrado'; estSty='background:#d1fae5;color:#065f46'; nCob++; }
        else { est='Sin cobrar'; estSty='background:#fee2e2;color:#991b1b'; nSin++; }
        const dim = (c.gratis || !c.cobrado) ? ' style="opacity:.7"' : '';
        html += `<tr${dim}>
          <td>${c.fecha}</td><td>${c.paciente}</td><td>${c.prof?badge(c.prof):'—'}</td>
          <td>${c.consultaNombre}</td><td>${c.plantillaNombre||'—'}</td>
          <td class="num">${fmt(c.precio)}</td><td class="num">${fmt(c.prof_monto)}</td>
          <td class="num">${fmt(c.centro)}</td><td class="num">${fmt(c.moplex)}</td>
          <td><span class="est" style="${estSty}">${est}</span></td></tr>`;
      }
      html += `<tr style="font-weight:700;background:#f8fafc;color:#334155;"><td colspan="10">${cons.length} consulta${cons.length!==1?'s':''} en el mes · ${nCob} cobrada${nCob!==1?'s':''} · ${nSin} sin cobrar · ${nGratis} en $0</td></tr>`;
      html += `</tbody></table>`;
    }
  }

  // ===== BLOQUE PRODUCTIVIDAD: cuánto GENERÓ cada profesional (independiente de cuánto se lleva) =====
  if (!esModoMoplex){
  html += `<h2 class="bloque-tit">📈 Productividad por profesional</h2>
    <p style="color:#666;font-size:13px;margin:-6px 0 12px;">Cuánto facturó cada uno por atender, sin importar cuánto se lleva. Para las dueñas (Jime y Lu) todo queda en el centro, pero igual cuenta su producción.</p>`;
  // Producción = sesiones TRABAJADAS en el mes (estén abonadas o no)
  const profsProd = ordenarProfs(Object.keys(prodMes)).sort((a,b)=> prodMes[b].bruto - prodMes[a].bruto);
  const totalGenerado = profsProd.reduce((acc,p)=> acc + prodMes[p].bruto, 0);
  html += `<div class="prod-cards">`;
  for (const prof of profsProd){
    const r = prodMes[prof];
    const pct = totalGenerado > 0 ? (r.bruto/totalGenerado*100) : 0;
    html += `
      <div class="prod-card">
        <div class="prod-nombre">${badge(prof)}</div>
        <div class="prod-monto">${fmt(r.bruto)}</div>
        <div class="prod-sub">${r.cant} sesi${r.cant!==1?'ones':'ón'} · ${pct.toFixed(0)}% del total</div>
        <div class="prod-barra"><div class="prod-barra-fill" style="width:${pct}%;"></div></div>
      </div>`;
  }
  html += `</div>`;
  html += `<div class="prod-total">Total generado entre todos: <b>${fmt(totalGenerado)}</b></div>`;
  } // fin productividad (no MOPLEX)

  // ===== RESUMEN FINAL LINDO (después de todo) =====
  html += `<h2 class="bloque-tit">📋 Resumen final</h2>`;
  html += `<div class="resumen-cards">`;
  if (!esModoMoplex) for (const prof of profs){
    const r = resumen[prof];
    const neto = r.prof - r.cobroProf;
    let estadoTxt, claseCard, iconoEstado;
    if (neto > 0.5){ estadoTxt = `PuntoBiO le paga ${fmt(neto)}`; claseCard = 'rc-pb'; iconoEstado = '⬆️'; }
    else if (neto < -0.5){ estadoTxt = `Le debe a PuntoBiO ${fmt(Math.abs(neto))}`; claseCard = 'rc-deb'; iconoEstado = '⬇️'; }
    else { estadoTxt = 'Saldado'; claseCard = 'rc-ok'; iconoEstado = '✅'; }
    html += `
      <div class="resumen-card ${claseCard}">
        <div class="rc-nombre">${badge(prof)}</div>
        <div class="rc-fila"><span>Le corresponde (sesiones abonadas)</span><b>${fmt(r.prof)}</b></div>
        <div class="rc-fila"><span>Recibió en mano</span><b>${fmt(r.cobroProf)}</b></div>
        ${r.cobroPB > 0.5 ? `<div class="rc-fila" style="color:#92400e;background:#fef3c7;border-radius:6px;padding:4px 6px;margin:2px 0;"><span>🏦 Cobró PuntoBiO (te corresponde)</span><b>${fmt(r.cobroPB)}</b></div>` : ''}
        <div class="rc-estado">${iconoEstado} ${estadoTxt}</div>
      </div>`;
  }
  // MOPLEX como una "parte" más en el resumen final
  if (moplexTotalVista > 0.5){
    html += `
      <div class="resumen-card" style="border-top-color:#0d9488">
        <div class="rc-nombre">🦶 MOPLEX (franquicia)</div>
        <div class="rc-fila"><span>Total del período</span><b>${fmt(moplexTotalVista)}</b></div>
        <div class="rc-fila"><span>Ya saldado</span><b>${fmt(moplexSald)}</b></div>
        <div class="rc-estado" style="background:${moplexPend>0.5?'#fef3c7':'#d1fae5'};color:${moplexPend>0.5?'#92400e':'#065f46'}">${moplexPend>0.5?('Pendiente pagar '+fmt(moplexPend)):'Todo saldado ✅'}</div>
      </div>`;
  }
  html += `</div>`;

  // Resumen de cruces "quién le paga a quién" en texto claro
  // Los MASAJES DE REGALO (cumpleaños) entran acá: PB le debe esa plata al profesional
  // aunque no haya ningún pago del paciente (cortesía del centro).
  const regalosVista = (window._regalosMes || []).filter(s => !filtroProf || normProf(s.profesional) === filtroProf);
  const regPorProf = {}; const regCantProf = {}; let totalRegalos = 0;
  for (const s of regalosVista){
    if (s.tienePago) continue;   // mal clasificado: no se suma dos veces
    const pr = normProf(s.profesional) || 'Vero';
    const m = Number(s.monto_profesional) || 0;
    regPorProf[pr] = (regPorProf[pr] || 0) + m;
    regCantProf[pr] = (regCantProf[pr] || 0) + 1;
    totalRegalos += m;
  }
  const regalosConPago = regalosVista.filter(s => s.tienePago);
  const hayRegalos = totalRegalos > 0.5;

  // ===== DESGLOSE DE LO RECIBIDO EN MANO: ¿de quien es esa plata? =====
  // Regla (Lu, 20/07/2026): la plata que entra salda las sesiones en ORDEN CRONOLOGICO
  // de la sesion, y cada sesion saldada le corresponde ENTERA a quien la atendio.
  // Quien cobro el pago no cambia de quien es la sesion: solo dice quien tiene la plata.
  // Por eso no se prorratea nada: cada sesion ya sabe quien la tiene (fila.tenedores).
  // SOLO LECTURA: no modifica ningun calculo de la liquidacion.
  const desgloseRecibido = {};
  try {
    for (const f of liquidables){
      const lista = f.tenedores || [];
      if (!lista.length) continue;
      for (const tn of lista){
        const parte = f.valor > 0.5 ? (tn.monto / f.valor) : 0;
        if (parte <= 0) continue;
        const d = (desgloseRecibido[tn.quien] = desgloseRecibido[tn.quien] || { porDuenio: {}, detalle: [], atribuido: 0 });
        const mp = (Number(f.mProf) || 0) * parte;
        const mc = (Number(f.mCentro) || 0) * parte;
        if (mp > 0.5){ d.porDuenio[f.prof] = (d.porDuenio[f.prof] || 0) + mp; d.atribuido += mp; }
        if (mc > 0.5){ d.porDuenio['centro (PuntoBiO)'] = (d.porDuenio['centro (PuntoBiO)'] || 0) + mc; d.atribuido += mc; }
        d.detalle.push({ fecha: f.fecha, paciente: f.paciente, prof: f.prof,
                         mProf: mp, mCentro: mc, codigo: f.codigo, parte: parte });
      }
    }
  } catch (e) { console.warn('No se pudo armar el desglose de lo recibido:', e && e.message); }

  // Dibuja el desglose de UN profesional (o cadena vacia si no hay datos).
  const pintarDesglose = (prof) => {
    try {
      const d = desgloseRecibido[prof];
      const totalRecibido = Number(recibido[prof]) || 0;
      if (!d || totalRecibido <= 0.5) return '';
      const ordenD = ['Bruno','Male','Vero','Jime','Lu','centro (PuntoBiO)'];
      const duenios = Object.keys(d.porDuenio).sort((a,b)=>{
        const ia=ordenD.indexOf(a), ib=ordenD.indexOf(b);
        return (ia===-1?99:ia)-(ib===-1?99:ib);
      });
      if (!duenios.length) return '';
      const custodia = totalRecibido - d.atribuido;
      let out = `<div style="margin:4px 0 10px 18px;padding-left:12px;border-left:2px solid #e5e7eb;font-size:13px;color:#374151;">`;
      out += `<div style="color:#6b7280;margin-bottom:3px;">De los <b>${fmt(totalRecibido)}</b> que recibió en mano:</div>`;
      for (const dn of duenios){
        const cuantas = d.detalle.filter(x => (dn === 'centro (PuntoBiO)' ? x.mCentro > 0.5 : (x.prof === dn && x.mProf > 0.5))).length;
        const propio = (dn === prof) ? ' <span style="color:#059669;">(suyo)</span>' : '';
        out += `<div>└ <b>${fmt(d.porDuenio[dn])}</b> de <b>${dn}</b>${propio} <span style="color:#9ca3af;">· ${cuantas} sesión${cuantas===1?'':'es'}</span></div>`;
      }
      if (custodia > 0.5){
        out += `<div>└ <b>${fmt(custodia)}</b> en <b>custodia</b> <span style="color:#9ca3af;">· pagado por sesiones que todavía no se hicieron</span></div>`;
      }
      const det = d.detalle.slice().sort((a,b)=> String(a.fecha||'').localeCompare(String(b.fecha||'')));
      if (det.length){
        out += `<details style="margin-top:6px;"><summary style="cursor:pointer;color:#2563eb;font-size:12.5px;">Ver sesión por sesión (${det.length})</summary>`;
        out += `<table style="margin:6px 0 2px;font-size:12px;width:auto;"><thead><tr>
          <th style="text-align:left;">Fecha</th><th style="text-align:left;">Paciente</th>
          <th style="text-align:left;">Atendió</th><th class="num">Del profe</th><th class="num">Del centro</th>
        </tr></thead><tbody>`;
        let hayCompartido = false;
        for (const x of det){
          const comp = (x.parte < 0.999);
          if (comp) hayCompartido = true;
          out += `<tr><td>${x.fecha || '—'}</td><td>${x.paciente || '—'}${comp ? ' <span style="color:#b45309;" title="Esta sesión quedó cubierta entre dos pagos distintos">◆</span>' : ''}</td><td>${x.prof || '—'}</td>
                  <td class="num">${fmt(x.mProf)}</td><td class="num">${fmt(x.mCentro)}</td></tr>`;
        }
        out += `</tbody></table>`;
        if (hayCompartido){
          out += `<div style="color:#b45309;font-size:11.5px;margin:2px 0 4px;">◆ Esa sesión quedó cubierta entre dos pagos distintos, así que solo una parte la tiene ${prof}. El resto lo tiene quien hizo el otro pago.</div>`;
        }
        out += `</details>`;
      }
      out += `<div style="color:#9ca3af;font-size:11.5px;margin-top:5px;">El neto de arriba además considera las sesiones propias que cobró otro.</div>`;
      out += `</div>`;
      return out;
    } catch (e) { console.warn('No se pudo pintar el desglose de', prof, e && e.message); return ''; }
  };

  const hayDeudasCentro = Object.keys(deudasCentroVista).some(p => deudasCentroVista[p] > 0.5);
  if (!esModoMoplex && (netosFinalesVista.length > 0 || hayDeudasCentro || hayRegalos)){
    html += `<div class="resumen-cruces"><div class="rc-tit-cruces">💸 Cobros a devolver</div>
      <div style="background:#fef3c7;border:1px solid #f59e0b;border-radius:8px;padding:8px 12px;margin:4px 0 10px;font-size:12.5px;color:#92400e;"><b>⚠️ Ojo:</b> este bloque usa el criterio viejo (descuenta el efectivo como si el profesional lo tuviera encima). <b>El número para arreglar es el del recuadro verde de arriba de todo</b>, que da el efectivo por rendido a la caja. Este detalle sirve solo para auditar quién cobró qué.</div>`;
    const ordenRC = ['Bruno','Male','Vero','Jime','Lu'];
    Object.keys(deudasCentroVista).sort((a,b)=>{const ia=ordenRC.indexOf(a),ib=ordenRC.indexOf(b);return (ia===-1?99:ia)-(ib===-1?99:ib);}).forEach(prof=>{
      if (deudasCentroVista[prof] > 0.5){
        html += `<div class="cruce-linea"><b>${prof}</b> cobró de más y debe <b>${fmt(deudasCentroVista[prof])}</b> al <b>centro (PuntoBiO)</b></div>`;
        html += pintarDesglose(prof);
      }
    });
    for (const n of netosFinalesVista){
      html += `<div class="cruce-linea"><b>${n[0]}</b> le debe <b>${fmt(n[2])}</b> a <b>${n[1]}</b></div>`;
    }
    for (const prof of Object.keys(regPorProf)){
      if (regPorProf[prof] > 0.5){
        html += `<div class="cruce-linea">🎁 <b>PuntoBiO</b> le debe <b>${fmt(regPorProf[prof])}</b> a <b>${prof}</b> por ${regCantProf[prof]} masaje${regCantProf[prof]>1?'s':''} de regalo (cumpleaños)</div>`;
      }
    }
    html += `</div>`;
  }

  // ===== BLOQUE INFORMATIVO: pagos de obras sociales recibidos este mes =====
  // Solo informativo: NO se suma ni afecta los cálculos de la liquidación.
  // Muestra el TOTAL por profesional (el detalle fino está en el módulo Pagos Obras Sociales).
  const pagosOS = window._pagosOS || [];
  if (!esModoMoplex && pagosOS.length > 0) {
    let totalOS = 0;
    const porProf = {};
    for (const p of pagosOS) {
      const prof = (p.profesional_nombre || 'Sin profesional').split(' ')[0];
      porProf[prof] = (porProf[prof] || 0) + (Number(p.monto) || 0);
      totalOS += (Number(p.monto) || 0);
    }

    html += `<h2 class="bloque-tit">💳 Pagos de obras sociales recibidos este mes</h2>
      <p style="color:#666;font-size:13px;margin:-6px 0 12px;">Informativo — estos pagos los recibió el profesional directamente en su cuenta. NO se incluyen en el cálculo de la liquidación. El detalle de cada obra social está en el módulo "Pagos Obras Sociales".</p>`;
    html += `<table style="margin-bottom:8px;"><thead><tr>
        <th>Profesional</th><th class="num">Total recibido de OS</th>
      </tr></thead><tbody>`;
    for (const prof of ordenarProfs(Object.keys(porProf))) {
      html += `<tr><td>${badge(prof)}</td><td class="num">${fmt(porProf[prof])}</td></tr>`;
    }
    html += `<tr style="font-weight:700;background:#dcfce7;color:#166534;"><td>TOTAL recibido de OS</td><td class="num">${fmt(totalOS)}</td></tr>`;
    html += `</tbody></table>`;
  }

  // ===== BLOQUE: MASAJES DE REGALO (cumpleaños) =====
  // El paciente no pagó nada (cortesía PuntoBiO): esta plata NO sale de los
  // pagos de arriba. PB se la paga al profesional aparte.
  if (!esModoMoplex && regalosVista.length > 0){
    html += `<h2 class="bloque-tit">🎁 Masajes de regalo (cumpleaños)</h2>
      <p style="color:#666;font-size:13px;margin:-6px 0 12px;">El paciente no pagó nada (cortesía del centro), así que estos montos <b>no figuran en los pagos de arriba</b>: PuntoBiO se los paga al profesional aparte. Ya están sumados en "Cobros a devolver".</p>`;
    html += `<table style="margin-bottom:8px;"><thead><tr>
        <th>Fecha</th><th>Paciente</th><th>Cupón</th><th>Masaje</th><th>Profesional</th><th class="num">Para el profesional</th>
      </tr></thead><tbody>`;
    for (const s of regalosVista){
      const t = s.tratamientos || {};
      const nom = (t.personas && t.personas.nombre) || '—';
      const chip = s.tienePago
        ? ` <span title="Este tratamiento está cargado como masaje de regalo, pero el paciente pagó. Un regalo no lleva pago: hay que corregir el tratamiento." style="padding:1px 6px;border-radius:4px;background:#fee2e2;color:#991b1b;font-size:10px;font-weight:700;white-space:nowrap;">⚠ TIENE PAGO</span>`
        : '';
      const gris = s.tienePago ? ' style="opacity:.55;text-decoration:line-through;"' : '';
      const cual = String(t.tipo_cobro || '').toUpperCase() === 'REGALO_CUMPLE' ? '🎂 cumpleaños'
                 : String(t.tipo_cobro || '').toUpperCase() === 'REGALO_CENTRO' ? '🎁 del centro' : '';
      const queMasaje = practicaLabel(t.practica_codigo || '');
      html += `<tr><td>${s.fecha}</td><td>${nom}${chip}</td><td style="font-family:monospace;">${t.codigo_id || '—'}</td><td>${queMasaje}${cual ? ` <span style="color:var(--text-dim,#78716c);font-size:11px;">· ${cual}</span>` : ''}</td><td>${badge(normProf(s.profesional) || 'Vero')}</td><td class="num"${gris}>${fmt(Number(s.monto_profesional)||0)}</td></tr>`;
    }
    html += `<tr style="font-weight:700;background:#fce7f3;color:#9d174d;"><td colspan="5">TOTAL regalos (lo asume PuntoBiO)</td><td class="num">${fmt(totalRegalos)}</td></tr>`;
    html += `</tbody></table>`;
    if (regalosConPago.length){
      html += `<div style="margin:-2px 0 14px;font-size:12.5px;color:#991b1b;background:#fee2e2;border-radius:8px;padding:10px 12px;">` +
        `⚠ <b>${regalosConPago.length} de estos NO son regalos: el paciente pagó.</b> ` +
        regalosConPago.map(s => { const t = s.tratamientos || {}; return `${(t.personas && t.personas.nombre) || '—'} (${s.fecha})`; }).join(' · ') +
        `<br>Un regalo no lleva pago del paciente. Quedaron tachados y <b>fuera del total</b>, porque si no se contarían dos veces: el profesional se queda con lo que cobró y encima PuntoBiO le debería lo mismo otra vez. ` +
        `Si lo que se quiso hacer es que el paciente pague solo la parte del profesional, el tratamiento va como masaje normal con tipo de cobro <b>Bonificación del centro</b>.</div>`;
    }
  }

  // ===== SALIDA (23/08/2026): la liquidación de siempre es la pantalla, sin plegar =====
  // Pedido de Lu: sacar todo lo que iba arriba (criollo, caja, tarjetas por profesional,
  // custodia) y dejar SOLO la vista de siempre + dos apartados que sí le sirven:
  // los cruces del mes y las sesiones realizadas por profesional, que van al pie.
  let _htmlExtra = '';
  try { _htmlExtra = vistaNueva({ liquidables, pendientes, pagos, MT, hasta, filtroProf, mesViejo }); }
  catch(e){ console.error('vistaNueva:', e); _htmlExtra = '<div class="vacio">⚠️ No se pudieron dibujar los cruces ni las sesiones realizadas (' + e.message + ').</div>'; }
  const _avisoMesViejo = mesViejo
    ? `<div class="nv-aviso">📅 <b>Mes anterior a julio.</b> Estos meses se liquidaron y se pagaron con el criterio de antes
       (por pago cobrado, no por sesión realizada y abonada), así que los números pueden no coincidir con lo que se pagó en su momento.
       Se muestran <b>para consulta e histórico</b>. Antes de mayo de 2026 los datos todavía no son confiables.</div>`
    : '';
  document.getElementById('resultado').innerHTML = _avisoMesViejo + html + _htmlExtra;
  window._grupos = resumen;
  // Guardar todo lo calculado para el PDF
  window._liq = { resumen, porMedio, crucesBrutos: crucesVista, netosFinales: netosFinalesVista, deudasCentro: deudasCentroVista, detalle, totalBruto, totalProf, totalCentro, totalMoplex: totalMoplexV, profs, ordenarProfs, cant: cantVista, moplex: MPX, moplexFranq: franqVista, regalos: { lista: regalosVista, porProf: regPorProf, total: totalRegalos } };
}

function toggleDetalle(prof){
  const row = document.getElementById(`det-${prof}`);
  const arr = document.getElementById(`arr-${prof}`);
  const content = document.getElementById(`det-content-${prof}`);
  const profRow = arr.closest('tr');

  if (row.style.display === 'none'){
    // generar contenido detalle
    const _solo = !!window._soloLoMioLiq;   // profesional restringido: no ve la parte del centro
    const g = window._grupos[prof];
    let html = `<table><thead><tr>
      <th>Sesión</th><th>Paciente</th><th>Tto</th><th>Práctica</th><th>Abonada el</th>
      <th class="num">$ Sesión</th><th class="num">$ Prof</th>${_solo ? '' : '<th class="num">$ Centro</th>'}
    </tr></thead><tbody>`;
    const filas = (g.ses || []).slice().sort((a,b)=> (a.fecha||'').localeCompare(b.fecha||''));
    for (const x of filas){
      html += `<tr>
        <td>${x.fecha}</td>
        <td>${x.paciente}</td>
        <td>${x.codigo}</td>
        <td>${practicaLabel(x.practica)}</td>
        <td>${x.fechaAbono || '-'}</td>
        <td class="num">${fmt(x.valor)}</td>
        <td class="num">${fmt(x.mProf)}</td>
        ${_solo ? '' : `<td class="num">${fmt(x.mCentro)}</td>`}
      </tr>`;
      // Prorrateo: si el monto es menor al valor de la sesion, decir por que.
      if (x.parcial || x.vieneDeDeuda){
        const pctCub = x.valorSesion > 0.5 ? Math.round((x.cubiertoTotal / x.valorSesion) * 100) : 100;
        let nota = '';
        if (x.vieneDeDeuda) nota += `<b>Deuda saldada</b> de la sesión del ${x.fecha}. `;
        nota += `Cubierta al <b>${pctCub}%</b>: se abonaron ${fmt(x.cubiertoTotal)} de ${fmt(x.valorSesion)}.`;
        if (x.deuda > 0.5) nota += ` El paciente debe <b>${fmt(x.deuda)}</b> de esta sesión.`;
        html += `<tr><td colspan="${_solo?7:8}" style="font-size:12px;color:#1e40af;background:#eff6ff;padding-top:2px;padding-bottom:2px;">↳ ${nota}</td></tr>`;
      }
    }
    if (!filas.length && !(g.pend||[]).length) html += `<tr><td colspan="${_solo?7:8}" style="color:#888;">Sin sesiones liquidables este mes (lo suyo puede venir de MOPLEX: ver bloque 5, o recibió plata en custodia: ver bloque 3).</td></tr>`;
    // Sesiones realizadas pero AÚN NO abonadas: van en $0 y pasan a la próxima liquidación
    const pend = (g.pend || []).slice().sort((a,b)=> (a.fecha||'').localeCompare(b.fecha||''));
    for (const x of pend){
      html += `<tr style="opacity:.6;background:#fffbeb;">
        <td>${x.fecha}</td>
        <td>${x.paciente}</td>
        <td>${x.codigo}</td>
        <td>${practicaLabel(x.practica)}</td>
        <td><span class="est" style="background:#fef3c7;color:#92400e;">${x.parcialmenteCobrada ? 'Falta cobrar' : 'Aún no abonada'}</span></td>
        <td class="num">${x.parcialmenteCobrada ? `<span style="color:#92400e;font-size:11px;">debe ${fmt(x.valor)}</span>` : '$0'}</td>
        <td class="num">$0 <span style="color:#92400e;font-size:11px;white-space:nowrap;">(serán ${fmt(x.mProf)})</span></td>
        ${_solo ? '' : `<td class="num">$0</td>`}
      </tr>`;
    }
    if (pend.length) html += `<tr><td colspan="${_solo?7:8}" style="font-size:12.5px;color:#92400e;background:#fffbeb;">⏳ ${pend.length} sesión${pend.length>1?'es':''} realizada${pend.length>1?'s':''} pero <b>aún no abonada${pend.length>1?'s':''} por el paciente</b>: va en $0 este mes y <b>pasa a la próxima liquidación</b> (se le paga al profesional cuando el paciente abone).</td></tr>`;
    html += `</tbody></table>`;

    // 💵 Cobros que le corresponden a este profe — y QUIÉN tiene la plata
    const cobros = (g.cobros || []).slice().sort((a,b)=> (a.fecha||'').localeCompare(b.fecha||''));
    if (cobros.length){
      const totC = cobros.reduce((a,x)=> a + x.importe, 0);
      html += `<div style="margin-top:16px;font-weight:600;color:#0f172a;">💵 Cobros que te corresponden — quién tiene la plata (${fmt(totC)})</div>
        <table style="margin-top:6px;"><thead><tr><th>Fecha</th><th>Paciente</th><th>Medio</th><th>Quién la recibió</th><th class="num">Importe</th></tr></thead><tbody>`;
      for (const x of cobros){
        const ajeno = (x.quien !== prof);
        html += `<tr${ajeno ? ' style="background:#fef3c7;"' : ''}>
          <td>${x.fecha}</td><td>${x.paciente}</td><td>${x.medio}</td>
          <td>${ajeno ? ('🏦 ' + x.quien) : ('✅ ' + x.quien + ' (vos)')}</td>
          <td class="num">${fmt(x.importe)}</td></tr>`;
      }
      html += `</tbody></table>
        <div style="font-size:12px;color:#92400e;margin-top:4px;">Las filas en amarillo las cobró otro (PuntoBiO u otro profe): esa plata es tuya pero la tiene otro → por eso se ajusta en el neto.</div>`;
    }
    content.innerHTML = html;
    row.style.display = '';
    arr.classList.add('open');
    profRow.classList.add('expanded');
  } else {
    row.style.display = 'none';
    arr.classList.remove('open');
    profRow.classList.remove('expanded');
  }
}

function exportarPDF(){
  if (!window._liq) { alert('Primero cargá los datos'); return; }
  const L = window._liq;
  const mes = document.getElementById('mes').value;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF('p', 'mm', 'a4');
  const azul = [30,159,224];
  const fmtP = n => '$' + (Number(n)||0).toLocaleString('es-AR',{maximumFractionDigits:0});

  // Encabezado
  doc.setFontSize(18); doc.setTextColor(...azul);
  doc.text('Liquidación PuntoBiO', 14, 18);
  doc.setFontSize(11); doc.setTextColor(80);
  doc.text(`Mes: ${mes}`, 14, 25);
  let y = 32;

  const tabla = (titulo, head, body, opts={}) => {
    doc.setFontSize(12); doc.setTextColor(...azul);
    doc.text(titulo, 14, y); y += 2;
    doc.autoTable({
      startY: y, head:[head], body,
      theme:'grid', headStyles:{fillColor:azul, fontSize:8}, bodyStyles:{fontSize:8},
      margin:{left:14,right:14}, ...opts
    });
    y = doc.lastAutoTable.finalY + 8;
  };

  // BLOQUE 1
  const b1 = L.profs.map(prof=>{
    const r = L.resumen[prof]; const neto = r.prof - r.cobroProf;
    let est = 'Saldado'; if (neto>0.5) est='PuntoBiO le debe'; else if (neto<-0.5) est='Le debe a PuntoBiO';
    return [prof, fmtP(r.prof), fmtP(r.centro), fmtP(r.cobroProf), fmtP(r.cobroPB), fmtP(neto), est];
  });
  tabla('1 - Resumen por profesional',
    ['Prof','Total Prof','Total Centro','Cobró Prof','Cobró PuntoBiO','Neto','Estado'], b1);

  // Qué le queda a PuntoBiO (por profesional y franquicia)
  const bG = L.profs.map(prof=>{
    const r = L.resumen[prof];
    return [prof, fmtP(r.bruto), fmtP(r.prof), fmtP(r.moplex||0), fmtP(r.centro)];
  });
  bG.push(['TODO PuntoBiO', fmtP(L.totalBruto), fmtP(L.totalProf), fmtP(L.totalMoplex||0), fmtP(L.totalCentro)]);
  tabla('Qué le queda a PuntoBiO',
    ['Origen','Total cobrado','Se lleva el prof','Va a MOPLEX','Queda en PuntoBiO'], bG);

  // BLOQUE 2
  const b2 = L.ordenarProfs(Object.keys(L.porMedio)).map(prof=>{
    const m = L.porMedio[prof]; return [prof, fmtP(m.debito), fmtP(m.efectivo), fmtP(m.transferencia)];
  });
  if (b2.length) tabla('2 - Cobros por medio', ['Prof','Débito','Efectivo','Transferencia'], b2);

  // BLOQUE 3
  if (L.crucesBrutos.length){
    const b3 = L.crucesBrutos.map(c=>[c.fecha, c.cobro, c.prof, fmtP(c.mProf), fmtP(c.importe)]);
    tabla('3 - Cruces (uno cobró por otro)', ['Fecha','Cobró','Correspondía a','Cruce prof','Total'], b3);
  }

  // BLOQUE 4
  const dc = L.deudasCentro || {};
  const hayDC = Object.keys(dc).some(p=>dc[p]>0.5);
  if (L.netosFinales.length || hayDC){
    const b4 = [];
    const ordC = ['Bruno','Male','Vero','Jime','Lu'];
    Object.keys(dc).sort((a,b)=>{const ia=ordC.indexOf(a),ib=ordC.indexOf(b);return (ia===-1?99:ia)-(ib===-1?99:ib);}).forEach(prof=>{
      if (dc[prof]>0.5) b4.push([prof, 'PuntoBiO (centro)', fmtP(dc[prof])]);
    });
    L.netosFinales.forEach(n=> b4.push([n[0], n[1], fmtP(n[2])]));
    tabla('4 - Cruces netos (quién debe a quién)', ['Debe','A','Monto neto'], b4);
  }

  // BLOQUE 5 - detalle por profesional
  doc.setFontSize(12); doc.setTextColor(...azul);
  doc.text('5 - Detalle por profesional y práctica', 14, y); y += 4;
  const porProf = {};
  for (const k of Object.keys(L.detalle)){ const d=L.detalle[k]; (porProf[d.prof]=porProf[d.prof]||[]).push(d); }
  for (const prof of L.ordenarProfs(Object.keys(porProf))){
    const items = porProf[prof].sort((a,b)=>a.prac.localeCompare(b.prac));
    const body = items.map(d=>[d.prac, fmtP(d.cobrado), fmtP(d.mProf), fmtP(d.centro)]);
    doc.setFontSize(10); doc.setTextColor(40); doc.text(prof, 14, y); y += 1;
    doc.autoTable({ startY:y, head:[['Práctica','Cobrado','Profesional','PuntoBiO']], body,
      theme:'grid', headStyles:{fillColor:[120,120,120],fontSize:8}, bodyStyles:{fontSize:8}, margin:{left:14,right:14} });
    y = doc.lastAutoTable.finalY + 6;
    if (y > 260){ doc.addPage(); y = 20; }
  }
  // MOPLEX como un "profesional" más (solo lo de la franquicia, agrupado por plantilla)
  {
    const franqSrc = (L.moplexFranq && L.moplexFranq.length) ? L.moplexFranq : ((L.moplex && L.moplex.franquicia) || []);
    const agg = {}; let mT = 0, mC = 0;
    for (const f of franqSrc){
      if (f.tipo !== 'Plantilla' || f.montoMoplex <= 0.5) continue;
      const key = f.desc || 'Plantilla';
      if (!agg[key]) agg[key] = { desc:key, cant:0, monto:0 };
      agg[key].cant++; agg[key].monto += f.montoMoplex; mT += f.montoMoplex; mC++;
    }
    const items = Object.values(agg).sort((a,b)=> a.desc.localeCompare(b.desc));
    if (items.length){
      if (y > 250){ doc.addPage(); y = 20; }
      doc.setFontSize(10); doc.setTextColor(40); doc.text('MOPLEX', 14, y); y += 1;
      const body = items.map(d=>[d.desc, String(d.cant), fmtP(d.monto)]);
      body.push(['TOTAL a MOPLEX', String(mC), fmtP(mT)]);
      doc.autoTable({ startY:y, head:[['Plantilla','Cantidad','Total a MOPLEX']], body,
        theme:'grid', headStyles:{fillColor:[13,148,136],fontSize:8}, bodyStyles:{fontSize:8}, margin:{left:14,right:14} });
      y = doc.lastAutoTable.finalY + 6;
      if (y > 260){ doc.addPage(); y = 20; }
    }
  }

  const franqPDF = (L.moplexFranq && L.moplexFranq.length) ? L.moplexFranq : ((L.moplex && L.moplex.franquicia) || []);
  if (franqPDF.length){
    if (y > 230){ doc.addPage(); y = 20; }
    const saldos = window._moplexSaldos || {};
    const bM = franqPDF.map(f=>{
      const est = (f.tipo==='Plantilla' && f.montoMoplex>0.5) ? (saldos[f.tratId]?'Pagado':'Falta pagar') : '—';
      return [f.fecha, f.paciente, f.prof, f.tipo, f.desc, fmtP(f.montoMoplex), est];
    });
    tabla('MOPLEX (franquicia) — plantillas a pagar',
      ['Fecha','Paciente','Prof','Tipo','Descripción','$ MOPLEX','Pago a MOPLEX'], bM);
  }

  // BLOQUE PRODUCTIVIDAD
  if (y > 230){ doc.addPage(); y = 20; }
  const totalGen = L.profs.reduce((s,p)=> s + L.resumen[p].bruto, 0);
  const bProd = [...L.profs].sort((a,b)=> L.resumen[b].bruto - L.resumen[a].bruto).map(prof=>{
    const r = L.resumen[prof]; const pct = totalGen>0 ? (r.bruto/totalGen*100) : 0;
    return [prof, fmtP(r.bruto), `${r.cant}`, `${pct.toFixed(0)}%`];
  });
  bProd.push(['TOTAL', fmtP(totalGen), '', '100%']);
  tabla('Productividad por profesional (lo que generó cada uno)',
    ['Prof','Generado','Pagos','% del total'], bProd);

  // ===== RESUMEN FINAL (estado de cada profesional) =====
  if (y > 210){ doc.addPage(); y = 20; }
  const bResumen = L.profs.map(prof=>{
    const r = L.resumen[prof];
    const neto = r.prof - r.cobroProf;
    let estado;
    if (neto > 0.5) estado = 'PuntoBiO le paga ' + fmtP(neto);
    else if (neto < -0.5) estado = 'Debe a PuntoBiO ' + fmtP(Math.abs(neto));
    else estado = 'Saldado';
    return [prof, fmtP(r.prof), fmtP(r.cobroProf), fmtP(r.cobroPB), estado];
  });
  tabla('Resumen final (estado de cada profesional)',
    ['Prof','Le corresponde','Ya cobró','Cobró PuntoBiO','Estado'], bResumen);

  // ===== COBROS A DEVOLVER =====
  const dcR = L.deudasCentro || {};
  const hayDcR = Object.keys(dcR).some(p=>dcR[p]>0.5);
  if ((L.netosFinales && L.netosFinales.length) || hayDcR){
    const bDev = [];
    const ordD = ['Bruno','Male','Vero','Jime','Lu'];
    Object.keys(dcR).sort((a,b)=>{const ia=ordD.indexOf(a),ib=ordD.indexOf(b);return (ia===-1?99:ia)-(ib===-1?99:ib);}).forEach(prof=>{
      if (dcR[prof]>0.5) bDev.push([prof, 'Cobró de más, debe al centro (PuntoBiO)', fmtP(dcR[prof])]);
    });
    (L.netosFinales||[]).forEach(n=> bDev.push([n[0], 'Le debe a ' + n[1], fmtP(n[2])]));
    tabla('Cobros a devolver', ['Quién','Detalle','Monto'], bDev);
  }

  doc.save(`Liquidacion_${mes}.pdf`);
}

// === RESTRICCIÓN "SOLO LO MÍO" en liquidaciones ===
// Si el usuario logueado tiene solo_lo_mio=TRUE, fija el filtro de profesional
// a su propio nombre y bloquea el dropdown para que no pueda ver a otros.
// A prueba de fallos: ante cualquier error, no restringe nada (ve todo, como hoy).
const EMAIL_A_NOMBRE_LIQ = {
  'brunitovelez99@gmail.com':    'Bruno',
  'loz.magdalena@gmail.com':     'Male',
  'veronicasandler@hotmail.com': 'Vero'
};
async function restringirSiSoloLoMio(){
  try {
    const { data: { user } } = await sb.auth.getUser();
    if (!user || !user.email) return;
    const email = user.email.toLowerCase().trim();
    const { data: persona } = await sb.from('personas')
      .select('id').ilike('email', email).maybeSingle();
    if (!persona) return;
    const { data: perm } = await sb.from('permisos_equipo')
      .select('solo_lo_mio').eq('persona_id', persona.id).maybeSingle();
    if (perm && perm.solo_lo_mio === true) {
      const nombre = EMAIL_A_NOMBRE_LIQ[email] || null;
      if (nombre) {
        window._soloLoMioLiq = true;   // marca: traer SOLO lo que lo involucra (no bajar datos del resto)
        const sel = document.getElementById('filtroProf');
        sel.value = nombre;        // fija a su nombre
        sel.disabled = true;        // no puede cambiarlo
        // Por las dudas: dejar solo su opción visible
        Array.from(sel.options).forEach(o => {
          if (o.value && o.value !== nombre) o.style.display = 'none';
        });
      }
    }
  } catch (e) {
    console.warn('No se pudo restringir liquidación (se muestra todo):', e.message);
  }
}
