<script>
const SUPABASE_URL = 'https://bqpjtoiictnzcasxfucf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_yvuXDxrkRrhXwmZBnE_a_Q_zDBz0iDi';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { lock: (name, acquireTimeout, fn) => fn() } });

// ============================================================
// LEER UNA CONSULTA COMPLETA (29/7/26)
// OJO: Supabase corta en 1000 filas por lectura y ese tope MANDA por
// encima del .limit() que pidas — un .limit(5000) igual devuelve 1000.
// Cuando pasa no hay error: simplemente faltan filas, y en esta pantalla
// eso significa liquidar de menos.
// Se le pasa una FUNCIÓN QUE ARMA LA QUERY DE CERO (no el objeto ya armado:
// los builders de supabase-js se mutan, y reusar el mismo iría apilando
// parámetros en cada página). La query debe traer orden determinista.
// ============================================================
async function sbLeerTodo(armarQuery) {
  const PAGE = 1000;
  let desde = 0;
  let todo = [];
  for (let i = 0; i < 50; i++) {          // tope de seguridad: 50.000 filas
    const { data, error } = await armarQuery().range(desde, desde + PAGE - 1);
    if (error) return { data: null, error };
    todo = todo.concat(data || []);
    if (!data || data.length < PAGE) break;
    desde += PAGE;
  }
  return { data: todo, error: null };
}

const fmt = n => '$' + (Number(n)||0).toLocaleString('es-AR',{maximumFractionDigits:0});
const fmtNum = n => (Number(n)||0).toLocaleString('es-AR');
const badge = (prof) => {
  const cls = {'Bruno':'bruno','Male':'male','Vero':'vero','Jime':'jime','Lu':'lu'}[prof] || 'bruno';
  return `<span class="badge badge-${cls}">${prof}</span>`;
};

let DATA = null; // guarda los pagos crudos para detalles + export

// Normaliza nombre de profesional/cobrador (sin tildes, mayúsculas)
function normProf(txt){
  const t = String(txt||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,'');
  if (t === 'puntobio' || t === 'punto bio' || t === 'punto-bio') return 'PuntoBiO';
  const map = {'bruno':'Bruno','male':'Male','vero':'Vero','jime':'Jime','lu':'Lu'};
  return map[t] || (txt ? String(txt).trim() : '');
}
// Masoterapia se liquida POR PAGO, y hasta ahora el dueno del masaje salia del
// campo `profesional` DEL PAGO. Ese campo lo llena la caja y a veces queda en 'Lu'
// (resto del modelo viejo) -> el masaje caia en la liquidacion equivocada y, como
// Lu es 100% centro, el profesional se quedaba sin su parte.
// Ahora manda QUIEN LO ATENDIO, que es lo que ya dice la sesion estampada.
function mapaProfPorTratamiento(sesAll){
  const m = {};
  for (const s of (sesAll || [])){
    const tid = s.tratamiento_id, pr = normProf(s.profesional);
    if (tid == null || !pr || m[tid]) continue;
    m[tid] = pr;
  }
  return m;
}

// ================= MOPLEX =================
// MOPLEX empezó a facturar en junio 2026 (abril/mayo no cuentan: van en $0).
const MOPLEX_FACTURA_DESDE = '2026-06';
function moplexFacturable(fecha){ return String(fecha||'').slice(0,7) >= MOPLEX_FACTURA_DESDE; }

// Mismas fórmulas que consultas_moplex.html (fuente de verdad del reparto)
function calcConsultaMoplex(c){
  if(!c) return null;
  const precio = Number(c.precio_paciente)||0;
  const moplex = Number(c.costo_moplex)||0;
  const prof   = Math.round(precio * (Number(c.pct_profesional)||0)/100);   // % sobre el precio al paciente
  const centro = precio - moplex - prof;
  return { precio, moplex, prof, centro };
}
function calcPlantillaMoplex(p, rectif, montoCustom){
  if(!p) return null;
  if(rectif){
    const precio = (Number(montoCustom) > 0) ? Number(montoCustom) : Math.round((Number(p.precio_paciente)||0)/2);
    const moplex = Math.round(precio*0.85);
    const prof   = 0;
    const centro = precio - moplex;                                 // 15%
    return { precio, moplex, prof, centro, rectif:true };
  }
  const precio = Number(p.precio_paciente)||0;
  const moplex = Number(p.costo_moplex)||0;
  const prof   = Math.round(precio * (Number(p.pct_profesional)||0)/100);   // 10% del precio al paciente
  const centro = precio - moplex - prof;
  return { precio, moplex, prof, centro, rectif:false };
}
// Reparte 'portion' pesos de un componente (evaluación o plantilla)
function splitPortionMoplex(rep, portion, fact){
  if (!rep || !rep.precio) return { prof:0, moplex:0, centro:portion };
  if (!fact) return { prof:0, moplex:0, centro:portion };   // pre-junio: no factura
  const fr = portion / rep.precio;
  const prof   = Math.round(rep.prof   * fr);
  const moplex = Math.round(rep.moplex * fr);
  const centro = portion - prof - moplex;
  return { prof, moplex, centro };
}

// Recalcula el split de los cobros MOPLEX leyendo el tratamiento + catálogo,
// pisando lo que la caja guardó mal. AGRUPA por tratamiento y lleva un "presupuesto"
// de lo que falta cobrar de la evaluación y de la plantilla. Cada cuota se identifica
// como consulta o plantilla y se le aplica su % (consulta 40%, plantilla 10%, rectif 0%),
// sin contar la evaluación dos veces cuando se paga en varias cuotas.
function prepararMoplex(monthPagos){
  const byId = (window._moplexCat && window._moplexCat.byId) || {};
  const prevPagos = window._moplexPrevPagos || [];   // cuotas de meses ANTERIORES (para no recontar la consulta)
  const desde = window._moplexDesde || '';           // primer día del mes liquidado (YYYY-MM-01)
  const out = { detalle:{}, franquicia:[], sinTipo:[], totalMoplex:0 };
  const cerca = (a,b)=> Math.abs(a-b) < 1;
  const esMoplex = (p)=> (((p.tratamientos||{}).practica_codigo)||'') === 'MOPLEX';
  const keyTid = (p)=> (p.tratamiento_id != null) ? ('t'+p.tratamiento_id) : ('p'+p.id);
  const enMes = (p)=> !desde || String(p.fecha||'') >= desde;   // ¿es una cuota del mes que estoy liquidando?

  // 1) Agrupar los cobros MOPLEX del MES por tratamiento (un tratamiento = varias cuotas posibles)
  const grupos = {};
  for (const p of monthPagos){
    if (!esMoplex(p)) continue;
    const tid = keyTid(p);
    (grupos[tid] = grupos[tid] || []).push(p);
  }
  // 1b) Cuotas de meses ANTERIORES de esos mismos tratamientos: NO se liquidan de nuevo,
  //     pero se consumen primero para arrancar con el presupuesto correcto de la evaluación.
  const previos = {};
  for (const p of prevPagos){
    const tid = keyTid(p);
    if (!grupos[tid]) continue;      // solo tratamientos con actividad este mes
    (previos[tid] = previos[tid] || []).push(p);
  }

  // 2) Repartir cada grupo (tratamiento)
  for (const tid of Object.keys(grupos)){
    const delMes = grupos[tid].slice();
    // TODAS las cuotas (anteriores + del mes) ordenadas por fecha: primero se cubre lo viejo
    const pagos = (previos[tid]||[]).concat(delMes)
      .sort((a,b)=> (String(a.fecha||'')).localeCompare(String(b.fecha||'')) || ((a.id||0)-(b.id||0)));
    const p0 = delMes[0];               // referencia del MES (profesional, fecha y tratId salen de acá)
    const t  = p0.tratamientos || {};
    const fact = moplexFacturable(p0.fecha);
    const evalItem  = byId[t.moplex_consulta_id];
    const plantItem = (t.solicita_plantillas && t.moplex_plantilla_id) ? byId[t.moplex_plantilla_id] : null;
    const rectif    = !!t.moplex_plantilla_rectif;
    const evalRep   = evalItem  ? calcConsultaMoplex(evalItem)          : null;
    const plantRep  = plantItem ? calcPlantillaMoplex(plantItem, rectif, Number(t.moplex_rectif_monto)||0) : null;
    const paciente = (t.personas && t.personas.nombre) || '—';
    const prof     = normProf(p0.profesional);

    // Sin tipo asignado → no se puede repartir bien
    if (!evalRep && !plantRep){
      const totalPaid = delMes.reduce((s,p)=> s + (Number(p.importe)||0), 0);
      out.sinTipo.push({ fecha:p0.fecha, paciente, prof, importe:totalPaid, tratId:p0.tratamiento_id });
      for (const p of delMes){ p._moplexInfo = { sinTipo:true }; p.monto_profesional = 0; p.monto_centro = Number(p.importe)||0; p._monto_moplex = 0; }
      continue;
    }

    // Presupuesto restante de cada componente (para no cobrar la evaluación dos veces)
    let evalRem  = evalRep  ? evalRep.precio  : 0;
    let plantRem = plantRep ? plantRep.precio : 0;
    // Acumuladores a nivel tratamiento (para el detalle y la franquicia)
    let evalCob=0, evalProf=0, evalCentro=0;
    let plantCob=0, plantProf=0, plantCentro=0, plantMoplex=0;

    for (const p of pagos){
      const importe = Number(p.importe)||0;
      let evalPortion=0, plantPortion=0;
      // Identificar a qué componente corresponde esta cuota (contra lo que FALTA de cada uno)
      if      (evalRem>0.5 && cerca(importe, evalRem))                 { evalPortion=importe; }                       // paga justo la consulta
      else if (plantRem>0.5 && cerca(importe, plantRem))              { plantPortion=importe; }                      // paga justo la plantilla
      else if (evalRem>0.5 && plantRem>0.5 && cerca(importe, evalRem+plantRem)) { evalPortion=evalRem; plantPortion=plantRem; } // paga las dos juntas
      else { // cascada: primero cubre la consulta, después la plantilla
        evalPortion  = Math.min(importe, Math.max(evalRem,0));
        let resto    = importe - evalPortion;
        plantPortion = Math.min(resto, Math.max(plantRem,0));
      }
      evalRem  -= evalPortion;
      plantRem -= plantPortion;
      const leftover = importe - evalPortion - plantPortion;

      const se = splitPortionMoplex(evalRep,  evalPortion,  fact);
      const sp = splitPortionMoplex(plantRep, plantPortion, fact);

      // Solo las cuotas del MES entran en la liquidación (y se les pisa el split).
      // Las de meses anteriores ya consumieron su presupuesto arriba: no se recuentan.
      if (!enMes(p)) continue;

      p.monto_profesional = se.prof + sp.prof;
      p.monto_centro      = se.centro + sp.centro + (leftover>0?leftover:0);
      p._monto_moplex     = se.moplex + sp.moplex;
      p._moplexInfo       = { evalPortion, plantPortion };

      evalCob+=evalPortion;   evalProf+=se.prof;   evalCentro+=se.centro;
      plantCob+=plantPortion; plantProf+=sp.prof;  plantCentro+=sp.centro;  plantMoplex+=sp.moplex;
    }

    // Detalle por profesional + franquicia — una línea eval / una plantilla (a nivel tratamiento)
    if (evalCob > 0.5){
      const lbl = 'MOPLEX · Eval. — ' + ((evalItem&&evalItem.nombre)||'');
      const k = prof + '||' + lbl;
      if(!out.detalle[k]) out.detalle[k] = {prof, prac:lbl, cobrado:0, mProf:0, centro:0};
      out.detalle[k].cobrado += evalCob; out.detalle[k].mProf += evalProf; out.detalle[k].centro += evalCentro;
      out.franquicia.push({ tratId:p0.tratamiento_id, fecha:p0.fecha, paciente, prof, tipo:'Evaluación', desc:(evalItem&&evalItem.nombre)||'', montoMoplex:0 });
    }
    if (plantCob > 0.5){
      const lbl = 'MOPLEX · Plantilla — ' + ((rectif?'Rectif. ':'')+((plantItem&&plantItem.nombre)||''));
      const k = prof + '||' + lbl;
      if(!out.detalle[k]) out.detalle[k] = {prof, prac:lbl, cobrado:0, mProf:0, centro:0};
      out.detalle[k].cobrado += plantCob; out.detalle[k].mProf += plantProf; out.detalle[k].centro += plantCentro;
      out.franquicia.push({ tratId:p0.tratamiento_id, fecha:p0.fecha, paciente, prof, tipo:'Plantilla', desc:(rectif?'Rectif. ':'')+((plantItem&&plantItem.nombre)||''), montoMoplex:plantMoplex });
      out.totalMoplex += plantMoplex;
    }
  }
  return out;
}

async function cargar(){
  const mes = document.getElementById('mes').value; // "2026-05"
  const filtroProf = document.getElementById('filtroProf').value;
  document.getElementById('resultado').innerHTML = '<div class="loading">⏳ Cargando pagos...</div>';

  const [year, month] = mes.split('-');
  const desde = `${year}-${month}-01`;
  const hasta = new Date(year, parseInt(month), 0).toISOString().split('T')[0]; // último día del mes

  // Traemos pagos del mes con su tratamiento y persona
  // 29/7/26 — se arma en una FUNCIÓN para poder paginarla: cada página
  // necesita un builder nuevo (los de supabase-js se mutan al encadenar).
  const armarQPagos = () => {
    let qq = sb.from('pagos_consultorio')
      .select(`
        id, fecha, importe, medio_pago, profesional, quien_cobro, tipo_cobro,
        monto_centro, monto_profesional, monto_moplex, tratamiento_id,
        tratamientos (
          id, codigo_id, practica_codigo, modalidad, obra_social, tipo_cobro,
          moplex_consulta_id, moplex_plantilla_id, moplex_plantilla_rectif, moplex_rectif_monto, solicita_plantillas,
          personas ( id, nombre )
        )
      `)
      .gte('fecha', desde)
      .lte('fecha', hasta);
    if (filtroProf && window._soloLoMioLiq) {
      qq = qq.or(`profesional.eq.${filtroProf},quien_cobro.eq.${filtroProf}`);
    }
    return qq.order('fecha').order('id', { ascending: true });
  };

  // Para que los CRUCES salgan completos hay que mirar TODO el mes (un cruce involucra a dos personas).
  // - Admin (sin restricción): traemos todo el mes y filtramos la VISTA en JS. Los números de cada profe no cambian,
  //   pero los cruces se calculan sobre el panorama completo (correcto).
  // - Profesional con "solo lo mío": NO le bajamos datos del resto. Traemos solo lo que lo involucra (atendió O cobró).
  // (si es admin con un profesional elegido, NO filtramos en la consulta: se filtra en render con `filtroProf`)

  const { data: dataCruda, error } = await sbLeerTodo(armarQPagos);
  if (error) {
    document.getElementById('resultado').innerHTML = `<div class="empty">❌ Error: ${error.message}</div>`;
    return;
  }
  // MOPLEX SE LIQUIDA APARTE (5/8/26): sus cobros se excluyen de ESTA pantalla
  // por completo (totales, plata física, cruces y resumen final). Ver la pantalla
  // "Liquidaciones MOPLEX" dentro de BioLab.
  const data = (dataCruda || []).filter(p => (((p.tratamientos||{}).practica_codigo)||'') !== 'MOPLEX');

  // ===== MASAJES DE REGALO (cumpleaños) del mes =====
  // El paciente no paga nada, así que NO hay fila en pagos_consultorio y el
  // tratamiento no entraría nunca a esta pantalla. Pero la sesión SÍ existe
  // (la creó el trigger al marcar PRESENTE) con la parte de Vero, que la
  // asume PuntoBiO. Las traemos aparte para mostrarlas y sumarlas a lo que
  // PB le debe al profesional.
  let regalosMes = [];
  try {
    // Los regalos se reconocen por DOS caminos, porque conviven dos modelos:
    //  · viejo: eran una PRÁCTICA (MASAJES_R)
    //  · nuevo (30/08/26): son una forma de COBRAR (REGALO_CUMPLE / REGALO_CENTRO)
    //    sobre el masaje real, así no se pierde qué masaje se hizo.
    let qR = sb.from('sesiones')
      .select('fecha, profesional, monto_profesional, tratamiento_id, tratamientos!inner(codigo_id, practica_codigo, tipo_cobro, personas(nombre))')
      .gte('fecha', desde)
      .lte('fecha', hasta)
      .or('practica_codigo.eq.MASAJES_R,tipo_cobro.in.(REGALO_CUMPLE,REGALO_CENTRO)', { foreignTable: 'tratamientos' })
      .order('fecha');
    if (filtroProf && window._soloLoMioLiq) qR = qR.ilike('profesional', '%' + filtroProf + '%');
    const { data: regData } = await qR;
    regalosMes = regData || [];
  } catch (e) {
    console.warn('No se pudieron cargar los masajes de regalo:', e.message);
  }
  // Un REGALO, por definición, no tiene pago del paciente. Si aparece uno con plata
  // cobrada, es que está mal clasificado: se estaría contando dos veces (el profesional
  // se queda con lo que cobró Y además PuntoBiO le debe lo mismo otra vez).
  // No se descuenta solo: se marca para que se corrija el tratamiento.
  const tratConPago = new Set((dataCruda || [])
    .filter(p => (Number(p.importe) || 0) > 0.5)
    .map(p => p.tratamiento_id).filter(x => x != null));
  regalosMes = (regalosMes || []).map(s => ({ ...s, tienePago: tratConPago.has(s.tratamiento_id) }));
  window._regalosMes = regalosMes;

  // ===== MOTOR "TRABAJADO Y ABONADO" =====
  // Regla: una sesión se liquida cuando está REALIZADA y ABONADA.
  //  - Realizada sin abonar → pasa a la próxima liquidación (se paga cuando el paciente abone).
  //  - Abonada por adelantado → la plata queda en custodia de quien la recibió y se va
  //    liquidando a medida que los profesionales hacen las sesiones.
  // Para saberlo hay que mirar la historia COMPLETA de cada tratamiento involucrado:
  //  - tratamientos con PAGOS este mes (pueden cubrir sesiones viejas), y
  //  - tratamientos con SESIONES este mes (pueden estar ya pagas de antes).
  const tratIdsPagos = [...new Set((data || []).map(p => p.tratamiento_id).filter(x => x != null))];
  let tratIdsSes = [];
  try {
    const { data: sesMes } = await sbLeerTodo(() => sb.from('sesiones')
      .select('id, tratamiento_id').gte('fecha', desde).lte('fecha', hasta)
      .order('id', { ascending: true }));
    tratIdsSes = [...new Set((sesMes || []).map(x => x.tratamiento_id).filter(x => x != null))];
  } catch (e) { console.warn('No se pudieron leer las sesiones del mes:', e.message); }
  const tratIds = [...new Set([...tratIdsPagos, ...tratIdsSes])];

  if ((!data || data.length === 0) && regalosMes.length === 0 && tratIds.length === 0) {
    document.getElementById('resultado').innerHTML = `<div class="empty">📭 Sin movimientos en ${mes}</div>`;
    return;
  }

  // Historia completa (sesiones + pagos) de esos tratamientos, en lotes para no pasarnos de la URL
  let sesAll = [], pagosAll = [];
  for (let i = 0; i < tratIds.length; i += 150){
    const lote = tratIds.slice(i, i + 150);
    const { data: sesData } = await sbLeerTodo(() => sb.from('sesiones')
      .select('id, tratamiento_id, fecha, profesional, monto_profesional, monto_centro, tratamientos(codigo_id, practica_codigo, personas(nombre))')
      .in('tratamiento_id', lote).order('fecha').order('id'));
    if (sesData) sesAll.push(...sesData);
    const { data: pagData } = await sbLeerTodo(() => sb.from('pagos_consultorio')
      .select('id, tratamiento_id, fecha, importe, quien_cobro, medio_pago')
      .in('tratamiento_id', lote).order('fecha').order('id'));
    if (pagData) pagosAll.push(...pagData);
  }
  const sesionesData = sesAll;
  window._liqMotor = { sesAll, pagosAll, desde, hasta };

  DATA = data || [];

  // ===== PAGOS DE OBRAS SOCIALES (informativo, no afecta el cálculo) =====
  // Se filtran por la FECHA DE PAGO (cuándo entró a la cuenta del profesional),
  // y si hay filtro de profesional, por ese profesional.
  // El "mes al que corresponde" es solo un dato informativo, no se usa para filtrar.
  let pagosOS = [];
  try {
    let qOS = sb.from('pagos_obras_sociales')
      .select('obra_social, monto, fecha, mes_correspondiente, profesional_nombre')
      .gte('fecha', desde)
      .lte('fecha', hasta)
      .order('fecha');
    // Si está fijado un profesional (incluye el caso "solo lo mío"), filtrar por su nombre
    const profSel = document.getElementById('filtroProf').value;
    if (profSel) qOS = qOS.ilike('profesional_nombre', '%' + profSel + '%');
    const { data: osData } = await qOS;
    pagosOS = osData || [];
  } catch (e) {
    console.warn('No se pudieron cargar pagos OS:', e.message);
  }
  window._pagosOS = pagosOS;

  // ===== MOPLEX: catálogo (montos fijos) + estados de saldo con la franquicia =====
  try {
    const { data: cat } = await sb.from('moplex_catalogo').select('*');
    const byId = {}; (cat||[]).forEach(c=>{ byId[c.id] = c; });
    window._moplexCat = { byId };
  } catch (e) {
    window._moplexCat = { byId:{} };
    console.warn('No se pudo cargar moplex_catalogo:', e.message);
  }
  try {
    const moplexTratIds = [...new Set((data||[])
      .filter(p => ((p.tratamientos||{}).practica_codigo||'') === 'MOPLEX')
      .map(p => p.tratamiento_id).filter(x => x != null))];
    window._moplexSaldos = {};
    if (moplexTratIds.length){
      const { data: sal } = await sb.from('moplex_franquicia_saldos')
        .select('tratamiento_id, saldado').in('tratamiento_id', moplexTratIds);
      (sal||[]).forEach(r => { window._moplexSaldos[r.tratamiento_id] = !!r.saldado; });
    }
  } catch (e) {
    window._moplexSaldos = {};
    console.warn('No se pudieron cargar saldos MOPLEX (falta tabla moplex_franquicia_saldos?):', e.message);
  }

  // ===== MOPLEX: cuotas de MESES ANTERIORES de los tratamientos con actividad este mes =====
  // Necesario para NO volver a contar la evaluación cuando una cuota de la plantilla se paga
  // en un mes posterior al de la consulta. Se consumen primero al repartir (ver prepararMoplex).
  window._moplexDesde = desde;
  window._moplexPrevPagos = [];
  try {
    const mopTratIds = [...new Set((data||[])
      .filter(p => ((p.tratamientos||{}).practica_codigo||'') === 'MOPLEX')
      .map(p => p.tratamiento_id).filter(x => x != null))];
    if (mopTratIds.length){
      const { data: prev } = await sbLeerTodo(() => sb.from('pagos_consultorio')
        .select(`
          id, fecha, importe, profesional, tratamiento_id,
          tratamientos (
            id, practica_codigo,
            moplex_consulta_id, moplex_plantilla_id, moplex_plantilla_rectif, moplex_rectif_monto, solicita_plantillas,
            personas ( id, nombre )
          )
        `)
        .in('tratamiento_id', mopTratIds)
        .lt('fecha', desde)
        .order('fecha').order('id', { ascending: true }));
      window._moplexPrevPagos = prev || [];
    }
  } catch (e) {
    window._moplexPrevPagos = [];
    console.warn('No se pudieron cargar cuotas MOPLEX de meses anteriores:', e.message);
  }

  // ===== MOPLEX: TODAS las consultas del mes (por fecha de consulta) — SOLO INFORMATIVO =====
  // Fuente igual que "Consultas MOPLEX": tratamientos + sesiones + turnos_biolab + catálogo.
  // Lista todas las consultas del mes aunque sean $0 o estén sin cobrar, para que no falte nadie.
  // ⚠️ NO cambia los totales de la liquidación: esos siguen saliendo de lo efectivamente cobrado.
  window._moplexConsultasMes = [];
  if (false) {   // MOPLEX se liquida aparte (5/8/26): este bloque se mudó a liquidaciones_moplex.html
    try {
      const { data: mopTtos } = await sb.from('tratamientos')
        .select('id, codigo_id, persona_id, fecha_alta, profesional, solicita_plantillas, moplex_consulta_id, moplex_plantilla_id, moplex_plantilla_rectif, moplex_rectif_monto')
        .eq('practica_codigo','MOPLEX');
      const ttos = mopTtos || [];
      if (ttos.length){
        const ttoIds  = ttos.map(t=>t.id);
        const codigos = [...new Set(ttos.map(t=>t.codigo_id).filter(Boolean))];
        const persIds = [...new Set(ttos.map(t=>t.persona_id).filter(Boolean))];

        // fecha real + profesional desde SESIONES
        const fechaSesion = {}, profSesion = {}, bestSes = {};
        if (ttoIds.length){
          const { data: ses } = await sb.from('sesiones').select('tratamiento_id, profesional, fecha').in('tratamiento_id', ttoIds);
          (ses||[]).forEach(r=>{
            const k=r.tratamiento_id, f=r.fecha||'';
            if (f && (!fechaSesion[k] || f>fechaSesion[k])) fechaSesion[k]=f;
            if (r.profesional && (!bestSes[k] || f>bestSes[k].key)) bestSes[k]={key:f, prof:r.profesional};
          });
          Object.keys(bestSes).forEach(k=> profSesion[k]=normProf(bestSes[k].prof));
        }
        // fallback: TURNOS BIOLAB (su columna tratamiento_id guarda el codigo_id)
        const fechaTurno = {}, profTurno = {}, bestT = {};
        if (codigos.length){
          const { data: tb } = await sb.from('turnos_biolab').select('tratamiento_id, profesional, fecha, hora_inicio').in('tratamiento_id', codigos).neq('estado','CANCELADO');
          (tb||[]).forEach(r=>{
            const k=r.tratamiento_id, key=(r.fecha||'')+(r.hora_inicio||'');
            if (!bestT[k] || key>bestT[k].key) bestT[k]={key, prof:r.profesional, fecha:r.fecha||''};
          });
          Object.keys(bestT).forEach(k=>{ profTurno[k]=normProf(bestT[k].prof); if(bestT[k].fecha) fechaTurno[k]=bestT[k].fecha; });
        }
        // nombres
        const nombres = {};
        if (persIds.length){
          const { data: per } = await sb.from('personas').select('id, nombre').in('id', persIds);
          (per||[]).forEach(p=> nombres[p.id]=p.nombre);
        }

        const byId = (window._moplexCat && window._moplexCat.byId) || {};
        const scale = (m, fact) => (m && fact) ? m : { precio:0, moplex:0, prof:0, centro:0 };
        const lista = [];
        for (const t of ttos){
          const fc = fechaSesion[t.id] || fechaTurno[t.codigo_id] || t.fecha_alta || '';
          if (String(fc).slice(0,7) !== mes) continue;   // solo consultas de ESTE mes
          const fact = moplexFacturable(fc);
          const evalRep  = t.moplex_consulta_id ? calcConsultaMoplex(byId[t.moplex_consulta_id]) : null;
          const rectif   = !!t.moplex_plantilla_rectif;
          const plantRep = (t.solicita_plantillas && t.moplex_plantilla_id) ? calcPlantillaMoplex(byId[t.moplex_plantilla_id], rectif, Number(t.moplex_rectif_monto)||0) : null;
          const ev = scale(evalRep, fact), pl = scale(plantRep, fact);
          const precio = (ev.precio||0) + (pl.precio||0);
          lista.push({
            tratId: t.id, fecha: fc, paciente: nombres[t.persona_id] || '—',
            prof: normProf(t.profesional) || profSesion[t.id] || profTurno[t.codigo_id] || '',
            consultaNombre: (byId[t.moplex_consulta_id]||{}).nombre || '—',
            plantillaNombre: plantRep ? ((rectif?'Rectif. ':'') + ((byId[t.moplex_plantilla_id]||{}).nombre||'')) : '',
            precio, prof_monto: (ev.prof||0)+(pl.prof||0), centro: (ev.centro||0)+(pl.centro||0), moplex: (ev.moplex||0)+(pl.moplex||0),
            gratis: (precio <= 0.5), cobrado: false
          });
        }
        // ¿está cobrado? (busca pagos de estos tratamientos, de cualquier fecha)
        const listIds = lista.map(x=>x.tratId);
        if (listIds.length){
          const { data: pagQ } = await sbLeerTodo(() => sb.from('pagos_consultorio')
            .select('id, tratamiento_id, importe').in('tratamiento_id', listIds)
            .order('id', { ascending: true }));
          const cobradoSet = new Set((pagQ||[]).filter(p=> Number(p.importe)>0).map(p=>p.tratamiento_id));
          lista.forEach(x=> x.cobrado = cobradoSet.has(x.tratId));
        }
        lista.sort((a,b)=> (a.fecha||'').localeCompare(b.fecha||''));
        window._moplexConsultasMes = lista;
      }
    } catch (e) {
      window._moplexConsultasMes = [];
      console.warn('No se pudieron cargar las consultas MOPLEX del mes:', e.message);
    }
  }

  render(data || [], sesionesData, filtroProf);
}

// ============================================================
// VISTA NUEVA (rediseño 05/08/2026) — por profesional, con custodia y cruces
// IMPORTANTE: no cambia ningún cálculo. Se arma con lo mismo que ya calcula
// el motor (liquidables/pendientes/pagos) y solo lo MUESTRA de otra forma.
// La vista anterior queda debajo, plegada, para poder comparar.
// ============================================================
const MEDIO_NOM = m => {
  const s = String(m||'').toUpperCase();
  if (s.includes('DEBITO') || s.includes('DÉBITO')) return 'Débito';
  if (s.includes('TRANSFER')) return 'Transferencia';
  if (s.includes('EFECTIVO')) return 'Efectivo';
  return 'Otro';
};
// REGLA DE TENENCIA (planilla de Jime): el efectivo se rinde a la caja de
// PuntoBiO y el débito nunca sale de ahí. Lo único que queda en manos del
// profesional es la transferencia que el paciente le hace directo.
function tenedorDe(medio, quien){
  return String(medio||'').toUpperCase().includes('TRANSFER') ? (quien || 'PuntoBiO') : 'PuntoBiO';
}

function vistaNueva(ctx){
  const { liquidables, pendientes, pagos, MT, hasta, filtroProf, mesViejo } = ctx;
  const ORDEN_P = ['Bruno','Male','Vero','Jime','Lu'];
  const chipT = p => (p === 'PuntoBiO')
    ? '<span class="badge nv-pb">PuntoBiO</span>' : badge(p);
  const ord = arr => arr.sort((a,b) => {
    const ia = ORDEN_P.indexOf(a), ib = ORDEN_P.indexOf(b);
    return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
  });

  // ---------- matriz: quién TIENE la plata → de quién ES ----------
  const tiene = {};
  const meter = (t, d, m) => { if (!(m > 0.5)) return; (tiene[t] = tiene[t] || {})[d] = (tiene[t][d] || 0) + m; };
  const P = {};
  const needP = p => P[p] = P[p] || { ses:0, abonado:0, prof:0, centro:0, pendSes:0, pend:0, medios:{}, filas:[] };

  for (const s of liquidables){
    if (!s.prof) continue;
    const r = needP(s.prof);
    r.ses++; r.abonado += s.valor; r.prof += s.mProf; r.centro += s.mCentro; r.filas.push(s);
    const tot = s.valor || 1;
    for (const tr of (s.tenedores || [])){
      const share = tr.monto / tot;
      const ten = tenedorDe(tr.medio, tr.quien);
      meter(ten, s.prof, s.mProf * share);
      meter(ten, 'PuntoBiO', s.mCentro * share);
      const k = MEDIO_NOM(tr.medio);
      const mm = r.medios[k] = r.medios[k] || { monto:0, porTen:{} };
      mm.monto += s.mProf * share;
      mm.porTen[ten] = (mm.porTen[ten] || 0) + s.mProf * share;
    }
  }
  // MASOTERAPIA: liquida por PAGO (no entra en la cascada de sesiones)
  const profMasoNv = mapaProfPorTratamiento(MT.sesAll);
  for (const p of pagos){
    const pc = String((p.tratamientos || {}).practica_codigo || '');
    if (!pc.startsWith('MASAJES') || pc === 'MASAJES_R' || pc === 'MASAJES_CERO') continue;
    if (esRegaloNuevo(p)) continue;   // regalo: no lo paga el paciente, va en su bloque
    const imp = Number(p.importe) || 0; if (imp <= 0.5) continue;
    const prof = profDeMaso(p, profMasoNv);
    const cobraPct = ['Bruno','Male','Vero'].includes(prof);
    const mProf = !cobraPct ? 0 : (esBonifCentro(p) ? imp : Math.round(imp * 0.65));
    const mCentro = imp - mProf;
    const r = needP(prof);
    r.ses++; r.abonado += imp; r.prof += mProf; r.centro += mCentro;
    const quien = String(p.quien_cobro || 'PuntoBiO').split('(')[0].trim() || 'PuntoBiO';
    const ten = tenedorDe(p.medio_pago, quien);
    meter(ten, prof, mProf); meter(ten, 'PuntoBiO', mCentro);
    const k = MEDIO_NOM(p.medio_pago);
    const mm = r.medios[k] = r.medios[k] || { monto:0, porTen:{} };
    mm.monto += mProf; mm.porTen[ten] = (mm.porTen[ten] || 0) + mProf;
    r.filas.push({ fecha:p.fecha, paciente:((p.tratamientos||{}).personas||{}).nombre || '—',
                   practica:pc, valor:imp, mProf, mCentro, tenedores:[{quien, monto:imp, medio:p.medio_pago}] });
  }
  for (const x of (pendientes || [])){ if (!x.prof) continue; const r = needP(x.prof); r.pendSes++; r.pend += x.valor; }

  // ---------- CUSTODIA: plata cobrada de sesiones que todavía no se hicieron ----------
  const info = {};
  for (const s of (MT.sesAll || [])){
    const t = s.tratamientos || {}; if (s.tratamiento_id == null) continue;
    info[s.tratamiento_id] = info[s.tratamiento_id] || { cod:t.codigo_id || '—', prac:t.practica_codigo || '', pac:((t.personas||{}).nombre) || '—' };
  }
  for (const p of pagos){
    const t = p.tratamientos || {}; if (p.tratamiento_id == null) continue;
    info[p.tratamiento_id] = info[p.tratamiento_id] || { cod:t.codigo_id || '—', prac:t.practica_codigo || '', pac:((t.personas||{}).nombre) || '—' };
  }
  const sesT = {}, pagT = {};
  for (const s of (MT.sesAll || [])){ if (!s.fecha || s.fecha > hasta || s.tratamiento_id == null) continue; (sesT[s.tratamiento_id] = sesT[s.tratamiento_id] || []).push(s); }
  for (const p of (MT.pagosAll || [])){ if (!p.fecha || p.fecha > hasta || p.tratamiento_id == null) continue; (pagT[p.tratamiento_id] = pagT[p.tratamiento_id] || []).push(p); }
  const custodia = [];
  for (const tid of Object.keys(pagT)){
    const nfo = info[tid] || { cod:'—', prac:'', pac:'—' };
    if (nfo.prac === 'MOPLEX' || String(nfo.prac).startsWith('MASAJES')) continue;
    const pgs = pagT[tid].slice().sort((a,b)=> ((a.fecha||'').localeCompare(b.fecha||'')) || (a.id-b.id));
    const ses = (sesT[tid] || []);
    const pagado = pgs.reduce((x,p)=> x + (Number(p.importe)||0), 0);
    const trabajado = ses.reduce((x,s)=> x + (Number(s.monto_profesional)||0) + (Number(s.monto_centro)||0), 0);
    const sobra = pagado - trabajado;
    if (sobra <= 0.5) continue;
    // los ÚLTIMOS pesos que entraron son los que están en custodia
    let resto = sobra; const porTen = {}; let ultFecha = '';
    for (let i = pgs.length - 1; i >= 0 && resto > 0.5; i--){
      const p = pgs[i], imp = Number(p.importe) || 0, toma = Math.min(imp, resto);
      const quien = String(p.quien_cobro || 'PuntoBiO').split('(')[0].trim() || 'PuntoBiO';
      const ten = tenedorDe(p.medio_pago, quien);
      porTen[ten] = (porTen[ten] || 0) + toma;
      if (!ultFecha) ultFecha = p.fecha;
      resto -= toma;
    }
    const ult = ses[ses.length - 1];
    const pctProf = ult ? ((Number(ult.monto_profesional)||0) / (((Number(ult.monto_profesional)||0) + (Number(ult.monto_centro)||0)) || 1)) : null;
    custodia.push({ tid, cod:nfo.cod, pac:nfo.pac, prac:nfo.prac, monto:sobra, porTen, fecha:ultFecha,
                    profPrev: ult ? normProf(ult.profesional) : '', pctProf });
  }
  custodia.sort((a,b)=> b.monto - a.monto);
  const custTot = custodia.reduce((x,c)=> x + c.monto, 0);
  const custPorTen = {};
  for (const c of custodia) for (const t of Object.keys(c.porTen)) custPorTen[t] = (custPorTen[t] || 0) + c.porTen[t];

  // ---------- CRUCES neteados por par ----------
  const brutos = [];
  for (const t of Object.keys(tiene)) for (const d of Object.keys(tiene[t]))
    if (t !== d && tiene[t][d] > 0.5) brutos.push({ de:t, a:d, monto:tiene[t][d] });
  const netos = [], visto = new Set();
  for (const c of brutos){
    const key = [c.de, c.a].sort().join('|'); if (visto.has(key)) continue; visto.add(key);
    const ida = brutos.filter(x=> x.de===c.de && x.a===c.a).reduce((s,x)=>s+x.monto,0);
    const vta = brutos.filter(x=> x.de===c.a && x.a===c.de).reduce((s,x)=>s+x.monto,0);
    const n = ida - vta; if (Math.abs(n) < 0.5) continue;
    netos.push(n > 0 ? {de:c.de, a:c.a, monto:n} : {de:c.a, a:c.de, monto:-n});
  }

  // ---------- CAJA del mes: quién cobró qué, por medio (plata física) ----------
  const caja = {};
  for (const p of pagos){
    const quien = String(p.quien_cobro || 'PuntoBiO').split('(')[0].trim() || 'PuntoBiO';
    const c = caja[quien] = caja[quien] || { Efectivo:0, Transferencia:0, 'Débito':0, Otro:0, total:0 };
    const imp = Number(p.importe) || 0;
    c[MEDIO_NOM(p.medio_pago)] += imp; c.total += imp;
  }

  // ============================ HTML ============================
  const profsVista = ord(Object.keys(P)).filter(p => !filtroProf || p === filtroProf);
  let h = '<div class="nv">';




  // --- mapa de cruces: SOLO entre profesionales (23/8, pedido de Lu: los cruces
  // contra PuntoBiO salen — eso ya vive en la liquidación de arriba).
  const grupo = (tit, arr, vacio) => `<div class="nv-tit" style="margin-top:14px">${tit}</div>
    ${arr.length ? arr.map(n=>`<div class="nv-cruce"><span>${chipT(n.de)} le debe a ${chipT(n.a)}</span><b>${fmt(n.monto)}</b></div>`).join('')
                 : `<div class="nv-reg">${vacio}</div>`}`;
  const brutosEntre = brutos.filter(b => b.de !== 'PuntoBiO' && b.a !== 'PuntoBiO');
  h += `<h2 class="bloque-tit">🔁 Cruces del mes — entre profesionales</h2>
    <div class="nv-card" style="padding:6px 18px 18px">
      ${grupo('Entre profesionales', netos.filter(n=>n.de!=='PuntoBiO' && n.a!=='PuntoBiO'), 'Ningún cruce entre profesionales este mes.')}
      <details style="margin-top:10px"><summary style="cursor:pointer;color:#1e9fe0;font-weight:700;font-size:13px">Ver de dónde sale cada cruce (antes de netear)</summary>
        <table class="nv-tb" style="margin-top:8px"><thead><tr><th>Tiene la plata</th><th>Es de</th><th class="num">Monto</th></tr></thead>
        <tbody>${brutosEntre.slice().sort((a,b)=>b.monto-a.monto).map(b=>`<tr><td>${chipT(b.de)}</td><td>${chipT(b.a)}</td><td class="num">${fmt(b.monto)}</td></tr>`).join('') || '<tr><td colspan="3" class="nv-reg">Sin cruces entre profesionales.</td></tr>'}</tbody></table>
      </details>
    </div>`;


  // ---------- SESIONES REALIZADAS DEL MES, POR PROFESIONAL (pedido de Lu 10/8) ----------
  // TODO lo trabajado en el mes, esté cobrado o no — para controlar el trabajo de cada
  // uno sesión por sesión. Incluye a Jime y Lu (100% centro), que en los bloques de
  // plata quedan en $0 y su trabajo no se veía en ningún lado. Desplegable por profesional.
  if (filtroProf !== 'MOPLEX'){
    // ESTADO por sesión con imputación "primero el pago del MISMO DÍA, después la
    // más vieja" (10/8, caso Néstor Camacho): la cascada del motor tapa siempre la
    // sesión más vieja y la deuda quedaba colgada en la ÚLTIMA (el 6/8, que SÍ tiene
    // su pago) en vez de en la que de verdad no tiene pago (el 4/8). Esto es SOLO
    // para el cartelito de estado: los montos de la liquidación no cambian.
    const _pagosT = {};
    for (const p of (MT.pagosAll || [])){
      if (p.tratamiento_id == null) continue;
      (_pagosT[p.tratamiento_id] = _pagosT[p.tratamiento_id] || []).push({ fecha: p.fecha || '', resto: Number(p.importe) || 0 });
    }
    const _sesT = {};
    for (const s of (MT.sesAll || [])){
      if (s.tratamiento_id == null || !s.id) continue;
      const tS0 = s.tratamientos || {};
      if ((tS0.practica_codigo || '') === 'MOPLEX' || String(tS0.practica_codigo || '').startsWith('MASAJES')) continue;
      const v = (Number(s.monto_profesional) || 0) + (Number(s.monto_centro) || 0);
      if (v <= 0.5) continue;
      (_sesT[s.tratamiento_id] = _sesT[s.tratamiento_id] || []).push({ id: s.id, fecha: s.fecha || '', need: v });
    }
    const deudaShow = {};   // s.id → lo que le falta cubrir a ESA sesión (para el estado)
    for (const tid of Object.keys(_sesT)){
      const ss = _sesT[tid].slice().sort((a,b)=> a.fecha.localeCompare(b.fecha) || (a.id - b.id));
      const pp = (_pagosT[tid] || []).slice().sort((a,b)=> a.fecha.localeCompare(b.fecha));
      // PASO 1: cada sesión toma primero la plata de SU MISMO DÍA
      for (const s of ss){
        for (const p of pp){
          if (s.need <= 0.5) break;
          if (p.fecha !== s.fecha || p.resto <= 0.5) continue;
          const toma = Math.min(s.need, p.resto); s.need -= toma; p.resto -= toma;
        }
      }
      // PASO 2: lo que sobró tapa lo que falta, de la sesión más vieja a la más nueva
      for (const s of ss){
        for (const p of pp){
          if (s.need <= 0.5) break;
          if (p.resto <= 0.5) continue;
          const toma = Math.min(s.need, p.resto); s.need -= toma; p.resto -= toma;
        }
        if (s.need > 0.5) deudaShow[s.id] = s.need;
      }
    }
    const realizadas = {};
    for (const s of (MT.sesAll || [])){
      if (!s.fecha || s.fecha < MT.desde || s.fecha > hasta) continue;
      const pr = normProf(s.profesional); if (!pr) continue;
      if (filtroProf && pr !== filtroProf) continue;
      const tS = s.tratamientos || {};
      if ((tS.practica_codigo || '') === 'MOPLEX') continue;
      const val = (Number(s.monto_profesional) || 0) + (Number(s.monto_centro) || 0);
      if (val <= 0.5) continue;
      (realizadas[pr] = realizadas[pr] || []).push({
        fecha: s.fecha, paciente: ((tS.personas || {}).nombre) || '—',
        practica: tS.practica_codigo || '', val,
        mp: Number(s.monto_profesional) || 0, mc: Number(s.monto_centro) || 0,
        deuda: deudaShow[s.id] || 0
      });
    }
    h += `<h2 class="bloque-tit">🗓️ Sesiones realizadas en el mes — por profesional</h2>
      <div class="nv-nota" style="margin:-6px 0 10px">Todo lo <b>trabajado</b> del mes, esté cobrado o no — para controlar el trabajo de cada uno. Incluye a quienes son 100% centro (Jime y Lu), que en los bloques de plata figuran en $0.</div>`;
    const profsSes = ord(Object.keys(realizadas));
    if (!profsSes.length) h += `<div class="vacio">Sin sesiones realizadas este mes.</div>`;
    for (const p of profsSes){
      const filas = realizadas[p].slice().sort((a,b)=> (a.fecha||'').localeCompare(b.fecha||'') || a.paciente.localeCompare(b.paciente));
      const tot = filas.reduce((x,f)=> x + f.val, 0);
      const conDeuda = filas.filter(f => f.deuda > 0.5).length;
      h += `<details class="nv-card" style="padding:10px 18px;margin-bottom:10px;">
        <summary style="cursor:pointer;display:flex;align-items:center;gap:10px;font-size:14.5px;">
          ${badge(p)} <b>${filas.length} sesión${filas.length !== 1 ? 'es' : ''}</b>
          <span style="color:#475569;">${fmt(tot)} de producción</span>
          ${conDeuda ? `<span style="color:#92400e;font-weight:700;">⏳ ${conDeuda} sin abonar del todo</span>` : `<span style="color:#065f46;font-weight:700;">✓ todas abonadas</span>`}
        </summary>
        <table class="nv-tb" style="margin-top:10px;"><thead><tr>
          <th>Fecha</th><th>Paciente</th><th>Práctica</th><th class="num">$ Sesión</th>
          <th class="num">Del profe</th><th class="num">Del centro</th><th>Estado</th></tr></thead><tbody>
        ${filas.map(f => {
          const est = !(f.deuda > 0.5)
            ? '<span style="color:#065f46;font-weight:600;">✓ abonada</span>'
            : (f.deuda >= f.val - 0.5
              ? '<span style="color:#92400e;font-weight:600;">⏳ sin abonar</span>'
              : `<span style="color:#b45309;font-weight:600;">parcial · debe ${fmt(f.deuda)}</span>`);
          return `<tr><td>${f.fecha}</td><td>${f.paciente}</td><td>${practicaLabel(f.practica)}</td>
            <td class="num">${fmt(f.val)}</td><td class="num">${fmt(f.mp)}</td><td class="num">${fmt(f.mc)}</td><td>${est}</td></tr>`;
        }).join('')}
        </tbody></table>
      </details>`;
    }
  }

  h += '</div>';
  return h;
}

function render(pagos, sesiones, filtroProf){
  filtroProf = filtroProf || '';
  sesiones = sesiones || [];
  const filtroArea = (document.getElementById('filtroArea') || {}).value || '';
  // MOPLEX es una entidad (no un profesional) a la que el centro le rinde cuentas.
  // - "Todos"      → se ve todo, incluido MOPLEX
  // - "MOPLEX"     → SOLO lo de MOPLEX (la franquicia)
  // - un profesional → SOLO lo de ese profesional (sin la parte de la franquicia)
  const esModoMoplex = (filtroProf === 'MOPLEX');
  const mostrarMoplex = (!filtroProf || esModoMoplex);   // bloques MOPLEX visibles solo en Todos o MOPLEX
  const soloLoMio = !!window._soloLoMioLiq;               // profesional que SOLO puede ver lo suyo (no ve nada del centro)
  // MOPLEX: recalcular el split de cada cobro MOPLEX desde el catálogo (pisa lo que la caja guardó mal).
  // Debe correr ANTES del loop: deja monto_profesional/monto_centro correctos en cada pago MOPLEX.
  const MPX = prepararMoplex(pagos);
  // ===== MOTOR: se liquida lo TRABAJADO y ABONADO =====
  // La atribución sale SIEMPRE de la SESIÓN (quién atendió/evolucionó, con su % ya guardado
  // por la agenda: 65/35 para Bruno/Male/Vero, 100% centro para Jime/Lu). El pago solo dice
  // cuánta plata entró y quién la recibió (quien_cobro). Cobrar no es ser dueño de esa plata.
  const resumen = {};        // por profesional (quien ATENDIÓ las sesiones liquidables)
  const porArea = {};        // ganancia por área (Consultorio / BioLab / Especialidades)
  const porMedio = {};       // plata recibida por medio, por QUIÉN LA RECIBIÓ
  const detalle = {};        // "profesional||practica" → {cobrado, mProf, centro}
  const recibido = {};       // quién recibió → $ recibidos este mes (plata física)
  const pendientes = [];     // sesiones realizadas sin abonar (pasan a la próxima liquidación)
  const liquidables = [];    // sesiones que se liquidan ESTE mes (realizadas y abonadas)
  let totalBruto = 0, totalProf = 0, totalCentro = 0, cantVista = 0, totalMoplexV = 0;

  const MT = window._liqMotor || { sesAll: sesiones, pagosAll: [], desde: '', hasta: '' };
  const desde = MT.desde, hasta = MT.hasta;

  // CORTE DEL MOTOR: hasta junio 2026 se liquidó con el sistema viejo (por pagos cobrados).
  // Todo lo ABONADO antes de esta fecha ya se liquidó en su mes bajo ese sistema — el motor
  // nuevo NO lo vuelve a liquidar aunque las sesiones se hagan después (evita el doble pago,
  // ej. packs de masajes pagados y liquidados en junio cuyas sesiones se hacen en julio).
  // 05/08/2026 — El corte deja de ser fijo. Para julio en adelante sigue siendo
  // el 1/7 (mismos números de siempre, no se toca nada de lo ya pagado). Pero al
  // mirar un mes ANTERIOR, el corte pasa a ser el primer día de ESE mes, así se
  // pueden consultar mayo y junio, que se liquidaron con el criterio viejo.
  const CORTE_BASE = '2026-07-01';
  const CORTE_MOTOR = (desde && desde < CORTE_BASE) ? desde : CORTE_BASE;
  const mesViejo = !!(desde && desde < CORTE_BASE);

  // Práctica de cada tratamiento (para excluir del motor lo que tiene su propia economía)
  const tratPrac = {};
  for (const s of (MT.sesAll || [])){ const t = s.tratamientos || {}; if (s.tratamiento_id != null && t.practica_codigo) tratPrac[s.tratamiento_id] = t.practica_codigo; }
  for (const p of pagos){ const t = p.tratamientos || {}; if (p.tratamiento_id != null && t.practica_codigo) tratPrac[p.tratamiento_id] = t.practica_codigo; }
  const excluidaMotor = pc => pc === 'MOPLEX' || String(pc||'').startsWith('MASAJES');   // maso liquida por PAGO, no por sesiones

  // Historia por tratamiento
  const sesPorTrat = {}, pagosPorTrat = {};
  const abonoProf = {};   // "tratId|fechaAbono" → Set de profes de las sesiones que saldó ese pago
  for (const s of (MT.sesAll || [])){
    const tid = s.tratamiento_id; if (tid == null || excluidaMotor(tratPrac[tid] || '')) continue;
    (sesPorTrat[tid] = sesPorTrat[tid] || []).push(s);
  }
  for (const p of (MT.pagosAll || [])){
    const tid = p.tratamiento_id; if (tid == null || excluidaMotor(tratPrac[tid] || '')) continue;
    (pagosPorTrat[tid] = pagosPorTrat[tid] || []).push(p);
  }

  // Cascada por tratamiento: la plata salda las sesiones en orden, de la más vieja a la
  // más nueva. PRORRATEO (regla de Lu, 29/07/2026): una sesión ya NO necesita estar
  // cubierta entera para liquidarse. Cada tramo de plata que la toca se reparte con el
  // porcentaje de ESA sesión y se liquida en el mes en que quedó realizada Y cobrada;
  // lo que falta cobrar queda como deuda del paciente y se liquida cuando entre.
  for (const tid of Object.keys(sesPorTrat)){
    const ses = sesPorTrat[tid].slice().sort((a,b)=> ((a.fecha||'').localeCompare(b.fecha||'')) || (a.id - b.id));
    const pgs = (pagosPorTrat[tid] || []).slice().sort((a,b)=> ((a.fecha||'').localeCompare(b.fecha||'')) || (a.id - b.id));
    const acum = []; let run = 0;
    for (const p of pgs){
      const desdeCum = run;
      run += Number(p.importe) || 0;
      // `quien` y `desdeCum` son datos NUEVOS: no cambian el calculo de fechaAbono,
      // solo permiten saber que tramo de plata cubrio cada sesion y quien lo cobro.
      acum.push({ fecha: p.fecha, cum: run, desdeCum, quien: String(p.quien_cobro || 'PuntoBiO').split('(')[0].trim() || 'PuntoBiO', medio: String(p.medio_pago || '').toUpperCase() });
    }
    let cumVal = 0;
    for (const s of ses){
      const mProf = Number(s.monto_profesional) || 0, mCentro = Number(s.monto_centro) || 0;
      const valor = mProf + mCentro;
      if (valor <= 0.5) continue;
      cumVal += valor;
      const iniSes = cumVal - valor;

      // Tramos de plata que tocan ESTA sesion: se cruza su tramo [cumVal-valor, cumVal]
      // con el de cada pago. Cada tramo sabe QUIEN cobro esa plata y CUANDO entro.
      const tramos = [];
      for (const a of acum){
        const ini = Math.max(iniSes, a.desdeCum);
        const fin = Math.min(cumVal, a.cum);
        if (fin - ini > 0.5) tramos.push({ fecha: a.fecha, monto: fin - ini, quien: a.quien, medio: a.medio });
      }
      const cubiertoTotal = tramos.reduce((x, tr) => x + tr.monto, 0);
      const deuda = Math.max(0, valor - cubiertoTotal);

      const t = s.tratamientos || {};
      const base = {
        fecha: s.fecha, prof: normProf(s.profesional),
        paciente: ((t.personas || {}).nombre) || '—', codigo: t.codigo_id || '—',
        practica: t.practica_codigo || '', tratId: tid,
        valorSesion: valor, cubiertoTotal, deuda
      };
      if (!base.prof) continue;

      // Cada tramo se liquida en el mes en que la sesion quedo realizada Y cobrada.
      const delMes = []; let huboAntes = false;
      for (const tr of tramos){
        if (tr.fecha < CORTE_MOTOR) continue;                 // ya liquidado con el sistema viejo
        const fLiq = (tr.fecha > (s.fecha || '')) ? tr.fecha : s.fecha;
        if (fLiq < desde){ huboAntes = true; continue; }      // ya liquidado en un mes anterior
        if (fLiq > hasta) continue;                           // liquidara en un mes posterior
        delMes.push(tr);
        const kAb = tid + '|' + tr.fecha;
        (abonoProf[kAb] = abonoProf[kAb] || new Set()).add(base.prof);
      }

      if (delMes.length){
        const cubiertoMes = delMes.reduce((x, tr) => x + tr.monto, 0);
        const parteMes = cubiertoMes / valor;
        liquidables.push(Object.assign({}, base, {
          valor: cubiertoMes,
          mProf: mProf * parteMes,
          mCentro: mCentro * parteMes,
          fechaAbono: delMes[delMes.length - 1].fecha,
          tenedores: delMes.map(tr => ({ quien: tr.quien, monto: tr.monto, medio: tr.medio })),
          parcial: deuda > 0.5,        // el paciente todavia debe parte de esta sesion
          vieneDeDeuda: huboAntes      // ya se le liquido una parte en un mes anterior
        }));
      }

      // Lo que el paciente todavia no pago pasa a la proxima liquidacion (solo el resto).
      if (deuda > 0.5 && (s.fecha || '') <= hasta){
        const parteDeuda = deuda / valor;
        pendientes.push(Object.assign({}, base, {
          valor: deuda,
          mProf: mProf * parteDeuda,
          mCentro: mCentro * parteDeuda,
          fechaAbono: null, tenedores: [],
          parcialmenteCobrada: cubiertoTotal > 0.5
        }));
      }
    }
  }

  // Resumen / detalle / áreas desde las sesiones LIQUIDABLES de este mes
  for (const s of liquidables){
    const prof = s.prof;
    const esVista = !esModoMoplex && (!filtroProf || prof === filtroProf) && (!filtroArea || practicaArea(s.practica) === filtroArea);
    if (!esVista) continue;
    totalBruto += s.valor; totalProf += s.mProf; totalCentro += s.mCentro; cantVista++;
    if (!resumen[prof]) resumen[prof] = {cant:0, bruto:0, prof:0, centro:0, moplex:0, cobroProf:0, cobroPB:0, ses:[], pagos:[]};
    const r = resumen[prof];
    r.cant++; r.bruto += s.valor; r.prof += s.mProf; r.centro += s.mCentro; r.ses.push(s);
    const areaP = practicaArea(s.practica);
    if (!porArea[areaP]) porArea[areaP] = {bruto:0, prof:0, moplex:0, centro:0, cant:0};
    const ar = porArea[areaP];
    ar.cant++; ar.bruto += s.valor; ar.prof += s.mProf; ar.centro += s.mCentro;
    const dk = prof + '||' + practicaLabel(s.practica);
    if (!detalle[dk]) detalle[dk] = {prof, prac: practicaLabel(s.practica), cobrado:0, mProf:0, centro:0};
    detalle[dk].cobrado += s.valor; detalle[dk].mProf += s.mProf; detalle[dk].centro += s.mCentro;
  }

  // MASOTERAPIA: el área es de Vero sola → el pack/masaje se liquida ENTERO en el momento
  // en que se ABONA (no hay que esperar sesiones para atribuirlo, no se comparte con nadie).
  // Los regalos (MASAJES_R) siguen en su módulo aparte; los de junio ya se liquidaron en junio.
  const profMaso = mapaProfPorTratamiento(MT.sesAll);
  for (const p of pagos){
    const pc = String((p.tratamientos || {}).practica_codigo || '');
    if (!pc.startsWith('MASAJES') || pc === 'MASAJES_R' || pc === 'MASAJES_CERO') continue;
    if (esRegaloNuevo(p)) continue;   // regalo: no lo paga el paciente, va en su bloque
    const imp = Number(p.importe) || 0;
    if (imp <= 0.5) continue;
    const prof = profDeMaso(p, profMaso);
    const esVar = ['Bruno','Male','Vero'].includes(prof);
    const mProf = !esVar ? 0 : (esBonifCentro(p) ? imp : Math.round(imp * 0.65));
    const mCentro = imp - mProf;
    const esVista = !esModoMoplex && (!filtroProf || prof === filtroProf) && (!filtroArea || filtroArea === 'Masoterapia');
    if (!esVista) continue;
    totalBruto += imp; totalProf += mProf; totalCentro += mCentro; cantVista++;
    if (!resumen[prof]) resumen[prof] = {cant:0, bruto:0, prof:0, centro:0, moplex:0, cobroProf:0, cobroPB:0, ses:[], pagos:[]};
    const r = resumen[prof];
    r.cant++; r.bruto += imp; r.prof += mProf; r.centro += mCentro;
    const tM = p.tratamientos || {};
    r.ses.push({ fecha: p.fecha, fechaAbono: p.fecha, prof, valor: imp, mProf, mCentro,
                 paciente: ((tM.personas || {}).nombre) || '—', codigo: tM.codigo_id || '—', practica: pc });
    if (!porArea['Masoterapia']) porArea['Masoterapia'] = {bruto:0, prof:0, moplex:0, centro:0, cant:0};
    const arM = porArea['Masoterapia'];
    arM.cant++; arM.bruto += imp; arM.prof += mProf; arM.centro += mCentro;
    const dkM = prof + '||' + practicaLabel(pc);
    if (!detalle[dkM]) detalle[dkM] = {prof, prac: practicaLabel(pc), cobrado:0, mProf:0, centro:0};
    detalle[dkM].cobrado += imp; detalle[dkM].mProf += mProf; detalle[dkM].centro += mCentro;
  }

  // Producción del mes (sesiones TRABAJADAS en el mes, estén abonadas o no)
  const prodMes = {};
  for (const s of (MT.sesAll || [])){
    if (!s.fecha || s.fecha < desde || s.fecha > hasta) continue;
    const pr = normProf(s.profesional); if (!pr) continue;
    if (filtroProf && !esModoMoplex && pr !== filtroProf) continue;
    const val = (Number(s.monto_profesional) || 0) + (Number(s.monto_centro) || 0);
    if (val <= 0.5) continue;
    if (!prodMes[pr]) prodMes[pr] = {bruto:0, cant:0};
    prodMes[pr].bruto += val; prodMes[pr].cant++;
  }

  // Mapa tratamiento → profesional(es) que atendió, para atribuir los cobros que recibió PuntoBiO
  const profPorTrat = {};
  for (const s of (MT.sesAll || [])){
    const tid = s.tratamiento_id, pr = normProf(s.profesional);
    if (tid == null || !pr) continue;
    (profPorTrat[tid] = profPorTrat[tid] || new Set()).add(pr);
  }
  const profDeTrat = tid => {
    const set = profPorTrat[tid];
    if (!set || set.size === 0) return '';
    if (set.size === 1) return [...set][0];
    return 'varios';
  };
  // Profe que corresponde a UN pago puntual: la sesión que ese pago saldó (por fechaAbono).
  // Si el pago no saldó ninguna sesión esa fecha (adelanto en custodia), cae al del tratamiento.
  const profDePago = (tid, fecha) => {
    const set = abonoProf[tid + '|' + fecha];
    if (set && set.size === 1) return [...set][0];
    if (set && set.size > 1) return 'varios';
    return profDeTrat(tid);
  };
  // ¿Este tratamiento no tiene NINGUNA sesión cargada? Entonces el cobro está
  // pero el turno nunca se marcó PRESENTE. No es un error de atribución: es
  // trabajo sin registrar. Se marca para que se vea y se pueda corregir.
  const sinSesiones = tid => !profPorTrat[tid] || profPorTrat[tid].size === 0;

  // Plata física del mes: quién la recibió y por qué medio (incluye MOPLEX: es plata real)
  const recibidoDet = {};   // quién recibió → lista de pagos (para mostrar qué compone el "en mano")
  for (const p of pagos){
    const quien = String(p.quien_cobro || 'PuntoBiO').split('(')[0].trim() || 'PuntoBiO';
    const imp = Number(p.importe) || 0;
    recibido[quien] = (recibido[quien] || 0) + imp;
    const tD = p.tratamientos || {};
    (recibidoDet[quien] = recibidoDet[quien] || []).push({
      fecha: p.fecha, importe: imp,
      paciente: ((tD.personas || {}).nombre) || '—',
      codigo: tD.codigo_id || '—', practica: tD.practica_codigo || '',
      prof: profDePago(p.tratamiento_id, p.fecha),
      sinSesion: sinSesiones(p.tratamiento_id),
      profRespaldo: normProf(p.profesional) || ''
    });
    if (!porMedio[quien]) porMedio[quien] = {debito:0, efectivo:0, transferencia:0};
    const medio = String(p.medio_pago || '').toUpperCase();
    if (medio.includes('DEBITO') || medio.includes('DÉBITO')) porMedio[quien].debito += imp;
    else if (medio.includes('TRANSFER')) porMedio[quien].transferencia += imp;
    else if (medio.includes('EFECTIVO')) porMedio[quien].efectivo += imp;
  }

  // Sumar las líneas MOPLEX (eval/plantilla con descripción) al detalle.
  // ⚠️ IMPORTANTE: MPX.detalle trae TODOS los profesionales (se calcula sobre todo el mes
  // para que los cruces salgan bien). Acá hay que respetar el filtro elegido, si no
  // aparecen líneas de otros profesionales (ej: elijo Bruno y me sale Male).
  const moplexEnVista = (!filtroArea || filtroArea === 'MOPLEX');
  for (const k of Object.keys(MPX.detalle)){
    const d = MPX.detalle[k];
    if ((!filtroProf || d.prof === filtroProf) && moplexEnVista){
      detalle[k] = d;
    }
  }

  // MOPLEX también le corresponde al profesional (sale del catálogo, NO de sesiones):
  // sumamos esas partes al resumen para que el neto de cada uno quede completo.
  if (!esModoMoplex){
    for (const k of Object.keys(MPX.detalle)){
      const d = MPX.detalle[k];
      if (filtroProf && d.prof !== filtroProf) continue;
      if (filtroArea && filtroArea !== 'MOPLEX') continue;
      if (!resumen[d.prof]) resumen[d.prof] = {cant:0, bruto:0, prof:0, centro:0, moplex:0, cobroProf:0, cobroPB:0, ses:[], pagos:[]};
      const r = resumen[d.prof];
      r.cant++; r.bruto += d.cobrado; r.prof += d.mProf; r.centro += d.centro;
      totalBruto += d.cobrado; totalProf += d.mProf; totalCentro += d.centro; cantVista++;
      const ar = (porArea['MOPLEX'] = porArea['MOPLEX'] || {bruto:0, prof:0, moplex:0, centro:0, cant:0});
      ar.cant++; ar.bruto += d.cobrado; ar.prof += d.mProf; ar.centro += d.centro;
    }
    totalMoplexV = MPX.totalMoplex || 0;
    if (porArea['MOPLEX']) porArea['MOPLEX'].moplex += totalMoplexV;
  }

  // Quien recibió plata pero no tiene sesiones liquidables igual entra al resumen
  // (recibió en custodia: tiene que devolverla al centro hasta que se hagan las sesiones)
  for (const quien of Object.keys(recibido)){
    if (!PROFS_VALIDOS.includes(quien)) continue;
    if (filtroProf && quien !== filtroProf) continue;
    if (esModoMoplex) break;
    if (!resumen[quien]) resumen[quien] = {cant:0, bruto:0, prof:0, centro:0, moplex:0, cobroProf:0, cobroPB:0, ses:[], pagos:[]};
  }

  // Sesiones realizadas SIN abonar: se muestran en el detalle del profesional en $0,
  // aclarando que pasan a la próxima liquidación (para que sepan que existen y van a venir).
  if (!esModoMoplex){
    for (const x of pendientes){
      if (filtroProf && x.prof !== filtroProf) continue;
      if (filtroArea && practicaArea(x.practica) !== filtroArea) continue;
      if (!resumen[x.prof]) resumen[x.prof] = {cant:0, bruto:0, prof:0, centro:0, moplex:0, cobroProf:0, cobroPB:0, ses:[], pagos:[]};
      (resumen[x.prof].pend = resumen[x.prof].pend || []).push(x);
    }
  }

  // Lo recibido en mano por cada profesional este mes,
  // y lo que cobró PuntoBiO que le CORRESPONDE a cada uno (Esther→Male, etc.)
  const cobradoPBporProf = {};
  for (const x of (recibidoDet['PuntoBiO'] || [])){
    if (['Bruno','Male','Vero'].includes(x.prof)) cobradoPBporProf[x.prof] = (cobradoPBporProf[x.prof] || 0) + x.importe;
  }
  for (const prof of Object.keys(resumen)){
    resumen[prof].cobroProf = recibido[prof] || 0;
    resumen[prof].cobroPB = cobradoPBporProf[prof] || 0;
  }

  // Cobros que le corresponden a cada profe, con QUIÉN los recibió (para el detalle desplegable).
  // Así el profe/administración ve la plata que es suya y quién la tiene (en mano, PuntoBiO u otro).
  for (const p of pagos){
    const pr = profDePago(p.tratamiento_id, p.fecha);
    if (!['Bruno','Male','Vero'].includes(pr) || !resumen[pr]) continue;
    const tD = p.tratamientos || {};
    (resumen[pr].cobros = resumen[pr].cobros || []).push({
      fecha: p.fecha, importe: Number(p.importe) || 0,
      paciente: ((tD.personas || {}).nombre) || '—',
      medio: String(p.medio_pago || '').toUpperCase(),
      quien: String(p.quien_cobro || 'PuntoBiO').split('(')[0].trim() || 'PuntoBiO'
    });
  }

  // Ajustes: corresponde (sesiones abonadas + MOPLEX) vs recibido en mano.
  // Recibió de más → lo devuelve al centro (custodia). Recibió de menos → el centro le paga.
  const crucesBrutos = [];
  const deudasCentro = {};
  const netosFinales = [];
  for (const prof of Object.keys(resumen)){
    const neto = resumen[prof].prof - resumen[prof].cobroProf;
    if (neto < -0.5) deudasCentro[prof] = -neto;
    else if (neto > 0.5) netosFinales.push(['PuntoBiO (centro)', prof, neto]);
  }

  const orden = ['Bruno','Male','Vero','Jime','Lu'];
  const ordenarProfs = arr => arr.sort((a,b)=>{const ia=orden.indexOf(a),ib=orden.indexOf(b);return (ia===-1?99:ia)-(ib===-1?99:ib);});
  const profs = ordenarProfs(Object.keys(resumen));

  // ===== tarjetas resumen (solo si NO es modo MOPLEX) =====
  let html = '';
  if (!esModoMoplex) html += `
    <div class="cards">
      <div class="card cant">
        <div class="card-label">Sesiones liquidadas</div>
        <div class="card-value">${fmtNum(cantVista)}</div>
        <div class="card-sub">${profs.length} profesionales</div>
      </div>
      <div class="card bruto">
        <div class="card-label">Total liquidado (realizado y abonado)</div>
        <div class="card-value">${fmt(totalBruto)}</div>
      </div>
      <div class="card prof">
        <div class="card-label">A liquidar profesionales</div>
        <div class="card-value">${fmt(totalProf)}</div>
        <div class="card-sub">${(totalProf/totalBruto*100||0).toFixed(1)}% del bruto</div>
      </div>
      ${soloLoMio ? '' : `<div class="card centro">
        <div class="card-label">Queda al centro</div>
        <div class="card-value">${fmt(totalCentro)}</div>
        <div class="card-sub">${(totalCentro/totalBruto*100||0).toFixed(1)}% del bruto</div>
      </div>`}
    </div>`;

  // ===== GANANCIA DE PUNTOBIO — solapa desplegable (general · por área · por profesional) =====
  // (NO se muestra a un profesional restringido: es info del centro, no suya)
  if (!esModoMoplex && !soloLoMio){
    const ordenArea = ['Consultorio','Masoterapia','BioLab','MOPLEX'];
    const areas = Object.keys(porArea).sort((a,b)=>{const ia=ordenArea.indexOf(a),ib=ordenArea.indexOf(b);return (ia===-1?99:ia)-(ib===-1?99:ib);});
    html += `<details class="gan-panel" open>
      <summary class="gan-sum">
        <span class="gan-sum-left">💰 Ganancia de PuntoBiO</span>
        <span class="gan-sum-right"><span class="gan-sum-monto">${fmt(totalCentro)}</span><span class="gan-chevron">▾</span></span>
      </summary>
      <div class="gan-body">
        <div class="gan-sub">General</div>
        <div class="gan-mini">
          <div class="m"><div class="lbl">Total cobrado</div><div class="val">${fmt(totalBruto)}</div></div>
          <div class="m"><div class="lbl">Al profesional</div><div class="val">${fmt(totalProf)}</div></div>
          <div class="m win"><div class="lbl">Queda en PuntoBiO</div><div class="val">${fmt(totalCentro)}</div></div>
        </div>`;
    // Por área
    if (areas.length){
      html += `<div class="gan-sub">Por área</div>
        <table><thead><tr><th>Área</th><th class="num">Total cobrado</th><th class="num">Al profesional</th><th class="num">Queda en PuntoBiO</th></tr></thead><tbody>`;
      for (const a of areas){
        const x = porArea[a];
        html += `<tr><td><b>${a}</b></td><td class="num">${fmt(x.bruto)}</td><td class="num">${fmt(x.prof)}</td><td class="num"><b>${fmt(x.centro)}</b></td></tr>`;
      }
      html += `<tr style="font-weight:700;background:#ecfdf5;color:#065f46;"><td>TODAS</td><td class="num">${fmt(totalBruto)}</td><td class="num">${fmt(totalProf)}</td><td class="num">${fmt(totalCentro)}</td></tr>`;
      html += `</tbody></table>`;
    }
    // Por profesional
    if (profs.length){
      html += `<div class="gan-sub">Por profesional</div>
        <table><thead><tr><th>Profesional</th><th class="num">Total cobrado</th><th class="num">Se lleva</th><th class="num">Queda en PuntoBiO</th></tr></thead><tbody>`;
      for (const prof of profs){
        const r = resumen[prof];
        html += `<tr><td>${badge(prof)}</td><td class="num">${fmt(r.bruto)}</td><td class="num">${fmt(r.prof)}</td><td class="num"><b>${fmt(r.centro)}</b></td></tr>`;
      }
      html += `<tr style="font-weight:700;background:#ecfdf5;color:#065f46;"><td>TODO PuntoBiO</td><td class="num">${fmt(totalBruto)}</td><td class="num">${fmt(totalProf)}</td><td class="num">${fmt(totalCentro)}</td></tr>`;
      html += `</tbody></table>`;
    }
    html += `</div></details>`;
  }

  // ===== BLOQUE 1: RESUMEN ===== (oculto en modo MOPLEX)
  if (!esModoMoplex){
  html += `<h2 class="bloque-tit">1 · Resumen por profesional <span style="font-weight:400;font-size:13px;color:#666;">— sesiones realizadas y abonadas</span></h2>
    <table><thead><tr>
      <th></th><th>Profesional</th><th class="num">Le corresponde</th>${soloLoMio ? '' : '<th class="num">Total Centro</th>'}
      <th class="num">Recibió en mano</th><th class="num">Neto</th><th>Estado</th>
    </tr></thead><tbody>`;
  for (const prof of profs){
    const r = resumen[prof];
    const neto = r.prof - r.cobroProf;
    let estado = 'Saldado', estCls = 'est-ok';
    if (neto > 0.5){ estado = 'PuntoBiO le debe'; estCls = 'est-pb'; }
    else if (neto < -0.5){ estado = 'Le debe a PuntoBiO'; estCls = 'est-deb'; }
    html += `
      <tr class="prof-row" onclick="toggleDetalle('${prof}')">
        <td><span class="arrow" id="arr-${prof}">▶</span></td>
        <td>${badge(prof)}</td>
        <td class="num"><b>${fmt(r.prof)}</b></td>
        ${soloLoMio ? '' : `<td class="num">${fmt(r.centro)}</td>`}
        <td class="num">${fmt(r.cobroProf)}</td>
        <td class="num"><b>${fmt(neto)}</b></td>
        <td><span class="est ${estCls}">${estado}</span></td>
      </tr>
      <tr class="detail-row" id="det-${prof}" style="display:none">
        <td colspan="${soloLoMio ? 6 : 7}"><div class="detail-content" id="det-content-${prof}"></div></td>
      </tr>`;
  }
  html += `</tbody></table>`;

  // ===== BLOQUE 2: PLATA RECIBIDA POR MEDIO =====
  html += `<h2 class="bloque-tit">2 · Plata recibida por medio de pago</h2>
    <table><thead><tr>
      <th>Recibió</th><th class="num">Débito</th><th class="num">Efectivo</th><th class="num">Transferencia</th>
    </tr></thead><tbody>`;
  for (const prof of ordenarProfs(Object.keys(porMedio))){
    const m = porMedio[prof];
    html += `<tr><td>${badge(prof)}</td><td class="num">${fmt(m.debito)}</td><td class="num">${fmt(m.efectivo)}</td><td class="num">${fmt(m.transferencia)}</td></tr>`;
  }
  html += `</tbody></table>`;

  // 🏦 CUADRO: total que cobró PuntoBiO y le CORRESPONDE a cada profe (según el filtro elegido)
  {
    const entriesPB = Object.keys(cobradoPBporProf).filter(pr => cobradoPBporProf[pr] > 0.5 && (!filtroProf || pr === filtroProf));
    const totalPB = entriesPB.reduce((a,pr)=> a + cobradoPBporProf[pr], 0);
    if (totalPB > 0.5){
      html += `<div style="margin:10px 0 20px;padding:14px 16px;background:#fef3c7;border:1px solid #fcd34d;border-radius:12px;">`;
      if (filtroProf){
        html += `<div style="font-size:14px;color:#92400e;"><b>🏦 PuntoBiO cobró ${fmt(totalPB)} que le corresponde a ${filtroProf}</b> <span style="color:#a16207;">— esa plata la tiene el centro y se le rinde en el neto.</span></div>`;
      } else {
        html += `<div style="font-size:14px;color:#92400e;font-weight:700;margin-bottom:8px;">🏦 PuntoBiO cobró ${fmt(totalPB)} que corresponde a los profesionales:</div>
          <div style="display:flex;flex-wrap:wrap;gap:10px;">` +
          entriesPB.sort((a,b)=> cobradoPBporProf[b]-cobradoPBporProf[a]).map(pr =>
            `<span style="background:#fff;border:1px solid #fcd34d;border-radius:8px;padding:6px 12px;font-size:14px;color:#78350f;"><b>${pr}</b> ${fmt(cobradoPBporProf[pr])}</span>`
          ).join('') + `</div>`;
      }
      html += `</div>`;
    }
  }
  } // fin gate bloques 1-2 (no MOPLEX)

  // ===== BLOQUE 3: AJUSTES DEL MES (quién debe a quién) =====
  const crucesVista = [];   // compat (ya no se usan cruces por pago: el neto lo resuelve)
  const deudasCentroVista = {};
  Object.keys(deudasCentro).forEach(p => { if (!filtroProf || p === filtroProf) deudasCentroVista[p] = deudasCentro[p]; });
  const netosFinalesVista = filtroProf ? netosFinales.filter(n => n[1] === filtroProf) : netosFinales;
  if (!esModoMoplex){
    html += `<h2 class="bloque-tit">3 · Ajustes del mes (quién debe a quién)</h2>
      <p style="color:#666;font-size:13px;margin:-6px 0 12px;">Compara lo que a cada uno <b>le corresponde por sus sesiones abonadas</b> (más su parte MOPLEX) contra la <b>plata que recibió en mano</b>. El que recibió de más la devuelve al centro (queda en custodia hasta que se hagan las sesiones que cubre); al que recibió de menos, el centro le paga.</p>`;
    const hayC = Object.keys(deudasCentroVista).some(p => deudasCentroVista[p] > 0.5);
    if (!hayC && netosFinalesVista.length === 0){
      html += `<p class="vacio">Nadie debe nada este mes 👍</p>`;
    } else {
      html += `<table><thead><tr><th>Debe</th><th>A</th><th class="num">Monto</th></tr></thead><tbody>`;
      const ordenC = ['Bruno','Male','Vero','Jime','Lu'];
      Object.keys(deudasCentroVista).sort((a,b)=>{const ia=ordenC.indexOf(a),ib=ordenC.indexOf(b);return (ia===-1?99:ia)-(ib===-1?99:ib);}).forEach(prof=>{
        if (deudasCentroVista[prof] > 0.5){
          html += `<tr><td>${badge(prof)}</td><td><b>PuntoBiO (centro)</b></td><td class="num"><b>${fmt(deudasCentroVista[prof])}</b></td></tr>`;
        }
      });
      for (const n of netosFinalesVista){
        html += `<tr><td><b>${n[0]}</b></td><td>${badge(n[1])}</td><td class="num"><b>${fmt(n[2])}</b></td></tr>`;
      }
      html += `</tbody></table>`;
    }

    // Detalle de la plata recibida por cada uno (acá se ven los pagos adelantados en custodia,
    // ej. un pack pagado cuyas sesiones todavía no se hicieron: no liquida, pero la plata está)
    {
      const quienes = Object.keys(recibidoDet).filter(q => !filtroProf || q === filtroProf);
      if (quienes.length){
        html += `<details style="margin:-4px 0 18px;"><summary style="cursor:pointer;color:#1e6fa8;font-size:13.5px;">Ver qué pagos recibió cada uno este mes (incluye adelantos en custodia)</summary>`;
        for (const q of ordenarProfs(quienes)){
          const lista = recibidoDet[q].slice().sort((a,b)=> (a.fecha||'').localeCompare(b.fecha||''));
          const tot = lista.reduce((a,x)=> a + x.importe, 0);
          html += `<div style="margin-top:10px;"><b>${badge(q)}</b> — recibió ${fmt(tot)}</div>
            <table style="margin-top:6px;"><thead><tr><th>Fecha</th><th>Paciente</th><th>Tto</th><th>Práctica</th><th>Corresponde a</th><th class="num">Importe</th></tr></thead><tbody>`;
          for (const x of lista){
            html += `<tr><td>${x.fecha}</td><td>${x.paciente}</td><td>${x.codigo}</td><td>${practicaLabel(x.practica)}</td><td>${x.prof ? badge(x.prof)
              : (x.sinSesion
                  ? (x.profRespaldo ? badge(x.profRespaldo) : '') + `<span title="Este tratamiento todavía no tiene ninguna sesión. Puede ser una seña o un pack pagado por adelantado (normal, queda en custodia), o un turno que se hizo y nadie marcó PRESENTE." style="margin-left:4px;padding:1px 6px;border-radius:4px;background:#fef3c7;color:#92400e;font-size:10px;font-weight:700;white-space:nowrap;">SIN SESIÓN AÚN</span>`
                  : '—')}</td><td class="num">${fmt(x.importe)}</td></tr>`;
          }
          html += `</tbody></table>`;
          const sinSes = lista.filter(x => x.sinSesion);
          if (sinSes.length){
            html += `<div style="margin:6px 0 2px;font-size:12.5px;color:#92400e;background:#fef3c7;border-radius:8px;padding:8px 10px;">` +
              `<b>${sinSes.length} cobro(s) sin ninguna sesión todavía:</b> ` +
              sinSes.map(x => `${x.paciente} (${x.fecha})`).join(' · ') +
              ` <span style="color:#78716c;">— puede ser una seña o un pack pagado por adelantado, que queda en custodia y es normal; o un turno que ya se hizo y nadie marcó PRESENTE. Conviene mirarlos en la agenda.</span></div>`;
          }
          // Si PuntoBiO recibió plata que corresponde a un profesional (Bruno/Male/Vero), resumirla
          if (q === 'PuntoBiO'){
            const porProfPB = {};
            for (const x of lista){ if (['Bruno','Male','Vero'].includes(x.prof)) porProfPB[x.prof] = (porProfPB[x.prof]||0) + x.importe; }
            const profsPB = ordenarProfs(Object.keys(porProfPB));
            if (profsPB.length){
              html += `<div style="margin:6px 0 2px;font-size:12.5px;color:#92400e;background:#fef3c7;border-radius:8px;padding:8px 10px;">🏦 De lo que recibió PuntoBiO, corresponde a un profesional: ` +
                profsPB.map(pr => `<b>${pr}</b> ${fmt(porProfPB[pr])}`).join(' · ') +
                ` <span style="color:#78716c;">— la parte de cada uno ya está sumada en su neto de arriba.</span></div>`;
            }
          }
        }
        html += `</details>`;
      }
    }

    // ===== BLOQUE 4: SESIONES REALIZADAS SIN ABONAR (pasan a la próxima liquidación) =====
    const pendVista = pendientes.filter(x => (!filtroProf || x.prof === filtroProf) && (!filtroArea || practicaArea(x.practica) === filtroArea));
    html += `<h2 class="bloque-tit">4 · Sesiones realizadas sin abonar</h2>
      <p style="color:#666;font-size:13px;margin:-6px 0 12px;">Sesiones ya hechas que el paciente todavía no abonó: <b>pasan a la próxima liquidación</b> y se le pagan al profesional cuando el paciente abone.</p>`;
    if (!pendVista.length){
      html += `<p class="vacio">No hay sesiones sin abonar 👍</p>`;
    } else {
      const pp = {};
      for (const x of pendVista){ if (!pp[x.prof]) pp[x.prof] = {cant:0, valor:0, mProf:0}; pp[x.prof].cant++; pp[x.prof].valor += x.valor; pp[x.prof].mProf += x.mProf; }
      html += `<table><thead><tr><th>Profesional</th><th class="num">Sesiones</th><th class="num">Falta cobrar</th><th class="num">$ Profesional (a futuro)</th></tr></thead><tbody>`;
      let tc=0, tv=0, tp=0;
      for (const prof of ordenarProfs(Object.keys(pp))){
        tc+=pp[prof].cant; tv+=pp[prof].valor; tp+=pp[prof].mProf;
        html += `<tr><td>${badge(prof)}</td><td class="num">${fmtNum(pp[prof].cant)}</td><td class="num">${fmt(pp[prof].valor)}</td><td class="num">${fmt(pp[prof].mProf)}</td></tr>`;
      }
      html += `<tr style="font-weight:700;background:#fef3c7;color:#92400e;"><td>TOTAL pendiente de abono</td><td class="num">${fmtNum(tc)}</td><td class="num">${fmt(tv)}</td><td class="num">${fmt(tp)}</td></tr>`;
      html += `</tbody></table>`;
      html += `<details style="margin:-2px 0 16px;"><summary style="cursor:pointer;color:#92400e;font-size:13px;">Ver el detalle de cada sesión sin abonar</summary>
        <table style="margin-top:8px;"><thead><tr><th>Fecha sesión</th><th>Paciente</th><th>Tto</th><th>Práctica</th><th>Profesional</th><th class="num">Falta cobrar</th><th class="num">$ Prof (a futuro)</th></tr></thead><tbody>`;
      for (const x of pendVista.slice().sort((a,b)=> (a.fecha||'').localeCompare(b.fecha||''))){
        html += `<tr><td>${x.fecha}</td><td>${x.paciente}</td><td>${x.codigo}</td><td>${practicaLabel(x.practica)}</td><td>${badge(x.prof)}</td><td class="num">${fmt(x.valor)}</td><td class="num">${fmt(x.mProf)}</td></tr>`;
      }
      html += `</tbody></table></details>`;
    }
  }

  // ===== BLOQUE 5: DETALLE POR PROFESIONAL Y PRÁCTICA ===== (lista de profes: oculta en modo MOPLEX)
  if (!esModoMoplex){
  html += `<h2 class="bloque-tit">5 · Detalle por profesional y práctica</h2>`;
  const porProfDetalle = {};
  for (const k of Object.keys(detalle)){
    const d = detalle[k];
    if (!porProfDetalle[d.prof]) porProfDetalle[d.prof] = [];
    porProfDetalle[d.prof].push(d);
  }
  for (const prof of ordenarProfs(Object.keys(porProfDetalle))){
    const items = porProfDetalle[prof].sort((a,b)=> a.prac.localeCompare(b.prac));
    html += `<div class="det-prof-tit">${badge(prof)}</div>
      <table style="margin-bottom:16px;"><thead><tr>
        <th>Práctica</th><th class="num">Total cobrado</th><th class="num">Total profesional</th><th class="num">Total PuntoBiO</th>
      </tr></thead><tbody>`;
    let sc=0, sp=0, sce=0;
    for (const d of items){
      sc+=d.cobrado; sp+=d.mProf; sce+=d.centro;
      html += `<tr><td>${d.prac}</td><td class="num">${fmt(d.cobrado)}</td><td class="num">${fmt(d.mProf)}</td><td class="num">${fmt(d.centro)}</td></tr>`;
    }
    html += `<tr style="font-weight:700;background:#eff6ff;color:#1e40af;"><td>TOTAL</td><td class="num">${fmt(sc)}</td><td class="num">${fmt(sp)}</td><td class="num">${fmt(sce)}</td></tr>`;
    html += `</tbody></table>`;
  }
  } // fin lista de profesionales (no MOPLEX)

  // ===== MOPLEX como un "profesional" más: detalle SOLO de lo que va a la franquicia =====
  // (se ve en "Todos" o en "MOPLEX"; NO cuando elegís un profesional)
  if (mostrarMoplex && moplexEnVista){
    const moplexDet = {};   // descripción → { desc, cant, monto }
    let mTotal = 0, mCant = 0;
    for (const f of MPX.franquicia){
      if (f.tipo !== 'Plantilla' || f.montoMoplex <= 0.5) continue;  // solo las plantillas pagan a MOPLEX
      const key = f.desc || 'Plantilla';
      if (!moplexDet[key]) moplexDet[key] = { desc:key, cant:0, monto:0 };
      moplexDet[key].cant++; moplexDet[key].monto += f.montoMoplex;
      mTotal += f.montoMoplex; mCant++;
    }
    const moplexItems = Object.values(moplexDet).sort((a,b)=> a.desc.localeCompare(b.desc));
    if (moplexItems.length){
      if (esModoMoplex) html += `<h2 class="bloque-tit">🦶 MOPLEX — lo que el centro le paga a la franquicia</h2>`;
      html += `<div class="det-prof-tit"><span class="badge" style="background:#ccfbf1;color:#0f766e">🦶 MOPLEX</span></div>
        <table style="margin-bottom:16px;"><thead><tr>
          <th>Plantilla</th><th class="num">Cantidad</th><th class="num">Total a MOPLEX</th>
        </tr></thead><tbody>`;
      for (const d of moplexItems){
        html += `<tr><td>${d.desc}</td><td class="num">${fmtNum(d.cant)}</td><td class="num">${fmt(d.monto)}</td></tr>`;
      }
      html += `<tr style="font-weight:700;background:#f0fdfa;color:#0f766e;"><td>TOTAL a MOPLEX</td><td class="num">${fmtNum(mCant)}</td><td class="num">${fmt(mTotal)}</td></tr>`;
      html += `</tbody></table>`;
    }
  }

  // ===== BLOQUE MOPLEX (franquicia) — como una "parte" más =====
  // Aviso: cobros MOPLEX sin tipo asignado (no se pueden repartir bien)
  if (mostrarMoplex && MPX.sinTipo.length > 0){
    html += `<div class="resumen-cruces" style="background:#fee2e2;border-color:#fca5a5">
      <div class="rc-tit-cruces" style="color:#991b1b">⚠️ ${MPX.sinTipo.length} cobro${MPX.sinTipo.length>1?'s':''} MOPLEX sin tipo asignado</div>`;
    for (const s of MPX.sinTipo){
      html += `<div class="cruce-linea"><b>${s.paciente}</b> (${s.fecha}) — ${fmt(s.importe)}. Asigná la consulta/plantilla en <b>Consultas MOPLEX</b> y recalculá, si no no se reparte bien.</div>`;
    }
    html += `</div>`;
  }

  const franqVista = mostrarMoplex
    ? MPX.franquicia.filter(f => (!filtroArea || filtroArea === 'Especialidades'))
    : [];
  let moplexPend = 0, moplexSald = 0, moplexTotalVista = 0;
  if (franqVista.length > 0){
    const saldos = window._moplexSaldos || {};
    html += `<h2 class="bloque-tit">🦶 MOPLEX (franquicia)</h2>
      <p style="color:#666;font-size:13px;margin:-6px 0 12px;">Lo que <b>el centro le tiene que pagar a MOPLEX</b> por las <b>plantillas</b> (las evaluaciones no pagan a MOPLEX). Esto <b>no es el estado de la consulta</b> (la consulta ya está realizada): es si vos ya le pagaste esa plantilla a la franquicia. Marcala como <b>pagada</b> a medida que vas arreglando con ellos. Solo cuenta desde junio 2026.</p>
      <table style="margin-bottom:8px;"><thead><tr>
