<script>
const SUPABASE_URL = 'https://bqpjtoiictnzcasxfucf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_yvuXDxrkRrhXwmZBnE_a_Q_zDBz0iDi';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { lock: (name, acquireTimeout, fn) => fn() } });

const fmt = n => '$' + (Number(n)||0).toLocaleString('es-AR',{maximumFractionDigits:0});
const fmtNum = n => (Number(n)||0).toLocaleString('es-AR');
const badge = (prof) => {
  const cls = {'Bruno':'bruno','Male':'male','Vero':'vero','Jime':'jime','Lu':'lu'}[prof] || 'bruno';
  return `<span class="badge badge-${cls}">${prof}</span>`;
};

let DATA = null; // guarda los pagos crudos para detalles + export

// Normaliza nombre de profesional/cobrador (sin tildes, mayúsculas)
function normProf(txt){
  const t = String(txt||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,'');
  if (t === 'puntobio' || t === 'punto bio' || t === 'punto-bio') return 'PuntoBiO';
  const map = {'bruno':'Bruno','male':'Male','vero':'Vero','jime':'Jime','lu':'Lu'};
  return map[t] || (txt ? String(txt).trim() : '');
}
// Solo profesionales reales (para cruces)
const PROFS_VALIDOS = ['Bruno','Male','Vero','Jime','Lu'];
// Etiqueta legible de práctica desde su código
function practicaLabel(code){
  const c = String(code||'').toUpperCase();
  const map = {
    'FISIO':'Fisio','FISIO_PQ':'Fisio PQ','FISIO_SC':'Fisio SC','FISIO_PC':'Fisio PC','FISIO_DESC':'Fisio DESC',
    'OSTEOPATIA':'Osteo','OSTEO':'Osteo','DLM':'DLM','DRENAJE':'DLM','DRENAJE_LINFATICO':'DLM',
    'PUNCION_SECA':'Punc Seca','PUNC_SECA':'Punc Seca','SUELO_PELVICO':'PP','SUELO_PEL':'PP',
    'MASAJES':'Maso','MASAJES_EYC':'Maso EyC','MASAJES_CC':'Maso CC','MASAJES_PAK':'Maso Pak',
    'MASAJES_R':'Maso R','MASAJES_C':'Maso C','TERAP_MANUAL':'Terap M.','TERAPIA_MANUAL':'Terap M.',
    'EVALUACION':'Evaluación','EVAL':'Evaluación','MOPLEX':'Moplex','RPG':'RPG',
    'SARKMED_BL':'Sarkmed BioLab','SARKMED_PP':'Sarkmed PP'
  };
  return map[c] || (code || '—');
}

// ================= ÁREAS =================
// La base NO guarda "área": la deducimos de la práctica.
// 👉 Si querés mover una práctica de área, cambiala acá abajo.
//    Consultorio · BioLab · Especialidades
function practicaArea(code){
  const c = String(code||'').toUpperCase();
  // BioLab: evaluaciones funcionales + Sarkmed
  if (c === 'EVALUACION' || c === 'EVAL' || c.startsWith('SARKMED')) return 'BioLab';
  // Especialidades: MOPLEX (podología / plantillas)
  if (c === 'MOPLEX') return 'Especialidades';
  // Consultorio: fisio, osteo, maso, DLM, punción, RPG, suelo pélvico, terapia manual
  return 'Consultorio';
}

// ================= CALENDARIO DE MESES =================
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
let _pickerYear = null; // año que se está mostrando en el calendario abierto

function mesLabelDesde(val){
  const [y,m] = String(val||'').split('-');
  const idx = (parseInt(m,10)||1) - 1;
  return `${MESES[idx]||''} ${y||''}`.trim();
}
function toggleMesPicker(ev){
  if (ev) ev.stopPropagation();
  const box = document.getElementById('mesPicker');
  if (box.style.display === 'none'){
    const [y] = document.getElementById('mes').value.split('-');
    _pickerYear = parseInt(y,10) || new Date().getFullYear();
    renderMesPicker();
    box.style.display = 'block';
  } else {
    box.style.display = 'none';
  }
}
function cambiarAnioPicker(delta){
  _pickerYear += delta;
  renderMesPicker();
}
function renderMesPicker(){
  const [selY, selM] = document.getElementById('mes').value.split('-');
  const selYear = parseInt(selY,10), selMonth = parseInt(selM,10);
  let h = `<div class="mes-picker-head">
      <button type="button" class="mes-nav" onclick="cambiarAnioPicker(-1)">‹</button>
      <b>${_pickerYear}</b>
      <button type="button" class="mes-nav" onclick="cambiarAnioPicker(1)">›</button>
    </div><div class="mes-grid">`;
  for (let i=0;i<12;i++){
    const esSel = (_pickerYear===selYear && (i+1)===selMonth);
    h += `<button type="button" class="mes-cell${esSel?' sel':''}" onclick="elegirMes(${i+1})">${MESES[i].slice(0,3)}</button>`;
  }
  h += `</div>`;
  document.getElementById('mesPicker').innerHTML = h;
}
function elegirMes(mesNum){
  const val = `${_pickerYear}-${String(mesNum).padStart(2,'0')}`;
  document.getElementById('mes').value = val;
  document.getElementById('mesLabel').textContent = mesLabelDesde(val);
  document.getElementById('mesPicker').style.display = 'none';
  cargar();
}
// Cerrar el calendario si clickeás afuera
document.addEventListener('click', (e)=>{
  const box = document.getElementById('mesPicker');
  if (box && box.style.display !== 'none' && !e.target.closest('.mes-wrap')){
    box.style.display = 'none';
  }
});

// ================= MOPLEX =================
// MOPLEX empezó a facturar en junio 2026 (abril/mayo no cuentan: van en $0).
const MOPLEX_FACTURA_DESDE = '2026-06';
function moplexFacturable(fecha){ return String(fecha||'').slice(0,7) >= MOPLEX_FACTURA_DESDE; }

// Mismas fórmulas que consultas_moplex.html (fuente de verdad del reparto)
function calcConsultaMoplex(c){
  if(!c) return null;
  const precio = Number(c.precio_paciente)||0;
  const moplex = Number(c.costo_moplex)||0;
  const prof   = Math.round(precio * (Number(c.pct_profesional)||0)/100);   // % sobre el precio al paciente
  const centro = precio - moplex - prof;
  return { precio, moplex, prof, centro };
}
function calcPlantillaMoplex(p, rectif, montoCustom){
  if(!p) return null;
  if(rectif){
    const precio = (Number(montoCustom) > 0) ? Number(montoCustom) : Math.round((Number(p.precio_paciente)||0)/2);
    const moplex = Math.round(precio*0.85);
    const prof   = 0;
    const centro = precio - moplex;                                 // 15%
    return { precio, moplex, prof, centro, rectif:true };
  }
  const precio = Number(p.precio_paciente)||0;
  const moplex = Number(p.costo_moplex)||0;
  const prof   = Math.round(precio * (Number(p.pct_profesional)||0)/100);   // 10% del precio al paciente
  const centro = precio - moplex - prof;
  return { precio, moplex, prof, centro, rectif:false };
}
// Reparte 'portion' pesos de un componente (evaluación o plantilla)
function splitPortionMoplex(rep, portion, fact){
  if (!rep || !rep.precio) return { prof:0, moplex:0, centro:portion };
  if (!fact) return { prof:0, moplex:0, centro:portion };   // pre-junio: no factura
  const fr = portion / rep.precio;
  const prof   = Math.round(rep.prof   * fr);
  const moplex = Math.round(rep.moplex * fr);
  const centro = portion - prof - moplex;
  return { prof, moplex, centro };
}

// Recalcula el split de cada cobro MOPLEX leyendo el tratamiento + catálogo,
// pisando lo que la caja guardó mal. Devuelve el detalle (2 líneas por cobro:
// evaluación / plantilla) y la lista para la sección de franquicia MOPLEX.
function prepararMoplex(monthPagos){
  const byId = (window._moplexCat && window._moplexCat.byId) || {};
  const out = { detalle:{}, franquicia:[], sinTipo:[], totalMoplex:0 };
  const cerca = (a,b)=> Math.abs(a-b) < 1;

  for (const p of monthPagos){
    const t = p.tratamientos || {};
    if ((t.practica_codigo||'') !== 'MOPLEX') continue;

    const fact = moplexFacturable(p.fecha);
    const evalItem  = byId[t.moplex_consulta_id];
    const plantItem = (t.solicita_plantillas && t.moplex_plantilla_id) ? byId[t.moplex_plantilla_id] : null;
    const rectif    = !!t.moplex_plantilla_rectif;
    const evalRep   = evalItem  ? calcConsultaMoplex(evalItem)          : null;
    const plantRep  = plantItem ? calcPlantillaMoplex(plantItem, rectif, Number(t.moplex_rectif_monto)||0) : null;
    const evalPrecio  = evalRep  ? evalRep.precio  : 0;
    const plantPrecio = plantRep ? plantRep.precio : 0;
    const importe  = Number(p.importe)||0;
    const paciente = (t.personas && t.personas.nombre) || '—';
    const prof     = normProf(p.profesional);

    // Cobro MOPLEX sin tipo asignado en "Consultas MOPLEX" → no se puede repartir bien
    if (!evalRep && !plantRep){
      out.sinTipo.push({ fecha:p.fecha, paciente, prof, importe, tratId:p.tratamiento_id });
      p._moplexInfo = { evalPortion:0, plantPortion:0, sinTipo:true };
      p.monto_profesional = 0;
      p.monto_centro = importe;
      p._monto_moplex = 0;
      continue;
    }

    // A qué componente corresponde este cobro (por importe; con fallback en cascada)
    let evalPortion = 0, plantPortion = 0;
    if (evalRep && cerca(importe, evalPrecio)) { evalPortion = importe; }
    else if (plantRep && cerca(importe, plantPrecio)) { plantPortion = importe; }
    else if (evalRep && plantRep && cerca(importe, evalPrecio+plantPrecio)) { evalPortion = evalPrecio; plantPortion = plantPrecio; }
    else { // fallback: primero evaluación, después plantilla
      let a = importe;
      evalPortion  = Math.min(a, evalPrecio);  a -= evalPortion;
      plantPortion = Math.min(a, plantPrecio);
    }

    const se = splitPortionMoplex(evalRep,  evalPortion,  fact);
    const sp = splitPortionMoplex(plantRep, plantPortion, fact);
    const leftover = importe - evalPortion - plantPortion;

    // Pisar el split del pago con lo correcto
    p.monto_profesional = se.prof + sp.prof;
    p.monto_centro      = se.centro + sp.centro + (leftover>0?leftover:0);
    p._monto_moplex     = se.moplex + sp.moplex;
    p._moplexInfo       = { evalPortion, plantPortion };

    // Detalle por profesional — dos líneas con descripción
    if (evalPortion > 0){
      const lbl = 'MOPLEX · Eval. — ' + ((evalItem&&evalItem.nombre)||'');
      const k = prof + '||' + lbl;
      if(!out.detalle[k]) out.detalle[k] = {prof, prac:lbl, cobrado:0, mProf:0, centro:0};
      out.detalle[k].cobrado += evalPortion; out.detalle[k].mProf += se.prof; out.detalle[k].centro += se.centro;
      out.franquicia.push({ tratId:p.tratamiento_id, fecha:p.fecha, paciente, prof, tipo:'Evaluación', desc:(evalItem&&evalItem.nombre)||'', montoMoplex:0 });
    }
    if (plantPortion > 0){
      const lbl = 'MOPLEX · Plantilla — ' + ((rectif?'Rectif. ':'')+((plantItem&&plantItem.nombre)||''));
      const k = prof + '||' + lbl;
      if(!out.detalle[k]) out.detalle[k] = {prof, prac:lbl, cobrado:0, mProf:0, centro:0};
      out.detalle[k].cobrado += plantPortion; out.detalle[k].mProf += sp.prof; out.detalle[k].centro += sp.centro;
      out.franquicia.push({ tratId:p.tratamiento_id, fecha:p.fecha, paciente, prof, tipo:'Plantilla', desc:(rectif?'Rectif. ':'')+((plantItem&&plantItem.nombre)||''), montoMoplex:sp.moplex });
      out.totalMoplex += sp.moplex;
    }
  }
  return out;
}

// Marcar/desmarcar una plantilla como saldada con la franquicia MOPLEX
async function toggleMoplexSaldado(tratId, val){
  try{
    const { error } = await sb.from('moplex_franquicia_saldos')
      .upsert({ tratamiento_id: tratId, saldado: val, actualizado_en: new Date().toISOString() }, { onConflict: 'tratamiento_id' });
    if (error) throw error;
    window._moplexSaldos = window._moplexSaldos || {};
    window._moplexSaldos[tratId] = val;
    cargar();
  }catch(e){
    alert('No se pudo guardar el estado con MOPLEX.\n¿Ya creaste la tabla moplex_franquicia_saldos?\n\n' + (e.message||e));
  }
}

async function cargar(){
  const mes = document.getElementById('mes').value; // "2026-05"
  const filtroProf = document.getElementById('filtroProf').value;
  document.getElementById('resultado').innerHTML = '<div class="loading">⏳ Cargando pagos...</div>';

  const [year, month] = mes.split('-');
  const desde = `${year}-${month}-01`;
  const hasta = new Date(year, parseInt(month), 0).toISOString().split('T')[0]; // último día del mes

  // Traemos pagos del mes con su tratamiento y persona
  let q = sb.from('pagos_consultorio')
    .select(`
      id, fecha, importe, medio_pago, profesional, quien_cobro, tipo_cobro,
      monto_centro, monto_profesional, monto_moplex, tratamiento_id,
      tratamientos (
        id, codigo_id, practica_codigo, modalidad, obra_social,
        moplex_consulta_id, moplex_plantilla_id, moplex_plantilla_rectif, moplex_rectif_monto, solicita_plantillas,
        personas ( id, nombre )
      )
    `)
    .gte('fecha', desde)
    .lte('fecha', hasta)
    .order('fecha');

  // Para que los CRUCES salgan completos hay que mirar TODO el mes (un cruce involucra a dos personas).
  // - Admin (sin restricción): traemos todo el mes y filtramos la VISTA en JS. Los números de cada profe no cambian,
  //   pero los cruces se calculan sobre el panorama completo (correcto).
  // - Profesional con "solo lo mío": NO le bajamos datos del resto. Traemos solo lo que lo involucra (atendió O cobró).
  if (filtroProf && window._soloLoMioLiq) {
    q = q.or(`profesional.eq.${filtroProf},quien_cobro.eq.${filtroProf}`);
  }
  // (si es admin con un profesional elegido, NO filtramos en la consulta: se filtra en render con `filtroProf`)

  const { data, error } = await q;
  if (error) {
    document.getElementById('resultado').innerHTML = `<div class="empty">❌ Error: ${error.message}</div>`;
    return;
  }

  // ===== MASAJES DE REGALO (cumpleaños) del mes =====
  // El paciente no paga nada, así que NO hay fila en pagos_consultorio y el
  // tratamiento no entraría nunca a esta pantalla. Pero la sesión SÍ existe
  // (la creó el trigger al marcar PRESENTE) con la parte de Vero, que la
  // asume PuntoBiO. Las traemos aparte para mostrarlas y sumarlas a lo que
  // PB le debe al profesional.
  let regalosMes = [];
  try {
    let qR = sb.from('sesiones')
      .select('fecha, profesional, monto_profesional, tratamiento_id, tratamientos!inner(codigo_id, practica_codigo, personas(nombre))')
      .gte('fecha', desde)
      .lte('fecha', hasta)
      .eq('tratamientos.practica_codigo', 'MASAJES_R')
      .order('fecha');
    if (filtroProf && window._soloLoMioLiq) qR = qR.ilike('profesional', '%' + filtroProf + '%');
    const { data: regData } = await qR;
    regalosMes = regData || [];
  } catch (e) {
    console.warn('No se pudieron cargar los masajes de regalo:', e.message);
  }
  window._regalosMes = regalosMes;

  if ((!data || data.length === 0) && regalosMes.length === 0) {
    document.getElementById('resultado').innerHTML = `<div class="empty">📭 Sin pagos en ${mes}</div>`;
    return;
  }

  // Traemos las SESIONES de los tratamientos involucrados.
  // La parte profesional REAL de cada tratamiento sale de las sesiones (lo que se trabajó),
  // NO de los pagos (que pueden venir divididos). Ej: evaluación = 1 sesión de $40.000 prof,
  // aunque el pago haya entrado en 2 cuotas de $20.000.
  const tratIds = [...new Set((data || []).map(p => p.tratamiento_id).filter(x => x != null))];
  let sesionesData = [];
  if (tratIds.length > 0){
    const { data: sesData, error: sesErr } = await sb.from('sesiones')
      .select('tratamiento_id, profesional, monto_profesional')
      .in('tratamiento_id', tratIds);
    if (!sesErr && sesData) sesionesData = sesData;
  }

  DATA = data || [];

  // ===== PAGOS DE OBRAS SOCIALES (informativo, no afecta el cálculo) =====
  // Se filtran por la FECHA DE PAGO (cuándo entró a la cuenta del profesional),
  // y si hay filtro de profesional, por ese profesional.
  // El "mes al que corresponde" es solo un dato informativo, no se usa para filtrar.
  let pagosOS = [];
  try {
    let qOS = sb.from('pagos_obras_sociales')
      .select('obra_social, monto, fecha, mes_correspondiente, profesional_nombre')
      .gte('fecha', desde)
      .lte('fecha', hasta)
      .order('fecha');
    // Si está fijado un profesional (incluye el caso "solo lo mío"), filtrar por su nombre
    const profSel = document.getElementById('filtroProf').value;
    if (profSel) qOS = qOS.ilike('profesional_nombre', '%' + profSel + '%');
    const { data: osData } = await qOS;
    pagosOS = osData || [];
  } catch (e) {
    console.warn('No se pudieron cargar pagos OS:', e.message);
  }
  window._pagosOS = pagosOS;

  // ===== MOPLEX: catálogo (montos fijos) + estados de saldo con la franquicia =====
  try {
    const { data: cat } = await sb.from('moplex_catalogo').select('*');
    const byId = {}; (cat||[]).forEach(c=>{ byId[c.id] = c; });
    window._moplexCat = { byId };
  } catch (e) {
    window._moplexCat = { byId:{} };
    console.warn('No se pudo cargar moplex_catalogo:', e.message);
  }
  try {
    const moplexTratIds = [...new Set((data||[])
      .filter(p => ((p.tratamientos||{}).practica_codigo||'') === 'MOPLEX')
      .map(p => p.tratamiento_id).filter(x => x != null))];
    window._moplexSaldos = {};
    if (moplexTratIds.length){
      const { data: sal } = await sb.from('moplex_franquicia_saldos')
        .select('tratamiento_id, saldado').in('tratamiento_id', moplexTratIds);
      (sal||[]).forEach(r => { window._moplexSaldos[r.tratamiento_id] = !!r.saldado; });
    }
  } catch (e) {
    window._moplexSaldos = {};
    console.warn('No se pudieron cargar saldos MOPLEX (falta tabla moplex_franquicia_saldos?):', e.message);
  }

  render(data || [], sesionesData, filtroProf);
}

function render(pagos, sesiones, filtroProf){
  filtroProf = filtroProf || '';
  sesiones = sesiones || [];
  const filtroArea = (document.getElementById('filtroArea') || {}).value || '';
  // MOPLEX: recalcular el split de cada cobro MOPLEX desde el catálogo (pisa lo que la caja guardó mal).
  // Debe correr ANTES del loop: deja monto_profesional/monto_centro correctos en cada pago MOPLEX.
  const MPX = prepararMoplex(pagos);
  // ===== procesar todos los pagos =====
  const resumen = {};        // por profesional (quien atendió)
  const porMedio = {};       // cobros por medio de cada profesional
  const crucesBrutos = [];   // pagos donde cobró != atendió
  const netos = {};          // deudas entre profesionales: "Cobrador||Profesional" → monto_prof
  const detalle = {};        // "profesional||practica" → {cobrado, prof, centro}
  const porTrat = {};        // tratamiento_id → {profParte:0, cobradoProfMismo:0} (para cruces por tratamiento)
  let totalBruto = 0, totalProf = 0, totalCentro = 0, cantVista = 0;

  for (const p of pagos){
    const prof = normProf(p.profesional);     // quien ATENDIÓ
    const cobro = normProf(p.quien_cobro);     // quien RECIBIÓ la plata
    const importe = Number(p.importe) || 0;
    const mProf = Number(p.monto_profesional) || 0;
    const mCentro = Number(p.monto_centro) || 0;
    const totalPago = mProf + mCentro;
    const t = p.tratamientos || {};
    const areaP = practicaArea(t.practica_codigo); // Consultorio / BioLab / Especialidades
    if (!prof) continue;

    // ¿Esta fila es PRODUCCIÓN del profesional que estoy mirando? (quien ATENDIÓ)
    // Si no hay filtro de profesional, todo cuenta. Si hay filtro, solo lo que atendió ese profesional.
    // Además, si hay filtro de ÁREA, solo cuentan las prácticas de esa área.
    const esVista = (!filtroProf || prof === filtroProf) && (!filtroArea || areaP === filtroArea);

    // ===== PARTES GLOBALES (siempre, aunque haya filtro) — necesarias para los CRUCES =====
    // Acumular por tratamiento: cuánto YA cobró el propio profesional (el pago COMPLETO que se llevó cuenta contra su parte).
    // (profParte se calcula aparte, desde las SESIONES, más abajo)
    const tid = p.tratamiento_id;
    if (tid != null){
      if (!porTrat[tid]) porTrat[tid] = {profParte:0, cobradoProfMismo:0};
      if (cobro === prof) porTrat[tid].cobradoProfMismo += totalPago; // el pago completo que se llevó el profesional
    }

    // BLOQUE 3 y 4 — guardar cruces crudos (el cálculo inteligente se hace después del loop)
    if (PROFS_VALIDOS.includes(cobro) && PROFS_VALIDOS.includes(prof) && cobro !== prof){
      crucesBrutos.push({fecha:p.fecha, cobro, prof, mProf, mCentro, importe, tratId:p.tratamiento_id});
    }

    // ===== PARTES DE LA VISTA (solo del profesional filtrado) =====
    if (!esVista) continue;

    totalBruto += importe; totalProf += mProf; totalCentro += mCentro; cantVista++;
    if (!resumen[prof]) resumen[prof] = {cant:0, bruto:0, prof:0, centro:0, cobroProf:0, cobroPB:0, pagos:[]};
    const r = resumen[prof];
    r.cant++; r.bruto += importe; r.prof += mProf; r.centro += mCentro; r.pagos.push(p);
    if (cobro === prof) r.cobroProf += totalPago;
    else if (cobro === 'PuntoBiO') r.cobroPB += totalPago;

    // BLOQUE 2 — por medio (solo de lo que cobró el propio profesional)
    if (cobro === prof){
      if (!porMedio[prof]) porMedio[prof] = {debito:0, efectivo:0, transferencia:0};
      const medio = String(p.medio_pago||'').toUpperCase();
      if (medio.includes('DEBITO') || medio.includes('DÉBITO')) porMedio[prof].debito += totalPago;
      else if (medio.includes('TRANSFER')) porMedio[prof].transferencia += totalPago;
      else if (medio.includes('EFECTIVO')) porMedio[prof].efectivo += totalPago;
    }

    // BLOQUE 5 — detalle por profesional + práctica
    // (MOPLEX se arma aparte, en dos líneas con descripción: eval / plantilla)
    if (!p._moplexInfo){
      const prac = practicaLabel(t.practica_codigo);
      const dk = prof + '||' + prac;
      if (!detalle[dk]) detalle[dk] = {prof, prac, cobrado:0, mProf:0, centro:0};
      detalle[dk].cobrado += importe;
      detalle[dk].mProf += mProf;
      detalle[dk].centro += mCentro;
    }
  }

  // Sumar las líneas MOPLEX (eval/plantilla con descripción) al detalle.
  // ⚠️ IMPORTANTE: MPX.detalle trae TODOS los profesionales (se calcula sobre todo el mes
  // para que los cruces salgan bien). Acá hay que respetar el filtro elegido, si no
  // aparecen líneas de otros profesionales (ej: elijo Bruno y me sale Male).
  const moplexEnVista = (!filtroArea || filtroArea === 'Especialidades');
  for (const k of Object.keys(MPX.detalle)){
    const d = MPX.detalle[k];
    if ((!filtroProf || d.prof === filtroProf) && moplexEnVista){
      detalle[k] = d;
    }
  }

  // La parte profesional REAL de cada tratamiento sale de las SESIONES (lo trabajado),
  // no de los pagos. Sumamos monto_profesional de las sesiones por tratamiento.
  for (const s of sesiones){
    const tid = s.tratamiento_id;
    if (tid == null) continue;
    if (!porTrat[tid]) porTrat[tid] = {profParte:0, cobradoProfMismo:0};
    porTrat[tid].profParte += Number(s.monto_profesional) || 0;
  }

  // ===== CÁLCULO INTELIGENTE DE CRUCES (POR TRATAMIENTO) =====
  // Para cada cruce miramos ESE tratamiento puntual:
  //   saldo del tratamiento = parte profesional total - lo que el propio profesional YA cobró de ese tratamiento.
  //   lo que cobró el otro va al profesional solo hasta cubrir ese saldo; el resto va al CENTRO.
  // Si el profesional ya cobró toda su parte de ese tratamiento, TODO lo que cobró el otro va al centro.
  const saldoTrat = {};  // tratamiento_id → parte profesional que aún le falta cobrar al profesional
  for (const tid of Object.keys(porTrat)){
    saldoTrat[tid] = Math.max(porTrat[tid].profParte - porTrat[tid].cobradoProfMismo, 0);
  }
  for (const c of crucesBrutos){
    const tid = c.tratId;
    const disponible = (tid != null && saldoTrat[tid] != null) ? saldoTrat[tid] : 0;
    if (disponible > 0.5){
      // Al profesional le falta cobrar parte de ESTE tratamiento → le va hasta cubrirlo
      const aProfesional = Math.min(c.mProf, disponible);
      const alCentro = c.mProf - aProfesional;
      if (tid != null) saldoTrat[tid] -= aProfesional;
      if (aProfesional > 0.5){
        const k = c.cobro + '||' + c.prof;
        netos[k] = (netos[k] || 0) + aProfesional;
      }
      c._alCentro = alCentro + c.mCentro;
    } else {
      // El profesional YA cobró su parte de ESTE tratamiento → todo va al centro
      c._alCentro = c.mProf + c.mCentro;
    }
    const k2 = c.cobro + '||CENTRO';
    netos[k2] = (netos[k2] || 0) + c._alCentro;
  }

  const orden = ['Bruno','Male','Vero','Jime','Lu'];
  const ordenarProfs = arr => arr.sort((a,b)=>{const ia=orden.indexOf(a),ib=orden.indexOf(b);return (ia===-1?99:ia)-(ib===-1?99:ib);});
  const profs = ordenarProfs(Object.keys(resumen));

  // ===== tarjetas resumen =====
  let html = `
    <div class="cards">
      <div class="card cant">
        <div class="card-label">Cant. pagos</div>
        <div class="card-value">${fmtNum(cantVista)}</div>
        <div class="card-sub">${profs.length} profesionales</div>
      </div>
      <div class="card bruto">
        <div class="card-label">Total bruto cobrado</div>
        <div class="card-value">${fmt(totalBruto)}</div>
      </div>
      <div class="card prof">
        <div class="card-label">A liquidar profesionales</div>
        <div class="card-value">${fmt(totalProf)}</div>
        <div class="card-sub">${(totalProf/totalBruto*100||0).toFixed(1)}% del bruto</div>
      </div>
      <div class="card centro">
        <div class="card-label">Queda al centro</div>
        <div class="card-value">${fmt(totalCentro)}</div>
        <div class="card-sub">${(totalCentro/totalBruto*100||0).toFixed(1)}% del bruto</div>
      </div>
    </div>`;

  // ===== BLOQUE 1: RESUMEN =====
  html += `<h2 class="bloque-tit">1 · Resumen por profesional</h2>
    <table><thead><tr>
      <th></th><th>Profesional</th><th class="num">Total Profesional</th><th class="num">Total Centro</th>
      <th class="num">Cobró Profesional</th><th class="num">Cobró PuntoBiO</th><th class="num">Neto</th><th>Estado</th>
    </tr></thead><tbody>`;
  for (const prof of profs){
    const r = resumen[prof];
    const neto = r.prof - r.cobroProf;
    let estado = 'Saldado', estCls = 'est-ok';
    if (neto > 0.5){ estado = 'PuntoBiO le debe'; estCls = 'est-pb'; }
    else if (neto < -0.5){ estado = 'Le debe a PuntoBiO'; estCls = 'est-deb'; }
    html += `
      <tr class="prof-row" onclick="toggleDetalle('${prof}')">
        <td><span class="arrow" id="arr-${prof}">▶</span></td>
        <td>${badge(prof)}</td>
        <td class="num"><b>${fmt(r.prof)}</b></td>
        <td class="num">${fmt(r.centro)}</td>
        <td class="num">${fmt(r.cobroProf)}</td>
        <td class="num">${fmt(r.cobroPB)}</td>
        <td class="num"><b>${fmt(neto)}</b></td>
        <td><span class="est ${estCls}">${estado}</span></td>
      </tr>
      <tr class="detail-row" id="det-${prof}" style="display:none">
        <td colspan="8"><div class="detail-content" id="det-content-${prof}"></div></td>
      </tr>`;
  }
  html += `</tbody></table>`;

  // ===== BLOQUE 2: COBROS POR MEDIO =====
  html += `<h2 class="bloque-tit">2 · Cobros por medio de pago</h2>
    <table><thead><tr>
      <th>Profesional</th><th class="num">Débito</th><th class="num">Efectivo</th><th class="num">Transferencia</th>
    </tr></thead><tbody>`;
  for (const prof of ordenarProfs(Object.keys(porMedio))){
    const m = porMedio[prof];
    html += `<tr><td>${badge(prof)}</td><td class="num">${fmt(m.debito)}</td><td class="num">${fmt(m.efectivo)}</td><td class="num">${fmt(m.transferencia)}</td></tr>`;
  }
  html += `</tbody></table>`;

  // ===== BLOQUE 3: CRUCES BRUTOS =====
  // Si hay un profesional elegido, mostramos solo los cruces que lo involucran (cobró por otro, o cobraron por él).
  const crucesVista = filtroProf
    ? crucesBrutos.filter(c => c.cobro === filtroProf || c.prof === filtroProf)
    : crucesBrutos;
  html += `<h2 class="bloque-tit">3 · Cruces (uno cobró por otro)</h2>`;
  if (crucesVista.length === 0){
    html += `<p class="vacio">Sin cruces este mes 👍</p>`;
  } else {
    crucesVista.sort((a,b)=> (a.cobro+a.prof).localeCompare(b.cobro+b.prof));
    html += `<table><thead><tr>
      <th>Fecha</th><th>Cobró</th><th>Correspondía a</th><th class="num">Cruce profesional</th><th class="num">Total cobrado</th>
    </tr></thead><tbody>`;
    for (const c of crucesVista){
      html += `<tr><td>${c.fecha}</td><td>${badge(c.cobro)}</td><td>${badge(c.prof)}</td><td class="num">${fmt(c.mProf)}</td><td class="num">${fmt(c.importe)}</td></tr>`;
    }
    html += `</tbody></table>`;
  }

  // ===== BLOQUE 4: CRUCES NETOS =====
  // Separamos deudas hacia el CENTRO (clave "X||CENTRO") de las deudas entre profesionales
  const deudasCentro = {};   // profesional → cuánto le debe al centro
  const netosEntreProfs = {};
  for (const k of Object.keys(netos)){
    const [a, b] = k.split('||');
    if (b === 'CENTRO'){
      deudasCentro[a] = (deudasCentro[a] || 0) + netos[k];
    } else {
      netosEntreProfs[k] = netos[k];
    }
  }
  // Netear deudas entre profesionales (A le debe a B menos lo que B le debe a A)
  const netosFinales = [];
  const procesadas = new Set();
  for (const k of Object.keys(netosEntreProfs)){
    if (procesadas.has(k)) continue;
    const [cobrador, profesional] = k.split('||');
    const inversa = profesional + '||' + cobrador;
    const neto = (netosEntreProfs[k]||0) - (netosEntreProfs[inversa]||0);
    if (neto > 0.5) netosFinales.push([cobrador, profesional, neto]);
    else if (neto < -0.5) netosFinales.push([profesional, cobrador, Math.abs(neto)]);
    procesadas.add(k); procesadas.add(inversa);
  }

  // Vistas filtradas por profesional elegido (si lo hay)
  const deudasCentroVista = {};
  Object.keys(deudasCentro).forEach(p => { if (!filtroProf || p === filtroProf) deudasCentroVista[p] = deudasCentro[p]; });
  const netosFinalesVista = filtroProf ? netosFinales.filter(n => n[0] === filtroProf || n[1] === filtroProf) : netosFinales;
  const hayCentroVista = Object.keys(deudasCentroVista).some(p => deudasCentroVista[p] > 0.5);

  if (netosFinalesVista.length > 0 || hayCentroVista){
    html += `<h2 class="bloque-tit">4 · Cruces netos (quién debe a quién)</h2>
      <table><thead><tr><th>Debe</th><th>A</th><th class="num">Monto neto</th></tr></thead><tbody>`;
    // Deudas hacia el centro
    const ordenC = ['Bruno','Male','Vero','Jime','Lu'];
    Object.keys(deudasCentroVista).sort((a,b)=>{const ia=ordenC.indexOf(a),ib=ordenC.indexOf(b);return (ia===-1?99:ia)-(ib===-1?99:ib);}).forEach(prof=>{
      if (deudasCentroVista[prof] > 0.5){
        html += `<tr><td>${badge(prof)}</td><td><b>PuntoBiO (centro)</b></td><td class="num"><b>${fmt(deudasCentroVista[prof])}</b></td></tr>`;
      }
    });
    // Deudas entre profesionales
    netosFinalesVista.sort((a,b)=> (a[0]+a[1]).localeCompare(b[0]+b[1]));
    for (const n of netosFinalesVista){
      html += `<tr><td>${badge(n[0])}</td><td>${badge(n[1])}</td><td class="num"><b>${fmt(n[2])}</b></td></tr>`;
    }
    html += `</tbody></table>`;
  }

  // ===== BLOQUE 5: DETALLE POR PROFESIONAL Y PRÁCTICA =====
  html += `<h2 class="bloque-tit">5 · Detalle por profesional y práctica</h2>`;
  const porProfDetalle = {};
  for (const k of Object.keys(detalle)){
    const d = detalle[k];
    if (!porProfDetalle[d.prof]) porProfDetalle[d.prof] = [];
    porProfDetalle[d.prof].push(d);
  }
  for (const prof of ordenarProfs(Object.keys(porProfDetalle))){
    const items = porProfDetalle[prof].sort((a,b)=> a.prac.localeCompare(b.prac));
    html += `<div class="det-prof-tit">${badge(prof)}</div>
      <table style="margin-bottom:16px;"><thead><tr>
        <th>Práctica</th><th class="num">Total cobrado</th><th class="num">Total profesional</th><th class="num">Total PuntoBiO</th>
      </tr></thead><tbody>`;
    let sc=0, sp=0, sce=0;
    for (const d of items){
      sc+=d.cobrado; sp+=d.mProf; sce+=d.centro;
      html += `<tr><td>${d.prac}</td><td class="num">${fmt(d.cobrado)}</td><td class="num">${fmt(d.mProf)}</td><td class="num">${fmt(d.centro)}</td></tr>`;
    }
    html += `<tr style="font-weight:700;background:#eff6ff;color:#1e40af;"><td>TOTAL</td><td class="num">${fmt(sc)}</td><td class="num">${fmt(sp)}</td><td class="num">${fmt(sce)}</td></tr>`;
    html += `</tbody></table>`;
  }

  // ===== BLOQUE MOPLEX (franquicia) — como una "parte" más =====
  // Aviso: cobros MOPLEX sin tipo asignado (no se pueden repartir bien)
  if (MPX.sinTipo.length > 0){
    html += `<div class="resumen-cruces" style="background:#fee2e2;border-color:#fca5a5">
      <div class="rc-tit-cruces" style="color:#991b1b">⚠️ ${MPX.sinTipo.length} cobro${MPX.sinTipo.length>1?'s':''} MOPLEX sin tipo asignado</div>`;
    for (const s of MPX.sinTipo){
      html += `<div class="cruce-linea"><b>${s.paciente}</b> (${s.fecha}) — ${fmt(s.importe)}. Asigná la consulta/plantilla en <b>Consultas MOPLEX</b> y recalculá, si no no se reparte bien.</div>`;
    }
    html += `</div>`;
  }

  const franqVista = MPX.franquicia.filter(f => (!filtroProf || f.prof === filtroProf) && (!filtroArea || filtroArea === 'Especialidades'));
  let moplexPend = 0, moplexSald = 0, moplexTotalVista = 0;
  if (franqVista.length > 0){
    const saldos = window._moplexSaldos || {};
    html += `<h2 class="bloque-tit">🦶 MOPLEX (franquicia)</h2>
      <p style="color:#666;font-size:13px;margin:-6px 0 12px;">Lo que <b>el centro le tiene que pagar a MOPLEX</b> por las <b>plantillas</b> (las evaluaciones no pagan a MOPLEX). Esto <b>no es el estado de la consulta</b> (la consulta ya está realizada): es si vos ya le pagaste esa plantilla a la franquicia. Marcala como <b>pagada</b> a medida que vas arreglando con ellos. Solo cuenta desde junio 2026.</p>
      <table style="margin-bottom:8px;"><thead><tr>
        <th>Fecha</th><th>Paciente</th><th>Profesional</th><th>Tipo</th><th>Descripción</th><th class="num">$ a MOPLEX</th><th>Pago a MOPLEX</th>
      </tr></thead><tbody>`;
    franqVista.sort((a,b)=> (a.fecha||'').localeCompare(b.fecha||''));
    for (const f of franqVista){
      const esPlant = (f.tipo === 'Plantilla' && f.montoMoplex > 0.5);
      const saldado = !!saldos[f.tratId];
      if (esPlant){ moplexTotalVista += f.montoMoplex; if (saldado) moplexSald += f.montoMoplex; else moplexPend += f.montoMoplex; }
      let estadoCell = '<span style="color:#999">—</span>';
      if (esPlant){
        estadoCell = saldado
          ? `<button class="btn" style="background:#10b981;padding:5px 10px;font-size:12px" onclick="toggleMoplexSaldado(${f.tratId}, false)" title="Ya le pagaste esta plantilla a MOPLEX. Clic para deshacer.">✅ Pagado</button>`
          : `<button class="btn" style="background:#f59e0b;padding:5px 10px;font-size:12px" onclick="toggleMoplexSaldado(${f.tratId}, true)" title="Todavía no le pagaste esta plantilla a MOPLEX. Clic cuando la pagues.">⏳ Falta pagar</button>`;
      }
      html += `<tr${esPlant&&saldado?' style="opacity:.5"':''}>
        <td>${f.fecha}</td><td>${f.paciente}</td><td>${badge(f.prof)}</td>
        <td>${f.tipo}</td><td>${f.desc}</td>
        <td class="num">${fmt(f.montoMoplex)}</td><td>${estadoCell}</td></tr>`;
    }
    html += `<tr style="font-weight:700;background:#fef3c7;color:#92400e;"><td colspan="5">Pendiente de pagar a MOPLEX</td><td class="num">${fmt(moplexPend)}</td><td></td></tr>`;
    if (moplexSald > 0.5) html += `<tr style="font-weight:700;background:#d1fae5;color:#065f46;"><td colspan="5">Ya saldado con MOPLEX</td><td class="num">${fmt(moplexSald)}</td><td></td></tr>`;
    html += `</tbody></table>`;
  }

  // ===== BLOQUE PRODUCTIVIDAD: cuánto GENERÓ cada profesional (independiente de cuánto se lleva) =====
  html += `<h2 class="bloque-tit">📈 Productividad por profesional</h2>
    <p style="color:#666;font-size:13px;margin:-6px 0 12px;">Cuánto facturó cada uno por atender, sin importar cuánto se lleva. Para las dueñas (Jime y Lu) todo queda en el centro, pero igual cuenta su producción.</p>`;
  // Ordenar profesionales por lo generado (de mayor a menor)
  const profsProd = [...profs].sort((a,b)=> resumen[b].bruto - resumen[a].bruto);
  const totalGenerado = profs.reduce((s,p)=> s + resumen[p].bruto, 0);
  html += `<div class="prod-cards">`;
  for (const prof of profsProd){
    const r = resumen[prof];
    const pct = totalGenerado > 0 ? (r.bruto/totalGenerado*100) : 0;
    html += `
      <div class="prod-card">
        <div class="prod-nombre">${badge(prof)}</div>
        <div class="prod-monto">${fmt(r.bruto)}</div>
        <div class="prod-sub">${r.cant} pago${r.cant!==1?'s':''} · ${pct.toFixed(0)}% del total</div>
        <div class="prod-barra"><div class="prod-barra-fill" style="width:${pct}%;"></div></div>
      </div>`;
  }
  html += `</div>`;
  html += `<div class="prod-total">Total generado entre todos: <b>${fmt(totalGenerado)}</b></div>`;

  // ===== RESUMEN FINAL LINDO (después de todo) =====
  html += `<h2 class="bloque-tit">📋 Resumen final</h2>`;
  html += `<div class="resumen-cards">`;
  for (const prof of profs){
    const r = resumen[prof];
    const neto = r.prof - r.cobroProf;
    let estadoTxt, claseCard, iconoEstado;
    if (neto > 0.5){ estadoTxt = `PuntoBiO le paga ${fmt(neto)}`; claseCard = 'rc-pb'; iconoEstado = '⬆️'; }
    else if (neto < -0.5){ estadoTxt = `Le debe a PuntoBiO ${fmt(Math.abs(neto))}`; claseCard = 'rc-deb'; iconoEstado = '⬇️'; }
    else { estadoTxt = 'Saldado'; claseCard = 'rc-ok'; iconoEstado = '✅'; }
    html += `
      <div class="resumen-card ${claseCard}">
        <div class="rc-nombre">${badge(prof)}</div>
        <div class="rc-fila"><span>Le corresponde</span><b>${fmt(r.prof)}</b></div>
        <div class="rc-fila"><span>Ya cobró él/ella</span><b>${fmt(r.cobroProf)}</b></div>
        <div class="rc-fila"><span>Cobró PuntoBiO</span><b>${fmt(r.cobroPB)}</b></div>
        <div class="rc-estado">${iconoEstado} ${estadoTxt}</div>
      </div>`;
  }
  // MOPLEX como una "parte" más en el resumen final
  if (moplexTotalVista > 0.5){
    html += `
      <div class="resumen-card" style="border-top-color:#0d9488">
        <div class="rc-nombre">🦶 MOPLEX (franquicia)</div>
        <div class="rc-fila"><span>Total del período</span><b>${fmt(moplexTotalVista)}</b></div>
        <div class="rc-fila"><span>Ya saldado</span><b>${fmt(moplexSald)}</b></div>
        <div class="rc-estado" style="background:${moplexPend>0.5?'#fef3c7':'#d1fae5'};color:${moplexPend>0.5?'#92400e':'#065f46'}">${moplexPend>0.5?('Pendiente pagar '+fmt(moplexPend)):'Todo saldado ✅'}</div>
      </div>`;
  }
  html += `</div>`;

  // Resumen de cruces "quién le paga a quién" en texto claro
  // Los MASAJES DE REGALO (cumpleaños) entran acá: PB le debe esa plata al profesional
  // aunque no haya ningún pago del paciente (cortesía del centro).
  const regalosVista = (window._regalosMes || []).filter(s => !filtroProf || normProf(s.profesional) === filtroProf);
  const regPorProf = {}; const regCantProf = {}; let totalRegalos = 0;
  for (const s of regalosVista){
    const pr = normProf(s.profesional) || 'Vero';
    const m = Number(s.monto_profesional) || 0;
    regPorProf[pr] = (regPorProf[pr] || 0) + m;
    regCantProf[pr] = (regCantProf[pr] || 0) + 1;
    totalRegalos += m;
  }
  const hayRegalos = totalRegalos > 0.5;

  const hayDeudasCentro = Object.keys(deudasCentroVista).some(p => deudasCentroVista[p] > 0.5);
  if (netosFinalesVista.length > 0 || hayDeudasCentro || hayRegalos){
    html += `<div class="resumen-cruces"><div class="rc-tit-cruces">💸 Cobros a devolver</div>`;
    const ordenRC = ['Bruno','Male','Vero','Jime','Lu'];
    Object.keys(deudasCentroVista).sort((a,b)=>{const ia=ordenRC.indexOf(a),ib=ordenRC.indexOf(b);return (ia===-1?99:ia)-(ib===-1?99:ib);}).forEach(prof=>{
      if (deudasCentroVista[prof] > 0.5){
        html += `<div class="cruce-linea"><b>${prof}</b> cobró de más y debe <b>${fmt(deudasCentroVista[prof])}</b> al <b>centro (PuntoBiO)</b></div>`;
      }
    });
    for (const n of netosFinalesVista){
      html += `<div class="cruce-linea"><b>${n[0]}</b> le debe <b>${fmt(n[2])}</b> a <b>${n[1]}</b></div>`;
    }
    for (const prof of Object.keys(regPorProf)){
      if (regPorProf[prof] > 0.5){
        html += `<div class="cruce-linea">🎁 <b>PuntoBiO</b> le debe <b>${fmt(regPorProf[prof])}</b> a <b>${prof}</b> por ${regCantProf[prof]} masaje${regCantProf[prof]>1?'s':''} de regalo (cumpleaños)</div>`;
      }
    }
    html += `</div>`;
  }

  // ===== BLOQUE INFORMATIVO: pagos de obras sociales recibidos este mes =====
  // Solo informativo: NO se suma ni afecta los cálculos de la liquidación.
  // Muestra el TOTAL por profesional (el detalle fino está en el módulo Pagos Obras Sociales).
  const pagosOS = window._pagosOS || [];
  if (pagosOS.length > 0) {
    let totalOS = 0;
    const porProf = {};
    for (const p of pagosOS) {
      const prof = (p.profesional_nombre || 'Sin profesional').split(' ')[0];
      porProf[prof] = (porProf[prof] || 0) + (Number(p.monto) || 0);
      totalOS += (Number(p.monto) || 0);
    }

    html += `<h2 class="bloque-tit">💳 Pagos de obras sociales recibidos este mes</h2>
      <p style="color:#666;font-size:13px;margin:-6px 0 12px;">Informativo — estos pagos los recibió el profesional directamente en su cuenta. NO se incluyen en el cálculo de la liquidación. El detalle de cada obra social está en el módulo "Pagos Obras Sociales".</p>`;
    html += `<table style="margin-bottom:8px;"><thead><tr>
        <th>Profesional</th><th class="num">Total recibido de OS</th>
      </tr></thead><tbody>`;
    for (const prof of ordenarProfs(Object.keys(porProf))) {
      html += `<tr><td>${badge(prof)}</td><td class="num">${fmt(porProf[prof])}</td></tr>`;
    }
    html += `<tr style="font-weight:700;background:#dcfce7;color:#166534;"><td>TOTAL recibido de OS</td><td class="num">${fmt(totalOS)}</td></tr>`;
    html += `</tbody></table>`;
  }

  // ===== BLOQUE: MASAJES DE REGALO (cumpleaños) =====
  // El paciente no pagó nada (cortesía PuntoBiO): esta plata NO sale de los
  // pagos de arriba. PB se la paga al profesional aparte.
  if (regalosVista.length > 0){
    html += `<h2 class="bloque-tit">🎁 Masajes de regalo (cumpleaños)</h2>
      <p style="color:#666;font-size:13px;margin:-6px 0 12px;">El paciente no pagó nada (cortesía del centro), así que estos montos <b>no figuran en los pagos de arriba</b>: PuntoBiO se los paga al profesional aparte. Ya están sumados en "Cobros a devolver".</p>`;
    html += `<table style="margin-bottom:8px;"><thead><tr>
        <th>Fecha</th><th>Paciente</th><th>Cupón</th><th>Profesional</th><th class="num">Para el profesional</th>
      </tr></thead><tbody>`;
    for (const s of regalosVista){
      const t = s.tratamientos || {};
      const nom = (t.personas && t.personas.nombre) || '—';
      html += `<tr><td>${s.fecha}</td><td>${nom}</td><td style="font-family:monospace;">${t.codigo_id || '—'}</td><td>${badge(normProf(s.profesional) || 'Vero')}</td><td class="num">${fmt(Number(s.monto_profesional)||0)}</td></tr>`;
    }
    html += `<tr style="font-weight:700;background:#fce7f3;color:#9d174d;"><td colspan="4">TOTAL regalos (lo asume PuntoBiO)</td><td class="num">${fmt(totalRegalos)}</td></tr>`;
    html += `</tbody></table>`;
  }

  document.getElementById('resultado').innerHTML = html;
  window._grupos = resumen;
  // Guardar todo lo calculado para el PDF
  window._liq = { resumen, porMedio, crucesBrutos: crucesVista, netosFinales: netosFinalesVista, deudasCentro: deudasCentroVista, detalle, totalBruto, totalProf, totalCentro, profs, ordenarProfs, cant: cantVista, moplex: MPX, moplexFranq: franqVista, regalos: { lista: regalosVista, porProf: regPorProf, total: totalRegalos } };
}

function toggleDetalle(prof){
  const row = document.getElementById(`det-${prof}`);
  const arr = document.getElementById(`arr-${prof}`);
  const content = document.getElementById(`det-content-${prof}`);
  const profRow = arr.closest('tr');

  if (row.style.display === 'none'){
    // generar contenido detalle
    const g = window._grupos[prof];
    let html = `<table><thead><tr>
      <th>Fecha</th><th>Paciente</th><th>Tto</th><th>Práctica</th><th>Cobró</th>
      <th>Medio</th><th class="num">Bruto</th><th class="num">$ Prof</th><th class="num">$ Centro</th>
    </tr></thead><tbody>`;
    for (const p of g.pagos){
      const t = p.tratamientos || {};
      const per = (t.personas || {});
      html += `<tr>
        <td>${p.fecha}</td>
        <td>${per.nombre || '-'}</td>
        <td>${t.codigo_id || '-'}</td>
        <td>${practicaLabel(t.practica_codigo)}</td>
        <td>${normProf(p.quien_cobro) || '-'}</td>
        <td>${p.medio_pago || '-'}</td>
        <td class="num">${fmt(p.importe)}</td>
        <td class="num">${fmt(p.monto_profesional)}</td>
        <td class="num">${fmt(p.monto_centro)}</td>
      </tr>`;
    }
    html += `</tbody></table>`;
    content.innerHTML = html;
    row.style.display = '';
    arr.classList.add('open');
    profRow.classList.add('expanded');
  } else {
    row.style.display = 'none';
    arr.classList.remove('open');
    profRow.classList.remove('expanded');
  }
}

function exportarPDF(){
  if (!window._liq) { alert('Primero cargá los datos'); return; }
  const L = window._liq;
  const mes = document.getElementById('mes').value;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF('p', 'mm', 'a4');
  const azul = [30,159,224];
  const fmtP = n => '$' + (Number(n)||0).toLocaleString('es-AR',{maximumFractionDigits:0});

  // Encabezado
  doc.setFontSize(18); doc.setTextColor(...azul);
  doc.text('Liquidación PuntoBiO', 14, 18);
  doc.setFontSize(11); doc.setTextColor(80);
  doc.text(`Mes: ${mes}`, 14, 25);
  let y = 32;

  const tabla = (titulo, head, body, opts={}) => {
    doc.setFontSize(12); doc.setTextColor(...azul);
    doc.text(titulo, 14, y); y += 2;
    doc.autoTable({
      startY: y, head:[head], body,
      theme:'grid', headStyles:{fillColor:azul, fontSize:8}, bodyStyles:{fontSize:8},
      margin:{left:14,right:14}, ...opts
    });
    y = doc.lastAutoTable.finalY + 8;
  };

  // BLOQUE 1
  const b1 = L.profs.map(prof=>{
    const r = L.resumen[prof]; const neto = r.prof - r.cobroProf;
    let est = 'Saldado'; if (neto>0.5) est='PuntoBiO le debe'; else if (neto<-0.5) est='Le debe a PuntoBiO';
    return [prof, fmtP(r.prof), fmtP(r.centro), fmtP(r.cobroProf), fmtP(r.cobroPB), fmtP(neto), est];
  });
  tabla('1 - Resumen por profesional',
    ['Prof','Total Prof','Total Centro','Cobró Prof','Cobró PuntoBiO','Neto','Estado'], b1);

  // BLOQUE 2
  const b2 = L.ordenarProfs(Object.keys(L.porMedio)).map(prof=>{
    const m = L.porMedio[prof]; return [prof, fmtP(m.debito), fmtP(m.efectivo), fmtP(m.transferencia)];
  });
  if (b2.length) tabla('2 - Cobros por medio', ['Prof','Débito','Efectivo','Transferencia'], b2);

  // BLOQUE 3
  if (L.crucesBrutos.length){
    const b3 = L.crucesBrutos.map(c=>[c.fecha, c.cobro, c.prof, fmtP(c.mProf), fmtP(c.importe)]);
    tabla('3 - Cruces (uno cobró por otro)', ['Fecha','Cobró','Correspondía a','Cruce prof','Total'], b3);
  }

  // BLOQUE 4
  const dc = L.deudasCentro || {};
  const hayDC = Object.keys(dc).some(p=>dc[p]>0.5);
  if (L.netosFinales.length || hayDC){
    const b4 = [];
    const ordC = ['Bruno','Male','Vero','Jime','Lu'];
    Object.keys(dc).sort((a,b)=>{const ia=ordC.indexOf(a),ib=ordC.indexOf(b);return (ia===-1?99:ia)-(ib===-1?99:ib);}).forEach(prof=>{
      if (dc[prof]>0.5) b4.push([prof, 'PuntoBiO (centro)', fmtP(dc[prof])]);
    });
    L.netosFinales.forEach(n=> b4.push([n[0], n[1], fmtP(n[2])]));
    tabla('4 - Cruces netos (quién debe a quién)', ['Debe','A','Monto neto'], b4);
  }

  // BLOQUE 5 - detalle por profesional
  doc.setFontSize(12); doc.setTextColor(...azul);
  doc.text('5 - Detalle por profesional y práctica', 14, y); y += 4;
  const porProf = {};
  for (const k of Object.keys(L.detalle)){ const d=L.detalle[k]; (porProf[d.prof]=porProf[d.prof]||[]).push(d); }
  for (const prof of L.ordenarProfs(Object.keys(porProf))){
    const items = porProf[prof].sort((a,b)=>a.prac.localeCompare(b.prac));
    const body = items.map(d=>[d.prac, fmtP(d.cobrado), fmtP(d.mProf), fmtP(d.centro)]);
    doc.setFontSize(10); doc.setTextColor(40); doc.text(prof, 14, y); y += 1;
    doc.autoTable({ startY:y, head:[['Práctica','Cobrado','Profesional','PuntoBiO']], body,
      theme:'grid', headStyles:{fillColor:[120,120,120],fontSize:8}, bodyStyles:{fontSize:8}, margin:{left:14,right:14} });
    y = doc.lastAutoTable.finalY + 6;
    if (y > 260){ doc.addPage(); y = 20; }
  }

  // BLOQUE MOPLEX (franquicia) — usa la lista ya filtrada por profesional/área
  const franqPDF = (L.moplexFranq && L.moplexFranq.length) ? L.moplexFranq : ((L.moplex && L.moplex.franquicia) || []);
  if (franqPDF.length){
    if (y > 230){ doc.addPage(); y = 20; }
    const saldos = window._moplexSaldos || {};
    const bM = franqPDF.map(f=>{
      const est = (f.tipo==='Plantilla' && f.montoMoplex>0.5) ? (saldos[f.tratId]?'Pagado':'Falta pagar') : '—';
      return [f.fecha, f.paciente, f.prof, f.tipo, f.desc, fmtP(f.montoMoplex), est];
    });
    tabla('MOPLEX (franquicia) — plantillas a pagar',
      ['Fecha','Paciente','Prof','Tipo','Descripción','$ MOPLEX','Pago a MOPLEX'], bM);
  }

  // BLOQUE PRODUCTIVIDAD
  if (y > 230){ doc.addPage(); y = 20; }
  const totalGen = L.profs.reduce((s,p)=> s + L.resumen[p].bruto, 0);
  const bProd = [...L.profs].sort((a,b)=> L.resumen[b].bruto - L.resumen[a].bruto).map(prof=>{
    const r = L.resumen[prof]; const pct = totalGen>0 ? (r.bruto/totalGen*100) : 0;
    return [prof, fmtP(r.bruto), `${r.cant}`, `${pct.toFixed(0)}%`];
  });
  bProd.push(['TOTAL', fmtP(totalGen), '', '100%']);
  tabla('Productividad por profesional (lo que generó cada uno)',
    ['Prof','Generado','Pagos','% del total'], bProd);

  // ===== RESUMEN FINAL (estado de cada profesional) =====
  if (y > 210){ doc.addPage(); y = 20; }
  const bResumen = L.profs.map(prof=>{
    const r = L.resumen[prof];
    const neto = r.prof - r.cobroProf;
    let estado;
    if (neto > 0.5) estado = 'PuntoBiO le paga ' + fmtP(neto);
    else if (neto < -0.5) estado = 'Debe a PuntoBiO ' + fmtP(Math.abs(neto));
    else estado = 'Saldado';
    return [prof, fmtP(r.prof), fmtP(r.cobroProf), fmtP(r.cobroPB), estado];
  });
  tabla('Resumen final (estado de cada profesional)',
    ['Prof','Le corresponde','Ya cobró','Cobró PuntoBiO','Estado'], bResumen);

  // ===== COBROS A DEVOLVER =====
  const dcR = L.deudasCentro || {};
  const hayDcR = Object.keys(dcR).some(p=>dcR[p]>0.5);
  if ((L.netosFinales && L.netosFinales.length) || hayDcR){
    const bDev = [];
    const ordD = ['Bruno','Male','Vero','Jime','Lu'];
    Object.keys(dcR).sort((a,b)=>{const ia=ordD.indexOf(a),ib=ordD.indexOf(b);return (ia===-1?99:ia)-(ib===-1?99:ib);}).forEach(prof=>{
      if (dcR[prof]>0.5) bDev.push([prof, 'Cobró de más, debe al centro (PuntoBiO)', fmtP(dcR[prof])]);
    });
    (L.netosFinales||[]).forEach(n=> bDev.push([n[0], 'Le debe a ' + n[1], fmtP(n[2])]));
    tabla('Cobros a devolver', ['Quién','Detalle','Monto'], bDev);
  }

  doc.save(`Liquidacion_${mes}.pdf`);
}

// === RESTRICCIÓN "SOLO LO MÍO" en liquidaciones ===
// Si el usuario logueado tiene solo_lo_mio=TRUE, fija el filtro de profesional
// a su propio nombre y bloquea el dropdown para que no pueda ver a otros.
// A prueba de fallos: ante cualquier error, no restringe nada (ve todo, como hoy).
const EMAIL_A_NOMBRE_LIQ = {
  'brunitovelez99@gmail.com':    'Bruno',
  'loz.magdalena@gmail.com':     'Male',
  'veronicasandler@hotmail.com': 'Vero'
};
async function restringirSiSoloLoMio(){
  try {
    const { data: { user } } = await sb.auth.getUser();
    if (!user || !user.email) return;
    const email = user.email.toLowerCase().trim();
    const { data: persona } = await sb.from('personas')
      .select('id').ilike('email', email).maybeSingle();
    if (!persona) return;
    const { data: perm } = await sb.from('permisos_equipo')
      .select('solo_lo_mio').eq('persona_id', persona.id).maybeSingle();
    if (perm && perm.solo_lo_mio === true) {
      const nombre = EMAIL_A_NOMBRE_LIQ[email] || null;
      if (nombre) {
        window._soloLoMioLiq = true;   // marca: traer SOLO lo que lo involucra (no bajar datos del resto)
        const sel = document.getElementById('filtroProf');
        sel.value = nombre;        // fija a su nombre
        sel.disabled = true;        // no puede cambiarlo
        // Por las dudas: dejar solo su opción visible
        Array.from(sel.options).forEach(o => {
          if (o.value && o.value !== nombre) o.style.display = 'none';
        });
      }
    }
  } catch (e) {
    console.warn('No se pudo restringir liquidación (se muestra todo):', e.message);
  }
}

// Mostrar el mes elegido en el botón del calendario
document.getElementById('mesLabel').textContent = mesLabelDesde(document.getElementById('mes').value);
// Cargar al inicio (primero restringe si corresponde, después calcula)
restringirSiSoloLoMio().finally(() => cargar());
</script>
