<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feriados · PuntoBiO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#111;
    --bg2:#171717;
    --card:#1c1c1c;
    --card2:#222;
    --line:#2c2c2c;
    --blue:#1e9fe0;
    --blue-dim:rgba(30,159,224,.14);
    --txt:#f4f6f8;
    --muted:#9aa3ab;
    --muted2:#6c757d;
    --warn:#ffb24d;
    --warn-dim:rgba(255,178,77,.13);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Manrope',system-ui,sans-serif;
    background:
      radial-gradient(900px 500px at 100% -10%, rgba(30,159,224,.10), transparent 60%),
      radial-gradient(700px 400px at -10% 110%, rgba(30,159,224,.06), transparent 55%),
      var(--bg);
    color:var(--txt);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    padding:28px 18px 60px;
  }
  .wrap{max-width:760px;margin:0 auto}

  /* Header */
  .head{display:flex;align-items:flex-start;gap:14px;margin-bottom:6px}
  .head .ico{
    width:46px;height:46px;border-radius:13px;flex:0 0 auto;
    background:linear-gradient(145deg,var(--blue),#1577a8);
    display:grid;place-items:center;font-size:24px;
    box-shadow:0 8px 22px rgba(30,159,224,.28);
  }
  h1{font-size:26px;font-weight:800;letter-spacing:-.4px;line-height:1.1}
  .sub{color:var(--muted);font-size:14px;margin-top:4px;font-weight:500;max-width:560px}

  .divider{height:1px;background:var(--line);margin:22px 0}

  /* Próximo feriado */
  .next-label{
    font-size:11.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;
    color:var(--blue);margin-bottom:10px;display:flex;align-items:center;gap:7px
  }
  .next-label::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px var(--blue-dim)}
  .next-card{
    background:linear-gradient(135deg,rgba(30,159,224,.16),rgba(30,159,224,.04));
    border:1px solid rgba(30,159,224,.35);
    border-radius:18px;padding:22px 24px;display:flex;align-items:center;gap:20px;
    position:relative;overflow:hidden;
  }
  .next-card .big-date{display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(0,0,0,.25);border-radius:14px;padding:12px 18px;min-width:92px;flex:0 0 auto}
  .next-card .big-date .d{font-size:40px;font-weight:800;line-height:1;color:#fff}
  .next-card .big-date .m{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--blue);margin-top:4px}
  .next-card .info .dow{font-size:13px;color:var(--muted);font-weight:600;text-transform:capitalize}
  .next-card .info .mot{font-size:21px;font-weight:700;margin:3px 0 8px;letter-spacing:-.3px}
  .next-card .info .when{font-size:13.5px;color:var(--warn);font-weight:600}
  .closed-pill{
    display:inline-flex;align-items:center;gap:6px;background:var(--warn-dim);color:var(--warn);
    border:1px solid rgba(255,178,77,.3);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;
    letter-spacing:.3px;text-transform:uppercase;margin-top:10px
  }

  /* Lista */
  .section-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;margin:30px 0 12px}
  .list{display:flex;flex-direction:column;gap:9px}
  .row{
    display:flex;align-items:center;gap:16px;background:var(--card);
    border:1px solid var(--line);border-radius:14px;padding:14px 18px;transition:border-color .15s,transform .15s
  }
  .row:hover{border-color:#3a3a3a;transform:translateX(2px)}
  .row .date-box{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-width:58px;flex:0 0 auto;border-right:1px solid var(--line);padding-right:16px
  }
  .row .date-box .d{font-size:24px;font-weight:800;line-height:1}
  .row .date-box .m{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--blue);margin-top:2px}
  .row .meta{flex:1;min-width:0}
  .row .meta .mot{font-size:16px;font-weight:700;letter-spacing:-.2px}
  .row .meta .dow{font-size:13px;color:var(--muted);font-weight:500;text-transform:capitalize;margin-top:2px}
  .row .tag{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
    background:var(--warn-dim);color:var(--warn);border:1px solid rgba(255,178,77,.25);
    border-radius:999px;padding:4px 11px;flex:0 0 auto}

  /* Pasados */
  .row.past{opacity:.45;filter:saturate(.4)}
  .row.past .date-box .m,.row.past .tag{color:var(--muted2);background:transparent;border-color:var(--line)}
  .row.past .tag{background:#1a1a1a}

  /* Year badge */
  .year-head{display:flex;align-items:center;gap:12px;margin:30px 0 12px}
  .year-head .yr{font-size:18px;font-weight:800;color:var(--txt)}
  .year-head .ln{flex:1;height:1px;background:var(--line)}

  /* Estados */
  .state{text-align:center;padding:60px 20px;color:var(--muted)}
  .state .emo{font-size:42px;margin-bottom:14px;opacity:.7}
  .state.error{color:var(--warn)}
  .spinner{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
  @keyframes spin{to{transform:rotate(360deg)}}

  .foot{margin-top:34px;text-align:center;color:var(--muted2);font-size:12px;font-weight:500;line-height:1.6}
  .foot b{color:var(--muted)}

  @media(max-width:520px){
    body{padding:20px 12px 50px}
    h1{font-size:22px}
    .next-card{flex-direction:column;align-items:flex-start;gap:14px}
    .next-card .big-date{flex-direction:row;gap:8px;min-width:0;padding:8px 14px}
    .next-card .big-date .d{font-size:30px}
    .next-card .big-date .m{margin-top:0}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <div class="ico">📅</div>
    <div>
      <h1>Feriados PuntoBiO</h1>
      <div class="sub">Estos son los días en los que <b style="color:var(--warn)">el centro permanece cerrado</b>. Misma información para todo el equipo.</div>
    </div>
  </div>

  <div class="divider"></div>

  <div id="content">
    <div class="state"><div class="spinner"></div>Cargando feriados…</div>
  </div>

  <div class="foot">
    Calendario de feriados · <b>PuntoBiO</b> · Córdoba<br>
    Solo lectura — para cambios, avisá a Lu o Jime.
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://bqpjtoiictnzcasxfucf.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_yvuXDxrkRrhXwmZBnE_a_Q_zDBz0iDi';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const MESES_LARGO = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

  // Parseo manual para evitar corrimiento por zona horaria
  function parseFecha(str){
    const [y,m,d] = str.split('-').map(Number);
    return new Date(y, m-1, d);
  }
  function hoy0(){ const t=new Date(); t.setHours(0,0,0,0); return t; }

  function diasHasta(fecha){
    const ms = fecha - hoy0();
    return Math.round(ms / 86400000);
  }
  function textoCuando(n){
    if(n === 0) return 'Es HOY · cerrado';
    if(n === 1) return 'Es mañana';
    if(n < 7) return `En ${n} días`;
    if(n < 14) return 'La próxima semana';
    const sem = Math.round(n/7);
    if(n < 31) return `En ${sem} semanas`;
    return `En ${Math.round(n/30)} mes(es)`;
  }

  function rowHTML(f, esPasado){
    const fch = parseFecha(f.fecha);
    return `
      <div class="row ${esPasado?'past':''}">
        <div class="date-box">
          <div class="d">${fch.getDate()}</div>
          <div class="m">${MESES[fch.getMonth()]}</div>
        </div>
        <div class="meta">
          <div class="mot">${f.motivo || 'Feriado'}</div>
          <div class="dow">${DIAS[fch.getDay()]}</div>
        </div>
        <div class="tag">${esPasado ? 'Pasado' : '🔒 Cerrado'}</div>
      </div>`;
  }

  async function cargar(){
    const cont = document.getElementById('content');
    try{
      const { data, error } = await sb
        .from('feriados')
        .select('fecha, motivo')
        .order('fecha', { ascending: true });

      if(error) throw error;
      if(!data || data.length === 0){
        cont.innerHTML = `<div class="state"><div class="emo">🗓️</div>No hay feriados cargados todavía.</div>`;
        return;
      }

      const hoy = hoy0();
      const futuros = data.filter(f => parseFecha(f.fecha) >= hoy);
      const pasados = data.filter(f => parseFecha(f.fecha) < hoy);

      let html = '';

      // Próximo feriado destacado
      if(futuros.length){
        const p = futuros[0];
        const fch = parseFecha(p.fecha);
        const n = diasHasta(fch);
        html += `
          <div class="next-label">Próximo feriado</div>
          <div class="next-card">
            <div class="big-date">
              <div class="d">${fch.getDate()}</div>
              <div class="m">${MESES[fch.getMonth()]}</div>
            </div>
            <div class="info">
              <div class="dow">${DIAS[fch.getDay()]} · ${MESES_LARGO[fch.getMonth()]} ${fch.getFullYear()}</div>
              <div class="mot">${p.motivo || 'Feriado'}</div>
              <div class="when">${textoCuando(n)}</div>
              <div class="closed-pill">🔒 El centro estará cerrado</div>
            </div>
          </div>`;
      }

      // Lista de próximos (agrupada por año)
      if(futuros.length > 1){
        html += `<div class="section-title">Todos los próximos</div>`;
        let anioActual = null;
        const list = futuros.slice(1);
        // si hay varios años, los separo con encabezado de año
        const anios = [...new Set(list.map(f=>parseFecha(f.fecha).getFullYear()))];
        if(anios.length > 1){
          anios.forEach(yr=>{
            html += `<div class="year-head"><span class="yr">${yr}</span><span class="ln"></span></div><div class="list">`;
            list.filter(f=>parseFecha(f.fecha).getFullYear()===yr).forEach(f=> html += rowHTML(f,false));
            html += `</div>`;
          });
        } else {
          html += `<div class="list">`;
          list.forEach(f=> html += rowHTML(f,false));
          html += `</div>`;
        }
      } else if(futuros.length === 0){
        html += `<div class="state"><div class="emo">✅</div>No quedan feriados próximos este año.</div>`;
      }

      // Pasados (atenuados)
      if(pasados.length){
        html += `<div class="section-title">Feriados que ya pasaron</div><div class="list">`;
        pasados.reverse().forEach(f=> html += rowHTML(f,true));
        html += `</div>`;
      }

      cont.innerHTML = html;

    }catch(e){
      cont.innerHTML = `<div class="state error"><div class="emo">⚠️</div>
        No se pudieron cargar los feriados.<br><span style="font-size:13px;color:var(--muted)">${(e && e.message) ? e.message : 'Revisá la conexión o los permisos de la tabla.'}</span></div>`;
      console.error(e);
    }
  }

  cargar();
</script>
</body>
</html>
