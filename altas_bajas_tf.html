<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>PuntoBiO — Altas y Bajas · Terapia Física</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --azul: #1e9fe0; --azul-soft: #dbeafe;
    --bg: #f8fafc; --bg-card: #ffffff; --bg-hover: #f1f5f9; --border: #e5e7eb;
    --text: #0f172a; --text-dim: #64748b;
    --rojo: #dc2626; --rojo-soft: #fee2e2;
    --naranja: #d97706; --naranja-soft: #fef3c7;
    --verde: #16a34a; --verde-soft: #dcfce7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; padding: 20px; }
  h1 { color: var(--azul); margin-bottom: 6px; font-size: 22px; }
  .subtitulo { color: var(--text-dim); font-size: 13px; margin-bottom: 20px; }
  .controles { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 20px; }
  select, input { background: var(--bg-card); color: var(--text); border: 1px solid var(--border); padding: 8px 12px; border-radius: 6px; font-size: 14px; font-family: inherit; }
  select:focus, input:focus { outline: none; border-color: var(--azul); }
  label { color: var(--text-dim); font-size: 13px; }
  .btn-refrescar { background: var(--bg-card); color: var(--text-dim); border: 1px solid var(--border); padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .btn-refrescar:hover { background: var(--bg-hover); color: var(--text); }

  /* Vistazo rápido de bajas automáticas */
  .vistazo-auto { background: var(--bg-card); border: 1px solid var(--naranja); border-left: 4px solid var(--naranja); border-radius: 10px; padding: 14px 18px; margin-bottom: 18px; display: flex; gap: 28px; align-items: center; flex-wrap: wrap; }
  .vistazo-auto .titulo { font-size: 12px; font-weight: 700; color: var(--naranja); text-transform: uppercase; letter-spacing: 0.5px; }
  .vistazo-auto .stat { text-align: center; }
  .vistazo-auto .stat .num { font-size: 22px; font-weight: 700; color: var(--naranja); }
  .vistazo-auto .stat .lbl { font-size: 11px; color: var(--text-dim); }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .card-label { color: var(--text-dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .card-value { font-size: 24px; font-weight: 600; color: var(--text); }
  .card.rojo { border-color: var(--rojo); } .card.rojo .card-value { color: var(--rojo); }
  .card.verde { border-color: var(--verde); } .card.verde .card-value { color: var(--verde); }
  .card.azul-card { border-color: var(--azul); } .card.azul-card .card-value { color: var(--azul); }
  .card-sub { font-size: 11px; color: var(--text-dim); margin-top: 4px; }
  .neto-pos { color: var(--verde) !important; }
  .neto-neg { color: var(--rojo) !important; }

  .filtros { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .filtro-btn { background: var(--bg-card); color: var(--text-dim); border: 1px solid var(--border); padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 13px; transition: all 0.15s; }
  .filtro-btn:hover { background: var(--bg-hover); }
  .filtro-btn.active { background: var(--azul-soft); color: var(--azul); border-color: var(--azul); }

  .buscador { margin-bottom: 12px; }
  .buscador input { width: 100%; max-width: 360px; }
  .resumen { color: var(--text-dim); font-size: 13px; margin-bottom: 12px; }

  table { width: 100%; border-collapse: collapse; background: var(--bg-card); border-radius: 10px; overflow: hidden; }
  thead { background: #f8fafc; }
  th { padding: 12px; text-align: left; color: var(--text-dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
  td { padding: 12px; border-top: 1px solid var(--border); vertical-align: middle; }
  tr.row { cursor: pointer; }
  tr.row:hover { background: var(--bg-hover); }
  .alumno-nombre { font-weight: 600; }
  .alumno-id { color: var(--text-dim); font-size: 11px; margin-left: 6px; }
  .fecha-cell { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .motivo-cell { color: var(--text-dim); font-size: 13px; }
  .plan-cell { font-variant-numeric: tabular-nums; }

  .badge { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; display: inline-block; white-space: nowrap; }
  .badge.alta { background: var(--verde-soft); color: var(--verde); }
  .badge.reingreso { background: var(--azul-soft); color: var(--azul); }
  .badge.baja-manual { background: var(--rojo-soft); color: var(--rojo); }
  .badge.baja-auto { background: var(--naranja-soft); color: var(--naranja); }
  .badge.revertida { background: #f1f5f9; color: #64748b; border: 1px dashed #cbd5e1; }

  /* Movimientos revertidos: quedan visibles para trazabilidad pero NO suman en los conteos */
  tr.anulada { opacity: 0.55; }
  tr.anulada .alumno-nombre { font-weight: 500; }

  .empty, .loading { text-align: center; padding: 40px; color: var(--text-dim); }
</style>
</head>
<body>

  <h1>📋 Altas y Bajas · Terapia Física</h1>
  <div class="subtitulo">Movimientos del padrón TF: quién entró, quién volvió y quién se dio de baja. Tocá una fila para abrir la ficha en Padrón.</div>

  <div class="controles">
    <label>Período a ver:</label>
    <select id="selPeriodo" onchange="cambiarPeriodo()"></select>
    <button class="btn-refrescar" onclick="recargar()">🔄 Actualizar</button>
  </div>

  <!-- Vistazo rápido: bajas automáticas (independiente del período elegido) -->
  <div class="vistazo-auto" id="vistazoAuto" style="display:none;">
    <div class="titulo">🤖 Bajas automáticas por impago</div>
    <div class="stat"><div class="num" id="autoMes">0</div><div class="lbl">este mes</div></div>
    <div class="stat"><div class="num" id="autoMesAnt">0</div><div class="lbl">mes pasado</div></div>
    <div class="stat"><div class="num" id="autoTotal">0</div><div class="lbl">de siempre</div></div>
    <div class="stat"><div class="num" id="autoRevert" style="color:var(--text-dim)">0</div><div class="lbl">revertidas (no cuentan)</div></div>
  </div>

  <div class="cards" id="cards"></div>

  <div class="filtros" id="filtros">
    <button class="filtro-btn active" data-vista="TODO" onclick="cambiarVista('TODO')">Todo</button>
    <button class="filtro-btn" data-vista="BAJAS" onclick="cambiarVista('BAJAS')">❌ Bajas</button>
    <button class="filtro-btn" data-vista="ALTAS" onclick="cambiarVista('ALTAS')">✅ Altas y reingresos</button>
    <button class="filtro-btn" data-vista="AUTO" onclick="cambiarVista('AUTO')">🤖 Solo automáticas</button>
    <button class="filtro-btn" data-vista="REVERTIDAS" onclick="cambiarVista('REVERTIDAS')">🔄 Revertidas</button>
  </div>

  <div class="buscador">
    <input id="buscar" type="text" placeholder="🔍 Buscar por nombre o ID..." oninput="buscarInput(this.value)">
  </div>

  <div class="resumen" id="resumen"></div>

  <div id="tabla-wrap"><div class="loading">Cargando movimientos...</div></div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
  const supa = createClient('https://bqpjtoiictnzcasxfucf.supabase.co', 'sb_publishable_yvuXDxrkRrhXwmZBnE_a_Q_zDBz0iDi', { auth: { lock: (name, acquireTimeout, fn) => fn() } });

  const $ = id => document.getElementById(id);

  // ===== Fechas =====
  const HOY = new Date();
  const MES_ACTUAL = `${HOY.getFullYear()}-${String(HOY.getMonth() + 1).padStart(2, '0')}`;
  function mesAnterior(yyyymm) {
    const [y, m] = yyyymm.split('-').map(Number);
    const d = new Date(y, m - 2, 1);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  }
  const MES_ANT = mesAnterior(MES_ACTUAL);

  const MESES_ES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  function etiquetaMes(yyyymm) {
    const [y, m] = yyyymm.split('-').map(Number);
    return `${MESES_ES[m - 1]} ${y}`;
  }
  function fmtFecha(iso) {
    if (!iso) return '—';
    const s = String(iso).slice(0, 10);
    const [y, m, d] = s.split('-');
    if (!y || !m || !d) return s;
    return `${d}/${m}/${y}`;
  }

  // ===== Estado =====
  let MOVIMIENTOS = [];      // lista plana de eventos
  let periodoSel = MES_ACTUAL; // 'HISTORICO' o 'YYYY-MM'
  let vistaSel = 'TODO';     // TODO | BAJAS | ALTAS | AUTO
  let busca = '';

  // ===== REGLA ANTI-NÚMEROS-FANTASMA =====
  // Una baja automática por impago es TEMPORAL: si el alumno pagó ese mismo día, al otro
  // o a la semana, nunca se fue. Entonces no cuenta la baja NI cuenta la vuelta como
  // alta/reingreso: el movimiento se anula de los dos lados y queda "sin movimiento".
  // Solo cuentan como alta los nuevos y los que vuelven después de DIAS_GRACIA o más.
  const DIAS_GRACIA = 15;            // ← el corte, en días. Se cambia acá y listo.
  const APLICAR_A_MANUALES = false;  // ← poné true si querés la misma regla en bajas manuales.

  function diasEntre(desde, hasta) {
    const a = new Date(desde + 'T00:00:00'), b = new Date(hasta + 'T00:00:00');
    return Math.round((b - a) / 86400000);
  }

  // Clasifica baja automática (por impago) vs manual, mirando el texto del motivo.
  // Si tus bajas automáticas usan otra etiqueta, se ajusta acá en una línea.
  function esBajaAutomatica(motivo) {
    const m = (motivo || '').toLowerCase();
    return m.includes('autom') || m.includes('impago');
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  // ===== Paginador (evita el corte silencioso a 1000 filas) =====
  async function queryAll(tabla, cols, filtros) {
    const PAGE = 1000;
    let desde = 0, acc = [];
    while (true) {
      let q = supa.from(tabla).select(cols).range(desde, desde + PAGE - 1);
      if (typeof filtros === 'function') q = filtros(q);
      const { data, error } = await q;
      if (error) throw error;
      acc = acc.concat(data || []);
      if (!data || data.length < PAGE) break;
      desde += PAGE;
    }
    return acc;
  }

  // ===== Carga =====
  async function cargar() {
    $('tabla-wrap').innerHTML = '<div class="loading">Cargando movimientos...</div>';
    try {
      const insc = await queryAll(
        'inscripciones_tf',
        'id, persona_id, plan, estado, fecha_alta, fecha_baja, motivo_baja, fecha_reingreso, fecha_reactivacion_prop, motivo_reingreso, clasificacion_ingreso'
      );

      // Personas (en tandas de 300 ids para no pasarnos de URL)
      const ids = [...new Set(insc.map(i => i.persona_id).filter(x => x != null))];
      const mapPers = {};
      for (let i = 0; i < ids.length; i += 300) {
        const chunk = ids.slice(i, i + 300);
        const { data: pers, error } = await supa.from('personas').select('id, nombre').in('id', chunk);
        if (error) throw error;
        (pers || []).forEach(p => { mapPers[p.id] = p.nombre || `(sin nombre #${p.id})`; });
      }

      // Actividad de cada persona: fecha más temprana en que pagó o asistió (presente).
      // Sirve para 2 cosas: (1) si nunca tuvo actividad → no se muestra; (2) si una "alta" tiene
      // actividad de meses anteriores, en realidad es un cambio de plan, no un alta nueva.
      const [pagos, asis] = await Promise.all([
        queryAll('pagos_tf', 'inscripcion_id, fecha'),
        queryAll('asistencia', 'persona_id, fecha', q => q.eq('estado', 'presente'))
      ]);
      const inscPersona = {}; insc.forEach(i => { inscPersona[i.id] = i.persona_id; });
      const primeraActividad = {}; // persona_id -> 'YYYY-MM-DD' más temprana
      const marcar = (pid, fecha) => {
        if (pid == null || !fecha) return;
        const f = String(fecha).slice(0, 10);
        if (!primeraActividad[pid] || f < primeraActividad[pid]) primeraActividad[pid] = f;
      };
      (pagos || []).forEach(p => marcar(inscPersona[p.inscripcion_id], p.fecha));
      (asis || []).forEach(a => marcar(a.persona_id, a.fecha));
      const arranco = (i) => primeraActividad[i.persona_id] != null;

      // Señales de RETORNO para la regla anti-fantasmas: pagos por inscripción y
      // asistencias por persona. Sirven para detectar la vuelta aunque el sistema
      // no haya grabado fecha_reingreso (que es justo el caso que no cerraba).
      const pagosPorInsc = {};
      (pagos || []).forEach(p => {
        if (p.inscripcion_id == null || !p.fecha) return;
        (pagosPorInsc[p.inscripcion_id] = pagosPorInsc[p.inscripcion_id] || []).push(String(p.fecha).slice(0, 10));
      });
      const asisPorPersona = {};
      (asis || []).forEach(a => {
        if (a.persona_id == null || !a.fecha) return;
        (asisPorPersona[a.persona_id] = asisPorPersona[a.persona_id] || []).push(String(a.fecha).slice(0, 10));
      });

      // Aplanar a eventos
      MOVIMIENTOS = [];
      insc.forEach(i => {
        // Si nunca arrancó (ni pagó ni asistió), no se muestra NINGÚN movimiento de esa persona.
        if (!arranco(i)) return;
        // Los bonificados (códigos BON) no generan NINGÚN movimiento: no facturan, así que
        // no cuentan ni como alta/reingreso ni como baja. Entran y salen sin mover la aguja.
        if (String(i.plan || '').toUpperCase().includes('BON')) return;
        const nombre = mapPers[i.persona_id] || `(sin nombre #${i.persona_id})`;
        const altaD = i.fecha_alta ? String(i.fecha_alta).slice(0, 10) : null;
        const reingD = i.fecha_reingreso ? String(i.fecha_reingreso).slice(0, 10) : null;
        // Reactivación por cobro proporcional (Camino 1): NO toca fecha_reingreso
        // (a propósito, para conservar los recuperatorios), así que se registra aparte.
        const reactPropD = i.fecha_reactivacion_prop ? String(i.fecha_reactivacion_prop).slice(0, 10) : null;
        // Clasificación CONFIABLE: lo que se eligió al dar el alta (NUEVO / REINGRESO_*).
        // (No mirar las fechas: el alta setea fecha_reingreso aunque sea NUEVO si ya existía la fila.)
        const clasif = String(i.clasificacion_ingreso || '').toUpperCase();
        let esReingreso;
        if (clasif) {
          esReingreso = clasif.startsWith('REINGRESO');
        } else {
          // Dato viejo sin clasificación: reingreso si hay fecha de reingreso distinta del alta.
          esReingreso = !!(reingD && reingD !== altaD);
        }
        // Fecha de la entrada vigente (la más reciente)
        let entradaFecha = reingD || altaD;
        // Si hubo una reactivación proporcional posterior, ESA es la entrada vigente
        // y cuenta como reingreso (sin esto, el Camino 1 no figuraba en Altas/Bajas).
        if (reactPropD && (!entradaFecha || reactPropD >= entradaFecha)) {
          entradaFecha = reactPropD;
          esReingreso = true;
        }
        // ¿Tenía actividad en un MES ANTERIOR a esta alta? → es cambio de plan, no alta nueva.
        const actMes = primeraActividad[i.persona_id] ? primeraActividad[i.persona_id].slice(0, 7) : null;
        const entradaMes = entradaFecha ? entradaFecha.slice(0, 7) : null;
        const tuvoActividadAntes = actMes && entradaMes && actMes < entradaMes;
        if (entradaFecha) {
          if (esReingreso) {
            MOVIMIENTOS.push({ fecha: entradaFecha, tipo: 'REINGRESO', origen: null, persona_id: i.persona_id, nombre, plan: i.plan, motivo: i.motivo_reingreso });
          } else if (!tuvoActividadAntes) {
            // Alta nueva real (sin actividad previa). Si tuvo actividad antes, es un cambio de plan → se omite.
            MOVIMIENTOS.push({ fecha: entradaFecha, tipo: 'ALTA', origen: null, persona_id: i.persona_id, nombre, plan: i.plan, motivo: null });
          }
        }
        if (i.fecha_baja) {
          const bajaD = String(i.fecha_baja).slice(0, 10);
          // ¿Hay rastro de que volvió? Reingreso, reactivación proporcional, un pago
          // en esta inscripción o una asistencia posterior a la baja.
          const senales = [];
          if (reingD && reingD > bajaD) senales.push(reingD);
          if (reactPropD && reactPropD > bajaD) senales.push(reactPropD);
          (pagosPorInsc[i.id] || []).forEach(f => { if (f >= bajaD) senales.push(f); });
          (asisPorPersona[i.persona_id] || []).forEach(f => { if (f > bajaD) senales.push(f); });
          senales.sort();
          MOVIMIENTOS.push({
            fecha: bajaD, tipo: 'BAJA',
            origen: esBajaAutomatica(i.motivo_baja) ? 'AUTO' : 'MANUAL',
            persona_id: i.persona_id, nombre, plan: i.plan, motivo: i.motivo_baja,
            retorno: senales.length ? senales[0] : null
          });
        }
      });

      aplicarReglaFantasmas();

      MOVIMIENTOS.sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''));
      construirSelectorPeriodo();
      render();
    } catch (e) {
      console.error(e);
      $('tabla-wrap').innerHTML = `<div class="empty">❌ Error al cargar: ${escapeHtml(e.message || 'desconocido')}</div>`;
    }
  }

  // ===== Regla anti-fantasmas: emparejar baja ↔ vuelta y anular las dos si fue temporal =====
  function aplicarReglaFantasmas() {
    const porPersona = {};
    MOVIMIENTOS.forEach(m => {
      (porPersona[m.persona_id] = porPersona[m.persona_id] || []).push(m);
    });

    Object.keys(porPersona).forEach(pid => {
      const lista = porPersona[pid];
      // Ascendente. Si una baja y una entrada caen el mismo día, primero la baja.
      lista.sort((a, b) => a.fecha.localeCompare(b.fecha) || (a.tipo === 'BAJA' ? -1 : 1));

      lista.forEach((m, idx) => {
        if (m.tipo !== 'BAJA') return;
        if (m.origen !== 'AUTO' && !APLICAR_A_MANUALES) return;

        // Ventana: hasta la próxima baja de la misma persona (para no cruzar ciclos).
        const resto = lista.slice(idx + 1);
        const corte = resto.findIndex(x => x.tipo === 'BAJA');
        const ventana = corte === -1 ? resto : resto.slice(0, corte);
        const topeFecha = corte === -1 ? null : resto[corte].fecha;

        // Candidato 1: un movimiento de entrada posterior ya registrado.
        const entrada = ventana.find(x => x.tipo === 'ALTA' || x.tipo === 'REINGRESO');
        // Candidato 2: la señal de retorno (pago/asistencia) aunque no haya generado movimiento.
        const candidatos = [];
        if (entrada) candidatos.push(entrada.fecha);
        if (m.retorno && (!topeFecha || m.retorno < topeFecha)) candidatos.push(m.retorno);
        if (!candidatos.length) return;

        candidatos.sort();
        const dias = diasEntre(m.fecha, candidatos[0]);
        if (dias >= DIAS_GRACIA) return; // se fue de verdad: la baja y el reingreso cuentan

        // Fue temporal → no se fue nunca. No cuenta la baja...
        m.anulado = true;
        m.diasFuera = dias;
        m.fechaRetorno = candidatos[0];
        // ...y tampoco cuenta la vuelta, si esa vuelta cayó dentro de la misma ventana.
        if (entrada && diasEntre(m.fecha, entrada.fecha) < DIAS_GRACIA) {
          entrada.anulado = true;
          entrada.diasFuera = dias;
          entrada.fechaRetorno = candidatos[0];
        }
      });
    });
  }

  const cuenta = m => !m.anulado;

  // ===== Selector de período =====
  function construirSelectorPeriodo() {
    const sel = $('selPeriodo');
    const mesesConDatos = [...new Set(MOVIMIENTOS.map(m => m.fecha.slice(0, 7)))];
    // Garantizar que el mes actual y el anterior siempre estén, aunque no haya movimientos
    if (!mesesConDatos.includes(MES_ACTUAL)) mesesConDatos.push(MES_ACTUAL);
    if (!mesesConDatos.includes(MES_ANT)) mesesConDatos.push(MES_ANT);
    mesesConDatos.sort((a, b) => b.localeCompare(a)); // más nuevo primero

    let html = '<option value="HISTORICO">📚 Histórico (de siempre)</option>';
    mesesConDatos.forEach(mm => {
      let etq = etiquetaMes(mm);
      if (mm === MES_ACTUAL) etq += ' (este mes)';
      else if (mm === MES_ANT) etq += ' (mes pasado)';
      const selAttr = mm === periodoSel ? ' selected' : '';
      html += `<option value="${mm}"${selAttr}>${etq}</option>`;
    });
    sel.innerHTML = html;
    if (periodoSel === 'HISTORICO') sel.value = 'HISTORICO';
  }

  // ===== Filtros =====
  function movimientosDelPeriodo() {
    if (periodoSel === 'HISTORICO') return MOVIMIENTOS;
    return MOVIMIENTOS.filter(m => m.fecha.slice(0, 7) === periodoSel);
  }

  function aplicarVistaYBusqueda(lista) {
    let out = lista;
    if (vistaSel === 'BAJAS') out = out.filter(m => m.tipo === 'BAJA' && cuenta(m));
    else if (vistaSel === 'ALTAS') out = out.filter(m => (m.tipo === 'ALTA' || m.tipo === 'REINGRESO') && cuenta(m));
    else if (vistaSel === 'AUTO') out = out.filter(m => m.tipo === 'BAJA' && m.origen === 'AUTO' && cuenta(m));
    else if (vistaSel === 'REVERTIDAS') out = out.filter(m => m.anulado);
    if (busca.trim()) {
      const q = busca.trim().toLowerCase();
      out = out.filter(m => (m.nombre || '').toLowerCase().includes(q) || String(m.persona_id).includes(q));
    }
    return out;
  }

  // ===== Render =====
  function render() {
    // Vistazo rápido de automáticas (siempre sobre el total, no depende del período)
    const esAuto = m => m.tipo === 'BAJA' && m.origen === 'AUTO';
    const autoMes = MOVIMIENTOS.filter(m => esAuto(m) && cuenta(m) && m.fecha.slice(0, 7) === MES_ACTUAL).length;
    const autoMesAnt = MOVIMIENTOS.filter(m => esAuto(m) && cuenta(m) && m.fecha.slice(0, 7) === MES_ANT).length;
    const autoTotal = MOVIMIENTOS.filter(m => esAuto(m) && cuenta(m)).length;
    const autoRevert = MOVIMIENTOS.filter(m => esAuto(m) && m.anulado).length;
    $('autoMes').textContent = autoMes;
    $('autoMesAnt').textContent = autoMesAnt;
    $('autoTotal').textContent = autoTotal;
    $('autoRevert').textContent = autoRevert;
    $('vistazoAuto').style.display = (autoTotal + autoRevert) > 0 ? 'flex' : 'none';

    // Cards del período
    const periodo = movimientosDelPeriodo();
    const bajas = periodo.filter(m => m.tipo === 'BAJA' && cuenta(m));
    const bajasAuto = bajas.filter(m => m.origen === 'AUTO').length;
    const bajasManual = bajas.length - bajasAuto;
    const altas = periodo.filter(m => m.tipo === 'ALTA' && cuenta(m)).length;
    const reingresos = periodo.filter(m => m.tipo === 'REINGRESO' && cuenta(m)).length;
    const revertidos = periodo.filter(m => m.anulado).length;
    const neto = (altas + reingresos) - bajas.length;
    const netoCls = neto > 0 ? 'neto-pos' : (neto < 0 ? 'neto-neg' : '');
    const netoTxt = neto > 0 ? `+${neto}` : `${neto}`;

    const etqPer = periodoSel === 'HISTORICO' ? 'de siempre' : etiquetaMes(periodoSel);

    $('cards').innerHTML = `
      <div class="card rojo">
        <div class="card-label">❌ Bajas (${escapeHtml(etqPer)})</div>
        <div class="card-value">${bajas.length}</div>
        <div class="card-sub">🤖 ${bajasAuto} automáticas · ✋ ${bajasManual} manuales</div>
      </div>
      <div class="card verde">
        <div class="card-label">✅ Altas nuevas</div>
        <div class="card-value">${altas}</div>
        <div class="card-sub">Inscripciones por primera vez</div>
      </div>
      <div class="card azul-card">
        <div class="card-label">🔁 Reingresos</div>
        <div class="card-value">${reingresos}</div>
        <div class="card-sub">Alumnos reactivados</div>
      </div>
      <div class="card verde">
        <div class="card-label">➕ Total entradas</div>
        <div class="card-value">${altas + reingresos}</div>
        <div class="card-sub">Altas nuevas + reingresos</div>
      </div>
      <div class="card">
        <div class="card-label">📊 Neto del período</div>
        <div class="card-value ${netoCls}">${netoTxt}</div>
        <div class="card-sub">(altas + reingresos) − bajas</div>
      </div>
      <div class="card">
        <div class="card-label">🔄 Revertidos (no cuentan)</div>
        <div class="card-value" style="color:var(--text-dim)">${revertidos}</div>
        <div class="card-sub">Baja + vuelta en menos de ${DIAS_GRACIA} días</div>
      </div>
    `;

    // Tabla
    const lista = aplicarVistaYBusqueda(periodo);
    const totalPeriodo = periodo.length;
    const notaRev = revertidos ? ` · 🔄 ${revertidos} revertido(s) no cuentan` : '';
    $('resumen').textContent = `Mostrando ${lista.length} de ${totalPeriodo} movimiento(s) · ${escapeHtml(etqPer)}${notaRev}`;

    if (!lista.length) {
      $('tabla-wrap').innerHTML = '<div class="empty">No hay movimientos para este filtro.</div>';
      return;
    }

    const filas = lista.map(m => {
      let badge = '';
      let motivo = m.motivo || '—';
      if (m.anulado) {
        const qué = m.tipo === 'BAJA' ? 'Baja' : 'Vuelta';
        badge = `<span class="badge revertida">🔄 ${qué} revertida · ${m.diasFuera} d</span>`;
        motivo = m.tipo === 'BAJA'
          ? `No cuenta — volvió el ${fmtFecha(m.fechaRetorno)} (${m.diasFuera} días)`
          : `No cuenta — nunca se fue (baja revertida a los ${m.diasFuera} días)`;
      }
      else if (m.tipo === 'ALTA') badge = '<span class="badge alta">✅ Alta nueva</span>';
      else if (m.tipo === 'REINGRESO') badge = '<span class="badge reingreso">🔁 Reingreso</span>';
      else if (m.tipo === 'BAJA' && m.origen === 'AUTO') badge = '<span class="badge baja-auto">🤖 Baja automática</span>';
      else badge = '<span class="badge baja-manual">✋ Baja manual</span>';
      return `
        <tr class="row${m.anulado ? ' anulada' : ''}" onclick="abrirEnPadron(${m.persona_id})">
          <td class="fecha-cell">${fmtFecha(m.fecha)}</td>
          <td><span class="alumno-nombre">${escapeHtml(m.nombre)}</span><span class="alumno-id">#${m.persona_id}</span></td>
          <td>${badge}</td>
          <td class="plan-cell">${escapeHtml(m.plan || '—')}</td>
          <td class="motivo-cell">${escapeHtml(motivo)}</td>
        </tr>`;
    }).join('');

    $('tabla-wrap').innerHTML = `
      <table>
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Alumno</th>
            <th>Movimiento</th>
            <th>Plan</th>
            <th>Motivo / Detalle</th>
          </tr>
        </thead>
        <tbody>${filas}</tbody>
      </table>`;
  }

  // ===== Interacción =====
  window.cambiarPeriodo = () => { periodoSel = $('selPeriodo').value; render(); };
  window.cambiarVista = (v) => {
    vistaSel = v;
    document.querySelectorAll('.filtro-btn').forEach(b => b.classList.toggle('active', b.dataset.vista === v));
    render();
  };
  window.buscarInput = (v) => { busca = v; render(); };
  window.recargar = () => cargar();

  // Abrir la ficha de la persona en Padrón (mismo mecanismo que el resto de los iframes)
  window.abrirEnPadron = (personaId) => {
    if (!personaId) return;
    try { window.parent.postMessage({ tipo: 'ABRIR_EN_PADRON', personaId }, '*'); } catch (e) {}
  };

  // ===== Realtime: refresca solo cuando cambia inscripciones_tf =====
  let rtTimer = null;
  function refrescarPorRealtime() {
    clearTimeout(rtTimer);
    rtTimer = setTimeout(() => cargar(), 1500);
  }
  try {
    supa.channel('altas-bajas-tf-vivo')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'inscripciones_tf' }, refrescarPorRealtime)
      .subscribe();
  } catch (e) { console.warn('realtime altas-bajas:', e); }

  cargar();
</script>
</body>
</html>
