<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sesiones · Diario · PuntoBiO</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f7;--bg-elev:#fff;--bg-elev-2:#eef0f3;--border:#d8dde3;--border-light:#c5cbd2;--text:#1a1d21;--text-dim:#5a6068;--text-muted:#9097a0;--accent:#1e9fe0;--accent-dim:#1782b5;--accent-bg:#e0f1fb;--c-fisio:#4f9c2f;--c-fisio-bg:#e6f3dc;--c-osteo:#c43d62;--c-osteo-bg:#fbe2e9;--c-dlm:#7a5db8;--c-dlm-bg:#ece7f7;--c-puncion:#d63838;--c-puncion-bg:#fce0e0;--c-suelo:#d68330;--c-suelo-bg:#fdebd6;--c-masajes:#b7791f;--c-masajes-bg:#fdf3df;--c-sobre:#c79c00;--c-sobre-bg:#fff5cc;--c-tm:#0099a8;--c-tm-bg:#d6f1f4;--c-eval:#5a6068;--c-eval-bg:#eef0f3;--c-moplex:#0a4d6e;--c-moplex-bg:#cfe0eb;--feriado-bg:#fde0e0;--feriado-text:#b04040;--money-green:#2d7a3e;--money-red:#b04040}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:13px;line-height:1.4;min-height:100vh;padding-bottom:40px}
.shell{max-width:1700px;margin:0 auto;padding:16px 20px 40px}
.page-header{display:flex;align-items:center;justify-content:space-between;padding:12px 0 16px;border-bottom:1px solid var(--border);margin-bottom:16px;gap:12px;flex-wrap:wrap}
.header-left h1{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;letter-spacing:.08em;color:var(--accent);margin-bottom:4px}
.period-display{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.04em}
.header-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.date-picker{font-family:'JetBrains Mono',monospace;font-size:12px;padding:7px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg-elev);color:var(--text);cursor:pointer}
.date-picker:focus{outline:none;border-color:var(--accent)}
.controls{display:flex;align-items:center;gap:24px;flex-wrap:wrap;padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--border)}
.nav-controls{display:flex;gap:4px}
.nav-btn{background:var(--bg-elev);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:4px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.04em;transition:all .15s}
.nav-btn:hover{background:var(--bg-elev-2);border-color:var(--accent)}
.filters{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.filters label{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em}
.filters select,.filters input[type="text"]{background:var(--bg-elev);border:1px solid var(--border);color:var(--text);padding:5px 8px;border-radius:4px;font-family:inherit;font-size:12px;cursor:pointer}
.filters input[type="text"]{cursor:text;min-width:180px}
.filter-section{background:var(--bg-elev);border:1px solid var(--border);border-radius:6px;padding:6px 14px;margin-bottom:16px}
.chip-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 0}
.chip-row + .chip-row{border-top:1px solid var(--border);padding-top:10px}
.chip-row-label{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;margin-right:4px;font-weight:600;min-width:80px}
.chip{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:6px 12px;border-radius:20px;border:1px solid var(--border);background:var(--bg-elev);color:var(--text-dim);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:5px}
.chip:hover{border-color:var(--accent);color:var(--text)}
.chip .chip-dot{width:8px;height:8px;border-radius:50%}
.chip.is-active{color:#fff;border-color:transparent}
.chip.c-fisio.is-active{background:var(--c-fisio)}
.chip.c-dlm.is-active{background:var(--c-dlm)}
.chip.c-puncion.is-active{background:var(--c-puncion)}
.chip.c-masajes.is-active{background:var(--c-masajes)}
.chip.c-osteo.is-active{background:var(--c-osteo)}
.chip.c-suelo.is-active{background:var(--c-suelo)}
.chip.c-tm.is-active{background:var(--c-tm)}
.chip.c-eval.is-active{background:var(--c-eval)}
.chip.c-moplex.is-active{background:var(--c-moplex)}
.chip.c-todas.is-active{background:var(--text-dim)}
.chip.m-particular.is-active{background:var(--accent)}
.chip.m-os.is-active{background:var(--c-osteo)}
.stats-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:16px}
.stat-card{background:var(--bg-elev);border:1px solid var(--border);border-radius:6px;padding:10px 14px}
.stat-card.is-total{border-top:3px solid var(--accent)}
.stat-card.is-centro{border-top:3px solid var(--c-fisio)}
.stat-card.is-prof{border-top:3px solid var(--c-osteo)}
.stat-card.is-saldo{border-top:3px solid var(--c-sobre)}
.stat-card.is-bruto{border-top:3px solid var(--text-dim)}
.stat-label{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.stat-value{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700;color:var(--text);line-height:1.2}
.stat-value.money{font-size:16px}
.stat-sub{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted);margin-top:2px}
.table-wrap{background:var(--bg-elev);border:1px solid var(--border);border-radius:6px;overflow:auto;max-height:calc(100vh - 360px);min-height:300px}
.session-table{width:100%;border-collapse:collapse;font-size:12px}
.session-table thead{background:var(--bg-elev-2);position:sticky;top:0;z-index:2}
.session-table th{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;text-align:left;padding:10px 10px;border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none;background:var(--bg-elev-2)}
.session-table th.numeric{text-align:right}
.session-table th:hover{color:var(--accent)}
.session-table th .sort-ind{margin-left:4px;color:var(--text-muted);font-size:9px}
.session-table th.is-sorted{color:var(--accent)}
.session-table th.is-sorted .sort-ind{color:var(--accent)}
.session-table td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap}
.session-table td.numeric{text-align:right;font-family:'JetBrains Mono',monospace}
.session-table tbody tr{transition:background .1s}
.session-table tbody tr:hover{background:var(--accent-bg)}
.session-table tbody tr:last-child td{border-bottom:none}
.session-table tfoot td{background:var(--bg-elev-2);font-weight:700;border-top:2px solid var(--border);position:sticky;bottom:0;font-family:'JetBrains Mono',monospace;font-size:11px}
.col-id{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim);font-weight:600}
.col-codigo{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:var(--accent-dim);letter-spacing:.04em}
.col-hora{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--text)}
.col-paciente{font-weight:600;color:var(--text);max-width:240px;overflow:hidden;text-overflow:ellipsis}
.col-practica{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:3px 8px;border-radius:3px;display:inline-block;background:var(--bg-elev-2);color:var(--text-dim)}
.col-practica.p-fisio{background:var(--c-fisio-bg);color:var(--c-fisio)}
.col-practica.p-osteopatia{background:var(--c-osteo-bg);color:var(--c-osteo)}
.col-practica.p-dlm{background:var(--c-dlm-bg);color:var(--c-dlm)}
.col-practica.p-puncion{background:var(--c-puncion-bg);color:var(--c-puncion)}
.col-practica.p-suelo{background:var(--c-suelo-bg);color:var(--c-suelo)}
.col-practica.p-masajes{background:var(--c-masajes-bg);color:var(--c-masajes)}
.col-practica.p-tm{background:var(--c-tm-bg);color:var(--c-tm)}
.col-practica.p-eval{background:var(--c-eval-bg);color:var(--c-eval)}
.col-practica.p-moplex{background:var(--c-moplex-bg);color:var(--c-moplex)}
.col-modalidad{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:3px;display:inline-block}
.col-modalidad.is-particular{background:var(--accent-bg);color:var(--accent-dim)}
.col-modalidad.is-os{background:var(--c-osteo-bg);color:var(--c-osteo)}
.col-modalidad-meta{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-muted);margin-top:2px}
.col-prof{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.col-sesnum{font-family:'JetBrains Mono',monospace;font-weight:700}
.col-restantes{font-family:'JetBrains Mono',monospace;color:var(--text-dim)}
.col-restantes.is-zero{color:var(--c-fisio);font-weight:700}
/* Sesion excedente: se marco PRESENTE cuando el tratamiento ya habia consumido su tope. */
.chip-excedente{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:4px;background:#fde68a;color:#92400e;font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.04em;vertical-align:middle;cursor:help}
.excedente-banner{background:#fef3c7;border:1px solid #f59e0b;border-radius:6px;padding:12px 18px;font-family:'JetBrains Mono',monospace;color:#92400e;font-size:12px;font-weight:700;letter-spacing:.04em;margin-bottom:16px}
.col-saldo.is-deuda{color:var(--money-red);font-weight:700}
.col-saldo.is-cero{color:var(--text-muted)}
.col-pct{font-family:'JetBrains Mono',monospace;color:var(--text-dim);font-size:11px}
.col-monto.centro{color:var(--c-fisio);font-weight:600}
.col-monto.prof{color:var(--c-osteo);font-weight:600}
.loading-state,.empty-state,.error-state{padding:40px;text-align:center;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-dim);letter-spacing:.04em}
.error-state{color:var(--money-red)}
.empty-state{background:var(--bg-elev);border:1px solid var(--border);border-radius:6px}
.feriado-banner{background:var(--feriado-bg);border:1px solid var(--feriado-text);border-radius:6px;padding:14px 18px;text-align:center;font-family:'JetBrains Mono',monospace;color:var(--feriado-text);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:16px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 18px;border-radius:24px;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.05em;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.is-visible{opacity:1}
.toast.is-error{background:var(--money-red)}
@media(max-width:900px){
  .session-table{font-size:11px}
  .session-table th,.session-table td{padding:7px 6px}
  .stat-value{font-size:15px}
  .stat-value.money{font-size:13px}
}
.btn-edit-ses{background:var(--bg-elev);border:1px solid var(--border);border-radius:4px;padding:3px 8px;cursor:pointer;font-size:13px;line-height:1;transition:all .15s}
.btn-edit-ses:hover{border-color:var(--accent);background:var(--accent-bg)}
.modal-back{position:fixed;inset:0;background:rgba(26,29,33,0.55);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal-back.activo{display:flex}
.modal-ses{background:var(--bg-elev);border-radius:10px;width:100%;max-width:440px;box-shadow:0 20px 60px rgba(0,0,0,0.25)}
.modal-ses-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:700;color:var(--text)}
.modal-ses-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--text-dim)}
.modal-ses-body{padding:20px}
.modal-ses-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
.modal-ses-info{font-size:12px;color:var(--text-dim);margin-bottom:16px;line-height:1.6;font-family:'JetBrains Mono',monospace}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:12px;font-weight:600;color:var(--text-dim);margin-bottom:5px}
.fg input{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:7px;font-size:15px;font-family:'JetBrains Mono',monospace;color:var(--text)}
.fg select{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:7px;font-size:15px;font-family:inherit;color:var(--text);background:#fff;}
.fg select:focus{outline:none;border-color:var(--accent)}
.reparto-box{margin:-4px 0 14px;padding:10px 12px;background:var(--bg-elev-2,#f1f5f9);border-radius:8px;font-size:13px;color:var(--text-dim);display:flex;justify-content:space-between;align-items:center;gap:8px;}
.reparto-box strong{color:var(--text);font-variant-numeric:tabular-nums;}
.fg input:focus{outline:none;border-color:var(--accent)}
.mbtn{padding:8px 16px;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer;border:none;font-family:inherit}
.mbtn-p{background:var(--accent);color:#fff}
.mbtn-p:hover{background:var(--accent-dim)}
.mbtn-s{background:var(--bg-elev-2);color:var(--text);border:1px solid var(--border)}
.mbtn-s:hover{border-color:var(--accent)}
</style>
</head>
<body>

<div class="shell">
  <header class="page-header">
    <div class="header-left">
      <h1>SESIONES · DIARIO</h1>
      <span class="period-display" id="periodDisplay">—</span>
    </div>
    <div class="header-right">
      <input type="date" class="date-picker" id="datePicker">
    </div>
  </header>

  <div class="controls">
    <div class="nav-controls">
      <button class="nav-btn" id="prevBtn">←</button>
      <button class="nav-btn" id="todayBtn">HOY</button>
      <button class="nav-btn" id="nextBtn">→</button>
    </div>
    <div class="filters">
      <label>Profesional:
        <select id="filterProfesional">
          <option value="">Todos</option>
          <option value="Jime">Jime</option>
          <option value="Bruno">Bruno</option>
          <option value="Male">Male</option>
          <option value="Vero">Vero</option>
          <option value="Lu">Lu</option>
        </select>
      </label>
      <label>Buscar paciente:
        <input type="text" id="filterPaciente" placeholder="Nombre o DNI…" autocomplete="off">
      </label>
    </div>
  </div>

  <div class="filter-section">
    <div class="chip-row" id="practicaFilter">
      <span class="chip-row-label">Práctica:</span>
      <button class="chip c-todas is-active" data-practica="">Todas</button>
      <button class="chip c-fisio" data-practica="FISIO_ALL"><span class="chip-dot" style="background:var(--c-fisio)"></span>Fisio</button>
      <button class="chip c-masajes" data-practica="MASAJES_ALL"><span class="chip-dot" style="background:var(--c-masajes)"></span>Maso</button>
      <button class="chip c-osteo" data-practica="OSTEOPATIA"><span class="chip-dot" style="background:var(--c-osteo)"></span>Osteo</button>
      <button class="chip c-dlm" data-practica="DLM"><span class="chip-dot" style="background:var(--c-dlm)"></span>DLM</button>
      <button class="chip c-suelo" data-practica="SUELO_PELVICO"><span class="chip-dot" style="background:var(--c-suelo)"></span>PP</button>
      <button class="chip c-puncion" data-practica="PUNCION_SECA"><span class="chip-dot" style="background:var(--c-puncion)"></span>Punc Seca</button>
      <button class="chip c-tm" data-practica="TERAP_MANUAL"><span class="chip-dot" style="background:var(--c-tm)"></span>Terap M.</button>
      <button class="chip c-eval" data-practica="EVALUACION"><span class="chip-dot" style="background:var(--c-eval)"></span>Evaluación</button>
      <button class="chip c-moplex" data-practica="MOPLEX"><span class="chip-dot" style="background:var(--c-moplex)"></span>Moplex</button>
    </div>
    <div class="chip-row" id="modalidadFilter">
      <span class="chip-row-label">Modalidad:</span>
      <button class="chip c-todas is-active" data-modalidad="">Todas</button>
      <button class="chip m-particular" data-modalidad="Particular"><span class="chip-dot" style="background:var(--accent)"></span>Particular</button>
      <button class="chip m-os" data-modalidad="O.S"><span class="chip-dot" style="background:var(--c-osteo)"></span>Obra Social</button>
    </div>
  </div>

  <div class="stats-bar" id="statsBar"></div>

  <div id="sesionesContainer"><div class="loading-state">Cargando sesiones…</div></div>
</div>

<div class="toast" id="toast"></div>

<!-- MODAL EDITAR SESIÓN -->
<div class="modal-back" id="modalEditSes">
  <div class="modal-ses">
    <div class="modal-ses-head">
      <span>✏️ Editar montos de sesión</span>
      <button class="modal-ses-close" onclick="cerrarEditarSesion()">×</button>
    </div>
    <div class="modal-ses-body">
      <div class="modal-ses-info" id="editSesInfo"></div>
      <div class="fg">
        <label>Quién atendió (profesional)</label>
        <select id="editSesProfesional" onchange="recalcSplitSesion()"></select>
      </div>
      <div class="fg">
        <label>Importe total ($)</label>
        <input type="number" id="editSesTotal" step="100" min="0" oninput="recalcSplitSesion()">
      </div>
      <div class="reparto-box" id="repartoSesBox">
        <span>Centro <strong id="repSesCentro">$0</strong></span>
        <span id="repSesPct" style="font-size:11px;color:var(--text-dim);"></span>
        <span>Profesional <strong id="repSesProf">$0</strong></span>
      </div>
      <button type="button" class="mbtn mbtn-s" style="width:100%;margin-bottom:14px;border-color:#bbf7d0;background:#f0fdf4;color:#166534;" onclick="aplicarBonifCentro()">🎗️ Bonificación del centro — todo al profesional (Centro $0)</button>
      <details style="margin-bottom:14px;">
        <summary style="cursor:pointer;font-size:12px;color:var(--text-dim);">Ajustar montos a mano (opcional)</summary>
        <div class="fg" style="margin-top:10px;">
          <label>$ Centro</label>
          <input type="number" id="editSesCentro" step="100" min="0">
        </div>
        <div class="fg">
          <label>$ Profesional</label>
          <input type="number" id="editSesProf" step="100" min="0">
        </div>
      </details>
      <div class="fg" id="fgMoplex" style="display:none;">
        <label>$ Moplex</label>
        <input type="number" id="editSesMoplex" step="100" min="0">
      </div>
    </div>
    <div class="modal-ses-foot">
      <button class="mbtn mbtn-s" onclick="cerrarEditarSesion()">Cancelar</button>
      <button class="mbtn mbtn-p" id="btnGuardarSes" onclick="guardarEditarSesion()">Guardar cambios</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://bqpjtoiictnzcasxfucf.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_yvuXDxrkRrhXwmZBnE_a_Q_zDBz0iDi';

const FERIADOS_HARDCODED = {
  '2026-01-01': 'Año Nuevo',
  '2026-05-01': 'Día del Trabajador',
  '2026-05-25': 'Revolución de Mayo',
  '2026-06-15': 'Paso a la Inmortalidad Gral. Güemes',
  '2026-07-09': 'Día de la Independencia',
  '2026-08-17': 'Paso a la Inmortalidad Gral. San Martín',
  '2026-10-12': 'Día de la Raza',
  '2026-11-23': 'Día de la Soberanía Nacional',
  '2026-12-08': 'Día de la Virgen',
  '2026-12-24': 'Fiestas Navideñas',
  '2026-12-25': 'Navidad',
  '2026-12-31': 'Fin de Año',
  '2027-01-01': 'Año Nuevo'
};

// Etiqueta legible de la práctica (acepta códigos nuevos y labels legacy)
function practicaLabel(code) {
  if (!code) return '—';
  const c = String(code).toUpperCase();
  const map = {
    'FISIO':'Fisio','FISIO_PQ':'Fisio PQ','FISIO_SC':'Fisio SC','FISIO_PC':'Fisio PC','FISIO_DESC':'Fisio DESC',
    'OSTEOPATIA':'Osteo','OSTEO':'Osteo',
    'DLM':'DLM','DRENAJE':'DLM','DRENAJE_LINFATICO':'DLM',
    'PUNCION_SECA':'Punc Seca','PUNC_SECA':'Punc Seca',
    'SUELO_PELVICO':'PP','SUELO_PEL':'PP',
    'MASAJES':'Maso','MASAJES_EYC':'Maso EyC','MASAJES_CC':'Maso CC','MASAJES_PAK':'Maso Pak','MASAJES_R':'Maso R','MASAJES_C':'Maso C','MASAJES_CERO':'Maso C',
    'TERAP_MANUAL':'Terap M.','TERAPIA_MANUAL':'Terap M.',
    'EVALUACION':'Evaluación','EVAL':'Evaluación',
    'MOPLEX':'Moplex','RPG':'RPG'
  };
  return map[c] || String(code);
}

// Clase de color de la práctica
function practicaColorCls(code) {
  if (!code) return '';
  const c = String(code).toUpperCase();
  if (c.startsWith('FISIO') || c === 'RPG') return 'p-fisio';
  if (c.startsWith('OSTEO')) return 'p-osteopatia';
  if (c.includes('DRENAJE') || c === 'DLM') return 'p-dlm';
  if (c.includes('PUNC')) return 'p-puncion';
  if (c.includes('SUELO') || c === 'PP') return 'p-suelo';
  if (c.includes('MASAJ') || c.includes('MASO')) return 'p-masajes';
  if (c.includes('TERAP')) return 'p-tm';
  if (c.startsWith('EVAL')) return 'p-eval';
  if (c === 'MOPLEX') return 'p-moplex';
  return '';
}

// Mapeo de filtros chip → predicado sobre practica_codigo
function chipMatch(filtro, practica) {
  if (!filtro) return true;
  if (!practica) return false;
  const p = String(practica).toUpperCase();
  switch (filtro) {
    case 'FISIO_ALL': return p.startsWith('FISIO') || p === 'RPG';
    case 'MASAJES_ALL': return p.includes('MASAJ') || p.includes('MASO');
    case 'OSTEOPATIA': return p.startsWith('OSTEO');
    case 'DLM': return p === 'DLM' || p.includes('DRENAJE');
    case 'SUELO_PELVICO': return p.includes('SUELO') || p === 'PP';
    case 'PUNCION_SECA': return p.includes('PUNC');
    case 'TERAP_MANUAL': return p.includes('TERAP');
    case 'EVALUACION': return p.startsWith('EVAL');
    case 'MOPLEX': return p === 'MOPLEX';
    default: return p === filtro;
  }
}

// Traduce códigos de práctica "largos" (de sesiones) a los "cortos" del tarifario
function normalizarPractica(code) {
  if (!code) return code;
  const c = String(code).toUpperCase();
  const map = {
    'EVALUACION': 'EVAL',
    'OSTEOPATIA': 'OSTEO',
    'DRENAJE_LINFATICO': 'DRENAJE',
    'DLM': 'DRENAJE',
    'PUNCION_SECA': 'PUNC_SECA',
    'SUELO_PELVICO': 'SUELO_PEL',
    'TERAPIA_MANUAL': 'TERAP_MANUAL',
    'MASAJES': 'MASAJES_EYC',
  };
  return map[c] || c;
}

// % de centro (0-100) para práctica + profesional. null si no está en el tarifario.
function pctCentroDe(practicaCodigo, profesional) {
  if (!practicaCodigo || !profesional) return null;
  const practNorm = normalizarPractica(practicaCodigo);
  const key = `${practNorm.toUpperCase()}|${String(profesional).toUpperCase()}`;
  const v = splitsMap.get(key);
  return (v === undefined || v === null) ? null : v;
}

  const tratIds = [...new Set(sesiones.map(s => s.tratamiento_id).filter(Boolean))];

}

function renderStats(set) {
  const totC = set.reduce((a, s) => a + (Number(s.monto_centro) || 0), 0);
  const totP = set.reduce((a, s) => a + (Number(s.monto_profesional) || 0), 0);
  const totM = set.reduce((a, s) => a + (Number(s.monto_moplex) || 0), 0);
  const totBruto = totC + totP + totM;
  // Saldo: deduplicado por tratamiento_id (no sumamos el mismo saldo dos veces)
  const seen = new Set();
  let totSaldo = 0;
  set.forEach(s => {
    if (s.tratamiento_id && !seen.has(s.tratamiento_id)) {
      seen.add(s.tratamiento_id);
      const saldo = Number(getSaldoPendiente(s));
      if (saldo > 0) totSaldo += saldo;
    }
  });
  const moplexCard = totM > 0
    ? `<div class="stat-card is-bruto"><div class="stat-label">$ Moplex</div><div class="stat-value money">${fmtMoney(totM)}</div></div>`
    : '';
  const html = `
    <div class="stat-card is-total"><div class="stat-label">Total sesiones</div><div class="stat-value">${set.length}</div></div>
    <div class="stat-card is-centro"><div class="stat-label">$ Centro</div><div class="stat-value money">${fmtMoney(totC)}</div></div>
    <div class="stat-card is-prof"><div class="stat-label">$ Profesional</div><div class="stat-value money">${fmtMoney(totP)}</div></div>
    ${moplexCard}
    <div class="stat-card is-bruto"><div class="stat-label">$ Bruto del día</div><div class="stat-value money">${fmtMoney(totBruto)}</div></div>
    <div class="stat-card is-saldo"><div class="stat-label">Saldo pendiente</div><div class="stat-value money">${fmtMoney(totSaldo)}</div><div class="stat-sub">(${seen.size} tratamientos)</div></div>
  `;
  document.getElementById('statsBar').innerHTML = html;
}

function matchModalidad(stored, filtro) {
  return normalizeModalidad(stored) === filtro;
}

function compareBy(a, b, key) {
  let va, vb;
  switch (key) {
    case 'hora_inicio':
      va = getHora(a) || ''; vb = getHora(b) || '';
      return String(va).localeCompare(String(vb), 'es', { numeric: true });
    case 'paciente':
      va = personasMap.get(getPersonaId(a))?.nombre || ''; vb = personasMap.get(getPersonaId(b))?.nombre || '';
      return String(va).localeCompare(String(vb), 'es');
    case 'codigo_id':
      va = getCodigoTto(a) || ''; vb = getCodigoTto(b) || '';
      return String(va).localeCompare(String(vb), 'es', { numeric: true });
    case 'practica_codigo':
      va = getPracticaCodigo(a) || ''; vb = getPracticaCodigo(b) || '';
      return String(va).localeCompare(String(vb), 'es');
    case 'modalidad':
      va = getModalidad(a) || ''; vb = getModalidad(b) || '';
      return String(va).localeCompare(String(vb), 'es');
    case 'persona_id':
      va = Number(getPersonaId(a)) || 0; vb = Number(getPersonaId(b)) || 0;
      return va - vb;
    case 'saldo_pendiente':
      va = Number(getSaldoPendiente(a)) || 0; vb = Number(getSaldoPendiente(b)) || 0;
      return va - vb;
    case 'numero_sesion':
    case 'monto_centro':
    case 'monto_profesional':
      va = Number(a[key]) || 0; vb = Number(b[key]) || 0;
      return va - vb;
    default:
      va = a[key] || ''; vb = b[key] || '';
      return String(va).localeCompare(String(vb), 'es', { numeric: true });
  }
}

function updatePeriodDisplay() {
  const d = new Date(currentDate + 'T12:00:00');
  const dias = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const meses = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const txt = `${dias[d.getDay()]} ${d.getDate()} de ${meses[d.getMonth()]} de ${d.getFullYear()}`;
  document.getElementById('periodDisplay').textContent = txt.toUpperCase();
}

function showLoading() { document.getElementById('sesionesContainer').innerHTML = `<div class="loading-state">Cargando sesiones…</div>`; }
function showError(msg) { document.getElementById('sesionesContainer').innerHTML = `<div class="error-state">⚠️ ${escapeHtml(msg)}</div>`; }

function toast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast is-visible' + (type ? ' is-' + type : '');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.className = 'toast', 2400);
}

// === EDITAR SESIÓN ===
let sesionEnEdicion = null;

function abrirEditarSesion(s) {
  sesionEnEdicion = s;
  const personaId = getPersonaId(s);
  const persona = personaId ? personasMap.get(personaId) : null;
  const nombre = persona ? persona.nombre : (personaId ? `#${personaId}` : '—');
  const codigoTto = getCodigoTto(s);
  const practCode = getPracticaCodigo(s);
  const practLbl = practicaLabel(practCode);
  document.getElementById('editSesInfo').innerHTML =
    `Sesión #${s.id} · ${escapeHtml(nombre)}<br>` +
    `Tto ${escapeHtml(codigoTto)} · ${escapeHtml(practLbl)}`;

  // Selector de profesional (lista del tarifario + el actual si no estuviera)
  const selProf = document.getElementById('editSesProfesional');
  selProf.innerHTML = '';
  const lista = [...profesionalesSplit];
  const yaEsta = s.profesional && lista.some(n => n.toUpperCase() === String(s.profesional).toUpperCase());
  if (s.profesional && !yaEsta) lista.unshift(s.profesional);
  lista.forEach(n => {
    const o = document.createElement('option'); o.value = n; o.textContent = n;
    if (s.profesional && n.toUpperCase() === String(s.profesional).toUpperCase()) o.selected = true;
    selProf.appendChild(o);
  });

  // Importe total = centro + profesional (moplex va aparte)
  const total = (Number(s.monto_centro) || 0) + (Number(s.monto_profesional) || 0);
  document.getElementById('editSesTotal').value = total;
  document.getElementById('editSesCentro').value = Number(s.monto_centro) || 0;
  document.getElementById('editSesProf').value = Number(s.monto_profesional) || 0;

  const mM = Number(s.monto_moplex) || 0;
  const fgM = document.getElementById('fgMoplex');
  if (mM > 0) {
    fgM.style.display = '';
    document.getElementById('editSesMoplex').value = mM;
  } else {
    fgM.style.display = 'none';
  }

  recalcSplitSesion();
  document.getElementById('modalEditSes').classList.add('activo');
}

// Recalcula Centro/Profesional según el % del tarifario (práctica + profesional)
window.recalcSplitSesion = function() {
  if (!sesionEnEdicion) return;
  const total = parseFloat(document.getElementById('editSesTotal').value) || 0;
  const prof = document.getElementById('editSesProfesional').value;
  const practCode = getPracticaCodigo(sesionEnEdicion);
  const pctC = pctCentroDe(practCode, prof);

  const pctLabel = document.getElementById('repSesPct');
  let centro;
  if (pctC === null) {
    const origTot = (Number(sesionEnEdicion.monto_centro)||0) + (Number(sesionEnEdicion.monto_profesional)||0);
    const ratio = origTot > 0 ? (Number(sesionEnEdicion.monto_centro)||0) / origTot : 1;
    centro = Math.round(total * ratio);
    pctLabel.textContent = `⚠️ sin tarifa (${normalizarPractica(practCode)}+${prof})`;
  } else {
    centro = Math.round(total * (pctC / 100));
    pctLabel.textContent = `${pctC}% centro`;
  }
  const profesional = total - centro;
  document.getElementById('repSesCentro').textContent = fmtMoney(centro);
  document.getElementById('repSesProf').textContent = fmtMoney(profesional);
  document.getElementById('editSesCentro').value = centro;
  document.getElementById('editSesProf').value = profesional;
};

// Bonificación del centro: PuntoBiO bonifica su parte → el total cobrado de la
// sesión queda 100% para el profesional que la atendió (Centro $0).
window.aplicarBonifCentro = function() {
  if (!sesionEnEdicion) return;
  const total = parseFloat(document.getElementById('editSesTotal').value) || 0;
  document.getElementById('editSesCentro').value = 0;
  document.getElementById('editSesProf').value = total;
  document.getElementById('repSesCentro').textContent = fmtMoney(0);
  document.getElementById('repSesProf').textContent = fmtMoney(total);
  document.getElementById('repSesPct').textContent = '🎗️ bonif. centro (0% centro)';
};

window.cerrarEditarSesion = function() {
  document.getElementById('modalEditSes').classList.remove('activo');
  sesionEnEdicion = null;
};

window.guardarEditarSesion = async function() {
  if (!sesionEnEdicion) return;
  const nC = parseFloat(document.getElementById('editSesCentro').value);
  const nP = parseFloat(document.getElementById('editSesProf').value);
  if (isNaN(nC) || isNaN(nP) || nC < 0 || nP < 0) { alert('Ingresá montos válidos'); return; }

  const update = {
    monto_centro: nC,
    monto_profesional: nP,
    profesional: document.getElementById('editSesProfesional').value,
  };
  const fgM = document.getElementById('fgMoplex');
  if (fgM.style.display !== 'none') {
    const nM = parseFloat(document.getElementById('editSesMoplex').value);
    if (!isNaN(nM) && nM >= 0) update.monto_moplex = nM;
  }

  const btn = document.getElementById('btnGuardarSes');
  btn.disabled = true; btn.textContent = 'Guardando...';
  try {
    console.log('[guardar] id sesión:', sesionEnEdicion.id, '| update:', update);
    const { data, error } = await supa.from('sesiones')
      .update(update)
      .eq('id', sesionEnEdicion.id)
      .select();   // .select() devuelve las filas modificadas para confirmar
    if (error) throw error;
    console.log('[guardar] filas modificadas:', data);
    if (!data || data.length === 0) {
      alert('⚠️ No se guardó: no se encontró la sesión (id=' + sesionEnEdicion.id + ').\nPuede ser un permiso de la base o que el id no coincide.');
      return;
    }
    cerrarEditarSesion();
    await refresh();
    toast('Sesión actualizada');
  } catch (e) {
    console.error('[guardar] error:', e);
    alert('Error al guardar: ' + (e.message || e));
  } finally {
    btn.disabled = false; btn.textContent = 'Guardar cambios';
  }
};

// === HELPERS ===
// Acceso tolerante a la columna "hora" (puede llamarse distinto)
function getHora(s) {
  if (!s) return null;
  return s.hora_inicio ?? s.hora ?? s.turno_hora ?? s.hora_turno ?? null;
}
// Datos derivados de tratamientos (sesiones NO tiene estos campos directamente)
function getPersonaId(s) {
  return s.persona_id ?? tratamientosMap.get(s.tratamiento_id)?.persona_id ?? null;
}
function getPracticaCodigo(s) {
  return s.practica_codigo ?? tratamientosMap.get(s.tratamiento_id)?.practica_codigo ?? null;
}
function normalizeModalidad(raw) {
  const s = String(raw ?? '').toUpperCase().replace(/[\s._-]/g, '');
  if (s === 'OS' || s.startsWith('OBRASOC')) return 'O.S';
  if (s === 'PART' || s.startsWith('PARTICULAR')) return 'Particular';
  return raw ? String(raw) : '';
}
function getModalidad(s) {
  return s.modalidad ?? tratamientosMap.get(s.tratamiento_id)?.modalidad ?? null;
}
function getObraSocial(s) {
  return s.obra_social ?? tratamientosMap.get(s.tratamiento_id)?.obra_social ?? null;
}
function getCodigoTto(s) {
  return tratamientosMap.get(s.tratamiento_id)?.codigo_id ?? (s.tratamiento_id ? `#${s.tratamiento_id}` : '—');
}
function getTotalSesiones(s) {
  return tratamientosMap.get(s.tratamiento_id)?.total_sesiones ?? null;
}
function getSaldoPendiente(s) {
  return s.saldo_pendiente ?? s.saldo_al_momento ?? tratamientosMap.get(s.tratamiento_id)?.saldo_pendiente ?? 0;
}
// Si pct_* no vienen, los calculamos a partir de los montos
function getPctCentro(s) {
  if (s.pct_centro != null) return Number(s.pct_centro);
  const mC = Number(s.monto_centro) || 0;
  const mP = Number(s.monto_profesional) || 0;
  const mM = Number(s.monto_moplex) || 0;
  const total = mC + mP + mM;
  return total > 0 ? mC / total : null;
}
function getPctProf(s) {
  if (s.pct_profesional != null) return Number(s.pct_profesional);
  const mC = Number(s.monto_centro) || 0;
  const mP = Number(s.monto_profesional) || 0;
  const mM = Number(s.monto_moplex) || 0;
  const total = mC + mP + mM;
  return total > 0 ? mP / total : null;
}
function toISODate(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function pad(n) { return String(n).padStart(2, '0'); }
function fmtHora(h) {
  if (!h) return '—';
  // h puede ser '08:00:00' o '8:00:00 a.m.' o time obj
  const s = String(h);
  const m = s.match(/(\d{1,2}):(\d{2})/);
  if (m) return `${pad(m[1])}:${m[2]}`;
  return s;
}
function fmtMoney(n) {
  const v = Number(n) || 0;
  if (v === 0) return '$0';
  return '$' + v.toLocaleString('es-AR', { maximumFractionDigits: 0 });
}
function fmtPct(p) {
  if (p == null || isNaN(p)) return '—';
  // pct puede venir como 0.35 o 35
  const v = Math.abs(p) <= 1 ? p * 100 : p;
  return `${v.toFixed(0)}%`;
}
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
