<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Caja diaria TF · PuntoBiO</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#f8fafc; --panel:#ffffff; --panel-2:#f1f5f9;
    --border:#e5e7eb; --text:#0f172a; --muted:#64748b;
    --accent:#1e9fe0; --accent-2:#0c7bb8;
    --green:#16a34a; --red:#dc2626; --yellow:#d97706;
  }
  *{box-sizing:border-box}
  body{
    font-family:-apple-system,system-ui,'Segoe UI',sans-serif;
    background:var(--bg); color:var(--text);
    margin:0; padding:0; min-height:100vh;
  }
  .wrap{max-width:1100px; margin:0 auto; padding:20px 16px 60px;}
  h1{color:var(--accent); margin:0 0 18px; font-size:22px;}
  .loading{text-align:center; padding:60px 20px; color:var(--muted);}

  /* Toolbar */
  .toolbar{
    display:flex; gap:12px; align-items:center; flex-wrap:wrap;
    padding:14px 16px; background:var(--panel);
    border:1px solid var(--border); border-radius:10px;
    margin-bottom:18px;
  }
  .toolbar label{color:var(--muted); font-size:13px;}
  .toolbar input[type="date"],
  .toolbar select{
    padding:8px 12px; background:var(--bg);
    border:1px solid var(--border); border-radius:6px;
    color:var(--text); font-size:14px;
  }
  .toolbar .nav-btn{
    padding:8px 12px; background:var(--panel-2);
    border:1px solid var(--border); border-radius:6px;
    color:var(--text); cursor:pointer; font-size:14px;
  }
  .toolbar .nav-btn:hover{border-color:var(--accent);}
  .toolbar .spacer{flex:1;}

  /* Totales */
  .totales{
    display:grid; grid-template-columns:repeat(4,1fr); gap:12px;
    margin-bottom:18px;
  }
  @media(max-width:700px){.totales{grid-template-columns:repeat(2,1fr);}}
  .total-card{
    padding:16px; background:var(--panel);
    border:1px solid var(--border); border-radius:10px;
  }
  .total-card.tot{border-color:var(--accent); background:#dbeafe;}
  .total-label{
    color:var(--muted); font-size:11px;
    text-transform:uppercase; letter-spacing:0.8px; margin-bottom:6px;
  }
  .total-monto{font-size:20px; font-weight:700;}
  .total-cant{color:var(--muted); font-size:12px; margin-top:4px;}

  /* Tabla */
  .table-wrap{
    background:var(--panel); border:1px solid var(--border);
    border-radius:10px; overflow:hidden;
  }
  table{width:100%; border-collapse:collapse;}
  thead{background:var(--panel-2);}
  th{
    padding:12px 14px; text-align:left;
    font-size:11px; color:var(--muted);
    text-transform:uppercase; letter-spacing:0.8px;
    border-bottom:1px solid var(--border);
  }
  td{
    padding:11px 14px; font-size:14px;
    border-bottom:1px solid var(--border);
  }
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#f0f9ff;}

  .col-importe{text-align:right; font-weight:700;}
  .col-id{color:var(--muted); font-family:monospace; font-size:12px;}

  .badge{
    display:inline-block; padding:3px 8px; border-radius:5px;
    font-size:11px; font-weight:600;
  }
  .badge-EFECTIVO{background:#dcfce7; color:var(--green);}
  .badge-TRANSFERENCIA{background:#dbeafe; color:var(--accent);}
  .badge-DEBITO{background:#fef3c7; color:var(--yellow);}
  .badge-NORMAL{background:#f1f5f9; color:var(--muted);}
  .badge-CORTESIA{background:#fee2e2; color:var(--red);}
  .badge-MANUAL{background:#fef3c7; color:var(--yellow);}

  .empty{text-align:center; padding:40px; color:var(--muted);}
  .obs-cell{color:var(--muted); font-size:12px; max-width:260px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>💵 Caja diaria · Terapia Física</h1>

  <div class="toolbar">
    <button class="nav-btn" id="btn-prev">◀ Día anterior</button>
    <label>Fecha:</label>
    <input type="date" id="fecha" />
    <button class="nav-btn" id="btn-next">Día siguiente ▶</button>
    <button class="nav-btn" id="btn-hoy">Hoy</button>
    <div class="spacer"></div>
    <label>Mes imputado:</label>
    <select id="filtro-mes">
      <option value="">Todos</option>
    </select>
  </div>

  <div class="totales">
    <div class="total-card">
      <div class="total-label">Efectivo</div>
      <div class="total-monto" id="t-efectivo">$0</div>
      <div class="total-cant" id="c-efectivo">0 cobros</div>
    </div>
    <div class="total-card">
      <div class="total-label">Transferencia</div>
      <div class="total-monto" id="t-transferencia">$0</div>
      <div class="total-cant" id="c-transferencia">0 cobros</div>
    </div>
    <div class="total-card">
      <div class="total-label">Débito</div>
      <div class="total-monto" id="t-debito">$0</div>
      <div class="total-cant" id="c-debito">0 cobros</div>
    </div>
    <div class="total-card tot">
      <div class="total-label">Total del día</div>
      <div class="total-monto" id="t-total">$0</div>
      <div class="total-cant" id="c-total">0 cobros</div>
    </div>
  </div>

  <div id="loading" class="loading">Cargando cobros...</div>

  <div id="tabla-wrap" class="table-wrap" style="display:none;">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Alumno</th>
          <th>Plan</th>
          <th>Imputa a</th>
          <th>Medio</th>
          <th>Tipo</th>
          <th>Observaciones</th>
          <th class="col-importe">Importe</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <div id="empty" class="empty" style="display:none;">No hay cobros TF en esta fecha</div>
</div>

<script>
  const SUPABASE_URL = 'https://bqpjtoiictnzcasxfucf.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_yvuXDxrkRrhXwmZBnE_a_Q_zDBz0iDi';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const fmt = n => '$' + Number(n||0).toLocaleString('es-AR');
  const monthLabel = (yyyy_mm) => {
    if (!yyyy_mm) return '—';
    const [y,m] = yyyy_mm.split('-');
    const d = new Date(parseInt(y), parseInt(m)-1, 1);
    let nom = d.toLocaleString('es-AR',{month:'long',year:'numeric'});
    return nom.charAt(0).toUpperCase() + nom.slice(1);
  };
  const todayStr = () => new Date().toISOString().substring(0,10);

  // Caches
  let inscripcionesMap = {}; // id → {plan, persona_id, valor_lista}
  let personasMap = {};      // id → nombre

  async function cargarCaches(){
    const [insR, perR] = await Promise.all([
      sb.from('inscripciones_tf').select('id, plan, persona_id'),
      sb.from('personas').select('id, nombre')
    ]);
    if (insR.error || perR.error) throw (insR.error || perR.error);
    insR.data.forEach(i => inscripcionesMap[i.id] = i);
    perR.data.forEach(p => personasMap[p.id] = p.nombre || '(sin nombre)');
  }

  function poblarFiltroMes(){
    const sel = document.getElementById('filtro-mes');
    const hoy = new Date();
    for (let i = -6; i <= 3; i++){
      const d = new Date(hoy.getFullYear(), hoy.getMonth()+i, 1);
      const v = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      const opt = document.createElement('option');
      opt.value = v;
      opt.textContent = monthLabel(v);
      sel.appendChild(opt);
    }
  }

  async function cargarCobros(){
    const fecha = document.getElementById('fecha').value;
    const mes = document.getElementById('filtro-mes').value;
    const loading = document.getElementById('loading');
    const tablaWrap = document.getElementById('tabla-wrap');
    const empty = document.getElementById('empty');

    loading.style.display = 'block';
    tablaWrap.style.display = 'none';
    empty.style.display = 'none';

    let q = sb.from('pagos_tf')
      .select('id, inscripcion_id, mes_imputado, fecha, importe, medio, tipo_cobro, descuento_temporal, observaciones, creado_en')
      .eq('fecha', fecha)
      .order('creado_en', {ascending: true});
    if (mes) q = q.eq('mes_imputado', mes);

    const { data, error } = await q;
    loading.style.display = 'none';

    if (error){ alert('Error: ' + error.message); return; }

    const rows = document.getElementById('rows');
    rows.innerHTML = '';

    // Totales
    let t = {EFECTIVO:0, TRANSFERENCIA:0, DEBITO:0};
    let c = {EFECTIVO:0, TRANSFERENCIA:0, DEBITO:0};
    let totalGeneral = 0, totalCantidad = 0;

    if (!data || data.length === 0){
      empty.style.display = 'block';
      actualizarTotales(t, c, totalGeneral, totalCantidad);
      return;
    }

    data.forEach(p => {
      const insc = inscripcionesMap[p.inscripcion_id] || {};
      const nombre = personasMap[insc.persona_id] || '(sin alumno)';
      const importe = parseFloat(p.importe) || 0;
      t[p.medio] = (t[p.medio]||0) + importe;
      c[p.medio] = (c[p.medio]||0) + 1;
      totalGeneral += importe;
      totalCantidad++;

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="col-id">${p.id}</td>
        <td>${nombre}<br><span style="color:var(--muted); font-size:11px;">ID ${insc.persona_id||'—'}</span></td>
        <td>${insc.plan || '—'}</td>
        <td>${monthLabel(p.mes_imputado)}</td>
        <td><span class="badge badge-${p.medio}">${p.medio}</span></td>
        <td><span class="badge badge-${p.tipo_cobro}">${p.tipo_cobro}</span></td>
        <td class="obs-cell">${p.observaciones || ''}</td>
        <td class="col-importe">${fmt(importe)}</td>
      `;
      rows.appendChild(tr);
    });

    tablaWrap.style.display = 'block';
    actualizarTotales(t, c, totalGeneral, totalCantidad);
  }

  function actualizarTotales(t, c, total, cant){
    document.getElementById('t-efectivo').textContent = fmt(t.EFECTIVO);
    document.getElementById('c-efectivo').textContent = (c.EFECTIVO||0) + ' cobros';
    document.getElementById('t-transferencia').textContent = fmt(t.TRANSFERENCIA);
    document.getElementById('c-transferencia').textContent = (c.TRANSFERENCIA||0) + ' cobros';
    document.getElementById('t-debito').textContent = fmt(t.DEBITO);
    document.getElementById('c-debito').textContent = (c.DEBITO||0) + ' cobros';
    document.getElementById('t-total').textContent = fmt(total);
    document.getElementById('c-total').textContent = cant + ' cobros';
  }

  function navegarDia(delta){
    const inp = document.getElementById('fecha');
    const d = new Date(inp.value + 'T00:00:00');
    d.setDate(d.getDate() + delta);
    inp.value = d.toISOString().substring(0,10);
    cargarCobros();
  }

  async function init(){
    try {
      await cargarCaches();
      poblarFiltroMes();
      document.getElementById('fecha').value = todayStr();
      document.getElementById('fecha').addEventListener('change', cargarCobros);
      document.getElementById('filtro-mes').addEventListener('change', cargarCobros);
      document.getElementById('btn-prev').addEventListener('click', () => navegarDia(-1));
      document.getElementById('btn-next').addEventListener('click', () => navegarDia(1));
      document.getElementById('btn-hoy').addEventListener('click', () => {
        document.getElementById('fecha').value = todayStr();
        cargarCobros();
      });
      await cargarCobros();
    } catch(e){
      document.getElementById('loading').textContent = 'Error: ' + (e.message || e);
    }
  }

  init();
</script>
</body>
</html>
