<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>PuntoBiO — Turnos fijos libres TF</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --azul: #1e9fe0; --azul-soft: #dbeafe;
    --bg: #f8fafc; --bg-card: #ffffff; --bg-hover: #f1f5f9; --border: #e5e7eb;
    --text: #0f172a; --text-dim: #64748b; --text-soft: #475569;
    --rojo: #dc2626; --rojo-soft: #fee2e2;
    --naranja: #d97706; --naranja-soft: #fef3c7;
    --verde: #16a34a; --verde-soft: #dcfce7;
    --violeta: #8b5cf6; --violeta-soft: #ede9fe;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text); margin: 0; padding: 20px;
  }
  h1 { margin: 0 0 4px; font-size: 22px; }
  .sub { color: var(--text-dim); font-size: 13px; margin-bottom: 18px; }
  .chip-regla {
    display: inline-block; background: var(--naranja-soft); color: #92400e;
    border: 1px solid #fcd34d; border-radius: 12px; padding: 4px 12px;
    font-size: 11.5px; font-weight: 600; margin-left: 8px;
  }
  .btn {
    padding: 7px 14px; border-radius: 8px; cursor: pointer; font-size: 12.5px;
    font-weight: 600; font-family: inherit; background: var(--bg-card);
    border: 1px solid var(--border); color: var(--text);
  }
  .btn:hover { background: var(--bg-hover); }
  .btn-azul { border-color: var(--azul); color: var(--azul); }
  .btn-verde { border-color: var(--verde); color: var(--verde); }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; align-items: center; }
  .loading { padding: 30px; text-align: center; color: var(--text-dim); font-size: 14px; }
  .aviso {
    background: var(--naranja-soft); border: 1px solid #fcd34d; color: #92400e;
    padding: 14px 16px; border-radius: 8px; font-size: 13px; line-height: 1.5;
  }
  .area-titulo { font-size: 16px; font-weight: 700; }
  .area-meta { font-size: 12.5px; color: var(--text-dim); }
  table.grid { border-collapse: separate; border-spacing: 4px; min-width: 540px; }
  table.grid th {
    font-size: 11px; color: var(--text-dim); font-weight: 600; padding: 0 6px;
  }
  table.grid td.hora {
    font-size: 12.5px; font-weight: 700; padding: 0 8px; white-space: nowrap;
  }
  td.celda { border-radius: 8px; text-align: center; padding: 6px 2px; }
  td.celda .n { font-size: 18px; font-weight: 700; line-height: 1; }
  td.celda .f { font-size: 10px; opacity: .75; }
  .tarjeta {
    border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px;
    background: var(--bg-card);
  }
  .tarjeta .cifra { font-size: 32px; font-weight: 700; color: #0369a1; line-height: 1.1; }
  .barra { height: 7px; background: var(--border); border-radius: 99px; margin-top: 8px; overflow: hidden; }
  .barra > div { height: 100%; }
  .rank { border-radius: 10px; padding: 14px 16px; }
  .rank .tit { font-size: 13px; font-weight: 700; margin-bottom: 10px; }
  .pill {
    display: inline-block; border-radius: 12px; padding: 3px 11px;
    font-size: 11.5px; font-weight: 600; margin: 0 5px 6px 0;
  }
  @media (max-width: 700px) { body { padding: 12px; } }
</style>
</head>
<body>

<h1>📊 Turnos fijos libres por área</h1>
<div class="sub">
  Ocupación estructural de la sala — para saber qué horarios son pico, dónde reforzar y dónde hay lugar para llenar.
  <span class="chip-regla">solo turnos fijos · no cuenta recuperatorios</span>
</div>

<div class="toolbar">
  <button class="btn btn-azul" onclick="cargar()">↻ Actualizar</button>
  <button class="btn btn-verde" onclick="copiarResumen()">📋 Copiar resumen</button>
  <span id="sello" style="font-size:11.5px;color:var(--text-dim)"></span>
</div>

<div id="cuerpo"><div class="loading">⏳ Calculando ocupación...</div></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://bqpjtoiictnzcasxfucf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_yvuXDxrkRrhXwmZBnE_a_Q_zDBz0iDi';
const sb = createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { lock: (name, acquireTimeout, fn) => fn() },
  global: { fetch: (url, opts = {}) => fetch(url, { ...opts, cache: 'no-store' }) }
});

/* ============================================================
   TURNOS FIJOS LIBRES — capacidad ociosa estructural
   Pedido de Lu (29/7/26). Es para MÉTRICAS, no para dar turno.

   REGLA (definida por Lu): cuenta SOLO turnos FIJOS (turno_alumnos).
   NO cuenta recuperatorios, sueltas ni cambios de área (turno_agregados),
   porque son eventuales y no reflejan la ocupación real de la sala.

   FUENTE ÚNICA: fn_turnos_libres_fijos(). La regla de "quién ocupa un
   lugar" vive adentro de la función, no acá. Si cambia la regla, se
   toca el SQL y esta pantalla la sigue sola.
   ============================================================ */

const DIAS = ['Lunes','Martes','Miércoles','Jueves','Viernes'];
const $ = s => document.querySelector(s);
let AREAS = null;

function color(pct, libres) {
  if (libres <= 0) return { bg:'#fee2e2', bd:'#ef4444', tx:'#991b1b' };   // lleno
  if (pct >= 80)   return { bg:'#ffedd5', bd:'#f97316', tx:'#9a3412' };   // casi lleno
  if (pct >= 40)   return { bg:'#dcfce7', bd:'#22c55e', tx:'#166534' };   // sano
  return             { bg:'#e0f2fe', bd:'#0ea5e9', tx:'#075985' };        // flojo
}

function agrupar(filas) {
  const areas = {};
  (filas || []).forEach(r => {
    if (!DIAS.includes(r.dia)) return;
    const hora = String(r.hora || '').slice(0, 5);
    if (!areas[r.servicio]) areas[r.servicio] = { horas:{}, cap:0, ocup:0, libres:0 };
    const A = areas[r.servicio];
    if (!A.horas[hora]) A.horas[hora] = {};
    A.horas[hora][r.dia] = { cap:r.capacidad, ocup:r.fijos, libres:r.libres };
    A.cap += r.capacidad; A.ocup += r.fijos; A.libres += r.libres;
  });
  return areas;
}

async function cargar() {
  $('#cuerpo').innerHTML = '<div class="loading">⏳ Calculando ocupación...</div>';
  try {
    const { data, error } = await sb.rpc('fn_turnos_libres_fijos');
    if (error) throw error;
    AREAS = agrupar(data);
    render();
    $('#sello').textContent = 'Actualizado ' + new Date().toLocaleTimeString('es-AR', { hour:'2-digit', minute:'2-digit' });
  } catch (e) {
    console.error('fn_turnos_libres_fijos:', e);
    $('#cuerpo').innerHTML = `<div class="aviso">
      <strong>No se pudo calcular la ocupación.</strong><br>
      ${e.message || e}<br><br>
      Si dice que la función no existe, hay que correr <code>fn_turnos_libres_fijos.sql</code> en el SQL Editor de Supabase.
    </div>`;
  }
}
window.cargar = cargar;

function render() {
  const nombres = Object.keys(AREAS || {}).sort();
  if (!nombres.length) {
    $('#cuerpo').innerHTML = '<div class="loading">Sin turnos con capacidad cargada.</div>';
    return;
  }
  let html = '';

  // ---------- matriz hora × día, una por área ----------
  nombres.forEach(serv => {
    const A = AREAS[serv];
    const horas = Object.keys(A.horas).sort();
    const pctArea = A.cap ? Math.round(100 * A.ocup / A.cap) : 0;
    const porDia = {};
    DIAS.forEach(d => porDia[d] = { cap:0, ocup:0, libres:0 });

    html += `<div style="margin-bottom:28px">
      <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px">
        <span class="area-titulo">${serv}</span>
        <span class="area-meta">${A.ocup}/${A.cap} lugares fijos ocupados ·
          <strong style="color:#0369a1">${A.libres} libres</strong> · ${pctArea}% de ocupación</span>
      </div>
      <div style="overflow-x:auto"><table class="grid"><thead><tr><th style="text-align:left">Hora</th>`;
    DIAS.forEach(d => { html += `<th style="width:80px">${d.slice(0,3)}</th>`; });
    html += `<th style="width:66px">Libres</th></tr></thead><tbody>`;

    horas.forEach(h => {
      let libresFila = 0;
      html += `<tr><td class="hora">${h}</td>`;
      DIAS.forEach(d => {
        const c = A.horas[h][d];
        if (!c) { html += `<td style="background:var(--bg);border-radius:8px"></td>`; return; }
        const pct = c.cap ? Math.round(100 * c.ocup / c.cap) : 0;
        const col = color(pct, c.libres);
        libresFila += c.libres;
        porDia[d].cap += c.cap; porDia[d].ocup += c.ocup; porDia[d].libres += c.libres;
        html += `<td class="celda" title="${d} ${h} · ${serv} — ${c.ocup} de ${c.cap} ocupados"
          style="background:${col.bg};border:1.5px solid ${col.bd}">
          <div class="n" style="color:${col.tx}">${c.libres}</div>
          <div class="f" style="color:${col.tx}">${c.ocup}/${c.cap}</div></td>`;
      });
      html += `<td style="text-align:center;font-size:14px;font-weight:700;color:#0369a1">${libresFila}</td></tr>`;
    });

    html += `<tr><td style="font-size:11px;font-weight:600;color:var(--text-dim);padding:8px">Total día</td>`;
    DIAS.forEach(d => {
      const p = porDia[d];
      const pct = p.cap ? Math.round(100 * p.ocup / p.cap) : 0;
      html += `<td style="text-align:center;padding-top:5px">
        <div style="font-size:14px;font-weight:700;color:#0369a1">${p.libres}</div>
        <div style="font-size:10px;color:var(--text-dim)">${pct}%</div></td>`;
    });
    html += `<td style="text-align:center;font-size:15px;font-weight:700;color:#0369a1">${A.libres}</td></tr>`;
    html += `</tbody></table></div></div>`;
  });

  // ---------- rankings ----------
  const celdas = [];
  nombres.forEach(serv => {
    const A = AREAS[serv];
    Object.keys(A.horas).forEach(h => DIAS.forEach(d => {
      const c = A.horas[h][d];
      if (c) celdas.push({ serv, dia:d, hora:h, ...c, pct: c.cap ? 100 * c.ocup / c.cap : 0 });
    }));
  });
  const llenos = celdas.filter(c => c.libres === 0).sort((a,b) => b.cap - a.cap).slice(0,8);
  const vacios = celdas.slice().sort((a,b) => a.pct - b.pct || b.libres - a.libres).slice(0,8);
  const pill = (c, rojo) => `<span class="pill" style="background:${rojo?'#fee2e2':'#e0f2fe'};
    border:1px solid ${rojo?'#ef4444':'#0ea5e9'};color:${rojo?'#991b1b':'#075985'}">
    ${c.serv.slice(0,4)} · ${c.dia.slice(0,3)} ${c.hora} ${rojo?`(${c.cap} full)`:`(${c.libres} libres)`}</span>`;

  html += `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-bottom:24px">
    <div class="rank" style="border:1px solid #fecaca;background:#fef2f2">
      <div class="tit" style="color:#991b1b">🔴 Horarios pico — a reforzar</div>
      ${llenos.length ? llenos.map(c => pill(c, true)).join('') : '<div style="font-size:12.5px;color:var(--text-dim)">Ningún horario está lleno.</div>'}
    </div>
    <div class="rank" style="border:1px solid #bae6fd;background:#f0f9ff">
      <div class="tit" style="color:#075985">🔵 Horarios flojos — a llenar</div>
      ${vacios.map(c => pill(c, false)).join('')}
    </div>
  </div>`;

  // ---------- conteo final por área ----------
  html += `<div style="border-top:2px solid var(--border);padding-top:16px">
    <div style="font-size:14px;font-weight:700;margin-bottom:12px">Total de turnos fijos libres por área</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px">`;
  let capT = 0, ocupT = 0, libT = 0;
  nombres.forEach(serv => {
    const A = AREAS[serv];
    capT += A.cap; ocupT += A.ocup; libT += A.libres;
    const pct = A.cap ? Math.round(100 * A.ocup / A.cap) : 0;
    html += `<div class="tarjeta">
      <div style="font-size:12.5px;font-weight:600;color:var(--text-dim)">${serv}</div>
      <div class="cifra">${A.libres}</div>
      <div style="font-size:11.5px;color:var(--text-dim)">lugares fijos libres · ${A.ocup}/${A.cap} ocupados (${pct}%)</div>
      <div class="barra"><div style="width:${pct}%;background:${pct>=90?'var(--rojo)':pct>=70?'var(--naranja)':'var(--verde)'}"></div></div>
    </div>`;
  });
  const pctT = capT ? Math.round(100 * ocupT / capT) : 0;
  html += `<div class="tarjeta" style="border-color:var(--azul);background:var(--azul-soft)">
      <div style="font-size:12.5px;font-weight:600;color:#1e6fa0">TOTAL TF</div>
      <div class="cifra" style="color:#1e6fa0">${libT}</div>
      <div style="font-size:11.5px;color:#1e6fa0">lugares fijos libres · ${ocupT}/${capT} ocupados (${pctT}%)</div>
    </div></div></div>`;

  $('#cuerpo').innerHTML = html;
}

// Resumen en texto plano, listo para pegar en WhatsApp
function copiarResumen() {
  if (!AREAS) { alert('Todavía no se calculó la ocupación.'); return; }
  const hoy = new Date().toLocaleDateString('es-AR');
  let txt = `TURNOS FIJOS LIBRES — PuntoBiO TF (${hoy})\n(solo turnos fijos, no incluye recuperatorios)\n`;
  let libT = 0;
  Object.keys(AREAS).sort().forEach(serv => {
    const A = AREAS[serv];
    libT += A.libres;
    txt += `\n== ${serv.toUpperCase()} ==\n`;
    DIAS.forEach(d => {
      const partes = Object.keys(A.horas).sort()
        .filter(h => A.horas[h][d])
        .map(h => `${h} ${A.horas[h][d].libres}`);
      if (partes.length) txt += `${d}: ${partes.join(' · ')}\n`;
    });
    txt += `Total ${serv}: ${A.libres} libres (${A.ocup}/${A.cap} ocupados)\n`;
  });
  txt += `\nTOTAL TF: ${libT} lugares fijos libres`;
  navigator.clipboard.writeText(txt)
    .then(() => alert('✓ Resumen copiado. Pegalo donde quieras.'))
    .catch(() => alert('No se pudo copiar.'));
}
window.copiarResumen = copiarResumen;

cargar();
</script>
</body>
</html>
