  }
  function recalcular() {
    ROM_ITEMS.forEach(it => {
      ['D', 'I'].forEach(L => {
        const c = $(`c_${it.k}_${L}`); if (c) c.textContent = lado(it.k, L) != null ? fmt(lado(it.k, L), 0) : '—'
        const a = $(`a_${it.k}_${L}`); if (a && anteriores[it.k]?.[L] != null) a.innerHTML = `antes ${fmt(anteriores[it.k][L], 0)} ${pctTxt(cambio(it.k, L), it.menos)}`
      })
      const l = $(`l_${it.k}`), v = lsi(it.k)
      if (l) l.innerHTML = v == null ? '<span class="ref">—</span>' : `<span class="lsi ${v >= LSI_OK ? 'ok' : 'bad'}">${fmt(v, 1)}%</span>`
      const r = $(`r_${it.k}`)
      if (r && it.ref) { const malo = ['D', 'I'].filter(L => fueraRef(it, lado(it.k, L))); r.className = 'ref' + (malo.length ? ' bad' : ''); r.textContent = it.ref.txt + (malo.length ? ` · fuera: ${malo.join(' y ')}` : '') }
    })
    resumen()
  }
  function resumen() {
    const medidas = ROM_ITEMS.filter(it => lado(it.k, 'D') != null || lado(it.k, 'I') != null)
    if (!medidas.length) { $('res').innerHTML = ''; return }
    const lsis = medidas.map(it => ({ it, v: lsi(it.k) })).filter(x => x.v != null)
    const bajos = lsis.filter(x => x.v < LSI_OK), fuera = medidas.filter(it => ['D', 'I'].some(L => fueraRef(it, lado(it.k, L))))
    const minLsi = lsis.length ? Math.min(...lsis.map(x => x.v)) : null
    const detalle = { medidas: {}, observaciones: obs || null }
    medidas.forEach(it => { detalle.medidas[it.k] = { D: lado(it.k, 'D'), I: lado(it.k, 'I'), lsi: lsi(it.k) != null ? +lsi(it.k).toFixed(1) : null } })
    const txt = 'ROM: ' + medidas.map(it => `${it.n.replace(/ \(.*\)/, '')} D ${fmt(lado(it.k, 'D'), 0)} / I ${fmt(lado(it.k, 'I'), 0)}${lsi(it.k) != null ? ` (LSI ${fmt(lsi(it.k), 0)}%)` : ''}`).join(' · ') + (obs ? `. Obs: ${obs}` : '')
    mostrarResultado(`
      <div class="val">${medidas.length} <span style="font-size:16px">medida${medidas.length === 1 ? '' : 's'}${minLsi != null ? ` · LSI más bajo ${fmt(minLsi, 1)}%` : ''}</span></div>
      ${bajos.length ? `<div class="interp c-bad">Asimetría (LSI < ${LSI_OK}%): ${bajos.map(x => x.it.n).join(', ')}</div>` : lsis.length ? '<div class="interp c-ok">Sin asimetrías relevantes</div>' : ''}
      ${fuera.length ? `<div class="interp c-warn">Fuera de referencia: ${fuera.map(it => it.n).join(', ')}</div>` : ''}`,
      txt, { valor: minLsi != null ? +minLsi.toFixed(1) : null, unidad: '% LSI', detalle })
  }
  async function cargarHistorial() {
    if (!paciente || (paciente.origen === 'PRUEBA' && !paciente.demo)) return
    const { data } = await supabase.from('tests_biolab').select('detalle, creado_en')
      .or(paciente.dni ? `paciente_dni.eq.${paciente.dni},and(origen.eq.${paciente.origen},paciente_id.eq.${paciente.id})` : `and(origen.eq.${paciente.origen},paciente_id.eq.${paciente.id})`)
      .eq('test', 'rom').order('creado_en', { ascending: true })
    historial = (data || []).map(r => ({ f: new Date(r.creado_en), m: (r.detalle && r.detalle.medidas) || {} }))
    anteriores = {}
    historial.forEach(t => Object.entries(t.m).forEach(([k, v]) => { anteriores[k] = v }))
    recalcular(); pintarEvolucion()
  }
  function pintarEvolucion() {
    const box = $('evoRom'), conDatos = ROM_ITEMS.filter(it => historial.filter(t => t.m[it.k]).length >= 1)
    if (!conDatos.length) { box.style.display = 'none'; return }
    box.style.display = ''
    box.innerHTML = `<h3>📈 Evolución por medida</h3><div class="sub2">${esc(paciente.nombre)} · <span class="leg"><b style="background:#14B8C4"></b>Izquierda<b style="background:#F0832A"></b>Derecha</span></div>
      <div class="evodi">${conDatos.map(it => `<div class="box"><h5>${it.n}</h5>${curvaDI(historial.filter(t => t.m[it.k]).map(t => ({ f: t.f, D: t.m[it.k].D, I: t.m[it.k].I, lsi: t.m[it.k].lsi })), it)}</div>`).join('')}</div>`
  }
  document.querySelectorAll('#chips button').forEach(b => b.onclick = () => { secs.has(b.dataset.s) ? secs.delete(b.dataset.s) : secs.add(b.dataset.s); pintarTabla() })
  $('romObs').oninput = (e) => { obs = e.target.value; resumen() }
  pintarTabla()
  cargarHistorial()
  setTimeout(() => cargarUltima('rom'), 0)
}

// curva D / I de una medida (con su referencia si tiene)
function curvaDI(tomas, it) {
  // izquierdo turquesa, derecho naranja (igual en todo el sistema)
  return curvaPro({ W: 420, H: 220, dec: 0, series: [
      { nombre: 'Izquierdo', color: COLOR_I, puntos: tomas.filter(t => t.I != null).map(t => ({ f: t.f, v: t.I })) },
      { nombre: 'Derecho', color: COLOR_D, puntos: tomas.filter(t => t.D != null).map(t => ({ f: t.f, v: t.D })) }],
    bandas: it.ref && (it.ref.min ?? it.ref.max) != null ? [{ y: it.ref.min ?? it.ref.max, txt: it.ref.txt }] : [] })
}

// 6 MINUTOS AUTOMÁTICO: el iPad en el cono de salida, mirando de costado el paso. Cuenta una vuelta cada vez
// que el paciente vuelve a aparecer en cuadro después de haberse ido. Avisa cada minuto con voz, corta solo
// a los 6:00 y estima los metros de la última vuelta incompleta con el tiempo promedio por vuelta.
// ============================================================
function abrir6min(largo, alTerminar) {
  const ca = camaraAuto('6 minutos de marcha · cuenta las vueltas solo',
    'Apoyá el iPad en el <b>cono de salida</b>, de costado al pasillo, que se vea cuando el paciente llega y gira. Arranca con el paciente <b>parado al lado del cono</b>. Cada vez que vuelve y pasa por el cono se suma una vuelta sola. Si hace falta corregir, usá −1 / +1.')
  let vueltas = 0, t0 = null, presente = true, ultVista = 0, ultVuelta = null, iv = null, fin = false, avisos = 0, tiemposVuelta = []
  const visible = (P) => P && [11, 12, 23, 24].filter(i => P[i].v > 0.5).length >= 3
  const pintar = () => { const t = t0 ? Math.min(360, (Date.now() - t0) / 1000) : 0
    ca.cartel(`${String(Math.floor((360 - t) / 60)).padStart(1, '0')}:${String(Math.floor((360 - t) % 60)).padStart(2, '0')} · <span style="color:#7CC4F2">${vueltas} vuelta${vueltas === 1 ? '' : 's'}</span>${largo ? ` · ${Math.round(vueltas * largo * 2)} m` : ''}`) }
  ca.alCuadro = (P) => {
    if (!t0 || fin) return
    const ahora = Date.now()
    if (visible(P)) {
      if (!presente && ahora - ultVista > 2500 && (!ultVuelta || ahora - ultVuelta > 5000)) {      // volvió después de irse: +1 vuelta
        vueltas++; if (ultVuelta) tiemposVuelta.push(ahora - ultVuelta); ultVuelta = ahora; beep(1000, 90); decir(vueltas + ''); pintar()
      }
      presente = true; ultVista = ahora
    } else if (ahora - ultVista > 1200) presente = false
  }
  const terminar = (porTiempo) => {
    if (fin) return; fin = true; clearInterval(iv)
    const seg = Math.min(360, Math.round((Date.now() - t0) / 1000))
    const prom = tiemposVuelta.length ? tiemposVuelta.reduce((a, b) => a + b, 0) / tiemposVuelta.length : (ultVuelta ? (ultVuelta - t0) / Math.max(1, vueltas) : null)
    const desde = (Date.now() - (ultVuelta || t0))
    const extra = largo && prom ? Math.min(largo * 2, Math.round(desde / prom * largo * 2 * 10) / 10) : null
    decir(porTiempo ? 'Tiempo. Quedate donde estás.' : 'Listo.')
    ca.cartel(`Terminó: <b>${vueltas}</b> vueltas${extra != null ? ` + ~${String(extra).replace('.', ',')} m de la última` : ''}`)
    ca.botones([['✓ Usar estos datos', () => { alTerminar({ tiempo: seg, vueltas, extra }); ca.cerrar() }, true]])
  }
  ca.botones([['▶ Empezar', async () => {
    for (const n of ['3', '2', '1']) { decir(n); ca.cartel(n); await ca.esperar(900) }
    decir('Ya'); t0 = Date.now(); ultVista = t0; presente = true; ca.ocultarEncuadre(); pintar()
    iv = setInterval(() => { const t = (Date.now() - t0) / 1000; pintar()
      const min = Math.floor(t / 60); if (min > avisos && min < 6) { avisos = min; decir(`Lleva ${min} minuto${min > 1 ? 's' : ''}. Siga así, le quedan ${6 - min}.`) }
      if (t >= 360) terminar(true) }, 500)
    ca.botones([['−1', () => { vueltas = Math.max(0, vueltas - 1); pintar() }], ['+1', () => { vueltas++; ultVuelta = Date.now(); pintar() }], ['⏹ Terminar antes', () => terminar(false)]])
  }, true]])
  ca.cartel('Paciente al lado del cono · tocá ▶ Empezar')
}

  const pintarCont = (t) => { const e = esperadas(t), a = e - C.n
    ov.querySelector('#eCont').innerHTML = `Subidas: <b>${C.n}</b> de ${e} ${a >= 2 ? `<span style="color:#fca5a5">· atrasado ${a}</span>` : '<span style="color:#86efac">· al ritmo ✓</span>'}` }

// SFMA AUTOMÁTICO: flexión y extensión de perfil, rotación de frente. Mide con el video lo que se puede medir,

// ============================================================
function abrirSFMA(alTerminar) {

    ? { h: 12, c: 24, r: 26, t: 28, tal: 30, pie: 32, mu: 16, de: 20, o: 8 } : { h: 11, c: 23, r: 25, t: 27, tal: 29, pie: 31, mu: 15, de: 19, o: 7 }
  const medirDurante = (seg, fn) => new Promise(res => { const t0 = Date.now(); ca.alCuadro = (P) => { if (P) fn(P) ; if (Date.now() - t0 > seg * 1000) { ca.alCuadro = null; res() } } })
  const cuenta = async (txt) => { for (const n of ['3', '2', '1']) { ca.cartel(n); decir(n); await ca.esperar(850) } ca.cartel(txt); decir(txt) }
  const correr = async () => {
    // ---- FLEXIÓN (de perfil) ----
    ca.cartel('De PERFIL, pies juntos'); decir('Ponete de perfil, pies juntos'); await ca.esperar(2500)
    await cuenta('Bajá a tocarte los pies, rodillas estiradas')

      mejorTope = Math.max(mejorTope, tope)        // >= 0: los dedos llegan a la altura de los pies
      rodMin = Math.min(rodMin, angulo3(P[s.c], P[s.r], P[s.t])); flexMax = Math.max(flexMax, 180 - angulo3(P[s.h], P[s.c], P[s.r])) })
    R.f_toca = mejorTope >= -0.03 ? 'SI' : 'NO'

    let sf = null; try { if (cuadroFlex) sf = await Promise.race([sfmaFlex(cuadroFlex), ca.esperar(8000).then(() => null)]) } catch (e) {}
    if (sf) { if (sf.f_sacro) R.f_sacro = sf.f_sacro; if (sf.f_curva) R.f_curva = sf.f_curva; R._sil = sf }
    R.f_dolor = (await ca.preguntar('¿Te dolió al bajar?', ['NO', 'SI']))
    // ---- EXTENSIÓN (de perfil) ----
    ca.cartel('Ahora brazos arriba'); decir('Ahora brazos arriba, sin moverte del lugar'); await ca.esperar(2500)
    await cuenta('Arqueate hacia atrás todo lo que puedas')
    let brazos = false, eias = -1e9, escap = -1e9
    await medirDurante(6, (P) => { const s = lado(P), frente = Math.sign((P[0].x - P[s.o].x) || 1), alto = Math.abs(P[s.t].y - P[s.c].y) * 2 || 1
      if (P[s.mu].y < P[0].y) brazos = true
      eias = Math.max(eias, (P[s.c].x - P[s.pie].x) * frente / alto + 0.04)       // la EIAS está un poco por delante del centro de la cadera
      escap = Math.max(escap, (P[s.tal].x - P[s.h].x) * frente / alto) })        // > 0: el hombro pasó por detrás del talón

    R.e_dolor = (await ca.preguntar('¿Te dolió al ir hacia atrás?', ['NO', 'SI']))

        rodMin2 = Math.min(rodMin2, angulo3(P[23], P[25], P[27]), angulo3(P[24], P[26], P[28])) })
      const aC = Math.acos(Math.min(1, minC)) * 180 / Math.PI, aH = Math.acos(Math.min(1, minH)) * 180 / Math.PI
      R['r_pelvis_' + L] = aC >= 50 ? 'SI' : 'NO'; R['r_hombros_' + L] = aH >= 50 ? 'SI' : 'NO'; R['r_sin_desvio_' + L] = rodMin2 >= 165 ? 'SI' : 'NO'
      R['_rot_' + L] = { pelvis: Math.round(aC), hombros: Math.round(aH) }

    ca.ov.querySelector('.ay').innerHTML = '<b>Medido:</b> ' + esc(resumen) + '<br>Todo se cargó solo (el ángulo sacro y la curva salen de la silueta de la espalda en lo más bajo de la flexión).'

  }
  ca.botones([['▶ Empezar', () => { ca.botones([]); correr() }, true]])

// ============================================================
// SILUETA: lecturas de la espalda con la máscara de la persona (rock back, wall angel, SFMA).
// Todas devuelven una SUGERENCIA que cae sola en la planilla; el profesional la puede cambiar.
// ============================================================
async function siluetaDe(src) {
  const r = (await modeloImagenSeg()).detect(src)
  const m = r.segmentationMasks && r.segmentationMasks[0], L = r.landmarks && r.landmarks[0]; if (!m || !L) return null
  const mw = m.width, mh = m.height, a = m.getAsFloat32Array(); try { m.close() } catch (e) {}
  const ladoD = (L[12].visibility ?? 1) + (L[24].visibility ?? 1) >= (L[11].visibility ?? 1) + (L[23].visibility ?? 1)
  const ix = ladoD ? { h: 12, c: 24, o: 8 } : { h: 11, c: 23, o: 7 }
  const P = (i) => ({ x: L[i].x * mw, y: L[i].y * mh })
  const en = (x, y) => x >= 0 && y >= 0 && x < mw && y < mh && a[y * mw + x] > 0.5
  const arriba = (x) => { for (let y = 0; y < mh; y++) if (en(x, y)) return y; return null }          // borde superior en esa columna
  const atrasDe = (y, dir) => { if (dir > 0) { for (let x = mw - 1; x >= 0; x--) if (en(x, y)) return x } else { for (let x = 0; x < mw; x++) if (en(x, y)) return x } return null }
  return { mw, mh, L, P, ix, arriba, atrasDe, hom: P(ix.h), cad: P(ix.c), oreja: P(ix.o), nariz: P(0) }
}
// Rock back (cuadrupedia, de costado): el borde de arriba entre hombro y cadera tiene que ser casi recto.
async function rbRaquis(src) {
  const s = await siluetaDe(src); if (!s) return null
  const x0 = Math.round(Math.min(s.hom.x, s.cad.x)), x1 = Math.round(Math.max(s.hom.x, s.cad.x)), lg = Math.hypot(s.hom.x - s.cad.x, s.hom.y - s.cad.y) || 1
  const xa = Math.round(x0 + (x1 - x0) * 0.1), xb = Math.round(x1 - (x1 - x0) * 0.1), ya = s.arriba(xa), yb = s.arriba(xb); if (ya == null || yb == null || xb - xa < 10) return null
  let sube = 0, baja = 0
  for (let x = xa + 1; x < xb; x++) { const y = s.arriba(x); if (y == null) continue; const yl = ya + (yb - ya) * (x - xa) / (xb - xa)
    sube = Math.max(sube, yl - y); baja = Math.max(baja, y - yl) }
  const redondeo = +(sube / lg * 100).toFixed(1), hundido = +(baja / lg * 100).toFixed(1)
  return { raquis: redondeo < 5 && hundido < 6 ? 'SI' : 'NO', redondeo, hundido }
}
// Wall angel de perfil: la pared es la línea de atrás que tocan espalda alta y cola. Mide si la cabeza y la lumbar se separan.
async function waPerfil(src) {
  const s = await siluetaDe(src); if (!s) return null
  const atras = -Math.sign((s.nariz.x - s.oreja.x) || 1), lg = Math.hypot(s.hom.x - s.cad.x, s.hom.y - s.cad.y) || 1
  const fila = (t) => Math.round(s.hom.y + (s.cad.y - s.hom.y) * t)
  const ext = (y0, y1) => { let best = null; for (let y = Math.max(0, Math.min(y0, y1)); y <= Math.min(s.mh - 1, Math.max(y0, y1)); y++) { const x = s.atrasDe(y, atras); if (x != null && (best == null || x * atras > best.x * atras)) best = { x, y } } return best }
  const tor = ext(fila(0.05), fila(0.35)), sac = ext(fila(0.85), fila(1.05)), cab = ext(Math.round(s.oreja.y - lg * 0.15), Math.round(s.oreja.y + lg * 0.05))
  if (!tor || !sac) return null
  let lum = 0
  for (let y = fila(0.5); y <= fila(0.85); y++) { const x = s.atrasDe(y, atras); if (x == null) continue
    const xl = tor.x + (sac.x - tor.x) * (y - tor.y) / ((sac.y - tor.y) || 1); lum = Math.max(lum, (xl - x) * atras) }
  const gapCab = cab ? Math.max(0, (tor.x - cab.x) * atras) : 0
  const pl = +(lum / lg * 100).toFixed(1), pc = +(gapCab / lg * 100).toFixed(1)
  return { lumbar: pl > 10 ? 'SI' : 'NO', cabeza: pc > 10 ? 'SI' : 'NO', lumbar_pct: pl, cabeza_pct: pc }
}
// SFMA flexión (de perfil, en lo más bajo): ángulo del sacro (pendiente de la espalda al salir de la cola) y si la curva es pareja.
async function sfmaFlex(src) {
  const s = await siluetaDe(src); if (!s) return null
  const x0 = Math.round(Math.min(s.hom.x, s.cad.x)), x1 = Math.round(Math.max(s.hom.x, s.cad.x)); if (x1 - x0 < 20) return null
  const pts = []; for (let x = x0; x <= x1; x++) { const y = s.arriba(x); if (y != null) pts.push({ x, y }) }
  if (pts.length < 10) return null
  const apex = pts.reduce((m, p) => p.y < m.y ? p : m, pts[0])                       // lo más alto: la cola / el sacro
  const haciaHombro = Math.sign(s.hom.x - apex.x) || 1, ancho = Math.abs(s.hom.x - apex.x) || 1
  const yEn = (fx) => { const x = Math.round(apex.x + haciaHombro * ancho * fx), p = pts.find(q => q.x === x); return p ? p.y : null }
  const y1 = yEn(0.1), y2 = yEn(0.3)
  const sacro = y1 != null && y2 != null ? Math.round(Math.atan2(Math.abs(y2 - y1), ancho * 0.2) * 180 / Math.PI) : null
  // curva pareja: se divide la espalda (de la cola al hombro) en 8 tramos y se mira la pendiente de cada uno.
  // Una curva pareja cambia de a poco; un tramo plano entre dos inclinados, o un quiebre brusco, la hace "no pareja".
  const tr = pts.filter(p => (p.x - apex.x) * haciaHombro >= 0).map(p => ({ t: Math.abs(p.x - apex.x) / ancho, y: p.y }))
  let res = null
  if (tr.length > 16) {
    const N = 8, pend = []
    for (let i = 0; i < N; i++) { const seg = tr.filter(p => p.t >= i / N && p.t < (i + 1) / N); if (seg.length < 2) { pend.push(null); continue }
      const f = seg[0], l = seg[seg.length - 1]; pend.push(Math.abs(l.y - f.y) / Math.max((l.t - f.t) * ancho, 1)) }
    let peor = 0
    for (let i = 1; i < N - 1; i++) { const [a1, b1, c1] = [pend[i - 1], pend[i], pend[i + 1]]; if (a1 == null || b1 == null || c1 == null) continue
      const vec = (a1 + c1) / 2; if (vec > 0.15) peor = Math.max(peor, (vec - b1) / vec) }          // tramo más plano que sus vecinos
    res = peor * 100                                                                                   // % que se "aplana" el peor tramo
  }
  return { f_sacro: sacro == null ? null : sacro >= 70 ? 'SI' : 'NO', f_curva: res == null ? null : res <= 50 ? 'SI' : 'NO', sacro_grados: sacro, curva_desvio_pct: res == null ? null : +res.toFixed(1) }
}

// Rock back INVERSO (boca arriba, de costado): rodillas al pecho y vuelve. Controla si vuelve despacio y sin tirones.

// ASLR con la cámara DESDE LOS PIES: mide si la pelvis rota o se inclina al levantar cada pierna.
function abrirASLR(listo) {

      v.push({ inc: Math.atan2(P[24].y - P[23].y, Math.abs(P[24].x - P[23].x) || 1) * 180 / Math.PI, z: (P[24].z - P[23].z) / (Math.abs(P[24].x - P[23].x) || 1) })
    if (Date.now() - t0 > seg * 1000) { ca.alCuadro = null; res(v) } } })
  const med = (a) => a.length ? a.slice().sort((x, y) => x - y)[Math.floor(a.length / 2)] : 0
  const correr = async () => {
    ca.cartel('Quieto, piernas estiradas'); decir('Quieto, piernas estiradas'); await ca.esperar(1500)
    const base = await medir(1.5), bi = med(base.map(x => x.inc)), bz = med(base.map(x => x.z))
    for (const [L, nom] of [['D', 'derecha'], ['I', 'izquierda']]) {

      const v = await medir(4), di = Math.max(...v.map(x => Math.abs(x.inc - bi)), 0), dz = Math.max(...v.map(x => Math.abs(x.z - bz)), 0)
      R['rota_' + L] = di > 5 || dz > 0.25 ? 'SI' : 'NO'; txt.push(`${L}: inclinación ${Math.round(di)}°`)
      ca.cartel('Bajala'); decir('Bajala'); await ca.esperar(2000)
    }
    ca.cartel('Listo ✓'); decir('Listo')
    ca.botones([['✓ Cargar en la planilla', () => { listo(R, 'ASLR · pelvis al levantar la pierna: ' + txt.join(' · ')); ca.cerrar() }, true], ['▶ Repetir', correr]])
  }
  ca.botones([['▶ Empezar', () => { ca.botones([]); correr() }, true]]); ca.cartel('Boca arriba · tocá ▶ Empezar')
}

    if (nota) { obs = (obs ? obs + '\n' : '') + nota; $('plObs').value = obs }
    recalcular() }, g)
  recalcular()
  setTimeout(() => cargarUltima(spec.id), 0)
}

// Pierna / brazo más visible (el que está del lado de la cámara)
const ladoCam = (ixD, ixI) => ixD.reduce((s, i) => s + pose[i].v, 0) >= ixI.reduce((s, i) => s + pose[i].v, 0) ? 'D' : 'I'
const angulo3 = (a, v, c) => { const u = { x: a.x - v.x, y: a.y - v.y }, w = { x: c.x - v.x, y: c.y - v.y }
  return Math.acos(Math.max(-1, Math.min(1, (u.x * w.x + u.y * w.y) / (Math.hypot(u.x, u.y) * Math.hypot(w.x, w.y) || 1)))) * 180 / Math.PI }

// APOYO UNIPODAL: por pierna, de frente. Corta si el pie libre baja al piso o el de apoyo se mueve.
function detectorUnipodal() {
  const PIERNAS = [{ lado: 'D', nombre: 'derecha', apoyo: [28, 32], libre: 27 }, { lado: 'I', nombre: 'izquierda', apoyo: [27, 31], libre: 28 }]
  const d = { idx: 0, fase: 'quieto', res: {}, autoArmar: false }
  const max = () => parseFloat(($('uniMax') || {}).value) || 30
  const ojos = () => ($('uniOjos') || {}).value || 'Abiertos'
  const prox = () => { if (d.idx < 2) setEstado(`Apoyo ${PIERNAS[d.idx].nombre.toUpperCase()}, ojos ${ojos().toLowerCase()}${d.idx ? ': ' + (inicioAuto ? 'arranca solo al quedar ubicado' : 'tocá Empezar cuando esté listo') + '.' : '. Tocá Empezar.'}`)
    $('btnEmpezar').textContent = d.idx < 2 ? `Empezar · apoyo ${PIERNAS[d.idx].nombre}` : 'Empezar' }
  d.init = prox
  d.empezar = async () => {
    if (d.idx >= 2) return
    d.autoArmar = true; d.fase = 'cuenta'; decir(`Parate en la pierna ${PIERNAS[d.idx].nombre} y levantá la otra`); await cuentaRegresiva()
    d.muestras = []; d.fase = 'calibrando'
  }
  d.frame = async (now) => {
    if (!pose) return
    const P = PIERNAS[d.idx]; if (!P) return
    if (d.fase === 'calibrando') {
      d.muestras.push({ ax: pose[P.apoyo[0]].x, ay: pose[P.apoyo[0]].y, piso: pose[P.apoyo[0]].y, libre: pose[P.libre].y, pierna: dist(pose[24], pose[28]) })
      if (d.muestras.length >= 10) { const m = d.muestras, av = f => m.reduce((s, x) => s + f(x), 0) / m.length
        d.base = { ax: av(x => x.ax), ay: av(x => x.ay), piso: av(x => x.piso), pierna: Math.max(av(x => x.pierna), 1) }
        d.t0 = now; d.fase = 'midiendo'; d.malos = 0; setEstado(`Apoyo ${P.nombre}: sosteniendo…`, 'ok') }
      return
    }
    if (d.fase !== 'midiendo') return
    const t = (now - d.t0) / 1000
    const libreBaja = (d.base.piso - pose[P.libre].y) / d.base.pierna < 0.03          // el pie libre llegó al nivel del piso
    const apoyoMov = dist({ x: pose[P.apoyo[0]].x, y: pose[P.apoyo[0]].y }, { x: d.base.ax, y: d.base.ay }) / d.base.pierna > 0.06
    d.malos = (libreBaja || apoyoMov) && t > 0.5 ? d.malos + 1 : 0
    setBig(`${fmt(Math.min(t, max()), 1)} s`)
    if (d.malos >= 5) d.cerrar(t, libreBaja ? 'apoyó el pie' : 'movió el pie de apoyo')
    else if (t >= max()) d.cerrar(max(), null)
  }
  d.cerrar = (t, motivo) => {
    if (d.fase !== 'midiendo') return
    if (t == null) t = (performance.now() - d.t0) / 1000
    const P = PIERNAS[d.idx]; d.fase = 'quieto'; beep(motivo ? 400 : 900, 400)
    d.res[P.lado] = { segundos: +Math.min(t, max()).toFixed(1), corte: motivo || (t >= max() ? 'llegó al máximo' : 'cortado a mano') }
    d.idx++
    if (d.idx < 2) { prox(); setTimeout(() => decir('Ahora la otra pierna.'), 700); setTimeout(() => { if (d.fase === 'quieto' && d.idx < 2) d.armado = true }, 4500) }
    else { d.autoArmar = false; decir('Listo.'); pintar() }
  }
  d.terminar = () => d.cerrar(null, 'cortado a mano')
  const pintar = () => {
    const sD = d.res.D ? d.res.D.segundos : null, sI = d.res.I ? d.res.I.segundos : null
    const lsi = sD != null && sI != null && Math.max(sD, sI) > 0 ? Math.min(sD, sI) / Math.max(sD, sI) * 100 : null
    const peor = Math.min(...[sD, sI].filter(v => v != null)), h = []
    ;['D', 'I'].forEach(L => { const v = d.res[L] && d.res[L].segundos; if (v != null && v < 10) h.push(`Menos de 10 s en apoyo ${L} (${fmt(v, 1)} s)`) })
    if (lsi != null && lsi < LSI_OK) h.push(`Asimetría (LSI ${fmt(lsi, 0)}%)`)
    mostrarResultado(`<div class="val">D ${fmt(sD, 1)} · I ${fmt(sI, 1)} <span style="font-size:16px">s · ojos ${esc(ojos().toLowerCase())}</span></div>
      <div class="interp ${h.length ? 'c-warn' : 'c-ok'}">${h.length ? h.map(esc).join(' · ') : 'Sin hallazgos'}</div>
      <table>${['D', 'I'].filter(L => d.res[L]).map(L => `<tr><td>Apoyo ${L === 'D' ? 'derecho' : 'izquierdo'}</td><td>${fmt(d.res[L].segundos, 1)} s · ${esc(d.res[L].corte)}</td></tr>`).join('')}</table>`,
      `Apoyo unipodal ojos ${ojos().toLowerCase()}: D ${fmt(sD, 1)} s · I ${fmt(sI, 1)} s${lsi != null ? ` · LSI ${fmt(lsi, 0)}%` : ''}`,
      { valor: isFinite(peor) ? peor : null, unidad: 's (peor lado)', detalle: { ojos: ojos(), maximo_s: max(), lados: d.res, lsi: lsi != null ? +lsi.toFixed(1) : null, hallazgos_txt: h } })
  }
  d.manual = () => { const a = prompt('Segundos apoyo DERECHO'), b = prompt('Segundos apoyo IZQUIERDO'); if (a != null) d.res.D = { segundos: +a, corte: 'a mano' }; if (b != null) d.res.I = { segundos: +b, corte: 'a mano' }; d.idx = 2; pintar() }
  return d
}

// ALCANCE FUNCIONAL: de costado. Marca dos puntos de escala (cm entre ellos). Toma la muñeca al inicio (brazo a 90°)
// y el máximo desplazamiento hacia adelante; si los pies se mueven, el intento no vale.
function detectorAlcance() {
  const d = { fase: 'lineas', lineas: [], intentos: [] }
  d.init = () => setEstado('Tocá en la imagen DOS MARCAS de la alfombra o la regla, y poné arriba los cm entre ellas.', 'warn')
  d.tap = (x) => { if (d.fase !== 'lineas') return; d.lineas.push(x)
    if (d.lineas.length === 2) { d.fase = 'quieto'; setEstado('Listo. Brazo adelante a 90°, puño cerrado, y tocá Empezar.', 'ok'); if ($('btnLineas')) $('btnLineas').disabled = false } }
  d.relineas = () => { d.lineas = []; d.fase = 'lineas'; d.init() }
  const escala = () => (parseFloat(($('distRef') || {}).value) || 100) / Math.max(Math.abs(d.lineas[1] - d.lineas[0]), 1)   // cm por pixel
  d.empezar = async () => { if (d.lineas.length < 2) { d.init(); return } d.muestras = []; d.fase = 'calibrando'; setEstado('Quieto con el brazo adelante…', 'warn') }
  d.frame = async (now) => {
    if (!pose || !['calibrando', 'midiendo'].includes(d.fase)) return
    const L = ladoCam([12, 14, 16], [11, 13, 15]), mu = L === 'D' ? 16 : 15
    if (d.fase === 'calibrando') {
      d.muestras.push({ x: pose[mu].x, pies: [pose[27].x, pose[28].x, pose[29].x, pose[30].x] })
      if (d.muestras.length >= 20) { const m = d.muestras
        d.x0 = m.reduce((s, a) => s + a.x, 0) / m.length; d.pies0 = [0, 1, 2, 3].map(i => m.reduce((s, a) => s + a.pies[i], 0) / m.length)
        d.dir = Math.sign(pose[0].x - mid(pose[23], pose[24]).x) || 1   // hacia donde mira
        d.fase = 'cuenta'; await cuentaRegresiva(); d.fase = 'midiendo'; d.max = 0; d.paso = false; d.volvio = 0; setEstado('Estirate hacia adelante…', 'ok') }
      return
    }
    const av = (pose[mu].x - d.x0) * d.dir * escala()
    if (av > d.max) d.max = av
    if ([27, 28, 29, 30].some((i, j) => Math.abs(pose[i].x - d.pies0[j]) * escala() > 4)) d.paso = true
    setBig(`${fmt(Math.max(0, av), 0)} cm · máx ${fmt(d.max, 0)}`)
    if (d.max > 5 && av < d.max * 0.3) { d.volvio++; if (d.volvio > 10) d.registrar() } else d.volvio = 0
  }
  d.registrar = () => {
    d.fase = 'quieto'; beep(d.paso ? 400 : 900, 400)
    d.intentos.push({ cm: +d.max.toFixed(1), valido: !d.paso })
    setEstado(d.paso ? 'Dio un paso o movió los pies: ese intento NO vale. Repetilo.' : `Intento ${d.intentos.filter(i => i.valido).length}: ${fmt(d.max, 0)} cm.`, d.paso ? 'err' : 'ok')
    pintar()
  }
  d.terminar = () => { if (d.fase === 'midiendo') d.registrar() }
  const pintar = () => {
    const ok = d.intentos.filter(i => i.valido).map(i => i.cm)
    const prom = ok.length ? ok.slice(-3).reduce((a, b) => a + b, 0) / Math.min(ok.length, 3) : null, mejor = ok.length ? Math.max(...ok) : null
    const lect = prom == null ? null : prom < 15 ? ['c-bad', 'Riesgo alto de caídas (orientativo)'] : prom < 25 ? ['c-warn', 'Riesgo moderado (orientativo)'] : ['c-ok', 'Alcance adecuado']
    mostrarResultado(`<div class="val">${fmt(prom, 1)} <span style="font-size:16px">cm (promedio de los últimos 3 válidos)</span></div>
      ${lect ? `<div class="interp ${lect[0]}">${lect[1]}</div>` : ''}
      <table>${d.intentos.map((x, i) => `<tr><td>Intento ${i + 1}</td><td>${fmt(x.cm, 1)} cm${x.valido ? '' : ' · no vale (movió los pies)'}</td></tr>`).join('')}</table>`,
      `Alcance funcional: ${fmt(prom, 1)} cm (mejor ${fmt(mejor, 1)} cm)`,
      { valor: prom != null ? +prom.toFixed(1) : null, unidad: 'cm', detalle: { mejor_cm: mejor, intentos: d.intentos } })
  }
  d.manual = () => { const v = prompt('Alcance en cm'); if (v && !isNaN(+v)) { d.intentos.push({ cm: +v, valido: true }); pintar() } }
  d.dibujar = (ctx, s) => { ctx.lineWidth = 4 * s; d.lineas.forEach(x => { ctx.strokeStyle = '#38bdf8'; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, ctx.canvas.height); ctx.stroke() }) }
  return d
}

// SIDE HOP: de frente, dos cintas a 30 cm. Cuenta cada vez que el tobillo de la pierna que salta cruza
// de un lado al otro de las dos cintas (debe pasar por afuera de ambas).
function detectorSideHop() {
  const d = { fase: 'lineas', lineas: [], res: {} }
  const lado = () => ($('selLado') || {}).value || 'D'
  d.init = () => setEstado('Tocá en la imagen la CINTA IZQUIERDA y después la DERECHA.', 'warn')
  d.tap = (x) => { if (d.fase !== 'lineas') return; d.lineas.push(x)
    if (d.lineas.length === 2) { d.lineas.sort((a, b) => a - b); d.fase = 'quieto'; setEstado('Listo. Elegí la pierna y tocá Empezar.', 'ok'); if ($('btnLineas')) $('btnLineas').disabled = false } }
  d.relineas = () => { d.lineas = []; d.fase = 'lineas'; d.init() }
  d.empezar = async () => { if (d.lineas.length < 2) { d.init(); return } d.fase = 'cuenta'; await cuentaRegresiva(); d.t0 = performance.now(); d.n = 0; d.zona = null; d.fase = 'midiendo' }
  d.frame = async (now) => {
    if (d.fase !== 'midiendo' || !pose) return
    const x = pose[lado() === 'D' ? 28 : 27].x, [a, b] = d.lineas
    const z = x < a ? 'izq' : x > b ? 'der' : null
    if (z && d.zona && z !== d.zona) { d.n++; avisarConteo(d.n) }
    if (z) d.zona = z
    const t = (now - d.t0) / 1000
    setBig(`${d.n} · ${Math.max(0, 30 - t).toFixed(0)} s`)
    if (t >= 30) d.cerrar()
  }
  d.cerrar = () => { if (d.fase !== 'midiendo') return; d.fase = 'quieto'; beep(900, 500); d.res[lado()] = d.n; setEstado(`Pierna ${lado() === 'D' ? 'derecha' : 'izquierda'}: ${d.n} saltos. Cambiá de pierna y repetí.`, 'ok'); pintar() }
  d.terminar = () => d.cerrar()
  const pintar = () => {
    const D = d.res.D, I = d.res.I, lsi = D != null && I != null && Math.max(D, I) > 0 ? Math.min(D, I) / Math.max(D, I) * 100 : null
    mostrarResultado(`<div class="val">D ${D ?? '—'} · I ${I ?? '—'} <span style="font-size:16px">saltos en 30 s</span></div>
      ${lsi != null ? `<div class="interp ${lsi >= LSI_OK ? 'c-ok' : 'c-bad'}">LSI ${fmt(lsi, 1)}%</div>` : '<div class="nota">Hacé las dos piernas para el LSI.</div>'}`,
      `Side hop 30 s: D ${D ?? '—'} · I ${I ?? '—'}${lsi != null ? ` · LSI ${fmt(lsi, 1)}%` : ''}`,
      { valor: lsi != null ? +lsi.toFixed(1) : null, unidad: '% LSI', detalle: { saltos_D: D ?? null, saltos_I: I ?? null, hallazgos_txt: lsi != null && lsi < LSI_OK ? [`Asimetría side hop: LSI ${fmt(lsi, 1)}%`] : [] } })
  }
  d.manual = () => { const v = prompt(`Saltos en 30 s (pierna ${lado() === 'D' ? 'derecha' : 'izquierda'})`); if (v && !isNaN(+v)) { d.res[lado()] = +v; pintar() } }
  d.dibujar = (ctx, s) => { ctx.lineWidth = 4 * s; d.lineas.forEach(x => { ctx.strokeStyle = '#fbbf24'; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, ctx.canvas.height); ctx.stroke() }) }
  return d
}

// CKCUEST: de frente y bajo. Cuenta un toque cada vez que las muñecas se juntan (menos de 1/3 de la separación inicial)
// y se vuelven a separar. 15 s por intento; promedio de los intentos.
function detectorCkcuest() {
  const d = { fase: 'quieto', intentos: [] }
  d.init = () => setEstado('En posición, una mano en cada cinta. Tocá Empezar.')
  d.empezar = async () => { d.muestras = []; d.fase = 'calibrando' }
  d.frame = async (now) => {
    if (!pose) return
    if (d.fase === 'calibrando') { d.muestras.push(Math.abs(pose[15].x - pose[16].x))
      if (d.muestras.length >= 15) { d.sep0 = d.muestras.reduce((a, b) => a + b, 0) / d.muestras.length; d.fase = 'cuenta'; await cuentaRegresiva(); d.t0 = performance.now(); d.n = 0; d.junto = false; d.fase = 'midiendo' }
      return }
    if (d.fase !== 'midiendo') return
    const sep = Math.abs(pose[15].x - pose[16].x) / Math.max(d.sep0, 1)
    if (!d.junto && sep < 0.33) { d.junto = true; d.n++; avisarConteo(d.n) }
    if (d.junto && sep > 0.6) d.junto = false
    const t = (now - d.t0) / 1000; setBig(`${d.n} · ${Math.max(0, 15 - t).toFixed(0)} s`)
    if (t >= 15) d.cerrar()
  }
  d.cerrar = () => { if (d.fase !== 'midiendo') return; d.fase = 'quieto'; beep(900, 500); d.intentos.push(d.n)
    setEstado(`Intento ${d.intentos.length}: ${d.n} toques.${d.intentos.length < 3 ? ' Descanso de 45 s y otro.' : ''}`, 'ok'); pintar() }
  d.terminar = () => d.cerrar()
  const pintar = () => {
    const prom = d.intentos.reduce((a, b) => a + b, 0) / d.intentos.length
    mostrarResultado(`<div class="val">${fmt(prom, 1)} <span style="font-size:16px">toques (promedio de ${d.intentos.length})</span></div>
      <div class="nota">Intentos: ${d.intentos.join(' · ')}. Comparalo con sus tomas anteriores y, si querés, normalizalo por la altura.</div>`,
      `CKCUEST: ${fmt(prom, 1)} toques (intentos ${d.intentos.join(', ')})`, { valor: +prom.toFixed(1), unidad: 'toques', detalle: { intentos: d.intentos } })
  }
  d.manual = () => { const v = prompt('Toques en 15 s'); if (v && !isNaN(+v)) { d.intentos.push(+v); pintar() } }
  return d
}

// SILLA: sentado de costado. Cuenta cada vez que queda PARADO (cadera arriba) y vuelve a sentarse.
function detectorSilla(modo) {
  const d = { fase: 'quieto', n: 0, arriba: false }
  d.init = () => setEstado('Sentado, brazos cruzados, de costado al iPad. Tocá Empezar.')
  const cad = () => { const L = ladoCam([24, 26, 28], [23, 25, 27]), [h, k] = L === 'D' ? [24, 26] : [23, 25]; return { y: pose[h].y, muslo: dist(pose[h], pose[k]) } }
  d.empezar = async () => { d.muestras = []; d.n = 0; d.arriba = false; d.fase = 'calibrando'; setEstado('Sentado y quieto: midiendo…', 'warn') }
  d.frame = async (now) => {
    if (!pose) return
    if (d.fase === 'calibrando') {
      d.muestras.push(cad())
      if (d.muestras.length >= 14) {
        d.base = d.muestras.reduce((s, m) => s + m.y, 0) / d.muestras.length
        d.muslo = Math.max(d.muestras.reduce((s, m) => s + m.muslo, 0) / d.muestras.length, 1)
        d.fase = 'cuenta'; await cuentaRegresiva(); d.t0 = performance.now(); d.fase = 'midiendo'
        setEstado(modo === '5rep' ? 'Midiendo: 5 veces, lo más rápido posible' : 'Midiendo: todas las que pueda en 30 s', 'ok')
      }
      return
    }
    if (d.fase !== 'midiendo') return
    const t = (now - d.t0) / 1000, sube = (d.base - cad().y) / d.muslo
    if (!d.arriba && sube > 0.55) { d.arriba = true; d.n++; avisarConteo(d.n)
      if (modo === '5rep' && d.n >= 5) { d.final(t); return } }
    if (d.arriba && sube < 0.2) d.arriba = false
    setBig(modo === '5rep' ? `${d.n} / 5 · ${fmt(t, 1)} s` : `${d.n} · ${Math.max(0, 30 - t).toFixed(0)} s`)
    if (modo === '30s' && t >= 30) d.final(30)
    if (modo === '5rep' && t >= 60) d.final(null)
  }
  d.final = (t) => {
    if (d.fase !== 'midiendo') return
    d.fase = 'fin'; beep(900, 500); setEstado('Terminado', 'ok')
    if (modo === '5rep') {
      const pts = t == null ? 0 : t <= 11.19 ? 4 : t <= 13.69 ? 3 : t <= 16.69 ? 2 : 1
      setBig(t == null ? 'No completó' : fmt(t, 2) + ' s')
      mostrarResultado(`<div class="val">${t == null ? 'No completó' : fmt(t, 2) + ' <span style="font-size:16px">s</span>'}</div>
        <div class="interp ${pts >= 3 ? 'c-ok' : pts === 2 ? 'c-warn' : 'c-bad'}">Puntaje de silla del SPPB: ${pts} / 4</div>
        <div class="nota">${d.n} de 5 repeticiones. Este puntaje completa el SPPB (equilibrio + marcha + silla).</div>`,
        `Silla 5 repeticiones: ${t == null ? 'no completó' : fmt(t, 2) + ' s'} · SPPB silla ${pts}/4`,
        { valor: t == null ? null : +t.toFixed(2), unidad: 's', detalle: { sppb_silla: pts, repeticiones: d.n } })
    } else {
      setBig(String(d.n))
      mostrarResultado(`<div class="val">${d.n} <span style="font-size:16px">repeticiones en 30 s</span></div>
        <div class="nota">Comparalo con las tablas por edad y sexo y con sus tomas anteriores.</div>`,
        `Silla 30 s: ${d.n} repeticiones`, { valor: d.n, unidad: 'repeticiones', detalle: {} })
    }
  }
  d.terminar = () => { if (d.fase === 'midiendo') d.final(modo === '30s' ? (performance.now() - d.t0) / 1000 : null) }
  return d
}

// PUSH / PULL: de costado. Push: cuenta cuando el codo baja de 90° y vuelve a estirarse; mira si la cadera cae.
// Pull: cuenta cuando pasa de brazos estirados a mentón (nariz) por arriba de las manos.
function detectorReps(tipo) {
  const d = { fase: 'quieto', n: 0, malas: 0, abajo: false, ult: 0 }
  d.init = () => setEstado(tipo === 'push' ? 'En posición de flexión, de costado al iPad. Tocá Empezar.' : 'Colgado de la barra, brazos estirados. Tocá Empezar.')
  const variante = () => ($('selVar') || {}).value || ''
  d.empezar = async () => { d.n = 0; d.malas = 0; d.abajo = false; d.repMala = false; d.fase = 'cuenta'; await cuentaRegresiva(); d.ult = performance.now(); d.fase = 'midiendo'; setEstado('Contando…', 'ok') }
  d.frame = async (now) => {
    if (d.fase !== 'midiendo' || !pose) return
    const L = ladoCam([12, 14, 16, 24, 28], [11, 13, 15, 23, 27])
    const [sh, el, wr, hp, an] = L === 'D' ? [12, 14, 16, 24, 28] : [11, 13, 15, 23, 27]
    const codo = angulo3(pose[sh], pose[el], pose[wr])
    if (tipo === 'push') {
      const cuerpo = angulo3(pose[sh], pose[hp], pose[variante() === 'De rodillas' ? (L === 'D' ? 26 : 25) : an])
      if (d.abajo && cuerpo < 160) d.repMala = true
      if (!d.abajo && codo < 90) { d.abajo = true; d.repMala = cuerpo < 160 }
      if (d.abajo && codo > 150) { d.abajo = false; d.n++; if (d.repMala) d.malas++; d.ult = now; avisarConteo(d.n) }
    } else {
      const arriba = pose[0].y < Math.min(pose[15].y, pose[16].y)
      if (!d.abajo && codo > 150) d.abajo = true
      if (d.abajo && arriba) { d.abajo = false; d.n++; d.ult = now; avisarConteo(d.n) }
    }
    setBig(String(d.n))
    if ((now - d.ult) / 1000 > 6) d.final()
  }
  d.final = () => {
    if (d.fase !== 'midiendo') return
    d.fase = 'fin'; beep(900, 500); setEstado('Terminado', 'ok')
    const v = variante(), buenas = d.n - d.malas
    mostrarResultado(`<div class="val">${d.n} <span style="font-size:16px">${tipo === 'push' ? 'flexiones' : 'dominadas'}${v ? ' · ' + esc(v.toLowerCase()) : ''}</span></div>
      ${tipo === 'push' ? `<div class="interp ${d.malas ? 'c-warn' : 'c-ok'}">${d.malas ? `${d.malas} con la cadera caída · ${buenas} con buena técnica` : 'Todas con el cuerpo alineado'}</div>` : ''}`,
      `${tipo === 'push' ? 'Push ups' : 'Pull ups'}${v ? ' (' + v + ')' : ''}: ${d.n}${tipo === 'push' && d.malas ? ` (${d.malas} con cadera caída)` : ''}`,
      { valor: d.n, unidad: 'repeticiones', detalle: { variante: v || null, cadera_caida: tipo === 'push' ? d.malas : null, hallazgos_txt: d.malas ? [`${d.malas} repeticiones con la cadera caída`] : [] } })
  }
  d.terminar = () => d.final()
  return d
}

// SALTOS: de costado sobre la alfombra. Se marcan la línea de salida y otra marca (metros entre ambas = escala).
// Detecta los despegues y aterrizajes por la altura de los tobillos respecto del piso; tras el último aterrizaje,
// cuando queda quieto, mide hasta el talón más atrasado (el de la pierna que salta en los hop).
function detectorSalto(variante) {
  const nSaltos = variante === 'triple' ? 3 : 1, unaPierna = variante !== 'bipodal'
  const d = { fase: 'lineas', lineas: [], intentos: [], aire: false }
  d.init = () => setEstado('Tocá en la imagen la LÍNEA DE SALIDA.', 'warn')
  d.tap = (x) => { if (d.fase !== 'lineas') return; d.lineas.push(x)
    if (d.lineas.length === 1) setEstado('Ahora tocá OTRA MARCA de la alfombra (hacia donde salta) y poné arriba los metros entre las dos.', 'warn')
    else { d.fase = 'quieto'; setEstado('Listo. Puntas de pie detrás de la línea y tocá Empezar.', 'ok'); if ($('btnLineas')) $('btnLineas').disabled = false } }
  d.relineas = () => { d.lineas = []; d.fase = 'lineas'; d.init() }
  const lado = () => unaPierna ? (($('selLado') || {}).value || 'D') : null
  const tobs = () => unaPierna ? (lado() === 'D' ? [28] : [27]) : [27, 28]
  const talones = () => unaPierna ? (lado() === 'D' ? [30] : [29]) : [29, 30]
  d.empezar = async () => {
    if (d.lineas.length < 2) { d.init(); return }
    d.muestras = []; d.fase = 'calibrando'; setEstado('Quieto detrás de la línea…', 'warn')
  }
  d.frame = async (now) => {
    if (!pose || ['lineas', 'quieto', 'fin', 'cuenta'].includes(d.fase)) return
    const piso = () => Math.max(...tobs().map(i => pose[i].y))
    if (d.fase === 'calibrando') {
      if (!visible(27, 28, 23, 24)) return
      d.muestras.push({ y: Math.max(pose[27].y, pose[28].y), pierna: (dist(pose[24], pose[28]) + dist(pose[23], pose[27])) / 2 })
      if (d.muestras.length >= 20) {
        d.pisoY = d.muestras.reduce((s, m) => s + m.y, 0) / d.muestras.length
        d.pierna = d.muestras.reduce((s, m) => s + m.pierna, 0) / d.muestras.length
        d.fase = 'cuenta'; await cuentaRegresiva(); d.fase = 'midiendo'; d.saltos = 0; d.aire = false; d.quieto = 0; d.prev = null; d.t0 = now
        setEstado(unaPierna ? `Saltando con la ${lado() === 'D' ? 'derecha' : 'izquierda'}…` : 'Saltando…', 'ok')
      }
      return
    }
    if (d.fase !== 'midiendo') return
    const alt = (d.pisoY - piso()) / d.pierna
    if (!d.aire && alt > 0.06) d.aire = true
    if (d.aire && alt < 0.025) { d.aire = false; d.saltos++; beep(1200, 40) }
    if (d.saltos >= nSaltos && !d.aire) {
      const tal = talones().map(i => ({ x: pose[i].x, y: pose[i].y }))
      const mov = d.prev ? Math.max(...tal.map((t, i) => dist(t, d.prev[i]))) / d.pierna : 1
      d.quieto = mov < 0.01 ? d.quieto + 1 : 0; d.prev = tal
      if (d.quieto >= 20) {
        const [A, B] = d.lineas, dir = Math.sign(B - A) || 1
        const metros = parseFloat(($('distRef') || {}).value) || 1
        const escala = metros * 100 / Math.max(Math.abs(B - A), 1)   // cm por pixel
        const atras = Math.min(...tal.map(t => (t.x - A) * dir))
        d.registrar(Math.max(0, atras * escala))
      }
    }
    if ((now - d.t0) / 1000 > 20) { setEstado('No detecté el salto completo. Revisá que se vean las dos líneas y los pies, o cargalo a mano.', 'err'); d.fase = 'quieto' }
  }
  d.registrar = (cm) => {
    d.fase = 'quieto'; beep(900, 400)
    d.intentos.push({ lado: lado(), cm: +cm.toFixed(1) }); setBig(fmt(cm, 0) + ' cm')
    setEstado(`Intento ${d.intentos.length}: ${fmt(cm, 0)} cm. Podés hacer otro (o cambiar de pierna).`, 'ok')
    pintar()
  }
  d.terminar = () => { d.fase = 'quieto' }
  const pintar = () => {
    const mejor = (L) => { const xs = d.intentos.filter(i => i.lado === L).map(i => i.cm); return xs.length ? Math.max(...xs) : null }
    let html, txt, datos
    if (!unaPierna) {
      const m = mejor(null)
      html = `<div class="val">${fmt(m, 0)} <span style="font-size:16px">cm</span></div>
        <table>${d.intentos.map((x, i) => `<tr class="${x.cm === m ? 'best' : ''}"><td>Intento ${i + 1}</td><td>${fmt(x.cm, 0)} cm</td></tr>`).join('')}</table>`
      txt = `Salto horizontal: ${fmt(m, 0)} cm (mejor de ${d.intentos.length})`
      datos = { valor: m, unidad: 'cm', detalle: { intentos_cm: d.intentos.map(x => x.cm) } }
    } else {
      const mD = mejor('D'), mI = mejor('I')
      const lsi = mD && mI ? Math.min(mD, mI) / Math.max(mD, mI) * 100 : null
      html = `<div class="val">D ${fmt(mD, 0)} · I ${fmt(mI, 0)} <span style="font-size:16px">cm</span></div>
        ${lsi != null ? `<div class="interp ${lsi >= LSI_OK ? 'c-ok' : 'c-bad'}">LSI ${fmt(lsi, 1)}% ${lsi >= LSI_OK ? '· simétrico' : '· asimetría'}</div>` : '<div class="nota">Hacé las dos piernas para el LSI.</div>'}
        <table>${d.intentos.map((x, i) => `<tr><td>Intento ${i + 1} · ${x.lado === 'D' ? 'derecha' : 'izquierda'}</td><td>${fmt(x.cm, 0)} cm</td></tr>`).join('')}</table>`
      txt = `${actual && actual.id === 'crossover' ? 'Crossover hop' : variante === 'triple' ? 'Triple hop' : 'Hop simple'}: D ${fmt(mD, 0)} cm · I ${fmt(mI, 0)} cm${lsi != null ? ` · LSI ${fmt(lsi, 1)}%` : ''}`
      datos = { valor: lsi != null ? +lsi.toFixed(1) : null, unidad: '% LSI', detalle: { mejor_D_cm: mD, mejor_I_cm: mI, intentos: d.intentos,
        hallazgos_txt: lsi != null && lsi < LSI_OK ? [`Asimetría de salto: LSI ${fmt(lsi, 1)}%`] : [] } }
    }
    mostrarResultado(html, txt, datos)
  }
  d.dibujar = (ctx, s) => {
    ctx.lineWidth = 4 * s
    d.lineas.forEach((x, i) => { ctx.strokeStyle = i === 0 ? '#22c55e' : '#38bdf8'; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, ctx.canvas.height); ctx.stroke()
      ctx.fillStyle = ctx.strokeStyle; ctx.font = `bold ${22 * s}px Manrope`; ctx.fillText(i === 0 ? 'SALIDA' : 'MARCA', x + 6 * s, 30 * s) })
  }
  d.manual = () => {
    const v = prompt(unaPierna ? `Distancia en cm (pierna ${lado() === 'D' ? 'derecha' : 'izquierda'})` : 'Distancia en cm')
    if (v && !isNaN(+v)) d.registrar(+v)
  }
  return d
}

// ============================================================
// DETECTORES

const DETECTORES = {

  // ---------- 2-MINUTE STEP TEST ----------
  step2() {
    const DUR = 120
    const d = { fase: 'quieto', muestras: [], objetivo: null, base: null, cuentaD: 0, cuentaI: 0, arribaD: false, arribaI: false, t0: 0 }
    d.empezar = async () => {
      d.fase = 'calibrando'; d.muestras = []; d.cuentaD = d.cuentaI = 0; d.arribaD = d.arribaI = false
      setEstado('Quieto 2 segundos: estoy midiendo cadera y rodilla…', 'warn'); setBig('')
    }
    d.frame = async (now) => {
      if (d.fase === 'calibrando') {
        if (!visible(L.hipR, L.kneeR, L.hipL, L.kneeL)) return
        d.muestras.push({ hR: pose[L.hipR].y, kR: pose[L.kneeR].y, hL: pose[L.hipL].y, kL: pose[L.kneeL].y })
        if (d.muestras.length >= 24) {
          const m = k => d.muestras.reduce((s, x) => s + x[k], 0) / d.muestras.length
          d.base = { kR: m('kR'), kL: m('kL') }
          d.objetivo = { R: (m('hR') + m('kR')) / 2, L: (m('hL') + m('kL')) / 2 }
          d.fase = 'cuenta'; await cuentaRegresiva(); d.t0 = performance.now(); d.fase = 'midiendo'
          setEstado('Midiendo… marchá levantando la rodilla hasta la línea', 'ok')
        }
        return
      }
      if (d.fase !== 'midiendo') return
      const t = (now - d.t0) / 1000
      if (pose) {
        const histD = d.base.kR - (d.base.kR - d.objetivo.R) * 0.35
        const histI = d.base.kL - (d.base.kL - d.objetivo.L) * 0.35
        const kR = pose[L.kneeR].y, kL = pose[L.kneeL].y
        if (!d.arribaD && kR <= d.objetivo.R) { d.arribaD = true; d.cuentaD++; avisarConteo(d.cuentaD) }
        if (d.arribaD && kR > histD) d.arribaD = false
        if (!d.arribaI && kL <= d.objetivo.L) { d.arribaI = true; d.cuentaI++ }
        if (d.arribaI && kL > histI) d.arribaI = false
      }
      const resta = Math.max(0, DUR - t)
      setBig(`${d.cuentaD}  ·  ${Math.floor(resta / 60)}:${String(Math.floor(resta % 60)).padStart(2, '0')}`)
      if (t >= DUR) d.terminar()

    d.terminar = () => {
      if (d.fase !== 'midiendo') { d.fase = 'quieto'; return }
      d.fase = 'fin'; beep(800, 500)
      setEstado('Terminado', 'ok'); setBig(`${d.cuentaD}`)
      mostrarResultado(`
        <div class="val">${d.cuentaD} <span style="font-size:16px">pasos (rodilla derecha)</span></div>
        <div class="interp">Rodilla izquierda: ${d.cuentaI} · diferencia ${d.cuentaD - d.cuentaI >= 0 ? '+' : ''}${d.cuentaD - d.cuentaI}</div>
        <div class="nota">Cargá el número en el 2-Minute Step Test de VALD: el sistema lo compara con la tabla por sexo y edad.</div>`,
        `2-Minute Step Test: ${d.cuentaD} pasos (rodilla der.) · izq. ${d.cuentaI}`,
        { valor: d.cuentaD, unidad: 'pasos', detalle: { rodilla_der: d.cuentaD, rodilla_izq: d.cuentaI } })
    }
    d.dibujar = (ctx, s) => {
      if (!d.objetivo) return
      ctx.setLineDash([12 * s, 8 * s]); ctx.lineWidth = 3 * s
      ctx.strokeStyle = '#fbbf24'; ctx.beginPath(); ctx.moveTo(0, d.objetivo.R); ctx.lineTo(ctx.canvas.width, d.objetivo.R); ctx.stroke()
      ctx.setLineDash([])
    }
    return d
  },

  // ---------- SENTADILLA OVERHEAD ----------
  // Dos vistas: FRENTE (rodillas, pies, peso) y COSTADO (tronco/tibia, brazos). 5 sentadillas por vista.
  // Se mide contra la postura inicial y se toma el peor valor en la parte baja de cada sentadilla.
  ohs() {
    const U = {
      valgo: 0.06, varo: 0.06,   // rodilla medial / lateral al pie (en largos de pierna)
      abduccion: 0.035,          // la punta del pie se abre hacia afuera respecto del inicio
      peso: 0.05,                // la pelvis se corre hacia un lado
      tibia: 12,                 // grados de diferencia entre tronco y tibia
      retropie: 6,               // grados que el retropié se va a valgo (desde atrás) → colapso de pie
      brazos: 20,                // grados que el brazo cae respecto de la línea del tronco
      abajo: 0.15, arriba: 0.05, // conteo: la cadera baja / vuelve (en largos de pierna)
    }
    const VISTAS = [{ id: 'frente', nombre: 'DE FRENTE', etq: 'Frente', enc: 'frente', voz: 'de frente' },
                    { id: 'perfil', nombre: 'DE PERFIL', etq: 'Perfil', enc: 'costado', voz: 'de perfil' },
                    { id: 'posterior', nombre: 'DE ESPALDAS', etq: 'Posterior', enc: 'espalda', voz: 'de espaldas' }]
    const NV = VISTAS.length
    const d = { idx: 0, fase: 'quieto', encuadre: 'frente', base: null, muestras: [], reps: 0, abajo: false, mx: {}, f: null, obs: '', fotos: {}, autoArmar: false }
    const prox = () => {
      d.encuadre = VISTAS[Math.min(d.idx, NV - 1)].enc; posOkFrames = 0; posOk = false
      if (d.idx < NV) setEstado(`Vista ${d.idx + 1} de ${NV} · ${VISTAS[d.idx].etq.toUpperCase()}: paciente ${VISTAS[d.idx].nombre} al iPad, brazos arriba${d.idx ? '. ' + (inicioAuto ? 'Arranca solo cuando esté bien ubicado' : 'Tocá Empezar cuando esté listo') + '.' : ', y tocá Empezar.'}`)
      $('btnEmpezar').textContent = d.idx < NV ? `Empezar · ${VISTAS[d.idx].etq}` : 'Empezar'
    }
    // foto en el punto más profundo: video + esqueleto + nombre de la vista
    const sacarFoto = (vista) => {
      const v = $('video'), c = $('canvas'); if (!v || !v.videoWidth) return
      const k = Math.min(1, 720 / Math.max(v.videoWidth, v.videoHeight))
      const W = Math.round(v.videoWidth * k), H = Math.round(v.videoHeight * k)
      const f = document.createElement('canvas'); f.width = W; f.height = H
      const x = f.getContext('2d')
      if (facing === 'user') { x.translate(W, 0); x.scale(-1, 1) }
      x.drawImage(v, 0, 0, W, H); x.drawImage(c, 0, 0, W, H)
      x.setTransform(1, 0, 0, 1, 0, 0)
      const bh = Math.round(H * 0.07)
      x.fillStyle = 'rgba(15,23,42,.82)'; x.fillRect(0, H - bh, W, bh)
      x.fillStyle = '#fff'; x.font = `800 ${Math.round(bh * 0.5)}px Manrope, sans-serif`; x.textBaseline = 'middle'
      x.fillText(`${vista.etq.toUpperCase()} · Sentadilla overhead`, bh * 0.3, H - bh / 2)
      x.textAlign = 'right'; x.font = `600 ${Math.round(bh * 0.38)}px Manrope, sans-serif`
      x.fillText(`${paciente && paciente.nombre ? paciente.nombre + ' · ' : ''}${new Date().toLocaleDateString('es-AR')}`, W - bh * 0.3, H - bh / 2)
      d.fotos[vista.id] = { vista: vista.etq, dataUrl: f.toDataURL('image/jpeg', 0.72) }
      if (vista.id === 'perfil') {                      // cuadro limpio (sin líneas) en lo más profundo, para leer la espalda
        const k2 = document.createElement('canvas'); k2.width = W; k2.height = H; const x2 = k2.getContext('2d')
        if (facing === 'user') { x2.translate(W, 0); x2.scale(-1, 1) }
        x2.drawImage(v, 0, 0, W, H); d.crudoPerfil = k2
      }
    }
    d.init = prox
    const ladoVisible = () => [[24, 26, 28, 12, 16], [23, 25, 27, 11, 15]]
      .map(ix => ({ ix, v: ix.reduce((s, i) => s + pose[i].v, 0) })).sort((a, b) => b.v - a.v)[0].ix
    const angVert = (a, b) => Math.atan2(Math.abs(b.x - a.x), Math.abs(a.y - b.y)) * 180 / Math.PI   // ángulo de un segmento con la vertical
    const angEntre = (a1, a2, b1, b2) => { const u = { x: a2.x - a1.x, y: a2.y - a1.y }, v = { x: b2.x - b1.x, y: b2.y - b1.y }
      return Math.acos(Math.max(-1, Math.min(1, (u.x * v.x + u.y * v.y) / (Math.hypot(u.x, u.y) * Math.hypot(v.x, v.y) || 1)))) * 180 / Math.PI }
    const medirFrente = () => {
      const pierna = Math.max((dist(pose[24], pose[28]) + dist(pose[23], pose[27])) / 2, 1)
      const dD = Math.sign(pose[23].x - pose[24].x) || 1     // hacia medial de la pierna derecha
      const lado = (hip, knee, toe, heel, dm) => ({ rod: ((pose[knee].x - pose[toe].x) * dm) / pierna, pie: ((pose[toe].x - pose[heel].x) * -dm) / pierna })
      const cad = mid(pose[23], pose[24]), tob = mid(pose[27], pose[28])
      return { pierna, D: lado(24, 26, 32, 30, dD), I: lado(23, 25, 31, 29, -dD), pelvis: ((cad.x - tob.x) * -dD) / pierna, cadY: cad.y }
    }
    const medirCostado = () => {
      const [h, k, a, sh, wr] = ladoVisible()
      const pierna = Math.max(dist(pose[h], pose[a]), 1)
      return { pierna, tronco: angVert(pose[h], pose[sh]), tibia: angVert(pose[a], pose[k]),
        brazo: angEntre(pose[h], pose[sh], pose[sh], pose[wr]), cadY: pose[h].y }
    }
    // desde atrás: retropié (línea talón → tobillo) y pelvis respecto de los pies
    const medirPost = () => {
      const pierna = Math.max((dist(pose[24], pose[28]) + dist(pose[23], pose[27])) / 2, 1)
      const [D, I] = pose[24].x >= pose[23].x ? [{ c: 24, t: 28, ta: 30 }, { c: 23, t: 27, ta: 29 }] : [{ c: 23, t: 27, ta: 29 }, { c: 24, t: 28, ta: 30 }]
      const dD = Math.sign(pose[I.c].x - pose[D.c].x) || -1           // hacia adentro de la pierna derecha
      const retro = (ank, heel, dm) => Math.atan2((pose[ank].x - pose[heel].x) * dm, Math.max(pose[heel].y - pose[ank].y, 1)) * 180 / Math.PI
      const cad = mid(pose[23], pose[24]), tob = mid(pose[27], pose[28])
      return { pierna, rD: retro(D.t, D.ta, dD), rI: retro(I.t, I.ta, -dD), pelvis: ((cad.x - tob.x) * -dD) / pierna, cadY: cad.y }
    }
    const vistaId = () => VISTAS[Math.min(d.idx, NV - 1)].id
    const medir = () => vistaId() === 'frente' ? medirFrente() : vistaId() === 'perfil' ? medirCostado() : medirPost()
    d.empezar = async () => {
      if (d.idx >= NV) return
      d.autoArmar = true                       // las vistas siguientes arrancan solas
      d.muestras = []; d.base = null; d.reps = 0; d.abajo = false; d.maxBaja = 0; d.hBaja = []; d.flexMax = 0; d.tUltRep = 0; d.malos = 0
      const vid = vistaId()
      d.mx = vid === 'frente' ? { valgoD: 0, valgoI: 0, varoD: 0, varoI: 0, abdD: 0, abdI: 0, pesoD: 0, pesoI: 0 }
           : vid === 'perfil' ? { tibia: 0, brazos: 0 } : { retroD: 0, retroI: 0, pesoD: 0, pesoI: 0 }
      d.fase = 'calibrando'; d.sinVer = 0; setBig(''); setEstado('Parado quieto con los brazos arriba: midiendo la postura inicial…', 'warn')
    }
    d.frame = async (now) => {
      if (!pose) return
      if (d.fase === 'calibrando') {
        // de perfil la pierna de atrás queda tapada: alcanza con ver bien la pierna que da a la cámara
        const okVis = vistaId() === 'perfil' ? (visible(24, 26, 28) || visible(23, 25, 27)) : visible(23, 24, 25, 26, 27, 28)
        if (!okVis) { if (++d.sinVer % 45 === 0) setEstado('Parado quieto con los brazos arriba: no veo bien las piernas, acomodá el iPad para que se vean de la cadera a los pies.', 'warn'); return }
        d.muestras.push(medir())
        if (d.muestras.length >= 16) {
          const m = d.muestras, av = f => m.reduce((s, x) => s + f(x), 0) / m.length
          const vid = vistaId()
          d.base = vid === 'frente'
            ? { pierna: av(x => x.pierna), cadY: av(x => x.cadY), pelvis: av(x => x.pelvis), D: { rod: av(x => x.D.rod), pie: av(x => x.D.pie) }, I: { rod: av(x => x.I.rod), pie: av(x => x.I.pie) } }
            : vid === 'posterior' ? { pierna: av(x => x.pierna), cadY: av(x => x.cadY), pelvis: av(x => x.pelvis), rD: av(x => x.rD), rI: av(x => x.rI) }
            : { pierna: av(x => x.pierna), cadY: av(x => x.cadY) }
          d.fase = 'cuenta'; await cuentaRegresiva(); d.fase = 'midiendo'
          setEstado(`${VISTAS[d.idx].etq}: sentadillas 0 de 5`, 'ok')
        }
        return
      }
      if (d.fase !== 'midiendo') return
      // solo cuenta si se ve bien la pierna (de perfil, la que da a la cámara): un cuadro dudoso no suma nada
      const [hh, kk, aa] = ladoVisible()
      const verPierna = vistaId() === 'perfil' ? [hh, kk, aa].every(i => pose[i].v > 0.6) : [23, 24, 25, 26, 27, 28].every(i => pose[i].v > 0.5)
      if (!verPierna) { d.malos = (d.malos || 0) + 1; if (d.malos > 20 && d.abajo) { d.abajo = false; d.flexMax = 0 } return }
      d.malos = 0
      const m = medir(), b = d.base
      const bajaCruda = (m.cadY - b.cadY) / b.pierna
      d.hBaja = (d.hBaja || []).concat(bajaCruda).slice(-5)                    // mediana de 5 cuadros: saca los saltos del detector
      const baja = d.hBaja.slice().sort((x, y) => x - y)[Math.floor(d.hBaja.length / 2)]
      const flexRod = 180 - angulo3(pose[hh], pose[kk], pose[aa])               // flexión real de rodilla
      if (d.abajo) d.flexMax = Math.max(d.flexMax || 0, flexRod)
      if (baja > d.maxBaja + 0.01 && baja > U.abajo) { d.maxBaja = baja; sacarFoto(VISTAS[d.idx]) }   // foto en lo más profundo
      if (baja > U.abajo) {                       // parte baja de la sentadilla: acá se juzga
        if (vistaId() === 'posterior') {
          d.mx.retroD = Math.max(d.mx.retroD, m.rD - b.rD); d.mx.retroI = Math.max(d.mx.retroI, m.rI - b.rI)
          const dp = m.pelvis - b.pelvis
          d.mx.pesoD = Math.max(d.mx.pesoD, -dp); d.mx.pesoI = Math.max(d.mx.pesoI, dp)
        } else if (vistaId() === 'frente') {

            d.mx['valgo' + L2] = Math.max(d.mx['valgo' + L2], dr)
            d.mx['varo' + L2] = Math.max(d.mx['varo' + L2], -dr)
            d.mx['abd' + L2] = Math.max(d.mx['abd' + L2], m[L2].pie - b[L2].pie)
          }
          const dp = m.pelvis - b.pelvis
          d.mx.pesoD = Math.max(d.mx.pesoD, -dp); d.mx.pesoI = Math.max(d.mx.pesoI, dp)
        } else {
          d.mx.tibia = Math.max(d.mx.tibia, m.tronco - m.tibia)
          d.mx.brazos = Math.max(d.mx.brazos, m.brazo)
        }
      }

      if (d.abajo && baja < U.arriba) {
        d.abajo = false

        // y pasó al menos 1 s desde la anterior: así no cuenta saltos del detector ni movimientos chicos
        const dur = performance.now() - (d.tAbajo || 0), desdeUlt = performance.now() - (d.tUltRep || 0)
        if ((d.flexMax || 0) < 40 || dur < 500 || desdeUlt < 1000) { d.flexMax = 0; return }
        d.tUltRep = performance.now(); d.flexMax = 0
        d.reps++; avisarConteo(d.reps)
        setEstado(`${VISTAS[d.idx].etq}: sentadillas ${d.reps} de 5`, 'ok')
        if (d.reps >= 5) d.cerrarVista()
      }
      setBig(`${d.reps} / 5`)
    }
    const lados = (dVal, iVal) => dVal && iVal ? 'BILATERAL' : dVal ? 'D' : iVal ? 'I' : 'NO'
    d.cerrarVista = () => {
      if (d.fase !== 'midiendo') return
      d.fase = 'quieto'; beep(900, 400)
      if (!d.f) d.f = { valgo: 'NO', varo: 'NO', abduccion: 'NO', colapso: 'NO', peso: 'NO', tibia: 'SI', arqueo: 'NO', brazos: 'NO' }

      if (vid === 'frente') {
        const s = {
          valgo: lados(mx.valgoD > U.valgo, mx.valgoI > U.valgo), varo: lados(mx.varoD > U.varo, mx.varoI > U.varo),
          abduccion: lados(mx.abdD > U.abduccion, mx.abdI > U.abduccion), peso: pesoDe(),
        }

      } else if (vid === 'posterior') {

        const s = { colapso: lados(mx.retroD > U.retropie, mx.retroI > U.retropie) }

        d.medPosterior = { retropie_D_grados: +mx.retroD.toFixed(1), retropie_I_grados: +mx.retroI.toFixed(1), pelvis_D: +mx.pesoD.toFixed(3), pelvis_I: +mx.pesoI.toFixed(3) }
      } else {

      }

        setTimeout(() => { const box = document.querySelector('#mando .btns'); if (!box) return

          const b = document.createElement('button'); b.className = 'b btnRepVista'; b.textContent = `↺ Repetir ${hecha.etq}`

            b.remove(); prox(); setEstado(`Repetimos ${VISTAS[d.idx].etq}: paciente ${VISTAS[d.idx].nombre} al iPad y tocá Empezar.`, 'warn'); decir(`Repetimos ${VISTAS[d.idx].voz}`) }

      } else { d.encuadre = 'frente'; d.autoArmar = false; decir('Listo. Terminamos.'); setEstado('Terminado. Revisá la planilla: todo se marcó solo (el arqueo lumbar sale de la silueta de perfil).', 'ok'); $('btnEmpezar').textContent = 'Empezar'; pintar() }
    }
