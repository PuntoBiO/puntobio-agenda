<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Test BiOLAB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f1f5f9; --card:#fff; --border:#e5e7eb; --text:#0f172a; --dim:#64748b; --faint:#94a3b8;
  --turq:#1e9fe0; --turq-d:#0c7bb8; --green:#16a34a; --amber:#d97706; --red:#dc2626;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Manrope',system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:auto}
.wrap{max-width:1200px;margin:0 auto;padding:24px 20px 60px}
h1{font-size:28px;font-weight:800;margin:0 0 4px}
.sub{color:var(--dim);margin:0 0 22px;font-size:15px}
.mono{font-family:'JetBrains Mono',monospace}

/* catálogo */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tcard{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.tcard:hover,.tcard:focus-visible{border-color:var(--turq);outline:none;box-shadow:0 0 0 3px rgba(30,159,224,.15)}
.tcard .ico{font-size:28px}
.tcard h3{margin:8px 0 4px;font-size:16px}
.tcard p{margin:0;color:var(--dim);font-size:13.5px;line-height:1.45}
.tcard .pos{margin-top:10px;font-size:12px;color:var(--turq-d);font-weight:600}

/* vista de test */
.back{background:none;border:0;color:var(--turq-d);font:inherit;font-weight:700;cursor:pointer;padding:0;margin-bottom:12px}
.layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:16px}
@media (max-width:900px){.layout{grid-template-columns:1fr}}
.stage{background:#0b1220;border-radius:14px;position:relative;overflow:hidden;min-height:260px;display:flex;align-items:center;justify-content:center}
.stage video,.stage canvas{width:100%;height:auto;display:block}
.stage canvas{position:absolute;inset:0;width:100%;height:100%}
.stage .vbox{position:relative;width:100%}
@media (min-width:901px){ .layout > .stage{align-self:start;position:sticky;top:12px;min-height:0} }
.stage .empty{color:#94a3b8;text-align:center;padding:30px;font-size:14px}
.hud{position:absolute;left:12px;top:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.pill{background:rgba(15,23,42,.78);color:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.pill.ok{background:rgba(22,163,74,.85)} .pill.warn{background:rgba(217,119,6,.9)}
.big{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:rgba(15,23,42,.8);color:#fff;border-radius:16px;padding:8px 22px;font-family:'JetBrains Mono',monospace;font-size:44px;font-weight:600;pointer-events:none;white-space:nowrap}
.big:empty{display:none}
.chk{position:absolute;left:12px;top:52px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.chk span{background:rgba(15,23,42,.78);color:#fff;border-radius:8px;padding:5px 10px;font-size:13px;font-weight:600}
.chk span.ok{background:rgba(22,163,74,.85)}
.chk span.no{background:rgba(220,38,38,.85)}
.consejo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(15,23,42,.85);color:#fff;border-radius:14px;padding:12px 20px;font-size:22px;font-weight:800;text-align:center;pointer-events:none;max-width:85%}
.consejo:empty{display:none}
.consejo.ok{background:rgba(22,163,74,.9)}
.pacbox{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:18px}
.pacbox label{font-weight:700;font-size:14px;display:block;margin-bottom:8px}
.pacbox input{font:inherit;font-size:16px;width:100%;padding:12px;border:1px solid var(--border);border-radius:10px}
.lista{margin-top:8px;display:flex;flex-direction:column;gap:4px;max-height:300px;overflow:auto}
.lista button{font:inherit;text-align:left;background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:10px 12px;cursor:pointer}
.lista button:hover{border-color:var(--turq)}
.lista em,.pac em{font-style:normal;font-size:11px;font-weight:800;color:var(--turq-d);background:#e0f2fe;border-radius:6px;padding:2px 6px;margin-left:6px}
.pac{display:inline-block;background:#e0f2fe;color:#0c4a6e;border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px}
.pac.prueba{background:#fef3c7;color:#78350f}
.grid.bloq{opacity:.4;pointer-events:none}
.ultima{font-size:13px;color:var(--dim);margin-top:6px}
.evo{margin-top:16px}
.evo h3{margin:0 0 2px;font-size:17px}
.evo .sub2{color:var(--dim);font-size:13px;margin-bottom:10px}
.evo svg{width:100%;height:auto;display:block}
.evo table{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
.evo th{text-align:left;font-size:12px;color:var(--dim);font-weight:700;padding:6px 4px;border-bottom:1px solid var(--border)}
.evo td{padding:7px 4px;border-bottom:1px solid #f1f5f9}
.evo td.num{font-family:'JetBrains Mono',monospace;text-align:right}
.tend{display:inline-block;border-radius:8px;padding:6px 10px;font-weight:800;font-size:14px;margin-top:4px}
.tend.up{background:#dcfce7;color:#14532d}.tend.down{background:#fee2e2;color:#7f1d1d}.tend.eq{background:#f1f5f9;color:#334155}
.crit{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:8px}
.crit th{text-align:left;font-size:12px;color:var(--dim);padding:6px 4px;border-bottom:1px solid var(--border)}
.crit td{padding:6px 4px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
.crit select{font:inherit;font-size:13px;padding:4px 6px;border:1px solid var(--border);border-radius:6px}
.crit .sug{font-size:11px;color:var(--faint)}
.crit tr.tot td{font-weight:800;border-top:2px solid var(--border)}
.musc{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.musc div{border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.5}
.musc .sob{background:#fee2e2;color:#7f1d1d}.musc .poc{background:#dbeafe;color:#1e3a8a}
.musc b{display:block;font-size:12px;letter-spacing:.03em;margin-bottom:4px}
.musc small{opacity:.7}
.sigue{margin-top:14px}
.sigue h4{margin:0 0 6px;font-size:15px}
.sigue .it{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--border);border-radius:10px;padding:8px 10px;margin-bottom:6px;font-size:13.5px}
.sigue .it small{display:block;color:var(--dim);font-size:12px}
.sigue .it button{font:inherit;font-weight:700;font-size:13px;border-radius:8px;padding:6px 10px;border:1px solid var(--turq);background:#fff;color:var(--turq-d);cursor:pointer;white-space:nowrap}
.sigue .it button:disabled{border-color:var(--border);color:var(--faint);cursor:default}
.obs{width:100%;font:inherit;font-size:14px;border:1px solid var(--border);border-radius:8px;padding:8px;margin-top:8px;min-height:56px}
.fotos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.fotos figure{margin:0;background:#0b1220;border-radius:10px;overflow:hidden}
.fotos img{width:100%;display:block}
.fotos figcaption{color:#fff;font-size:12px;font-weight:800;text-align:center;padding:4px}
.rom{width:100%;border-collapse:collapse;font-size:14px}
.rom th{font-size:12px;color:var(--dim);text-align:center;padding:6px 4px;border-bottom:1px solid var(--border)}
.rom th:first-child{text-align:left}
.rom td{padding:6px 4px;border-bottom:1px solid #f1f5f9;text-align:center;vertical-align:middle}
.rom td:first-child{text-align:left}
.rom td.sec{background:#fff7ed;color:#9a3412;font-weight:800;font-size:13px;letter-spacing:.03em;text-align:left}
.rom input{width:74px;font:inherit;font-size:15px;text-align:center;padding:7px 4px;border:1px solid var(--border);border-radius:8px}
.rom .calc{font-family:'JetBrains Mono',monospace;font-weight:700}
.rom .lsi{font-family:'JetBrains Mono',monospace;font-weight:800;border-radius:6px;padding:3px 6px}
.rom .lsi.ok{background:#dcfce7;color:#14532d}.rom .lsi.bad{background:#fee2e2;color:#7f1d1d}
.rom .ant{display:block;font-size:11px;color:var(--faint);margin-top:2px}
.rom .ref{font-size:11.5px;color:var(--dim)}
.rom .ref.bad{color:var(--red);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.chips button{font:inherit;font-size:13px;font-weight:700;border-radius:999px;padding:6px 12px;border:1px solid var(--border);background:#fff;color:var(--dim);cursor:pointer}
.chips button.on{background:var(--turq);border-color:var(--turq);color:#fff}
.evodi{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:10px}
.evodi .box{border:1px solid var(--border);border-radius:12px;padding:10px}
.evodi h5{margin:0 0 4px;font-size:13.5px}
.leg{font-size:11.5px;color:var(--dim)} .leg b{display:inline-block;width:10px;height:10px;border-radius:3px;margin:0 4px -1px 8px}
.pl td.l{color:var(--dim);font-size:12px;text-align:center}
.pl select,.pl input{font:inherit;font-size:14px;padding:6px 6px;border:1px solid var(--border);border-radius:8px;background:#fff}
.pl input{width:84px;text-align:center}
.pl .ayuda{display:block;font-size:11.5px;color:var(--faint);margin-top:2px}
.infobox{font-size:13.5px;line-height:1.5;color:#334155;background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin:8px 0 12px}
.tcard .medi{margin-top:8px;font-size:12px;font-weight:800;color:#334155}
.tcard .nec{margin-top:4px;font-size:12px;color:var(--dim);line-height:1.4}
.necbox{background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:8px 12px;font-size:13px;color:#7c2d12;margin:8px 0}
.pasos{margin:6px 0 0 18px;padding:0;font-size:13.5px;line-height:1.55;color:#334155}
.pasos li{margin-bottom:3px}
.btnfoto{font:inherit;font-size:13px;border:1px solid var(--border);background:#fff;border-radius:8px;padding:5px 7px;margin-left:4px;cursor:pointer;vertical-align:middle}
/* goniómetro por foto */
.gon{position:fixed;inset:0;background:rgba(15,23,42,.92);z-index:50;display:flex;flex-direction:column;color:#fff}
.gon .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:#0b1220}
.gon .bar h3{margin:0;font-size:16px;flex:1;min-width:200px}
.gon .ay{padding:6px 14px 8px;font-size:13px;color:#cbd5e1;background:#0b1220;line-height:1.45}
.gon .lienzo{flex:1;position:relative;overflow:hidden;touch-action:none}
.gon canvas{position:absolute;left:0;top:0;touch-action:none}
.gon .lect{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(15,23,42,.88);border-radius:14px;padding:6px 18px;font-family:'JetBrains Mono',monospace;font-size:34px;font-weight:600;pointer-events:none}
.gon .vacio{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;color:#94a3b8;font-size:15px}
.gon input[type=number]{width:70px;font:inherit;padding:6px;border-radius:8px;border:0}
.pregunta{position:absolute;inset:0;background:rgba(15,23,42,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px;z-index:5}
.pregunta .pq{color:#fff;font-size:26px;font-weight:800;text-align:center}
.pregunta .pq small{display:block;font-size:14px;font-weight:600;color:#cbd5e1;margin-top:4px}
.pregunta .pbtns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.pregunta .pbtns button{font:inherit;background:#fff;border:0;border-radius:18px;padding:16px 18px;min-width:150px;font-size:40px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.pregunta .pbtns b{font-size:17px;color:#0f172a}.pregunta .pbtns small{font-size:12px;color:#64748b}
.pregunta .pno{font:inherit;background:transparent;border:1px solid #64748b;color:#cbd5e1;border-radius:10px;padding:8px 14px;cursor:pointer}
.ruta{margin-top:10px;border:1px solid var(--border);border-radius:12px;padding:12px;background:#f8fafc}
.ruta h3{margin:0 0 6px;font-size:16px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ruta h3 small{font-size:12.5px;color:var(--dim);font-weight:700}
.paso{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:8px 10px;margin-bottom:6px}
.paso .num{width:28px;height:28px;border-radius:50%;background:#e0f2fe;color:var(--turq-d);font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.paso.ok .num{background:#dcfce7;color:#14532d}
.paso .txt{flex:1;min-width:0}.paso .txt b{display:block;font-size:14px}.paso .txt small{display:block;color:var(--dim);font-size:12px;line-height:1.35}
.paso .b{padding:8px 12px;font-size:13.5px;white-space:nowrap}
.tcard.apt-cuidado{border-color:#fcd34d;background:#fffbeb}
.tcard.apt-no{opacity:.6}
.tcard .aviso,.paso .aviso{display:block;margin-top:6px;font-size:12px;font-weight:700;color:#92400e}
.paso.apt-cuidado{border-color:#fcd34d;background:#fffbeb}.paso.apt-no{opacity:.6}
.nosug{margin-top:18px}.nosug summary{cursor:pointer;font-weight:800;color:var(--dim);margin-bottom:10px}
.perfil .chips button{display:flex;flex-direction:column;align-items:flex-start;line-height:1.2}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px;background:#e0f2fe;color:var(--turq-d)}
.ubic{margin:10px 0 0;padding:10px 14px;border-radius:12px;font-size:14px;font-weight:600;background:#f1f5f9;color:#334155}
.ubic.ok{background:#dcfce7;color:#14532d}.ubic.warn{background:#fef3c7;color:#78350f}.ubic.bad{background:#fee2e2;color:#7f1d1d}
.ladoD{color:#F0832A !important}.ladoI{color:#14B8C4 !important}
button.lnk{background:none;border:0;color:var(--dim);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;padding:6px 2px}

.panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px}
.panel h2{margin:0 0 6px;font-size:19px}
.panel .info{font-size:13.5px;line-height:1.5;color:#334155}
.panel .info b{color:var(--text)}
.estado{margin:14px 0;padding:10px 12px;border-radius:10px;background:#f1f5f9;font-size:14px;font-weight:600}
.estado.ok{background:#dcfce7;color:#14532d}.estado.warn{background:#fef3c7;color:#78350f}.estado.err{background:#fee2e2;color:#7f1d1d}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.mando{position:sticky;bottom:0;z-index:20;background:#fff;margin:10px -14px -14px;padding:10px 14px 12px;border-top:1px solid var(--border);box-shadow:0 -8px 24px rgba(15,23,42,.10);border-radius:0 0 14px 14px}
.mando .estado{margin:0 0 8px}
@media (max-width:900px){ .layout > .stage.fija{position:sticky;top:0;z-index:19;max-height:56vh} .layout > .stage.fija video,.layout > .stage.fija canvas{max-height:56vh;object-fit:contain} }
.ubicar{background:#0f2744;color:#e2e8f0;border-radius:14px;padding:18px 20px;max-width:620px;text-align:left;font-size:15px;line-height:1.45}
.ubicar h4{margin:0 0 10px;font-size:18px;color:#fff}.ubicar .fila{display:flex;gap:10px;margin:8px 0}.ubicar .fila b{color:#7cc4f2}

/* ====== CELULAR (iPhone 17 / 17 Pro / 18 Pro Max, ~390–440 px de ancho) ====== */
.gon{height:100dvh}
.gon .bar{padding-top:max(10px, env(safe-area-inset-top))}
.mando{padding-bottom:max(12px, env(safe-area-inset-bottom))}
@media (max-width:600px){
  .wrap{padding:12px 10px 96px}
  h1{font-size:22px}
  .panel{padding:12px}
  .panel h2{font-size:17px}
  .tcard{padding:14px}
  .grid{gap:10px}
  button.b{font-size:14px;padding:11px 12px}
  .btns{gap:6px}
  .mando{margin:10px -12px -12px;padding:8px 10px}
  .mando .btns > button{flex:1 1 46%;padding:9px 10px;font-size:13px}
  .layout > .stage.fija{max-height:64vh} .layout > .stage.fija video,.layout > .stage.fija canvas{max-height:64vh}
  .mando{padding-top:6px} .mando .lnk{font-size:12px;margin:4px 0 0}
  .mando .estado{font-size:13px;padding:8px 10px}
  .gon .bar{padding:8px 10px;gap:6px}
  .gon .bar h3{font-size:14px;min-width:100%}
  .gon .bar .b,.gon .bar button{font-size:13px;padding:8px 10px}
  .gon .ay{font-size:12px;max-height:20vh;overflow:auto}
  .ubicar{font-size:13px;padding:14px}.ubicar h4{font-size:16px}
  .stage{min-height:200px}
  .chk span{font-size:11px;padding:3px 7px}
  .consejo{font-size:16px;padding:8px 12px;max-width:86%}
  .big{font-size:30px;padding:6px 14px}
  .lect{font-size:22px;padding:4px 12px}
  .encPanel{font-size:11px !important;max-width:48% !important;padding:6px 8px !important}
  .encPanel .it.ok{display:none}
  .dianaBox{width:104px !important;padding:5px !important;font-size:10px !important}
  .dianaBox svg{width:88px;height:88px}
  .dianaBox button{font-size:10px !important;padding:4px 6px !important}
  #tReloj{font-size:38px !important;padding:4px 14px !important}
  #caCartel{font-size:17px !important;padding:8px 14px !important}
  #caPreg button{font-size:19px !important;padding:14px 22px !important}
  .ubitip{font-size:12px}
  .chk{top:44px;left:8px;gap:4px}
  .chk span.ok{display:none}
  .dianaBox .txt,.dianaBox .fij{display:none}
  .consejo{top:auto;bottom:8px;transform:translateX(-50%);font-size:14px;max-width:92%}
  .hud .pill{font-size:12px;padding:4px 10px}
}
/* MODO TV (para el adaptador HDMI): el video ocupa toda la pantalla y los botones quedan encima, abajo */
body.modoTV .layout > .stage{position:fixed !important;inset:0;z-index:40;max-height:none !important;border-radius:0;background:#000;margin:0}
body.modoTV .layout > .stage video,body.modoTV .layout > .stage canvas{max-height:100vh !important;height:100vh;width:100%;object-fit:contain}
body.modoTV .mando{position:fixed;left:0;right:0;bottom:0;z-index:45;margin:0;border-radius:0;background:rgba(255,255,255,.9);padding:6px 10px}
body.modoTV .mando .btns > button{padding:8px 12px;font-size:14px;flex:0 1 auto}
body.modoTV .mando .lnk{display:none}
body.modoTV .chk{top:16px;left:16px;gap:8px}
body.modoTV .chk span{font-size:clamp(18px,2.1vw,30px) !important;padding:6px 14px !important}
body.modoTV .chk span.ok{display:none}
body.modoTV .consejo{font-size:clamp(26px,3.2vw,48px) !important;padding:14px 26px !important;max-width:80%}
body.modoTV .big{font-size:clamp(60px,9vw,140px) !important}
body.modoTV .pill{font-size:clamp(16px,1.8vw,26px) !important}
body.modoTV .mando .estado{font-size:clamp(18px,2vw,28px) !important}
body.modoTV .mando .btns > button{font-size:clamp(15px,1.5vw,22px) !important;padding:10px 16px !important}
body.modoTV .dianaBox{transform:scale(1.35);transform-origin:top right}
.logosTV{display:none}
body.modoTV .logosTV{display:flex;position:fixed;left:16px;bottom:calc(var(--mandoH,78px) + 12px);z-index:46;gap:14px;align-items:center;background:rgba(255,255,255,.92);border-radius:16px;padding:8px 16px;pointer-events:none}
body.modoTV .logosTV img{height:clamp(30px,3.6vw,54px);width:auto;display:block}
/* celular acostado (apaisado): el video manda */
@media (max-height:500px) and (orientation:landscape){
  .layout > .stage.fija{max-height:78vh}
  .layout > .stage.fija video,.layout > .stage.fija canvas{max-height:78vh}
  .gon .ay{max-height:3.2em;overflow:hidden}
  .gon .bar{padding:6px 10px}
  .encPanel .it.ok{display:none}
}

function edadDe(f) {
  if (!f) return null
  const n = new Date(f + 'T12:00:00'), h = new Date()
  let e = h.getFullYear() - n.getFullYear(); if (h < new Date(h.getFullYear(), n.getMonth(), n.getDate())) e--
  return isNaN(e) ? null : e
}
async function buscarPacientes(q) {
  q = q.trim(); if (q.length < 2) return []
  const dig = q.replace(/\D/g, '')
  const soloNum = /^[\d.\s]+$/.test(q)
  const pPB = soloNum
    ? supabase.from('personas').select('id, nombre, dni, fecha_nacimiento').eq('dni', dig).limit(10)
    : supabase.from('personas').select('id, nombre, dni, fecha_nacimiento').ilike('nombre', `%${q}%`).order('nombre').limit(15)
  const pSK = soloNum
    ? supabase.from('pacientes_sarkmed').select('id, apellido_nombre, dni, fecha_nacimiento').eq('dni', dig).limit(10)
    : supabase.from('pacientes_sarkmed').select('id, apellido_nombre, dni, fecha_nacimiento').ilike('apellido_nombre', `%${q}%`).order('apellido_nombre').limit(15)
  const [a, b] = await Promise.all([pPB, pSK])
  if (a.error) console.warn('personas', a.error); if (b.error) console.warn('sarkmed', b.error)
  const todos = [
    ...(a.data || []).map(p => ({ origen: 'PUNTOBIO', id: String(p.id), nombre: p.nombre, dni: normDni(p.dni), edad: edadDe(p.fecha_nacimiento) })),
    ...(b.data || []).map(p => ({ origen: 'SARKMED', id: String(p.id), nombre: p.apellido_nombre, dni: normDni(p.dni), edad: edadDe(p.fecha_nacimiento) })),
  ]

  const porDni = new Map(), salida = []
  for (const p of todos) {

    const ya = porDni.get(p.dni)
    if (!ya) { porDni.set(p.dni, p); salida.push(p) }

    }
  }
  return salida
}
const normDni = (d) => { const x = String(d ?? '').replace(/\D/g, ''); return x || null }

}

// ============================================================
// ESTADO
// ============================================================
const L = { hipL:23, hipR:24, kneeL:25, kneeR:26, ankL:27, ankR:28, heelL:29, heelR:30, toeL:31, toeR:32 }
let landmarker = null, stream = null, rafId = null, lastVideoTime = -1
let actual = null          // test en curso (ficha)
let det = null             // detector en curso (objeto con estado)
let pose = null            // landmarks suavizados en píxeles
let facing = 'environment'
let audioCtx = null
const $ = (id) => document.getElementById(id)

// ============================================================
// UTILIDADES
// ============================================================
function beep(freq = 880, ms = 180) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)()
    const o = audioCtx.createOscillator(), g = audioCtx.createGain()
    o.frequency.value = freq; o.connect(g); g.connect(audioCtx.destination)
    g.gain.setValueAtTime(0.25, audioCtx.currentTime)
    o.start(); o.stop(audioCtx.currentTime + ms / 1000)
  } catch (e) {}
}
const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 })
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y)
const fmt = (s, d = 2) => (s == null || isNaN(s)) ? '—' : s.toFixed(d).replace('.', ',')
function visible(...idx) { return pose && idx.every(i => pose[i] && pose[i].v > 0.5) }
function legLen() {
  if (!pose) return null
  const a = dist(pose[L.hipL], pose[L.ankL]), b = dist(pose[L.hipR], pose[L.ankR])
  return (a + b) / 2
}
// Aviso al contar (marcha en el lugar): 'pitido' | 'voz' | 'silencio'. Se recuerda en este iPad.
let avisoConteo = (() => { try { return localStorage.getItem('testbiolab_aviso') || 'pitido' } catch (e) { return 'pitido' } })()
let vozEs = null
function elegirVoz() {
  try {
    const vs = speechSynthesis.getVoices()
    vozEs = vs.find(v => /es[-_]AR/i.test(v.lang)) || vs.find(v => /es[-_](419|MX|US)/i.test(v.lang)) || vs.find(v => /^es/i.test(v.lang)) || null
  } catch (e) {}
}
try { elegirVoz(); speechSynthesis.onvoiceschanged = elegirVoz } catch (e) {}
function decir(txt) {
  try {
    speechSynthesis.cancel()               // si viene rápido, no se acumulan números atrasados
    const u = new SpeechSynthesisUtterance(String(txt))
    u.lang = vozEs ? vozEs.lang : 'es-AR'; if (vozEs) u.voice = vozEs
    u.rate = 1.3; speechSynthesis.speak(u)
  } catch (e) {}
}
function avisarConteo(n) {
  if (avisoConteo === 'pitido') beep(1200, 60)
  else if (avisoConteo === 'voz') decir(n)
}

function setEstado(txt, cls = '') { const e = $('estado'); if (e) { e.textContent = txt; e.className = 'estado ' + cls } }
function setBig(txt) { const e = $('big'); if (e) e.textContent = txt }
function setPill(txt, cls = '') { const e = $('pill'); if (e) { e.textContent = txt; e.className = 'pill ' + cls } }

async function cuentaRegresiva() {
  for (const n of [3, 2, 1]) { setBig(String(n)); beep(600, 120); await new Promise(r => setTimeout(r, 800)) }
  beep(1000, 350); setBig('¡YA!')
}

async function cargarModelo() {
  if (landmarker) return
  setEstado('Cargando el detector de movimiento… (la primera vez tarda unos segundos)')
  const vision = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm')
  const opts = (delegate) => ({
    baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task', delegate },
    runningMode: 'VIDEO', numPoses: 2, minPoseDetectionConfidence: 0.5, minTrackingConfidence: 0.5
  })
  try { landmarker = await PoseLandmarker.createFromOptions(vision, opts('GPU')) }
  catch (e) { landmarker = await PoseLandmarker.createFromOptions(vision, opts('CPU')) }
  envolverSeguimiento(landmarker, 'video')
}

// Cámara elegida: '' = automática (prefiere el ultra gran angular trasero si existe)
let camId = (() => { try { return localStorage.getItem('testbiolab_cam') || '' } catch (e) { return '' } })()

async function prenderCamara() {
  apagarCamara()
  // Sin forzar 16:9: el sensor del iPad es 4:3 y en 16:9 recorta arriba y abajo (se pierde cabeza o pies)
  const base = { width: { ideal: 1920 }, height: { ideal: 1440 } }
  const pedir = camId ? { ...base, deviceId: { exact: camId } } : { ...base, facingMode: facing }
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: pedir }) }
  catch (e) { if (camId) { camId = ''; stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { ...base, facingMode: facing } }) } else throw e }

  // Primera vez: si hay ultra gran angular trasero, pasamos a esa (es la que ve el cuerpo entero más cerca)
  await llenarCamaras()
  const esCompu = !/iPhone|iPad|Android/i.test(navigator.userAgent) && !(navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent))
  if (!camId && esCompu) {          // computadora: preferir la cámara EXTERNA conectada antes que la de la pantalla
    const ext = camaras.find(c => c.label && !/facetime|integrad|built.?in|internal|interna/i.test(c.label))
    if (ext) { stream.getTracks().forEach(t => t.stop()); camId = ext.deviceId
      try { localStorage.setItem('testbiolab_cam', camId) } catch (e) {}
      stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { ...base, deviceId: { exact: camId } } }); llenarCamaras() }
  }
  if (!camId) {
    const ultra = camaras.find(c => /ultra/i.test(c.label) && !/front|frontal|delanter/i.test(c.label))
    if (ultra && facing === 'environment') {
      stream.getTracks().forEach(t => t.stop())
      camId = ultra.deviceId
      stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { ...base, deviceId: { exact: camId } } })
      llenarCamaras()
    }
  }
  const track = stream.getVideoTracks()[0]
  const st = track.getSettings ? track.getSettings() : {}
  if (st.facingMode) facing = st.facingMode === 'user' ? 'user' : 'environment'
  else if (camId) { const c = camaras.find(x => x.deviceId === camId); if (c) facing = /front|frontal|delanter/i.test(c.label) ? 'user' : 'environment' }

  // Zoom: si la cámara lo permite, arrancamos en el más abierto (ej. 0,5x)
  configurarZoom(track)

  const v = $('video')
  v.srcObject = stream
  v.style.transform = facing === 'user' ? 'scaleX(-1)' : ''
  $('canvas').style.transform = v.style.transform
  await v.play()
  $('vempty').style.display = 'none'; $('vbox').style.display = 'block'
  const c = $('canvas'); c.width = v.videoWidth; c.height = v.videoHeight
  lastVideoTime = -1
  loop()
}

let camaras = []
try { navigator.mediaDevices.addEventListener('devicechange', () => llenarCamaras()) } catch (e) {}
async function llenarCamaras() {
  try {
    camaras = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput')
    const sel = $('selCam'); if (!sel || !camaras.length || !camaras[0].label) return
    const actualId = stream && stream.getVideoTracks()[0].getSettings().deviceId
    sel.innerHTML = camaras.map((c, i) => `<option value="${i}">${c.label.replace(/</g, '')}</option>`).join('')
    const i = camaras.findIndex(c => c.deviceId === (camId || actualId)); if (i >= 0) sel.value = String(i)
  } catch (e) {}
}

// zoom de la cámara que está prendida (para los consejos): mínimo posible y el actual
const zoomMin = () => { try { const t = stream && stream.getVideoTracks()[0], c = t.getCapabilities ? t.getCapabilities() : {}; return c.zoom ? c.zoom.min : 1 } catch (e) { return 1 } }
const zoomActual = () => { try { const t = stream && stream.getVideoTracks()[0], s2 = t.getSettings ? t.getSettings() : {}; return s2.zoom || 1 } catch (e) { return 1 } }
function configurarZoom(track) {
  const box = $('zoomBox'); if (!box) return
  const cap = track.getCapabilities ? track.getCapabilities() : {}
  if (!cap.zoom || cap.zoom.max <= cap.zoom.min) { box.style.display = 'none'; return }
  const r = $('zoom'); r.min = cap.zoom.min; r.max = Math.min(cap.zoom.max, 3); r.step = cap.zoom.step || 0.1
  r.value = cap.zoom.min; box.style.display = ''
  const aplicar = () => { track.applyConstraints({ advanced: [{ zoom: parseFloat(r.value) }] }).catch(() => {}); $('zoomVal').textContent = parseFloat(r.value).toFixed(1).replace('.', ',') + 'x' }
  r.oninput = aplicar; aplicar()
}

function apagarCamara() {
  if (rafId) cancelAnimationFrame(rafId); rafId = null
  if (stream) stream.getTracks().forEach(t => t.stop()); stream = null
}

function loop() {
  const v = $('video')
  if (!v || !stream) return
  if (v.currentTime !== lastVideoTime && landmarker && v.videoWidth) {
    const cv = $('canvas')
    if (cv.width !== v.videoWidth || cv.height !== v.videoHeight) { cv.width = v.videoWidth; cv.height = v.videoHeight; pose = null }
    lastVideoTime = v.currentTime
    const now = performance.now()
    const r = landmarker.detectForVideo(v, now)
    const W = v.videoWidth, H = v.videoHeight
    if (r.landmarks && r.landmarks[0]) {
      const nuevo = r.landmarks[0].map(p => ({ x: p.x * W, y: p.y * H, z: p.z * W, v: p.visibility ?? 1 }))
      pose = pose ? nuevo.map((p, i) => ({ x: pose[i].x * 0.4 + p.x * 0.6, y: pose[i].y * 0.4 + p.y * 0.6, z: (pose[i].z ?? p.z) * 0.4 + p.z * 0.6, v: p.v })) : nuevo
      setPill('Paciente detectado', 'ok')
    } else { pose = null; setPill('No veo al paciente', 'warn') }
    if (det && det.frame) det.frame(now)
    actualizarCalibrador()
    dibujar()
  }
  rafId = requestAnimationFrame(loop)
}

const HUESOS = [[11,12],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28],[27,29],[29,31],[27,31],[28,30],[30,32],[28,32],[11,13],[13,15],[12,14],[14,16]]
function dibujar() {
  const c = $('canvas'); if (!c) return
  const ctx = c.getContext('2d'); ctx.clearRect(0, 0, c.width, c.height)
  const s = c.width / 640
  // líneas del detector (objetivo de rodilla, líneas de la alfombra, etc.)
  if (det && det.dibujar) det.dibujar(ctx, s)
  if (zona && det && !MEDIDO.includes(det.fase) && actual.encuadre !== 'lineas') {
    ctx.setLineDash([10 * s, 8 * s]); ctx.lineWidth = 2 * s
    ctx.strokeStyle = posOk ? 'rgba(34,197,94,.95)' : 'rgba(239,68,68,.9)'
    ctx.strokeRect(zona.x0, zona.y0, zona.x1 - zona.x0, zona.y1 - zona.y0)
    ctx.setLineDash([])
  }
  if (!pose) return
  // estilo laboratorio de biomecánica: segmentos finos con un halo suave y marcadores articulares (anillo + punto)
  ctx.lineCap = 'round'
  // DE PERFIL se dibuja un solo lado (el que da a la cámara): una sola línea de tronco y de pierna, sin la doble línea
  const tipoEnc = (det && det.encuadre) || actual.encuadre
  let oculto = null
  if (tipoEnc === 'costado') {
    const sv = (ix) => ix.reduce((t, i) => t + (pose[i].v || 0), 0)
    const izq = [11, 13, 15, 23, 25, 27, 29, 31], der = [12, 14, 16, 24, 26, 28, 30, 32]
    oculto = new Set(sv(der) >= sv(izq) ? izq : der)
  }
  const ver = (i) => pose[i].v > .4 && !(oculto && oculto.has(i))
  const trazo = (w, col) => { ctx.lineWidth = w; ctx.strokeStyle = col
    HUESOS.forEach(([a, b]) => { if (ver(a) && ver(b)) { ctx.beginPath(); ctx.moveTo(pose[a].x, pose[a].y); ctx.lineTo(pose[b].x, pose[b].y); ctx.stroke() } }) }
  trazo(6 * s, 'rgba(8,20,40,.45)')                 // halo oscuro para que se lea sobre cualquier fondo
  trazo(2 * s, 'rgba(125,211,252,.95)')             // segmento
  ;[11, 12, 13, 14, 15, 16, 23, 24, 25, 26, 27, 28].forEach(i => { if (!ver(i)) return
    ctx.beginPath(); ctx.arc(pose[i].x, pose[i].y, 5.5 * s, 0, 7); ctx.fillStyle = 'rgba(8,20,40,.7)'; ctx.fill()
    ctx.lineWidth = 1.6 * s; ctx.strokeStyle = '#7dd3fc'; ctx.stroke()
    ctx.beginPath(); ctx.arc(pose[i].x, pose[i].y, 1.8 * s, 0, 7); ctx.fillStyle = '#fff'; ctx.fill() })
}

// ============================================================
// CALIBRADOR DE POSICIÓN (estilo HumanTrak)
// Antes de cada toma revisa: cuerpo entero en cuadro, distancia, centrado
// y orientación (de frente / de costado). Empezar se habilita cuando todo
// queda en verde 1 segundo seguido.
// ============================================================
let posOkFrames = 0, posOk = false, zona = null
// MANOS LIBRES (autoevaluación): se toca el botón cerca del iPad, uno se aleja y se ubica,
// y la toma arranca sola cuando la posición queda en verde. Los consejos se dicen en voz alta.
let manosLibres = false, armadoFrames = 0, ultimoConsejo = '', tUltimoConsejo = 0
const MEDIDO = ['calibrando', 'cuenta', 'midiendo', 'esperando', 'corriendo']

function chequearPosicion() {
  const c = $('canvas'); if (!c || !actual) return null
  const W = c.width, H = c.height, tipo = (det && det.encuadre) || actual.encuadre
  if (tipo === 'libre') {
    // flexiones, dominadas, CKCUEST: alcanza con ver hombros, codos y muñecas de al menos un lado
    const ladoOk = (ix) => !!pose && ix.every(i => pose[i].v > 0.5)
    const ok = ladoOk([12, 14, 16]) || ladoOk([11, 13, 15])
    zona = null
    return { ok, items: [{ ok, txt: 'Brazos en cuadro' }], consejo: ok ? '' : !pose ? 'No veo al paciente' : 'No veo bien los brazos: acomodá el iPad' }
  }
  if (tipo === 'acostado') {
    // cámara detrás de la cabeza: alcanza con ver cadera y rodillas
    const W2 = c.width, H2 = c.height, dentro2 = (i) => pose && pose[i].v > 0.4 && pose[i].x > W2 * 0.03 && pose[i].x < W2 * 0.97 && pose[i].y > H2 * 0.03 && pose[i].y < H2 * 0.97
    const cad = !!pose && dentro2(23) && dentro2(24), rod = !!pose && dentro2(25) && dentro2(26)
    zona = null
    return { ok: cad && rod, items: [{ ok: cad, txt: 'Cadera en cuadro' }, { ok: rod, txt: 'Rodillas en cuadro' }],
      consejo: !pose ? 'No veo al paciente' : !cad ? 'No veo bien la cadera: acomodá el trípode' : !rod ? 'No veo las rodillas: alejá o subí el iPad' : '' }
  }
  if (tipo === 'lineas') {
    const ok = det.lineas && det.lineas.length === 2
    return { ok, items: [{ ok, txt: 'Líneas de la alfombra marcadas' }], consejo: ok ? '' : 'Marcá las dos líneas tocando la imagen' }
  }
  if (!pose) return { ok: false, items: [{ ok: false, txt: 'Paciente en cuadro' }], consejo: 'No veo al paciente' }
  const vis = (i) => pose[i].v > 0.5
  const dentro = (i, m = 0.02) => pose[i].x > W * m && pose[i].x < W * (1 - m) && pose[i].y > H * m && pose[i].y < H * (1 - m)
  // de espaldas no se ve la cara: la "cabeza" se controla con hombros y orejas
  // (las orejas desde atrás a veces se ven poco: alcanza con los hombros y que quede lugar arriba para la cabeza)
  const cabeza = tipo === 'espalda' ? ([11, 12].every(i => pose[i].v > 0.5 && dentro(i)) && Math.min(pose[11].y, pose[12].y) > H * 0.1) : vis(0) && dentro(0)
  // pies: de perfil alcanza con ver bien UN pie (el otro queda tapado); de frente o de espaldas, los dos
  const pieOk = (ix, u = 0.5) => ix.every(i => pose[i].v > u && dentro(i))
  const pieI = tipo === 'espalda' ? [27, 29] : [27, 29, 31], pieD = tipo === 'espalda' ? [28, 30] : [28, 30, 32]   // de espaldas los dedos quedan detrás del talón
  const pies = tipo === 'costado' ? (pieOk(pieI) || pieOk(pieD)) : ((pieOk(pieI) && pieOk(pieD)) || (pieOk(pieI, 0.35) && pieOk(pieD, 0.35)))
  const tronco = [11, 12, 23, 24].every(i => vis(i))
  const piesVis = [...pieI, ...pieD].filter(i => pose[i].v > 0.35)
  const yPies = Math.max(...(piesVis.length ? piesVis : [27, 28]).map(i => pose[i].y))
  const yCab = tipo === 'espalda' ? Math.min(pose[11].y, pose[12].y) - dist(mid(pose[11], pose[12]), mid(pose[23], pose[24])) * 0.45 : pose[0].y
  const alto = (yPies - yCab) / H
  const cad = mid(pose[23], pose[24]), hom = mid(pose[11], pose[12])
  const torso = Math.max(dist(cad, hom), 1)
  const ancho = Math.abs(pose[11].x - pose[12].x) / torso
  const xRel = cad.x / W
  const [aMin, aMax] = (RANGO_DIST[distCam] || RANGO_DIST.normal)[tipo === 'costado' ? 'costado' : 'frente']

  const items = [], consejos = []
  items.push({ ok: cabeza, txt: 'Cabeza en cuadro' }); if (!cabeza) consejos.push('Se corta la cabeza: alejá el iPad o bajalo un poco')
  if (actual && actual.id === 'ohs') { const manos = [15, 16].some(i => pose[i].v > 0.4 && pose[i].y > H * 0.02)
    items.push({ ok: manos, txt: 'Manos arriba en cuadro' }); if (!manos) consejos.push('Con los brazos arriba se cortan las manos: alejá la cámara, bajala un poco o girala 90°') }
  items.push({ ok: pies, txt: 'Pies en cuadro' }); if (!pies) consejos.push(zoomMin() < 1 && zoomActual() > zoomMin() + 0.05 ? 'No veo los pies: bajá el zoom a ' + String(zoomMin()).replace('.', ',') + '× o alejá el iPad' : 'No veo los pies: alejá el iPad (2,5–3 m) o inclinalo hacia abajo')
  const distOk = cabeza && pies && alto >= aMin && alto <= aMax
  items.push({ ok: distOk, txt: 'Distancia' })
  if (cabeza && pies && alto < aMin) consejos.push(distCam === 'lejos' ? 'Está muy lejos: acercá la cámara' : 'Está muy lejos: acercá la cámara o elegí Distancia "Lejos"')
  if (cabeza && pies && alto > aMax) consejos.push(distCam === 'cerca' ? 'Está muy cerca: alejá la cámara' : 'Está muy cerca: alejá la cámara o elegí Distancia "Cerca"')
  const centOk = xRel > 0.33 && xRel < 0.67
  items.push({ ok: centOk, txt: 'Centrado' })
  if (!centOk) {
    // en cámara frontal la imagen va espejada: lo que el evaluador ve a la izquierda es la derecha del cuadro
    const izq = facing === 'user' ? xRel > 0.67 : xRel < 0.33
    consejos.push(izq ? 'Corré al paciente hacia el centro (está a la izquierda de la imagen)' : 'Corré al paciente hacia el centro (está a la derecha de la imagen)')
  }
  let oriOk = tronco
  if (tipo === 'frente') { oriOk = tronco && ancho > 0.45; items.push({ ok: oriOk, txt: 'De frente a la cámara' }); if (tronco && !oriOk) consejos.push('Que se ponga de frente al iPad') }
  if (tipo === 'costado') { oriOk = tronco && ancho < 0.35; items.push({ ok: oriOk, txt: 'De perfil a la cámara' }); if (tronco && !oriOk) consejos.push(actual.id === 'tug' ? 'Ubicá la silla de costado al iPad' : 'Que se ponga de perfil al iPad') }
  if (tipo === 'espalda') { oriOk = tronco && ancho > 0.45; items.push({ ok: oriOk, txt: 'De espaldas a la cámara' }); if (tronco && !oriOk) consejos.push('Que se ponga de espaldas al iPad') }
  zona = { x0: W * 0.33, x1: W * 0.67, y0: H * 0.02, y1: H * 0.98 }
  const ok = cabeza && pies && distOk && centOk && oriOk && items.every(i => i.txt !== 'Manos arriba en cuadro' || i.ok)
  return { ok, items, consejo: consejos[0] || '' }
}

let dianaPpal = null
function actualizarCalibrador() {
  const chk = $('chk'), cons = $('consejo'), btn = $('btnEmpezar')
  if (!chk || !det) return
  if (MEDIDO.includes(det.fase)) {
    chk.innerHTML = ''; cons.textContent = ''; cons.className = 'consejo'
    // durante la toma solo avisamos si se sale de cuadro
    if (actual.encuadre !== 'lineas' && pose) {
      const r = chequearPosicion()
      if (r && !r.items[0].ok || r && !r.items[1].ok) setPill('⚠ Se está saliendo de cuadro', 'warn')
    }
    return
  }
  const r = chequearPosicion(); if (!r) return
  posOkFrames = r.ok ? posOkFrames + 1 : Math.max(0, posOkFrames - 3)   // un cuadro dudoso no vuelve a cero
  const antes = posOk
  posOk = posOkFrames >= 8
  // diana (círculo grande = zona correcta, círculo chico = el paciente) y sonidos correcto / incorrecto
  if (actual.encuadre !== 'lineas') {
    const v = $('video'), cont = $('canvas') && $('canvas').parentElement
    if (cont && (!dianaPpal || !cont.contains(dianaPpal.el))) { if (dianaPpal) dianaPpal.quitar(); dianaPpal = crearDiana(cont); dianaPpal.el = cont.lastElementChild }
    if (dianaPpal && v && v.videoWidth) { const g = pose ? chequeoEncuadre(pose, v.videoWidth, v.videoHeight, null) : null; dianaPpal.set(g && g.geo, posOk, r.consejo) }
  }
  if (posOk && !antes && actual.encuadre !== 'lineas' && avisoConteo !== 'silencio') { sonidoCorrecto(); if (!det.armado) decir('OK, posición correcta') }
  if (!posOk && antes && !r.ok && actual.encuadre !== 'lineas' && avisoConteo !== 'silencio') sonidoIncorrecto()
  chk.innerHTML = r.items.map(i => `<span class="${i.ok ? 'ok' : 'no'}">${i.ok ? '✓' : '✗'} ${i.txt}</span>`).join('')
  if (posOk) { cons.textContent = actual.encuadre === 'lineas' ? '' : '✓ Posición correcta'; cons.className = 'consejo ok' }
  else { cons.textContent = r.consejo; cons.className = 'consejo' }
  if (btn && $('btnPreparar').disabled && !det.ocupado) btn.disabled = !posOk

  if ((manosLibres || (det.autoArmar && inicioAuto)) && det.armado) {
    const ahora = performance.now()
    if (!posOk && r.consejo && (r.consejo !== ultimoConsejo || ahora - tUltimoConsejo > 4000) && ahora - tUltimoConsejo > 2500) {
      decir(r.consejo.split(':')[0]); ultimoConsejo = r.consejo; tUltimoConsejo = ahora
    }
    armadoFrames = posOk ? armadoFrames + 1 : 0
    if (armadoFrames >= 30) {             // ~1 s más en verde después del chequeo: arranca
      det.armado = false; armadoFrames = 0; ultimoConsejo = ''
      decir('Posición correcta')
      setTimeout(() => det.empezar(), 1200)
    }
  }
}

// ============================================================
// Compensación → músculos sobreactivos / poco activos
const MUSCULOS = {

  abduccion:{ n: 'Abducción de pie', sob: ['Sóleo', 'Gastrocnemio lateral', 'Bíceps femoral', 'TFL'], poc: ['Gastrocnemio medial', 'Isquios mediales', 'Glúteo medio-mayor', 'Sartorio'] },
  valgo:    { n: 'Valgo de rodillas', sob: ['Complejo aductor', 'Bíceps femoral', 'TFL', 'Recto femoral', 'Gastrocnemio lateral'], poc: ['Gastrocnemio medial', 'Glúteo medio-mayor', 'Isquiotibiales mediales'] },
  varo:     { n: 'Rodillas hacia afuera', sob: ['TFL / Piriforme', 'Bíceps femoral', 'Glúteo medio / mayor'], poc: ['Complejo aductor', 'Isquiotibiales mediales'] },
  arqueo:   { n: 'Arqueo lumbar', sob: ['Ilio-psoas', 'Paravertebrales', 'Dorsal ancho'], poc: ['Glúteo medio / mayor', 'Isquiotibiales mediales', 'Core'] },
  tibia:    { n: 'Tronco inclinado (tibia no paralela)', sob: ['Sóleo – gastrocnemios', 'Flexores de cadera', 'Aductores'], poc: ['Tibial anterior', 'Glúteo mayor', 'Paravertebrales', 'Core'] },
  brazos:   { n: 'Brazos caen adelante', sob: ['Dorsal ancho', 'Pectorales'], poc: ['Trapecio fibras medias / inferiores', 'Romboides', 'Rotadores externos', 'Deltoides posterior'] },
}
// Tests del mapa "Testeos claves" (los que no están construidos aparecen como próximamente)
const CATALOGO_MAPA = {
  lunge: 'Lunge test (dorsiflexión)', navicular: 'Drop navicular', hallux: 'Hallux / Jack test', rodilla: 'Flexión / extensión de rodilla',
  tromcadera: 'Rotación de cadera (TROM)', slr: '90-90 elevación de pierna recta', thomas: 'Test de Thomas',
  extoracica: 'Elevación de hombros / extensión torácica', wallangel: 'Wall angel', rotoracica: 'Rotación torácica sentado', shouldermob: 'Shoulder mobility (FMS)',
  rockback: 'Rock back / rock back inverso', puente: 'Puente glúteo 1 pierna', squatmono: 'Squat monopodal', estocada: 'Estocada con cambio', fsd: 'Caídas del cajón (Forward Step Down)',
  pushup: 'Push ups', pullup: 'Pull ups',
}
// Árbol: hallazgo → tests a seguir (con el motivo)
const ARBOL = [
  { si: f => f.colapso !== 'NO' || f.abduccion !== 'NO', motivo: 'pie que colapsa o se abre', tests: ['lunge', 'navicular', 'hallux'] },
  { si: f => f.tibia === 'NO', motivo: 'tronco inclinado / tibia no paralela', tests: ['lunge', 'extoracica'] },
  { si: f => f.valgo !== 'NO', motivo: 'valgo de rodillas', tests: ['lunge', 'tromcadera', 'thomas', 'squatmono', 'fsd'] },
  { si: f => f.varo !== 'NO', motivo: 'rodillas hacia afuera', tests: ['tromcadera', 'thomas'] },
  { si: f => f.arqueo === 'SI', motivo: 'arqueo lumbar', tests: ['thomas', 'rockback'] },
  { si: f => f.brazos === 'SI', motivo: 'brazos caen adelante', tests: ['extoracica', 'wallangel', 'rotoracica', 'shouldermob'] },
  { si: f => f.peso !== 'NO', motivo: 'peso asimétrico', tests: ['tromcadera', 'thomas', 'slr', 'squatmono'] },
]
function sugerirTests(f) {
  const hay = ['colapso', 'abduccion', 'valgo', 'varo', 'peso'].some(k => f[k] !== 'NO') || f.tibia === 'NO' || f.arqueo === 'SI' || f.brazos === 'SI'
  if (!hay) return [{ id: 'puente', motivos: ['sin compensaciones: pasar a estabilidad y control motor'] }, { id: 'squatmono', motivos: ['estabilidad'] }, { id: 'estocada', motivos: ['estabilidad'] }, { id: 'fsd', motivos: ['estabilidad'] }]
  const out = new Map()
  out.set('rockback', ['¿movilidad o control? Si sin carga se mueve bien, el problema es de estabilidad'])
  ARBOL.forEach(r => { if (r.si(f)) r.tests.forEach(t => { if (!out.has(t)) out.set(t, []); out.get(t).push(r.motivo) }) })
  return [...out].map(([id, motivos]) => ({ id, motivos }))
}

// Thomas: foto DESDE LOS PIES con la pierna colgando. Si la rodilla se va hacia afuera de la línea de la cadera, hay abducción.
const fotoThAbd = (L) => ({ titulo: `Thomas · abducción · pierna ${L === 'D' ? 'derecha' : 'izquierda'} (desde los pies)`, modo: 'multi', lmFijos: [24, 23, 26, 25],
  nombres: ['Cadera D', 'Cadera I', 'Rodilla D', 'Rodilla I'], lineas: [[0, 1, '#34d399'], [0, 2, L === 'D' ? '#F0832A' : '#94a3b8'], [1, 3, L === 'I' ? '#14B8C4' : '#94a3b8']],
  ayuda: 'iPad a los PIES de la camilla, mirando hacia la cabeza, a la altura de la camilla. La pierna que se mide cuelga. El sistema mira si la rodilla se va hacia afuera de la línea de la cadera.',
  calcular: (P) => { const [c, oc, r] = L === 'D' ? [P[0], P[1], P[2]] : [P[1], P[0], P[3]], ancho = Math.max(dist(P[0], P[1]), 1)
    const afuera = ((r.x - c.x) * (Math.sign(c.x - oc.x) || 1)) / ancho, si = afuera > 0.25
    return { valores: { ['abd_' + L]: si ? 'SI' : 'NO' }, texto: `Rodilla ${afuera > 0 ? 'hacia afuera' : 'hacia adentro'} ${Math.round(Math.abs(afuera) * 100)}% del ancho de cadera → ${si ? 'abducción' : 'sin abducción'}` } } })

// inclinación (+) cuando el punto DERECHO del paciente está más abajo, sirva la foto de frente o de espaldas
const incl = (der, izq) => Math.atan2(der.y - izq.y, Math.max(Math.abs(der.x - izq.x), 1)) * 180 / Math.PI
FOTO.post_frente = { titulo: 'Postural · DE FRENTE', modo: 'multi', lmFijos: [8, 7, 12, 11, 24, 23, 26, 25, 28, 27],
  nombres: ['Oreja D', 'Oreja I', 'Hombro D', 'Hombro I', 'Cadera D', 'Cadera I', 'Rodilla D', 'Rodilla I', 'Tobillo D', 'Tobillo I'],
  lineas: [[0, 1, '#a78bfa'], [2, 3, '#22d3ee'], [4, 5, '#34d399'], [4, 6], [6, 8], [5, 7], [7, 9]], horizontales: [2, 4],
  ayuda: 'Paciente DE FRENTE, parado relajado, pies al ancho de caderas, brazos al costado. iPad vertical a la altura del ombligo y DERECHO (nivelado). Los puntos se ubican solos: corregí los que hagan falta.',
  calcular: (P) => {
    // rodilla de frente: desvío del eje cadera-rodilla-tobillo; (+) valgo = la rodilla se va hacia la línea media
    const rod = (c, r, t, cOtra) => { const g = 180 - angulo3(P[c], P[r], P[t])
      const tt = (P[r].y - P[c].y) / Math.max(P[t].y - P[c].y, 1), xl = P[c].x + (P[t].x - P[c].x) * tt
      return g * (Math.sign((P[r].x - xl) * (P[cOtra].x - P[c].x)) || 1) }
    const v = { cab_incl: +incl(P[0], P[1]).toFixed(1), hom_incl: +incl(P[2], P[3]).toFixed(1), pel_incl: +incl(P[4], P[5]).toFixed(1),
      rod_front_D: +rod(4, 6, 8, 5).toFixed(1), rod_front_I: +rod(5, 7, 9, 4).toFixed(1) }
    return { valores: v, texto: `Cabeza ${v.cab_incl}° · hombros ${v.hom_incl}° · pelvis ${v.pel_incl}° · rodilla D ${v.rod_front_D}° · I ${v.rod_front_I}°` } } }

// EIPS con stickers: 2 puntos de regla (escala) + EIPS derecha e izquierda. Da la diferencia de altura en mm (+ = la derecha más alta).
const fotoEips = (titulo, clave) => { const cfg = { titulo, modo: 'multi', sticker: 'eips', nombres: ['Escala 1', 'Escala 2', 'EIPS derecha', 'EIPS izquierda'], lineas: [[0, 1, '#fbbf24'], [2, 3, '#22d3ee']], horizontales: [2],
  ayuda: 'Foto DE ESPALDAS, iPad en trípode a la altura de la pelvis y FIJO entre las dos fotos. Pegá un sticker VERDE FLÚOR redondo de 19 mm en cada EIPS: el sistema los encuentra solos y usa su tamaño como escala (no hace falta regla). Si no hay stickers, marcá 2 puntos de una regla separados 10 cm y las dos EIPS.' }
  cfg.calcular = (P) => { const esc = (cfg._refMm || 100) / Math.max(dist(P[0], P[1]), 1)    // mm por pixel (diámetro del sticker o 10 cm de regla)
    const dif = +(((P[3].y - P[2].y) * esc)).toFixed(0)                  // + = la EIPS derecha está más alta

// STICKERS: círculos VERDE FLÚOR de 19 mm. Se buscan por el color (la piel nunca es verde) y su tamaño da la escala
// (19 mm de diámetro), así no hace falta regla. Devuelve los más grandes con su centro y diámetro en pixeles.
const DIAM_STICKER_MM = 19
function detectarStickers(img, cuantos = 2) {
  const esc = Math.min(1, 900 / Math.max(img.naturalWidth || img.videoWidth || img.width, img.naturalHeight || img.videoHeight || img.height))
  const w = Math.round((img.naturalWidth || img.width) * esc), h = Math.round((img.naturalHeight || img.height) * esc)
  const c = document.createElement('canvas'); c.width = w; c.height = h
  const cx = c.getContext('2d', { willReadFrequently: true }); cx.drawImage(img, 0, 0, w, h)
  const d = cx.getImageData(0, 0, w, h).data, m = new Uint8Array(w * h)
  for (let i = 0; i < w * h; i++) {
    const r = d[i * 4], g = d[i * 4 + 1], b = d[i * 4 + 2], mx = Math.max(r, g, b), mn = Math.min(r, g, b)
    if (mx < 70 || mx - mn < 45 || g !== mx) continue                                   // tiene que ser verde, saturado y no oscuro
    let hue = 60 * ((b - r) / (mx - mn)) + 120; if (hue >= 70 && hue <= 170) m[i] = 1
  }
  const vis = new Uint8Array(w * h), blobs = []
  for (let i = 0; i < w * h; i++) {
    if (!m[i] || vis[i]) continue
    let pila = [i], n = 0, sx = 0, sy = 0, x0 = w, x1 = 0, y0 = h, y1 = 0; vis[i] = 1
    while (pila.length) { const k = pila.pop(), x = k % w, y = (k / w) | 0; n++; sx += x; sy += y
      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y
      for (const q of [k - 1, k + 1, k - w, k + w]) if (q >= 0 && q < w * h && m[q] && !vis[q] && Math.abs((q % w) - x) <= 1) { vis[q] = 1; pila.push(q) } }
    const bw = x1 - x0 + 1, bh = y1 - y0 + 1, asp = bw / bh
    if (n >= 25 && asp > 0.5 && asp < 2 && n / (bw * bh) > 0.45) blobs.push({ x: sx / n / esc, y: sy / n / esc, diam: ((bw + bh) / 2) / esc, n })
  }
  blobs.sort((a, b) => b.n - a.n)
  const top = blobs.slice(0, cuantos)
  return top.length === cuantos && (cuantos < 2 || Math.min(top[0].n, top[1].n) / Math.max(top[0].n, top[1].n) > 0.35) ? top : null
}

// ============================================================
// ENCUADRE PARA TODAS LAS CÁMARAS (fotos, video en vivo, temporizador, 6 minutos, SFMA, ASLR, rock back inverso).
// Misma idea que el calibrador de los tests con cámara: una lista en verde y rojo y un consejo.
// idx = puntos del cuerpo que el test necesita ver (null = cuerpo entero); stickers = cuántos stickers verdes tiene que ver.
// ============================================================
function chequeoEncuadre(P, W, H, idx, opts = {}) {
  const items = []
  if (opts.stickers != null) {
    const ok = (opts.vistos || 0) >= opts.stickers
    items.push({ ok, txt: `Se ven los ${opts.stickers} sticker${opts.stickers > 1 ? 's' : ''} verde${opts.stickers > 1 ? 's' : ''}${ok ? '' : ` (veo ${opts.vistos || 0})`}` })
    if (!idx) return { ok, items, consejo: ok ? '' : 'Acercá el iPad o mejorá la luz: tienen que verse los stickers verdes' }
  }
  if (!P) { items.push({ ok: false, txt: 'Paciente en cuadro' }); return { ok: false, items, consejo: 'Que el paciente entre en la pantalla' } }
  items.push({ ok: true, txt: 'Paciente en cuadro' })
  // cuerpo entero: alcanza con que se vea completo UN lado (de perfil el otro queda tapado)
  const ladoA = [12, 24, 26, 28], ladoB = [11, 23, 25, 27], sv = (l) => l.reduce((t, i) => t + ((P[i] && P[i].v) || 0), 0)
  const req = idx || (sv(ladoA) >= sv(ladoB) ? ladoA : ladoB)
  const vis = req.filter(i => P[i] && P[i].v > 0.5 && P[i].x > W * 0.02 && P[i].x < W * 0.98 && P[i].y > H * 0.02 && P[i].y < H * 0.98)
  const todos = vis.length === req.length
  items.push({ ok: todos, txt: idx ? 'Se ven los puntos del test' : 'Cuerpo entero en cuadro' })
  let consejo = todos ? '' : (idx ? 'Que se vea bien la zona que se mide' : 'Alejá el iPad: que entre de la cabeza a los pies')
  if (vis.length >= 2) {
    const xs = vis.map(i => P[i].x), ys = vis.map(i => P[i].y), cx = (Math.min(...xs) + Math.max(...xs)) / 2
    const span = Math.max(Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys)) / Math.max(W, H)
    const cerca = span >= (idx ? 0.12 : (distCam === 'lejos' ? 0.22 : 0.35)), lejos = span <= 0.98
    items.push({ ok: cerca && lejos, txt: 'Distancia correcta' })
    if (!cerca) consejo = consejo || 'Acercá el iPad: el paciente se ve muy chico'
    if (!lejos) consejo = consejo || 'Alejá el iPad: está muy cerca'
    const centrado = cx > W * 0.2 && cx < W * 0.8
    items.push({ ok: centrado, txt: 'Centrado' })
    const ideal = idx ? 0.45 : (distCam === 'cerca' ? 0.80 : distCam === 'lejos' ? 0.55 : 0.68), tol = idx ? 0.33 : 0.29
    var geo = { dx: (cx / W - 0.5) / 0.3, dd: (span - ideal) / tol }
    if (!centrado) consejo = consejo || (cx < W * 0.2 ? 'Corré el iPad hacia la izquierda del paciente' : 'Corré el iPad hacia la derecha del paciente')
  }
  if (opts.stickers != null && !(opts.vistos >= opts.stickers)) consejo = consejo || 'Tienen que verse los stickers verdes'
  const ok = items.every(i => i.ok)
  return { ok, items, consejo, geo: typeof geo !== 'undefined' ? geo : null }
}
// ============================================================
// SEGUIMIENTO DEL PACIENTE (como la calibración de HumanTrak): el detector busca hasta 3 personas y el sistema
// se queda SIEMPRE con la que eligió al principio (por posición y tamaño). Si alguien pasa por detrás, no lo toma.
// Si el paciente sale de cuadro, espera a que vuelva; recién después de 4 s sin verlo se re-engancha con el más grande.
// ============================================================
const SEG = { c: null, s: null, t: 0, fijo: false }

function elegirPaciente(r) {

    const d = (k) => Math.hypot(k.c.x - SEG.c.x, k.c.y - SEG.c.y) + Math.abs(k.s - SEG.s) * 0.7
    el = cand.reduce((m, k) => d(k) < d(m) ? k : m, cand[0])
    if (d(el) > (ahora - SEG.t < 1500 ? 0.3 : 0.45)) el = null       // si se fue, lo espera (y lo reconoce al volver)
  } else if (SEG.c && ahora - SEG.t < 4000) {
    const d = (k) => Math.hypot(k.c.x - SEG.c.x, k.c.y - SEG.c.y) + Math.abs(k.s - SEG.s) * 0.7
    el = cand.reduce((m, k) => d(k) < d(m) ? k : m, cand[0])

// en fotos: se queda con la persona más parecida a la que se venía siguiendo (o la más grande)
function elegirEnFoto(r) {
  if (!r || !r.landmarks || r.landmarks.length < 2) return r
  const cand = r.landmarks.map((lm, i) => ({ i, ...datosPose(lm) }))

    : cand.reduce((m, k) => k.s > m.s ? k : m, cand[0])
  const reord = (a) => a && a.length > el.i ? [a[el.i]] : a

function envolverSeguimiento(lmk, modo) {

// ADAMS AUTOMÁTICO: con la espalda "de canto", el borde de arriba de la silueta es la superficie de la espalda.
// Busca el punto más alto (la giba) en el ancho del tronco de la zona elegida, toma el punto espejo del otro lado
// de la columna y mide la inclinación de esa línea (como el escoliómetro). También dice de qué lado está la giba.
async function adamsAuto(img, W, H, zona) {
  let r = null; try { r = (await modeloImagenSeg()).detect(img) } catch (e) {}
  let m = r && r.segmentationMasks && r.segmentationMasks[0]
  if (!m) {                                   // con el cuerpo doblado a veces no reconoce la postura: se usa la silueta sola
    try { const rs = (await modeloSegPersona()).segment(img); m = rs.confidenceMasks && rs.confidenceMasks[0]; r = { landmarks: [] } } catch (e) {}
  }
  if (!m) return null
  const mw = m.width, mh = m.height, a = m.getAsFloat32Array()
  const top = new Array(mw).fill(null)
  for (let x = 0; x < mw; x++) for (let y = 0; y < mh; y++) if (a[y * mw + x] > 0.5) { top[x] = y; break }
  try { m.close() } catch (e) {}
  const L = r.landmarks && r.landmarks[0]
  // sin puntos del cuerpo: desde la CABEZA el lado derecho del paciente queda a la IZQUIERDA de la foto; desde ATRÁS, a la derecha
  let mid, half, derImg = zona === 'lum' ? 'der' : 'izq'
  if (L) {
    const par = zona === 'lum' ? [23, 24] : zona === 'tl' ? null : [11, 12]
    const xs = par ? par.map(i => L[i].x * mw) : [L[11].x, L[12].x, L[23].x, L[24].x].map(v => v * mw)
    mid = xs.reduce((p, c) => p + c, 0) / xs.length
    half = Math.max(Math.abs(L[11].x - L[12].x), Math.abs(L[23].x - L[24].x)) * mw / 2
    derImg = L[12].x > L[11].x ? 'der' : 'izq'       // de qué lado de la imagen quedó el lado DERECHO del paciente
  }
  if (!L || half < mw * 0.05) {                       // sin puntos del cuerpo: usa el ancho de la silueta
    const cols = top.map((y, x) => y == null ? null : x).filter(x => x != null); if (!cols.length) return null
    mid = (cols[0] + cols[cols.length - 1]) / 2; half = (cols[cols.length - 1] - cols[0]) / 2 * 0.7
  }
  const minEn = (x0, x1) => { let best = null; for (let x = Math.max(0, Math.round(x0)); x <= Math.min(mw - 1, Math.round(x1)); x++) if (top[x] != null && (best == null || top[x] < best.y)) best = { x, y: top[x] }; return best }
  const izq = minEn(mid - half * 0.95, mid - half * 0.12), der = minEn(mid + half * 0.12, mid + half * 0.95)
  if (!izq || !der) return null
  const apex = izq.y <= der.y ? izq : der, xEsp = 2 * mid - apex.x
  const esp = minEn(xEsp - half * 0.06, xEsp + half * 0.06) || { x: xEsp, y: (apex === izq ? der : izq).y }
  const pA = { x: apex.x * W / mw, y: apex.y * H / mh }, pB = { x: esp.x * W / mw, y: esp.y * H / mh }
  return { pts: pA.x < pB.x ? [pA, pB] : [pB, pA], derImg }
}

// ARQUEO LUMBAR (OHS de perfil): en la silueta, el borde de la espalda entre el hombro y la cola. Se traza la recta
// hombro → cola y se mide cuánto se mete hacia adentro el borde en la zona lumbar (la curva), en % del largo del tronco.
// Una curva marcada en el fondo de la sentadilla = arqueo lumbar. Es una sugerencia: el profesional la puede cambiar.
async function arqueoLumbar(canvasImg) {
  const r = (await modeloImagenSeg()).detect(canvasImg)
  const m = r.segmentationMasks && r.segmentationMasks[0], L = r.landmarks && r.landmarks[0]; if (!m || !L) return null
  const mw = m.width, mh = m.height, a = m.getAsFloat32Array(); try { m.close() } catch (e) {}
  const lado = (L[12].visibility ?? 1) + (L[24].visibility ?? 1) >= (L[11].visibility ?? 1) + (L[23].visibility ?? 1) ? [12, 24, 8] : [11, 23, 7]
  const S = { x: L[lado[0]].x * mw, y: L[lado[0]].y * mh }, H = { x: L[lado[1]].x * mw, y: L[lado[1]].y * mh }
  const frente = Math.sign((L[0].x - L[lado[2]].x) || 1), atras = -frente        // hacia dónde mira y dónde queda la espalda
  const y0 = Math.round(Math.min(S.y, H.y)), y1 = Math.round(Math.max(S.y, H.y)); if (y1 - y0 < 10) return null
  const borde = (y) => {                                   // el píxel de la persona más hacia atrás en esa fila
    const xs = atras > 0 ? [mw - 1, -1, -1] : [0, mw, 1]
    for (let x = xs[0]; x !== xs[1]; x += xs[2]) if (a[y * mw + x] > 0.5) return x
    return null }
  const yA = y0 + Math.round((y1 - y0) * 0.05), yB = y1, bA = borde(yA), bB = borde(yB); if (bA == null || bB == null) return null
  const largo = Math.hypot(S.x - H.x, S.y - H.y) || 1
  let prof = 0
  for (let y = yA + 1; y < yB; y++) { const b = borde(y); if (b == null) continue
    const xl = bA + (bB - bA) * (y - yA) / (yB - yA)                     // la recta hombro → cola en esa fila
    prof = Math.max(prof, (xl - b) * atras) }                            // > 0: el borde se mete hacia adentro (curva)
  const pct = +(prof / largo * 100).toFixed(1)
  return { pct, arqueo: pct >= 7 ? 'SI' : 'NO' }
}

  const can = ov.querySelector('#gCan'), ctx = can.getContext('2d'), lienzo = ov.querySelector('#gLienzo')

  const medir = (Q = pts) => {

    const ang = (u, v) => Math.atan2(v.y - u.y, v.x - u.x) * 180 / Math.PI

    const loop = () => {

        const W = v.videoWidth, H = v.videoHeight, e2 = Math.min(c.width / W, c.height / H), x0 = (c.width - W * e2) / 2, y0 = (c.height - H * e2) / 2
        cx.clearRect(0, 0, c.width, c.height)
        if (res && res.landmarks && res.landmarks[0]) {

          const S = (p) => ({ x: x0 + p.x * e2, y: y0 + p.y * e2 })
          cx.lineWidth = 2.5; cx.strokeStyle = 'rgba(255,255,255,.55)'
          SKEL.forEach(([a, b]) => { if (P[a].v > 0.4 && P[b].v > 0.4) { const A = S(P[a]), B = S(P[b]); cx.beginPath(); cx.moveTo(A.x, A.y); cx.lineTo(B.x, B.y); cx.stroke() } })
          const idx = idxTest()
          habilitar(panel.set(chequeoEncuadre(P, W, H, idx, nStk ? { stickers: nStk, vistos: contarStickersVivo(v, nStk) } : {})) || cfg.modo === 'adams')   // Adams: con el cuerpo doblado se puede capturar siempre
          if (idx) {

          habilitar(panel.set(nStk && !idxTest() ? chequeoEncuadre(null, W, H, null, { stickers: nStk, vistos: contarStickersVivo(v, nStk) }) : chequeoEncuadre(null, W, H, idxTest())) || cfg.modo === 'adams') }

      st = await navigator.mediaDevices.getUserMedia({ audio: false, video: camId ? { ...base, deviceId: { exact: camId } } : { ...base, facingMode: facing } })

  const pos = (ev) => { const r = can.getBoundingClientRect(); return { x: (ev.clientX - r.left - ox) / esc2, y: (ev.clientY - r.top - oy) / esc2 } }

    else alUsar(cfg.modo === 'distancia' ? +valor.toFixed(1) : Math.round(valor), null, extra)
    window.removeEventListener('resize', encajar); cerrar() }

// ============================================================
// 🎥 MEDIR EN VIVO · "toma el máximo"
// El paciente se mueve frente al iPad, la cámara sigue el ángulo y se queda con el MÁXIMO.
// Solo para movimientos de pie o sentado, sin manos del evaluador en el cuadro.
// Para que un salto del detector no cuente, el máximo sale de la mediana de los últimos 5 cuadros.
// ============================================================
// Ítems de ROM que ya no se piden (quedan en la ficha si se cargaron antes): el lunge se toma solo en grados, con video.
const ROM_OCULTOS = ['lunge_cm']
const VIVO = {
  rb_cadera:    { ayuda: 'iPad de COSTADO a la altura de la cadera, que se vean hombro, cadera y rodilla. En cuatro patas, que lleve la cola hacia los talones sin perder la espalda recta: se queda con la máxima flexión de cadera.' },
  rotcerv_v:    { ayuda: 'iPad en trípode DE FRENTE a la altura de la cara, que se vean cabeza y hombros. Mientras cuenta 3-2-1 MIRA AL FRENTE (toma la referencia). Después gira la cabeza hacia el lado que medís, sin mover los hombros.' },
  rot_tor_v:    { ayuda: 'iPad en trípode DE FRENTE a la altura del pecho, que se vean hombros y cadera. Mientras cuenta 3-2-1 el paciente MIRA DE FRENTE (el sistema toma el ancho de los hombros). Después rota hacia el lado que medís, sin mover cadera ni rodillas.' },
  lunge_g:      { ayuda: 'iPad de COSTADO, a la altura de la rodilla, que se vea el pie y la rodilla que mide. Que lleve la rodilla a la pared sin levantar el talón.' },
  cad_ri:       { dir: 'lat', ayuda: 'Sentado al borde de la camilla, iPad de FRENTE a la altura de las rodillas. Que lleve el pie hacia AFUERA lo más que pueda, sin mover la rodilla de lugar.' },
  cad_re:       { dir: 'med', ayuda: 'Sentado al borde de la camilla, iPad de FRENTE a la altura de las rodillas. Que lleve el pie hacia ADENTRO lo más que pueda, sin mover la rodilla de lugar.' },
  hom_elev:     { ayuda: 'Parado de PERFIL (el brazo que mide del lado del iPad), cuerpo entero en cuadro. Que suba el brazo estirado lo más alto que pueda, sin arquear la espalda.' },
  rod_flex_act: { ayuda: 'Parado de PERFIL (la pierna que mide del lado del iPad), apoyado en una pared o silla. Que lleve el talón a la cola lo más que pueda.' },
}
function abrirVivo(key, lado, alUsar) {
  const cfg = FOTO[key], vcfg = VIVO[key]; if (!cfg || !vcfg) return
  const L = lado || 'D'
  const ov = document.createElement('div'); ov.className = 'gon'
  ov.innerHTML = `<div class="bar"><h3>🎥 ${esc(cfg.titulo)} · lado ${L === 'D' ? 'derecho' : 'izquierdo'} · toma el máximo</h3>
      <button class="b pri" id="vEmp" disabled>Empezar</button><button class="b" id="vEmpIgual" style="font-size:13px">Empezar sin verificar</button><button class="b" id="vPar" disabled>Parar</button>
      <button class="b pri" id="vUsar" disabled>✓ Usar el máximo</button><button class="b" id="vCer">Cancelar</button></div>
    <div class="ay">${esc(vcfg.ayuda)} Tocá <b>Empezar</b>: cuenta 3-2-1 y desde ahí guarda el máximo. Podés hacer 2 o 3 intentos seguidos; se queda con el mejor.</div>
    <div class="lienzo" id="vLienzo"><div class="vacio" id="vVacio">Prendiendo la cámara…</div>
      <video id="vVid" playsinline muted style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain"></video>
      <canvas id="vCan" style="position:absolute;inset:0;width:100%;height:100%"></canvas>
      <div class="lect" id="vLect" style="display:none"></div></div>`
  document.body.appendChild(ov)
  const vid = ov.querySelector('#vVid'), can = ov.querySelector('#vCan'), ctx = can.getContext('2d')
  const panelV = panelEncuadre(ov.querySelector('#vLienzo'), { alListo: () => { const b = ov.querySelector('#vEmp'); if (b && !b.disabled) b.onclick() } })
  let st = null, raf = null, ultT = -1, P = null, hist = [], maximo = null, midiendo = false, vivo = true, contando = false, baseRat = [], rat0 = null, cuadroMax = null
  const cerrar = () => { vivo = false; if (raf) cancelAnimationFrame(raf); if (st) st.getTracks().forEach(t => t.stop()); ov.remove() }
  ov.querySelector('#vCer').onclick = cerrar
  const ang3 = (a, v, c) => { const u = { x: a.x - v.x, y: a.y - v.y }, w = { x: c.x - v.x, y: c.y - v.y }
    return Math.acos(Math.max(-1, Math.min(1, (u.x * w.x + u.y * w.y) / (Math.hypot(u.x, u.y) * Math.hypot(w.x, w.y) || 1)))) * 180 / Math.PI }
  // rotación de tronco de frente: el ancho aparente de los hombros (sobre el largo del tronco) se achica al rotar
  const ratio = (p) => Math.abs(p[11].x - p[12].x) / Math.max(dist(mid(p[11], p[12]), mid(p[23], p[24])), 1)
  const valorDe = (p) => {
    if (cfg.modo === 'rotcerv') {
      if (![0, 7, 8, 11, 12].every(i => p[i].v > 0.3)) return null
      const r = Math.abs(p[7].x - p[8].x) / Math.max(Math.abs(p[11].x - p[12].x), 1)
      if (contando) { baseRat.push(r); return null }
      if (rat0 == null) return null
      const g = Math.acos(Math.max(0, Math.min(1, r / rat0))) * 180 / Math.PI
      const haciaDer = (p[0].x - (p[7].x + p[8].x) / 2) * (Math.sign(p[12].x - p[11].x) || 1) > 0
      return (L === 'D') === haciaDer ? g : 0
    }
    if (cfg.modo === 'rotacion') {
      if (![11, 12, 23, 24].every(i => p[i].v > 0.5)) return null
      if (contando) { baseRat.push(ratio(p)); return null }
      if (rat0 == null) return null
      const g = Math.acos(Math.max(0, Math.min(1, ratio(p) / rat0))) * 180 / Math.PI
      // sentido: al rotar hacia la DERECHA el hombro derecho se va para atrás (más lejos de la cámara)
      const atrasDer = (p[12].z - p[11].z) > 0
      return (L === 'D') === atrasDer ? g : 0
    }
    const idx = cfg.lm(L); if (!idx.every(i => p[i].v > 0.5)) return null
    const [a, b, c] = idx.map(i => p[i])
    if (cfg.modo === 'angulo') { const g = ang3(a, b, c); return cfg.conv ? cfg.conv(g) : g }
    if (cfg.modo === 'vertical') {
      const g = Math.atan2(Math.abs(b.x - a.x), Math.abs(b.y - a.y)) * 180 / Math.PI
      if (!vcfg.dir) return g
      // rotación de cadera: solo cuenta si el pie va para el lado que corresponde
      const cadL = L === 'D' ? 24 : 23, cadO = L === 'D' ? 23 : 24
      const lat = Math.sign(p[cadL].x - p[cadO].x) || 1          // hacia afuera de esa pierna
      const haciaAfuera = (b.x - a.x) * lat > 0                  // tobillo más afuera que la rodilla
      return (vcfg.dir === 'lat') === haciaAfuera ? g : 0
    }
    return null
  }
  const pintar = () => {
    const W = can.width = can.clientWidth, H = can.height = can.clientHeight
    ctx.clearRect(0, 0, W, H)
    if (!P || !vid.videoWidth) return
    const k = Math.min(W / vid.videoWidth, H / vid.videoHeight), ox = (W - vid.videoWidth * k) / 2, oy = (H - vid.videoHeight * k) / 2
    const q = (i) => ({ x: ox + P[i].x * k, y: oy + P[i].y * k })
    const idx = cfg.lm(L).map(q)
    if (cfg.modo === 'rotacion' || cfg.modo === 'rotcerv') { ctx.lineWidth = 5; ctx.strokeStyle = '#22d3ee'; ctx.beginPath(); ctx.moveTo(idx[0].x, idx[0].y); ctx.lineTo(idx[1].x, idx[1].y); ctx.stroke(); return }
    ctx.lineWidth = 5; ctx.strokeStyle = '#22d3ee'; ctx.beginPath(); ctx.moveTo(idx[0].x, idx[0].y); idx.slice(1).forEach(p => ctx.lineTo(p.x, p.y)); ctx.stroke()
    if (cfg.modo === 'vertical') { ctx.setLineDash([8, 6]); ctx.strokeStyle = '#fbbf24'; ctx.beginPath(); ctx.moveTo(idx[0].x, idx[0].y); ctx.lineTo(idx[0].x, idx[0].y - 200); ctx.stroke(); ctx.setLineDash([]) }
    idx.forEach(p => { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(p.x, p.y, 9, 0, 7); ctx.fill() })
  }
  const loop = () => {
    if (!vivo) return
    if (vid.currentTime !== ultT && landmarker && vid.videoWidth) {
      ultT = vid.currentTime
      const r = landmarker.detectForVideo(vid, performance.now())
      const lect = ov.querySelector('#vLect'); lect.style.display = ''
      if (r.landmarks && r.landmarks[0]) {
        const W = vid.videoWidth, H = vid.videoHeight
        const nuevo = r.landmarks[0].map(p => ({ x: p.x * W, y: p.y * H, z: p.z * W, v: p.visibility ?? 1 }))
        P = P ? nuevo.map((p, i) => ({ x: P[i].x * 0.4 + p.x * 0.6, y: P[i].y * 0.4 + p.y * 0.6, z: P[i].z * 0.4 + p.z * 0.6, v: p.v })) : nuevo
        if (ov.querySelector('#vPar').disabled) { const okE = panelV.set(chequeoEncuadre(P, W, H, cfg.lm ? cfg.lm(L) : null)); ov.querySelector('#vEmp').disabled = !okE }
        const v = valorDe(P)
        if (v != null) { hist.push(v); if (hist.length > 5) hist.shift() }
        const med = hist.length >= 3 ? hist.slice().sort((a, b) => a - b)[Math.floor(hist.length / 2)] : null
        if (midiendo && med != null && (maximo == null || med > maximo)) { maximo = med
          try { cuadroMax = cuadroMax || document.createElement('canvas'); cuadroMax.width = vid.videoWidth; cuadroMax.height = vid.videoHeight; cuadroMax.getContext('2d').drawImage(vid, 0, 0) } catch (e) {} }
        lect.textContent = `${med != null ? Math.round(med) + '°' : '—'}${maximo != null ? '  ·  máx ' + Math.round(maximo) + '°' : ''}`
        ov.querySelector('#vUsar').disabled = maximo == null
      } else { P = null; lect.textContent = 'No veo al paciente' }
      pintar()
    }
    raf = requestAnimationFrame(loop)
  }
  ;(async () => {
    try {
      await cargarModelo()
      const base = { width: { ideal: 1920 }, height: { ideal: 1440 } }
      st = await navigator.mediaDevices.getUserMedia({ audio: false, video: camId ? { ...base, deviceId: { exact: camId } } : { ...base, facingMode: facing } })
      if (!vivo) { st.getTracks().forEach(t => t.stop()); return }
      vid.srcObject = st; await vid.play()
      ov.querySelector('#vVacio').style.display = 'none'; ov.querySelector('#vEmp').disabled = false
      loop()
    } catch (e) { ov.querySelector('#vVacio').textContent = 'No se pudo prender la cámara: ' + (e.message || e) }
  })()
  ov.querySelector('#vEmpIgual').onclick = () => { const b = ov.querySelector('#vEmp'); b.disabled = false; b.onclick() }
  ov.querySelector('#vEmp').onclick = async () => {
    beep(1, 1); maximo = null; midiendo = false; hist = []; ov.querySelector('#vEmp').disabled = true; ov.querySelector('#vPar').disabled = false
    const lect = ov.querySelector('#vLect')
    if (cfg.modo === 'rotacion' || cfg.modo === 'rotcerv') { baseRat = []; rat0 = null; contando = true }
    for (const n of [3, 2, 1]) { beep(600, 120); lect.textContent = String(n); await new Promise(r => setTimeout(r, 900)) }
    if (cfg.modo === 'rotacion' || cfg.modo === 'rotcerv') {
      contando = false
      if (baseRat.length < 5) { lect.textContent = 'No vi bien de frente: probá de nuevo'; ov.querySelector('#vEmp').disabled = false; return }
      rat0 = baseRat.slice().sort((a, b) => a - b)[Math.floor(baseRat.length / 2)]
    }
    beep(1000, 300); midiendo = true
  }
  ov.querySelector('#vPar').onclick = () => { midiendo = false; beep(800, 300); ov.querySelector('#vEmp').disabled = false; ov.querySelector('#vEmp').textContent = 'Empezar de nuevo'; ov.querySelector('#vPar').disabled = true }
  ov.querySelector('#vUsar').onclick = () => { if (maximo == null) return; alUsar(Math.round(maximo), cuadroMax); cerrar() }
}

function renderROM(opts = {}) {

  let anteriores = {}, historial = [], secs = new Set(opts.sec ? [opts.sec] : ROM.map(g => g.sec)), obs = ''
  $('app').innerHTML = `

      <h2>📐 ROM · movilidad analítica</h2>

      <div class="ultima" id="ultima"></div>

      <div class="necbox">🧰 <b>Necesitás:</b> los botones de cada casillero: <b>🎥 en vivo</b> (el paciente se mueve, se ven las líneas y toma el máximo solo: lunge, rotaciones de cadera, flexión de rodilla de pie y elevación de hombro) y <b>📷 foto</b> (se abre la cámara con las líneas; los puntos se ubican solos) · camilla · stickers verde flúor de 19 mm para el drop navicular (2 fotos con el iPad fijo) · goniómetro solo si no hay cámara</div>

      <textarea class="obs" id="romObs" placeholder="Observaciones"></textarea>
      <div class="estado" id="estado">Cargá solo lo que evaluaste: lo vacío no se guarda.</div>
      <div class="res" id="res"></div>
    </div>
    <div class="panel evo" id="evoRom" style="display:none"></div>
    <div class="panel evo" id="evo" style="display:none"></div>`
  $('btnVolver').onclick = () => conGuardado(renderCatalogo)
  const num = (x) => x === '' || x == null || isNaN(+x) ? null : +x
  const lado = (k, L) => {
    const it = ROM_ITEMS.find(i => i.k === k)
    if (it.calc) { const a = vals[it.calc[0]]?.[L], b = vals[it.calc[1]]?.[L]; return a != null && b != null ? a + b : null }
    return vals[k]?.[L] ?? null
  }
  const lsi = (k) => { const d = lado(k, 'D'), i = lado(k, 'I'); if (d == null || i == null || Math.max(d, i) <= 0) return null; return Math.min(d, i) / Math.max(d, i) * 100 }
  const cambio = (k, L) => { const a = anteriores[k]?.[L], v = lado(k, L); if (a == null || v == null || a === 0) return null; return (v - a) / Math.abs(a) * 100 }
  const fueraRef = (it, v) => v != null && it.ref && ((it.ref.min != null && v < it.ref.min) || (it.ref.max != null && v > it.ref.max))
  const pctTxt = (x, menos) => x == null ? '' : `<span class="${(menos ? -x : x) >= 0 ? 'c-ok' : 'c-bad'}">${x > 0 ? '+' : ''}${fmt(x, 1)}%</span>`

  function pintarTabla() {
    document.querySelectorAll('#chips button').forEach(b => b.classList.toggle('on', secs.has(b.dataset.s)))
    $('tabRom').innerHTML = `<tr><th>Medida</th><th class="ladoD">D</th><th class="ladoI">I</th><th>LSI</th><th>Referencia</th></tr>` +
      ROM.filter(g => secs.has(g.sec)).map(g => `<tr><td class="sec" colspan="5">${g.n.toUpperCase()}</td></tr>` + g.items.filter(it => !ROM_OCULTOS.includes(it.k)).map(it => {

      if (v && typeof v === 'object') return
      const inp = document.querySelector(`#tabRom input[data-k="${b.dataset.foto}"][data-l="${b.dataset.l}"]`); inp.value = v
