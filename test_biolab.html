    const FILAS = [
      ['valgo', 'Valgo de rodillas', ['NO', 'D', 'I', 'BILATERAL']], ['varo', 'Rodillas hacia afuera', ['NO', 'D', 'I', 'BILATERAL']],
      ['abduccion', 'Abducción de pie', ['NO', 'D', 'I', 'BILATERAL']], ['colapso', 'Colapso de pie', ['NO', 'D', 'I', 'BILATERAL']],
      ['peso', 'Distribución de peso asimétrica', ['NO', 'HACIA D', 'HACIA I']], ['tibia', 'Tibia paralela a tronco', ['SI', 'NO']],
      ['arqueo', 'Arqueo lumbar', ['NO', 'SI']], ['brazos', 'Brazos caen adelante', ['NO', 'SI']],
    ]
    const esComp = (k, v) => k === 'tibia' ? v === 'NO' : v !== 'NO'
    const ladoTxt = (v) => v === 'D' ? ' (D)' : v === 'I' ? ' (I)' : v === 'BILATERAL' ? ' (bilateral)' : ''
    const musculos = () => {
      const sob = new Map(), poc = new Map()
      FILAS.forEach(([k]) => { const v = d.f[k]; if (!esComp(k, v) || !MUSCULOS[k]) return
        MUSCULOS[k].sob.forEach(x => { if (!sob.has(x)) sob.set(x, []); sob.get(x).push(MUSCULOS[k].n + ladoTxt(v)) })
        MUSCULOS[k].poc.forEach(x => { if (!poc.has(x)) poc.set(x, []); poc.get(x).push(MUSCULOS[k].n + ladoTxt(v)) }) })
      return { sob, poc }
    }
    const pintar = () => {
      const comps = FILAS.filter(([k]) => esComp(k, d.f[k]))
      const { sob, poc } = musculos()
      const sig = sugerirTests(d.f)
      const lista = (m) => m.size ? [...m].map(([x, por]) => `${esc(x)} <small>· ${esc(por.join(', '))}</small>`).join('<br>') : '—'
      const html = `
        <div class="val">${comps.length} <span style="font-size:16px">compensación${comps.length === 1 ? '' : 'es'}</span></div>
        <div class="interp ${comps.length ? 'c-warn' : 'c-ok'}">${comps.length ? comps.map(([k, n]) => (k === 'tibia' ? 'Tibia NO paralela al tronco' : n.replace(' (a ojo)', '') + ladoTxt(d.f[k]))).join(' · ') : 'Patrón sin compensaciones'}</div>
        <table class="crit"><tr><th>Sentadilla overhead</th><th>Resultado</th></tr>
          ${FILAS.map(([k, n, ops]) => `<tr><td>${n}</td><td><select data-k="${k}">${ops.map(o => `<option ${d.f[k] === o ? 'selected' : ''}>${o}</option>`).join('')}</select>
            ${d.sug && d.sug[k] != null && d.sug[k] !== d.f[k] ? '<span class="sug">(cámara: ' + d.sug[k] + ')</span>' : ''}</td></tr>`).join('')}</table>
        ${Object.keys(d.fotos).length ? `<div class="fotos">${VISTAS.filter(v => d.fotos[v.id]).map(v => `<figure><img src="${d.fotos[v.id].dataUrl}" alt="${v.etq}"><figcaption>${v.etq}</figcaption></figure>`).join('')}</div>` : ''}
        <textarea class="obs" id="ohsObs" placeholder="Observaciones">${esc(d.obs)}</textarea>
        ${comps.length ? `<div class="musc"><div class="sob"><b>MÚSCULOS SOBREACTIVOS</b>${lista(sob)}</div><div class="poc"><b>MÚSCULOS POCO ACTIVOS</b>${lista(poc)}</div></div>` : ''}
        <div class="sigue"><h4>🌳 Próximos tests sugeridos</h4>
          ${sig.filter(t => aptitud(t.id) !== 'no').map(t => { const listo = !!TESTS.find(x => x.id === t.id) || !!DESTINO[t.id]
            return `<div class="it"><div>${esc(CATALOGO_MAPA[t.id] || t.id)}<small>porque: ${esc(t.motivos.join(' · '))}</small></div>
              <button data-ir="${t.id}" ${listo ? '' : 'disabled'}>${listo ? 'Hacer ahora →' : 'Próximamente'}</button></div>` }).join('')}
          <div class="nota">Solo aparecen los que hacen falta según lo que salió. Podés hacer cualquier otro desde "Todos los tests".</div></div>`
      const txt = `Sentadilla overhead: ${comps.length ? comps.map(([k, n]) => (k === 'tibia' ? 'Tibia NO paralela al tronco' : n.replace(' (a ojo)', '') + ladoTxt(d.f[k]))).join(', ') : 'sin compensaciones'}`
        + (sob.size ? `. Sobreactivos: ${[...sob.keys()].join(', ')}. Poco activos: ${[...poc.keys()].join(', ')}` : '')
        + (d.obs ? `. Obs: ${d.obs}` : '')
      mostrarResultado(html, txt, { valor: comps.length, unidad: 'compensaciones', detalle: {
        hallazgos: { ...d.f }, sugerido_camara: d.sug || null, medidas_frente: d.medFrente || null, medidas_costado: d.medCostado || null,
        medidas_posterior: d.medPosterior || null,
        musculos_sobreactivos: [...sob.keys()], musculos_poco_activos: [...poc.keys()], tests_sugeridos: sig.map(t => t.id), observaciones: d.obs || null },
        fotos: VISTAS.filter(v => d.fotos[v.id]).map(v => ({ vista: v.etq, dataUrl: d.fotos[v.id].dataUrl })) })
      document.querySelectorAll('.crit select').forEach(sel => sel.onchange = () => { d.f[sel.dataset.k] = sel.value; pintar() })
      $('ohsObs').onchange = (e) => { d.obs = e.target.value; pintar() }
      document.querySelectorAll('[data-ir]').forEach(b => b.onclick = () => { if (b.disabled) return
        const id = b.dataset.ir; conGuardado(() => DESTINO[id] && !TESTS.find(x => x.id === id) ? renderTest('rom', { sec: DESTINO[id] }) : renderTest(id), true) })
    }
    // permite cargar a mano sin cámara (por ejemplo, si lo viste a ojo)
    d.manual = () => { d.f = { valgo: 'NO', varo: 'NO', abduccion: 'NO', colapso: 'NO', peso: 'NO', tibia: 'SI', arqueo: 'NO', brazos: 'NO' }; d.idx = NV; pintar() }
    return d
  },

  marcha4r() { return DETECTORES.marcha4() },
  sprint10() { return DETECTORES.marcha4() },
  crossover() { return detectorSalto('triple') },
  unipodal() { return detectorUnipodal() },
  alcance() { return detectorAlcance() },
  sidehop() { return detectorSideHop() },
  ckcuest() { return detectorCkcuest() },

  // ---------- SILLA (5 repeticiones y 30 segundos) ----------
  silla5() { return detectorSilla('5rep') },
  silla30() { return detectorSilla('30s') },

  // ---------- PUSH UPS / PULL UPS ----------
  pushup() { return detectorReps('push') },
  pullup() { return detectorReps('pull') },

  // ---------- SALTOS (bipodal, hop simple, triple hop) ----------
  salto() { return detectorSalto('bipodal') },
  hop() { return detectorSalto('simple') },
  triplehop() { return detectorSalto('triple') },

  // ---------- PUENTE GLÚTEO 1 PIERNA (cámara detrás de la cabeza) ----------
  // Referencia con el puente en los dos pies; después extiende una pierna y se cronometra.
  // Se mide la inclinación de la línea de caderas (desde la cabeza, si la pelvis cae o rota, la línea se tuerce).
  puente() {
    // Se sostiene HASTA QUE PIERDE LA POSICIÓN: corta solo si la pelvis colapsa (cae o rota) o empieza a oscilar.
    // El "tope" es solo un máximo de seguridad (más corto en mayores de 60). Referencias en adultos, por lado:
    // menos de 30 s déficit · ~60 s esperable (65 s dominante / 64 s no dominante en adultos jóvenes) · más de 80 s bueno.
    const U = { control: 8, corte: 12, oscila: 4 }
    const LADOS = [{ lado: 'D', nombre: 'derecha', libre: 'izquierda' }, { lado: 'I', nombre: 'izquierda', libre: 'derecha' }]
    const d = { idx: 0, fase: 'quieto', res: {}, sug: {}, autoArmar: false, obs: '' }
    const objetivo = () => parseFloat(($('pteObj') || {}).value) || 120
    const mayor = () => { const pf = perfilActual(); return !!(pf && pf.edad >= 60) }
    // adultos: <30 déficit · ~60 esperable · >80 bueno. Mayores de 60 (sin normas: criterio clínico orientativo):
    // objetivo funcional 30 s por lado; menos de 20 s déficit.
    const nivelPuente = (t) => mayor()
      ? (t < 20 ? ['bad', 'Déficit (menos de 20 s)'] : t < 30 ? ['warn', 'Por debajo del objetivo funcional (30 s)'] : ['ok', 'Cumple el objetivo funcional (30 s o más)'])
      : (t < 30 ? ['bad', 'Déficit (menos de 30 s)'] : t < 60 ? ['warn', 'Por debajo de lo esperable (30–59 s)'] : t <= 80 ? ['ok', 'Esperable (60–80 s)'] : ['ok', 'Bueno (más de 80 s)'])
    const prox = () => { if (d.idx < 2) setEstado(`Apoyo ${LADOS[d.idx].nombre.toUpperCase()} (estira la ${LADOS[d.idx].libre})${d.idx ? ': ' + (inicioAuto ? 'arranca solo al quedar ubicado' : 'tocá Empezar cuando esté listo') + '.' : '. Tocá Empezar.'}`)
      $('btnEmpezar').textContent = d.idx < 2 ? `Empezar · apoyo ${LADOS[d.idx].nombre}` : 'Empezar' }
    d.init = prox
    const angPelvis = () => Math.atan2(pose[23].y - pose[24].y, pose[23].x - pose[24].x) * 180 / Math.PI
    const difAng = (a, b) => Math.abs(((a - b + 540) % 360) - 180)
    d.empezar = async () => {
      if (d.idx >= 2) return
      d.autoArmar = true; d.muestras = []; d.maxInc = 0; d.sobre = 0; d.ventana = []
      d.avisos = crearAvisos((m) => d.cerrar(null, m), (n) => setEstado(`⚠️ Aviso ${n} de 3: corregí la pelvis`, 'warn'))
      d.fase = 'cuenta'; await cuentaRegresiva(); setBig('')
      decir('Subí la cadera con los dos pies'); setEstado('Puente con los DOS pies: tomando la referencia de la pelvis…', 'warn')
      d.fase = 'calibrando'
    }
    d.frame = async (now) => {
      if (!pose) return
      if (d.fase === 'calibrando') {
        if (!visible(23, 24)) return
        d.muestras.push(angPelvis())
        if (d.muestras.length >= 24) {
          d.base = d.muestras.slice().sort((a, b) => a - b)[Math.floor(d.muestras.length / 2)]
          decir(`Ahora estirá la pierna ${LADOS[d.idx].libre}`); beep(1000, 300)
          d.t0 = performance.now(); d.fase = 'midiendo'; setEstado(`Sosteniendo sobre la pierna ${LADOS[d.idx].nombre}…`, 'ok')
        }
        return
      }
      if (d.fase !== 'midiendo') return
      const t = (now - d.t0) / 1000, obj = objetivo()
      if (visible(23, 24)) {
        const inc = difAng(angPelvis(), d.base)
        if (t > 1.5) d.maxInc = Math.max(d.maxInc, inc)            // el primer segundo es acomodarse
        // colapso (la pelvis cae o rota medio segundo seguido) u oscilación (va y viene): primero avisa, corta al 3.er aviso
        d.sobre = inc > U.corte && t > 1.5 ? d.sobre + 1 : 0
        let osc = false
        if (t > 2) { d.ventana.push(inc); if (d.ventana.length > 24) d.ventana.shift()
          if (d.ventana.length >= 20) { const m = d.ventana.reduce((a, b) => a + b, 0) / d.ventana.length, ds = Math.sqrt(d.ventana.reduce((a, b) => a + (b - m) ** 2, 0) / d.ventana.length)
            osc = ds > U.oscila; if (osc) d.ventana = [] } }
        if (d.avisos.paso(d.sobre >= 6 || osc, t)) return
      }
      setBig(`${fmt(t, 1)} s`)
      if (t >= obj) d.cerrar(obj, 'llegó al tope de seguridad')
    }
    // Al terminar cada pierna el iPad pregunta en voz alta dónde lo sintió, con 3 botones grandes
    // sobre la imagen (los puede tocar el paciente desde la colchoneta o el profesional).
    // ¿por qué bajó? (en mayores muchas veces corta un calambre de isquios o el dolor lumbar, no la fatiga del glúteo)
    const preguntarMotivo = () => new Promise((resolver) => {
      const stage = document.querySelector('.stage'); if (!stage) return resolver('—')
      const caja = document.createElement('div'); caja.className = 'pregunta'
      caja.innerHTML = `<div class="pq">¿Por qué bajó?</div>
        <div class="pbtns"><button data-r="Cansancio">😮‍💨<b>Cansancio</b><small>no pudo más</small></button>
          <button data-r="Calambre de isquiotibiales">⚡<b>Calambre</b><small>isquiotibiales</small></button>
          <button data-r="Dolor lumbar">🔙<b>Dolor lumbar</b><small>en la cintura</small></button></div>
        <button class="pno" data-r="Otro / no sabe">Otro / no sabe</button>`
      stage.appendChild(caja); decir('¿Por qué bajó? ¿Cansancio, calambre o dolor lumbar?')
      let listo = false; const fin = (r) => { if (listo) return; listo = true; caja.remove(); beep(1100, 80); resolver(r) }
      caja.querySelectorAll('[data-r]').forEach(b => b.onclick = () => fin(b.dataset.r)); setTimeout(() => fin('—'), 30000)
    })
    const preguntarFatiga = (lado) => new Promise((resolver) => {
      const stage = document.querySelector('.stage'); if (!stage) return resolver('—')
      const caja = document.createElement('div'); caja.className = 'pregunta'
      caja.innerHTML = `<div class="pq">¿Dónde lo sentiste más? <small>pierna de apoyo ${lado === 'D' ? 'derecha' : 'izquierda'}</small></div>
        <div class="pbtns"><button data-t="Lumbares"><span style="font-size:34px;font-weight:900;line-height:1">⬆</span><b>Lumbares</b><small>la cintura</small></button>
          <button data-t="Glúteos"><span style="font-size:34px;font-weight:900;line-height:1">━</span><b>Glúteos</b><small>la cola</small></button>
          <button data-t="Isquiosurales"><span style="font-size:34px;font-weight:900;line-height:1">⬇</span><b>Isquiotibiales</b><small>atrás del muslo</small></button></div>
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px"><button class="pno" data-ok="1" style="background:#22c55e;color:#fff;border-color:#22c55e">✓ Listo</button>
        <button class="pno" data-r="—">No sabe / en ningún lado</button></div>
        <div style="text-align:center;font-size:13px;opacity:.8;margin-top:6px">Se puede marcar más de uno</div>`
      stage.appendChild(caja)
      decir('¿Dónde lo sentiste? ¿Glúteos, isquiotibiales o lumbares? Podés marcar más de uno.')
      let listo = false
      const fin = (r) => { if (listo) return; listo = true; caja.remove(); beep(1100, 80); resolver(r) }
      const marcados = new Set()
      caja.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { const t = b.dataset.t
        if (marcados.has(t)) marcados.delete(t); else marcados.add(t)
        b.style.outline = marcados.has(t) ? '4px solid #22c55e' : ''; b.style.background = marcados.has(t) ? '#dcfce7' : '' })
      caja.querySelector('[data-ok]').onclick = () => fin(marcados.size ? ['Glúteos', 'Isquiosurales', 'Lumbares'].filter(x => marcados.has(x)).join(' + ') : '—')
      caja.querySelectorAll('[data-r]').forEach(b => b.onclick = () => fin(b.dataset.r))
      setTimeout(() => fin(marcados.size ? ['Glúteos', 'Isquiosurales', 'Lumbares'].filter(x => marcados.has(x)).join(' + ') : '—'), 45000)      // si nadie confirma en 45 s, queda lo marcado
    })
    d.cerrar = async (t, motivo) => {
      if (d.fase !== 'midiendo') return
      if (t == null) t = (performance.now() - d.t0) / 1000
      const L = LADOS[d.idx]; d.fase = 'quieto'; beep(motivo ? 400 : 900, 400); setBig('')
      const s = { control: d.maxInc > U.control ? 'NO' : 'SI', fatiga: '—', tiempo: +t.toFixed(1) }
      d.res[L.lado] = { ...s, inclinacion_max: +d.maxInc.toFixed(1), corte: motivo || (t >= objetivo() ? 'llegó al objetivo' : 'cortado a mano') }
      d.sug[L.lado] = { ...s }
      setEstado(`Apoyo ${L.nombre}: ${fmt(t, 1)} s${motivo ? ' (' + motivo + ')' : ''}. Esperando la respuesta: ¿dónde lo sintió?`, 'warn')
      d.res[L.lado].fatiga = await preguntarFatiga(L.lado)
      if (motivo !== 'llegó al tope de seguridad') d.res[L.lado].motivo_corte = await preguntarMotivo()
      d.res[L.lado].avisos = d.avisos ? d.avisos.n : 0
      d.idx++; guardarProgreso(d)
      if (d.idx < 2) { prox(); setEstado(`Apoyo ${L.nombre} listo. Ahora la otra pierna: arranca sola al quedar ubicado.`, 'ok')
        setTimeout(() => decir('Descansá. Ahora la otra pierna.'), 600); setTimeout(() => { if (d.fase === 'quieto' && d.idx < 2) d.armado = true }, 7000) }
      else { d.autoArmar = false; decir('Listo. Terminamos.'); setEstado('Terminado. Revisá la planilla.', 'ok'); $('btnEmpezar').textContent = 'Empezar'; pintar() }
    }
    d.terminar = () => d.cerrar(null, 'cortado a mano')
    const pintar = () => {
      const lados = ['D', 'I'].filter(L => d.res[L])
      const sinCtrl = lados.filter(L => d.res[L].control === 'NO').length
      const h = []
      lados.forEach(L => { const r = d.res[L]; if (r.control === 'NO') h.push(`Sin control lumbopélvico (${L})`)
        if (r.fatiga && r.fatiga !== '—' && r.fatiga !== 'Glúteos') { const otros = r.fatiga.split(' + ').filter(x => x !== 'Glúteos').map(x => x === 'Isquiosurales' ? 'isquiotibiales' : x.toLowerCase())
          h.push(`Se fatigan ${otros.join(' y ')} (${L}) ${r.fatiga.includes('Glúteos') ? 'además de glúteos' : 'en vez de glúteos'}`) }
        h.push(`${L}: ${fmt(r.tiempo, 1)} s → ${nivelPuente(r.tiempo)[1]}${r.motivo_corte && r.motivo_corte !== '—' ? ` · bajó por ${r.motivo_corte.toLowerCase()}` : ''}${r.avisos ? ` · ${r.avisos} aviso${r.avisos > 1 ? 's' : ''} de corrección` : ''}`) })
      if (d.res.D && d.res.I) { const a = d.res.D.tiempo, b = d.res.I.tiempo, lsi = Math.min(a, b) / Math.max(a, b, 0.1) * 100; if (lsi < 90) h.push(`Asimetría entre lados: LSI ${Math.round(lsi)}%`) }
      const sel = (L, k, ops) => `<select data-l="${L}" data-k="${k}">${ops.map(o => `<option ${d.res[L][k] === o ? 'selected' : ''}>${o}</option>`).join('')}</select>${d.sug[L] && d.sug[L][k] !== d.res[L][k] && k === 'control' ? '<span class="sug">(cámara: ' + d.sug[L][k] + ')</span>' : ''}`
      const html = `
        <div class="val">${lados.map(L => `${L} ${fmt(d.res[L].tiempo, 1)} s`).join(' · ')}</div>
        <div class="interp ${sinCtrl ? 'c-warn' : 'c-ok'}">${sinCtrl ? 'Control lumbopélvico a trabajar' : 'Buen control lumbopélvico'}</div>
        <div class="nota">${lados.map(L => { const n = nivelPuente(d.res[L].tiempo); return `<b class="c-${n[0] === 'bad' ? 'bad' : n[0] === 'warn' ? 'warn' : 'ok'}">${L === 'D' ? 'Derecha' : 'Izquierda'}: ${n[1]}</b>` }).join(' · ')}<br><small>${mayor() ? 'Mayores de 60 (sin normas poblacionales, criterio clínico orientativo): objetivo funcional 30 s por lado; menos de 20 s, déficit. Lo que más vale: la simetría entre lados y la evolución del propio paciente.' : 'Referencia en adultos: menos de 30 s déficit · ~60 s esperable · más de 80 s bueno.'} Cuenta solo con la pelvis nivelada.</small></div>
        ${h.length ? `<div class="nota">${h.map(esc).join(' · ')}</div>` : ''}
        <table class="crit"><tr><th>Puente 1 pierna</th>${lados.map(L => `<th>Apoyo ${L === 'D' ? 'derecho' : 'izquierdo'}</th>`).join('')}</tr>
          <tr><td>Control lumbopélvico</td>${lados.map(L => `<td>${sel(L, 'control', ['SI', 'NO'])}</td>`).join('')}</tr>
          <tr><td>Inclinación máxima de la pelvis</td>${lados.map(L => `<td>${fmt(d.res[L].inclinacion_max, 1)}°</td>`).join('')}</tr>
          <tr><td>Tiempo</td>${lados.map(L => `<td>${fmt(d.res[L].tiempo, 1)} s <small>(${esc(d.res[L].corte)})</small></td>`).join('')}</tr>
          <tr><td>Grupo que se fatiga (preguntale)</td>${lados.map(L => `<td>${sel(L, 'fatiga', ['—', 'Glúteos', 'Isquiosurales', 'Lumbares', 'Glúteos + Isquiosurales', 'Glúteos + Lumbares', 'Isquiosurales + Lumbares', 'Glúteos + Isquiosurales + Lumbares', 'Otro'])}</td>`).join('')}</tr></table>
        <textarea class="obs" id="pteObs" placeholder="Observaciones">${esc(d.obs)}</textarea>`
      mostrarResultado(html, `Puente 1 pierna: ${lados.map(L => `apoyo ${L} ${fmt(d.res[L].tiempo, 1)} s, control ${d.res[L].control.toLowerCase()}`).join(' · ')}${h.length ? '. ' + h.join('; ') : ''}${d.obs ? '. Obs: ' + d.obs : ''}`,
        { valor: sinCtrl, unidad: 'lados sin control', detalle: { lados: d.res, sugerido_camara: d.sug, objetivo_s: objetivo(), hallazgos_txt: h, observaciones: d.obs || null } })
      document.querySelectorAll('.crit select').forEach(sl => sl.onchange = () => { d.res[sl.dataset.l][sl.dataset.k] = sl.value; pintar() })
      $('pteObs').onchange = (e) => { d.obs = e.target.value; pintar() }
    }
    d.manual = () => { ['D', 'I'].forEach(L => { d.res[L] = { control: 'SI', fatiga: '—', tiempo: objetivo(), inclinacion_max: 0, corte: 'cargado a ojo' } }); d.idx = 2; pintar() }
    return d
  },

  // ---------- ESTOCADA CON CAMBIO (de frente) ----------
  // Cuenta estocadas por la bajada de la cadera. En cada una, la pierna de ADELANTE es la de la rodilla más alta
  // (la de atrás baja hacia el piso). Mide rodilla medial y tronco (inclinación y rotación) contra la postura inicial.
  estocada() {
    const U = { valgo: 0.06, inclinacion: 10, rotacion: 0.18, abajo: 0.12, arriba: 0.05, total: 6 }
    const d = { fase: 'quieto', reps: 0, abajo: false, mx: null, res: null, sug: null, obs: '', cuenta: { D: 0, I: 0 } }
    d.init = () => setEstado('Parado de frente, brazos cruzados. Tocá Empezar.')
    const medir = () => {
      const cad = mid(pose[23], pose[24]), hom = mid(pose[11], pose[12])
      const torso = Math.max(dist(cad, hom), 1), pierna = Math.max((dist(pose[24], pose[28]) + dist(pose[23], pose[27])) / 2, 1)
      return { cadY: cad.y, pierna, torso, incl: Math.atan2(hom.x - cad.x, cad.y - hom.y) * 180 / Math.PI, hombros: Math.abs(pose[11].x - pose[12].x) / torso }
    }
    // rodilla de la pierna de adelante respecto de la línea cadera-tobillo, hacia la línea media
    const valgoDe = (L, pierna) => {
      const [h, k, a, o] = L === 'D' ? [24, 26, 28, 23] : [23, 25, 27, 24]
      const t = (pose[k].y - pose[h].y) / Math.max(pose[a].y - pose[h].y, 1)
      const xLinea = pose[h].x + (pose[a].x - pose[h].x) * t
      return ((pose[k].x - xLinea) * (Math.sign(pose[o].x - pose[h].x) || 1)) / pierna
    }
    d.empezar = async () => {
      d.muestras = []; d.base = null; d.reps = 0; d.abajo = false; d.cuenta = { D: 0, I: 0 }
      d.mx = { D: { valgo: 0, incl: 0, rot: 0 }, I: { valgo: 0, incl: 0, rot: 0 } }
      d.fase = 'calibrando'; setEstado('Quieto, de frente: midiendo la postura inicial…', 'warn')
    }
    d.frame = async () => {
      if (!pose) return
      if (d.fase === 'calibrando') {
        if (!visible(11, 12, 23, 24, 25, 26, 27, 28)) return
        d.muestras.push(medir())
        if (d.muestras.length >= 14) {
          const m = d.muestras, av = f => m.reduce((s, x) => s + f(x), 0) / m.length
          d.base = { cadY: av(x => x.cadY), pierna: av(x => x.pierna), incl: av(x => x.incl), hombros: av(x => x.hombros) }
          d.fase = 'cuenta'; await cuentaRegresiva(); d.fase = 'midiendo'; setEstado(`Estocadas: 0 de ${U.total}`, 'ok')
        }
        return
      }
      if (d.fase !== 'midiendo') return
      const m = medir(), b = d.base, baja = (m.cadY - b.cadY) / b.pierna
      if (baja > U.abajo && visible(25, 26)) {
        const adelante = pose[26].y < pose[25].y ? 'D' : 'I'
        d.ultLado = adelante
        const x = d.mx[adelante]
        x.valgo = Math.max(x.valgo, valgoDe(adelante, b.pierna))
        x.incl = Math.max(x.incl, Math.abs(m.incl - b.incl))
        x.rot = Math.max(x.rot, (b.hombros - m.hombros) / Math.max(b.hombros, 0.01))
      }
      if (!d.abajo && baja > U.abajo) d.abajo = true
      if (d.abajo && baja < U.arriba) {
        d.abajo = false; d.reps++; if (d.ultLado) d.cuenta[d.ultLado]++
        avisarConteo(d.reps); setEstado(`Estocadas: ${d.reps} de ${U.total} (D ${d.cuenta.D} · I ${d.cuenta.I})`, 'ok')
        if (d.reps >= U.total) d.cerrar()
      }
      setBig(`${d.reps} / ${U.total}`)
    }
    d.cerrar = () => {
      if (d.fase !== 'midiendo') return
      d.fase = 'quieto'; beep(900, 400); decir('Listo. Terminamos.')
      d.res = {}; d.sug = {}; d.med = {}
      ;['D', 'I'].forEach(L => { const x = d.mx[L]; if (!d.cuenta[L]) return
        d.res[L] = { alineacion: x.valgo > U.valgo ? 'NO' : 'SI', core: x.incl > U.inclinacion || x.rot > U.rotacion ? 'NO' : 'SI' }
        d.sug[L] = { ...d.res[L] }
        d.med[L] = { rodilla_medial: +x.valgo.toFixed(3), tronco_inclinacion_grados: +x.incl.toFixed(1), tronco_rotacion: +x.rot.toFixed(3), estocadas: d.cuenta[L] } })
      setEstado('Terminado. Revisá la planilla.', 'ok'); pintar()
    }
    d.terminar = () => d.cerrar()
    const pintar = () => {
      const lados = ['D', 'I'].filter(L => d.res && d.res[L])
      const h = []
      lados.forEach(L => { if (d.res[L].alineacion === 'NO') h.push(`Pierde la alineación pie-rodilla-cadera (${L} adelante)`); if (d.res[L].core === 'NO') h.push(`Pierde el control de tronco (${L} adelante)`) })
      const sel = (L, k) => `<select data-l="${L}" data-k="${k}">${['SI', 'NO'].map(o => `<option ${d.res[L][k] === o ? 'selected' : ''}>${o}</option>`).join('')}</select>${d.sug && d.sug[L] && d.sug[L][k] !== d.res[L][k] ? '<span class="sug">(cámara: ' + d.sug[L][k] + ')</span>' : ''}`
      const html = `
        <div class="val">${h.length} <span style="font-size:16px">falla${h.length === 1 ? '' : 's'}</span></div>
        <div class="interp ${h.length ? 'c-warn' : 'c-ok'}">${h.length ? h.map(esc).join(' · ') : 'Buen control'}</div>
        ${lados.length ? `<table class="crit"><tr><th>Estocada con cambio</th>${lados.map(L => `<th>${L === 'D' ? 'Derecha' : 'Izquierda'} adelante</th>`).join('')}</tr>
          <tr><td>Alinea pie-rodilla-cadera</td>${lados.map(L => `<td>${sel(L, 'alineacion')}</td>`).join('')}</tr>
          <tr><td>Controla el tronco (no se inclina ni rota)</td>${lados.map(L => `<td>${sel(L, 'core')}</td>`).join('')}</tr></table>` : '<div class="nota c-warn">No se registraron estocadas: probá de nuevo o cargala a ojo.</div>'}
        <textarea class="obs" id="estObs" placeholder="Observaciones">${esc(d.obs)}</textarea>`
      mostrarResultado(html, `Estocada con cambio: ${h.length ? h.join('; ') : 'buen control'}${d.obs ? '. Obs: ' + d.obs : ''}`,
        { valor: h.length, unidad: 'fallas', detalle: { lados: d.res, sugerido_camara: d.sug, medidas: d.med || null, hallazgos_txt: h, observaciones: d.obs || null } })
      document.querySelectorAll('.crit select').forEach(sl => sl.onchange = () => { d.res[sl.dataset.l][sl.dataset.k] = sl.value; pintar() })
      $('estObs').onchange = (e) => { d.obs = e.target.value; pintar() }
    }
    d.manual = () => { d.res = { D: { alineacion: 'SI', core: 'SI' }, I: { alineacion: 'SI', core: 'SI' } }; pintar() }
    return d
  },

  // ---------- SQUAT MONOPODAL ----------
  // Por pierna de apoyo, de frente. Mide contra la postura inicial (parado en una pierna):
  // pelvis (drop / elevación del lado libre), rodilla medial al pie y rotación de tronco
  // (el ancho de hombros se achica cuando el tronco rota). El sentido de la rotación y los
  // >90° de flexión los confirma el profesional.
  squatmono() {
    const U = { pelvis: 8, valgo: 0.06, rotacion: 0.15, abajo: 0.08, arriba: 0.03 }
    const PIERNAS = [{ lado: 'D', nombre: 'derecha', hip: 24, knee: 26, ank: 28, toe: 32, oHip: 23, hom: 12, oHom: 11 },
                     { lado: 'I', nombre: 'izquierda', hip: 23, knee: 25, ank: 27, toe: 31, oHip: 24, hom: 11, oHom: 12 }]
    const d = { idx: 0, fase: 'quieto', res: {}, sug: {}, med: {}, base: null, muestras: [], reps: 0, abajo: false, autoArmar: false, obs: '' }
    const prox = () => {
      if (d.idx < 2) setEstado(`Apoyo ${PIERNAS[d.idx].nombre.toUpperCase()}: parado en esa pierna, manos en la cintura${d.idx ? '. ' + (inicioAuto ? 'Arranca solo al quedar bien ubicado' : 'Tocá Empezar cuando esté listo') + '.' : ', y tocá Empezar.'}`)
      $('btnEmpezar').textContent = d.idx < 2 ? `Empezar · apoyo ${PIERNAS[d.idx].nombre}` : 'Empezar'
    }
    d.init = prox
    const medir = (P) => {
      const pierna = Math.max(dist(pose[P.hip], pose[P.ank]), 1)
      const dm = Math.sign(pose[P.oHip].x - pose[P.hip].x) || 1
      const anchoCad = Math.max(Math.abs(pose[23].x - pose[24].x), 1)
      return { pierna, cadY: pose[P.hip].y,
        pelvis: Math.atan2(pose[P.oHip].y - pose[P.hip].y, anchoCad) * 180 / Math.PI,   // + = el lado libre cae
        rod: ((pose[P.knee].x - pose[P.toe].x) * dm) / pierna,
        hombros: Math.abs(pose[11].x - pose[12].x) / Math.max(dist(mid(pose[11], pose[12]), mid(pose[23], pose[24])), 1),
        // profundidad: + = el hombro del lado LIBRE se adelanta (el tronco gira hacia la pierna de apoyo = "hacia adentro")
        giro: ((pose[P.hom].z ?? 0) - (pose[P.oHom].z ?? 0)) / Math.max(Math.abs(pose[11].x - pose[12].x), 1),
        // muslo: 0 = horizontal (90° de flexión); se mide cuánto le falta a la cadera para llegar a la altura de la rodilla
        kh: pose[P.knee].y - pose[P.hip].y, musloLargo: dist(pose[P.hip], pose[P.knee]) }
    }
    d.empezar = async () => {
      if (d.idx >= 2) return
      d.autoArmar = true; d.muestras = []; d.base = null; d.reps = 0; d.abajo = false
      d.mx = { drop: 0, elev: 0, valgo: 0, rot: 0, giroMax: 0, musloMin: 1 }
      d.fase = 'calibrando'; setEstado('Quieto en una pierna: midiendo la postura inicial…', 'warn')
    }
    d.frame = async () => {
      const P = PIERNAS[d.idx]; if (!P || !pose) return
      if (d.fase === 'calibrando') {
        if (!visible(23, 24, 11, 12, P.knee, P.ank)) return
        d.muestras.push(medir(P))
        if (d.muestras.length >= 14) {
          const m = d.muestras, av = f => m.reduce((s, x) => s + f(x), 0) / m.length
          d.base = { pierna: av(x => x.pierna), cadY: av(x => x.cadY), pelvis: av(x => x.pelvis), rod: av(x => x.rod), hombros: av(x => x.hombros), giro: av(x => x.giro), musloLargo: av(x => x.musloLargo) }
          d.fase = 'cuenta'; await cuentaRegresiva(); d.fase = 'midiendo'
          setEstado(`Apoyo ${P.nombre}: 0 de 5`, 'ok')
        }
        return
      }
      if (d.fase !== 'midiendo') return
      const m = medir(P), b = d.base, baja = (m.cadY - b.cadY) / b.pierna
      if (baja > U.abajo) {
        const dp = m.pelvis - b.pelvis
        d.mx.drop = Math.max(d.mx.drop, dp); d.mx.elev = Math.max(d.mx.elev, -dp)
        d.mx.valgo = Math.max(d.mx.valgo, m.rod - b.rod)
        d.mx.rot = Math.max(d.mx.rot, (b.hombros - m.hombros) / Math.max(b.hombros, 0.01))
        const g = m.giro - b.giro; if (Math.abs(g) > Math.abs(d.mx.giroMax)) d.mx.giroMax = g
        d.mx.musloMin = Math.min(d.mx.musloMin, m.kh / Math.max(b.musloLargo, 1))   // de frente el muslo se acorta: se usa el largo parado
      }
      if (!d.abajo && baja > U.abajo) d.abajo = true
      if (d.abajo && baja < U.arriba) { d.abajo = false; d.reps++; avisarConteo(d.reps); setEstado(`Apoyo ${P.nombre}: ${d.reps} de 5`, 'ok'); if (d.reps >= 5) d.cerrar() }
      setBig(`${d.reps} / 5`)
    }
    d.cerrar = () => {
      if (d.fase !== 'midiendo') return
      const P = PIERNAS[d.idx], mx = d.mx; d.fase = 'quieto'; beep(900, 400)
      const hayRot = mx.rot > U.rotacion || Math.abs(mx.giroMax) > 0.25
      const s = { drop: mx.drop > U.pelvis ? 'SI' : 'NO', elev: mx.elev > U.pelvis ? 'SI' : 'NO', valgo: mx.valgo > U.valgo ? 'SI' : 'NO',
        rot: !hayRot ? 'NO' : Math.abs(mx.giroMax) < 0.08 ? 'SI (elegir sentido)' : mx.giroMax > 0 ? 'HACIA ADENTRO' : 'HACIA AFUERA',
        mas90: mx.musloMin <= 0.12 ? 'SI' : 'NO' }
      d.res[P.lado] = { ...s }; d.sug[P.lado] = { ...s }
      d.med[P.lado] = { pelvis_drop_grados: +mx.drop.toFixed(1), pelvis_elev_grados: +mx.elev.toFixed(1), rodilla_medial: +mx.valgo.toFixed(3), rotacion_hombros: +mx.rot.toFixed(3), giro_tronco: +mx.giroMax.toFixed(3), muslo_al_fondo: +mx.musloMin.toFixed(2), reps: d.reps }
      d.idx++; guardarProgreso(d)
      if (d.idx < 2) { prox(); setEstado('Apoyo derecho listo ✓. Ahora apoyo IZQUIERDO: ' + (inicioAuto ? 'arranca solo cuando esté bien ubicado' : 'tocá Empezar cuando esté listo') + '.', 'ok')
        setTimeout(() => decir('Derecha lista. Ahora apoyo izquierdo.'), 900); setTimeout(() => { if (d.fase === 'quieto' && d.idx < 2) d.armado = true }, 4500) }
      else { d.autoArmar = false; decir('Listo. Terminamos.'); setEstado('Terminado. Revisá la planilla: todo se marcó solo, incluido el sentido de la rotación y si pasó los 90°.', 'ok'); $('btnEmpezar').textContent = 'Empezar'; pintar() }
    }
    d.terminar = () => d.cerrar()
    const FILAS = [['drop', 'Drop pélvico', ['NO', 'SI']], ['elev', 'Elevación pélvica', ['NO', 'SI']], ['valgo', 'Valgo de rodilla', ['NO', 'SI']],
                   ['rot', 'Rotación de tronco', ['NO', 'HACIA ADENTRO', 'HACIA AFUERA', 'SI (elegir sentido)']], ['mas90', 'Más de 90° de flexión', ['NO', 'SI']]]
    const comps = (L) => !d.res[L] ? [] : FILAS.filter(([k]) => k !== 'mas90' && d.res[L][k] !== 'NO').map(([k, n]) => k === 'rot' && d.res[L].rot.startsWith('HACIA') ? 'Rotación de tronco ' + d.res[L].rot.toLowerCase() : n)
    const musculos = () => {
      const sob = new Map(), poc = new Map(), add = (m, x, por) => { if (!m.has(x)) m.set(x, []); m.get(x).push(por) }
      ;['D', 'I'].forEach(L => { const r = d.res[L]; if (!r) return
        const otro = L === 'D' ? 'I' : 'D'
        const claves = []; if (r.valgo === 'SI') claves.push('valgo'); if (r.drop === 'SI') claves.push('drop'); if (r.elev === 'SI') claves.push('elev')
        if (r.rot === 'HACIA ADENTRO') claves.push('rot_adentro'); if (r.rot === 'HACIA AFUERA') claves.push('rot_afuera')
        claves.forEach(k => { const M = MUSC_SQM[k], por = `${M.n} · apoyo ${L}`
          M.apoyo.sob.forEach(x => add(sob, `${x} (${L})`, por)); M.apoyo.poc.forEach(x => add(poc, `${x} (${L})`, por))
          if (M.otro) { M.otro.sob.forEach(x => add(sob, `${x} (${otro})`, por)); M.otro.poc.forEach(x => add(poc, `${x} (${otro})`, por)) } }) })
      return { sob, poc }
    }
    const pintar = () => {
      const lados = ['D', 'I'].filter(L => d.res[L])
      const nD = comps('D').length, nI = comps('I').length, peor = Math.max(...lados.map(L => comps(L).length))
      const { sob, poc } = musculos()
      const lista = (m) => [...m].map(([x, por]) => `${esc(x)} <small>· ${esc([...new Set(por)].join(', '))}</small>`).join('<br>')
      const rotSinSentido = lados.some(L => d.res[L].rot === 'SI (elegir sentido)')
      const html = `
        <div class="val">${lados.map(L => `${L} ${comps(L).length}`).join(' · ')} <span style="font-size:16px">compensaciones</span></div>
        ${lados.map(L => `<div class="interp ${comps(L).length ? 'c-warn' : 'c-ok'}">Apoyo ${L === 'D' ? 'derecho' : 'izquierdo'}: ${comps(L).length ? comps(L).join(' · ') : 'sin compensaciones'}</div>`).join('')}
        ${rotSinSentido ? '<div class="nota c-warn">La cámara vio rotación de tronco: elegí el sentido para que salgan sus músculos.</div>' : ''}
        <table class="crit"><tr><th>Squat monopodal</th>${lados.map(L => `<th>${L === 'D' ? 'Derecha' : 'Izquierda'}</th>`).join('')}</tr>
          ${FILAS.map(([k, n, ops]) => `<tr><td>${n}</td>${lados.map(L => `<td><select data-l="${L}" data-k="${k}">${ops.map(o => `<option ${d.res[L][k] === o ? 'selected' : ''}>${o}</option>`).join('')}</select>
            ${d.sug[L] && d.sug[L][k] !== d.res[L][k] && k !== 'mas90' ? '<span class="sug">(cámara: ' + d.sug[L][k] + ')</span>' : ''}</td>`).join('')}</tr>`).join('')}</table>
        <textarea class="obs" id="sqmObs" placeholder="Observaciones">${esc(d.obs)}</textarea>
        ${sob.size || poc.size ? `<div class="musc"><div class="sob"><b>MÚSCULOS SOBREACTIVOS</b>${lista(sob) || '—'}</div><div class="poc"><b>MÚSCULOS POCO ACTIVOS</b>${lista(poc) || '—'}</div></div>` : ''}`
      const txt = `Squat monopodal: ${lados.map(L => `apoyo ${L}: ${comps(L).length ? comps(L).join(', ') : 'sin compensaciones'}`).join(' · ')}${d.obs ? '. Obs: ' + d.obs : ''}`
      mostrarResultado(html, txt, { valor: peor, unidad: 'compensaciones (peor lado)', detalle: {
        hallazgos: d.res, sugerido_camara: d.sug, medidas: d.med, total_D: d.res.D ? nD : null, total_I: d.res.I ? nI : null,
        hallazgos_txt: lados.flatMap(L => comps(L).map(c => `${c} (${L})`)),
        musculos_sobreactivos: [...sob.keys()], musculos_poco_activos: [...poc.keys()], observaciones: d.obs || null } })
      document.querySelectorAll('.crit select').forEach(sel => sel.onchange = () => { d.res[sel.dataset.l][sel.dataset.k] = sel.value; pintar() })
      $('sqmObs').onchange = (e) => { d.obs = e.target.value; pintar() }
    }
    d.manual = () => { ['D', 'I'].forEach(L => { d.res[L] = { drop: 'NO', elev: 'NO', valgo: 'NO', rot: 'NO', mas90: 'NO' } }); d.idx = 2; pintar() }
    return d
  },

  // ---------- FORWARD STEP DOWN (Park et al. 2013) ----------
  // Por pierna: el sistema mide la postura inicial (línea de base) parado en el cajón,
  // cuenta 5 bajadas del pie libre y registra el peor valor de cada criterio durante la serie.
  // Los cortes son PUNTO DE PARTIDA: se ajustan con pacientes reales (constantes FSD).
  fsd() {
    const FSD = {
      brazos: 0.30,        // muñeca se aleja de la cintura > 30% del largo del tronco
      tronco: 10,          // inclinación lateral del tronco > 10° respecto de la base
      pelvis: 8,           // la línea de caderas se inclina > 8° respecto de la base
      rodilla1: 0.06,      // rodilla medial al 2.º dedo (en largos de pierna)
      rodilla2: 0.15,      // rodilla medial al borde interno del pie
      apoyo: 0.06,         // el pie de apoyo se mueve > 6% del largo de pierna
      // conteo de bajadas (en largos de pierna; un cajón de 20 cm ≈ 0,23)
      bajaAbajo: 0.15, bajaArriba: 0.05, bajaRodilla: 0.10,
    }
    const PIERNAS = [{ lado: 'der', nombre: 'derecha', hip: L.hipR, knee: L.kneeR, ank: L.ankR, heel: L.heelR, toe: L.toeR, wr: 16, oHip: L.hipL, oHeel: L.heelL },
                     { lado: 'izq', nombre: 'izquierda', hip: L.hipL, knee: L.kneeL, ank: L.ankL, heel: L.heelL, toe: L.toeL, wr: 15, oHip: L.hipR, oHeel: L.heelR }]
    const d = { idx: 0, fase: 'quieto', res: {}, base: null, muestras: [], max: null, reps: 0, abajo: false }
    const prox = () => {
      if (d.idx < 2) setEstado(`Pierna de apoyo: ${PIERNAS[d.idx].nombre.toUpperCase()}. Parado en el cajón, manos en la cintura, y tocá Empezar.`)
      $('btnEmpezar').textContent = d.idx < 2 ? `Empezar · apoyo ${PIERNAS[d.idx].nombre}` : 'Empezar'
    }
    d.init = prox
    const ang = (a, b) => Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI
    const difAng = (a, b) => Math.abs(((a - b + 540) % 360) - 180)
    const medir = (P) => {
      const cad = mid(pose[L.hipL], pose[L.hipR]), hom = mid(pose[11], pose[12])
      const torso = Math.max(dist(cad, hom), 1)
      const pierna = Math.max(dist(pose[P.hip], pose[P.ank]), 1)
      const dirMed = Math.sign(pose[P.oHip].x - pose[P.hip].x) || 1      // hacia la línea media
      return {
        pelvis: ang(pose[L.hipR], pose[L.hipL]),
        tronco: Math.atan2(hom.x - cad.x, cad.y - hom.y) * 180 / Math.PI,
        munecas: [mid(pose[15], pose[15]), mid(pose[16], pose[16])],
        torso, pierna,
        rodilla: ((pose[P.knee].x - pose[P.toe].x) * dirMed) / pierna,
        apoyo: { x: pose[P.ank].x, y: pose[P.ank].y },
        talonLibre: pose[P.oHeel].y, talonApoyo: pose[P.heel].y,
      }
    }
    d.empezar = async () => {
      if (d.idx >= 2) return
      d.muestras = []; d.base = null; d.reps = 0; d.abajo = false
      d.max = { brazos: 0, tronco: 0, pelvis: 0, rodilla: -1, apoyo: 0 }
      d.fase = 'calibrando'; setEstado('Quieto en el cajón: midiendo la postura inicial…', 'warn')
    }
    d.frame = async (now) => {
      const P = PIERNAS[d.idx]; if (!P || !pose) return
      if (d.fase === 'calibrando') {
        if (!visible(L.hipL, L.hipR, 11, 12, P.knee, P.ank)) return
        d.muestras.push(medir(P))
        if (d.muestras.length >= 16) {
          const m = d.muestras, n = m.length, av = (f) => m.reduce((s, x) => s + f(x), 0) / n
          d.base = { pelvis: av(x => x.pelvis), tronco: av(x => x.tronco),
            munecas: [0, 1].map(i => ({ x: av(x => x.munecas[i].x), y: av(x => x.munecas[i].y) })),
            apoyo: { x: av(x => x.apoyo.x), y: av(x => x.apoyo.y) }, pierna: av(x => x.pierna), torso: av(x => x.torso),
            talon: av(x => x.talonApoyo) }
          d.fase = 'cuenta'; await cuentaRegresiva(); d.fase = 'midiendo'
          setEstado(`Bajadas con apoyo ${P.nombre}: 0 de 5`, 'ok')
        }
        return
      }
      if (d.fase !== 'midiendo') return
      const m = medir(P), b = d.base
      d.max.pelvis = Math.max(d.max.pelvis, difAng(m.pelvis, b.pelvis))
      d.max.tronco = Math.max(d.max.tronco, difAng(m.tronco, b.tronco))
      d.max.brazos = Math.max(d.max.brazos, ...[0, 1].map(i => dist(m.munecas[i], b.munecas[i]) / b.torso))
      d.max.apoyo = Math.max(d.max.apoyo, dist(m.apoyo, b.apoyo) / b.pierna)
      // la rodilla se evalúa en la bajada (cuando el pie libre está abajo)
      const baja = (m.talonLibre - b.talon) / b.pierna
      if (baja > FSD.bajaRodilla) d.max.rodilla = Math.max(d.max.rodilla, m.rodilla)
      // repeticiones: el talón libre baja por debajo del pie de apoyo (umbral bajaAbajo) y vuelve a subir
      if (!d.abajo && baja > FSD.bajaAbajo) d.abajo = true
      if (d.abajo && baja < FSD.bajaArriba) {
        d.abajo = false; d.reps++; avisarConteo(d.reps)
        setEstado(`Bajadas con apoyo ${P.nombre}: ${d.reps} de 5`, 'ok')
        if (d.reps >= 5) d.cerrarPierna()
      }
      setBig(`${d.reps} / 5`)
    }
    d.cerrarPierna = () => {
      if (d.fase !== 'midiendo') return
      const P = PIERNAS[d.idx], mx = d.max
      d.fase = 'quieto'; beep(900, 400)
      d.res[P.lado] = {
        reps: d.reps,
        sug: {
          brazos: mx.brazos > FSD.brazos ? 1 : 0,
          tronco: mx.tronco > FSD.tronco ? 1 : 0,
          pelvis: mx.pelvis > FSD.pelvis ? 1 : 0,
          rodilla: mx.rodilla > FSD.rodilla2 ? 2 : mx.rodilla > FSD.rodilla1 ? 1 : 0,
          apoyo: mx.apoyo > FSD.apoyo ? 1 : 0,
        },
        medidas: { brazos: +mx.brazos.toFixed(3), tronco_grados: +mx.tronco.toFixed(1), pelvis_grados: +mx.pelvis.toFixed(1), rodilla: +mx.rodilla.toFixed(3), apoyo: +mx.apoyo.toFixed(3) }
      }
      d.res[P.lado].puntos = { ...d.res[P.lado].sug }
      d.idx++; guardarProgreso(d)
      if (d.idx < 2) {
        setEstado(`Apoyo ${P.nombre} listo (${d.reps} bajadas). Ahora la otra pierna.`, 'ok'); prox()
        if (manosLibres) {
          setTimeout(() => decir('Ahora apoyo pierna izquierda. Ubicate.'), 1200)
          setTimeout(() => { if (d.fase === 'quieto' && d.idx < 2) d.armado = true }, 6000)
        }
      } else d.final()
    }
    d.terminar = () => d.cerrarPierna()

    const CRIT = [['brazos', 'Estrategia de brazos', [0, 1]], ['tronco', 'Movimiento de tronco', [0, 1]], ['pelvis', 'Plano de la pelvis', [0, 1]],
                  ['rodilla', 'Posición de la rodilla', [0, 1, 2]], ['apoyo', 'Postura unipodal quieta', [0, 1]]]
    const clasif = (t) => t <= 1 ? ['c-ok', 'Buena calidad'] : t <= 3 ? ['c-warn', 'Moderada calidad'] : ['c-bad', 'Calidad pobre']
    const total = (lado) => d.res[lado] ? CRIT.reduce((s, [k]) => s + d.res[lado].puntos[k], 0) : null
    d.final = () => {
      setEstado('Terminado. Revisá el puntaje sugerido y corregilo si hace falta.', 'ok'); $('btnEmpezar').textContent = 'Empezar'
      pintar()
    }
    const pintar = () => {
      const lados = ['der', 'izq'].filter(l => d.res[l])
      const celda = (l, k, ops) => `<select data-l="${l}" data-k="${k}">${ops.map(o => `<option value="${o}" ${d.res[l].puntos[k] === o ? 'selected' : ''}>${o}</option>`).join('')}</select>
        ${d.res[l].puntos[k] !== d.res[l].sug[k] ? '<span class="sug">(cámara: ' + d.res[l].sug[k] + ')</span>' : ''}`
      const tD = total('der'), tI = total('izq')
      const peor = Math.max(...lados.map(total))
      const texto = lados.map(l => `${l === 'der' ? 'Der' : 'Izq'} ${total(l)}/6 (${clasif(total(l))[1].toLowerCase()})`).join(' · ')
      const html = `
        <div class="val">${lados.map(l => `${l === 'der' ? 'D' : 'I'} ${total(l)}`).join(' · ')} <span style="font-size:16px">/ 6</span></div>
        ${lados.map(l => `<div class="interp ${clasif(total(l))[0]}">Apoyo ${l === 'der' ? 'derecho' : 'izquierdo'}: ${clasif(total(l))[1]}</div>`).join('')}
        <table class="crit"><tr><th>Criterio</th>${lados.map(l => `<th>${l === 'der' ? 'Derecha' : 'Izquierda'}</th>`).join('')}</tr>
          ${CRIT.map(([k, n, ops]) => `<tr><td>${n}</td>${lados.map(l => `<td>${celda(l, k, ops)}</td>`).join('')}</tr>`).join('')}
          <tr class="tot"><td>Total</td>${lados.map(l => `<td>${total(l)} / 6</td>`).join('')}</tr></table>
        <div class="nota">Mayor puntaje = peor calidad. Se guarda la pierna con peor puntaje como valor principal y el detalle de las dos.</div>`
      mostrarResultado(html, `Forward Step Down: ${texto}`, {
        valor: peor, unidad: 'puntos',
        detalle: { altura_cajon_cm: parseFloat(($('altCajon') || {}).value) || null, der: d.res.der || null, izq: d.res.izq || null, total_der: tD, total_izq: tI }
      })
      document.querySelectorAll('.crit select').forEach(sel => sel.onchange = () => { d.res[sel.dataset.l].puntos[sel.dataset.k] = +sel.value; pintar() })
    }
    return d
  },

  // ---------- EQUILIBRIO SPPB ----------
  equilibrio() {
    const POST = ['Pies juntos', 'Semi-tándem', 'Tándem']
    const d = { idx: 0, fase: 'quieto', ref: null, refMuestras: [], t0: 0, seg: [null, null, null], movidos: 0 }
    const prox = () => {
      if (d.idx < 3) setEstado(`Postura ${d.idx + 1} de 3: ${POST[d.idx]}. Ubicalo, soltalo y tocá Empezar.`)
      $('btnEmpezar').textContent = d.idx < 3 ? `Empezar · ${POST[d.idx]}` : 'Empezar'
    }
    d.init = prox
    d.empezar = async () => {
      if (d.idx >= 3) return
      d.fase = 'cuenta'; await cuentaRegresiva(); d.t0 = performance.now(); d.refMuestras = []; d.ref = null; d.movidos = 0; d.fase = 'midiendo'
      setEstado(`Midiendo ${POST[d.idx]}…`, 'ok')
    }
    const pies = () => [L.ankL, L.ankR, L.toeL, L.toeR].map(i => ({ x: pose[i].x, y: pose[i].y }))
    d.frame = (now) => {
      if (d.fase !== 'midiendo') return
      const t = (now - d.t0) / 1000
      setBig(fmt(Math.min(t, 10), 1) + ' s')
      if (pose && visible(L.ankL, L.ankR)) {
        if (!d.ref) { d.refMuestras.push(pies()); if (d.refMuestras.length >= 12) d.ref = d.refMuestras[0].map((_, i) => ({ x: d.refMuestras.reduce((s, m) => s + m[i].x, 0) / 12, y: d.refMuestras.reduce((s, m) => s + m[i].y, 0) / 12 })) }
        else {
          const umbral = (legLen() || 300) * 0.07
          const mov = Math.max(...pies().map((p, i) => dist(p, d.ref[i])))
          d.movidos = mov > umbral ? d.movidos + 1 : 0
          if (d.movidos >= 4) { d.cortar(t, 'movió los pies'); return }
        }
      }
      if (t >= 10) d.cortar(10, null)
    }
    d.cortar = (t, motivo) => {
      if (d.fase !== 'midiendo') return
      d.fase = 'quieto'
      if (t == null) t = (performance.now() - d.t0) / 1000
      t = Math.min(t, 10); d.seg[d.idx] = t
      beep(motivo ? 400 : 1000, 400)
      const completa = t >= 10
      setBig(fmt(t, 1) + ' s')
      if (!completa && d.idx < 2) { for (let k = d.idx + 1; k < 3; k++) d.seg[k] = 0; d.idx = 3 }
      else d.idx++
      if (d.idx >= 3) d.final()
      else {
        setEstado(`${POST[d.idx - 1]}: ${fmt(t, 1)} s ${motivo ? '(' + motivo + ')' : '✓'}. Seguimos.`, 'ok'); prox()
        if (manosLibres) {
          setTimeout(() => decir(`Siguiente: ${POST[d.idx]}. Ubicate.`), 1200)
          setTimeout(() => { if (d.fase === 'quieto' && d.idx < 3) d.armado = true }, 6000)
        }
      }
    }
    d.terminar = () => d.cortar(null, 'se apoyó / cortado a mano')
    d.final = () => {
      const [pj, st, td] = d.seg
      const p1 = pj >= 10 ? 1 : 0, p2 = st >= 10 ? 1 : 0, p3 = td >= 10 ? 2 : td >= 3 ? 1 : 0
      const tot = p1 + p2 + p3
      setEstado('Equilibrio terminado', 'ok'); $('btnEmpezar').textContent = 'Empezar'
      mostrarResultado(`
        <div class="val">${tot} / 4 <span style="font-size:16px">puntos</span></div>
        <table>
          <tr><td>Pies juntos</td><td>${fmt(pj, 1)} s · ${p1} pt</td></tr>
          <tr><td>Semi-tándem</td><td>${fmt(st, 1)} s · ${p2} pt</td></tr>
          <tr><td>Tándem</td><td>${fmt(td, 1)} s · ${p3} pt</td></tr>
        </table>
        <div class="nota">Cargá los segundos en el bloque Equilibrio del SPPB de VALD.</div>`,
        `Equilibrio SPPB: ${tot}/4 · pies juntos ${fmt(pj,1)} s · semi-tándem ${fmt(st,1)} s · tándem ${fmt(td,1)} s`,
        { valor: tot, unidad: 'puntos', detalle: { pies_juntos_s: +pj.toFixed(2), semitandem_s: +st.toFixed(2), tandem_s: +td.toFixed(2), puntos: [p1, p2, p3] } })
    }
    return d
  },

  // ---------- MARCHA 4 METROS ----------
  marcha4() {
    const d = { fase: 'lineas', lineas: [], intentos: [], tIni: null, prevX: null, prevT: null, dir: 0, t0: 0 }
    d.init = () => setEstado('Tocá en la imagen la línea de INICIO (el 1,5 de la alfombra).', 'warn')
    d.tap = (x) => {
      if (d.fase !== 'lineas') return
      d.lineas.push(x)
      if (d.lineas.length === 1) setEstado('Ahora tocá la línea de LLEGADA (el 5,5).', 'warn')
      else { d.fase = 'quieto'; setEstado('Líneas listas. Paciente en el 0 y tocá Empezar.', 'ok'); $('btnLineas').disabled = false }
    }
    d.relineas = () => { d.lineas = []; d.fase = 'lineas'; d.init() }
    d.empezar = async () => {
      if (d.lineas.length < 2) { d.init(); return }
      d.fase = 'cuenta'; await cuentaRegresiva(); setBig('')
      d.tIni = null; d.prevX = null; d.t0 = performance.now(); d.fase = 'esperando'
      setEstado('Caminá a paso habitual…', 'ok')
    }
    const cruce = (x0, x1, linea) => (x0 - linea) * (x1 - linea) <= 0 && x0 !== x1
    d.frame = (now) => {
      if (d.fase === 'esperando' || d.fase === 'corriendo') {
        if (d.tIni != null) setBig(fmt((now - d.tIni) / 1000, 2) + ' s')
        if (!pose || !visible(L.hipL, L.hipR)) { d.prevX = null; return }
        const x = mid(pose[L.hipL], pose[L.hipR]).x
        if (d.prevX != null) {
          const interp = (linea) => d.prevT + (now - d.prevT) * ((linea - d.prevX) / (x - d.prevX))
          const [a, b] = d.lineas
          if (d.fase === 'esperando') {
            if (cruce(d.prevX, x, a)) { d.tIni = interp(a); d.fin = b; d.fase = 'corriendo'; beep(1200, 60) }
            else if (cruce(d.prevX, x, b)) { d.tIni = interp(b); d.fin = a; d.fase = 'corriendo'; beep(1200, 60) }
          } else if (cruce(d.prevX, x, d.fin)) {
            const seg = (interp(d.fin) - d.tIni) / 1000
            d.registrar(seg); return
          }
        }
        d.prevX = x; d.prevT = now
        if ((now - d.t0) / 1000 > 60) { setEstado('Pasó un minuto sin completar el recorrido. Revisá que se vean las dos líneas.', 'err'); d.fase = 'quieto' }
      }
    }
    d.registrar = (seg) => {
      d.fase = 'quieto'; beep(900, 400)
      const metros = parseFloat(($('dist4') || {}).value || '4') || 4
      d.intentos.push({ seg, vel: metros / seg })
      setBig(fmt(seg, 2) + ' s')
      setEstado(`Intento ${d.intentos.length}: ${fmt(seg, 2)} s. ${d.intentos.length < 2 ? 'Hacé el segundo intento.' : 'Listo, me quedo con el mejor.'}`, 'ok')
      const best = d.intentos.reduce((b, x) => x.seg < b.seg ? x : b)
      const v = best.vel
      const esSprint = actual && actual.id === 'sprint10', esRapida = actual && actual.id === 'marcha4r'
      const interp = esSprint ? ['c-ok', `${fmt(v * 3.6, 1)} km/h`] : esRapida ? ['c-ok', 'Paso rápido: comparalo con su paso habitual (reserva de velocidad)']
        : v < 0.8 ? ['c-bad', 'Fragilidad o riesgo de deterioro funcional'] : v <= 1.0 ? ['c-warn', 'Movilidad moderada, posibles limitaciones'] : ['c-ok', 'Adecuada para mantener la independencia funcional']
      mostrarResultado(`
        <div class="val">${fmt(v, 2)} <span style="font-size:16px">m/s</span></div>
        <div class="interp ${interp[0]}">${interp[1]}</div>
        <table>${d.intentos.map((x, i) => `<tr class="${x === best ? 'best' : ''}"><td>Intento ${i + 1}</td><td>${fmt(x.seg, 2)} s · ${fmt(x.vel, 2)} m/s</td></tr>`).join('')}</table>
        ${esSprint || esRapida ? '' : `<div class="nota">En el Gait Speed de VALD cargá el mejor tiempo: <b>${fmt(best.seg, 2)} s</b>.</div>`}`,
        `${esSprint ? 'Sprint ' + metros + ' m' : esRapida ? 'Marcha rápida ' + metros + ' m' : 'Marcha 4 m'}: ${fmt(best.seg, 2)} s · ${fmt(v, 2)} m/s (mejor de ${d.intentos.length})`,
        { valor: +best.seg.toFixed(2), unidad: 's', detalle: { velocidad_ms: +v.toFixed(2), distancia_m: metros, intentos_s: d.intentos.map(x => +x.seg.toFixed(2)) } })
    }
    d.terminar = () => { if (d.fase === 'corriendo') d.registrar((performance.now() - d.tIni) / 1000); else d.fase = 'quieto' }
    d.dibujar = (ctx, s) => {
      ctx.lineWidth = 4 * s
      d.lineas.forEach((x, i) => {
        ctx.strokeStyle = i === 0 ? '#22c55e' : '#ef4444'
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, ctx.canvas.height); ctx.stroke()
        ctx.fillStyle = ctx.strokeStyle; ctx.font = `bold ${22 * s}px Manrope`; ctx.fillText(i === 0 ? 'INICIO' : 'LLEGADA', x + 6 * s, 30 * s)
      })
    }
    return d
  },

  // ---------- TUG ----------
  tug() {
    const d = { fase: 'quieto', base: null, muestras: [], t0: 0, tParado: null, sentado: 0, xBase: null, seParo: false }
    d.empezar = async () => {
      d.muestras = []; d.base = null; d.seParo = false; d.tParado = null; d.sentado = 0
      d.fase = 'calibrando'; setEstado('Sentado y quieto: midiendo la posición inicial…', 'warn')
    }
    d.frame = async (now) => {
      if (d.fase === 'calibrando') {
        if (!pose || !(visible(L.hipL) || visible(L.hipR))) return
        const c = mid(pose[L.hipL], pose[L.hipR]); d.muestras.push(c)
        if (d.muestras.length >= 16) {
          d.base = d.muestras.reduce((s, m) => s + m.y, 0) / d.muestras.length
          d.xBase = d.muestras.reduce((s, m) => s + m.x, 0) / d.muestras.length
          d.escala = legLen() || 300
          d.fase = 'cuenta'; await cuentaRegresiva(); d.t0 = performance.now(); d.fase = 'midiendo'
          setEstado('Midiendo… levantate, caminá, girá, volvé y sentate', 'ok')
        }
        return
      }
      if (d.fase !== 'midiendo') return
      const t = (now - d.t0) / 1000
      setBig(fmt(t, 1) + ' s')
      if (!pose) return
      const c = mid(pose[L.hipL], pose[L.hipR])
      const subio = d.base - c.y
      if (!d.seParo && subio > d.escala * 0.18) { d.seParo = true; d.tParado = t }
      // vuelta: ya se paró, se alejó y regresó, y la cadera volvió a la altura de sentado
      if (d.seParo && t > 2.5 && Math.abs(c.x - d.xBase) < d.escala * 0.35 && subio < d.escala * 0.06) {
        if (!d.sentado) d.tSentado = t
        d.sentado++
        if (d.sentado >= 8) d.registrar(d.tSentado)
      } else d.sentado = 0
      if (t > 90) { setEstado('Pasaron 90 s. Si ya se sentó, tocá Detener.', 'err') }
    }
    d.registrar = (t) => {
      d.fase = 'fin'; beep(900, 500); setBig(fmt(t, 2) + ' s'); setEstado('Terminado', 'ok')
      const r = t < 10 ? ['c-ok', 'Movilidad normal, independiente'] : t < 13.5 ? ['c-ok', 'Funcional, mayormente independiente'] : t < 20 ? ['c-warn', 'Riesgo aumentado de caídas'] : t < 30 ? ['c-bad', 'Movilidad reducida, limitaciones funcionales'] : ['c-bad', 'Dependencia']
      mostrarResultado(`
        <div class="val">${fmt(t, 2)} <span style="font-size:16px">s</span></div>
        <div class="interp ${r[0]}">${r[1]}</div>
        <table><tr><td>Tiempo hasta quedar parado</td><td>${d.tParado != null ? fmt(d.tParado, 2) + ' s' : '—'}</td></tr></table>
        <div class="nota">Cargá el tiempo en el Timed Up &amp; Go de VALD.</div>`,
        `TUG: ${fmt(t, 2)} s (se paró a los ${fmt(d.tParado, 2)} s)`,
        { valor: +t.toFixed(2), unidad: 's', detalle: { tiempo_pararse_s: d.tParado != null ? +d.tParado.toFixed(2) : null } })
    }
    d.terminar = () => { if (d.fase === 'midiendo') d.registrar((performance.now() - d.t0) / 1000); else d.fase = 'quieto' }
    return d
  },
}

// PANTALLAS
// ============================================================
let textoCopiar = '', datosRes = null
// el próximo test: primero el que sugiere el árbol (si hay), después el siguiente de la ruta del motivo de consulta
function siguienteSugerido() {
  const arbol = [...document.querySelectorAll('#res [data-ir]:not([disabled])')].map(b => b.dataset.ir)[0]
  if (arbol) return { id: arbol, por: 'lo sugiere el resultado' }
  if (motivo && RUTAS[motivo]) {
    const pasos = pasosActivos(), i = pasos.findIndex(p => p.id === actual.id)
    const sig = pasos.slice(i + 1).find(p => !hechosHoy.tests.has(p.id) && TESTS.some(t => t.id === p.id))
    if (sig) return { id: sig.id, por: 'sigue en la ruta ' + RUTAS[motivo].n.replace(/^\S+\s/, ''), sec: sig.sec }
  }
  return null
}
const nombreTest = (id) => (TESTS.find(t => t.id === id) || {}).nombre || id
// al terminar: se suelta el video de arriba, se va al resultado y aparece el botón del próximo test
function irAlResultado() {
  const stg = document.querySelector('.layout > .stage'); if (stg) stg.classList.remove('fija')
  const tip = $('ubitip'); if (tip) tip.remove()
  setTimeout(() => { const r = $('res'); if (r) r.scrollIntoView({ behavior: 'smooth', block: 'start' }) }, 150)
  pintarSiguiente()
}
function pintarSiguiente() {
  const sig = siguienteSugerido(), mando = document.querySelector('#mando .btns')
  document.querySelectorAll('.btnSig').forEach(b => b.remove())
  const crear = (cls) => { const b = document.createElement('button'); b.className = 'b pri btnSig ' + (cls || '')
    b.innerHTML = sig ? `➡️ Siguiente: ${esc(nombreTest(sig.id))}` : '← Volver a todos los tests'
    b.onclick = () => conGuardado(() => { apagarCamara(); if (sig) renderTest(sig.id, sig.sec ? { sec: sig.sec } : {}); else renderCatalogo() }, true); return b }
  if (mando) mando.prepend(crear())
  const rb = $('res') && $('res').querySelector('.btns'); if (rb) { const b = crear(); b.style.marginLeft = 'auto'; rb.appendChild(b) }
  const ver = document.createElement('button'); ver.className = 'b btnSig'; ver.textContent = '📋 Ver resultado'
  ver.onclick = () => { const r = $('res'); if (r) r.scrollIntoView({ behavior: 'smooth', block: 'start' }) }
  if (mando) mando.appendChild(ver)
}
// ============================================================
// QUE NO SE PIERDA NINGÚN TEST: si hay un resultado sin guardar y se sale (volver, otro test, cerrar),
// pregunta "¿Guardar antes de salir?". El botón ➡️ Siguiente guarda solo, sin preguntar.
// ============================================================
let sinGuardar = false, tocado = false
document.addEventListener('input', (e) => { if (e.target.closest && e.target.closest('#app')) tocado = true }, true)
document.addEventListener('change', (e) => { if (e.target.closest && e.target.closest('#app')) tocado = true }, true)
document.addEventListener('click', (e) => { const b = e.target.closest && e.target.closest('#app button'); if (b && !/btnVolver|btnSig|btnCopiar/.test(b.id + ' ' + b.className)) tocado = true }, true)
window.addEventListener('beforeunload', (e) => { if (sinGuardar) { e.preventDefault(); e.returnValue = '' } })
// PROGRESO de los tests de varias vistas o piernas (sentadilla overhead, squat monopodal, puente, step down):
// cada vista o pierna terminada queda guardada en el iPad. Si se corta, al volver se sigue con la que falta.
const claveProg = (id) => 'testbiolab_prog_' + perfilKey() + '_' + new Date().toISOString().slice(0, 10) + '_' + (id || (actual && actual.id))
const CAMPOS_PROG = ['idx', 'f', 'sug', 'res', 'med', 'medFrente', 'medCostado', 'medPosterior', 'fotos', 'obs']
function guardarProgreso(d) {
  if (!paciente || (paciente.origen === 'PRUEBA' && !paciente.demo) || !actual) return
  const snap = {}; CAMPOS_PROG.forEach(k => { if (d[k] !== undefined) snap[k] = d[k] })
  try { localStorage.setItem(claveProg(), JSON.stringify(snap)) } catch (e) { delete snap.fotos; try { localStorage.setItem(claveProg(), JSON.stringify(snap)) } catch (e2) {} }
}

async function cargarUltima(testId) { return cargarEvolucion(testId) }

async function cargarEvolucion(testId) {
  const ult = $('ultima'), box = $('evo')
  if (!ult || !paciente || (paciente.origen === 'PRUEBA' && !paciente.demo)) return
  const { data, error } = await supabase.from('tests_biolab').select('valor, unidad, detalle, creado_en')
    // por DNI junta las tomas de la persona venga de PuntoBiO o de SARKMED; sin DNI, por su ficha
    .or(paciente.dni ? `paciente_dni.eq.${paciente.dni},and(origen.eq.${paciente.origen},paciente_id.eq.${paciente.id})` : `and(origen.eq.${paciente.origen},paciente_id.eq.${paciente.id})`)
    .eq('test', testId)
    .order('creado_en', { ascending: true })
  if (error) { ult.textContent = ''; return }
  const cfg = EVO[testId]
  const tomas = (data || []).map(r => ({ f: new Date(r.creado_en), v: cfg ? cfg.val(r) : +r.valor })).filter(t => t.v != null && !isNaN(t.v))
  if (!tomas.length) { ult.textContent = 'Primera vez que hace este test.'; box.style.display = 'none'; return }
  const u = tomas[tomas.length - 1]
  ult.textContent = `Última toma: ${fmt(u.v, cfg.dec)} ${cfg.unidad} · ${u.f.toLocaleDateString('es-AR')} · ${tomas.length} toma${tomas.length > 1 ? 's' : ''} en total`
  box.style.display = ''
  box.innerHTML = `<h3>📈 Evolución · ${esc(cfg.titulo)}</h3>
    <div class="sub2">${esc(paciente.nombre)} · ${cfg.mejor === 'menos' ? 'acá mejor es MENOS (tarda menos)' : 'acá mejor es MÁS'}</div>
    ${tendencia(tomas, cfg)}
    ${tomas.length > 1 ? curva(tomas, cfg) : '<div class="nota">Con la próxima toma se arma la curva.</div>'}
    ${tablaTomas(tomas, cfg)}`
}

function cambio(a, b, cfg) {      // de a → b: devuelve {cls, txt}
  const d = b - a
  const pct = a ? (d / Math.abs(a)) * 100 : 0
  const mejoro = cfg.mejor === 'menos' ? d < 0 : d > 0
  const igual = Math.abs(d) < Math.pow(10, -cfg.dec) / 2 || Math.abs(pct) < 1
  const signo = d > 0 ? '+' : ''
  return { cls: igual ? 'eq' : mejoro ? 'up' : 'down', txt: `${signo}${fmt(d, cfg.dec)} ${cfg.unidad}${a ? ` (${signo}${fmt(pct, 0)}%)` : ''}`, igual, mejoro }
}

function tendencia(tomas, cfg) {
  if (tomas.length < 2) return ''
  const c = cambio(tomas[0].v, tomas[tomas.length - 1].v, cfg)
  const desde = tomas[0].f.toLocaleDateString('es-AR')
  const pal = c.igual ? '➖ Se mantiene' : c.mejoro ? '⬆ Mejoró' : '⬇ Empeoró'
  return `<span class="tend ${c.cls}">${pal} ${c.igual ? '' : c.txt} desde la primera toma (${desde})</span>`
}

function tablaTomas(tomas, cfg) {
  const filas = tomas.map((t, i) => {
    const c = i ? cambio(tomas[i - 1].v, t.v, cfg) : null
    const col = c ? (c.igual ? '' : c.mejoro ? 'c-ok' : 'c-bad') : ''
    return `<tr><td>${t.f.toLocaleDateString('es-AR')}</td><td class="num">${fmt(t.v, cfg.dec)} ${cfg.unidad}</td>
      <td class="num ${col}">${c ? (c.igual ? '=' : (c.mejoro ? '▲ ' : '▼ ') + c.txt) : '—'}</td></tr>`
  }).reverse().join('')
  return `<table><tr><th>Fecha</th><th style="text-align:right">Valor</th><th style="text-align:right">vs. la anterior</th></tr>${filas}</table>`
}

function curva(tomas, cfg) {
  return curvaPro({ series: [{ nombre: 'Paciente', puntos: tomas.map(t => ({ f: t.f, v: t.v })) }], bandas: cfg.bandas || [],
    dec: cfg.dec ?? 1, unidad: cfg.unidad, mejor: cfg.mejor, min: cfg.min ?? null, max: cfg.max ?? null })
}

function itemDeToma(r) {
  const cfg = EVO[r.test] || { val: x => x.valor, dec: 1, unidad: r.unidad }, info = INFO[r.test] || { nombre: r.test }
  const v = cfg.val(r), lect = interpretar(r.test, v)

    valor: v != null && !isNaN(v) ? `${fmt(v, cfg.dec ?? 1)} ${cfg.unidad || r.unidad || ''}`.trim() : '—',
    lectura: lect ? lect[1] : '', nivel: lect ? lect[0] : '', hallazgos: hall, texto: r.texto || '',

function borradorConclusion(items) {

  const ok = items.filter(i => i.nivel === 'ok')
  let t = `Se realizaron ${items.length} prueba${items.length === 1 ? '' : 's'} de evaluación funcional.`
  if (ok.length) t += ` Dentro de lo esperable: ${ok.map(i => i.nombre).join(', ')}.`
  if (alterados.length) t += ` A trabajar: ${alterados.map(i => `${i.nombre} (${i.lectura.toLowerCase()})`).join('; ')}.`
  const musc = [...new Set(items.flatMap(i => i.musculos_poc))]
  if (musc.length) t += ` Grupos musculares a activar: ${musc.slice(0, 8).join(', ')}.`
  return t

// ============================================================

// Secciones de detalle de una toma: [{ titulo, filas: [[col1, col2, col3?, ...]], cabecera? }]

    const r = d.resultados || {}

    const post = []

    if (d.postura) Object.entries(d.postura).forEach(([k, x]) => post.push([`Foto · ${k.replace(/_/g, ' ')}`, fx(x)]))
    sec('Postura', post)
    const tar = PEL_TAREAS.filter(t => d.tareas && d.tareas[t.k]).map(t => { const x = d.tareas[t.k]
      return [t.n + (x.tiempo != null ? ` (${fmt(x.tiempo, 0)} s${x.corte ? ', cortó: ' + x.corte.toLowerCase() : ''})` : ''), vac(x.esc) ? '' : x.esc.toLowerCase(), x.pes === 'SI' ? 'sí' : x.pes === 'NO' ? 'no' : '', x.dol === 'SI' ? 'sí' : x.dol === 'NO' ? 'no' : '', vac(x.est) ? '' : x.est.toLowerCase()] })
    sec('Batería de provocación (en orden)', tar, ['Tarea', 'Escape', 'Pesadez', 'Dolor', 'Estrategia'])
    sec('Tacto (especialista)', [['Inspección', d.inspeccion], ['Tono en reposo', d.tono], ['Dolor a la palpación', d.palp_dolor], ['Oxford modificada', d.oxford], ['PERFECT', r.perfect],
      ['POP-Q anterior', d.popq_a], ['POP-Q apical', d.popq_ap], ['POP-Q posterior', d.popq_p], ['Observaciones', d.esp_obs]])
    if ((d.banderas || []).length) sec('Banderas de derivación', d.banderas.map(b => [b.replace('rf_', '').replace(/_/g, ' '), 'SÍ']))
  } else if (i.test === 'osteo') {
    if ((d.banderas || []).length) sec('Banderas rojas (derivar antes de tratar)', d.banderas.map(b => [b.replace('rf_', '').replace(/_/g, ' '), 'SÍ']))
    sec('Motivo de consulta', [['Motivo', d.motivo], ['Inicio', d.inicio], ['Empeora / alivia', d.agrava], ['Tipo de dolor', d.tipo_dolor]])
    sec('Mapa del dolor (0 a 10)', Object.entries(d.zonas || {}).sort((a, b) => b[1] - a[1]).map(([id, e]) => [(ZONAS.find(x => x[0] === id) || [, id])[1], `${e}/10`]))
    const r = d.resultados || {}, e = d.eips || {}
    sec('Tests', [['Flexión de pie (EIPS)', r.pie != null ? (Math.abs(r.pie) < 3 ? 'negativo' : `positivo ${r.pie > 0 ? 'derecho' : 'izquierdo'} (${Math.abs(r.pie)} mm)`) : null],
      ['Flexión sentado (EIPS)', r.sen != null ? (Math.abs(r.sen) < 3 ? 'negativo' : `positivo ${r.sen > 0 ? 'derecho' : 'izquierdo'} (${Math.abs(r.sen)} mm)`) : null],
      ['Gillet', d.gillet], ['Spring test (rigidez / dolor)', (d.spring || []).join(', ')]])
    sec('Hallazgos palpatorios (TART)', (d.tart || []).filter(t => (t.tart || []).length || t.desc).map(t => [t.reg, t.niv || '', vac(t.lado) ? '' : t.lado, (t.tart || []).join(' '), t.desc || '']),
      ['Región', 'Nivel', 'Lado', 'TARS', 'Descripción'])
    sec('Antes / después de la sesión', (r.cambios || []).map(c => [c.n, fx(c.antes), fx(c.despues), `${c.d > 0 ? '+' : ''}${fx(c.d)}${c.mejor ? ' (mejoró)' : ''}`]), ['Marcador', 'Antes', 'Después', 'Cambio'])
    sec('Técnicas y observaciones de la sesión', [['', d.obs]])
  } else if (i.test === 'ohs' && d.hallazgos) {
    sec('Sentadilla overhead', OHS_FILAS.map(([k, n]) => [n, d.hallazgos[k]]))
    sec('Músculos', [['Sobreactivos', (d.musculos_sobreactivos || []).join(', ')], ['Poco activos', (d.musculos_poco_activos || []).join(', ')]])
    sec('Próximos tests sugeridos', [['', (d.tests_sugeridos || []).map(t => CATALOGO_MAPA[t] || t).join(' · ')]])
  } else if (i.test === 'squatmono' && d.hallazgos) {
    sec('Squat monopodal', SQM_FILAS.map(([k, n]) => [n, d.hallazgos.D && d.hallazgos.D[k], d.hallazgos.I && d.hallazgos.I[k]]), ['', 'Apoyo D', 'Apoyo I'])
    sec('Músculos', [['Sobreactivos', (d.musculos_sobreactivos || []).join(', ')], ['Poco activos', (d.musculos_poco_activos || []).join(', ')]])
  } else if (i.test === 'fsd' && (d.der || d.izq)) {
    sec('Forward Step Down (puntos)', FSD_FILAS.map(([k, n]) => [n, d.der && d.der.puntos[k], d.izq && d.izq.puntos[k]]).concat([['TOTAL (0 a 6)', d.total_der, d.total_izq]]), ['Criterio', 'Derecha', 'Izquierda'])
  } else if (i.test === 'rom' && d.medidas) {
    sec('ROM', ROM_ITEMS.filter(it => d.medidas[it.k]).map(it => { const m = d.medidas[it.k]; return [it.n, fx(m.D), fx(m.I), m.lsi != null ? fmt(m.lsi, 0) + '%' : ''] }), ['Medida', 'D', 'I', 'LSI'])
  } else if (PLANILLAS[i.test] && d.campos) {
    const P = PLANILLAS[i.test]
    sec('Planilla', P.campos.map(c => c.lados ? [c.n, fx(d.campos[c.k + '_D']), fx(d.campos[c.k + '_I'])] : [c.n, fx(d.campos[c.k]), '']).filter(r => !vac(r[1]) || !vac(r[2])),
      P.campos.some(c => c.lados) ? ['', (P.ladosNombres || ['D', 'I'])[0], (P.ladosNombres || ['D', 'I'])[1]] : null)
    if (d.resultado && typeof d.resultado === 'object') sec('Cálculos', Object.entries(d.resultado).filter(([, x]) => typeof x !== 'object').map(([k, x]) => [k.replace(/_/g, ' '), fx(x)]))
  } else if (d.lados && typeof d.lados === 'object') {
    const ks = [...new Set(Object.values(d.lados).flatMap(o => Object.keys(o || {})))]
    sec('Por lado', ks.map(k => [k.replace(/_/g, ' '), fx(d.lados.D && d.lados.D[k]), fx(d.lados.I && d.lados.I[k])]), ['', 'Derecha', 'Izquierda'])
  }
  if (!['pelvico', 'osteo'].includes(i.test) && (d.hallazgos_txt || []).length) sec('Hallazgos', d.hallazgos_txt.map(h => ['•', h]))

  if (d.perfil) sec('Perfil al evaluar', [['Edad / actividad', `${d.perfil.edad ?? '—'} años · ${d.perfil.actividad}${d.perfil.ayuda ? ' · usa ayuda para caminar' : ''}`]])

}
async function fotosDeToma(i) {
  const f = (i.detalle && i.detalle.fotos) || []; if (!f.length) return []
  try {
    const { data } = await supabase.storage.from('tests-biolab').createSignedUrls(f.map(x => x.ruta), 600)
    const out = []
    for (let k = 0; k < f.length; k++) {
      const u = data && data[k] && data[k].signedUrl; if (!u) continue
      const blob = await (await fetch(u)).blob()
      const dataUrl = await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(blob) })
      const dim = await new Promise(res => { const im = new Image(); im.onload = () => res([im.naturalWidth, im.naturalHeight]); im.onerror = () => res([4, 3]); im.src = dataUrl })
      out.push({ vista: f[k].vista, dataUrl, w: dim[0], h: dim[1] })
    }
    return out
  } catch (e) { console.warn('fotos del PDF', e); return [] }
}
async function armarPdf(its, conclusion) {
  const { jsPDF } = window.jspdf
  const doc = new jsPDF({ unit: 'mm', format: 'a4' }), W = 210, M = 16, AN = W - 2 * M
  let y = 18
  const salto = (h) => { if (y + h > 280) { doc.addPage(); y = 18 } }
  const txt = (t, size = 10, estilo = 'normal', color = [15, 23, 42], x = M, ancho = AN) => { doc.setFont('helvetica', estilo); doc.setFontSize(size); doc.setTextColor(...color)
    const lineas = doc.splitTextToSize(limpiarPdf(t), ancho); salto(lineas.length * size * 0.42 + 1); doc.text(lineas, x, y); y += lineas.length * size * 0.42 + 1.4 }
  // tabla simple: columnas proporcionales, cada fila crece según el texto más largo
  const tabla = (filas, cabecera) => {
    const n = Math.max(...filas.map(f => f.length), cabecera ? cabecera.length : 0)
    const anchos = n === 2 ? [AN * 0.42, AN * 0.58] : n === 3 ? [AN * 0.46, AN * 0.27, AN * 0.27] : n === 4 ? [AN * 0.4, AN * 0.18, AN * 0.18, AN * 0.24] : Array(n).fill(AN / n)
    if (n === 5) anchos.splice(0, 5, AN * 0.36, AN * 0.14, AN * 0.12, AN * 0.12, AN * 0.26)
    const fila = (cells, negrita, fondo) => {
      doc.setFont('helvetica', negrita ? 'bold' : 'normal'); doc.setFontSize(8.8)
      const partes = cells.map((c, k) => doc.splitTextToSize(limpiarPdf(c), anchos[k] - 2))
      const h = Math.max(...partes.map(p => p.length)) * 3.7 + 1.6
      salto(h)
      if (fondo) { doc.setFillColor(241, 245, 249); doc.rect(M, y - 3.2, AN, h, 'F') }
      let x = M; partes.forEach((p, k) => { doc.setTextColor(negrita ? 51 : 15, negrita ? 65 : 23, negrita ? 85 : 42); doc.text(p, x + 1, y); x += anchos[k] })
      doc.setDrawColor(226, 232, 240); doc.line(M, y + h - 3.4, M + AN, y + h - 3.4); y += h
    }
    if (cabecera) fila(cabecera, true, true)
    filas.forEach(f => fila(f.concat(Array(n - f.length).fill('')), false, false))
    y += 1.5
  }
  doc.setFillColor(30, 159, 224); doc.rect(0, 0, W, 10, 'F')
  y = 18; txt('PuntoBiO · BiOLAB', 9, 'bold', [12, 123, 184]); y += 1
  txt('Informe de evaluación funcional', 18, 'bold')
  const fechas = [...new Set(its.map(i => i.fecha))].sort().map(f => new Date(f + 'T12:00:00').toLocaleDateString('es-AR'))
  txt(`Paciente: ${paciente.nombre || '—'}${paciente.dni ? ' · DNI ' + paciente.dni : ''}${paciente.edad != null ? ' · ' + paciente.edad + ' años' : ''}`, 10.5, 'normal', [51, 65, 85])
  txt(`Fecha${fechas.length > 1 ? 's' : ''} de evaluación: ${fechas.join(', ')} · ${its.length} prueba${its.length === 1 ? '' : 's'}`, 10.5, 'normal', [51, 65, 85])
  // índice de resultados
  y += 2; txt('Resumen de resultados', 12, 'bold')
  tabla(its.map(i => [i.nombre, i.valor, i.lectura || '']), ['Prueba', 'Resultado', 'Lectura'])
  for (const i of its) {
    y += 3; salto(45); doc.setDrawColor(30, 159, 224); doc.setLineWidth(0.6); doc.line(M, y - 2, M + 30, y - 2); doc.setLineWidth(0.2); y += 2
    txt(i.nombre, 13, 'bold')
    const col = i.nivel === 'ok' ? [21, 128, 61] : i.nivel === 'bad' ? [185, 28, 28] : i.nivel ? [180, 83, 9] : [51, 65, 85]
    txt(`Resultado: ${i.valor}${i.lectura && i.lectura !== i.valor ? '  ·  ' + i.lectura : ''}  ·  ${new Date(i.fecha + 'T12:00:00').toLocaleDateString('es-AR')}`, 10.5, 'bold', col)
    const secs = detallePdf(i)
    if (!secs.length && i.texto) txt(i.texto, 9.5, 'normal', [71, 85, 105])
    if (['pelvico', 'osteo'].includes(i.test) && (i.hallazgos || []).length) { txt('Resumen', 10.5, 'bold', [12, 123, 184]); i.hallazgos.forEach(h => txt('• ' + h, 9.3, 'normal', [51, 65, 85])) }
    secs.forEach(sx => { salto(12); txt(sx.titulo, 10.5, 'bold', [12, 123, 184]); tabla(sx.filas, sx.cabecera) })
    const fotos = await fotosDeToma(i)
    if (fotos.length) {
      txt('Fotos', 10.5, 'bold', [12, 123, 184])
      const ancho = (AN - 8) / 3
      for (let k = 0; k < fotos.length; k += 3) {
        const fila = fotos.slice(k, k + 3), alto = Math.min(70, Math.max(...fila.map(f => ancho * f.h / f.w)))
        salto(alto + 8)
        fila.forEach((f, j) => { const h = Math.min(alto, ancho * f.h / f.w), w = h * f.w / f.h
          try { doc.addImage(f.dataUrl, 'JPEG', M + j * (ancho + 4) + (ancho - w) / 2, y, w, h) } catch (e) {}
          doc.setFontSize(8); doc.setTextColor(100, 116, 139); doc.text(limpiarPdf(f.vista), M + j * (ancho + 4), y + alto + 4) })
        y += alto + 8
      }
    }
  }
  if ((conclusion || '').trim()) { y += 4; salto(20); txt('Conclusión', 13, 'bold'); txt(conclusion, 10.5) }
  y += 6; txt('Este informe preliminar reúne pruebas de calidad de movimiento y capacidad funcional; no constituye un diagnóstico médico.', 8.5, 'italic', [100, 116, 139])
  const pags = doc.getNumberOfPages()
  for (let k = 1; k <= pags; k++) { doc.setPage(k); doc.setFontSize(8); doc.setTextColor(148, 163, 184); doc.text(limpiarPdf(`PuntoBiO · Libertad 1549, Córdoba · ${paciente.nombre || ''} · página ${k} de ${pags}`), M, 292) }
  return doc
}
