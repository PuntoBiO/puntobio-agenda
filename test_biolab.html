<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test BiOLAB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f1f5f9; --card:#fff; --border:#e5e7eb; --text:#0f172a; --dim:#64748b; --faint:#94a3b8;
  --turq:#1e9fe0; --turq-d:#0c7bb8; --green:#16a34a; --amber:#d97706; --red:#dc2626;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Manrope',system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:auto}
.wrap{max-width:1200px;margin:0 auto;padding:24px 20px 60px}
h1{font-size:28px;font-weight:800;margin:0 0 4px}
.sub{color:var(--dim);margin:0 0 22px;font-size:15px}
.mono{font-family:'JetBrains Mono',monospace}

/* catálogo */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tcard{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.tcard:hover,.tcard:focus-visible{border-color:var(--turq);outline:none;box-shadow:0 0 0 3px rgba(30,159,224,.15)}
.tcard .ico{font-size:28px}
.tcard h3{margin:8px 0 4px;font-size:16px}
.tcard p{margin:0;color:var(--dim);font-size:13.5px;line-height:1.45}
.tcard .pos{margin-top:10px;font-size:12px;color:var(--turq-d);font-weight:600}

/* vista de test */
.back{background:none;border:0;color:var(--turq-d);font:inherit;font-weight:700;cursor:pointer;padding:0;margin-bottom:12px}
.layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:16px}
@media (max-width:900px){.layout{grid-template-columns:1fr}}
.stage{background:#0b1220;border-radius:14px;position:relative;overflow:hidden;min-height:260px;display:flex;align-items:center;justify-content:center}
.stage video,.stage canvas{width:100%;height:auto;display:block}
.stage canvas{position:absolute;inset:0;width:100%;height:100%}
.stage .vbox{position:relative;width:100%}
.stage .empty{color:#94a3b8;text-align:center;padding:30px;font-size:14px}
.hud{position:absolute;left:12px;top:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.pill{background:rgba(15,23,42,.78);color:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.pill.ok{background:rgba(22,163,74,.85)} .pill.warn{background:rgba(217,119,6,.9)}
.big{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:rgba(15,23,42,.8);color:#fff;border-radius:16px;padding:8px 22px;font-family:'JetBrains Mono',monospace;font-size:44px;font-weight:600;pointer-events:none;white-space:nowrap}
.big:empty{display:none}
.chk{position:absolute;left:12px;top:52px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.chk span{background:rgba(15,23,42,.78);color:#fff;border-radius:8px;padding:5px 10px;font-size:13px;font-weight:600}
.chk span.ok{background:rgba(22,163,74,.85)}
.chk span.no{background:rgba(220,38,38,.85)}
.consejo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(15,23,42,.85);color:#fff;border-radius:14px;padding:12px 20px;font-size:22px;font-weight:800;text-align:center;pointer-events:none;max-width:85%}
.consejo:empty{display:none}
.consejo.ok{background:rgba(22,163,74,.9)}
button.lnk{background:none;border:0;color:var(--dim);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;padding:6px 2px}

.panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px}
.panel h2{margin:0 0 6px;font-size:19px}
.panel .info{font-size:13.5px;line-height:1.5;color:#334155}
.panel .info b{color:var(--text)}
.estado{margin:14px 0;padding:10px 12px;border-radius:10px;background:#f1f5f9;font-size:14px;font-weight:600}
.estado.ok{background:#dcfce7;color:#14532d}.estado.warn{background:#fef3c7;color:#78350f}.estado.err{background:#fee2e2;color:#7f1d1d}
.btns{display:flex;flex-wrap:wrap;gap:8px}
button.b{font:inherit;font-weight:700;font-size:15px;border-radius:10px;padding:12px 16px;border:1px solid var(--border);background:#fff;color:var(--text);cursor:pointer}
button.b.pri{background:var(--turq);border-color:var(--turq);color:#fff}
button.b.dan{background:#fff;border-color:var(--red);color:var(--red)}
button.b:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0;font-size:14px}
.row select,.row input{font:inherit;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:#fff}
.row input{width:90px}
.res{margin-top:14px;border-top:1px solid var(--border);padding-top:14px}
.res .val{font-family:'JetBrains Mono',monospace;font-size:30px;font-weight:600}
.res .interp{font-size:14px;margin-top:4px}
.res table{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
.res td{padding:6px 4px;border-bottom:1px solid #f1f5f9}
.res td:last-child{text-align:right;font-family:'JetBrains Mono',monospace}
.res tr.best td{font-weight:800;color:var(--green)}
.nota{font-size:12.5px;color:var(--dim);margin-top:10px;line-height:1.45}
.c-ok{color:var(--green)}.c-warn{color:var(--amber)}.c-bad{color:var(--red)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script type="module">
import { FilesetResolver, PoseLandmarker } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs'

// ============================================================
// CATÁLOGO DE TESTS
// Para sumar un test: agregar su ficha acá + su detector (DETECTORES).
// (Cuando guardemos resultados en la base, el catálogo pasa a una tabla.)
// ============================================================
const TESTS = [
  { id:'tug', ico:'🪑', nombre:'Pararse y caminar (TUG)',
    desc:'Movilidad funcional y riesgo de caídas. El sistema arranca en «ya» y corta solo cuando se vuelve a sentar.',
    pos:'iPad de costado, que se vea la silla y los 3 m', encuadre:'costado',
    info:`<b>Preparación:</b> silla con apoyabrazos en un extremo de la alfombra y cono en el 3. iPad de costado, a la altura de la cadera, que se vea todo el recorrido.<br>
      <b>Cómo:</b> el paciente sentado y apoyado en el respaldo. Tocás <b>Empezar</b>: cuenta 3-2-1 y suena el «ya». Se levanta, camina, gira, vuelve y se sienta. El tiempo se corta solo al sentarse.<br>
      Puede usar su calzado y bastón habitual. 1 intento de práctica y después 1 medido.` },
  { id:'marcha4', ico:'🚶', nombre:'Marcha 4 metros',
    desc:'Velocidad de marcha a paso habitual. Vos marcás en la pantalla las dos líneas de la alfombra y el sistema cronometra el cruce.',
    pos:'iPad de costado, perpendicular al centro de la alfombra', encuadre:'lineas',
    info:`<b>Preparación:</b> iPad de costado, perpendicular a la mitad de la alfombra, que se vean las dos marcas. Protocolo: arranca en el 0, <b>1,5 m</b> de aceleración, <b>4 m</b> cronometrados (del 1,5 al 5,5) y frena al final.<br>
      <b>Cómo:</b> tocá en la imagen la línea de inicio y después la de llegada. Tocás <b>Empezar</b> y el paciente camina a su paso habitual. El tiempo corre cuando el tronco cruza la primera línea y corta en la segunda.<br>
      Hacé 2 intentos: el sistema se queda con el mejor.` },
  { id:'step2', ico:'🦵', nombre:'Marcha en el lugar (2 min)',
    desc:'2-Minute Step Test. Calibra la altura de rodilla sola y cuenta cada vez que la rodilla derecha llega a la marca.',
    pos:'iPad VERTICAL de frente, cuerpo entero en cuadro', encuadre:'frente',
    info:`<b>Preparación:</b> iPad <b>vertical</b> y de frente, a 2-3 m, que se vea el cuerpo entero de la cabeza a los pies. Puede apoyar una mano en una silla o pared (para equilibrio, no para impulsarse).<br>
      <b>Cómo:</b> tocás <b>Empezar</b> y el paciente se queda <b>quieto 2 segundos</b>: el sistema mide cadera y rodilla y marca la altura objetivo (punto medio entre rótula y cresta ilíaca). Suena el «ya» y marcha 2 minutos.<br>
      <b>Conteo:</b> cuenta las veces que la <b>rodilla derecha</b> llega a la línea. La izquierda se muestra como referencia.` },
  { id:'equilibrio', ico:'🧍', nombre:'Equilibrio SPPB (3 posturas)',
    desc:'Pies juntos, semi-tándem y tándem, en secuencia. Cronometra 10 s y corta si mueve los pies.',
    pos:'iPad VERTICAL de frente, de la cabeza a los pies', encuadre:'frente',
    info:`<b>Preparación:</b> iPad <b>vertical</b> y de frente, que se vea de la cabeza a los pies. Ayudás al paciente a ubicarse y lo soltás.<br>
      <b>Cómo:</b> para cada postura tocás <b>Empezar</b>. Corre hasta 10 s y corta solo si mueve los pies. Si se agarra de algo, tocá <b>Se apoyó / cortar</b>.<br>
      <b>Orden:</b> pies juntos → semi-tándem → tándem. Si no completa una postura, las siguientes quedan en 0.<br>
      <b>Puntaje:</b> pies juntos y semi-tándem, 10 s = 1 punto. Tándem: 10 s = 2 · 3 a 9,99 s = 1 · menos de 3 s = 0. Total 0 a 4.` },
]

// ============================================================
// ESTADO
// ============================================================
const L = { hipL:23, hipR:24, kneeL:25, kneeR:26, ankL:27, ankR:28, heelL:29, heelR:30, toeL:31, toeR:32 }
let landmarker = null, stream = null, rafId = null, lastVideoTime = -1
let actual = null          // test en curso (ficha)
let det = null             // detector en curso (objeto con estado)
let pose = null            // landmarks suavizados en píxeles
let facing = 'environment'
let audioCtx = null
const $ = (id) => document.getElementById(id)

// ============================================================
// UTILIDADES
// ============================================================
function beep(freq = 880, ms = 180) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)()
    const o = audioCtx.createOscillator(), g = audioCtx.createGain()
    o.frequency.value = freq; o.connect(g); g.connect(audioCtx.destination)
    g.gain.setValueAtTime(0.25, audioCtx.currentTime)
    o.start(); o.stop(audioCtx.currentTime + ms / 1000)
  } catch (e) {}
}
const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 })
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y)
const fmt = (s, d = 2) => (s == null || isNaN(s)) ? '—' : s.toFixed(d).replace('.', ',')
function visible(...idx) { return pose && idx.every(i => pose[i] && pose[i].v > 0.5) }
function legLen() {
  if (!pose) return null
  const a = dist(pose[L.hipL], pose[L.ankL]), b = dist(pose[L.hipR], pose[L.ankR])
  return (a + b) / 2
}
// Aviso al contar (marcha en el lugar): 'pitido' | 'voz' | 'silencio'. Se recuerda en este iPad.
let avisoConteo = (() => { try { return localStorage.getItem('testbiolab_aviso') || 'pitido' } catch (e) { return 'pitido' } })()
let vozEs = null
function elegirVoz() {
  try {
    const vs = speechSynthesis.getVoices()
    vozEs = vs.find(v => /es[-_]AR/i.test(v.lang)) || vs.find(v => /es[-_](419|MX|US)/i.test(v.lang)) || vs.find(v => /^es/i.test(v.lang)) || null
  } catch (e) {}
}
try { elegirVoz(); speechSynthesis.onvoiceschanged = elegirVoz } catch (e) {}
function decir(txt) {
  try {
    speechSynthesis.cancel()               // si viene rápido, no se acumulan números atrasados
    const u = new SpeechSynthesisUtterance(String(txt))
    u.lang = vozEs ? vozEs.lang : 'es-AR'; if (vozEs) u.voice = vozEs
    u.rate = 1.3; speechSynthesis.speak(u)
  } catch (e) {}
}
function avisarConteo(n) {
  if (avisoConteo === 'pitido') beep(1200, 60)
  else if (avisoConteo === 'voz') decir(n)
}

function setEstado(txt, cls = '') { const e = $('estado'); if (e) { e.textContent = txt; e.className = 'estado ' + cls } }
function setBig(txt) { const e = $('big'); if (e) e.textContent = txt }
function setPill(txt, cls = '') { const e = $('pill'); if (e) { e.textContent = txt; e.className = 'pill ' + cls } }

async function cuentaRegresiva() {
  for (const n of [3, 2, 1]) { setBig(String(n)); beep(600, 120); await new Promise(r => setTimeout(r, 1000)) }
  beep(1000, 350); setBig('¡YA!')
}

// ============================================================
// CÁMARA + MODELO
// ============================================================
async function cargarModelo() {
  if (landmarker) return
  setEstado('Cargando el detector de movimiento… (la primera vez tarda unos segundos)')
  const vision = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm')
  const opts = (delegate) => ({
    baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task', delegate },
    runningMode: 'VIDEO', numPoses: 1, minPoseDetectionConfidence: 0.5, minTrackingConfidence: 0.5
  })
  try { landmarker = await PoseLandmarker.createFromOptions(vision, opts('GPU')) }
  catch (e) { landmarker = await PoseLandmarker.createFromOptions(vision, opts('CPU')) }
}

// Cámara elegida: '' = automática (prefiere el ultra gran angular trasero si existe)
let camId = (() => { try { return localStorage.getItem('testbiolab_cam') || '' } catch (e) { return '' } })()

async function prenderCamara() {
  apagarCamara()
  // Sin forzar 16:9: el sensor del iPad es 4:3 y en 16:9 recorta arriba y abajo (se pierde cabeza o pies)
  const base = { width: { ideal: 1920 }, height: { ideal: 1440 } }
  const pedir = camId ? { ...base, deviceId: { exact: camId } } : { ...base, facingMode: facing }
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: pedir }) }
  catch (e) { if (camId) { camId = ''; stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { ...base, facingMode: facing } }) } else throw e }

  // Primera vez: si hay ultra gran angular trasero, pasamos a esa (es la que ve el cuerpo entero más cerca)
  await llenarCamaras()
  if (!camId) {
    const ultra = camaras.find(c => /ultra/i.test(c.label) && !/front|frontal|delanter/i.test(c.label))
    if (ultra && facing === 'environment') {
      stream.getTracks().forEach(t => t.stop())
      camId = ultra.deviceId
      stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { ...base, deviceId: { exact: camId } } })
      llenarCamaras()
    }
  }
  const track = stream.getVideoTracks()[0]
  const st = track.getSettings ? track.getSettings() : {}
  if (st.facingMode) facing = st.facingMode === 'user' ? 'user' : 'environment'
  else if (camId) { const c = camaras.find(x => x.deviceId === camId); if (c) facing = /front|frontal|delanter/i.test(c.label) ? 'user' : 'environment' }

  // Zoom: si la cámara lo permite, arrancamos en el más abierto (ej. 0,5x)
  configurarZoom(track)

  const v = $('video')
  v.srcObject = stream
  v.style.transform = facing === 'user' ? 'scaleX(-1)' : ''
  $('canvas').style.transform = v.style.transform
  await v.play()
  $('vempty').style.display = 'none'; $('vbox').style.display = 'block'
  const c = $('canvas'); c.width = v.videoWidth; c.height = v.videoHeight
  lastVideoTime = -1
  loop()
}

let camaras = []
async function llenarCamaras() {
  try {
    camaras = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput')
    const sel = $('selCam'); if (!sel || !camaras.length || !camaras[0].label) return
    const actualId = stream && stream.getVideoTracks()[0].getSettings().deviceId
    sel.innerHTML = camaras.map((c, i) => `<option value="${i}">${c.label.replace(/</g, '')}</option>`).join('')
    const i = camaras.findIndex(c => c.deviceId === (camId || actualId)); if (i >= 0) sel.value = String(i)
  } catch (e) {}
}

function configurarZoom(track) {
  const box = $('zoomBox'); if (!box) return
  const cap = track.getCapabilities ? track.getCapabilities() : {}
  if (!cap.zoom || cap.zoom.max <= cap.zoom.min) { box.style.display = 'none'; return }
  const r = $('zoom'); r.min = cap.zoom.min; r.max = Math.min(cap.zoom.max, 3); r.step = cap.zoom.step || 0.1
  r.value = cap.zoom.min; box.style.display = ''
  const aplicar = () => { track.applyConstraints({ advanced: [{ zoom: parseFloat(r.value) }] }).catch(() => {}); $('zoomVal').textContent = parseFloat(r.value).toFixed(1).replace('.', ',') + 'x' }
  r.oninput = aplicar; aplicar()
}

function apagarCamara() {
  if (rafId) cancelAnimationFrame(rafId); rafId = null
  if (stream) stream.getTracks().forEach(t => t.stop()); stream = null
}

function loop() {
  const v = $('video')
  if (!v || !stream) return
  if (v.currentTime !== lastVideoTime && landmarker && v.videoWidth) {
    const cv = $('canvas')
    if (cv.width !== v.videoWidth || cv.height !== v.videoHeight) { cv.width = v.videoWidth; cv.height = v.videoHeight; pose = null }
    lastVideoTime = v.currentTime
    const now = performance.now()
    const r = landmarker.detectForVideo(v, now)
    const W = v.videoWidth, H = v.videoHeight
    if (r.landmarks && r.landmarks[0]) {
      const nuevo = r.landmarks[0].map(p => ({ x: p.x * W, y: p.y * H, v: p.visibility ?? 1 }))
      pose = pose ? nuevo.map((p, i) => ({ x: pose[i].x * 0.4 + p.x * 0.6, y: pose[i].y * 0.4 + p.y * 0.6, v: p.v })) : nuevo
      setPill('Paciente detectado', 'ok')
    } else { pose = null; setPill('No veo al paciente', 'warn') }
    if (det && det.frame) det.frame(now)
    actualizarCalibrador()
    dibujar()
  }
  rafId = requestAnimationFrame(loop)
}

const HUESOS = [[11,12],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28],[27,29],[29,31],[27,31],[28,30],[30,32],[28,32],[11,13],[13,15],[12,14],[14,16]]
function dibujar() {
  const c = $('canvas'); if (!c) return
  const ctx = c.getContext('2d'); ctx.clearRect(0, 0, c.width, c.height)
  const s = c.width / 640
  // líneas del detector (objetivo de rodilla, líneas de la alfombra, etc.)
  if (det && det.dibujar) det.dibujar(ctx, s)
  if (zona && det && !MEDIDO.includes(det.fase) && actual.encuadre !== 'lineas') {
    ctx.setLineDash([16 * s, 10 * s]); ctx.lineWidth = 4 * s
    ctx.strokeStyle = posOk ? 'rgba(34,197,94,.95)' : 'rgba(239,68,68,.9)'
    ctx.strokeRect(zona.x0, zona.y0, zona.x1 - zona.x0, zona.y1 - zona.y0)
    ctx.setLineDash([])
  }
  if (!pose) return
  ctx.lineWidth = 4 * s; ctx.strokeStyle = 'rgba(30,159,224,.9)'
  HUESOS.forEach(([a, b]) => { if (pose[a].v > .4 && pose[b].v > .4) { ctx.beginPath(); ctx.moveTo(pose[a].x, pose[a].y); ctx.lineTo(pose[b].x, pose[b].y); ctx.stroke() } })
  ctx.fillStyle = '#fff'
  ;[23,24,25,26,27,28].forEach(i => { if (pose[i].v > .4) { ctx.beginPath(); ctx.arc(pose[i].x, pose[i].y, 6 * s, 0, 7); ctx.fill() } })
}

// ============================================================
// CALIBRADOR DE POSICIÓN (estilo HumanTrak)
// Antes de cada toma revisa: cuerpo entero en cuadro, distancia, centrado
// y orientación (de frente / de costado). Empezar se habilita cuando todo
// queda en verde 1 segundo seguido.
// ============================================================
let posOkFrames = 0, posOk = false, zona = null
// MANOS LIBRES (autoevaluación): se toca el botón cerca del iPad, uno se aleja y se ubica,
// y la toma arranca sola cuando la posición queda en verde. Los consejos se dicen en voz alta.
let manosLibres = false, armadoFrames = 0, ultimoConsejo = '', tUltimoConsejo = 0
const MEDIDO = ['calibrando', 'cuenta', 'midiendo', 'esperando', 'corriendo']

function chequearPosicion() {
  const c = $('canvas'); if (!c || !actual) return null
  const W = c.width, H = c.height, tipo = actual.encuadre
  if (tipo === 'lineas') {
    const ok = det.lineas && det.lineas.length === 2
    return { ok, items: [{ ok, txt: 'Líneas de la alfombra marcadas' }], consejo: ok ? '' : 'Marcá las dos líneas tocando la imagen' }
  }
  if (!pose) return { ok: false, items: [{ ok: false, txt: 'Paciente en cuadro' }], consejo: 'No veo al paciente' }
  const vis = (i) => pose[i].v > 0.5
  const dentro = (i, m = 0.02) => pose[i].x > W * m && pose[i].x < W * (1 - m) && pose[i].y > H * m && pose[i].y < H * (1 - m)
  const cabeza = vis(0) && dentro(0)
  const pies = [27, 28, 29, 30, 31, 32].every(i => vis(i) && dentro(i))
  const tronco = [11, 12, 23, 24].every(i => vis(i))
  const yPies = Math.max(...[27, 28, 29, 30, 31, 32].map(i => pose[i].y))
  const alto = (yPies - pose[0].y) / H
  const cad = mid(pose[23], pose[24]), hom = mid(pose[11], pose[12])
  const torso = Math.max(dist(cad, hom), 1)
  const ancho = Math.abs(pose[11].x - pose[12].x) / torso
  const xRel = cad.x / W
  const [aMin, aMax] = tipo === 'costado' ? [0.30, 0.85] : [0.55, 0.88]

  const items = [], consejos = []
  items.push({ ok: cabeza, txt: 'Cabeza en cuadro' }); if (!cabeza) consejos.push('Se corta la cabeza: alejá el iPad o bajalo un poco')
  items.push({ ok: pies, txt: 'Pies en cuadro' }); if (!pies) consejos.push('No veo los pies: alejá el iPad o inclinalo hacia abajo')
  const distOk = cabeza && pies && alto >= aMin && alto <= aMax
  items.push({ ok: distOk, txt: 'Distancia' })
  if (cabeza && pies && alto < aMin) consejos.push('Está muy lejos: acercá el iPad')
  if (cabeza && pies && alto > aMax) consejos.push('Está muy cerca: alejá el iPad')
  const centOk = xRel > 0.33 && xRel < 0.67
  items.push({ ok: centOk, txt: 'Centrado' })
  if (!centOk) {
    // en cámara frontal la imagen va espejada: lo que el evaluador ve a la izquierda es la derecha del cuadro
    const izq = facing === 'user' ? xRel > 0.67 : xRel < 0.33
    consejos.push(izq ? 'Corré al paciente hacia el centro (está a la izquierda de la imagen)' : 'Corré al paciente hacia el centro (está a la derecha de la imagen)')
  }
  let oriOk = tronco
  if (tipo === 'frente') { oriOk = tronco && ancho > 0.45; items.push({ ok: oriOk, txt: 'De frente a la cámara' }); if (tronco && !oriOk) consejos.push('Que se ponga de frente al iPad') }
  if (tipo === 'costado') { oriOk = tronco && ancho < 0.35; items.push({ ok: oriOk, txt: 'De costado a la cámara' }); if (tronco && !oriOk) consejos.push('Ubicá la silla de costado al iPad') }
  zona = { x0: W * 0.33, x1: W * 0.67, y0: H * 0.02, y1: H * 0.98 }
  const ok = cabeza && pies && distOk && centOk && oriOk
  return { ok, items, consejo: consejos[0] || '' }
}

function actualizarCalibrador() {
  const chk = $('chk'), cons = $('consejo'), btn = $('btnEmpezar')
  if (!chk || !det) return
  if (MEDIDO.includes(det.fase)) {
    chk.innerHTML = ''; cons.textContent = ''; cons.className = 'consejo'
    // durante la toma solo avisamos si se sale de cuadro
    if (actual.encuadre !== 'lineas' && pose) {
      const r = chequearPosicion()
      if (r && !r.items[0].ok || r && !r.items[1].ok) setPill('⚠ Se está saliendo de cuadro', 'warn')
    }
    return
  }
  const r = chequearPosicion(); if (!r) return
  posOkFrames = r.ok ? posOkFrames + 1 : 0
  posOk = posOkFrames >= 15
  chk.innerHTML = r.items.map(i => `<span class="${i.ok ? 'ok' : 'no'}">${i.ok ? '✓' : '✗'} ${i.txt}</span>`).join('')
  if (posOk) { cons.textContent = actual.encuadre === 'lineas' ? '' : '✓ Posición correcta'; cons.className = 'consejo ok' }
  else { cons.textContent = r.consejo; cons.className = 'consejo' }
  if (btn && $('btnPreparar').disabled && !det.ocupado) btn.disabled = !posOk

  if (manosLibres && det.armado) {
    const ahora = performance.now()
    if (!posOk && r.consejo && (r.consejo !== ultimoConsejo || ahora - tUltimoConsejo > 4000) && ahora - tUltimoConsejo > 2500) {
      decir(r.consejo.split(':')[0]); ultimoConsejo = r.consejo; tUltimoConsejo = ahora
    }
    armadoFrames = posOk ? armadoFrames + 1 : 0
    if (armadoFrames >= 30) {             // ~1 s más en verde después del chequeo: arranca
      det.armado = false; armadoFrames = 0; ultimoConsejo = ''
      decir('Posición correcta')
      setTimeout(() => det.empezar(), 1200)
    }
  }
}

const DETECTORES = {

  // ---------- 2-MINUTE STEP TEST ----------
  step2() {
    const DUR = 120
    const d = { fase: 'quieto', muestras: [], objetivo: null, base: null, cuentaD: 0, cuentaI: 0, arribaD: false, arribaI: false, t0: 0 }
    d.empezar = async () => {
      d.fase = 'calibrando'; d.muestras = []; d.cuentaD = d.cuentaI = 0; d.arribaD = d.arribaI = false
      setEstado('Quieto 2 segundos: estoy midiendo cadera y rodilla…', 'warn'); setBig('')
    }
    d.frame = async (now) => {
      if (d.fase === 'calibrando') {
        if (!visible(L.hipR, L.kneeR, L.hipL, L.kneeL)) return
        d.muestras.push({ hR: pose[L.hipR].y, kR: pose[L.kneeR].y, hL: pose[L.hipL].y, kL: pose[L.kneeL].y })
        if (d.muestras.length >= 45) {
          const m = k => d.muestras.reduce((s, x) => s + x[k], 0) / d.muestras.length
          d.base = { kR: m('kR'), kL: m('kL') }
          d.objetivo = { R: (m('hR') + m('kR')) / 2, L: (m('hL') + m('kL')) / 2 }
          d.fase = 'cuenta'; await cuentaRegresiva(); d.t0 = performance.now(); d.fase = 'midiendo'
          setEstado('Midiendo… marchá levantando la rodilla hasta la línea', 'ok')
        }
        return
      }
      if (d.fase !== 'midiendo') return
      const t = (now - d.t0) / 1000
      if (pose) {
        const histD = d.base.kR - (d.base.kR - d.objetivo.R) * 0.35
        const histI = d.base.kL - (d.base.kL - d.objetivo.L) * 0.35
        const kR = pose[L.kneeR].y, kL = pose[L.kneeL].y
        if (!d.arribaD && kR <= d.objetivo.R) { d.arribaD = true; d.cuentaD++; avisarConteo(d.cuentaD) }
        if (d.arribaD && kR > histD) d.arribaD = false
        if (!d.arribaI && kL <= d.objetivo.L) { d.arribaI = true; d.cuentaI++ }
        if (d.arribaI && kL > histI) d.arribaI = false
      }
      const resta = Math.max(0, DUR - t)
      setBig(`${d.cuentaD}  ·  ${Math.floor(resta / 60)}:${String(Math.floor(resta % 60)).padStart(2, '0')}`)
      if (t >= DUR) d.terminar()
    }
    d.terminar = () => {
      if (d.fase !== 'midiendo') { d.fase = 'quieto'; return }
      d.fase = 'fin'; beep(800, 500)
      setEstado('Terminado', 'ok'); setBig(`${d.cuentaD}`)
      mostrarResultado(`
        <div class="val">${d.cuentaD} <span style="font-size:16px">pasos (rodilla derecha)</span></div>
        <div class="interp">Rodilla izquierda: ${d.cuentaI} · diferencia ${d.cuentaD - d.cuentaI >= 0 ? '+' : ''}${d.cuentaD - d.cuentaI}</div>
        <div class="nota">Cargá el número en el 2-Minute Step Test de VALD: el sistema lo compara con la tabla por sexo y edad.</div>`,
        `2-Minute Step Test: ${d.cuentaD} pasos (rodilla der.) · izq. ${d.cuentaI}`)
    }
    d.dibujar = (ctx, s) => {
      if (!d.objetivo) return
      ctx.setLineDash([12 * s, 8 * s]); ctx.lineWidth = 3 * s
      ctx.strokeStyle = '#fbbf24'; ctx.beginPath(); ctx.moveTo(0, d.objetivo.R); ctx.lineTo(ctx.canvas.width, d.objetivo.R); ctx.stroke()
      ctx.setLineDash([])
    }
    return d
  },

  // ---------- EQUILIBRIO SPPB ----------
  equilibrio() {
    const POST = ['Pies juntos', 'Semi-tándem', 'Tándem']
    const d = { idx: 0, fase: 'quieto', ref: null, refMuestras: [], t0: 0, seg: [null, null, null], movidos: 0 }
    const prox = () => {
      if (d.idx < 3) setEstado(`Postura ${d.idx + 1} de 3: ${POST[d.idx]}. Ubicalo, soltalo y tocá Empezar.`)
      $('btnEmpezar').textContent = d.idx < 3 ? `Empezar · ${POST[d.idx]}` : 'Empezar'
    }
    d.init = prox
    d.empezar = async () => {
      if (d.idx >= 3) return
      d.fase = 'cuenta'; await cuentaRegresiva(); d.t0 = performance.now(); d.refMuestras = []; d.ref = null; d.movidos = 0; d.fase = 'midiendo'
      setEstado(`Midiendo ${POST[d.idx]}…`, 'ok')
    }
    const pies = () => [L.ankL, L.ankR, L.toeL, L.toeR].map(i => ({ x: pose[i].x, y: pose[i].y }))
    d.frame = (now) => {
      if (d.fase !== 'midiendo') return
      const t = (now - d.t0) / 1000
      setBig(fmt(Math.min(t, 10), 1) + ' s')
      if (pose && visible(L.ankL, L.ankR)) {
        if (!d.ref) { d.refMuestras.push(pies()); if (d.refMuestras.length >= 12) d.ref = d.refMuestras[0].map((_, i) => ({ x: d.refMuestras.reduce((s, m) => s + m[i].x, 0) / 12, y: d.refMuestras.reduce((s, m) => s + m[i].y, 0) / 12 })) }
        else {
          const umbral = (legLen() || 300) * 0.07
          const mov = Math.max(...pies().map((p, i) => dist(p, d.ref[i])))
          d.movidos = mov > umbral ? d.movidos + 1 : 0
          if (d.movidos >= 4) { d.cortar(t, 'movió los pies'); return }
        }
      }
      if (t >= 10) d.cortar(10, null)
    }
    d.cortar = (t, motivo) => {
      if (d.fase !== 'midiendo') return
      d.fase = 'quieto'
      if (t == null) t = (performance.now() - d.t0) / 1000
      t = Math.min(t, 10); d.seg[d.idx] = t
      beep(motivo ? 400 : 1000, 400)
      const completa = t >= 10
      setBig(fmt(t, 1) + ' s')
      if (!completa && d.idx < 2) { for (let k = d.idx + 1; k < 3; k++) d.seg[k] = 0; d.idx = 3 }
      else d.idx++
      if (d.idx >= 3) d.final()
      else {
        setEstado(`${POST[d.idx - 1]}: ${fmt(t, 1)} s ${motivo ? '(' + motivo + ')' : '✓'}. Seguimos.`, 'ok'); prox()
        if (manosLibres) {
          setTimeout(() => decir(`Siguiente: ${POST[d.idx]}. Ubicate.`), 1200)
          setTimeout(() => { if (d.fase === 'quieto' && d.idx < 3) d.armado = true }, 6000)
        }
      }
    }
    d.terminar = () => d.cortar(null, 'se apoyó / cortado a mano')
    d.final = () => {
      const [pj, st, td] = d.seg
      const p1 = pj >= 10 ? 1 : 0, p2 = st >= 10 ? 1 : 0, p3 = td >= 10 ? 2 : td >= 3 ? 1 : 0
      const tot = p1 + p2 + p3
      setEstado('Equilibrio terminado', 'ok'); $('btnEmpezar').textContent = 'Empezar'
      mostrarResultado(`
        <div class="val">${tot} / 4 <span style="font-size:16px">puntos</span></div>
        <table>
          <tr><td>Pies juntos</td><td>${fmt(pj, 1)} s · ${p1} pt</td></tr>
          <tr><td>Semi-tándem</td><td>${fmt(st, 1)} s · ${p2} pt</td></tr>
          <tr><td>Tándem</td><td>${fmt(td, 1)} s · ${p3} pt</td></tr>
        </table>
        <div class="nota">Cargá los segundos en el bloque Equilibrio del SPPB de VALD.</div>`,
        `Equilibrio SPPB: ${tot}/4 · pies juntos ${fmt(pj,1)} s · semi-tándem ${fmt(st,1)} s · tándem ${fmt(td,1)} s`)
    }
    return d
  },

  // ---------- MARCHA 4 METROS ----------
  marcha4() {
    const d = { fase: 'lineas', lineas: [], intentos: [], tIni: null, prevX: null, prevT: null, dir: 0, t0: 0 }
    d.init = () => setEstado('Tocá en la imagen la línea de INICIO (el 1,5 de la alfombra).', 'warn')
    d.tap = (x) => {
      if (d.fase !== 'lineas') return
      d.lineas.push(x)
      if (d.lineas.length === 1) setEstado('Ahora tocá la línea de LLEGADA (el 5,5).', 'warn')
      else { d.fase = 'quieto'; setEstado('Líneas listas. Paciente en el 0 y tocá Empezar.', 'ok'); $('btnLineas').disabled = false }
    }
    d.relineas = () => { d.lineas = []; d.fase = 'lineas'; d.init() }
    d.empezar = async () => {
      if (d.lineas.length < 2) { d.init(); return }
      d.fase = 'cuenta'; await cuentaRegresiva(); setBig('')
      d.tIni = null; d.prevX = null; d.t0 = performance.now(); d.fase = 'esperando'
      setEstado('Caminá a paso habitual…', 'ok')
    }
    const cruce = (x0, x1, linea) => (x0 - linea) * (x1 - linea) <= 0 && x0 !== x1
    d.frame = (now) => {
      if (d.fase === 'esperando' || d.fase === 'corriendo') {
        if (d.tIni != null) setBig(fmt((now - d.tIni) / 1000, 2) + ' s')
        if (!pose || !visible(L.hipL, L.hipR)) { d.prevX = null; return }
        const x = mid(pose[L.hipL], pose[L.hipR]).x
        if (d.prevX != null) {
          const interp = (linea) => d.prevT + (now - d.prevT) * ((linea - d.prevX) / (x - d.prevX))
          const [a, b] = d.lineas
          if (d.fase === 'esperando') {
            if (cruce(d.prevX, x, a)) { d.tIni = interp(a); d.fin = b; d.fase = 'corriendo'; beep(1200, 60) }
            else if (cruce(d.prevX, x, b)) { d.tIni = interp(b); d.fin = a; d.fase = 'corriendo'; beep(1200, 60) }
          } else if (cruce(d.prevX, x, d.fin)) {
            const seg = (interp(d.fin) - d.tIni) / 1000
            d.registrar(seg); return
          }
        }
        d.prevX = x; d.prevT = now
        if ((now - d.t0) / 1000 > 60) { setEstado('Pasó un minuto sin completar el recorrido. Revisá que se vean las dos líneas.', 'err'); d.fase = 'quieto' }
      }
    }
    d.registrar = (seg) => {
      d.fase = 'quieto'; beep(900, 400)
      const metros = parseFloat(($('dist4') || {}).value || '4') || 4
      d.intentos.push({ seg, vel: metros / seg })
      setBig(fmt(seg, 2) + ' s')
      setEstado(`Intento ${d.intentos.length}: ${fmt(seg, 2)} s. ${d.intentos.length < 2 ? 'Hacé el segundo intento.' : 'Listo, me quedo con el mejor.'}`, 'ok')
      const best = d.intentos.reduce((b, x) => x.seg < b.seg ? x : b)
      const v = best.vel
      const interp = v < 0.8 ? ['c-bad', 'Fragilidad o riesgo de deterioro funcional'] : v <= 1.0 ? ['c-warn', 'Movilidad moderada, posibles limitaciones'] : ['c-ok', 'Adecuada para mantener la independencia funcional']
      mostrarResultado(`
        <div class="val">${fmt(v, 2)} <span style="font-size:16px">m/s</span></div>
        <div class="interp ${interp[0]}">${interp[1]}</div>
        <table>${d.intentos.map((x, i) => `<tr class="${x === best ? 'best' : ''}"><td>Intento ${i + 1}</td><td>${fmt(x.seg, 2)} s · ${fmt(x.vel, 2)} m/s</td></tr>`).join('')}</table>
        <div class="nota">En el Gait Speed de VALD cargá el mejor tiempo: <b>${fmt(best.seg, 2)} s</b>.</div>`,
        `Marcha 4 m: ${fmt(best.seg, 2)} s · ${fmt(v, 2)} m/s (mejor de ${d.intentos.length})`)
    }
    d.terminar = () => { if (d.fase === 'corriendo') d.registrar((performance.now() - d.tIni) / 1000); else d.fase = 'quieto' }
    d.dibujar = (ctx, s) => {
      ctx.lineWidth = 4 * s
      d.lineas.forEach((x, i) => {
        ctx.strokeStyle = i === 0 ? '#22c55e' : '#ef4444'
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, ctx.canvas.height); ctx.stroke()
        ctx.fillStyle = ctx.strokeStyle; ctx.font = `bold ${22 * s}px Manrope`; ctx.fillText(i === 0 ? 'INICIO' : 'LLEGADA', x + 6 * s, 30 * s)
      })
    }
    return d
  },

  // ---------- TUG ----------
  tug() {
    const d = { fase: 'quieto', base: null, muestras: [], t0: 0, tParado: null, sentado: 0, xBase: null, seParo: false }
    d.empezar = async () => {
      d.muestras = []; d.base = null; d.seParo = false; d.tParado = null; d.sentado = 0
      d.fase = 'calibrando'; setEstado('Sentado y quieto: midiendo la posición inicial…', 'warn')
    }
    d.frame = async (now) => {
      if (d.fase === 'calibrando') {
        if (!pose || !(visible(L.hipL) || visible(L.hipR))) return
        const c = mid(pose[L.hipL], pose[L.hipR]); d.muestras.push(c)
        if (d.muestras.length >= 30) {
          d.base = d.muestras.reduce((s, m) => s + m.y, 0) / d.muestras.length
          d.xBase = d.muestras.reduce((s, m) => s + m.x, 0) / d.muestras.length
          d.escala = legLen() || 300
          d.fase = 'cuenta'; await cuentaRegresiva(); d.t0 = performance.now(); d.fase = 'midiendo'
          setEstado('Midiendo… levantate, caminá, girá, volvé y sentate', 'ok')
        }
        return
      }
      if (d.fase !== 'midiendo') return
      const t = (now - d.t0) / 1000
      setBig(fmt(t, 1) + ' s')
      if (!pose) return
      const c = mid(pose[L.hipL], pose[L.hipR])
      const subio = d.base - c.y
      if (!d.seParo && subio > d.escala * 0.18) { d.seParo = true; d.tParado = t }
      // vuelta: ya se paró, se alejó y regresó, y la cadera volvió a la altura de sentado
      if (d.seParo && t > 2.5 && Math.abs(c.x - d.xBase) < d.escala * 0.35 && subio < d.escala * 0.06) {
        if (!d.sentado) d.tSentado = t
        d.sentado++
        if (d.sentado >= 8) d.registrar(d.tSentado)
      } else d.sentado = 0
      if (t > 90) { setEstado('Pasaron 90 s. Si ya se sentó, tocá Detener.', 'err') }
    }
    d.registrar = (t) => {
      d.fase = 'fin'; beep(900, 500); setBig(fmt(t, 2) + ' s'); setEstado('Terminado', 'ok')
      const r = t < 10 ? ['c-ok', 'Movilidad normal, independiente'] : t < 13.5 ? ['c-ok', 'Funcional, mayormente independiente'] : t < 20 ? ['c-warn', 'Riesgo aumentado de caídas'] : t < 30 ? ['c-bad', 'Movilidad reducida, limitaciones funcionales'] : ['c-bad', 'Dependencia']
      mostrarResultado(`
        <div class="val">${fmt(t, 2)} <span style="font-size:16px">s</span></div>
        <div class="interp ${r[0]}">${r[1]}</div>
        <table><tr><td>Tiempo hasta quedar parado</td><td>${d.tParado != null ? fmt(d.tParado, 2) + ' s' : '—'}</td></tr></table>
        <div class="nota">Cargá el tiempo en el Timed Up &amp; Go de VALD.</div>`,
        `TUG: ${fmt(t, 2)} s (se paró a los ${fmt(d.tParado, 2)} s)`)
    }
    d.terminar = () => { if (d.fase === 'midiendo') d.registrar((performance.now() - d.t0) / 1000); else d.fase = 'quieto' }
    return d
  },
}

  $('btnReiniciar').onclick = () => renderTest(id)
  $('selCam').value = facing
  if ($('selAviso')) {
    $('selAviso').value = avisoConteo
    $('selAviso').onchange = (e) => {
      avisoConteo = e.target.value
      try { localStorage.setItem('testbiolab_aviso', avisoConteo) } catch (er) {}
      if (avisoConteo === 'voz') decir('uno')       // prueba de voz (y destraba el audio en el iPad)
      else if (avisoConteo === 'pitido') beep(1200, 60)
    }
  }
  $('selCam').onchange = async (e) => {
    const val = e.target.value
    if (val === 'environment' || val === 'user') { facing = val; camId = '' }
    else { const c = camaras[parseInt(val)]; if (c) camId = c.deviceId }
    try { localStorage.setItem('testbiolab_cam', camId) } catch (er) {}
    if (stream) await prenderCamara()
  }
  $('btnPreparar').onclick = async () => {
    beep(1, 1) // destraba el audio en el iPad
    if (avisoConteo === 'voz') decir(' ')
    $('btnPreparar').disabled = true
    try {
      await cargarModelo(); await prenderCamara()
      $('btnPreparar').textContent = 'Cámara lista'; $('btnDetener').disabled = false; $('btnForzar').style.display = ''; $('btnSolo').disabled = false
      if (det.init) det.init(); else setEstado('Listo. Ubicá al paciente y tocá Empezar.', 'ok')
    } catch (e) {
      console.error(e); $('btnPreparar').disabled = false
      setEstado(e && e.name === 'NotAllowedError'
        ? 'El navegador no dio permiso para la cámara. Habilitalo en Ajustes de Safari → Cámara para puntobio.com.ar.'
        : 'No se pudo prender la cámara o el detector: ' + (e && e.message ? e.message : e), 'err')
    }
  }
  $('btnSolo').onclick = () => {
    manosLibres = true; armadoFrames = 0; ultimoConsejo = ''; tUltimoConsejo = 0
    if (id !== 'marcha4' && id !== 'equilibrio') $('res').innerHTML = ''
    det.armado = true
    setEstado('Manos libres: ubicate en posición. Arranca solo cuando todo esté en verde.', 'warn')
    decir('Ubicate en posición')
  }
  $('btnEmpezar').onclick = () => { manosLibres = false; if (det) det.armado = false; $('res').innerHTML = id === 'marcha4' || id === 'equilibrio' ? $('res').innerHTML : ''; det.empezar() }
  $('btnDetener').onclick = () => det.terminar && det.terminar()
  $('btnForzar').onclick = () => { $('res').innerHTML = id === 'marcha4' || id === 'equilibrio' ? $('res').innerHTML : ''; det.empezar() }
  if (id === 'marcha4') $('btnLineas').onclick = () => det.relineas()
  $('canvas').addEventListener('pointerdown', (ev) => {
    if (!det.tap) return
    const c = $('canvas'), r = c.getBoundingClientRect()
    let x = (ev.clientX - r.left) * (c.width / r.width)
    if (facing === 'user') x = c.width - x
    det.tap(x)
  })
}

window.addEventListener('pagehide', apagarCamara)
renderCatalogo()
</script>
</body>
</html>
