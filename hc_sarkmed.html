  { re: /tandem/,                                  nombre: 'Tandem Stand',                           clave: 'ht_tandem_oa' },
  { re: /countermovement jump|^cmj$/,              nombre: 'Countermovement Jump',                   clave: null },
];

/* Siglas que usa el Hub adentro de sus códigos */
const SIGLAS_HUB = [
  [/\bsl\b/g, 'single leg'], [/\bwb\b/g, 'weight bearing'], [/\boh\b/g, 'overhead'],
  [/\bflex\b/g, 'flexion'],  [/\bext\b/g, 'extension'],     [/\bdorsi\b/g, 'dorsiflexion'],
  [/\babd\b/g, 'abduction'], [/\badd\b/g, 'adduction'],     [/\brot\b/g, 'rotation'],
];

function limpiarCodigoHub(raw){
  return normVald(raw).replace(/^tt[\s_-]+/, '').replace(/[_-]+/g, ' ').replace(/\s+/g, ' ').trim();
}

function traducirPrueba(raw){
  const crudo = String(raw == null ? '' : raw).trim();
  const base  = limpiarCodigoHub(crudo);
  for(const c of CODIGOS_HUB){
    if(c.re.test(base)) return { nombre: c.nombre, clave: c.clave || null, crudo };
  }
  // No está en la tabla: se muestra igual, pero legible
  if(/^tt[\s_-]/i.test(crudo)){
    let t = base;
    SIGLAS_HUB.forEach(([re, txt]) => { t = t.replace(re, txt); });
    t = t.replace(/\b\w/g, ch => ch.toUpperCase());
    return { nombre: t, clave: null, crudo };
  }
  return { nombre: crudo, clave: null, crudo };
}


/* Arma el listado REAL: recorre lo que devolvió el Hub y lo agrupa por equipo.
   No parte de ninguna lista prevista — si el Hub devuelve una prueba que este
   código no conoce, igual entra (queda bajo el nombre de la lista que la trajo).
   Además sigue tildando el protocolo por edad, que ahora es solo referencia. */
function registrarTestsDeVald(datos){
  const items = [], vistos = new Set(), claves = new Set(), nombresLindos = [];
  const agregar = (equipo, prueba, metricas) => {
    if(prueba == null || !String(prueba).trim()) return;
    const t  = traducirPrueba(prueba);
    const eq = String(equipo || 'OTROS').toUpperCase().replace(/[\s_-]+/g, '');
    const llave = eq + '|' + normVald(t.nombre);
    if(vistos.has(llave)) return;
    vistos.add(llave);
    nombresLindos.push(t.nombre);
    if(t.clave) claves.add(t.clave);
    items.push({ equipo: eq, prueba: t.nombre, metricas: Number(metricas) || 0,
                 crudo: (normVald(t.crudo) !== normVald(t.nombre)) ? t.crudo : null });
  };

  (datos.movilidad || []).forEach(pr =>
    agregar(pr.equipo || pr.fuente || pr.dispositivo || 'HUMANTRAK', pr.prueba, (pr.metricas || []).length));

  (datos.forceDecks || []).forEach(t =>
    agregar(t.equipo || 'FORCEDECKS', t.prueba, Object.keys(t.resultados || {}).length));

  (datos.fuerza || []).forEach(f =>
    agregar(f.equipo || f.fuente || 'DYNAMO', f.grupo || f.prueba,
      ((f.izquierda_N != null && f.izquierda_N !== 0) ? 1 : 0) +
      ((f.derecha_N   != null && f.derecha_N   !== 0) ? 1 : 0)));

  if(datos.postura && typeof datos.postura === 'object'){
    const n = Object.keys(datos.postura)
      .filter(k => datos.postura[k] != null && typeof datos.postura[k] !== 'object').length;
    if(n) agregar('HUMANTRAK', 'Standing Posture', n);
  }

  // Red de seguridad: si el Hub devuelve una lista que este código todavía no
  // conoce (otro equipo, otra prueba), se muestra igual en vez de perderse.
  const conocidas = new Set(['movilidad','forceDecks','fuerza','postura','candidatos']);
  Object.keys(datos || {}).forEach(k => {
    if(conocidas.has(k) || !Array.isArray(datos[k])) return;
    datos[k].forEach(it => {
      if(!it || typeof it !== 'object') return;
      const nombre = it.prueba || it.grupo || it.nombre || it.test;
      if(!nombre) return;
      agregar(it.equipo || it.fuente || k, nombre,
        (it.metricas || []).length || Object.keys(it.resultados || {}).length);
    });
  });

  biolab.protocolo_tests = biolab.protocolo_tests || {};

  // Lo que el código del Hub identifica sin lugar a dudas se tilda directo;
  // las pistas por nombre quedan de refuerzo para lo que no está en la tabla.
  const clave = protocoloActual();
  const delProtocolo = new Set();
  (PROTOCOLOS[clave].grupos || []).forEach(g => g.tests.forEach(([k]) => delProtocolo.add(k)));
  let tildados = 0;
  claves.forEach(k => {
    if(delProtocolo.has(k) && !biolab.protocolo_tests[k]){ biolab.protocolo_tests[k] = true; tildados++; }
  });
  tildados += tildarTestsDeVald(datos, nombresLindos);

  if(items.length) biolab.protocolo_tests.__vald = { fecha: new Date().toISOString(), items };

  return { traidos: items.length, tildados };
}

function tildarTestsDeVald(datos, nombresExtra){
  const nombres = (nombresExtra || []).slice();
  (datos.movilidad   || []).forEach(m => nombres.push(m.prueba || ''));
  (datos.forceDecks  || []).forEach(f => nombres.push(f.prueba || ''));
  (datos.fuerza      || []).forEach(f => nombres.push(f.grupo  || ''));
  if(datos.postura) nombres.push('Standing Posture');

  const limpio = nombres.map(n => String(n).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase());
  const clave = protocoloActual();
  const delProtocolo = new Set();
  (PROTOCOLOS[clave].grupos || []).forEach(g => g.tests.forEach(([k]) => delProtocolo.add(k)));

  biolab.protocolo_tests = biolab.protocolo_tests || {};
  let marcados = 0;
  PISTAS_TEST.forEach(([k, pistas]) => {
    if(!delProtocolo.has(k)) return;                     // no está en este protocolo
    if(biolab.protocolo_tests[k]) return;                // ya estaba tildado
    const hay = pistas.some(pista => limpio.some(n => n.includes(pista)));
    if(hay){ biolab.protocolo_tests[k] = true; marcados++; }
  });
  biolab.protocolo = clave;
  return marcados;
}

/* El Hub no llama a las métricas como las llamamos nosotros: el área del apoyo
   monopodal figura como "Centre of Mass 95% Ellipse Area", el pico del IMTP como
   "Peak Vertical Force". Estos buscadores hacen la búsqueda tolerante, en vez de
   pedir un nombre exacto que después no aparece y deja el campo vacío. */
const RE_ELIPSE = /(95%?\s*)?ellipse area|area of cop|cop ellipse/i;
const RE_PICO   = /peak (vertical )?force/i;
const RE_NO_PICO = /asym|\/\s*bm|per kg|n\/kg|relative|impulse|rfd/i;

function metricaFD(res, re, noRe){
  const k = Object.keys(res || {}).find(k => re.test(k) && !(noRe && noRe.test(k)));
  return (k && res[k] && res[k].lados) ? { nombre: k, lados: res[k].lados } : null;
}

function pruebaFD(datos, re, noRe){
  return (datos.forceDecks || []).find(t => re.test(t.prueba || '') && !(noRe && noRe.test(t.prueba || '')));
}

/* Algunas de estas mediciones llegan por movilidad (HumanTrak) y no por ForceDecks:
   el equilibrio monopodal es el caso típico. Se busca en los dos lados. */
function metricaMovilidad(datos, rePrueba, reMetrica){
  for(const pr of (datos.movilidad || [])){
    const nom = limpiarCodigoHub(pr.prueba || '') + ' ' + normVald(traducirPrueba(pr.prueba).nombre);
    if(!rePrueba.test(nom)) continue;
    const m = (pr.metricas || []).find(m => reMetrica.test(m.metrica || ''));
    if(m && (m.izquierda != null || m.derecha != null)) return { Left: m.izquierda, Right: m.derecha };
  }
  return null;
}

function aplicarDatosVald(datos, cortes){
  const reg = registrarTestsDeVald(datos);
  const tildados = reg.tildados, traidos = reg.traidos;
  const detalle = [];
  let total = 0, pisados = 0;
  const contar = (ok, etiqueta) => { if(ok){ total++; detalle.push(etiqueta); } else pisados++; };
  const c = cortes || { verde: 10, amar: 15 };
  const colorAsim = a => { a = Math.abs(Number(a) || 0); return a < c.verde ? '🟢' : (a <= c.amar ? '🟡' : '🔴'); };

  const hallazgos = [];   // solo lo que NO está bien
  const L_fuerza = [], L_potencia = [], L_equilibrio = [], L_movilidad = [];
  // Lo mismo, pero en la forma que espera la edge function informe-biolab:
  // cada ítem con su semáforo, su nombre, su detalle y de qué equipo salió.
  const IA = { postura: null, movilidad: [], fuerza: [], forceDecks: [], dynamo: [] };
  const lado = (izq, der) => (izq < der) ? 'IZQUIERDO' : (der < izq ? 'DERECHO' : 'simétrico');

  // ── FUERZA (DynaMo): entra TODA, no solo la prensión ──────────────
  for(const f of (datos.fuerza || [])){
    const sinDato = (f.izquierda_N == null || f.izquierda_N === 0) && (f.derecha_N == null || f.derecha_N === 0);
    const unLado  = !sinDato && ((f.izquierda_N == null) !== (f.derecha_N == null));
    if(sinDato){
      L_fuerza.push(`⚠️ ${f.grupo}: sin registro de fuerza — revisar la toma`);
      hallazgos.push(`⚠️ ${f.grupo}: la toma no registró fuerza`);
      IA.fuerza.push({ em:'⚠️', nom:f.grupo, det:'la toma no registró fuerza — repetir la medición', fuente:'DynaMo' });
      continue;
    }
    if(unLado){
      L_fuerza.push(`⚠️ ${f.grupo}: medición de UN SOLO LADO (izq ${f.izquierda_N ?? '—'} / der ${f.derecha_N ?? '—'} N)`);
      hallazgos.push(`⚠️ ${f.grupo}: se midió un solo lado — posible fallo de equipo`);
      IA.fuerza.push({ em:'⚠️', nom:f.grupo, det:`se midió un solo lado (L ${f.izquierda_N ?? '—'} / R ${f.derecha_N ?? '—'} N) — repetir`, fuente:'DynaMo' });
      continue;
    }
    const em = colorAsim(f.asimetria_pct);
    const debil = (f.izquierda_N < f.derecha_N) ? 'IZQUIERDO' : (f.derecha_N < f.izquierda_N ? 'DERECHO' : 'simétrico');
    let linea = `${em} ${f.grupo}: izq ${f.izquierda_N} N / der ${f.derecha_N} N · asimetría ${f.asimetria_pct} % · lado más débil: ${debil}`;
    if(/prensi|grip/i.test(f.grupo || '')){
      const Lk = f.izquierda_N / G, Rk = f.derecha_N / G;
      linea += ` · ${Lk.toFixed(1)} / ${Rk.toFixed(1)} kg`;
      if(Math.max(Lk, Rk) < 16) hallazgos.push(`🔴 Prensión por debajo del corte de EWGSOP2 (16 kg): mejor mano ${Math.max(Lk, Rk).toFixed(1)} kg`);
    }
    L_fuerza.push(linea);
    IA.dynamo.push({ grupo: f.grupo, L: f.izquierda_N, R: f.derecha_N });
    IA.fuerza.push({ em, nom:f.grupo,
      det:`${f.asimetria_pct}% asim · L ${f.izquierda_N} / R ${f.derecha_N} N · lado MÁS DÉBIL: ${debil}`, fuente:'DynaMo' });
    if(em !== '🟢') hallazgos.push(`${em} ${f.grupo}: asimetría ${f.asimetria_pct} % (lado más débil: ${debil})`);
  }

  // ── FORCEDECKS: TODAS las métricas de TODAS las pruebas ───────────
  for(const t of (datos.forceDecks || [])){
    const destino = esPruebaEquilibrio(t.prueba) ? L_equilibrio : L_potencia;
    const nomFD = traducirPrueba(t.prueba).nombre;    // nunca el código crudo del Hub
    destino.push(`— ${nomFD} —`);
    for(const nombre in (t.resultados || {})){
      const r = t.resultados[nombre] || {};
      const lados = r.lados || {};
      const u = r.unidad || '';
      const L = lados.Left, R = lados.Right, A = lados.Asym;
      const uni = (lados.Trial != null) ? lados.Trial : lados.Both;

      if(FD_ASIM_OK.has(nombre) && L != null && R != null){
        const tasa = FD_TASA.has(nombre);
        const mag = Math.max(Math.abs(L), Math.abs(R));
        if(!tasa && (L < 0 || R < 0)){
          destino.push(`⚠️ ${nombre}: izq ${L} / der ${R} ${u} — fuerza negativa, posible artefacto`);
          hallazgos.push(`⚠️ ${nomFD} · ${nombre}: valor negativo, revisar la toma`);
          continue;
        }
        if(mag < 1){ destino.push(`⚪ ${nombre}: izq ${L} / der ${R} ${u} (valor ~0)`); continue; }
        const asim = (A != null) ? A : Math.round((R - L) / (mag || 1) * 1000) / 10;
        const em = colorAsim(asim);
        const menor = (L < R) ? 'IZQUIERDO' : (R < L ? 'DERECHO' : 'simétrico');
        destino.push(`${em} ${nombre}: izq ${L} / der ${R} ${u} · asimetría ${asim} % · menor: ${menor}`);
        IA.forceDecks.push({ em, nom:`${nomFD} · ${nombre}`,
          det:`${asim}% asim · L ${L} / R ${R} ${u} · lado con MENOR valor: ${menor}`, fuente:'ForceDecks' });
        if(em !== '🟢') hallazgos.push(`${em} ${nomFD} · ${nombre}: asimetría ${asim} % (menor: ${menor})`);
        continue;
      }
      // Área del apoyo monopodal y RFD: en VALD quedan informativas porque no son
      // asimetría de fuerza. Acá SÍ se marcan: son las dos que más dicen sobre
      // riesgo de caída — cuánto oscila un lado más que el otro, y cuánto tarda
      // en producir fuerza.
      if((RE_ELIPSE.test(nombre) || /rfd/i.test(nombre)) && L != null && R != null && Math.max(L, R) > 0){
        const mayor = Math.max(Math.abs(L), Math.abs(R)), menorV = Math.min(Math.abs(L), Math.abs(R));
        const asim = Math.round((mayor - menorV) / (mayor || 1) * 1000) / 10;
        const em = colorAsim(asim);
        const esArea = RE_ELIPSE.test(nombre);
        const veces = menorV > 0 ? (mayor / menorV) : null;
        const peor = esArea ? ((Math.abs(L) > Math.abs(R)) ? 'IZQUIERDO' : 'DERECHO')   // más área = peor control
                            : ((Math.abs(L) < Math.abs(R)) ? 'IZQUIERDO' : 'DERECHO');  // menos RFD = más lento
        destino.push(`${em} ${nombre}: izq ${L} / der ${R} ${u} · diferencia ${asim} %` +
          (veces ? ` · ${veces.toFixed(1)} veces` : '') + ` · peor: ${peor}`);
        IA.forceDecks.push({ em, nom:`${nomFD} · ${nombre}`,
          det:`${asim}% asim · L ${L} / R ${R} ${u} · lado PEOR: ${peor}` + (veces ? ` (${veces.toFixed(1)} veces)` : ''),
          fuente:'ForceDecks' });
        if(em !== '🟢'){
          hallazgos.push(esArea
            ? `${em} ${nomFD}: el apoyo ${peor.toLowerCase()} oscila ${veces ? veces.toFixed(1) + ' veces' : asim + ' %'} más que el otro`
            : `${em} ${nomFD} · ${nombre}: el lado ${peor.toLowerCase()} tarda más en producir fuerza (diferencia ${asim} %)`);
        }
        continue;
      }
      if(L != null && R != null){
        destino.push(`⚪ ${nombre}: izq ${L} / der ${R} ${u}`.trim());
        IA.forceDecks.push({ em:'⚪', nom:`${nomFD} · ${nombre}`, det:`L ${L} / R ${R} ${u}`.trim(), fuente:'ForceDecks' });
      }else if(uni != null){
        destino.push(`⚪ ${nombre}: ${uni} ${u}`.trim());
        IA.forceDecks.push({ em:'⚪', nom:`${nomFD} · ${nombre}`, det:`${uni} ${u}`.trim(), fuente:'ForceDecks' });
      }
    }
  }

  // ── MOVILIDAD (HumanTrak / ROM de DynaMo) ─────────────────────────
  for(const pr of (datos.movilidad || [])){
    const met = pr.metricas || [];
    L_movilidad.push(`— ${traducirPrueba(pr.prueba).nombre} —`);
    for(const m of met){
      const unLado = ((m.izquierda == null) !== (m.derecha == null)) && (m.valor == null);
      const nomPrueba = traducirPrueba(pr.prueba).nombre;
      if(unLado){
        L_movilidad.push(`⚠️ ${m.metrica}: un solo lado (izq ${m.izquierda ?? '—'} / der ${m.derecha ?? '—'}°)`);
        hallazgos.push(`⚠️ ${nomPrueba} · ${m.metrica}: se midió un solo lado`);
        IA.movilidad.push({ em:'⚠️', nom:`${nomPrueba} · ${m.metrica}`, det:'se midió un solo lado — repetir', fuente:'HumanTrak' });
        continue;
      }
      if(m.asimetria_pct == null){
        L_movilidad.push(`🟢 ${m.metrica}: ${m.valor}°`);
        IA.movilidad.push({ em:'🟢', nom:`${nomPrueba} · ${m.metrica}`, det:`${m.valor}°`, fuente:'HumanTrak' });
        continue;
      }
      const em = colorAsim(m.asimetria_pct);
      const menor = (m.izquierda < m.derecha) ? 'IZQUIERDO' : (m.derecha < m.izquierda ? 'DERECHO' : 'simétrico');
      L_movilidad.push(`${em} ${m.metrica}: izq ${m.izquierda}° / der ${m.derecha}° · asimetría ${m.asimetria_pct} % · menor: ${menor}`);
      IA.movilidad.push({ em, nom:`${nomPrueba} · ${m.metrica}`,
        det:`${m.asimetria_pct}% asim · L ${m.izquierda} / R ${m.derecha}° · lado con MENOR valor: ${menor}`, fuente:'HumanTrak / LSI' });
      if(em !== '🟢') hallazgos.push(`${em} ${nomPrueba} · ${m.metrica}: asimetría ${m.asimetria_pct} % (menor: ${menor})`);
    }
  }

  // ── POSTURA ───────────────────────────────────────────────────────
  const post = datos.postura || null;
  if(post && typeof post === 'object'){
    const lineas = Object.keys(post)
      .filter(k => post[k] != null && typeof post[k] !== 'object')
      .map(k => `⚪ ${k}: ${post[k]}`);
    if(lineas.length){ L_movilidad.push('— Postura estática —'); L_movilidad.push(...lineas); }
    IA.postura = posturaEstructurada(post);
  }

  // ── Los pocos valores que alimentan cálculos ──────────────────────
  const grip = (datos.fuerza || []).find(f => /prensi|grip/i.test(f.grupo || ''));
  if(grip){
    const a = ponerSiVacio('prension_izq_n', grip.izquierda_N);
    const b = ponerSiVacio('prension_der_n', grip.derecha_N);
    contar(a || b, 'prensión');
  }
  const imtp = pruebaFD(datos, /isometric mid|imtp|mid-thigh/i);
  if(imtp && imtp.resultados){
    const pico = metricaFD(imtp.resultados, RE_PICO, RE_NO_PICO);
    if(pico){
      const a = ponerSiVacio('imtp_pico_izq_n', pico.lados.Left);
      const b = ponerSiVacio('imtp_pico_der_n', pico.lados.Right);
      contar(a || b, 'IMTP');
    }
    const rfd = metricaFD(imtp.resultados, /rfd.*100|100.*rfd/i) || metricaFD(imtp.resultados, /rfd/i);
    if(rfd){
      const a = ponerSiVacio('imtp_rfd_izq', rfd.lados.Left);
      const b = ponerSiVacio('imtp_rfd_der', rfd.lados.Right);
      contar(a || b, 'RFD');
    }
  }
  // El apoyo monopodal: primero ForceDecks, y si no vino por ahí, HumanTrak.
  // OJO con no agarrar el Single Leg SQUAT, que es otra prueba.
  const sls = pruebaFD(datos, /single leg stand|unipodal|monopodal|unilateral stance/i, /squat/i);
  let areaSls = (sls && sls.resultados) ? metricaFD(sls.resultados, RE_ELIPSE) : null;
  let ladosArea = areaSls ? areaSls.lados : null;
  if(!ladosArea) ladosArea = metricaMovilidad(datos, /single leg stand|stand sl|unipodal/i, RE_ELIPSE);
  if(ladosArea){
    const a = ponerSiVacio('sls_area_izq', ladosArea.Left);
    const b = ponerSiVacio('sls_area_der', ladosArea.Right);
    contar(a || b, 'apoyo monopodal');
  }

  // ── Los resúmenes se llenan con el volcado completo del Hub ───────
  const volcar = (id, lineas) => {
    if(!lineas.length) return false;
    const texto = lineas.join('\n');
    biolab[id] = texto;
    const el = document.getElementById(id);
    if(el) el.value = texto;
    return true;
  };
  if(volcar('resumen_neuromuscular', L_fuerza))   detalle.push('fuerza completa');
  if(volcar('resumen_potencia', L_potencia))      detalle.push('ForceDecks completo');
  if(volcar('resumen_equilibrio', L_equilibrio))  detalle.push('equilibrio');
  if(volcar('resumen_movilidad', L_movilidad))    detalle.push('movilidad y postura');
  if(L_fuerza.length || L_potencia.length || L_equilibrio.length || L_movilidad.length) total++;

  // ── Hallazgos: lo que NO está bien, junto y a la vista ────────────
  const textoH = hallazgos.length ? hallazgos.join('\n') : 'Sin hallazgos fuera de norma en esta toma.';
  biolab.hallazgos = textoH;
  const cajaH = document.getElementById('hallazgos');
  if(cajaH) cajaH.value = textoH;
  const panel = document.getElementById('panel-hallazgos');
  if(panel){
    panel.innerHTML = hallazgos.length
      ? `<b style="color:var(--rojo-x)">${hallazgos.length} ${hallazgos.length === 1 ? 'hallazgo' : 'hallazgos'} fuera de norma</b>`
      : '<b style="color:var(--verde)">Sin hallazgos fuera de norma</b>';
  }
  if(hallazgos.length) detalle.push(hallazgos.length + ' hallazgos');

  // El paquete para informe-biolab queda guardado con la ficha, así el botón
  // Crear informe sigue andando aunque se recargue la pantalla.
  biolab.protocolo_tests = biolab.protocolo_tests || {};
  biolab.protocolo_tests.__hallazgos = {
    fecha: new Date().toISOString(),
    postura: IA.postura,
    movilidad:  IA.movilidad.slice(0, 250),
    fuerza:     IA.fuerza.slice(0, 60),
    forceDecks: IA.forceDecks.slice(0, 250),
    dynamo:     IA.dynamo.slice(0, 40),
  };

  return { total, detalle, pisados, tildados, traidos };
}

function levantarBiolab(){
  if(solapa !== 'biolab') return;
  CAMPOS_BIOLAB_NUM.forEach(c => { if(document.getElementById(c)) biolab[c] = num(c); });
  CAMPOS_BIOLAB_TXT.forEach(c => { if(document.getElementById(c)) biolab[c] = txt(c); });
}

async function guardarBiolab(){
  levantarBiolab();
  const p = fichaActual.paciente || {};
  const edad = edadDe(p.fecha_nacimiento);
  const peso = Number(nutri.peso_kg) || null;

  // Los calculados se guardan resueltos, para poder comparar entre evaluaciones
  const ent = entradasIshii();
  if(ent.fzAuto  != null) biolab.ishii_fuerza_kg      = Number(ent.fzAuto.toFixed(1));
  if(ent.panAuto != null) biolab.ishii_pantorrilla_cm = Number(ent.panAuto.toFixed(1));
  const ishii = (edad != null && ent.fz && ent.pan)
    ? Number(((0.80 * edad) - (5.09 * ent.fz) - (3.28 * ent.pan) + 206).toFixed(1)) : null;
  const picoTotal = (biolab.imtp_pico_izq_n && biolab.imtp_pico_der_n)
    ? biolab.imtp_pico_izq_n + biolab.imtp_pico_der_n : null;

  const fila = { hc_id: fichaActual.id, editado_en: new Date().toISOString(), editado_por_email: miEmail };
  CAMPOS_BIOLAB_NUM.forEach(c => { fila[c] = biolab[c] ?? null; });
  CAMPOS_BIOLAB_TXT.forEach(c => { fila[c] = biolab[c] || null; });
  fila.protocolo       = biolab.protocolo || protocoloActual();
  fila.protocolo_tests = biolab.protocolo_tests || {};
  fila.vald_profile_id = biolab.vald_profile_id || null;
  fila.vald_traido_en  = biolab.vald_traido_en  || null;
  fila.ishii_score      = ishii;
  fila.fuerza_relativa  = (picoTotal && peso) ? Number((picoTotal / peso).toFixed(2)) : null;
  fila.velocidad_marcha = biolab.marcha_4m_seg ? Number((4 / biolab.marcha_4m_seg).toFixed(2)) : null;

/* Las fotos de celular vienen enormes (2480x3508 y varios megas) y la subida
   se hace eterna. Antes de mandarlas se achican a 1600px de lado mayor y se
   guardan como JPG: se leen igual de bien en pantalla y en el PDF, pero pesan
   una fracción. Los PDF del Hub y cualquier otro archivo van tal cual. */
const LADO_MAX = 1600;
const CALIDAD  = 0.82;

function achicarImagen(file){
  return new Promise((resolve) => {
    if(!file.type || !file.type.startsWith('image/')) return resolve(file);
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try{
        const escala = Math.min(1, LADO_MAX / Math.max(img.width, img.height));
        if(escala === 1 && file.size < 900000){ URL.revokeObjectURL(url); return resolve(file); }
        const lienzo = document.createElement('canvas');
        lienzo.width  = Math.round(img.width  * escala);
        lienzo.height = Math.round(img.height * escala);
        lienzo.getContext('2d').drawImage(img, 0, 0, lienzo.width, lienzo.height);
        lienzo.toBlob((blob) => {
          URL.revokeObjectURL(url);
          if(!blob || blob.size >= file.size) return resolve(file);   // no empeorar
          const nombre = file.name.replace(/\.[^.]+$/, '') + '.jpg';
          resolve(new File([blob], nombre, { type:'image/jpeg' }));
        }, 'image/jpeg', CALIDAD);
      }catch(e){ URL.revokeObjectURL(url); resolve(file); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}

async function subirAdjuntos(sol, input){
  const files = Array.from(input.files || []);
  if(!files.length) return;
  const cont = document.getElementById('lista-adjuntos');
  const pesoTotal = (files.reduce((a,f) => a + f.size, 0) / 1048576).toFixed(1);
  let listos = 0;
  const avisar = () => {
    cont.innerHTML = '<div style="font-size:12px;color:var(--muted)">Subiendo ' +
      (files.length === 1 ? 'el archivo' : listos + ' de ' + files.length) +
      '… (' + pesoTotal + ' MB en total)</div>';
  };
  avisar();

  const fallos = [];

  // Los archivos van todos juntos, no en fila: con un PDF del Hub de 12 MB,
  // subir de a uno hacía esperar el doble sin necesidad.
  await Promise.all(files.map(async (original) => {
    try{
      const file = await achicarImagen(original);
      // El nombre se limpia: los acentos y espacios rompen las rutas del bucket.
      const limpio = file.name.normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                              .replace(/[^a-zA-Z0-9._-]/g, '_');
      const path = `${fichaActual.id}/${sol}/${Date.now()}_${Math.random().toString(36).slice(2,7)}_${limpio}`;
      const { error: eUp } = await sb.storage.from('sarkmed-hc').upload(path, file, { upsert:false });
      if(eUp){ fallos.push(original.name + ': ' + eUp.message); return; }
      const { error: eIns } = await sb.from('hc_sarkmed_adjuntos').insert({
        hc_id: fichaActual.id, solapa: sol, path, nombre: file.name,
        tipo: file.type || null, tamano: file.size || null, subido_por: miEmail
      });
      if(eIns) fallos.push(original.name + ' (se subió pero no se anotó): ' + eIns.message);
    }catch(e){
      fallos.push(original.name + ': ' + (e && e.message ? e.message : 'error inesperado'));
    }finally{
      listos++;
      avisar();
    }
  }));

  input.value = '';
  await cargarAdjuntos(fichaActual.id);
  renderFicha();

  if(fallos.length){
    // El error se muestra acá abajo además del cartelito: cuando estás al pie
    // de la ficha, el aviso de arriba no se ve y parecía quedar colgado.
    const c2 = document.getElementById('lista-adjuntos');
    if(c2) c2.innerHTML += '<div style="background:#fee2e2;color:#991b1b;padding:10px 12px;border-radius:10px;font-size:13px;margin-top:8px">' +
      '<b>No se pudo subir ' + fallos.length + (fallos.length === 1 ? ' archivo' : ' archivos') + '</b><br>' +
      fallos.map(esc).join('<br>') + '</div>';
    toast('Hubo problemas al subir', 'err');
  }else{
    toast(files.length === 1 ? 'Estudio cargado' : files.length + ' estudios cargados', 'ok');
  }
}

async function verAdjunto(i){
  const a = adjuntos.filter(x => x.solapa === solapa)[i];
  if(!a) return;
  // Link firmado: vence en 5 minutos, no queda nada público.
  const { data, error } = await sb.storage.from('sarkmed-hc').createSignedUrl(a.path, 300);
  if(error){ toast('No se pudo abrir: ' + error.message, 'err'); return; }
  window.open(data.signedUrl, '_blank');
}

async function borrarAdjunto(i){
  const a = adjuntos.filter(x => x.solapa === solapa)[i];
  if(!a) return;
  if(!confirm('¿Borrar "' + a.nombre + '"? No se puede deshacer.')) return;
  await sb.storage.from('sarkmed-hc').remove([a.path]);
  const { error } = await sb.from('hc_sarkmed_adjuntos').delete().eq('id', a.id);
  if(error){ toast('No se pudo borrar: ' + error.message, 'err'); return; }
  await cargarAdjuntos(fichaActual.id);
  renderFicha();
  toast('Estudio borrado', 'ok');
}

/* El IMC se calcula, no se escribe. La clasificación OMS queda SUGERIDA:
   la marca definitiva siempre la pone quien evalúa. */
function calcularIMC(){
  const p = Number(v('peso_kg')), t = Number(v('talla_m'));
  const cajaImc = document.getElementById('imc_visible');
  const sug     = document.getElementById('sugerencia-oms');
  if(!cajaImc) return;
  if(!p || !t){ cajaImc.value = ''; if(sug) sug.textContent = ''; return; }
  const imc = p / (t * t);
  if(!isFinite(imc) || imc <= 0 || imc > 100){ cajaImc.value = ''; if(sug) sug.textContent = ''; return; }
  cajaImc.value = imc.toFixed(1);
  const cual = imc < 18.5 ? 'Bajo peso' : imc < 25 ? 'Normopeso' : imc < 30 ? 'Sobrepeso' : 'Obesidad';
  if(sug) sug.textContent = `Con un IMC de ${imc.toFixed(1)} la OMS lo ubica en “${cual}”. Marcalo vos.`;
}

}

async function guardarFicha(){
  if(!puedeCargar()){ toast('No tenés permiso para cargar historias', 'err'); return; }
  if(solapa === 'nutricion')     return guardarNutricion();
  if(solapa === 'suelo_pelvico') return guardarSuelo();
  if(solapa === 'biolab')        return guardarBiolab();
  return guardarMedica();
}

async function guardarMedica(){
  guardarAntecedentesEnMemoria();

  // Limpieza: categorías sin nada cargado no se guardan.
  const ant = {};
  Object.entries(fichaActual.antecedentes || {}).forEach(([cat, nodo]) => {
    const marcados = (nodo.marcados || []).filter(Boolean);
    const detalle  = (nodo.detalle || '').trim();

  const fila = {
    motivo_consulta:      txt('motivo_consulta'),
    capacidad_funcional:  txt('capacidad_funcional'),
    aptitud_fisica:       txt('aptitud_fisica'),

    vapeador:             !!fichaActual.vapeador,
    muchas_horas_sentado: !!fichaActual.muchas_horas_sentado,
    muchas_horas_de_pie:  !!fichaActual.muchas_horas_de_pie,

    medicacion_actual:    txt('medicacion_actual'),
    corticoterapia:       !!fichaActual.corticoterapia,
    cortico_tiempo:       txt('cortico_tiempo'),
    cortico_via:          txt('cortico_via'),
    suplementos:          txt('suplementos'),

    sintoma_perdida_peso: !!fichaActual.sintoma_perdida_peso,
    sintoma_fatiga:       !!fichaActual.sintoma_fatiga,
    sintoma_debilidad:    !!fichaActual.sintoma_debilidad,
    caidas_ultimo_anio:   num('caidas_ultimo_anio'),
    caidas_contexto:      txt('caidas_contexto'),
    charlson_cci:         num('charlson_cci'),

    antecedentes:         ant,

    chequeo_medico:       txt('chequeo_medico'),

  const btn = document.getElementById('btn-guardar');
  btn.disabled = true; btn.textContent = 'Guardando…';
  const { error } = await sb.from('hc_sarkmed').update(fila).eq('id', fichaActual.id);

  if(error){ toast('No se pudo guardar: ' + error.message, 'err'); return; }

  await cargarEvaluaciones();
  fichaActual = evaluaciones.find(e => e.id === fichaActual.id) || fichaActual;
  renderFicha();
}
