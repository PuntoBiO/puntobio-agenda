<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Historias Clínicas SARKMED · PuntoBiO</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#ffffff; --panel-2:#fafafa; --border:#e5e7eb; --hover:#f9fafb;
    --text:#0f172a; --muted:#64748b; --dim:#94a3b8;
    /* Colores del logo SarkMED */
    --primary:#f47b20; --primary-2:#d4620f; --primary-soft:#fff6ee; --primary-border:#fbcfa6;
    --azul:#1c75bc; --azul-2:#155a91; --azul-claro:#29abe2; --azul-soft:#eaf4fc; --azul-border:#bcdff5;
    --verde:#16a34a; --verde-soft:#f0fdf4; --rojo-x:#ef4444; --rojo-soft:#fef2f2;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
       background:var(--bg); color:var(--text); font-size:13px;}

  .page-header{padding:22px 32px 14px; background:#fff;}
  .page-title{font-size:22px; font-weight:700; color:var(--azul); letter-spacing:1.5px; margin:0;
              display:flex; align-items:center; gap:10px;}
  .page-title .sep{color:var(--text); font-weight:400;}
  .lg{letter-spacing:.5px;}
  .lg .sar{color:var(--primary);} .lg .k{color:var(--azul-claro);} .lg .med{color:var(--azul);}
  .page-subtitle{color:var(--muted); margin-top:4px; font-size:11.5px; text-transform:uppercase; letter-spacing:.8px;}
  .header-row{display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap;}
  .contador{font-size:12px; color:var(--muted);}

  .toolbar{padding:14px 32px; background:#fff; border-top:1px solid var(--border);
           border-bottom:1px solid var(--border); display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  .buscador{flex:1; min-width:240px; max-width:460px; padding:9px 12px; border:1px solid var(--border);
            border-radius:8px; font-size:13px; font-family:inherit;}
  .buscador:focus{outline:2px solid var(--primary-border); border-color:var(--primary);}

  .btn{padding:8px 14px; border:1px solid var(--border); background:#fff; border-radius:6px;
       cursor:pointer; font-size:12px; font-weight:600; color:var(--text); font-family:inherit;}
  .btn:hover{background:var(--hover);}
  .btn:disabled{opacity:.55; cursor:default;}
  .btn-primary{background:var(--primary); color:#fff; border-color:var(--primary);}
  .btn-primary:hover:not(:disabled){background:var(--primary-2); border-color:var(--primary-2);}
  .btn-azul{background:var(--azul); color:#fff; border-color:var(--azul);}
  .btn-azul:hover:not(:disabled){background:var(--azul-2); border-color:var(--azul-2);}

  .wrap{padding:18px 32px 120px;}
  .tabla{width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--border); border-radius:8px; overflow:hidden;}
  .tabla th{background:var(--panel-2); text-align:left; font-size:10.5px; text-transform:uppercase;
            letter-spacing:.5px; color:var(--muted); padding:11px 14px; border-bottom:1px solid var(--border); white-space:nowrap;}
  .tabla td{padding:12px 14px; border-bottom:1px solid var(--border); vertical-align:middle;}
  .tabla tr:last-child td{border-bottom:none;}
  .tabla tbody tr:hover{background:var(--primary-soft);}
  .pac-nombre{font-weight:700; font-size:13.5px;}
  .pac-dni{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .celda-dim{color:var(--muted);}
  .acciones{text-align:right; white-space:nowrap;}
  .codigo{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; color:var(--azul); font-weight:600;}
  .tag{display:inline-block; padding:2px 8px; border-radius:20px; font-size:10.5px; font-weight:700;
       text-transform:uppercase; letter-spacing:.4px;}
  .tag-abierta{background:var(--primary-soft); color:var(--primary-2); border:1px solid var(--primary-border);}
  .tag-cerrada{background:var(--verde-soft); color:#15803d; border:1px solid #bbf7d0;}

  .vacio{text-align:center; padding:56px 20px; color:var(--muted); border:1px dashed var(--border);
         border-radius:8px; background:var(--panel-2);}
  .vacio b{display:block; font-size:15px; color:var(--text); margin-bottom:6px;}

  /* ── FICHA ─────────────────────────────────────────────────────── */
  .ficha-head{background:var(--azul-soft); border:1px solid var(--azul-border); border-radius:10px;
              padding:14px 18px; margin-bottom:16px; display:flex; justify-content:space-between;
              gap:14px; flex-wrap:wrap; align-items:center;}
  .ficha-head .nom{font-size:17px; font-weight:700;}
  .ficha-head .sub{font-size:12px; color:var(--azul-2); margin-top:3px;}

  .solapas{display:flex; gap:4px; border-bottom:2px solid var(--border); margin-bottom:18px; flex-wrap:wrap;}
  .solapa{padding:9px 16px; border:none; background:transparent; cursor:pointer; font-size:12.5px;
          font-weight:700; color:var(--muted); font-family:inherit; border-bottom:3px solid transparent;
          margin-bottom:-2px;}
  .solapa:hover{color:var(--text);}
  .solapa.activa{color:var(--primary); border-bottom-color:var(--primary);}
  .solapa:disabled{color:var(--dim); cursor:default;}

  .bloque{border:1px solid var(--border); border-radius:10px; margin-bottom:16px; overflow:hidden;}
  .bloque-head{background:var(--azul-claro); color:#fff; padding:9px 16px; font-size:12.5px;
               font-weight:700; letter-spacing:.4px;}
  .bloque-body{padding:16px 18px;}

  .campo{margin-bottom:12px;}
  .campo label{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.5px;
               color:var(--muted); margin-bottom:4px; font-weight:600;}
  .campo input, .campo select, .campo textarea{width:100%; padding:8px 10px; border:1px solid var(--border);
    border-radius:6px; font-size:13px; font-family:inherit; color:var(--text); background:#fff;}
  .campo textarea{min-height:60px; resize:vertical;}
  .campo input:focus, .campo select:focus, .campo textarea:focus{outline:2px solid var(--primary-border); border-color:var(--primary);}
  .campo input:disabled, .campo select:disabled, .campo textarea:disabled{background:var(--panel-2); color:var(--muted);}
  .fila-2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .fila-3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
  @media (max-width:700px){ .fila-2,.fila-3{grid-template-columns:1fr;} }

  /* Casilleros marcables */
  .chips{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:9px;}
  .chip{padding:6px 13px; border:1.5px solid var(--border); border-radius:20px; background:#fff;
        cursor:pointer; font-size:12px; font-weight:600; color:var(--muted); font-family:inherit;
        transition:all .12s;}
  .chip:hover:not(:disabled){border-color:var(--primary-border); color:var(--text);}
  .chip.on{background:var(--primary); border-color:var(--primary); color:#fff;}
  .chip:disabled{cursor:default; opacity:.7;}
  .cat{margin-bottom:15px; padding-bottom:14px; border-bottom:1px dashed var(--border);}
  .cat:last-child{border-bottom:none; margin-bottom:0; padding-bottom:0;}
  .cat-nom{font-size:12.5px; font-weight:700; color:var(--azul); margin-bottom:8px;}
  .detalle{width:100%; padding:7px 10px; border:1px solid var(--border); border-radius:6px;
           font-size:12.5px; font-family:inherit; min-height:38px; resize:vertical;}
  .detalle:focus{outline:2px solid var(--primary-border); border-color:var(--primary);}
  .detalle:disabled{background:var(--panel-2); color:var(--muted);}

  .barra-guardar{position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--border);
                 padding:12px 32px; display:none; justify-content:flex-end; gap:10px; align-items:center;
                 box-shadow:0 -4px 14px rgba(15,23,42,.06); z-index:50;}
  .barra-guardar.activa{display:flex;}
  .barra-guardar .aviso{margin-right:auto; font-size:12px; color:var(--muted);}

  .toast{position:fixed; bottom:76px; left:50%; transform:translateX(-50%) translateY(20px);
         background:#0f172a; color:#fff; padding:11px 20px; border-radius:8px; font-size:13px;
         opacity:0; pointer-events:none; transition:all .2s; z-index:200;}
  .toast.activo{opacity:1; transform:translateX(-50%) translateY(0);}
  .toast.ok{background:var(--verde);} .toast.err{background:var(--rojo-x);}

  .modal-bg{display:none; position:fixed; inset:0; background:rgba(15,23,42,.45); z-index:100;
            align-items:flex-start; justify-content:center; padding:34px 16px; overflow-y:auto;}
  .modal-bg.activo{display:flex;}
  .modal{background:#fff; border-radius:10px; width:100%; max-width:520px; box-shadow:0 20px 50px rgba(0,0,0,.2);}
  .modal-head{padding:16px 22px; border-bottom:1px solid var(--border); font-size:15px; font-weight:700;}
  .modal-body{padding:18px 22px;}
  .modal-foot{padding:14px 22px; border-top:1px solid var(--border); display:flex; gap:8px; justify-content:flex-end;}
  .res-pac{padding:10px 12px; border:1px solid var(--border); border-radius:8px; margin-bottom:6px;
           cursor:pointer; background:#fff;}
  .res-pac:hover{background:var(--primary-soft); border-color:var(--primary-border);}

  @media (max-width:860px){
    .wrap{padding:14px 14px 120px;} .toolbar{padding:12px 14px;} .page-header{padding:16px 14px 10px;}
    .barra-guardar{padding:12px 14px;} .ocultar-chico{display:none;}
  }
</style>
</head>
<body>

<div class="page-header">
  <div class="header-row">
    <div>
      <h1 class="page-title"><span class="lg"><span class="sar">Sar</span><span class="k">K</span><span class="med">MED</span></span> <span class="sep">·</span> HISTORIAS CLÍNICAS</h1>
      <div class="page-subtitle">Circuito de valoración muscular</div>
    </div>
    <span class="contador" id="contador"></span>
  </div>
</div>

<div class="toolbar" id="toolbar">
  <input type="text" class="buscador" id="buscador" placeholder="Buscar por nombre, DNI o código…" autocomplete="off" oninput="filtrar(this.value)">
  <span style="flex:1"></span>
  <span id="zona-acciones"></span>
</div>

<div class="wrap" id="wrap"></div>

<!-- ══════════ BARRA DE GUARDADO ══════════ -->
<div class="barra-guardar" id="barra-guardar">
  <span class="aviso" id="aviso-guardar"></span>
  <button class="btn" onclick="volverALista()">← Volver a la lista</button>
  <button class="btn btn-primary" id="btn-guardar" onclick="guardarFicha()">Guardar ficha</button>
</div>

<!-- ══════════ MODAL: NUEVA EVALUACIÓN ══════════ -->
<div class="modal-bg" id="modal-nueva">
  <div class="modal">
    <div class="modal-head">Nueva evaluación</div>
    <div class="modal-body">
      <div class="campo">
        <label>Buscar al paciente en el padrón</label>
        <input type="text" id="busca-pac" placeholder="Nombre o DNI…" autocomplete="off" oninput="buscarPaciente(this.value)">
      </div>
      <div id="res-pacientes"></div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="cerrarModal('modal-nueva')">Cancelar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ════════════════════════════════════════════════════════════════
   SUPABASE
   ════════════════════════════════════════════════════════════════ */
const SUPABASE_URL = 'https://bqpjtoiictnzcasxfucf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_yvuXDxrkRrhXwmZBnE_a_Q_zDBz0iDi';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { lock: (name, acquireTimeout, fn) => fn() } });

/* ════════════════════════════════════════════════════════════════
   ESTADO
   ════════════════════════════════════════════════════════════════ */
let cargando   = true;
let evaluaciones = [];       // lista de HC con su paciente
let catalogo   = [];         // casilleros de antecedentes (vienen de la base)
let filtro     = '';
let vista      = 'lista';    // lista | ficha
let fichaActual = null;      // HC abierta
let solapa     = 'medica';
let miEmail    = '';
let accesos    = [];
let resultadosPac = [];
let nutri      = {};        // solapa de Nutrición de la ficha abierta
let adjuntos   = [];        // estudios cargados en la ficha abierta
let suelo      = {};        // solapa de Suelo Pélvico de la ficha abierta
let biolab     = {};        // solapa BiOLAB de la ficha abierta
let candidatosVald = [];    // perfiles posibles cuando VALD no identifica uno solo

/* Categoría libre del final: no tiene casilleros, solo texto. */
const CAT_OTROS = 'Otros';

/* ════════════════════════════════════════════════════════════════
   HELPERS
   ════════════════════════════════════════════════════════════════ */
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fechaLinda(iso){ return iso ? iso.split('-').reverse().join('/') : '—'; }
function edadDe(nac){
  if(!nac) return null;
  const [y,m,d] = nac.split('-').map(Number);
  const n = new Date(y, m-1, d), hoy = new Date();
  let e = hoy.getFullYear() - n.getFullYear();
  const mm = hoy.getMonth() - n.getMonth();
  if(mm < 0 || (mm === 0 && hoy.getDate() < n.getDate())) e--;
  return e;
}
function cerrarModal(id){ document.getElementById(id).classList.remove('activo'); }
function toast(msg, tipo){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast activo ' + (tipo || '');
  setTimeout(() => t.classList.remove('activo'), 2800);
}
function v(id){ const el = document.getElementById(id); return el ? el.value : null; }
function txt(id){ const s = (v(id) || '').trim(); return s ? s : null; }
function num(id){ const s = (v(id) || '').trim(); return s === '' ? null : Number(s); }
function chk(id){ const el = document.getElementById(id); return el ? !!el.checked : false; }

/* ════════════════════════════════════════════════════════════════
   PERMISOS · viven en sarkmed_accesos, no acá
   ════════════════════════════════════════════════════════════════ */
async function cargarSesionYAccesos(){
  try{
    const { data: { session } } = await sb.auth.getSession();
    miEmail = (session?.user?.email || '').toLowerCase().trim();
  }catch(e){ miEmail = ''; }
  try{
    const { data, error } = await sb.from('sarkmed_accesos').select('email, carga_hc').eq('activo', true);
    if(error) throw error;
    accesos = (data || []).map(a => ({ ...a, email: (a.email || '').toLowerCase().trim() }));
  }catch(e){ console.warn('No se pudieron leer los accesos de SarkMED:', e); accesos = []; }
}
function puedeCargar(){
  const mio = accesos.find(a => a.email === miEmail);
  return mio ? !!mio.carga_hc : true;   // sin fila (equipo del centro): puede
}

/* ════════════════════════════════════════════════════════════════
   CARGA
   ════════════════════════════════════════════════════════════════ */
async function cargarCatalogo(){
  const { data, error } = await sb
    .from('sarkmed_antecedentes_opciones')
    .select('categoria, orden_cat, opcion, orden')
    .eq('activo', true)
    .order('orden_cat').order('orden');
  if(error){ toast('Error al leer los antecedentes: ' + error.message, 'err'); catalogo = []; return; }
  catalogo = data || [];
}

async function cargarEvaluaciones(){
  cargando = true;
  const { data, error } = await sb
    .from('hc_sarkmed')
    .select('*, paciente:pacientes_sarkmed(id, apellido_nombre, dni, fecha_nacimiento, sexo, telefono, email, ocupacion, contacto_emergencia, contacto_emergencia_nombre)')
    .order('fecha', { ascending:false })
    .order('id',    { ascending:false })
    .limit(500);
  if(error) toast('Error al leer las historias: ' + error.message, 'err');
  evaluaciones = data || [];
  cargando = false;
}

async function refrescar(){
  if(cargando) return;
  await cargarEvaluaciones();
  render();
  toast('Historias actualizadas', 'ok');
}

/* ════════════════════════════════════════════════════════════════
   RENDER · LISTA
   ════════════════════════════════════════════════════════════════ */
function listaFiltrada(){
  const q = filtro.trim().toLowerCase();
  if(!q) return evaluaciones;
  return evaluaciones.filter(e =>
    (e.paciente?.apellido_nombre || '').toLowerCase().includes(q) ||
    (e.paciente?.dni || '').toLowerCase().includes(q) ||
    (e.codigo || '').toLowerCase().includes(q)
  );
}

function render(){
  if(vista === 'ficha'){ renderFicha(); return; }

  document.getElementById('toolbar').style.display = 'flex';
  document.getElementById('barra-guardar').classList.remove('activa');

  document.getElementById('zona-acciones').innerHTML =
    `<button class="btn" onclick="refrescar()" ${cargando ? 'disabled' : ''}>↻ Actualizar</button>` +
    (puedeCargar()
      ? '<button class="btn btn-primary" style="margin-left:8px" onclick="abrirNueva()">+ Nueva evaluación</button>'
      : '<span style="font-size:11.5px;color:var(--muted);margin-left:10px">Solo consulta</span>');

  if(cargando){
    document.getElementById('contador').textContent = 'Cargando…';
    document.getElementById('wrap').innerHTML = '<div class="vacio"><b>Cargando historias…</b>Un segundo.</div>';
    return;
  }

  const lista = listaFiltrada();
  document.getElementById('contador').textContent =
    filtro ? `${lista.length} de ${evaluaciones.length} evaluaciones`
           : `${evaluaciones.length} ${evaluaciones.length === 1 ? 'evaluación' : 'evaluaciones'}`;

  const wrap = document.getElementById('wrap');
  if(!evaluaciones.length){
    wrap.innerHTML = `<div class="vacio"><b>Todavía no hay historias clínicas</b>${
      puedeCargar() ? 'Empezá con “+ Nueva evaluación” y elegí al paciente del padrón.' : ''
    }</div>`;
    return;
  }
  if(!lista.length){
    // Ojo: acá se buscan EVALUACIONES, no personas. Si el paciente existe en el
    // padrón pero todavía no tiene ficha, la pantalla lo ofrece en vez de decir
    // "no hay nadie" — que es mentira y hace perder tiempo.
    wrap.innerHTML = `<div class="vacio">
      <b>Todavía no hay ninguna evaluación de “${esc(filtro)}”</b>
      <div style="font-size:12.5px;margin-bottom:14px">Esta pantalla lista evaluaciones, no el padrón.</div>
      <div id="sug-pacientes" style="max-width:420px;margin:0 auto;text-align:left"></div>
    </div>`;
    sugerirPacientes(filtro);
    return;
  }

  wrap.innerHTML = `
    <table class="tabla">
      <thead>
        <tr>
          <th>Paciente</th>
          <th class="ocultar-chico">Código</th>
          <th class="ocultar-chico">Fecha</th>
          <th>Estado</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        ${lista.map(e => `
          <tr>
            <td>
              <div class="pac-nombre">${
                (e.paciente?.apellido_nombre || '').trim() ? esc(e.paciente.apellido_nombre)
                  : '<span style="color:var(--rojo-x)">SIN PACIENTE</span>'
              }</div>
              <div class="pac-dni">DNI ${esc(e.paciente?.dni || '—')}</div>
            </td>
            <td class="ocultar-chico codigo">${esc(e.codigo || '—')}</td>
            <td class="ocultar-chico celda-dim">${fechaLinda(e.fecha)}</td>
            <td><span class="tag ${e.estado === 'CERRADA' ? 'tag-cerrada' : 'tag-abierta'}">${esc(e.estado || '')}</span></td>
            <td class="acciones"><button class="btn" onclick="abrirFicha(${e.id})">${puedeCargar() ? 'Abrir' : 'Ver'}</button></td>
          </tr>`).join('')}
      </tbody>
    </table>`;
}

/* Busca en el PADRÓN a quien no tiene evaluación todavía y ofrece crearla. */
async function sugerirPacientes(q){
  const cont = document.getElementById('sug-pacientes');
  if(!cont) return;
  const limpio = (q || '').replace(/[,()*%]/g, ' ').replace(/\s+/g, ' ').trim();
  if(limpio.length < 2) return;
  const soloNum = limpio.replace(/\D/g, '');
  const filtros = [`apellido_nombre.ilike.%${limpio}%`];
  if(soloNum.length >= 3) filtros.push(`dni.ilike.%${soloNum}%`);

  const { data, error } = await sb.from('pacientes_sarkmed')
    .select('id, apellido_nombre, dni, fecha_nacimiento, activo')
    .or(filtros.join(','))
    .order('apellido_nombre')
    .limit(5);
  if(error || !data || !data.length){
    cont.innerHTML = '<div style="font-size:12.5px;color:var(--muted);text-align:center">Tampoco aparece en el padrón. Cargalo primero en Padrón SARKMED.</div>';
    return;
  }
  resultadosPac = data;
  cont.innerHTML = '<div style="font-size:12.5px;font-weight:700;margin-bottom:8px">Está en el padrón. ¿Le abrimos la evaluación?</div>' +
    data.map((p, i) => `
      <div class="res-pac" onclick="crearEvaluacion(${i})">
        <div class="pac-nombre">${esc(p.apellido_nombre || '(sin nombre)')}</div>
        <div class="pac-dni">DNI ${esc(p.dni || '—')} · tocá para crear su evaluación</div>
      </div>`).join('');
}

function filtrar(val){ filtro = val || ''; if(vista === 'lista') render(); }

/* ════════════════════════════════════════════════════════════════
   NUEVA EVALUACIÓN
   ════════════════════════════════════════════════════════════════ */
function abrirNueva(){
  if(!puedeCargar()){ toast('No tenés permiso para cargar historias', 'err'); return; }
  document.getElementById('busca-pac').value = '';
  document.getElementById('res-pacientes').innerHTML =
    '<div style="font-size:12px;color:var(--muted)">Escribí para buscar en el padrón.</div>';
  document.getElementById('modal-nueva').classList.add('activo');
  setTimeout(() => document.getElementById('busca-pac').focus(), 60);
}

let timerBusca = null;
function buscarPaciente(q){
  clearTimeout(timerBusca);
  const cont = document.getElementById('res-pacientes');
  const txtq = (q || '').trim();
  if(txtq.length < 2){
    cont.innerHTML = '<div style="font-size:12px;color:var(--muted)">Escribí al menos 2 letras.</div>';
    return;
  }
  timerBusca = setTimeout(async () => {
    // Los caracteres que rompen el filtro or() de PostgREST se sacan antes.
    const limpio  = txtq.replace(/[,()*%]/g, ' ').replace(/\s+/g, ' ').trim();
    const soloNum = limpio.replace(/\D/g, '');
    if(!limpio){ cont.innerHTML = ''; return; }

    // Busca por nombre Y por DNI a la vez. SIN filtro por activo: las fichas
    // viejas pueden tener ese campo en null y quedaban invisibles.
    const filtros = [`apellido_nombre.ilike.%${limpio}%`];
    if(soloNum.length >= 3) filtros.push(`dni.ilike.%${soloNum}%`);

    const { data, error } = await sb.from('pacientes_sarkmed')
      .select('id, apellido_nombre, dni, fecha_nacimiento, activo')
      .or(filtros.join(','))
      .order('apellido_nombre')
      .limit(8);

    if(error){
      cont.innerHTML = `<div style="font-size:12px;color:var(--rojo-x)">Error al buscar: ${esc(error.message)}</div>`;
      return;
    }
    resultadosPac = data || [];
    if(!resultadosPac.length){
      cont.innerHTML = '<div style="font-size:12px;color:var(--muted)">No aparece nadie con ese nombre ni ese DNI. Fijate en el Padrón cómo está escrito.</div>';
      return;
    }
    // El nombre NUNCA va dentro del atributo onclick: se elige por índice.
    cont.innerHTML = resultadosPac.map((p, i) => `
      <div class="res-pac" onclick="crearEvaluacion(${i})">
        <div class="pac-nombre">${esc(p.apellido_nombre || '(sin nombre)')}${
          p.activo === false ? ' <span class="tag tag-abierta" style="background:var(--rojo-soft);color:#991b1b;border-color:#fecaca">de baja</span>' : ''
        }</div>
        <div class="pac-dni">DNI ${esc(p.dni || '—')}</div>
      </div>`).join('');
  }, 250);
}

async function crearEvaluacion(idx){
  const p = resultadosPac[idx];
  if(!p) return;
  const { data, error } = await sb.from('hc_sarkmed')
    .insert({ paciente_id: p.id, creado_por_email: miEmail })
    .select('id')
    .single();
  if(error){ toast('No se pudo crear la ficha: ' + error.message, 'err'); return; }
  cerrarModal('modal-nueva');
  await cargarEvaluaciones();
  abrirFicha(data.id);
}

async function abrirFicha(id){
  fichaActual = evaluaciones.find(e => e.id === id);
  if(!fichaActual){ toast('No encuentro esa ficha', 'err'); return; }
  vista = 'ficha';
  solapa = 'medica';
  await cargarNutricion(id);
  await cargarSuelo(id);
  await cargarBiolab(id);
  await cargarAdjuntos(id);
  render();
  window.scrollTo({ top:0, behavior:'smooth' });
}
function volverALista(){
  vista = 'lista'; fichaActual = null;
  render();
  window.scrollTo({ top:0, behavior:'smooth' });
}
function irSolapa(s){
  if(solapa === 'nutricion') levantarNutricion();
  if(solapa === 'suelo_pelvico') levantarSuelo();
  if(solapa === 'biolab') levantarBiolab();
  if(solapa === 'medica' && fichaActual) guardarAntecedentesEnMemoria();
  solapa = s;
  renderFicha();
}

/* Lo que BiOLAB le deja a la médica: su informe finalizado, en solo lectura.
   Mientras no esté finalizado, la médica ve que todavía se está cargando. */
function bloqueLoQueDejoBiolab(){
  const b = biolab || {};
  if(!b.finalizado && !b.informe_firmado){
    return `<div style="background:var(--panel-2);border:1px dashed var(--border);border-radius:8px;
                        padding:12px 14px;margin-bottom:14px;font-size:12.5px;color:var(--muted)">
      <b style="color:var(--text)">BiOLAB todavía no finalizó su informe.</b><br>
      Cuando lo firme, aparece acá para armar el informe final.
    </div>`;
  }
  const partes = [];
  if(b.diagnostico_sarcopenia) partes.push('Diagnóstico KWGS: <b>' + esc(b.diagnostico_sarcopenia) + '</b>');
  if(b.ishii_score != null)    partes.push('Ishii ' + b.ishii_score);
  if(b.sppb_total != null)     partes.push('SPPB ' + b.sppb_total + '/12');
  if(b.velocidad_marcha)       partes.push('marcha ' + b.velocidad_marcha + ' m/s');
  if(b.fuerza_relativa)        partes.push('fuerza relativa ' + b.fuerza_relativa + ' N/kg');

  return `<div style="background:var(--azul-soft);border:1px solid var(--azul-border);border-radius:8px;
                      padding:12px 14px;margin-bottom:14px">
    <div style="font-size:12px;font-weight:700;color:var(--azul-2);margin-bottom:6px">
      ✓ BiOLAB finalizó · ${esc(b.firmado_por || '')} ${b.firmado_en ? 'el ' + fechaLinda((b.firmado_en || '').slice(0,10)) : ''}
    </div>
    ${partes.length ? `<div style="font-size:12.5px;margin-bottom:8px">${partes.join(' · ')}</div>` : ''}
    ${b.informe ? `<details><summary style="cursor:pointer;font-size:12.5px;font-weight:600;color:var(--azul)">Ver el informe de BiOLAB</summary>
      <div style="white-space:pre-wrap;font-size:12.5px;margin-top:8px;max-height:280px;overflow:auto;
                  background:#fff;border:1px solid var(--border);border-radius:6px;padding:10px">${esc(b.informe)}</div>
    </details>` : ''}
  </div>`;
}

async function firmarInformeFinal(){
  const texto = txt('informe_final');
  if(!texto){ toast('No hay informe final para firmar', 'err'); return; }
  if(!confirm('Al firmar, el informe final queda cerrado con tu nombre y la fecha. ¿Firmar?')) return;
  const { error } = await sb.from('hc_sarkmed').update({
    informe_final: texto,
    sugerencias: txt('sugerencias'),
    informe_final_firmado_por: miEmail,
    informe_final_firmado_en: new Date().toISOString()
  }).eq('id', fichaActual.id);
  if(error){ toast('No se pudo firmar: ' + error.message, 'err'); return; }
  toast('Informe final firmado', 'ok');
  await cargarEvaluaciones();
  fichaActual = evaluaciones.find(e => e.id === fichaActual.id) || fichaActual;
  renderFicha();
}

/* Los casilleros salen del catálogo de la base, no de una lista escrita acá. */
function gridAntecedentes(f, ro){
  const ant = f.antecedentes || {};
  const cats = [];
  catalogo.forEach(c => {
    let cat = cats.find(x => x.nombre === c.categoria);
    if(!cat){ cat = { nombre:c.categoria, opciones:[] }; cats.push(cat); }
    cat.opciones.push(c.opcion);
  });
  cats.push({ nombre: CAT_OTROS, opciones: [] });   // categoría libre del final

  return cats.map((cat, ci) => {
    const guardado = ant[cat.nombre] || {};
    const marcados = guardado.marcados || [];
    const chips = cat.opciones.map((op, oi) =>
      `<button class="chip ${marcados.includes(op) ? 'on' : ''}"
               id="ant_${ci}_${oi}" data-cat="${esc(cat.nombre)}" data-opcion="${esc(op)}"
               onclick="togAnt(${ci},${oi})" ${ro}>${esc(op)}</button>`).join('');
    return `
      <div class="cat">
        <div class="cat-nom">${esc(cat.nombre)}</div>
        ${chips ? `<div class="chips">${chips}</div>` : ''}
        <textarea class="detalle" id="det_${ci}" data-cat="${esc(cat.nombre)}"
                  placeholder="${cat.opciones.length ? 'Detalle (opcional): lo que el casillero no dice…' : 'Otros antecedentes…'}" ${ro}>${esc(guardado.detalle || '')}</textarea>
      </div>`;
  }).join('');
}

/* Tildar / destildar */
function tog(campo){
  if(!puedeCargar()) return;
  fichaActual[campo] = !fichaActual[campo];
  renderFicha();
}
function togAnt(ci, oi){
  if(!puedeCargar()) return;
  guardarAntecedentesEnMemoria();          // no perder lo escrito al redibujar
  const btn = document.getElementById(`ant_${ci}_${oi}`);
  const cat = btn.dataset.cat, op = btn.dataset.opcion;
  const ant = fichaActual.antecedentes || (fichaActual.antecedentes = {});
  const nodo = ant[cat] || (ant[cat] = { marcados: [], detalle: '' });
  nodo.marcados = nodo.marcados || [];
  const i = nodo.marcados.indexOf(op);
  if(i >= 0) nodo.marcados.splice(i, 1); else nodo.marcados.push(op);
  renderFicha();
}
/* Los detalles se escriben en textareas: antes de redibujar hay que levantarlos. */
function guardarAntecedentesEnMemoria(){
  const ant = fichaActual.antecedentes || (fichaActual.antecedentes = {});
  document.querySelectorAll('textarea.detalle').forEach(t => {
    const cat = t.dataset.cat;
    const nodo = ant[cat] || (ant[cat] = { marcados: [], detalle: '' });
    nodo.detalle = t.value.trim();
  });
}

/* Sí / No / sin preguntar. El tercer estado es a propósito: en una HC
   "no lo sé" no es lo mismo que "no". Se vuelve a tocar y se destilda. */
function siNo(campo, valor, ro){
  const v = valor;
  return `<div class="chips">
    <button class="chip ${v === true  ? 'on' : ''}" onclick="setSuelo('${campo}', true)"  ${ro}>Sí</button>
    <button class="chip ${v === false ? 'on' : ''}" onclick="setSuelo('${campo}', false)" ${ro}>No</button>

}

function setSuelo(campo, valor){
  if(!puedeCargar()) return;
  levantarSuelo();
  suelo[campo] = (suelo[campo] === valor) ? null : valor;   // volver a tocar, destilda
  renderFicha();
}
function togUbicacion(i){
  if(!puedeCargar()) return;
  levantarSuelo();
  const k = UBIC_PROLAPSO[i][0];
  const lista = suelo.prolapso_ubicacion || (suelo.prolapso_ubicacion = []);
  const p = lista.indexOf(k);
  if(p >= 0) lista.splice(p, 1); else lista.push(k);
  renderFicha();
}
const CAMPOS_SUELO_TEXTO = ['embarazos_partos','cirugias_previas','cirugias_abdominales','otros_antecedentes',
  'frecuencia_urinaria','inspeccion','palpacion','ecografia','urodinamia','otras_pruebas','diagnostico'];

function levantarSuelo(){
  if(solapa !== 'suelo_pelvico') return;
  CAMPOS_SUELO_TEXTO.forEach(c => { if(document.getElementById(c)) suelo[c] = txt(c); });
}

async function guardarSuelo(){
  levantarSuelo();
  const fila = { hc_id: fichaActual.id, editado_en: new Date().toISOString(), editado_por_email: miEmail };
  CAMPOS_SUELO_TEXTO.forEach(c => { fila[c] = suelo[c] || null; });
  ['itu_recurrentes','patologias_digestivas','incontinencia_urinaria','incontinencia_fecal',
   'dolor_pelvico','sensacion_peso_prolapso','urgencia_miccional','prolapsos']
    .forEach(c => { fila[c] = (suelo[c] === true || suelo[c] === false) ? suelo[c] : null; });
  fila.escala_oxford      = suelo.escala_oxford ?? null;
  fila.escala_popq        = suelo.escala_popq || null;
  fila.prolapso_ubicacion = suelo.prolapso_ubicacion || [];

  const btn = document.getElementById('btn-guardar');
  btn.disabled = true; btn.textContent = 'Guardando…';
  const { error } = await sb.from('hc_sarkmed_suelo_pelvico').upsert(fila, { onConflict: 'hc_id' });
  btn.disabled = false; btn.textContent = 'Guardar ficha';

  if(error){ toast('No se pudo guardar Suelo Pélvico: ' + error.message, 'err'); return; }
  toast('Suelo pélvico guardado', 'ok');
  await cargarSuelo(fichaActual.id);
  renderFicha();
}

/* Todos los cálculos, en un solo lugar. Nada de esto se escribe a mano. */
/* Las entradas del Ishii NO se vuelven a pedir: se derivan.
   Fuerza  = la mejor prensión de los dos lados, pasada de newtons a kilos.
   Pantorrilla = la mayor de las dos que midió Nutrición.
   Si falta el dato de origen, recién ahí aparece el campo para cargarlo a mano. */
function entradasIshii(){
  const n = id => { const el = document.getElementById(id); const s = el ? el.value : ''; return s === '' ? null : Number(s); };
  const pi = n('prension_izq_n'), pd = n('prension_der_n');
  const fzAuto = (pi || pd) ? (Math.max(pi || 0, pd || 0) / G) : null;
  const panAuto = Math.max(Number(nutri.per_pantorrilla_der) || 0, Number(nutri.per_pantorrilla_izq) || 0) || null;
  return {
    fzAuto, panAuto,
    fz:  fzAuto  != null ? fzAuto  : n('ishii_fuerza_kg'),
    pan: panAuto != null ? panAuto : n('ishii_pantorrilla_cm')
  };
}

function pintarEntradasIshii(ent){
  const cf = document.getElementById('ishii-fuerza-caja');
  const cp = document.getElementById('ishii-pantorrilla-caja');
  const inF = document.getElementById('ishii_fuerza_kg');
  const inP = document.getElementById('ishii_pantorrilla_cm');
  if(cf && inF){
    if(ent.fzAuto != null){
      cf.innerHTML = `<b>${ent.fzAuto.toFixed(1)} kg</b> <span style="color:var(--muted);font-size:11.5px">· de la mejor prensión cargada abajo</span>`;
      inF.style.display = 'none';
    }else{
      cf.innerHTML = '<span style="color:var(--muted)">Cargá la prensión abajo y aparece sola. Si no hay handgrip, escribila acá:</span>';
      inF.style.display = '';
    }
  }
  if(cp && inP){
    if(ent.panAuto != null){
      cp.innerHTML = `<b>${ent.panAuto.toFixed(1)} cm</b> <span style="color:var(--muted);font-size:11.5px">· la mayor de las que midió Nutrición</span>`;
      inP.style.display = 'none';
    }else{
      cp.innerHTML = '<span style="color:var(--muted)">Falta el perímetro de pantorrilla en Nutrición. Si no se midió, escribilo acá:</span>';
      inP.style.display = '';
    }
  }
}

function calcularBiolab(){
  const caja = document.getElementById('calculos-biolab');
  if(!caja) return;
  const n = id => { const el = document.getElementById(id); const s = el ? el.value : ''; return s === '' ? null : Number(s); };
  const p = fichaActual.paciente || {};
  const edad = edadDe(p.fecha_nacimiento);
  const peso = Number(nutri.peso_kg) || null;      // viene de la solapa Nutrición
  const sexo = (p.sexo || '').toUpperCase();
  const L = [];

  // Prensión: de N a kg, y el corte de EWGSOP2
  const pi = n('prension_izq_n'), pd = n('prension_der_n');
  if(pi || pd){
    const kgI = pi ? (pi / G) : null, kgD = pd ? (pd / G) : null;
    const mejor = Math.max(kgI || 0, kgD || 0);
    const corte = sexo.startsWith('M') && !sexo.startsWith('MU') ? 27 : 16;   // varón 27 kg, mujer 16 kg
    L.push(`<b>Prensión:</b> ${kgI ? kgI.toFixed(1) + ' kg izq' : '—'} · ${kgD ? kgD.toFixed(1) + ' kg der' : '—'}` +
           (kgI && kgD ? ` · asimetría ${asim(kgI, kgD)} %` : '') +
           ` → corte EWGSOP2 ${corte} kg: <b>${mejor >= corte ? 'por encima' : 'POR DEBAJO'}</b>`);
  }

  // SARC-F: no se vuelve a pedir, sale de la solapa Médica
  if(fichaActual.sarc_f != null){
    L.push(`<b>SARC-F:</b> ${fichaActual.sarc_f} → ${fichaActual.sarc_f >= 4 ? '<b>sugestivo de sarcopenia (≥4)</b>' : 'por debajo del punto de corte'} <span style="color:var(--muted);font-size:11px">· de la solapa Médica</span>`);
  }

  // Ishii: la fuerza sale del handgrip de acá abajo y la pantorrilla de Nutrición.
  // Solo si falta el dato de origen se habilita el campo a mano.
  const ent = entradasIshii();
  const fz = ent.fz, pan = ent.pan;
  pintarEntradasIshii(ent);
  if(edad != null && fz && pan){
    const ishii = (0.80 * edad) - (5.09 * fz) - (3.28 * pan) + 206;
    const franja = ishii >= 140 ? 'sarcopenia severa (≥140)' : ishii >= 105 ? 'alto riesgo (≥105)' : 'sin riesgo por Ishii';
    L.push(`<b>Ishii:</b> ${ishii.toFixed(1)} puntos → ${franja}`);
  }

  // IMTP
  const ii = n('imtp_pico_izq_n'), idd = n('imtp_pico_der_n');
  if(ii && idd){
    const total = ii + idd;
    L.push(`<b>IMTP:</b> ${total.toFixed(0)} N sumando ambos lados · asimetría ${asim(ii, idd)} %` +
           (peso ? ` · fuerza relativa <b>${(total / peso).toFixed(2)} N/kg</b>` : ' · (falta el peso en Nutrición para la fuerza relativa)'));
  }
  const ri = n('imtp_rfd_izq'), rd = n('imtp_rfd_der');
  if(ri && rd) L.push(`<b>RFD 100 ms:</b> asimetría ${asim(ri, rd)} %${Math.abs(asim(ri, rd)) >= 20 ? ' · <b>por encima del 20 % habitual</b>' : ''}`);

  // Marcha
  const m4 = n('marcha_4m_seg');
  if(m4 > 0){
    const vel = 4 / m4;
    L.push(`<b>Velocidad de marcha:</b> ${vel.toFixed(2)} m/s → ${vel <= 0.8 ? '<b>bajo el umbral de fragilidad (0,8)</b>' : vel < 1 ? 'movilidad moderada' : 'adecuada para independencia'}`);
  }
  const tug = n('tug_seg');
  if(tug) L.push(`<b>TUG:</b> ${tug} s → ${tug < 10 ? 'independiente, bajo riesgo' : tug < 20 ? 'adecuada, algo de lentitud' : tug < 30 ? 'limitaciones, riesgo de caída' : 'dependencia, alto riesgo'}`);

  // SPPB
  const sb = n('sppb_balance'), sm = n('sppb_marcha'), sc = n('sppb_chair');
  if(sb != null || sm != null || sc != null){
    const t = (sb || 0) + (sm || 0) + (sc || 0);
    const f = t <= 3 ? 'limitación severa' : t <= 6 ? 'limitación moderada' : t <= 9 ? 'limitación leve' : 'función física normal';
    L.push(`<b>SPPB:</b> ${t}/12 → ${f}`);
  }

  // Equilibrio monopodal
  const ai = n('sls_area_izq'), ad = n('sls_area_der');
  if(ai && ad){
    const veces = (Math.max(ai, ad) / Math.min(ai, ad));
    L.push(`<b>Apoyo monopodal:</b> asimetría ${asim(ai, ad)} % · el lado peor oscila <b>${veces.toFixed(1)} veces</b> más que el otro`);
  }

  // SMI, que viene de Nutrición
  if(nutri.smi){
    const corteSmi = sexo.startsWith('M') && !sexo.startsWith('MU') ? 7.0 : 5.5;
    L.push(`<b>SMI (de Nutrición):</b> ${nutri.smi} kg/m² → corte EWGSOP2 ${corteSmi}: ${Number(nutri.smi) < corteSmi ? '<b>POR DEBAJO</b>' : 'por encima'}`);
  }

  caja.innerHTML = L.length
    ? L.join('<br>') + '<div style="margin-top:9px;font-size:11.5px;color:var(--azul-2)">Estos números orientan. El diagnóstico lo marca quien evalúa.</div>'
    : '<span style="color:var(--muted)">Cargá los valores de arriba y acá aparecen los cálculos.</span>';
}
function asim(a, b){
  const may = Math.max(a, b), men = Math.min(a, b);
  return may ? Math.round(((may - men) / may) * 100) : 0;
}

function setBiolab(campo, valor){
  if(!puedeCargar()) return;
  levantarBiolab();
  biolab[campo] = (biolab[campo] === valor) ? null : valor;
  renderFicha();
}
/* ════════════════════════════════════════════════════════════════
   TRAER DE VALD
   Misma cañería que usa el apartado VALD: la edge function vald-datos-ts.
   Busca por perfil guardado, o por nombre + DNI la primera vez.
   Solo rellena lo que MIDE el equipo; nunca pisa un dato ya cargado a mano
   salvo que el campo esté vacío.
   ════════════════════════════════════════════════════════════════ */
function ponerSiVacio(id, valor){
  const el = document.getElementById(id);
  if(!el || valor == null || isNaN(valor)) return false;
  if((el.value || '').trim() !== '') return false;      // ya había algo cargado: no se pisa
  el.value = Math.round(Number(valor) * 10) / 10;
  return true;
}

async function traerDeVald(forzarProfileId){
  const p = fichaActual.paciente || {};
  const btn = document.getElementById('btn-vald');
  const est = document.getElementById('vald-estado');
  btn.disabled = true; btn.textContent = 'Buscando…';
  est.innerHTML = '<span style="color:var(--muted)">Buscando el perfil en VALD y trayendo la toma…</span>';
  try{
    let manual = (v('vald_profile_manual') || '').trim();
    // Un Profile ID es un código largo, no un nombre: si pegaron el nombre, se ignora
    if(manual && !/^[0-9a-f-]{20,}$/i.test(manual)){
      est.innerHTML = '<span style="color:var(--rojo-x)">Eso no parece un Profile ID: es el código largo con guiones que sale en la URL del Hub, después de /profiles/. Lo ignoro y busco por nombre.</span>';
      manual = '';
    }
    const pid = forzarProfileId || manual || p.vald_profile_id || '';
    // OJO: un input date a medio completar devuelve cadena vacía, y así se
    // buscaba en los últimos 120 días sin que nadie se enterara. Ahora el rango
    // es explícito y la fecha exacta solo manda si está completa.
    const fecha = (document.getElementById('vald_fecha') || {}).value || '';
    const rango = Number((document.getElementById('vald_rango') || {}).value || 1095);
    let desdeISO = '';
    if(rango === 0){
      if(!fecha){
        est.innerHTML = '<span style="color:var(--rojo-x)">Elegiste “fecha exacta” pero la fecha está incompleta. Completala (día, mes y año) o elegí un rango.</span>';
        return;
      }
      desdeISO = fecha;
    }else{
      const d = new Date(); d.setDate(d.getDate() - rango);
      desdeISO = d.toISOString().slice(0, 10);
    }
    const desde = '&from=' + encodeURIComponent(desdeISO + 'T00:00:00.0000000Z');
    const desdeLindo = desdeISO.split('-').reverse().join('/');

    // En el Hub el nombre puede estar escrito de otra forma y el DNI puede no
    // figurar. En vez de rendirse al primer intento, se prueban variantes.
    const intentos = [];
    if(pid){
      intentos.push({ q: 'profileId=' + encodeURIComponent(pid), como: 'por perfil' });
    }else{
      const nom = (p.apellido_nombre || '').trim();
      const titulo = nom.toLowerCase().replace(/\b\w/g, c => c.toUpperCase());   // GRACIELA BRUNO → Graciela Bruno
      const partes = titulo.split(/\s+/);
      const invertido = partes.length > 1 ? partes.slice(1).join(' ') + ' ' + partes[0] : titulo;
      if(p.dni) intentos.push({ q: 'nombre=' + encodeURIComponent(nom) + '&dni=' + encodeURIComponent(p.dni), como: 'nombre y DNI' });
      intentos.push({ q: 'nombre=' + encodeURIComponent(nom),        como: 'solo el nombre' });
      intentos.push({ q: 'nombre=' + encodeURIComponent(titulo),     como: 'el nombre con mayúscula inicial' });
      if(invertido !== titulo)
        intentos.push({ q: 'nombre=' + encodeURIComponent(invertido), como: 'nombre y apellido al revés' });
    }

    let datos = null, comoSalio = '';
    for(const intento of intentos){
      const resp = await fetch(SUPABASE_URL + '/functions/v1/vald-datos-ts?' + intento.q + desde,
        { headers: { 'Authorization': 'Bearer ' + SUPABASE_KEY, 'apikey': SUPABASE_KEY } });
      const txtResp = await resp.text();
      let d;
      try { d = JSON.parse(txtResp); } catch { throw new Error(txtResp || ('HTTP ' + resp.status)); }
      if(!resp.ok) throw new Error('VALD HTTP ' + resp.status);
      datos = d; comoSalio = intento.como;
      // Sirve si identificó un perfil, si hay que elegir, o si ya trajo datos
      if(d.needsPicker || d.perfil || d.profileId ||
         (d.fuerza || []).length || (d.forceDecks || []).length || (d.movilidad || []).length) break;
    }
    if(!datos) throw new Error('VALD no respondió');

    // Varios perfiles posibles: que elija quien evalúa, no el sistema
    if(datos.needsPicker){
      candidatosVald = datos.candidatos || [];
      est.innerHTML = '<div style="margin-bottom:6px">Hay más de un perfil posible. ¿Cuál es?</div>' +
        candidatosVald.map((c, i) =>
          `<div class="res-pac" onclick="traerDeVald(candidatosVald[${i}].profileId)">
             <div class="pac-nombre">${esc(c.nombre || '(sin nombre)')}</div>
             <div class="pac-dni">${esc(c.profileId || '')}</div>
           </div>`).join('');
      return;
    }

    const cortes = await cortesAsimetria();
    const n = aplicarDatosVald(datos, cortes);

    if(!n.total){
      const perfil = datos.perfil || null;
      if(perfil){
        // El perfil existe: se vincula igual, así la próxima vez no hay que buscarlo
        const pidOk = datos.profileId || perfil.profileId;
        if(pidOk){
          await sb.from('pacientes_sarkmed').update({ vald_profile_id: pidOk }).eq('id', p.id);
          p.vald_profile_id = pidOk;
          const cajaP = document.getElementById('vald-perfil');
          if(cajaP) cajaP.textContent = 'Vinculado ✓';
        }
        est.innerHTML = '<span style="color:var(--rojo-x)"><b>Encontré el perfil</b> (' + esc(perfil.nombre || '') + ')' +
          ' pero no encontré tomas desde el ' + esc(desdeLindo) + '.' +
          ' Si la evaluación es anterior, ampliá el rango o poné la fecha exacta del día de la toma.</span>';
      }else{
        est.innerHTML = '<span style="color:var(--rojo-x)"><b>VALD no encontró el perfil.</b> Probé por nombre y DNI, ' +
          'solo por nombre, con mayúscula inicial y con el apellido al revés, y ninguna dio.<br>' +
          'Andá al Hub, abrí a ' + esc(p.apellido_nombre || '') + ', y copiá de la barra de direcciones el código largo ' +
          'que aparece después de /profiles/ — ese es el Profile ID. Pegalo en el campo de la derecha y volvé a tocar Traer.</span>';
      }
      return;
    }

    // Vínculo guardado para la próxima vez
    const profileId = datos.profileId || (datos.perfil && datos.perfil.profileId);
    if(profileId && p.vald_profile_id !== profileId){
      await sb.from('pacientes_sarkmed').update({ vald_profile_id: profileId }).eq('id', p.id);
      p.vald_profile_id = profileId;
      biolab.vald_profile_id = profileId;
      const cajaP = document.getElementById('vald-perfil');
      if(cajaP) cajaP.textContent = 'Vinculado ✓';
    }
    biolab.vald_traido_en = new Date().toISOString();

    est.innerHTML = `<span style="color:var(--verde)"><b>Listo</b> (tomas desde el ${esc(desdeLindo)}): ${n.detalle.join(' · ')}.</span>` +
      (n.pisados ? ` <span style="color:var(--muted)">Lo que ya estaba cargado no se tocó (${n.pisados}).</span>` : '') +
      ' <span style="color:var(--muted)">Revisá y tocá Guardar ficha.</span>';
    calcularBiolab();
  }catch(e){
    est.innerHTML = '<span style="color:var(--rojo-x)">⚠️ ' + esc(String(e && e.message ? e.message : e)) + '</span>';
  }finally{
    btn.disabled = false; btn.textContent = '⬇ Traer de VALD';
  }
}

/* Mapeo VALD → ficha. Dos cosas distintas:
   1. Los pocos valores que alimentan cálculos van a sus campos.
   2. TODO lo demás se vuelca en los resúmenes, con la misma marca que usa el
      apartado VALD: 🟢 dentro de norma, 🟡 al límite, 🔴 fuera, ⚠️ toma dudosa.
   Los cortes salen de biolab_normas, no de números escritos acá. */

/* Métricas de ForceDecks donde la asimetría izq/der es confiable (mismo set que VALD) */
const FD_ASIM_OK = new Set([
  'Peak Force','Eccentric Peak Force','Concentric Peak Force',
  'Eccentric Mean Force','Concentric Mean Force','Eccentric Impulse','Concentric Impulse',
  'Eccentric Deceleration RFD','Eccentric Deceleration Peak Force','Eccentric Deceleration Mean Force',
  'Mean Force','Takeoff Peak Force','Eccentric:Concentric Mean Force Ratio'
]);
const FD_TASA = new Set(['Eccentric Deceleration RFD','Eccentric:Concentric Mean Force Ratio']);
const esPruebaEquilibrio = (n) => /quiet stand|single leg|tandem|balance|monopodal|stance/i.test(n || '');

async function cortesAsimetria(){
  try{
    const { data } = await sb.from('biolab_normas')
      .select('test_id,bloque,corte_verde,corte_amarillo')
      .eq('test_id', 'R-LSI').eq('bloque', 'GENERICA').maybeSingle();
    return {
      verde: (data && data.corte_verde    != null) ? Number(data.corte_verde)    : 10,
      amar:  (data && data.corte_amarillo != null) ? Number(data.corte_amarillo) : 15
    };
  }catch(e){ return { verde: 10, amar: 15 }; }
}

function aplicarDatosVald(datos, cortes){
  const detalle = [];
  let total = 0, pisados = 0;
  const contar = (ok, etiqueta) => { if(ok){ total++; detalle.push(etiqueta); } else pisados++; };
  const c = cortes || { verde: 10, amar: 15 };
  const colorAsim = a => { a = Math.abs(Number(a) || 0); return a < c.verde ? '🟢' : (a <= c.amar ? '🟡' : '🔴'); };

  const hallazgos = [];   // solo lo que NO está bien
  const L_fuerza = [], L_potencia = [], L_equilibrio = [], L_movilidad = [];

  // ── FUERZA (DynaMo): entra TODA, no solo la prensión ──────────────
  for(const f of (datos.fuerza || [])){
    const sinDato = (f.izquierda_N == null || f.izquierda_N === 0) && (f.derecha_N == null || f.derecha_N === 0);
    const unLado  = !sinDato && ((f.izquierda_N == null) !== (f.derecha_N == null));
    if(sinDato){
      L_fuerza.push(`⚠️ ${f.grupo}: sin registro de fuerza — revisar la toma`);
      hallazgos.push(`⚠️ ${f.grupo}: la toma no registró fuerza`);
      continue;
    }
    if(unLado){
      L_fuerza.push(`⚠️ ${f.grupo}: medición de UN SOLO LADO (izq ${f.izquierda_N ?? '—'} / der ${f.derecha_N ?? '—'} N)`);
      hallazgos.push(`⚠️ ${f.grupo}: se midió un solo lado — posible fallo de equipo`);
      continue;
    }
    const em = colorAsim(f.asimetria_pct);
    const debil = (f.izquierda_N < f.derecha_N) ? 'IZQUIERDO' : (f.derecha_N < f.izquierda_N ? 'DERECHO' : 'simétrico');
    let linea = `${em} ${f.grupo}: izq ${f.izquierda_N} N / der ${f.derecha_N} N · asimetría ${f.asimetria_pct} % · lado más débil: ${debil}`;
    if(/prensi|grip/i.test(f.grupo || '')){
      const Lk = f.izquierda_N / G, Rk = f.derecha_N / G;
      linea += ` · ${Lk.toFixed(1)} / ${Rk.toFixed(1)} kg`;
      if(Math.max(Lk, Rk) < 16) hallazgos.push(`🔴 Prensión por debajo del corte de EWGSOP2 (16 kg): mejor mano ${Math.max(Lk, Rk).toFixed(1)} kg`);
    }
    L_fuerza.push(linea);
    if(em !== '🟢') hallazgos.push(`${em} ${f.grupo}: asimetría ${f.asimetria_pct} % (lado más débil: ${debil})`);
  }

  // ── FORCEDECKS: TODAS las métricas de TODAS las pruebas ───────────
  for(const t of (datos.forceDecks || [])){
    const destino = esPruebaEquilibrio(t.prueba) ? L_equilibrio : L_potencia;
    destino.push(`— ${t.prueba} —`);
    for(const nombre in (t.resultados || {})){
      const r = t.resultados[nombre] || {};
      const lados = r.lados || {};
      const u = r.unidad || '';
      const L = lados.Left, R = lados.Right, A = lados.Asym;
      const uni = (lados.Trial != null) ? lados.Trial : lados.Both;

      if(FD_ASIM_OK.has(nombre) && L != null && R != null){
        const tasa = FD_TASA.has(nombre);
        const mag = Math.max(Math.abs(L), Math.abs(R));
        if(!tasa && (L < 0 || R < 0)){
          destino.push(`⚠️ ${nombre}: izq ${L} / der ${R} ${u} — fuerza negativa, posible artefacto`);
          hallazgos.push(`⚠️ ${t.prueba} · ${nombre}: valor negativo, revisar la toma`);
          continue;
        }
        if(mag < 1){ destino.push(`⚪ ${nombre}: izq ${L} / der ${R} ${u} (valor ~0)`); continue; }
        const asim = (A != null) ? A : Math.round((R - L) / (mag || 1) * 1000) / 10;
        const em = colorAsim(asim);
        const menor = (L < R) ? 'IZQUIERDO' : (R < L ? 'DERECHO' : 'simétrico');
        destino.push(`${em} ${nombre}: izq ${L} / der ${R} ${u} · asimetría ${asim} % · menor: ${menor}`);
        if(em !== '🟢') hallazgos.push(`${em} ${t.prueba} · ${nombre}: asimetría ${asim} % (menor: ${menor})`);
        continue;
      }
      // Área del apoyo monopodal y RFD: en VALD quedan informativas porque no son
      // asimetría de fuerza. Acá SÍ se marcan: son las dos que más dicen sobre
      // riesgo de caída — cuánto oscila un lado más que el otro, y cuánto tarda
      // en producir fuerza.
      if(/area of cop ellipse|rfd/i.test(nombre) && L != null && R != null && Math.max(L, R) > 0){
        const mayor = Math.max(Math.abs(L), Math.abs(R)), menorV = Math.min(Math.abs(L), Math.abs(R));
        const asim = Math.round((mayor - menorV) / (mayor || 1) * 1000) / 10;
        const em = colorAsim(asim);
        const esArea = /area of cop/i.test(nombre);
        const veces = menorV > 0 ? (mayor / menorV) : null;
        const peor = esArea ? ((Math.abs(L) > Math.abs(R)) ? 'IZQUIERDO' : 'DERECHO')   // más área = peor control
                            : ((Math.abs(L) < Math.abs(R)) ? 'IZQUIERDO' : 'DERECHO');  // menos RFD = más lento
        destino.push(`${em} ${nombre}: izq ${L} / der ${R} ${u} · diferencia ${asim} %` +
          (veces ? ` · ${veces.toFixed(1)} veces` : '') + ` · peor: ${peor}`);
        if(em !== '🟢'){
          hallazgos.push(esArea
            ? `${em} ${t.prueba}: el apoyo ${peor.toLowerCase()} oscila ${veces ? veces.toFixed(1) + ' veces' : asim + ' %'} más que el otro`
            : `${em} ${t.prueba} · ${nombre}: el lado ${peor.toLowerCase()} tarda más en producir fuerza (diferencia ${asim} %)`);
        }
        continue;
      }
      if(L != null && R != null)      destino.push(`⚪ ${nombre}: izq ${L} / der ${R} ${u}`.trim());
      else if(uni != null)            destino.push(`⚪ ${nombre}: ${uni} ${u}`.trim());
    }
  }

  // ── MOVILIDAD (HumanTrak / ROM de DynaMo) ─────────────────────────
  for(const pr of (datos.movilidad || [])){
    const met = pr.metricas || [];
    L_movilidad.push(`— ${pr.prueba} —`);
    for(const m of met){
      const unLado = ((m.izquierda == null) !== (m.derecha == null)) && (m.valor == null);
      if(unLado){
        L_movilidad.push(`⚠️ ${m.metrica}: un solo lado (izq ${m.izquierda ?? '—'} / der ${m.derecha ?? '—'}°)`);
        hallazgos.push(`⚠️ ${pr.prueba} · ${m.metrica}: se midió un solo lado`);
        continue;
      }
      if(m.asimetria_pct == null){ L_movilidad.push(`🟢 ${m.metrica}: ${m.valor}°`); continue; }
      const em = colorAsim(m.asimetria_pct);
      const menor = (m.izquierda < m.derecha) ? 'IZQUIERDO' : (m.derecha < m.izquierda ? 'DERECHO' : 'simétrico');
      L_movilidad.push(`${em} ${m.metrica}: izq ${m.izquierda}° / der ${m.derecha}° · asimetría ${m.asimetria_pct} % · menor: ${menor}`);
      if(em !== '🟢') hallazgos.push(`${em} ${pr.prueba} · ${m.metrica}: asimetría ${m.asimetria_pct} % (menor: ${menor})`);
    }
  }

  // ── POSTURA ───────────────────────────────────────────────────────
  const post = datos.postura || null;
  if(post && typeof post === 'object'){
    const lineas = Object.keys(post)
      .filter(k => post[k] != null && typeof post[k] !== 'object')
      .map(k => `⚪ ${k}: ${post[k]}`);
    if(lineas.length){ L_movilidad.push('— Postura estática —'); L_movilidad.push(...lineas); }
  }

  // ── Los pocos valores que alimentan cálculos ──────────────────────
  const grip = (datos.fuerza || []).find(f => /prensi|grip/i.test(f.grupo || ''));
  if(grip){
    const a = ponerSiVacio('prension_izq_n', grip.izquierda_N);
    const b = ponerSiVacio('prension_der_n', grip.derecha_N);
    contar(a || b, 'prensión');
  }
  const imtp = (datos.forceDecks || []).find(t => /isometric mid|imtp/i.test(t.prueba || ''));
  if(imtp && imtp.resultados){
    const res = imtp.resultados;
    const pico = res['Peak Force'] || res['Peak Vertical Force'];
    if(pico && pico.lados){
      const a = ponerSiVacio('imtp_pico_izq_n', pico.lados.Left);
      const b = ponerSiVacio('imtp_pico_der_n', pico.lados.Right);
      contar(a || b, 'IMTP');
    }
    const kRfd = Object.keys(res).find(k => /rfd/i.test(k) && /100/.test(k)) || Object.keys(res).find(k => /rfd/i.test(k));
    if(kRfd && res[kRfd].lados){
      const a = ponerSiVacio('imtp_rfd_izq', res[kRfd].lados.Left);
      const b = ponerSiVacio('imtp_rfd_der', res[kRfd].lados.Right);
      contar(a || b, 'RFD');
    }
  }
  const sls = (datos.forceDecks || []).find(t => /single leg|monopodal|unilateral stance/i.test(t.prueba || ''));
  if(sls && sls.resultados){
    const kArea = Object.keys(sls.resultados).find(k => /area of cop ellipse/i.test(k));
    if(kArea && sls.resultados[kArea].lados){
      const a = ponerSiVacio('sls_area_izq', sls.resultados[kArea].lados.Left);
      const b = ponerSiVacio('sls_area_der', sls.resultados[kArea].lados.Right);
      contar(a || b, 'apoyo monopodal');
    }
  }

  // ── Los resúmenes se llenan con el volcado completo del Hub ───────
  const volcar = (id, lineas) => {
    const el = document.getElementById(id);
    if(!el || !lineas.length) return false;
    el.value = lineas.join('\n');
    return true;
  };
  if(volcar('resumen_neuromuscular', L_fuerza))   detalle.push('fuerza completa');
  if(volcar('resumen_potencia', L_potencia))      detalle.push('ForceDecks completo');
  if(volcar('resumen_equilibrio', L_equilibrio))  detalle.push('equilibrio');
  if(volcar('resumen_movilidad', L_movilidad))    detalle.push('movilidad y postura');
  if(L_fuerza.length || L_potencia.length || L_equilibrio.length || L_movilidad.length) total++;

  // ── Hallazgos: lo que NO está bien, junto y a la vista ────────────
  const cajaH = document.getElementById('hallazgos');
  if(cajaH) cajaH.value = hallazgos.length ? hallazgos.join('\n') : 'Sin hallazgos fuera de norma en esta toma.';
  const panel = document.getElementById('panel-hallazgos');
  if(panel){
    panel.innerHTML = hallazgos.length
      ? `<b style="color:var(--rojo-x)">${hallazgos.length} ${hallazgos.length === 1 ? 'hallazgo' : 'hallazgos'} fuera de norma</b>`
      : '<b style="color:var(--verde)">Sin hallazgos fuera de norma</b>';
  }
  if(hallazgos.length) detalle.push(hallazgos.length + ' hallazgos');

  return { total, detalle, pisados };
}

function levantarBiolab(){
  if(solapa !== 'biolab') return;
  CAMPOS_BIOLAB_NUM.forEach(c => { if(document.getElementById(c)) biolab[c] = num(c); });
  CAMPOS_BIOLAB_TXT.forEach(c => { if(document.getElementById(c)) biolab[c] = txt(c); });
}

async function guardarBiolab(){
  levantarBiolab();
  const p = fichaActual.paciente || {};
  const edad = edadDe(p.fecha_nacimiento);
  const peso = Number(nutri.peso_kg) || null;

  // Los calculados se guardan resueltos, para poder comparar entre evaluaciones
  const ent = entradasIshii();
  if(ent.fzAuto  != null) biolab.ishii_fuerza_kg      = Number(ent.fzAuto.toFixed(1));
  if(ent.panAuto != null) biolab.ishii_pantorrilla_cm = Number(ent.panAuto.toFixed(1));
  const ishii = (edad != null && ent.fz && ent.pan)
    ? Number(((0.80 * edad) - (5.09 * ent.fz) - (3.28 * ent.pan) + 206).toFixed(1)) : null;
  const picoTotal = (biolab.imtp_pico_izq_n && biolab.imtp_pico_der_n)
    ? biolab.imtp_pico_izq_n + biolab.imtp_pico_der_n : null;

  const fila = { hc_id: fichaActual.id, editado_en: new Date().toISOString(), editado_por_email: miEmail };
  CAMPOS_BIOLAB_NUM.forEach(c => { fila[c] = biolab[c] ?? null; });
  CAMPOS_BIOLAB_TXT.forEach(c => { fila[c] = biolab[c] || null; });
  fila.vald_profile_id = biolab.vald_profile_id || null;
  fila.vald_traido_en  = biolab.vald_traido_en  || null;
  fila.ishii_score      = ishii;
  fila.fuerza_relativa  = (picoTotal && peso) ? Number((picoTotal / peso).toFixed(2)) : null;
  fila.velocidad_marcha = biolab.marcha_4m_seg ? Number((4 / biolab.marcha_4m_seg).toFixed(2)) : null;
  fila.sppb_total       = (biolab.sppb_balance != null || biolab.sppb_marcha != null || biolab.sppb_chair != null)
    ? (biolab.sppb_balance || 0) + (biolab.sppb_marcha || 0) + (biolab.sppb_chair || 0) : null;
  fila.diagnostico_sarcopenia = biolab.diagnostico_sarcopenia || null;

  const btn = document.getElementById('btn-guardar');
  btn.disabled = true; btn.textContent = 'Guardando…';
  const { error } = await sb.from('hc_sarkmed_biolab').upsert(fila, { onConflict: 'hc_id' });
  btn.disabled = false; btn.textContent = 'Guardar ficha';

  if(error){ toast('No se pudo guardar BiOLAB: ' + error.message, 'err'); return; }
  toast('BiOLAB guardado', 'ok');
  await cargarBiolab(fichaActual.id);
  renderFicha();
}

async function firmarInforme(){
  if(!(biolab.informe || txt('informe'))){ toast('No hay informe para firmar', 'err'); return; }
  if(!confirm('Al firmar, el informe queda cerrado con tu nombre y la fecha, y pasa a la solapa Médica para el informe final del paciente. ¿Firmar?')) return;
  levantarBiolab();
  const { error } = await sb.from('hc_sarkmed_biolab').upsert({
    hc_id: fichaActual.id,
    informe: biolab.informe || null,
    informe_firmado: true,
    firmado_por: miEmail,
    firmado_en: new Date().toISOString(),
    finalizado: true,
    finalizado_en: new Date().toISOString()
  }, { onConflict: 'hc_id' });
  if(error){ toast('No se pudo firmar: ' + error.message, 'err'); return; }
  toast('Informe finalizado · ya lo ve la médica', 'ok');
  await cargarBiolab(fichaActual.id);
  renderFicha();
}

/* ── Adjuntos ───────────────────────────────────────────────────── */
function bloqueAdjuntos(sol, ro, titulo, ayuda){
  return `
  <div class="bloque">
    <div class="bloque-head">${esc(titulo)}</div>
    <div class="bloque-body">
      <div style="font-size:12px;color:var(--muted);margin-bottom:10px">${esc(ayuda)}</div>
      ${ro ? '' : `
      <div class="campo">
        <input type="file" id="archivo-${sol}" accept="image/*,application/pdf" multiple onchange="subirAdjuntos('${sol}', this)">
        <div style="font-size:11.5px;color:var(--muted);margin-top:5px">Podés seleccionar varios archivos de una sola vez.</div>
      </div>`}
      <div id="lista-adjuntos">${listaAdjuntos(sol, ro)}</div>
    </div>
  </div>`;
}

function listaAdjuntos(sol, ro){
  const arch = adjuntos.filter(a => a.solapa === sol);
  if(!arch.length) return '<div style="font-size:12px;color:var(--muted)">Todavía no hay estudios cargados.</div>';
  return arch.map((a, i) => `
    <div style="display:flex;align-items:center;gap:12px;padding:9px 12px;border:1px solid var(--border);
                border-radius:8px;margin-bottom:6px;background:var(--panel-2)">
      <span style="font-size:18px">${(a.tipo || '').startsWith('image/') ? '🖼️' : '📄'}</span>
      <div style="flex:1;min-width:0">
        <div style="font-weight:600;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(a.nombre)}</div>
        <div style="font-size:11px;color:var(--muted)">${fechaLinda((a.subido_en || '').slice(0,10))}${a.tamano ? ' · ' + Math.round(a.tamano/1024) + ' KB' : ''}</div>
      </div>
      <button class="btn" onclick="verAdjunto(${i})">Ver</button>
      ${ro ? '' : `<button class="btn" style="color:var(--rojo-x)" onclick="borrarAdjunto(${i})">Borrar</button>`}
    </div>`).join('');
}

async function cargarAdjuntos(hcId){
  const { data, error } = await sb.from('hc_sarkmed_adjuntos')
    .select('*').eq('hc_id', hcId).order('subido_en', { ascending:false });
  if(error){ console.warn('adjuntos:', error.message); adjuntos = []; return; }
  adjuntos = data || [];
}

async function subirAdjuntos(sol, input){
  const files = Array.from(input.files || []);
  if(!files.length) return;
  const cont = document.getElementById('lista-adjuntos');
  cont.innerHTML = '<div style="font-size:12px;color:var(--muted)">Subiendo…</div>';

  for(const file of files){
    // El nombre se limpia: los acentos y espacios rompen las rutas del bucket.
    const limpio = file.name.normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                            .replace(/[^a-zA-Z0-9._-]/g, '_');
    const path = `${fichaActual.id}/${sol}/${Date.now()}_${limpio}`;
    const { error: eUp } = await sb.storage.from('sarkmed-hc').upload(path, file, { upsert:false });
    if(eUp){ toast('No se pudo subir ' + file.name + ': ' + eUp.message, 'err'); continue; }
    const { error: eIns } = await sb.from('hc_sarkmed_adjuntos').insert({
      hc_id: fichaActual.id, solapa: sol, path, nombre: file.name,
      tipo: file.type || null, tamano: file.size || null, subido_por: miEmail
    });
    if(eIns) toast('Se subió el archivo pero no se pudo anotar: ' + eIns.message, 'err');
  }
  input.value = '';
  await cargarAdjuntos(fichaActual.id);
  renderFicha();
  toast('Estudio cargado', 'ok');
}

async function verAdjunto(i){
  const a = adjuntos.filter(x => x.solapa === solapa)[i];
  if(!a) return;
  // Link firmado: vence en 5 minutos, no queda nada público.
  const { data, error } = await sb.storage.from('sarkmed-hc').createSignedUrl(a.path, 300);
  if(error){ toast('No se pudo abrir: ' + error.message, 'err'); return; }
  window.open(data.signedUrl, '_blank');
}

async function borrarAdjunto(i){
  const a = adjuntos.filter(x => x.solapa === solapa)[i];
  if(!a) return;
  if(!confirm('¿Borrar "' + a.nombre + '"? No se puede deshacer.')) return;
  await sb.storage.from('sarkmed-hc').remove([a.path]);
  const { error } = await sb.from('hc_sarkmed_adjuntos').delete().eq('id', a.id);
  if(error){ toast('No se pudo borrar: ' + error.message, 'err'); return; }
  await cargarAdjuntos(fichaActual.id);
  renderFicha();
  toast('Estudio borrado', 'ok');
}

/* El IMC se calcula, no se escribe. La clasificación OMS queda SUGERIDA:
   la marca definitiva siempre la pone quien evalúa. */
function calcularIMC(){
  const p = Number(v('peso_kg')), t = Number(v('talla_m'));
  const cajaImc = document.getElementById('imc_visible');
  const sug     = document.getElementById('sugerencia-oms');
  if(!cajaImc) return;
  if(!p || !t){ cajaImc.value = ''; if(sug) sug.textContent = ''; return; }
  const imc = p / (t * t);
  if(!isFinite(imc) || imc <= 0 || imc > 100){ cajaImc.value = ''; if(sug) sug.textContent = ''; return; }
  cajaImc.value = imc.toFixed(1);
  const cual = imc < 18.5 ? 'Bajo peso' : imc < 25 ? 'Normopeso' : imc < 30 ? 'Sobrepeso' : 'Obesidad';
  if(sug) sug.textContent = `Con un IMC de ${imc.toFixed(1)} la OMS lo ubica en “${cual}”. Marcalo vos.`;
}

function setNut(campo, valor){
  if(!puedeCargar()) return;
  levantarNutricion();
  nutri[campo] = (nutri[campo] === valor) ? null : valor;   // volver a tocar, destilda
  renderFicha();
}
function togPatron(i){
  if(!puedeCargar()) return;
  levantarNutricion();
  const k = PATRONES[i][0];
  const lista = nutri.patron_alimentario || (nutri.patron_alimentario = []);
  const p = lista.indexOf(k);
  if(p >= 0) lista.splice(p, 1); else lista.push(k);
  renderFicha();
}

async function guardarNutricion(){
  levantarNutricion();
  const p = Number(nutri.peso_kg), t = Number(nutri.talla_m);
  const imc = (p && t) ? Number((p / (t * t)).toFixed(1)) : null;

  const fila = {
    hc_id:              fichaActual.id,
    apetito:            nutri.apetito || null,
    comidas_diarias:    nutri.comidas_diarias || null,
    patron_alimentario: nutri.patron_alimentario || [],
    agua_diaria:        nutri.agua_diaria || null,
    autonomia_cocina:   nutri.autonomia_cocina || null,
    masticacion:        nutri.masticacion || null,
    autopercepcion:     nutri.autopercepcion || null,
    proteina_sugerida:  nutri.proteina_sugerida ?? null,
    proteina_estimada:  nutri.proteina_estimada || null,
    peso_kg:            nutri.peso_kg ?? null,
    talla_m:            nutri.talla_m ?? null,
    imc:                (imc && isFinite(imc) && imc < 100) ? imc : null,
    clasificacion_oms:  nutri.clasificacion_oms || null,
    musculo_kg:         nutri.musculo_kg ?? null,
    musculo_pct:        nutri.musculo_pct ?? null,
    smi:                nutri.smi ?? null,
    musculo_nivel:      nutri.musculo_nivel || null,
    per_biceps_der:     nutri.per_biceps_der ?? null,
    per_biceps_izq:     nutri.per_biceps_izq ?? null,
    per_pantorrilla_der: nutri.per_pantorrilla_der ?? null,
    per_pantorrilla_izq: nutri.per_pantorrilla_izq ?? null,
    observaciones:      nutri.observaciones || null,
    editado_en:         new Date().toISOString(),
    editado_por_email:  miEmail
  };

  const btn = document.getElementById('btn-guardar');
  btn.disabled = true; btn.textContent = 'Guardando…';
  const { error } = await sb.from('hc_sarkmed_nutricion').upsert(fila, { onConflict: 'hc_id' });
  btn.disabled = false; btn.textContent = 'Guardar ficha';

  if(error){ toast('No se pudo guardar Nutrición: ' + error.message, 'err'); return; }
  toast('Nutrición guardada', 'ok');
  await cargarNutricion(fichaActual.id);
  renderFicha();
}

/* ════════════════════════════════════════════════════════════════
   GUARDAR
   ════════════════════════════════════════════════════════════════ */
async function guardarFicha(){
  if(!puedeCargar()){ toast('No tenés permiso para cargar historias', 'err'); return; }
  if(solapa === 'nutricion')     return guardarNutricion();
  if(solapa === 'suelo_pelvico') return guardarSuelo();
  if(solapa === 'biolab')        return guardarBiolab();
  return guardarMedica();
}

async function guardarMedica(){
  guardarAntecedentesEnMemoria();

  // Limpieza: categorías sin nada cargado no se guardan.
  const ant = {};
  Object.entries(fichaActual.antecedentes || {}).forEach(([cat, nodo]) => {
    const marcados = (nodo.marcados || []).filter(Boolean);
    const detalle  = (nodo.detalle || '').trim();
    if(marcados.length || detalle) ant[cat] = { marcados, detalle };
  });

  const fila = {
    motivo_consulta:      txt('motivo_consulta'),
    capacidad_funcional:  txt('capacidad_funcional'),
    aptitud_fisica:       txt('aptitud_fisica'),
    actividad_previa:     txt('actividad_previa'),
    actividad_actual:     txt('actividad_actual'),

    fuma:                 !!fichaActual.fuma,
    cigarrillos_dia:      num('cigarrillos_dia'),
    ex_fumador:           !!fichaActual.ex_fumador,
    edad_cese:            num('edad_cese'),
    alcohol:              !!fichaActual.alcohol,
    alcohol_frecuencia:   txt('alcohol_frecuencia'),
    vapeador:             !!fichaActual.vapeador,
    muchas_horas_sentado: !!fichaActual.muchas_horas_sentado,
    muchas_horas_de_pie:  !!fichaActual.muchas_horas_de_pie,

    medicacion_actual:    txt('medicacion_actual'),
    corticoterapia:       !!fichaActual.corticoterapia,
    cortico_tiempo:       txt('cortico_tiempo'),
    cortico_via:          txt('cortico_via'),
    suplementos:          txt('suplementos'),

    sintoma_perdida_peso: !!fichaActual.sintoma_perdida_peso,
    sintoma_fatiga:       !!fichaActual.sintoma_fatiga,
    sintoma_debilidad:    !!fichaActual.sintoma_debilidad,
    caidas_ultimo_anio:   num('caidas_ultimo_anio'),
    caidas_contexto:      txt('caidas_contexto'),
    charlson_cci:         num('charlson_cci'),

    antecedentes:         ant,
    ortesis:              txt('ortesis'),
    chequeo_medico:       txt('chequeo_medico'),
    consent_datos:        !!fichaActual.consent_datos,
    consent_circuito:     !!fichaActual.consent_circuito,
    estado:               txt('estado') || 'ABIERTA',
    informe_final:        txt('informe_final'),
    sugerencias:          txt('sugerencias'),

    editado_en:           new Date().toISOString(),
    editado_por_email:    miEmail
  };

  const btn = document.getElementById('btn-guardar');
  btn.disabled = true; btn.textContent = 'Guardando…';
  const { error } = await sb.from('hc_sarkmed').update(fila).eq('id', fichaActual.id);
  btn.disabled = false; btn.textContent = 'Guardar ficha';

  if(error){ toast('No se pudo guardar: ' + error.message, 'err'); return; }
  toast('Ficha guardada', 'ok');
  await cargarEvaluaciones();
  fichaActual = evaluaciones.find(e => e.id === fichaActual.id) || fichaActual;
  renderFicha();
}

/* INIT */
(async () => {
  render();                       // primero el cartel de "Cargando historias…"
  await cargarSesionYAccesos();
  await cargarCatalogo();
  await cargarEvaluaciones();
  render();
})();
</script>
