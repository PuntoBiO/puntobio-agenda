    --negro: #111111;
    --gris-oscuro: #1e1e1e;
    --gris-medio: #2d2d2d;
    --gris-borde: #e2e2e0;
    --gris-fondo: #f5f5f3;
    --blanco: #ffffff;
    --texto: #1a1a18;
    --texto-suave: #6b6b65;
    --verde-ok: #22c55e;
    --rojo: #ef4444;
    --amarillo: #f59e0b;
    --radio: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--gris-fondo); color: var(--texto); min-height: 100vh; }
  header {
    background: var(--negro);
    padding: 0 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 60px;
    border-bottom: 2px solid var(--celeste);
  }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-img {
    width: 38px; height: 38px;
    background: var(--logo-bg) center/contain no-repeat;
    flex-shrink: 0;
  }
  .logo-texto { font-size: 18px; font-weight: 600; color: white; letter-spacing: -0.3px; }
  .logo-texto span { color: var(--celeste); }
  .logo-sub { font-size: 10px; color: rgba(255,255,255,0.35); letter-spacing: 0.08em; text-transform: uppercase; }
  .semana-nav {
    display: flex; align-items: center; gap: 10px;
    background: var(--gris-medio);
    padding: 7px 14px; border-radius: var(--radio);
    border: 1px solid rgba(255,255,255,0.08);
  }
  .semana-nav button {
    background: none; border: none; color: var(--celeste);
    font-size: 16px; cursor: pointer; opacity: 0.8; transition: opacity 0.15s;
  }
  .semana-nav button:hover { opacity: 1; }
  .semana-label {
    font-family: 'DM Mono', monospace; font-size: 12px;
    color: rgba(255,255,255,0.8); min-width: 130px; text-align: center;
  }
  .filtros {
    padding: 12px 32px; display: flex; gap: 8px; align-items: center;
    background: var(--blanco); border-bottom: 1px solid var(--gris-borde);
  }
  .filtro-btn {
    padding: 6px 16px; border-radius: 99px;
    border: 1.5px solid var(--gris-borde);
    background: transparent;
    font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500;
    cursor: pointer; transition: all 0.15s; color: var(--texto-suave);
  }
  .filtro-btn:hover { border-color: var(--celeste); color: var(--celeste); }
  .filtro-btn.activo { background: var(--negro); color: white; border-color: var(--negro); }
  .filtro-btn.entrenamiento.activo { background: var(--celeste); border-color: var(--celeste); color: white; }
  .filtro-btn.kinefilaxia.activo { background: #16a34a; border-color: #16a34a; color: white; }
  .contenido { padding: 20px 32px 40px; }
  .dias-tabs {
    display: flex; gap: 3px; margin-bottom: 20px;
    border-bottom: 2px solid var(--gris-borde);
  }
  .dia-tab {
    padding: 10px 18px 12px; border: none; background: none;
    font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500;
    cursor: pointer; color: var(--texto-suave);
    border-bottom: 2px solid transparent; margin-bottom: -2px;
    transition: all 0.15s; border-radius: 6px 6px 0 0; text-align: center;
  }
  .dia-tab:hover { color: var(--texto); background: rgba(30,159,224,0.05); }
  .dia-tab.activo { color: var(--celeste-oscuro); border-bottom-color: var(--celeste); font-weight: 600; }
  .dia-tab .dia-nombre { display: block; }
  .dia-tab .dia-fecha { display: block; font-size: 11px; font-family: 'DM Mono', monospace; color: var(--texto-suave); margin-top: 2px; }
  .dia-tab.hoy .dia-nombre { color: var(--celeste); }
  .dia-tab.hoy .dia-fecha { color: var(--celeste); }
  .dia-tab.hoy.activo { border-bottom-color: var(--celeste); }
  .resumen-top {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 10px; margin-bottom: 20px;
  }
  .resumen-card {
    background: var(--blanco); border: 1px solid var(--gris-borde);
    border-radius: var(--radio); padding: 14px 16px;
  }
  .resumen-card.destacado { border-color: var(--celeste); background: var(--celeste-claro); }
  .resumen-num { font-size: 26px; font-weight: 600; font-family: 'DM Mono', monospace; line-height: 1; margin-bottom: 4px; }
  .resumen-card.destacado .resumen-num { color: var(--celeste-oscuro); }
  .resumen-label { font-size: 12px; color: var(--texto-suave); }
  .turnos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
  .turno-card {
    background: var(--blanco); border-radius: var(--radio);
    border: 1px solid var(--gris-borde); overflow: hidden;
    transition: box-shadow 0.15s, transform 0.15s, border-color 0.15s; cursor: pointer;
  }
  .turno-card:hover {
    box-shadow: 0 4px 20px rgba(30,159,224,0.12);
    transform: translateY(-1px); border-color: var(--celeste-medio);
  }
  .turno-header {
    padding: 12px 14px; display: flex; align-items: center;
    justify-content: space-between; border-bottom: 1px solid var(--gris-borde);
  }

<script>
// =============================================
// CONEXIÓN A SUPABASE
// =============================================
const SUPABASE_URL = 'https://bqpjtoiictnzcasxfucf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_yvuXDxrkRrhXwmZBnE_a_Q_zDBz0iDi';
async function supabaseQuery(tabla, params = '') {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${tabla}${params}`, {
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json'
    }
  });
  if (!res.ok) throw new Error(`Error ${res.status}: ${await res.text()}`);
  return res.json();
}
async function supabaseInsert(tabla, data) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${tabla}`, {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': 'return=minimal'
    },
    body: JSON.stringify(data)
  });
  return res.ok;
}
async function supabaseUpdate(tabla, filtro, data) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${tabla}?${filtro}`, {
    method: 'PATCH',
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': 'return=minimal'
    },
    body: JSON.stringify(data)
  });
  return res.ok;
}
// Cache de datos
let HORARIOS = [];
let ALUMNOS_POR_TURNO = {};
let cargando = false;
async function cargarDatos() {
  if (cargando) return;
  cargando = true;
  mostrarCargando(true);
  try {
    // Cargar turnos
    const turnos = await supabaseQuery('turnos', '?select=*&order=dia,hora,servicio');
    
    // Cargar profes por turno
    const profes = await supabaseQuery('turno_profes', '?select=*');
    const mapaProfe = {};
    profes.forEach(p => {
      if (!mapaProfe[p.turno_id]) mapaProfe[p.turno_id] = [];
      mapaProfe[p.turno_id].push(p.nombre_profe);
    });
    HORARIOS = turnos.map(t => ({
      id: t.id,
      dia: t.dia,
      hora: t.hora,
      servicio: t.servicio,
      capacidad: t.capacidad,
      profes: mapaProfe[t.id] || []
    }));
    // Cargar alumnos por turno
    const alumnosTurno = await supabaseQuery('turno_alumnos', '?select=turno_id,persona_id,personas(id,nombre)&activo=eq.true');
    
    ALUMNOS_POR_TURNO = {};
    alumnosTurno.forEach(at => {
      const turno = HORARIOS.find(t => t.id === at.turno_id);
      if (!turno) return;
      const key = `${turno.dia}-${turno.hora}-${turno.servicio}`;
      if (!ALUMNOS_POR_TURNO[key]) ALUMNOS_POR_TURNO[key] = [];
      ALUMNOS_POR_TURNO[key].push({
        id: String(at.personas.id),
        nombre: at.personas.nombre,
        estado: 'reservado'
      });
    });
    renderDiasTabs();
    renderTurnos();
  } catch(err) {
    console.error('Error cargando datos:', err);
    document.getElementById('turnos-grid').innerHTML = 
      '<div class="sin-turnos">Error conectando a la base de datos. Recargá la página.</div>';
  } finally {
    cargando = false;
    mostrarCargando(false);
  }
}
function mostrarCargando(activo) {
  const grid = document.getElementById('turnos-grid');
  if (activo) {
    grid.innerHTML = '<div class="sin-turnos" style="color:var(--celeste)">⟳ Cargando datos...</div>';
  }
}
const DIAS = ['Lunes','Martes','Miércoles','Jueves','Viernes'];
let diaActivo = '';
let filtroActivo = 'todos';
let offsetSemana = 0;
function getLunes(offset) {
  const hoy = new Date();
  const dia = hoy.getDay();
  const diff = dia === 0 ? -6 : 1 - dia;
  const lunes = new Date(hoy);
  lunes.setDate(hoy.getDate() + diff + offset * 7);
  lunes.setHours(0,0,0,0);
  return lunes;
}
function formatFecha(f) {
  return f.toLocaleDateString('es-AR', {day:'2-digit', month:'2-digit'});
}
function getDiaFecha(idx, lunes) {
  const f = new Date(lunes);
  f.setDate(lunes.getDate() + idx);
  return f;
}
function esHoy(fecha) {
  const h = new Date();
  return fecha.getDate()===h.getDate() && fecha.getMonth()===h.getMonth() && fecha.getFullYear()===h.getFullYear();
}
function actualizarSemanaLabel() {
  const lunes = getLunes(offsetSemana);
  const viernes = new Date(lunes);
  viernes.setDate(lunes.getDate() + 4);
  document.getElementById('semana-label').textContent = formatFecha(lunes) + ' — ' + formatFecha(viernes);
}
function cambiarSemana(delta) {
  offsetSemana += delta;
  actualizarSemanaLabel();
  renderDiasTabs();
  renderTurnos();
}
function renderDiasTabs() {
  const lunes = getLunes(offsetSemana);
  const container = document.getElementById('dias-tabs');
  container.innerHTML = '';
  DIAS.forEach((dia, i) => {
    const fecha = getDiaFecha(i, lunes);
    const hoy = esHoy(fecha);
    const btn = document.createElement('button');
    btn.className = 'dia-tab' + (dia===diaActivo?' activo':'') + (hoy?' hoy':'');
    btn.innerHTML = `<span class="dia-nombre">${dia}</span><span class="dia-fecha">${formatFecha(fecha)}</span>`;
    btn.onclick = () => seleccionarDia(dia);
    container.appendChild(btn);
  });
}
function seleccionarDia(dia) {
  diaActivo = dia;
  renderDiasTabs();
  renderTurnos();
}
function getTurnosDia() {
  return HORARIOS.filter(t => {
    if (t.dia !== diaActivo) return false;
    if (filtroActivo !== 'todos' && t.servicio !== filtroActivo) return false;
    return true;
  }).sort((a,b) => {
    const ha = parseInt(a.hora.replace(':',''));
    const hb = parseInt(b.hora.replace(':',''));
    return ha !== hb ? ha - hb : a.servicio.localeCompare(b.servicio);
  });
}
function getAlumnos(t) {
  return ALUMNOS_POR_TURNO[`${t.dia}-${t.hora}-${t.servicio}`] || [];
}
function renderResumen() {
  const turnos = getTurnosDia();
  const totalCap = turnos.reduce((s,t)=>s+t.capacidad,0);
  const totalOcup = turnos.reduce((s,t)=>s+getAlumnos(t).length,0);
  const pct = totalCap > 0 ? Math.round(totalOcup/totalCap*100) : 0;
  document.getElementById('resumen-top').innerHTML = `
    <div class="resumen-card"><div class="resumen-num">${turnos.length}</div><div class="resumen-label">Turnos del día</div></div>
    <div class="resumen-card destacado"><div class="resumen-num">${totalOcup}</div><div class="resumen-label">Alumnos anotados</div></div>
    <div class="resumen-card"><div class="resumen-num">${totalCap-totalOcup}</div><div class="resumen-label">Lugares libres</div></div>
    <div class="resumen-card"><div class="resumen-num">${pct}%</div><div class="resumen-label">Ocupación</div></div>
  `;
}
function renderTurnos() {
  renderResumen();
  const turnos = getTurnosDia();
  const container = document.getElementById('turnos-grid');
  if (!diaActivo) {
    container.innerHTML = '<div class="sin-turnos">Seleccioná un día para ver los turnos</div>';
    return;
  }
  if (!turnos.length) {
    container.innerHTML = '<div class="sin-turnos">No hay turnos para este filtro</div>';
    return;
  }
  container.innerHTML = turnos.map(t => {
    const alumnos = getAlumnos(t);
    const ocup = alumnos.length;
    const pct = Math.round(ocup/t.capacidad*100);
    const colorFill = pct>=100?'fill-rojo':pct>=75?'fill-amarillo':'fill-celeste';
    const colorTexto = pct>=100?'var(--rojo)':pct>=75?'var(--amarillo)':'var(--celeste-oscuro)';
    const tipoClass = t.servicio==='Entrenamiento'?'tipo-entrenamiento':'tipo-kinefilaxia';
    const libres = t.capacidad - ocup;
    return `
      <div class="turno-card" onclick="abrirModal('${t.dia}','${t.hora}','${t.servicio}')">
        <div class="turno-header">
          <span class="turno-hora">${t.hora}</span>
          <span class="turno-tipo ${tipoClass}">${t.servicio}</span>
        </div>
        <div class="turno-body">
          <div class="turno-profes">${t.profes.map(p=>`<span class="profe-tag">${p}</span>`).join('')}</div>
          <div class="turno-ocupacion">
            <div class="ocupacion-barra"><div class="ocupacion-fill ${colorFill}" style="width:${Math.min(pct,100)}%"></div></div>
            <span class="ocupacion-texto" style="color:${colorTexto}">${ocup}/${t.capacidad}</span>
          </div>
        </div>
        <div class="turno-footer">
          <span>${libres} lugar${libres!==1?'es':''} libre${libres!==1?'s':''}</span>
          <button class="btn-ver" onclick="event.stopPropagation();abrirModal('${t.dia}','${t.hora}','${t.servicio}')">Ver lista</button>
        </div>
      </div>
    `;
  }).join('');
}
// Estado de asistencia en memoria (key: dia-hora-servicio-id)
const asistenciaEstados = {};
const asistenciaMotivos = {};
function getEstadoAlumno(dia, hora, servicio, id) {
  const key = `${dia}-${hora}-${servicio}-${id}`;
  return asistenciaEstados[key] || 'reservado';
}
function toggleEstado(dia, hora, servicio, id, nuevoEstado) {
  const key = `${dia}-${hora}-${servicio}-${id}`;
  const actual = asistenciaEstados[key] || 'reservado';
  if (nuevoEstado === 'ausente') {
    if (actual === 'ausente' || actual === 'ausente-justificada') {
      // Ya estaba ausente → vuelve a reservado
      asistenciaEstados[key] = 'reservado';
      delete asistenciaMotivos[key];
      renderModalBody(dia, hora, servicio);
      renderTurnos();
    } else {
      // Abrir cartel de justificación
      const alumnos = getAlumnos({dia, hora, servicio});
      const alumno = alumnos.find(a => a.id === id);
      abrirJustif(dia, hora, servicio, id, alumno ? alumno.nombre : id);
    }
    return;
  }
  asistenciaEstados[key] = actual === nuevoEstado ? 'reservado' : nuevoEstado;
  renderModalBody(dia, hora, servicio);
  renderTurnos();
}
function renderModalBody(dia, hora, servicio) {
  const t = HORARIOS.find(x=>x.dia===dia&&x.hora===hora&&x.servicio===servicio);
  if (!t) return;
  const alumnos = getAlumnos(t);
  const ocup = alumnos.length;
  const pct = Math.round(ocup/t.capacidad*100);
  const colorOcup = pct>=100?'var(--rojo)':pct>=75?'var(--amarillo)':'var(--celeste)';
  const tipoClass = servicio==='Entrenamiento'?'tipo-entrenamiento':'tipo-kinefilaxia';
  const presentes = alumnos.filter(a=>getEstadoAlumno(dia,hora,servicio,a.id)==='presente').length;
  const ausentesJust = alumnos.filter(a=>getEstadoAlumno(dia,hora,servicio,a.id)==='ausente-justificada').length;
  const ausentesSinJust = alumnos.filter(a=>getEstadoAlumno(dia,hora,servicio,a.id)==='ausente').length;
  const ausentes = ausentesJust + ausentesSinJust;
  const pendientes = alumnos.length - presentes - ausentes;
  document.getElementById('modal-titulo').textContent = `${servicio} · ${hora}`;
  document.getElementById('modal-subtitulo').textContent = dia;
  document.getElementById('modal-body').innerHTML = `
    <div class="modal-chips">
      <span class="turno-tipo ${tipoClass}">${servicio}</span>
      ${t.profes.map(p=>`<span class="modal-chip">${p}</span>`).join('')}
      <span class="modal-chip">Cap. ${t.capacidad}</span>
    </div>
    <div class="ocupacion-grande" style="color:${colorOcup}">${ocup}<span style="font-size:16px;color:var(--texto-suave)">/${t.capacidad}</span></div>
    <div class="resumen-asistencia">
      <span class="res-presente">✓ ${presentes} presentes</span>
      <span class="res-ausente">✗ ${ausentesSinJust} ausentes</span>
      ${ausentesJust > 0 ? `<span style="color:#16a34a">✓ ${ausentesJust} justif.</span>` : ''}
      <span class="res-pendiente">○ ${pendientes} sin marcar</span>
    </div>
    <div class="alumnos-titulo">Lista de alumnos — marcá asistencia</div>
    ${alumnos.length===0
      ? '<div style="color:var(--texto-suave);font-size:13px;padding:8px 0">Sin alumnos anotados</div>'
      : alumnos.map(a => {
          const est = getEstadoAlumno(dia,hora,servicio,a.id);
          const esAusente = est==='ausente' || est==='ausente-justificada';
          const motivo = asistenciaMotivos[`${dia}-${hora}-${servicio}-${a.id}`] || '';
          return `
          <div class="alumno-item" style="background:${est==='presente'?'#f0fdf4':esAusente?'#fef2f2':'transparent'}">
            <div>
              <div class="alumno-nombre">${a.nombre}</div>
              <div class="alumno-id">#${a.id}${est==='ausente-justificada'?' · <span style="color:#16a34a;font-size:11px">justificada</span>':est==='ausente'?' · <span style="color:#dc2626;font-size:11px">sin justificar</span>':''}</div>
              ${motivo ? `<div style="font-size:11px;color:var(--texto-suave);margin-top:2px">${motivo}</div>` : ''}
            </div>
            <div class="alumno-acciones">
              <button class="btn-asistencia btn-presente ${est==='presente'?'activo':''}"
                onclick="toggleEstado('${dia}','${hora}','${servicio}','${a.id}','presente')"
                title="Marcar presente">✓</button>
              <button class="btn-asistencia btn-ausente ${esAusente?'activo':''}"
                onclick="toggleEstado('${dia}','${hora}','${servicio}','${a.id}','ausente')"
                title="Marcar ausente">✗</button>
            </div>
          </div>`;
        }).join('')
    }
  `;
}
function abrirModal(dia, hora, servicio) {
  document.getElementById('modal-overlay').classList.add('activo');
  renderModalBody(dia, hora, servicio);
}
function cerrarModal(e) { if (e.target===document.getElementById('modal-overlay')) cerrarModalBtn(); }
function cerrarModalBtn() { document.getElementById('modal-overlay').classList.remove('activo'); }
function filtrar(tipo, btn) {
  filtroActivo = tipo;
  document.querySelectorAll('.filtro-btn').forEach(b=>b.classList.remove('activo'));
  btn.classList.add('activo');
  renderTurnos();
}
// Justificación de ausencias
let justifDia = '', justifHora = '', justifServicio = '', justifId = '', justifNombreAlumno = '';
let justifSeleccion = '';
function abrirJustif(dia, hora, servicio, id, nombre) {
  justifDia = dia; justifHora = hora; justifServicio = servicio;
  justifId = id; justifNombreAlumno = nombre;
  justifSeleccion = '';
  document.getElementById('justif-nombre').textContent = nombre;
  document.getElementById('justif-si').className = 'justif-opcion';
  document.getElementById('justif-no').className = 'justif-opcion';
  document.getElementById('justif-motivo').value = '';
  document.getElementById('justif-motivo').className = 'justif-motivo';
  document.getElementById('justif-overlay').classList.add('activo');
}
function seleccionarJustif(opcion) {
  justifSeleccion = opcion;
  document.getElementById('justif-si').className = 'justif-opcion' + (opcion==='si'?' seleccionado-si':'');
  document.getElementById('justif-no').className = 'justif-opcion' + (opcion==='no'?' seleccionado-no':'');
  document.getElementById('justif-motivo').className = 'justif-motivo visible';
}
function cancelarJustif() {
  document.getElementById('justif-overlay').classList.remove('activo');
}
function confirmarJustif() {
  if (!justifSeleccion) {
    document.getElementById('justif-si').style.borderColor = 'var(--rojo)';
    return;
  }
  const key = `${justifDia}-${justifHora}-${justifServicio}-${justifId}`;
  const motivo = document.getElementById('justif-motivo').value.trim();
  asistenciaEstados[key] = justifSeleccion === 'si' ? 'ausente-justificada' : 'ausente';
  if (motivo) asistenciaMotivos[key] = motivo;
  document.getElementById('justif-overlay').classList.remove('activo');
  renderModalBody(justifDia, justifHora, justifServicio);
  renderTurnos();
}
// =============================================
// AUTENTICACIÓN
// =============================================
let sesionActiva = false;
async function verificarSesion() {
  try {
    const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${obtenerToken()}`
      }
    });
    if (res.ok) {
      sesionActiva = true;
      document.getElementById('login-overlay').classList.add('oculto');
      cargarDatos();
    } else {
      document.getElementById('login-overlay').classList.remove('oculto');
    }
  } catch(e) {
    document.getElementById('login-overlay').classList.remove('oculto');
  }
}
function obtenerToken() {
  return sessionStorage.getItem('pb_token') || '';
}
function guardarToken(token) {
  sessionStorage.setItem('pb_token', token);
}
async function hacerLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-pass').value;
  const btn = document.getElementById('login-btn');
  const error = document.getElementById('login-error');
  if (!email || !pass) return;
  btn.disabled = true;
  btn.textContent = 'Ingresando...';
  error.classList.remove('visible');
  try {
    const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ email, password: pass })
    });
    const data = await res.json();
    if (res.ok && data.access_token) {
      guardarToken(data.access_token);
      sesionActiva = true;
      document.getElementById('login-overlay').classList.add('oculto');
      cargarDatos();
    } else {
      error.classList.add('visible');
    }
  } catch(e) {
    error.classList.add('visible');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Ingresar';
  }
}
function init() {
  const hoy = new Date().getDay();
  const diasMap = {1:'Lunes',2:'Martes',3:'Miércoles',4:'Jueves',5:'Viernes'};
  diaActivo = diasMap[hoy] || 'Lunes';
  actualizarSemanaLabel();
  renderDiasTabs();
  verificarSesion();
}
init();
</script>
